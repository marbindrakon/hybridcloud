{{- /*
shc (design/P7-PLAN.md P7.1 §3.2, P7.3 §12.4 d): a platform IaaS cluster's credentials for the EDA jobs.
Two accounts per cluster in .Values.iaasClusters, each rendered when its block is enabled:
  cloudInfra    shc-cloudinfra -> central Vault cloudinfra/<cluster>         site probe, read only
  fabricAccess  shc-automation -> central Vault cloudinfra/<cluster>-fabric  the platform automation account: fabric
                                                                              jobs (CUDN, RouteAdvertisements, VTEP,
                                                                              tenant VM namespaces + RBAC); the
                                                                              admission policies exempt its username
  (<block>.serviceAccount overrides the name; it was shc-fabric before the automation account was introduced)
Per account: ManagedServiceAccount, ClusterPermission (<block>.rules) and PushSecret, rendered by the helper
sovereign-central.managedAccount (_helpers.tpl). <block>.pushDeletionPolicy (default Delete) is the PushSecret's
deletionPolicy: None keeps the Vault key when the PushSecret goes (an account rename).
*/}}
{{- if include "sovereign-central.applicationsEnabled" . }}
{{- range $name, $cluster := .Values.iaasClusters }}
{{- $c := mergeOverwrite (deepCopy $.Values.iaasClusterDefaults) (deepCopy $cluster) }}
{{- range $acc := list (dict "key" "cloudInfra" "sa" "shc-cloudinfra" "suffix" "") (dict "key" "fabricAccess" "sa" "shc-automation" "suffix" "-fabric") }}
{{- $ci := get $c $acc.key | default dict }}
{{- if and $c.enabled $ci.enabled }}
{{- $sa := $ci.serviceAccount | default $acc.sa }}
{{- $server := $ci.apiServer | default (printf "https://api.%s.%s:6443" $name $c.clusterBase.values.cluster.baseDomain) }}
{{ include "sovereign-central.managedAccount" (dict "root" $ "cluster" $name "sa" $sa "wave" $c.syncWaves.base
     "tokenValidity" $ci.tokenValidity "rules" $ci.rules "server" $server
     "vaultKey" (printf "cloudinfra/%s%s" $name $acc.suffix) "deletionPolicy" $ci.pushDeletionPolicy) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
