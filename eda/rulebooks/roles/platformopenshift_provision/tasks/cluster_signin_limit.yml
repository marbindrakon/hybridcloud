---
# Only the cluster's people can sign in to its sign-in client (files/cluster_signin.py ensure): the client's groups
# claim holds its own roles only, every access-group role of the client holds the client's role sign-in, and the
# client's browser flow denies whoever lacks sign-in. Runs after cluster_signin_groups.yml (csg_wanted) and before
# the cluster is given the identity provider: a cluster whose limit is not in place is not connected to the
# directory (the job fails with the step's sentence).
# Flows are a realm setting: they need the realm's automation client of purpose flows (realm-management role
# manage-realm, published by the RbacConfig in central Vault <keycloak_automation_vault_prefix>/<rbacconfig> as
# flowsClientId / flowsClientSecret); the client's roles and mapper use the clients token of keycloak_admin_session.yml.
# Inputs: kc_base_url, kc_admin_token, keycloak_realm, ocp_oidc_client_id, csg_wanted, csg_entity, cluster_cr_name
# (or cluster_name), cluster_namespace. With csl_action remove (the teardown): the cluster's flows go (by alias and
# the cluster's mark). Sets csl_result.
- name: The realm token for sign-in flows
  ansible.builtin.include_tasks: "{{ role_path }}/../platformopenshift_provision/tasks/cluster_flows_token.yml"

- name: "Sign-in to the cluster: the helper"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../platformopenshift_provision/files/cluster_signin.py"
    stdin: >-
      {{ {'action': csl_action | default('ensure'), 'url': kc_base_url, 'realm': keycloak_realm,
          'clientsToken': kc_admin_token | default(''), 'flowsToken': csl_flows_token,
          'clientId': ocp_oidc_client_id, 'wanted': csg_wanted | default([]),
          'mark': cluster_namespace ~ '/' ~ (cluster_cr_name | default(cluster_name, true)),
          'cluster': cluster_cr_name | default(cluster_name, true), 'tenant': csg_entity | default('')} | to_json }}
  register: _csl_call
  changed_when: false
  failed_when: false
  # the request carries the tokens
  no_log: true

- name: "Sign-in to the cluster: the answer"
  ansible.builtin.set_fact:
    csl_flows_token: ""
    csl_result: >-
      {{ (_csl_call.stdout | from_json) if (_csl_call.stdout | default('') | trim).startswith('{')
         else {'error': 'the helper gave no answer (rc ' ~ _csl_call.rc ~ ')'} }}

- name: "Sign-in to the cluster: what the helper said, for the job's log"
  ansible.builtin.debug:
    msg: >-
      PlatformOpenshift {{ cluster_cr_name | default(cluster_name, true) }}: sign-in
      {{ csl_result.error | default(csl_result.message | default('', true)) or (csl_result.changed | default(csl_result.removed | default([])) | join(', ')) or 'unchanged' }}

- name: "Sign-in to the cluster: fail when the limit could not be set"
  ansible.builtin.fail:
    msg: "{{ shc_step | hybridsovereign.shc.shc_step_failed(shc_step_what | default('provisioning', true)) }}"
  vars:
    shc_step: "Limit who can sign in to the cluster"
  when: not (csl_result.ok | default(false) | bool)
