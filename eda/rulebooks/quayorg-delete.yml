---
- name: QuayOrg Delete Rulebook
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: "{{ KAFKA_HOST }}"
        port: "{{ KAFKA_PORT }}"
        topic: hybridsovereign-events
        group_id: eda-quayorg-delete
        security_protocol: SASL_SSL
        sasl_mechanism: SCRAM-SHA-512
        sasl_plain_username: "{{ KAFKA_USERNAME }}"
        sasl_plain_password: "{{ KAFKA_PASSWORD }}"
        check_hostname: true
        verify_mode: CERT_REQUIRED
  rules:
    - name: Handle QuayOrg Delete
      condition: event.body.payload.reason in ["QuayOrgDeleteRequested"] and event.body.payload.regarding.kind == "QuayOrg"
      action:
        run_job_template:
          name: quayorg-teardown
          organization: sovereign
          job_args:
            extra_vars:
              event_payload: "{{ event.body.payload }}"
