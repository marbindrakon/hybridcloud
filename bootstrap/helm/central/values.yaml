  values:
    namespace: rhacs-operator
    central:
      enabled: false
    consolePlugin:
      enabled: true

# ─── Vault Central ───────────────────────────────────────────────────────────
vault:
  enabled: true
  chartVersion: "0.6.11"
  syncWave: "15"
  destinationNamespace: central-vault
  values:
    namespace: central-vault
    pushSecretToVault: false
    vault:
      global:
        openshift: true
        imagePullSecrets:
          - name: quay-pull-secret
      server:
        standalone:
          enabled: false
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
              }
              # shc (LAB-PLAN D7): auto-unseal against the lab Vault transit engine. Unseal-only:
              # the token (Secret vault-transit-token, periodic, policy shc-central-unseal) can only
              # encrypt/decrypt with this key. Recovery keys from init are kept offline.
              seal "transit" {
                address         = "https://vault.lab.signal9.gg"
                mount_path      = "lab/shc-transit/"
                key_name        = "shc-central-unseal"
                disable_renewal = "false"
              }
              service_registration "kubernetes" {}
        # shc: transit seal token (VAULT_TOKEN is read by the seal; jobs use explicit X-Vault-Token)
        extraSecretEnvironmentVars:
          - envName: VAULT_TOKEN
            secretName: vault-transit-token
            secretKey: token
        dataStorage:
          enabled: true
          size: 10Gi
        route:
          enabled: true
          host: vault-central.apps.central.shc.signal9.gg
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        image:
          repository: quay.signal9.gg/shc/vault
          tag: "1.21.2"
      ui:
        enabled: true
      injector:
        enabled: true
        image:
          repository: quay.signal9.gg/shc/vault-k8s
          tag: "1.5.0"

# ─── Vault Services ─────────────────────────────────────────────────────────
vaultServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.6.11"
  syncWave: "15"
  destinationNamespace: services-vault
  values:
    namespace: services-vault
    pushSecretToVault: false
    ociCredentials:
      enabled: true
      vaultPath: "oci-credentials"
      secretStoreName: "vault-backend"
      secretStoreKind: "ClusterSecretStore"
    vault:
      global:
        openshift: true
        imagePullSecrets:
          - name: quay-pull-secret
      server:
        standalone:
          enabled: false
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
                retry_join {
                  leader_api_addr = "http://vault-services-0.vault-services-internal.services-vault.svc:8200"
                }
                retry_join {
                  leader_api_addr = "http://vault-services-1.vault-services-internal.services-vault.svc:8200"
                }
                retry_join {
                  leader_api_addr = "http://vault-services-2.vault-services-internal.services-vault.svc:8200"
                }
              }
              service_registration "kubernetes" {}
              # shc (LAB-PLAN D7): auto-unseal against the lab Vault transit engine, key
              # shc-services-unseal (token in Secret vault-transit-token, encrypt/decrypt only).
              seal "transit" {
                address         = "https://vault.lab.signal9.gg"
                mount_path      = "lab/shc-transit/"
                key_name        = "shc-services-unseal"
                disable_renewal = "false"
              }
        # shc: transit seal token (VAULT_TOKEN is read by the seal; jobs use explicit X-Vault-Token)
        extraSecretEnvironmentVars:
          - envName: VAULT_TOKEN
            secretName: vault-transit-token
            secretKey: token
        dataStorage:
          enabled: true
          size: 10Gi
        route:
          enabled: true
          host: vault-services.apps.services.shc.signal9.gg
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        image:
          repository: quay.signal9.gg/shc/vault
          tag: "1.21.2"
        readinessProbe:
          enabled: true
          path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      ui:
        enabled: true
      injector:
        enabled: true
        image:
          repository: quay.signal9.gg/shc/vault-k8s
          tag: "1.5.0"

# ─── Vault Services Init (separate App to avoid StatefulSet health deadlock) ─
vaultServicesInit:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.2.3-shc.1"
  syncWave: "20"
  values:
    namespace: services-vault
    serviceAccount: vault-init-runner
    image: "quay.signal9.gg/shc/ansible-runner:latest"
    imagePullSecretName: "quay-pull-secret"
    secretName: "vault-services-init-secrets"
    vaultAddr: "http://vault-services-0.vault-services-internal.services-vault.svc:8200"
    vaultNamespace: "services-vault"
    activeDeadlineSeconds: 600
    backoffLimit: 5
    pushSecretToVaultCentral: true
    pushSecretStoreName: "vault-backend"
    vaultCentralPath: "vault-services-init"
    pushUnsealKeys: false  # shc: transit seal, no unseal keys (LAB-PLAN §7.6)

# ─── RHACM ───────────────────────────────────────────────────────────────────
rhacm:
  enabled: true
  chartVersion: "0.5.1-shc.2"  # shc: + AgentServiceConfig + Provisioning (LAB-PLAN §7.4), assisted-service env overrides (P6)
  enableMultiClusterHub: true
  destinationNamespace: open-cluster-management
  syncWave: "10"
  values:
    operator:
      channel: "release-2.17"  # shc: D13
      installPlanApproval: Automatic
    multiClusterHub:
      enabled: true
      availabilityConfig: High
      disableHubSelfManagement: false
      components:
        console: true
        search: true
        cluster-lifecycle: true
        volsync: false
        cluster-backup: false
    # shc (D19): CIM for mce-cluster-build agent clusters; storage on the default SC (ODF external)
    agentServiceConfig:
      enabled: true
      # shc (P6): two-node OpenShift with fencing (edge1) through the agent path. MCE 2.17.3's
      # assisted-service rejects per-Agent fencing credentials ("TNF clusters support is disabled")
      # unless this flag is set.
      serviceEnv:
        TNF_CLUSTERS_SUPPORT: "true"
      # shc (D13, §7 item 4): MCE 2.17.3's built-in list maps 4.22 to a pre-release RHCOS
      # (4.22.0-ec.5). Pin the discovery OS to the GA boot image of the 4.22 installer in use
      # (openshift-install 4.22.16 `coreos print-stream-json`). Replaces the whole built-in list.
      osImages:
        - openshiftVersion: "4.22"
          version: "9.8.20260715-1"
          cpuArchitecture: x86_64
          url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-9.8/builds/9.8.20260715-1/x86_64/rhcos-9.8.20260715-1-live-iso.x86_64.iso
    # shc (§4): metal3 Managed provisioning network on VLAN 231 via the masters' second NIC
    provisioning:
      enabled: true
      network: Managed
      ip: "172.18.231.3"
      networkCIDR: "172.18.231.0/24"
      dhcpRange: "172.18.231.20,172.18.231.199"
      macAddresses:
        - "fa:16:3e:87:83:fa"  # central-0-prov
        - "fa:16:3e:e5:54:08"  # central-1-prov
        - "fa:16:3e:0d:d1:dc"  # central-2-prov
      watchAllNamespaces: true

# ─── shc: cluster OIDC issuer (LAB-PLAN D17/§9) ──────────────────────────────
oidcIssuer:
  enabled: true
  chartVersion: "0.1.3"
  syncWave: "8"
  values:
    host: oidc.shc.signal9.gg
    baseURL: https://oidc.shc.signal9.gg
    namespace: shc-oidc
    sync:
      clusters:
        - name: central
          source: local
        # spokes through ACM (ManagedServiceAccount + cluster-proxy); each gets its issuer at install
        - name: services
          source: acm
        - name: iaas1
          source: acm
        - name: edge1
          source: acm

# ─── shc: bare-metal node inventory (LAB-PLAN D19, §7 item 3) ───────────────────────────────
# charts/charts/metal-node-assignment on central: BareMetalHosts (ipmi://, legacy boot, converged
# flow), BMC credentials from central Vault (metal/bmc-sl230, p2/bootstrap.sh seed-metal) and the
# shared late-binding InfraEnv metal-infra-env. iaas1 blades 1-4, 6, 7; edge1 blades 5, 8 (P6, two-node
# with fencing: per-node Redfish fencing Secrets). Generated by the lab
# workspace's p3/gen-metal-values.py; every MAC verified from the Agent inventories (NetBox had blade 1
# and 3 Port2 wrong, signal9-lab-gitops the 40G MACs). VLAN 233 .10+N at MTU 9000 (HSC SVI 9000), VLAN 11 .210+N, iLO 172.18.2.30+N.
metalNodes:
  enabled: true
  chartVersion: "0.1.1"
  syncWave: "12"
  namespace: metal-infra-env
  values:
    secretStoreName: vault-backend
    bmcDefaults:
      externalSecret:
        vaultName: metal/bmc-sl230
        usernameKey: username
        passwordKey: password
    infraEnvs:
    - name: metal-infra-env
      namespace: metal-infra-env
      pullSecretVault: metal/pull-secret
      sshAuthorizedKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIV2XhtthRYpWXMsQ31Im40+UHcYUGv0HA3NlJ86Iwbw shc-central-core
      ntpSources:
      - 172.18.42.20
      - 172.18.0.79
      kernelArguments:
      - console=tty0
      - console=ttyS1,115200n8
    assignments:
    - node: sl230-blade1
      namespace: metal-infra-env
      assignmentType: agent
      infraEnvName: metal-infra-env
    - node: sl230-blade2
      namespace: metal-infra-env
      assignmentType: agent
      infraEnvName: metal-infra-env
    - node: sl230-blade3
      namespace: metal-infra-env
      assignmentType: agent
      infraEnvName: metal-infra-env
    - node: sl230-blade4
