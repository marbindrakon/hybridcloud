apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudosos.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "3"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudOSO
    listKind: CloudOSOList
    plural: cloudosos
    singular: cloudoso
    shortNames:
      - osenv
    categories:
      - shc
      - shc-tenant
      - shc-environment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An OpenStack environment: the tenant's project on a platform OpenStack site, comparable
            to an OpenStack project with its quota, an AWS account in one Region or a Google Cloud
            project. The platform creates the project on the site named by spec.cloudRef, a
            credential for it, and the environment's DNS zone <environment>.<tenant>.<tenant DNS
            domain>. With cloudRef set, the site supplies every site setting and the legacy fields
            below have no effect.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The environment.
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                cloudRef:
                  type: object
                  description: >-
                    The platform CloudInfrastructure (type openstack, namespace sovereign-cloud) the project is
                    created on. It supplies the infrastructure credential and every site setting (projectDomain,
                    externalNetwork, DNS, region); with a cloudRef in effect those spec fields below are ignored.
                    Default: the installation's default site. Immutable once set.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.cloudRef is immutable
                  properties:
                    name:
                      description: Name of the OpenStack site (CloudInfrastructure).
                      type: string
                      maxLength: 253
                project:
                  type: string
                  description: Name hint for the OpenStack project. Required.
                vaultPath:
                  type: string
                  description: >-
                    Legacy, ignored when cloudRef is set. Set by the platform; leave unset. Requests
                    from tenant users that set or change it are refused, or accepted with a warning,
                    depending on the platform's admission settings.
                baseDomain:
                  type: string
                  description: >-
                    Base DNS domain. With Designate the environment gets <name>.<entity>.<baseDomain>
                    inside the zone designateZoneId. Ignored with a cloudRef in effect. Default: the installation default.
                projectDomain:
                  type: string
                  description: "Keystone domain for the project. Ignored with a cloudRef in effect. Default: the installation default."
                externalNetwork:
                  type: string
                  description: "External Neutron network for the floating IPs. Ignored with a cloudRef in effect. Default: the installation default."
                regionName:
                  type: string
                  description: "OpenStack region. Default: the account's clouds.yaml region."
                dnsProvider:
                  type: string
                  description: >-
                    DNS for the environment's clusters: designate (designateZoneId + designateProjectId)
                    or route53 (route53VaultPath). Ignored with a cloudRef in effect. Default: the installation default, else
                    designate when designateZoneId is set.
                  enum: [designate, route53, none]
                route53VaultPath:
                  type: string
                  description: >-
                    Legacy, ignored when cloudRef is set. Set by the platform; leave unset. Requests
                    from tenant users that set or change it are refused, or accepted with a warning,
                    depending on the platform's admission settings.
                landingzone:
                  type: string
                  description: No effect.
                  default: default
                designateZoneId:
                  type: string
                  description: "Designate zone id for the environment's records. Ignored with a cloudRef in effect. Default: the installation default."
                designateProjectId:
                  type: string
                  description: >-
                    Project owning the Designate zone (the account needs member there). Default: the
                    installation default. Ignored with a cloudRef in effect.
                enableVRF:
                  type: boolean
                  description: No effect.
                  default: false
                vrfId:
                  type: string
                  description: No effect.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the environment.
                  type: string
                namespace:
                  description: Namespace of the environment.
                  type: string
                entity:
                  description: The tenant this environment belongs to.
                  type: string
                slug:
                  description: Short unique name of the environment, used in DNS names.
                  type: string
                domain:
                  description: DNS zone of the environment.
                  type: string
                route53ZoneId:
                  description: Hosted zone of the environment when its DNS is on Route 53.
                  type: string
                apiVIP:
                  description: Floating IP reserved for the API of a cluster in this environment.
                  type: string
                ingressVIP:
                  description: >-
                    Floating IP reserved for the applications of a cluster in this environment.
                  type: string
                externalNetwork:
                  description: External network of the environment's floating IPs.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                description:
                  description: The tenant's description.
                  type: string
                osoHelperName:
                  type: string
                  description: No longer set.
                osoHelperCreated:
                  type: boolean
                  description: No longer set.
                centralApiServer:
                  type: string
                  description: No longer set.
                projectName:
                  type: string
                  description: Name of the OpenStack project.
                projectId:
                  type: string
                  description: Identifier of the OpenStack project.
                domainId:
                  type: string
                  description: Identifier of the OpenStack domain that holds the project.
                domainName:
                  type: string
                  description: Name of the OpenStack domain that holds the project.
                status:
                  type: string
                  description: Short state word written by the platform's automation.
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: When the platform last finished processing this object (RFC 3339).
                message:
                  type: string
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Project
          type: string
          jsonPath: .status.projectName
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
