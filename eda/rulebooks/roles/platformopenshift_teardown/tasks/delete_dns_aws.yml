---
# Route53 records of a cluster: AWS clusters (the slug zone) and Route53 OpenStack environments
# (the records provision recorded). shc (§11.6 phase C): credentials come straight from Vault
# (upstream's temporary ExternalSecret used a bare k8s call and was never deleted), and a failed
# delete fails the job instead of being ignored.
# Inputs: r53_vault_path, r53_records (list of {zone, name}).
- name: Read the Route53 credentials
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ r53_vault_path }}"

- name: Delete the cluster's Route53 A records
  amazon.aws.route53:
    state: absent
    zone: "{{ item.zone }}"
    record: "{{ item.name }}"
    type: A
  environment:
    AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
    AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
    AWS_DEFAULT_REGION: "us-east-1"
  loop: "{{ r53_records }}"
  loop_control:
    label: "{{ item.name }}"
  register: r53_delete
  failed_when: r53_delete.failed and 'not found' not in (r53_delete.msg | default('') | lower)

- name: Forget the Route53 credentials
  ansible.builtin.set_fact:
    vault_kv_data: {}
