---
# shc (design/P8-PLAN.md §13): a cluster on a hybrid network - its machines in the network's NetworkPlacement VPC in
# the environment (install into existing subnets; machine network = the placement's IPv4 prefix). External: the
# placement gets public subnets and an internet gateway for the internet-facing load balancers (DMZ-like; the machines
# still leave through the network). Internal: API and ingress on internal load balancers; the platform reaches them
# through the fabric's service routing domain (the placement's subnet as the cluster's prefix, status.platformPrefixes,
# DESIGN cnet §5), and the cluster's names are published as aliases of the internal load balancers while it installs
# (shc_aws_cluster.py dns-alias, below in the deploy).
# shc (DESIGN cnet §5): the shared preflight (preflight_network.yml) reads the network and the placement and, for
# Internal, the network's PlatformReachable and the fabric's service routing domain; refusals before anything is built.
- name: Check the network
  ansible.builtin.include_tasks: preflight_network.yml
  vars:
    pn_kind: CloudAWS
    pn_env: "{{ aws_env_name }}"
    pn_network: "{{ aws_network }}"
    pn_need_platform: "{{ aws_publish == 'Internal' }}"
    pn_need_router_attachments: false

- name: The placement in this environment
  ansible.builtin.set_fact:
    cb_placement: "{{ pf_placement }}"

- name: Wait for the placement's subnets
  ansible.builtin.include_tasks: preflight_stop.yml
  vars:
    ps_reason: WaitingForPlacement
    ps_message: >-
      PlatformOpenshift {{ ansible_operator_meta.name }}: NetworkPlacement {{ pf.placement }} of HybridNetwork
      {{ aws_network }} in CloudAWS {{ aws_env_name }} has no subnets yet
  when: >-
    not (((((cb_placement.status | default({}, true)).realization | default({}, true)).site | default({}, true)).subnets
         | default([])) | length > 0)

- name: The placement's VPC
  vars:
    _site: "{{ cb_placement.status.realization.site }}"
  ansible.builtin.set_fact:
    cb_placement_ref: "{{ cb_placement.metadata.namespace }}/{{ cb_placement.metadata.name }}"
    # the placement's IPv4 subnet (status.subnets, else the IPv4 entry of status.prefixes): the cluster's machine network
    cb_machine_cidr: >-
      {{ ((cb_placement.status.subnets | default([], true) | selectattr('family', 'defined')
           | selectattr('family', 'equalto', 4) | map(attribute='prefix') | list)
          + (cb_placement.status.prefixes | default([], true) | reject('search', ':') | list) + ['']) | first }}
    cb_vpc_id: "{{ _site.vpc }}"
    cb_subnet_ids: "{{ _site.subnets | map(attribute='id') | list }}"
    cb_tenant_cfg:
      account: "{{ aws_account }}"
      region: "{{ aws_region }}"
      memberRole: "{{ cb_member_role }}"
      entry: automation
      azs: "{{ _site.subnets | map(attribute='az') | list }}"
      tags: {shc-entity: "{{ aws_entity }}", shc-network: "{{ aws_network }}"}

- name: Refuse a placement without IPv4
  ansible.builtin.fail:
    msg: >-
      PlatformOpenshift {{ ansible_operator_meta.name }}: NetworkPlacement {{ cb_placement_ref }} has no IPv4 subnet;
      the platform reaches clusters over IPv4, so the network needs IPv4 space
  when: cb_machine_cidr | trim | length == 0

- name: Check the cluster's address ranges
  ansible.builtin.include_tasks: preflight_ranges.yml
  vars:
    pr_machine_from_placement: "{{ cb_machine_cidr }}"
    pr_space: "{{ pf.space }}"
    pr_reserved: "{{ pf.reserved }}"
    pr_site: "{{ aws_site | default('', true) }}"

- name: Record the network on the status (teardown undoes what it asks for)
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ ansible_operator_meta.name }}"
    cr_namespace: "{{ ansible_operator_meta.namespace }}"
    cr_status_body:
      network: "{{ aws_network }}"
      placement: "{{ cb_placement_ref }}"
      publish: "{{ aws_publish }}"
      awsVpc: "{{ cb_vpc_id }}"
      machineNetwork: "{{ cb_machine_cidr }}"
      clusterNetwork: "{{ cb_cluster_network }}"
      serviceNetwork: "{{ cb_service_network }}"

- name: External - public subnets in the placement for the internet-facing load balancers
  when: aws_publish == 'External'
  block:
    - name: The placement's public subnets
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
      vars:
        aws_helper: shc_aws_tenant.py
        aws_config: "{{ cb_tenant_cfg }}"
        aws_args: [place-public, --placement, "{{ cb_placement_ref }}", --state, up]

    - name: The public subnets
      ansible.builtin.set_fact:
        cb_public_subnet_ids: "{{ aws_result.result.public | map(attribute='id') | list }}"

- name: Internal - the placement's subnet in the platform's service routing domain
  ansible.builtin.include_tasks: cloud_internal_reach.yml
  vars:
    cir_network: "{{ aws_network }}"
  when: aws_publish == 'Internal'

- name: Record the passed preflight
  ansible.builtin.include_tasks: preflight_passed.yml
  vars:
    pp_passed_message: >-
      On HybridNetwork {{ aws_network }} ({{ aws_publish }}){{ ', subnet ' ~ cb_machine_cidr ~ ' reached by the platform'
      if aws_publish == 'Internal' else '' }}
