apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformopenshifts.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "2"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: PlatformOpenshift
    listKind: PlatformOpenshiftList
    plural: platformopenshifts
    singular: platformopenshift
    shortNames:
      - ocpcluster
    categories:
      - shc
      - shc-tenant
      - shc-appplatform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An OpenShift cluster the platform installs and manages for the tenant in one of its
            environments, comparable to Red Hat OpenShift Service on AWS, Google Kubernetes Engine
            or Azure Red Hat OpenShift. spec.type names the environment type, and the block of the
            same name says which environment and what size.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The cluster.
              type: object
              x-kubernetes-validations:
                - rule: >-
                    !has(self.openstack) || !(has(self.openstack.network) && has(self.openstack.externalNetwork))
                  message: spec.openstack names a hybrid network or an external network, not both
                - rule: >-
                    (has(self.openstack) && has(self.openstack.network))
                    == (has(oldSelf.openstack) && has(oldSelf.openstack.network))
                  message: the cluster's network cannot be added, removed or changed
                - rule: >-
                    (has(self.openstack) && has(self.openstack.externalNetwork))
                    == (has(oldSelf.openstack) && has(oldSelf.openstack.externalNetwork))
                  message: the cluster's network cannot be added, removed or changed
                - rule: has(self.networking) == has(oldSelf.networking)
                  message: spec.networking cannot be added, removed or changed
                - rule: >-
                    !has(self.networking) || !has(self.networking.machineNetwork) || !has(self.type)
                    || self.type == 'openstack'
                    || (self.type == 'aws' ? !(has(self.aws) && has(self.aws.network))
                        : !(has(self.gcp) && has(self.gcp.network)))
                  message: spec.networking.machineNetwork is the placement's subnet when the cluster names a network
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                type:
                  type: string
                  description: Environment type the cluster runs in; set the block of the same name.
                  enum: [openstack, aws, gcp]
                openstack:
                  type: object
                  description: Cluster in an OpenStack environment.
                  properties:
                    environment:
                      type: string
                      description: Name of the OpenStack environment (CloudOSO) in this namespace.
                    network:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: >-
                        HybridNetwork (this namespace) the cluster is published on. The environment needs a ready
                        NetworkPlacement of it with router attachments on (spec.use.routerAttachments) and an IPv4
                        subnet, and the network's condition PlatformReachable must be True. The cluster keeps its own
                        machine network behind its own router; the router's external gateway and the API and ingress
                        floating IPs are on the network, so the API and applications are reachable from the network
                        and from the platform only. Excludes externalNetwork. Immutable.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: spec.openstack.network is immutable
                    controlPlaneCount:
                      type: integer
                      description: >-
                        Number of control plane nodes. Default: the installation's default, else 3.
                      minimum: 1
                    workerCount:
                      type: integer
                      description: >-
                        Number of worker nodes; 0 makes a compact cluster. Default: the
                        installation's default, else 3.
                      minimum: 0
                    controlPlaneFlavor:
                      type: string
                      description: >-
                        OpenStack flavor of the control plane nodes. Default: the installation's
                        default.
                    workerFlavor:
                      type: string
                      description: >-
                        OpenStack flavor of the worker nodes. Default: the installation's default.
                    externalNetwork:
                      type: string
                      maxLength: 255
                      description: >-
                        An external network of the environment's site that every project may use (the site's
                        status lists them; TenantProfile sites[].externalNetworks). The cluster's router and floating
                        IPs are on it. When neither this nor network is set, the site's default external network
                        applies; a site without one refuses the cluster (NetworkChoiceRequired). Immutable.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: spec.openstack.externalNetwork is immutable
                    ocpImageSet:
                      type: string
                      description: >-
                        OpenShift release to install (a cluster image set name). Default: the
                        installation's default.
                    pullSecretVaultPath:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Location of the pull secret in the platform's
                        secret store.
                    pullSecretVaultProperty:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Property that holds the pull secret at that
                        location.
                    sshKeyVaultPath:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Location of the nodes' SSH key pair in the
                        platform's secret store.
                    glanceImageOverride:
                      type: string
                      description: >-
                        Existing image for the nodes. Empty: the installer uploads the release's
                        image.
                    trustBundle:
                      type: string
                      description: Additional trusted CA certificates (PEM) for the cluster.
                aws:
                  type: object
                  description: Cluster in an AWS environment.
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: Name of the AWS environment (CloudAWS) in this namespace.
                    network:
                      type: string
                      description: >-
                        HybridNetwork (same namespace) whose NetworkPlacement in the environment
                        hosts the cluster's machines; the placement needs an IPv4 subnet (the
                        platform reaches clusters over IPv4); unset: the cluster gets a network of
                        its own
                    publish:
                      type: string
                      description: "How the cluster's API and ingress are published: External (internet-facing load balancers) or Internal (reachable only from the cluster's network)"
                      enum: [External, Internal]
                      default: External
                    region:
                      type: string
                      description: "AWS region; must be the environment's region (default: the environment's region)"
                    clusterType:
                      type: string
                      description: "Cluster topology type"
                      default: standalone
                      enum: [standalone, ha]
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                      minimum: 1
                    workerCount:
                      type: integer
                      description: "Worker node count; 0 makes a compact cluster"
                      default: 2
                      minimum: 0
                    controllerFlavor:
                      type: string
                      description: "AWS instance type for control plane"
                      default: m5.xlarge
                    workerFlavor:
                      type: string
                      description: "AWS instance type for workers"
                      default: m5.large
                gcp:
                  type: object
                  description: Cluster in a Google Cloud environment.
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: >-
                        Name of the Google Cloud environment (CloudGCP) in this namespace.
                    network:
                      type: string
                      description: >-
                        HybridNetwork (same namespace) whose NetworkPlacement in the environment
                        hosts the cluster's machines; the placement needs an IPv4 subnet (the
                        platform reaches clusters over IPv4); unset: the cluster gets a VPC of its
                        own
                    publish:
                      type: string
                      description: "How the cluster's API and ingress are published: External (internet-facing load balancers) or Internal (reachable only from the cluster's network)"
                      enum: [External, Internal]
                      default: External
                    region:
                      type: string
                      description: "Google Cloud region; must be the environment's region (default: the environment's region)"
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                      minimum: 1
                    workerCount:
                      type: integer
                      description: "Worker node count; 0 makes a compact cluster"
                      default: 2
                      minimum: 0
                    controllerFlavor:
                      type: string
                      description: "Machine type for control plane"
                      default: n2-standard-4
                    workerFlavor:
                      type: string
                      description: "Machine type for workers"
                      default: n2-standard-4
                networking:
                  type: object
                  description: >-
                    Address ranges of the cluster's own networks. Each must stay clear of the others, of the
                    address space of the hybrid network the cluster is on, and of the ranges reserved by the platform
                    (TenantProfile status.reservedRanges); the platform refuses the cluster before building it
                    otherwise. Unset fields take the installation's defaults. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.networking is immutable
                    - rule: >-
                        !has(self.hostPrefix) || !has(self.clusterNetwork) || !isCIDR(self.clusterNetwork)
                        || self.hostPrefix > cidr(self.clusterNetwork).prefixLength()
                      message: spec.networking.hostPrefix must be longer than the clusterNetwork prefix
                  properties:
                    clusterNetwork:
                      type: string
                      maxLength: 18
                      description: >-
                        IPv4 range of the cluster's pods, /8 to /22. Default: the installation's (OpenShift's
                        default is 10.128.0.0/14).
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked()) == self
                          message: >-
                            spec.networking.clusterNetwork must be an IPv4 network prefix in canonical form (host bits
                            zero)
                        - rule: "!isCIDR(self) || (cidr(self).prefixLength() >= 8 && cidr(self).prefixLength() <= 22)"
                          message: spec.networking.clusterNetwork must be /8 to /22
                    hostPrefix:
                      type: integer
                      minimum: 16
                      maximum: 28
                      description: >-
                        Prefix length of each node's share of clusterNetwork, 16 to 28 and longer than the
                        clusterNetwork prefix. Default: the installation's (OpenShift's default is 23).
                    serviceNetwork:
                      type: string
                      maxLength: 18
                      description: >-
                        IPv4 range of the cluster's services, /12 to /24. Default: the installation's (OpenShift's
                        default is 172.30.0.0/16).
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked()) == self
                          message: >-
                            spec.networking.serviceNetwork must be an IPv4 network prefix in canonical form (host bits
                            zero)
                        - rule: "!isCIDR(self) || (cidr(self).prefixLength() >= 12 && cidr(self).prefixLength() <= 24)"
                          message: spec.networking.serviceNetwork must be /12 to /24
                    machineNetwork:
                      type: string
                      maxLength: 18
                      description: >-
                        IPv4 range of the cluster's nodes, /16 to /27. On OpenStack the cluster's own network behind
                        its own router; on AWS and Google Cloud only for a cluster without a network (with one, the
                        nodes use the placement's subnet). Default: the installation's (OpenShift's default is
                        10.0.0.0/16).
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked()) == self
                          message: >-
                            spec.networking.machineNetwork must be an IPv4 network prefix in canonical form (host bits
                            zero)
                        - rule: "!isCIDR(self) || (cidr(self).prefixLength() >= 16 && cidr(self).prefixLength() <= 27)"
                          message: spec.networking.machineNetwork must be /16 to /27
                toolRbac:
                  description: >-
                    Access on the new cluster. Each field lists access groups (Rbac names in this
                    namespace).
                  type: object
                  properties:
                    clusterAdminRbac:
                      description: Access groups whose members get cluster-admin on the cluster.
                      type: array
                      items:
                        type: string
                    clusterOperatorRbac:
                      description: >-
                        Access groups whose members can manage workloads and power state on the
                        cluster, without changing its access.
                      type: array
                      items:
                        type: string
                    clusterDeveloperRbac:
                      description: >-
                        Access groups whose members can deploy applications in the namespaces
                        assigned to them.
                      type: array
                      items:
                        type: string
                    clusterViewerRbac:
                      description: Access groups whose members get read-only access to the cluster.
                      type: array
                      items:
                        type: string
                clusterViewerRbac:
                  description: >-
                    Access groups whose members can read this object on the services cluster.
                    Distinct from toolRbac.clusterViewerRbac, which gives read access on the cluster
                    itself.
                  type: array
                  items:
                    type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the cluster object.
                  type: string
                namespace:
                  description: Namespace of the cluster object.
                  type: string
                entity:
                  description: The tenant this cluster belongs to.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                description:
                  description: The tenant's description.
                  type: string
                platformType:
                  description: Environment type of the cluster.
                  type: string
                slug:
                  description: Short unique name of the cluster, used in its DNS names.
                  type: string
                domain:
                  description: Base DNS domain of the cluster.
                  type: string
                apiURL:
                  description: URL of the cluster's API.
                  type: string
                appsURL:
                  description: Wildcard domain of the cluster's applications.
                  type: string
                consoleURL:
                  type: string
                  description: URL of the cluster's web console.
                adminPasswordVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                kubeconfigVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                secretsVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                clusterVersion:
                  type: string
                  description: OpenShift version of the cluster.
                powerState:
                  type: string
                  description: Power state of the cluster (Running, Hibernating, ...).
                clusterHealth:
                  type: string
                  description: Overall health of the cluster.
                provisionStatus:
                  type: string
                  description: Installation status.
                acmAvailable:
                  type: boolean
                  description: True when the platform's cluster management reaches the cluster.
                acmJoined:
                  type: boolean
                  description: True when the cluster has joined the platform's cluster management.
                clusterInstalled:
                  type: boolean
                  description: True when the installation is complete.
                installStarted:
                  type: boolean
                  description: >-
                    True once the installation was started; the cluster's floating IPs are then part of it and are
                    kept until the cluster is deleted.
                oidcConfigured:
                  type: boolean
                  description: >-
                    True when sign-in with the platform identity is set up on the cluster.
                oidcClientId:
                  type: string
                  description: Client of the cluster in the platform's sign-in directory.
                awsHelperName:
                  description: No longer set.
                  type: string
                awsRegion:
                  description: AWS region of the cluster.
                  type: string
                gcpProject:
                  description: Google Cloud project of the cluster.
                  type: string
                gcpRegion:
                  description: Google Cloud region of the cluster.
                  type: string
                buildName:
                  description: >-
                    Name of the cluster's build on the platform (its management namespace, release and managed
                    cluster). The OpenShift cluster itself keeps the object's name.
                  type: string
                network:
                  description: HybridNetwork the cluster is on; empty for a cluster with a network of its own.
                  type: string
                externalNetwork:
                  description: >-
                    OpenStack cluster without a hybrid network: the site's external network its router and floating
                    IPs are on.
                  type: string
                placement:
                  description: NetworkPlacement (namespace/name) the cluster's network reaches the environment through.
                  type: string
                publish:
                  description: >-
                    How the cluster's API and ingress are published: External or Internal (reachable from its network
                    and the platform only).
                  type: string
                machineNetwork:
                  description: IPv4 range of the cluster's nodes.
                  type: string
                clusterNetwork:
                  description: IPv4 range of the cluster's pods.
                  type: string
                serviceNetwork:
                  description: IPv4 range of the cluster's services.
                  type: string
                platformPrefixes:
                  description: >-
                    The cluster's addresses the platform's management reaches through the hybrid network (the
                    network lists their state in status.platformAccess.prefixes).
                  type: array
                  items:
                    type: string
                floatingIPs:
                  description: "OpenStack: the cluster's floating IPs, allocated for it and released when it is deleted."
                  type: object
                  properties:
                    network:
                      description: Identifier of the network the floating IPs are on.
                      type: string
                    api:
                      description: Floating IP of the cluster's API.
                      type: object
                      properties:
                        address:
                          description: The address.
                          type: string
                        id:
                          description: Identifier of the floating IP.
                          type: string
                    ingress:
                      description: Floating IP of the cluster's applications (ingress).
                      type: object
                      properties:
                        address:
                          description: The address.
                          type: string
                        id:
                          description: Identifier of the floating IP.
                          type: string
                status:
                  type: string
                  description: Short state word written by the platform's automation.
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: When the platform last finished processing this object (RFC 3339).
                message:
                  type: string
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                phase:
                  type: string
                  description: >-
                    State of the object, written by the platform: Waiting (for something else),
                    Creating, Updating, Ready, Degraded (usable, with reduced health), Paused (the
                    site is paused), Failed or Deleting.
                phaseSince:
                  type: string
                  description: >-
                    When the object entered the state in status.phase (RFC 3339). It changes only
                    when the state changes.
                summary:
                  type: string
                  description: >-
                    One line on what the platform is doing or waiting for, in plain words. Read it
                    together with status.phase.
                lastHandledReconcileRequest:
                  type: string
                  description: >-
                    The Retry now request the platform last handled: the value of the
                    ansible.sdk.operatorframework.io/reconcileNow annotation at that time. A request
                    is open while the annotation differs from this value.
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: string
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Health
          type: string
          jsonPath: .status.clusterHealth
        - name: Power
          type: string
          jsonPath: .status.powerState
        - name: Version
          type: string
          jsonPath: .status.clusterVersion
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
