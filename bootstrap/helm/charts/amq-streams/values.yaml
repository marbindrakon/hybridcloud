namespace: amq-streams

operator:
  channel: stable
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace

kafka:
  enabled: true
  name: hybridsovereign-kafka
  replicas: 3
  storage: 10Gi
  version: "4.2.0"
  metadataVersion: "4.2-IV1"
  nodePool:
    name: dual-role
    roles:
      - controller
      - broker
    # shc: spread the brokers over the nodes: "required" (one per node; replicas <= nodes), "preferred", or "" (none)
    antiAffinity: required
  authorization:
    enabled: true
  # shc (review D3): JMX exporter + PodMonitor + alerts (user-workload monitoring)
  metrics:
    enabled: false
  listeners:
    internalPlain: true
    internalTls: true
    externalRoute: true
    externalPort: 9094
    # Publicly trusted certificate for the external route listener (cert-manager Certificate for the
    # bootstrap and broker route hosts). Both empty = Strimzi cluster CA (clients must trust it).
    externalCert:
      clusterIssuer: ""
      appsDomain: ""

topics:
  - name: hybridsovereign-events
    partitions: 12
    replicas: 3
  - name: hybridsovereign-audit
    partitions: 6
    replicas: 3

kafkaUsers:
  producer:
    enabled: true
    name: hybridsovereign-producer
    acls:
      - topic: hybridsovereign-events
        operations: [Write, Describe, Create]
  consumer:
    enabled: true
    name: hybridsovereign-eda-consumer
    acls:
      - topic: hybridsovereign-events
        operations: [Read, Describe]
      - group: eda-
        patternType: prefix
        type: group
        operations: [Read, Describe]
