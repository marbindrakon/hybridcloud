---
- block:
    # shc (P7.3.3): a fabric is deleted only after its gateways and the networks on it are gone
    - name: Wait for the gateways and networks on this fabric to be deleted first
      ansible.builtin.include_role:
        name: _common
        tasks_from: block_on_dependents
      vars:
        dependents_namespace: "{{ ansible_operator_meta.namespace }}"
        dependents_all_namespaces: true
        dependents_status:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: HybridFabric
          name: "{{ ansible_operator_meta.name }}"
        dependent_checks:
          - kind: CloudGateway
            match: {"metadata.namespace": "{{ ansible_operator_meta.namespace }}", "spec.fabricRef.name": "{{ ansible_operator_meta.name }}"}
          - kind: HybridNetwork
            match: {"spec.fabricRef.name": "{{ ansible_operator_meta.name }}"}
          # a network without fabricRef records the fabric it took by default
          - kind: HybridNetwork
            match: {"status.fabric": "{{ ansible_operator_meta.name }}"}

    - name: Get current timestamp
      ansible.builtin.set_fact:
        hybridfabric_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark HybridFabric as awaiting EDA delete
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          message: Awaiting EDA delete
          lastReconciledAt: "{{ hybridfabric_delete_transition_time }}"
      # once per delete: a requeue (and the release after the teardown) keeps the teardown's message
      when:
        - not ((_hybridsovereign_redhat_hybridfabric.status | default({}, true)).deletionComplete | default(false) | bool)
        - not ((((_hybridsovereign_redhat_hybridfabric.status | default({}, true)).delivery | default({}, true)).reason
                | default('', true)) is search('DeleteRequested$'))

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "HybridFabricDeleteRequested"
        operator_event_action: "Delete"
        operator_event_note: "{{ _hybridsovereign_redhat_hybridfabric.spec | to_json }}"
        operator_reporting_controller: hybridfabric-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: HybridFabric
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_hybridfabric.metadata.uid }}"

    - name: Exit cleanly when EDA completed deletion
      ansible.builtin.meta: end_host
      when: _hybridsovereign_redhat_hybridfabric.status.deletionComplete | default(false) | bool

    - name: Block finalizer until EDA completes deletion
      ansible.builtin.fail:
        msg: Waiting for EDA to complete deletion

  rescue:
    - name: Mark HybridFabric delete as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Deletion failed')) }}"
      ignore_errors: true
      # a delete that waits (for dependents, or for the EDA teardown) is not failed: the status it set stays
      when: not (ansible_failed_result.msg | default('') is match('(Deletion waits for |Waiting for EDA to complete deletion)'))

    - name: Re-raise to signal finalizer failure
      ansible.builtin.fail:
        msg: "HybridFabric {{ ansible_operator_meta.name }} deletion failed — see status.message for details"
