apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rbacs.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "7"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: Rbac
    listKind: RbacList
    plural: rbacs
    singular: rbac
    shortNames:
      - rb
      - accessgroup
      - ag
    categories:
      - shc
      - shc-tenant
      - shc-access
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An access group: a named group of people in a tenant, comparable to an IAM Identity
            Center group, a Google group, a Microsoft Entra group or a Keystone group. Creating it
            creates the group <tenant>/<name> in the platform's sign-in directory; its members sign
            in with the group <tenant>.<name>. Roles (Entity spec.namespaceRbac) and the access
            fields of other objects refer to it by name. Membership is managed in the sign-in
            directory.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The access group.
              type: object
              properties:
                config:
                  description: >-
                    Optional. The identity provider connection (an RbacConfig in the platform's
                    integration namespace) this access group uses. When omitted the platform uses
                    its default connection; the one used is reported in status.config.
                  type: string
                description:
                  description: >-
                    What the group is for, in a few words. Shown with the group in the sign-in
                    directory.
                  type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                group:
                  description: >-
                    Path of the group in the sign-in directory, <tenant>/<name>. Members sign in
                    with the group <tenant>.<name>.
                  type: string
                groupId:
                  description: Identifier of the group in the sign-in directory.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                entity:
                  description: The tenant this access group belongs to.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                creator:
                  description: Who created the access group.
                  type: string
                description:
                  description: The description as applied to the group.
                  type: string
                realm:
                  description: The sign-in directory realm that holds the group.
                  type: string
                attributes:
                  description: Attributes set on the group in the sign-in directory.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  description: Short state word written by the platform's automation.
                  type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Config
          type: string
          jsonPath: .spec.config
        - name: Group
          type: string
          jsonPath: .status.group
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
