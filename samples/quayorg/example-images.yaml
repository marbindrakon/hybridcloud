# A Quay organization (QuayOrg). spec.quayConfig names the platform's registry connection: ask the
# platform team for its name.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: QuayOrg
metadata:
  name: example-images
  namespace: entity-example-corp
spec:
  quayConfig: example-registry-connection
  quayAdminRbac:
    - example-admins
  quayMemberRbac:
    - example-developers
