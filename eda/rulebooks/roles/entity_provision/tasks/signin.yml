---
# shc (design/P7-PLAN.md §12.20): tenant sign-in on the services cluster. Each Rbac CR the Entity uses gets the
# sign-in group <entity>.<rbac> (common/tasks/services_signin_groups.yml, owner Entity/<entity>); the entity's
# RoleBindings name that group.
# Input: es_wanted = [{rbac, path, group}] (path = the Rbac's Keycloak group path); empty on teardown, with
# es_purge true so the roles other CRs of the entity still hold go too.
- name: Tenant sign-in groups of the Entity
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/services_signin_groups.yml"
  vars:
    ssg_entity: "{{ entity_cr_name }}"
    ssg_owner: "Entity/{{ entity_cr_name }}"
    ssg_label: "Entity {{ entity_cr_name }}"
    ssg_wanted: "{{ es_wanted }}"
    ssg_purge: "{{ es_purge | default(false) }}"
