---
# shc (design/P8-PLAN.md §1, §4): container group "shc-aws" for jobs that reach AWS without keys.
# Jobs run as the service account the workload-identity chart creates (no Kubernetes token mounted); a native
# sidecar keeps a JWT-SVID (audience sts.amazonaws.com) from the SPIFFE Workload API in a memory volume, and boto3
# assumes the management account's automation role with it (AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE).
# Settings: installation config AWS_REALIZATION (JSON); without automationRoleArn no group is defined.
shc_aws: "{{ lookup('env', 'AWS_REALIZATION') | default('{}', true) | from_json }}"

controller_instance_groups: "{{ [shc_aws_instance_group] if (shc_aws.automationRoleArn | default('')) else [] }}"

shc_aws_instance_group:
  name: shc-aws
  is_container_group: true
  pod_spec_override: |
    apiVersion: v1
    kind: Pod
    metadata:
      namespace: {{ shc_aws.jobNamespace | default('aap') }}
      labels:
        shc.signal9.gg/aws-identity: "true"
    spec:
      serviceAccountName: {{ shc_aws.jobServiceAccount | default('shc-aws-automation') }}
      automountServiceAccountToken: false
      initContainers:
        - name: spiffe-jwt
          image: {{ shc_aws.jwtSidecarImage | default('registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-agent-rhel9@sha256:0fd5f289b7dd4d2bb3d0dad22324dc51287e57fdb401889ddb1c27690aec6539') }}
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              umask 027   # group-readable: the volume is owned by the pod fsGroup (setgid), shared with the worker
              while true; do
                t=$(/spire-agent api fetch jwt -audience sts.amazonaws.com -socketPath /spiffe-workload-api/spire-agent.sock 2>/dev/null \
                      | awk '/^token\(/ {getline; gsub(/[ \t]/, ""); print; exit}')
                if [ -n "$t" ]; then
                  printf '%s' "$t" > /var/run/secrets/aws/token.new && mv /var/run/secrets/aws/token.new /var/run/secrets/aws/token
                  unset t; sleep 600
                else
                  sleep 2
                fi
              done
          startupProbe:
            exec: {command: ["/bin/sh", "-c", "test -s /var/run/secrets/aws/token"]}
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: spiffe, mountPath: /spiffe-workload-api, readOnly: true}
            - {name: aws-token, mountPath: /var/run/secrets/aws}
      containers:
        - image: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:latest
          name: worker
          args: ["ansible-runner", "worker", "--private-data-dir=/runner"]
          env:
            - {name: AWS_ROLE_ARN, value: "{{ shc_aws.automationRoleArn | default('') }}"}
            - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/aws/token}
            - {name: AWS_ROLE_SESSION_NAME, value: shc-aap-job}
            - {name: AWS_DEFAULT_REGION, value: "{{ shc_aws.region | default('us-east-1') }}"}
          resources: {requests: {cpu: 250m, memory: 100Mi}}
          volumeMounts:
            - {name: aws-token, mountPath: /var/run/secrets/aws, readOnly: true}
      volumes:
        - name: spiffe
          csi: {driver: csi.spiffe.io, readOnly: true}
        - name: aws-token
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
