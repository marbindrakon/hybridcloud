# ─── shc: platform IaaS clusters (LAB-PLAN P5/P6) ───────────────────────────────────────────────
# Bare-metal clusters built by central from metal-infra-env (mce-cluster-build Agent provider, lab
# workspace p5/build-iaas1.sh). templates/iaasClusters renders, per enabled cluster, the base layer, a
# ClusterSecretStore on central Vault (auth mount kubernetes-<name>, policy limited to that cluster's
# keys), ODF external on Atuin Ceph and CNV. Enable a cluster once it is registered in Argo CD and its
# Vault auth mount exists.
iaasClusterDefaults:
  enabled: false
  server: ""
  syncWaves:
    base: "0"
    store: "0"
    certs: "2"
    odf: "3"
    cnv: "4"
  clusterBase:
    chartVersion: "0.3.14"  # 0.3.5: optional fabric underlay (P7.2); 0.3.6: FRRConfiguration label; 0.3.7: etcd alerts; 0.3.8: EVPN SVI MTU; 0.3.9: fabric.gateways (BFD); 0.3.10: fabric.absentRoutes; 0.3.11: tenantAccess; 0.3.12: tenantDns; 0.3.13: tenantDns recordset listing fix; 0.3.14: tenantDns status lists published records next to refusals
    values:
      cluster:
        baseDomain: shc.signal9.gg
      certManager:
        recursiveNameservers: "172.18.42.20:53"
      letsencrypt:
        dnsZones: [shc.signal9.gg]
        rfc2136:
          nameserver: "75.8.222.11:53"
          tsigKeyName: shc-acme.
        tsigSecret:
          vaultKey: dns/shc-acme-tsig
        account:
          vaultKey: dns/letsencrypt-shc-account
      timesync:
        servers: [172.18.42.20, 172.18.0.79]
      externalSecrets:
        config:
          spec:
            controllerConfig:
              networkPolicies:
                # central Vault through its route on central's ingress VIP
                - name: allow-egress-to-central-vault
                  componentName: ExternalSecretsCoreController
                  egress:
                    - to:
                        - ipBlock:
                            cidr: 172.18.230.7/32
                      ports:
                        - protocol: TCP
                          port: 443
      monitoring:
        storageClass: ocs-external-storagecluster-ceph-rbd
      # P7.3.7 (owner 10-14: IdP and cluster configuration changes allowed): tenant sign-in through the services
      # tenant realm (client openshift-<cluster>, central job keycloakIaasClients), no self-provisioning, CloudVirt
      # network guard
      tenantAccess:
        enabled: true
        identityProvider:
          name: sovereign-tenants
          issuer: https://rhbk-services.apps.services.shc.signal9.gg/realms/sovereign-tenants
      # TENANT-DNS D3 (owner 10-14: the cluster's Vault policy reads dns/tenant-designate): tenants publish names in
      # their CloudVirt environment zone with DNSEndpoints and Service/Route hostname annotations
      tenantDns:
        enabled: true
        image: quay.signal9.gg/shc/de-cloudoso:0.1.7
        config:
          domain: tenants.shc.signal9.gg
  secretStore:
    chartVersion: "0.3.3-shc.2"
    values:
      vault:
        server: "https://vault-central.apps.central.shc.signal9.gg"
        path: "central"
      auth:
        type: kubernetes
        role: "external-secrets"
        serviceAccountName: "vault-eso-sa"
        serviceAccountNamespace: "external-secrets"
  odfExternal:
    enabled: true
    chartVersion: "0.1.2"
    values: {}
  cnv:
    enabled: true
    chartVersion: "0.1.1"  # 0.1.1: optional migrationNetwork (off by default)
    values:
      namespace: openshift-cnv
      subscription:
        channel: stable
        installPlanApproval: Automatic
        source: redhat-operators
        sourceNamespace: openshift-marketplace
      hyperconverged:
        enabled: true
        name: kubevirt-hyperconverged
        featureGates:
          deployKubeSecondaryDNS: false
          # golden images would import into the default StorageClass (Atuin Ceph); off until wanted
          enableCommonBootImageImport: false
        infra:
          nodePlacement: {}
        workloads:
          nodePlacement: {}
      # virt-operator creates and owns virt-api-pdb / virt-controller-pdb itself. When the chart's
      # copies land first (fresh cluster), virt-operator fails "poddisruptionbudget ... already exists"
      # and KubeVirt never becomes Available (iaas1, P5). Central got away with it by ordering luck.
      pdb:
        virtApi:
          enabled: false
        virtController:
          enabled: false
  # P7.1 (P7-PLAN §3.2): credential of the cluster's CloudInfrastructure (type openshift): ACM
  # ManagedServiceAccount + ClusterPermission + PushSecret -> central Vault cloudinfra/<cluster>
  cloudInfra:
    enabled: false
    serviceAccount: shc-cloudinfra
    tokenValidity: 168h
    apiServer: ""   # default https://api.<cluster>.<baseDomain>:6443
    rules:
      # the site probe (eda cloudinfrastructure_provision/openshift.yml); read only
      - {apiGroups: [config.openshift.io], resources: [clusterversions], verbs: [get, list]}
      - {apiGroups: [kubevirt.io], resources: [kubevirts], verbs: [get, list]}
      - {apiGroups: [operator.openshift.io], resources: [networks], verbs: [get, list]}
      - {apiGroups: [frrk8s.metallb.io], resources: [bgpsessionstates], verbs: [get, list]}
      - {apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list]}
  # P7.3 (design/P7-PLAN.md §12.4 d, owner-approved RBAC 2026-10-13): the fabric jobs' write credential,
  # central Vault cloudinfra/<cluster>-fabric. Tenant VM namespaces get RoleBindings to `edit` only (bind is
  # limited to it); NADs/UDNs in those namespaces are denied by an admission policy on the cluster.
  fabricAccess:
    enabled: false
    serviceAccount: shc-fabric
    tokenValidity: 168h
    apiServer: ""
    rules:
      - {apiGroups: [k8s.ovn.org], resources: [clusteruserdefinednetworks, routeadvertisements, vteps], verbs: [get, list, watch, create, update, patch, delete]}
      - {apiGroups: [""], resources: [namespaces, resourcequotas, limitranges], verbs: [get, list, watch, create, update, patch, delete]}
      - {apiGroups: [rbac.authorization.k8s.io], resources: [rolebindings], verbs: [get, list, watch, create, update, patch, delete]}
      - {apiGroups: [rbac.authorization.k8s.io], resources: [clusterroles], verbs: [bind], resourceNames: [edit, view]}   # view: CloudVirt viewRbac (owner 10-14)
      - {apiGroups: [""], resources: [nodes], verbs: [get, list]}
      - {apiGroups: [config.openshift.io], resources: [networks, clusterversions], verbs: [get, list]}
      - {apiGroups: [operator.openshift.io], resources: [networks], verbs: [get, list]}
      - {apiGroups: [frrk8s.metallb.io], resources: [frrconfigurations, bgpsessionstates], verbs: [get, list]}
      - {apiGroups: [nmstate.io], resources: [nodenetworkconfigurationpolicies, nodenetworkstates], verbs: [get, list]}
      - {apiGroups: [kubevirt.io], resources: [virtualmachines, virtualmachineinstances], verbs: [get, list]}

iaasClusters:
  iaas1:
    enabled: true  # shc: P5 - installed 2026-10-11, registered in Argo, Vault mount kubernetes-iaas1
    server: "https://api.iaas1.shc.signal9.gg:6443"
    cloudInfra:
      enabled: true  # P7.1: CloudInfrastructure iaas1 (central Vault cloudinfra/iaas1)
    fabricAccess:
      enabled: true  # P7.3: fabric write credential (central Vault cloudinfra/iaas1-fabric)
    clusterBase:
      values:
        # P7.2 fabric underlay (P7-PLAN §9): VTEP VLAN 236 on bond0, iBGP to the route reflectors
        fabric:
          enabled: true
          routeReflectors: []   # P7.3.6 (10-14): the Atuin RRs retired; the site's route reflectors are its gateways
          gateways: [172.18.236.4, 172.18.236.5]   # CloudGateway iaas1 on bgw-1/2 (BFD)
          vtepInterface: {base: bond0, vlan: 236, mtu: 9100, prefixLength: 24}  # underlay 9100 (P7-PLAN §12.6)
          sviMtu: {enabled: true, mtu: 9000}  # P7.3: OVN-K EVPN SVIs to the overlay MTU (shc-cluster-base templates/evpn-svi-mtu.yaml)
          gateway: 172.18.236.1
          routes: []   # P7.3.6 (10-14): VTEPs only talk to their CloudGateways on this VLAN; the P7.2 inter-site routes are gone
          absentRoutes: [172.18.234.0/24, 172.18.235.0/24, 172.18.237.0/24, 172.18.239.0/24]   # NMState removes only routes listed absent
          nodes:
            - {name: iaas1-blade1, vtepIP: 172.18.236.11}
            - {name: iaas1-blade2, vtepIP: 172.18.236.12}
            - {name: iaas1-blade3, vtepIP: 172.18.236.13}
            - {name: iaas1-blade4, vtepIP: 172.18.236.14}
            - {name: iaas1-blade6, vtepIP: 172.18.236.16}
            - {name: iaas1-blade7, vtepIP: 172.18.236.17}
