    server: "https://api.edge1.shc.signal9.gg:6443"
    cloudInfra:
      enabled: true  # P7.3 (owner 10-13: edge1 is the third fabric site): CloudInfrastructure edge1, central Vault cloudinfra/edge1
    fabricAccess:
      enabled: true  # P7.3: fabric write credential (central Vault cloudinfra/edge1-fabric)
    clusterBase:
      values:
        # P7.2 fabric underlay (P7-PLAN §9): VTEP VLAN 239 on bond1, iBGP to the route reflectors
        fabric:
          enabled: true
          routeReflectors: []   # P7.3.6 (10-14): the Atuin RRs retired; the site's route reflectors are its gateways
          gateways: [172.18.239.4, 172.18.239.5]   # CloudGateway edge1 on bgw-1/2 (BFD)
          vtepInterface: {base: bond1, vlan: 239, mtu: 9100, prefixLength: 24}  # underlay 9100 (P7-PLAN §12.6)
          sviMtu: {enabled: true, mtu: 9000}  # P7.3: OVN-K EVPN SVIs to the overlay MTU (shc-cluster-base templates/evpn-svi-mtu.yaml)
          gateway: 172.18.239.1
          routes: []   # P7.3.6 (10-14): VTEPs only talk to their CloudGateways on this VLAN; the P7.2 inter-site routes are gone
          absentRoutes: [172.18.234.0/24, 172.18.235.0/24, 172.18.236.0/24, 172.18.237.0/24]
          nodes:
            - {name: edge1-node1, vtepIP: 172.18.239.21}
            - {name: edge1-node2, vtepIP: 172.18.239.22}
            - {name: edge1-node3, vtepIP: 172.18.239.23}
    cnv:
      values:
        # The machine network is the 1G LOM bond; VM memory moves over the 10G bond instead: VLAN 239 (edge1
        # fabric, AST-only L2) with a non-routed range, apart from the VTEP addresses in 172.18.239.0/24.
        migrationNetwork:
          enabled: true
          master: bond1.239
          range: 10.239.0.0/24
          mtu: 9000

# ─── AAP (services cluster) ─────────────────────────────────────────────────
aap:
  enabled: true  # shc: P4 (services cluster) enabled
  # shc (owner 10-11): the same chart as central (aap-instance). The aap chart's AAP CR set
  # controller.database, which AAP 2.6 ignores, so gateway, controller and EDA ran on the operator's
  # managed Postgres while the Crunchy cluster sat unused. aap-instance points them at Crunchy
  # (external-postgres-sync job). manageNamespace keeps the aap Namespace the old chart owned.
  chart: aap-instance
  chartVersion: "0.5.5-shc.2"
  syncWave: "30"
  destinationNamespace: aap
  values:
    namespace: aap
    name: sovereign-aap
    manageNamespace: true
    controller:
      enabled: true
    eda:
      # the operator runs EDA on services either way (the old chart's "false" only omitted replicas)
      enabled: true
      rbac:
        enabled: false
    hub:
      enabled: false
    postgres:
      enabled: true
      name: aap-pgcluster
      instances: 2
      storage: 20Gi
      backupStorage: 10Gi

# ─── AAP (central cluster — EDA controller) ────────────────────────────────
aapCentral:
  enabled: true
  chartVersion: "0.5.5-shc.2"
  syncWave: "30"
  destinationNamespace: aap
  values:
    namespace: aap
    name: sovereign-aap
    controller:
      enabled: true
      replicas: 1
      # shc: the controller SA is cluster-admin, so its pods are admitted under anyuid: the
      # control-plane EE (project clones) runs as root, the task container as awx. git >= 2.35 then
      # rejects the shared project checkouts ("dubious ownership"); trust them in both containers.
      extraSpec:
        task_extra_env: |
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: safe.directory
          - name: GIT_CONFIG_VALUE_0
            value: "*"
        ee_extra_env: |
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: safe.directory
          - name: GIT_CONFIG_VALUE_0
            value: "*"
    eda:
      enabled: true
      replicas: 1
    hub:
      enabled: false
    postgres:
      enabled: true
      name: aap-pgcluster
      instances: 1
      storage: 40Gi
      backupStorage: 10Gi
      syncRunId: "2026-08-26-pg-wal-disk-fix"

# ─── Plugin IaaC Operator (services cluster) — Go direct Gitea sync ─────────
pluginIaac:
  enabled: false
  chartVersion: "0.2.1"
  syncWave: "40"
  destinationNamespace: sovereign-cloud-plugins
  values:
    namespace: sovereign-cloud-plugins
    createNamespace: false
    replicas: 2
    leaderElection: true
    metricsPort: 8443
    image:
      repository: quay.signal9.gg/shc/plugin-iaac
      tag: "v0.2.0"
      pullPolicy: Always
    imagePullSecrets:
      - name: quay-pull-secret
    gitea:
      url: "https://gitea-gitea.apps.central.shc.signal9.gg"
      repoOwner: "gitea_admin"
      repoName: "tenancy_repo"
      secretName: "gitea-admin-token"
      tokenSecretKey: "admin_token"
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: gitea-admin
    defaultIaac:
      enabled: true
      name: iaac

# ─── Event Forwarder (central cluster — K8s Events → EDA Event Stream) ───────
eventForwarder:
  enabled: false  # shc: off: no sink reachable from services (Kafka default is central's in-cluster service; no EDA event stream)
  chartVersion: "0.5.5-shc.1"
  syncWave: "32"
  image:
