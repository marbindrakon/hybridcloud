namespace: aap
# shc: render the Namespace (set when replacing the aap chart, which owned it)
manageNamespace: false

name: sovereign-aap

operator:
  channel: stable-2.6
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: ansible-automation-platform-operator

controller:
  enabled: true
  replicas: 1
  # Extra AutomationController spec fields passed through as-is (e.g. task_extra_env, ee_extra_env).
  extraSpec: {}

eda:
  enabled: true
  replicas: 1
  # Settings of the Event-Driven Ansible server, passed to its custom resource as extra_settings (each an item
  # {setting, value}; the server reads them as environment variables, so a setting's name carries the EDA_ prefix).
  # Nothing is set by default. For example, how often a failing activation is restarted before the platform gives
  # up on it (the platform's default is 5, counted over the activation's life until it is disabled and enabled):
  #   extraSettings:
  #     - setting: EDA_ACTIVATION_MAX_RESTARTS_ON_FAILURE
  #       value: "100"
  # A setting the server does not know is ignored without an error: check the effect after a change.
  # That the platform operator passes these to the server next to its own settings is not proven for every
  # operator version: try a setting on a test instance first.
  extraSettings: []
  rbac:
    enabled: true

hub:
  enabled: false

postgres:
  enabled: false
  name: aap-pgcluster
  instances: 2
  storage: 10Gi
  backupStorage: 10Gi
  # Backups of the database (schedules are cron, UTC). A full backup on fullSchedule and a differential one on
  # differentialSchedule (empty: none; it must not fall on the full backup's day and minute). retentionFull full
  # backups are kept, with the differential ones and the write-ahead log that follow them: the database can be
  # restored to any moment since the oldest kept full backup, about retentionFull times the full interval back.
  # Of the differential backups the newest retentionDifferential are kept. Older ones expire when a backup
  # completes. Size the backup volume for retentionFull + 1 full backups, retentionDifferential differential
  # ones, and the write-ahead log of retentionFull + 1 full intervals.
  backup:
    retentionFull: 2
    retentionDifferential: 2
    fullSchedule: "0 1 * * 0"
    differentialSchedule: "0 1 * * 1-6"
    # The waiting archive (pgBackRest archive-push-queue-max). When write-ahead log cannot be archived, for
    # example because the backup volume is full or unreachable, the segments wait in the data volume. Past this size
    # they are dropped and the database's log says "dropped WAL file ... because archive queue exceeded ...": the
    # database keeps running instead of filling its data volume and stopping, but it can no longer be restored to a
    # moment between the drop and the next completed backup. auto: a quarter of storage (storage must then be a whole
    # number of Mi, Gi or Ti); a size such as 4GiB or 2560MiB; empty: no limit (the data volume fills and the
    # database stops).
    # 0 is refused, as is more than 4PiB; a plain number is bytes. On a data volume more than three quarters
    # full the default is more than the free space: then set a size below the free space.
    archivePushQueueMax: auto
