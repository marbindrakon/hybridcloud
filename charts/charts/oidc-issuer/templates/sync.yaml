apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [oidc-documents]
    verbs: [get, patch, update]
  # static issuers: ConfigMaps selected by label (public keys only)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oidc-sync}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ .Values.namespace }}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-oidc-sync-issuer-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:service-account-issuer-discovery}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ .Values.namespace }}}]
{{- $acm := list }}
{{- range .Values.sync.clusters }}{{ if eq .source "acm" }}{{ $acm = append $acm .name }}{{ end }}{{ end }}
{{- if $acm }}
---
# availability of the acm clusters: a cluster that is not available (powered off, paused) is not a fault
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shc-oidc-sync-managedclusters
rules:
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters]
    resourceNames: {{ toJson $acm }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-oidc-sync-managedclusters
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: shc-oidc-sync-managedclusters}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ .Values.namespace }}}]
{{- end }}
{{- range .Values.sync.clusters }}
{{- if eq .source "acm" }}
---
# {{ .name }}: service account on the managed cluster; its token is synced to Secret
# {{ $.Values.sync.acm.managedServiceAccount }} in namespace {{ .name }} on this hub.
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: {{ $.Values.sync.acm.managedServiceAccount }}
  namespace: {{ .name }}
spec:
  rotation:
    enabled: true
    validity: 168h
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shc-oidc-sync
  namespace: {{ .name }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $.Values.sync.acm.managedServiceAccount }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-oidc-sync
  namespace: {{ .name }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: shc-oidc-sync}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ $.Values.namespace }}}]
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: oidc-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: {{ .Values.sync.image }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  {{- .Files.Get "files/oidc-sync.sh" | nindent 18 }}
              env:
                - {name: NAMESPACE, value: {{ .Values.namespace | quote }}}
                - {name: BASE_URL, value: {{ .Values.baseURL | quote }}}
                - {name: MSA, value: {{ .Values.sync.acm.managedServiceAccount | quote }}}
                - {name: PROXY_URL, value: {{ .Values.sync.acm.proxyURL | quote }}}
                - {name: STATIC_LABEL, value: {{ .Values.sync.static.label | quote }}}
                - {name: STATIC_NAME_LABEL, value: {{ .Values.sync.static.nameLabel | quote }}}
                - name: CLUSTERS
                  value: |
                    {{- range .Values.sync.clusters }}
                    {{- if eq .source "url" }}
                    {{ .name }} url {{ .url }} {{ .keysPath | default "/keys" }}
                    {{- else }}
                    {{ .name }} {{ .source }}
                    {{- end }}
                    {{- end }}
              # the per-issuer report of a failed run stays in the pod's status
              terminationMessagePolicy: FallbackToLogsOnError
              resources: {requests: {cpu: 10m, memory: 64Mi}}
