# Starts the ESO operands (controller, webhook, cert-controller) in the external-secrets namespace.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- toYaml .Values.externalSecretsConfig.spec | nindent 2 }}
