---
# shc (design/P7-PLAN.md P7.3.3, §12.3): HybridNetwork provision. Resolves the fabric (spec.fabricRef, else the
# one recorded earlier, else the platform's only fabric), checks the Entity may use it and the MTU, and records
# entity, fabric, MTU and the placement counts; ends pending while the fabric isn't ready. Then allocates the
# network's VPN route target from the fabric's ledger (P7.3.8): the gateways of the sites the network is placed on
# exchange its routes under it. Internet egress (spec.egress.internet, P7.4): the network holds an egress index in
# the ledger while it wants egress; the HybridFabric job realizes it on the border gateway nodes (default route into
# the network, source NAT) and wakes the network when it did; status.egress {internet: pending|ready|removing|
# unavailable, sourceAddresses}. Turning it off: the fabric removes it first, then the index goes back.
# Address space (design/P10-PLAN.md §2.1): the IPAM holds spec.prefixes with the platform's ranges inside them, which
# it never allocates (a prefix wholly inside one is refused: PrefixReserved); no prefix may hold an accept entry of
# the network's attachment circuits (PrefixInUse); the IPAM refuses an edit that would leave a placement's subnet
# outside (PrefixInUse, the space unchanged); status.addressSpace. A change wakes the network's placements waiting
# for address space.
# IPv6 (design/IPV6-PLAN.md §2.1, §2.2; OD63, OD65, OD66, OD73): the mode comes from the fields (ipv6_mode.yml) and
# can't change while the network has placements (IPv6ModeInUse); a tenant prefix overlapping the platform's own
# space (realization network.exclusiveRanges and the public pools) is refused (PrefixReserved); a mode-Tenant IPv6
# prefix may not overlap another network of the same tenant (PrefixInUse, in the IPAM); mode Platform takes a block
# from the fabric's public pool (pending WaitingForAddressSpace while none is free, the tenant's allowance is used
# or the pinned block is held back), given back when the mode changes or the network goes (hold-down); status.ipv6
# and the per-family status.egress (egress_status.yml).
- block:
    - name: Read the HybridNetwork
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: List the platform's fabrics
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        namespace: "{{ fabric_platform_namespace }}"
      register: _hn_fabrics

    - name: Choose the fabric
      ansible.builtin.set_fact:
        hn_waiting: []
        hn_fabric_name: >-
          {{ (fab_spec.fabricRef | default({})).name | default('', true)
             or fab_st.fabric | default('', true)
             or ((_hn_fabrics.resources | map(attribute='metadata.name') | list | first)
                 if _hn_fabrics.resources | length == 1 else '') }}

    - name: Refuse a fabric change
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: it uses HybridFabric {{ fab_st.fabric }}; spec.fabricRef
          {{ fab_spec.fabricRef.name }} cannot move it
      when:
        - (fab_spec.fabricRef | default({})).name | default('', true) | length > 0
        - fab_st.fabric | default('', true) | length > 0
        - fab_spec.fabricRef.name != fab_st.fabric

    - name: Refuse an ambiguous default
      ansible.builtin.set_fact:
        fab_fail_reason: FabricAmbiguous
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the platform has {{ _hn_fabrics.resources | length }} fabrics; set
          spec.fabricRef
      when:
        - fab_fail_msg | default('', true) | length == 0
        - hn_fabric_name | length == 0
        - _hn_fabrics.resources | length > 1

    - name: Stop on an invalid network
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_msg | default('', true) | length > 0

    - name: Set the fabric facts
      ansible.builtin.set_fact:
        hn_fabric: >-
          {{ (_hn_fabrics.resources | selectattr('metadata.name', 'equalto', hn_fabric_name) | list
              + [{}]) | first }}

    - name: Wait for a fabric
      ansible.builtin.set_fact:
        hn_waiting: >-
          {{ [('HybridFabric ' ~ hn_fabric_name ~ ' (not found)') if hn_fabric_name else 'a HybridFabric (the platform has none)'] }}
      when: hn_fabric | length == 0

    - name: Check the fabric allows the Entity and the MTU
      when: hn_fabric | length > 0
      block:
        - name: Refuse an Entity the fabric does not allow
          ansible.builtin.set_fact:
            fab_fail_reason: EntityNotAllowed
            fab_fail_msg: "Entity {{ fab_entity }} may not use HybridFabric {{ hn_fabric_name }} (spec.entityRefs)"
          when:
            - hn_fabric.spec.entityRefs | default([]) | length > 0
            - fab_entity not in (hn_fabric.spec.entityRefs | map(attribute='name') | list)

        - name: Refuse an MTU above the fabric's
          ansible.builtin.set_fact:
            fab_fail_reason: InvalidSpec
            fab_fail_msg: >-
              HybridNetwork {{ fab_name }}: mtu {{ fab_spec.mtu }} is above HybridFabric {{ hn_fabric_name }}'s
              overlayMtu {{ hn_fabric.spec.overlayMtu }}
          when:
            - fab_fail_msg | default('', true) | length == 0
            - fab_spec.mtu is defined
            - fab_spec.mtu | int > hn_fabric.spec.overlayMtu | int

        - name: Stop on a refused network
          ansible.builtin.fail:
            msg: "{{ fab_fail_msg }}"
          when: fab_fail_msg | default('', true) | length > 0

        - name: Wait for the fabric to be ready
          ansible.builtin.set_fact:
            hn_waiting: >-
              {{ ['HybridFabric ' ~ hn_fabric_name ~ ' (' ~ ((hn_fabric.status | default({}, true)).status
                  | default('not provisioned', true)) ~ ')'] }}
          # usable: ready, or realized and not failed
          when: not (((hn_fabric.status | default({}, true)).ready | default(false) | bool) or (((hn_fabric.status | default({}, true)).realized | default(false) | bool) and (hn_fabric.status | default({}, true)).status | default('') != 'failed'))

    - name: List the network's placements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ fab_namespace }}"
      register: _hn_placements

    - name: Set the network status
      vars:
        _mine: "{{ _hn_placements.resources | default([]) | selectattr('spec.network', 'equalto', fab_name) | list }}"
      ansible.builtin.set_fact:
        # every placement of the network that still exists holds (or may hold) a subnet
        hn_holders: "{{ _mine | map(attribute='metadata.name') | map('regex_replace', '^', 'NetworkPlacement/' ~ fab_namespace ~ '/') | list }}"
        hn_status: >-
          {{ {'entity': fab_entity,
              'placementCount': _mine | length,
              'placementsReady': _mine | selectattr('status.ready', 'defined') | selectattr('status.ready') | list | length}
             | combine({'fabric': hn_fabric_name} if hn_fabric | length > 0 else {})
             | combine({'mtu': (fab_spec.mtu | default(hn_fabric.spec.overlayMtu)) | int} if hn_fabric | length > 0 else {}) }}

    - name: Report what the network waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: WaitingForDependencies
        fab_message: "Waiting for {{ hn_waiting | join('; ') }}"
        fab_waiting_for: "{{ hn_waiting }}"
        fab_status: "{{ hn_status }}"
      when: hn_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: hn_waiting | length > 0

    # ---- address space ----
    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ hn_fabric_name }}"

    - name: List the attachment circuits
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        namespace: "{{ fab_namespace }}"
      register: _hn_circuits

    # the platform's own ranges inside the networks' VRFs (as the circuit job and the fabric's circuit policy)
    - name: The platform's ranges
      ansible.builtin.set_fact:
        hn_platform_ranges: >-
          {{ [fab_real.attachments.linkPool, fab_real.core.loopbackPool, fab_real.core.linkSubnet,
              fab_real.egress.linkPool | default('169.254.0.0/16')]
             + (fab_real.egress.platformSources | default([], true)) }}

    - name: The network's IPv6 mode
      ansible.builtin.include_tasks: ipv6_mode.yml

    # address space the platform keeps for itself (its own globally routed space, translation prefixes) and every
    # public pool: no tenant prefix may overlap it
    - name: The platform's exclusive ranges
      ansible.builtin.set_fact:
        hn_exclusive: >-
          {{ (fab_real.network | default({}, true)).exclusiveRanges | default([], true)
             + ((fab_real.ipam | default({}, true)).publicPools | default({}, true) | dict2items
                | map(attribute='value') | map(attribute='prefixes', default=[]) | flatten) }}

    - name: Check the address space against the platform's ranges and the circuits
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: check-network
          prefixes: "{{ fab_spec.prefixes | default([], true) }}"
          reserved: "{{ hn_platform_ranges }}"
          exclusive: "{{ hn_exclusive }}"
          circuits: >-
            {%- set out = [] -%}
            {%- for c in _hn_circuits.resources | default([]) -%}
              {%- if c.spec.network == fab_name and c.metadata.deletionTimestamp is not defined -%}
                {%- set _ = out.append({'name': c.metadata.name, 'accept': (c.spec.routing | default({}, true)).accept | default([], true)}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ out }}

    - name: Refuse a prefix inside a platform range or holding a circuit's accept entry
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ 'PrefixReserved' if fab_check_result.reserved | length > 0 else 'PrefixInUse' }}"
        fab_fail_msg: "HybridNetwork {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on a refused address space
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    # ---- IPv6 mode and the platform block ----
    - name: The address space the IPAM holds
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam: {action: ipam-get, fabric: "{{ hn_fabric_name }}", network: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"}

    - name: The IPv6 mode in effect
      ansible.builtin.include_tasks: ipv6_realized.yml
      vars:
        hn_held: "{{ fab_ipam_result }}"

    - name: Refuse a change of the IPv6 mode while the network has placements
      ansible.builtin.set_fact:
        fab_fail_reason: IPv6ModeInUse
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the network's IPv6 mode can't change while it has placements
          ({{ hn_mode6_realized }} to {{ hn_mode6 }}); remove them or create a new network
      when:
        - hn_mode6_realized | length > 0
        - hn_mode6_realized != hn_mode6
        - hn_holders | length > 0

    - name: Stop on a refused mode change
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_reason | default('') == 'IPv6ModeInUse'

    - name: Start without a platform block
      ansible.builtin.set_fact:
        hn_block: ""
        hn_pool: ""

    - name: The network's platform IPv6 block
      ansible.builtin.include_tasks: platform_block.yml
      when: hn_mode6 == 'Platform'

    - name: The address space in the IPAM
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam:
          action: ipam-space
          fabric: "{{ hn_fabric_name }}"
          network: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
          prefixes: "{{ fab_spec.prefixes | default([], true) + ([hn_block] if hn_block | length > 0 else []) }}"
          platform: "{{ [hn_block] if hn_block | length > 0 else [] }}"
          mode6: "{{ hn_mode6 }}"
          holders: "{{ hn_holders }}"
          tenant: "{{ fab_entity }}"
          reserved: "{{ hn_platform_ranges }}"

    - name: Refuse an edit that leaves placements' subnets outside the space
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ fab_ipam_result.reason | default('PrefixInUse', true) }}"
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the address space stays {{ fab_ipam_result.addressSpace | map(attribute='prefix') | join(', ') }}:
          {{ fab_ipam_result.refused | join('; ') }}
      when: fab_ipam_result.refused | default([]) | length > 0

    - name: Stop on a refused edit
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_ipam_result.refused | default([]) | length > 0

    - name: Keep the address space
      ansible.builtin.set_fact:
        hn_space: "{{ fab_ipam_result.addressSpace }}"
        hn_space_changed: "{{ fab_ipam_result.changed | default(false) | bool }}"
        # (merge-patched: block and holdDownUntil are written as null when they don't apply)
        hn_ipv6_status: >-
          {{ {'mode': hn_mode6,
              'prefixes': [hn_block] if hn_block | length > 0 else hn_tenant6,
              'block': {'prefix': hn_block, 'prefixLength': hn_block.split('/')[1] | int,
                        'source': 'Pinned' if hn_platform6.prefix | default('', true) | length > 0 else 'Allocated'}
                       if hn_block | length > 0 else none,
              'holdDownUntil': none} }}

    # not mode Platform (any more): a block the network still holds goes back to the pool (held down there)
    - name: Give a platform block back
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam: {action: ipam-pool-release, fabric: "{{ hn_fabric_name }}", owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"}
      when:
        - hn_mode6 != 'Platform'
        - (fab_real.ipam | default({}, true)).publicPools | default({}, true) | length > 0

    - name: Wake the networks waiting for platform address space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/wake_waiting_networks.yml"
      vars:
        wn_fabric: "{{ hn_fabric_name }}"
        wn_except: {namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}
      when:
        - hn_mode6 != 'Platform'
        - (fab_real.ipam | default({}, true)).publicPools | default({}, true) | length > 0
        - fab_ipam_result.released | default(none, true) is not none

    # a placement without room waits; the space changed, so it may fit now
    - name: Wake the placements waiting for address space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: >-
          {%- set out = [] -%}
          {%- for p in _hn_placements.resources | default([]) -%}
            {%- set c = ((p.status | default({}, true)).conditions | default([], true) + [{}]) | first -%}
            {%- if p.spec.network == fab_name and p.metadata.deletionTimestamp is not defined
                  and (p.status | default({}, true)).status | default('') == 'pending'
                  and c.reason | default('') == 'WaitingForAddressSpace' -%}
              {%- set _ = out.append({'kind': 'NetworkPlacement', 'namespace': fab_namespace, 'name': p.metadata.name}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: hn_space_changed | bool

    # the network's VPN route target: the gateways of every site it is placed on import and export it
    - name: The network's VPN route target
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-allocate
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: vpnTarget
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"

    - name: Keep the route target
      ansible.builtin.set_fact:
        hn_vpn_target: "{{ fab_ledger_result.value | int }}"

    # internet egress: the fabric is the only writer of it on the nodes
    - name: What the fabric realizes for the network's egress
      vars:
        _eg: "{{ ((hn_fabric.status | default({}, true)).realization | default({}, true)).egress | default({}, true) }}"
      ansible.builtin.set_fact:
        hn_egress_want: "{{ (fab_spec.egress | default({})).internet | default(false) | bool }}"
        # IPv4 egress (source NAT) needs IPv4 space; IPv6 egress is not realized by the fabric yet
        hn_egress_want4: "{{ ((fab_spec.egress | default({})).internet | default(false) | bool) and hn_v4 | length > 0 }}"
        # platform reach (annotation written by the platform's automation) needs the same root VRF and veth
        hn_platform_reach: >-
          {{ (fab_obj.metadata.annotations | default({}, true))['shc.signal9.gg/platform-reach'] | default('[]', true) | from_json
             | length > 0 }}
        hn_egress_offered: "{{ _eg.enabled | default(false) | bool }}"
        hn_egress_carried: >-
          {{ (_eg.networks | default([], true) | selectattr('network', 'equalto', fab_namespace ~ '/' ~ fab_name) | list
              + [{}]) | first }}

    - name: Hold an egress index
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-allocate
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: egress
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
      when: (hn_egress_want4 | bool or hn_platform_reach | bool) and hn_egress_offered | bool

    # off, and the fabric no longer carries it: the index goes back
    - name: Give the egress index back
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-release
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: egress
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
      when: not ((hn_egress_want4 | bool or hn_platform_reach | bool) and hn_egress_offered | bool) and hn_egress_carried | length == 0

    - name: Set the egress state
      ansible.builtin.include_tasks: egress_status.yml

    # the fabric adds or removes the network's egress and wakes it again when it did
    - name: Wake the fabric
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: HybridFabric, namespace: "{{ fabric_platform_namespace }}", name: "{{ hn_fabric_name }}"}]
      when: >-
        hn_egress.internet | default('') in ['pending', 'removing']
        or ((hn_platform_reach | bool) != ((hn_egress_carried.platform | default([])) | length > 0))

    - name: Report the network ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        fab_message: >-
          {{ hn_space | map(attribute='prefix') | join(', ') }} on HybridFabric {{ hn_fabric_name }}, MTU {{ hn_status.mtu }};
          {{ hn_status.placementsReady }}/{{ hn_status.placementCount }} placements ready{{ hn_egress_note }}
        fab_status: >-
          {{ hn_status | combine({'addressSpace': hn_space, 'ipv6': hn_ipv6_status,
                                  'realization': {'vpnTarget': hn_vpn_target | int,
                                                  'routeTarget': hn_fabric.spec.domainAsn ~ ':' ~ hn_vpn_target}})
             | combine({'egress': hn_egress if hn_egress | length > 0 else none}) }}

  rescue:
    - name: Mark the HybridNetwork failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('HybridNetwork provision failed') }}
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridNetwork {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
