---
# shc (design/P7-PLAN.md P7.3.8, §12.3.1): the site side of a placement on a CloudVirt (OpenShift site): a Layer2
# primary ClusterUserDefinedNetwork with EVPN transport (IP-VRF = the placement's layer 3 VNI, MAC-VRF = its
# layer 2 VNI, route targets <asn>:<vni>) over the site's VTEP, selecting the CloudVirt's namespaces that name the
# network (by label), and a RouteAdvertisements that advertises it toward the site's gateway. The subnets are the
# placement's allocated prefixes (np_prefixes; site_ranges.yml kept them off the cluster's own networks). The served
# namespaces get the placement's IPv6 prefixes as an annotation (namespace_prefixes.yml). Uses the site's fabric
# credential. Sets np_backend_status, npp_note.
- name: Realize the network on the site
  block:
    - name: The site's fabric credential
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_kubeconfig.yml"
      vars:
        site_kc_tag: "np-{{ fab_namespace }}-{{ fab_name }}"

    # named by number (OpenShift derives device names from it); an object of that name the platform did not make
    # for this placement (its tenant and placement labels) is refused before anything is applied, never changed
    - name: Read the site's objects of these names
      kubernetes.core.k8s_info:
        kubeconfig: "{{ site_kubeconfig }}"
        api_version: k8s.ovn.org/v1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
      loop:
        - {kind: ClusterUserDefinedNetwork, name: "{{ np_names.cudn }}"}
        - {kind: RouteAdvertisements, name: "{{ np_names.routeAdvertisement }}"}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      register: _np_site_existing

    - name: Decide whether they are the placement's
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: site-object-ownership
          labels: "{{ np_names.labels }}"
          objects: >-
            {%- set out = [] -%}
            {%- for r in _np_site_existing.results | default([]) -%}
              {%- set _ = out.append({'kind': r.item.kind, 'name': r.item.name,
                                      'existing': (r.resources[0].metadata.labels | default({}, true))
                                                  if r.resources | default([]) | length > 0 else none}) -%}
            {%- endfor -%}
            {{ out }}

    - name: Refuse objects that are not the placement's
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ fab_check_result.reason }}"
        fab_fail_msg: "{{ fab_check_result.message }}"
      when: not (fab_check_result.ok | bool)

    - name: Stop before anything is applied
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: not (fab_check_result.ok | bool)

    # one expression: numbers stay numbers (templated scalars inside a YAML definition become strings)
    - name: "ClusterUserDefinedNetwork {{ np_names.cudn }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ site_kubeconfig }}"
        state: present
        definition: >-
          {{ {'apiVersion': 'k8s.ovn.org/v1', 'kind': 'ClusterUserDefinedNetwork',
              'metadata': {'name': np_names.cudn, 'labels': np_names.labels,
                           'annotations': {'hybridsovereign.redhat/networkplacement': fab_namespace ~ '/' ~ fab_name}
                                          | combine(np_names.annotations | default({}, true))},
              'spec': {'namespaceSelector': {'matchLabels': np_ns_selector},
                       'network': {'topology': 'Layer2', 'transport': 'EVPN',
                                   'evpn': {'vtep': np_gateway.status.site.vtep,
                                            'ipVRF': {'vni': np_real.l3Vni | int, 'routeTarget': np_asn ~ ':' ~ np_real.l3Vni},
                                            'macVRF': {'vni': np_real.l2Vni | int, 'routeTarget': np_asn ~ ':' ~ np_real.l2Vni}},
                                   'layer2': {'role': 'Primary', 'mtu': np_real.mtu | int, 'subnets': np_prefixes,
                                              'ipam': {'lifecycle': 'Persistent'}}}}} }}
      register: _np_cudn

    - name: "RouteAdvertisements {{ np_names.routeAdvertisement }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ site_kubeconfig }}"
        state: present
        definition:
          apiVersion: k8s.ovn.org/v1
          kind: RouteAdvertisements
          metadata:
            name: "{{ np_names.routeAdvertisement }}"
            labels: "{{ np_names.labels }}"
            # the names people chose (tenant, network, placement) beside the number
            annotations: "{{ np_names.annotations | default({}, true) }}"
          spec:
            advertisements: [PodNetwork]
            nodeSelector: {}
            targetVRF: auto
            frrConfigurationSelector:
              matchLabels: "{{ fab_real.openshift.frrConfigurationSelector | default({}, true) }}"
            networkSelectors:
              - networkSelectionType: ClusterUserDefinedNetworks
                clusterUserDefinedNetworkSelector:
                  networkSelector:
                    matchLabels: {hybridsovereign.redhat/l3vni: "{{ np_real.l3Vni | string }}"}
      register: _np_ra

    - name: Wait for the network to be created on the site
      kubernetes.core.k8s_info:
        kubeconfig: "{{ site_kubeconfig }}"
        api_version: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: "{{ np_names.cudn }}"
      register: _np_cudn_state
      retries: 18
      delay: 10
      until: >-
        (_np_cudn_state.resources | default([{}], true))[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'NetworkCreated') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Wait for the advertisements to be accepted
      kubernetes.core.k8s_info:
        kubeconfig: "{{ site_kubeconfig }}"
        api_version: k8s.ovn.org/v1
        kind: RouteAdvertisements
        name: "{{ np_names.routeAdvertisement }}"
      register: _np_ra_state
      retries: 18
      delay: 10
      until: >-
        (_np_ra_state.resources | default([{}], true))[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Accepted') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Record the site side
      ansible.builtin.set_fact:
        np_backend_status:
          clusterUserDefinedNetwork: "{{ np_names.cudn }}"
          routeAdvertisements: "{{ np_names.routeAdvertisement }}"
        np_backend_changed: "{{ _np_cudn is changed or _np_ra is changed }}"

    # the tenant DNS controller's trusted prefixes (namespace_prefixes.yml); never fails the placement
    - name: The placement's IPv6 prefixes on its namespaces
      ansible.builtin.include_tasks: namespace_prefixes.yml
      vars:
        _was: "{{ fab_st.namespaces | default([], true) }}"
        npp_set: "{{ np_status.namespaces | default([], true) }}"
        npp_value: "{{ np_prefixes_v6 | default([], true) | join(',') }}"
        npp_clear: "{{ _was | difference(np_status.namespaces | default([], true)) }}"
        npp_owned: >-
          {{ (np_prefixes_v6 | default([], true)
              + (fab_st.subnets | default([], true) | selectattr('family', 'defined') | selectattr('family', 'equalto', 6)
                 | map(attribute='prefix') | list)) | unique | list }}
  always:
    - name: Remove the site kubeconfig
      ansible.builtin.file:
        path: "{{ site_kubeconfig | default('/tmp/eda-np-' ~ fab_namespace ~ '-' ~ fab_name ~ '-kubeconfig') }}"
        state: absent
