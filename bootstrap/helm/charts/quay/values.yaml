namePrefix: ""
skipNamespace: false

operator:
  channel: stable-3.17
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace

namespace: quay-enterprise

registry:
  enabled: true
  name: sovereign-registry
  components:
    objectstorage:
      managed: false
    postgres:
      managed: true
    clair:
      managed: true
    redis:
      managed: true
    mirror:
      managed: true
    route:
      managed: true
    tls:
      managed: true
    monitoring:
      managed: true
    horizontalpodautoscaler:
      managed: true
    clairpostgres:
      managed: true

objectStorage:
  bucketName: "quay-datastorage"

crunchy:
  enabled: false
  name: quay-pgcluster
  instances: 2
  storage: 20Gi
  backupStorage: 20Gi
  # Backups of the database (schedules are cron, UTC). A full backup on fullSchedule and a differential one on
  # differentialSchedule (empty: none; it must not fall on the full backup's day and minute). retentionFull full
  # backups are kept, with the differential ones and the write-ahead log that follow them: the database can be
  # restored to any moment since the oldest kept full backup, about retentionFull times the full interval back.
  # Of the differential backups the newest retentionDifferential are kept. Older ones expire when a backup
  # completes. Size the backup volume for retentionFull + 1 full backups, retentionDifferential differential
  # ones, and the write-ahead log of retentionFull + 1 full intervals.
  backup:
    retentionFull: 2
    retentionDifferential: 2
    fullSchedule: "40 1 * * 0"
    differentialSchedule: "40 1 * * 1-6"
    # The waiting archive (pgBackRest archive-push-queue-max). When write-ahead log cannot be archived, for
    # example because the backup volume is full or unreachable, the segments wait in the data volume. Past this size
    # they are dropped and the database's log says "dropped WAL file ... because archive queue exceeded ...": the
    # database keeps running instead of filling its data volume and stopping, but it can no longer be restored to a
    # moment between the drop and the next completed backup. auto: a quarter of storage (storage must then be a whole
    # number of Mi, Gi or Ti); a size such as 4GiB or 2560MiB; empty: no limit (the data volume fills and the
    # database stops).
    archivePushQueueMax: auto

dbInitJob:
  image: "/hybrid-sovereign/ansible-runner:latest"

# shc: OIDC login (Keycloak/RHBK) written into the config bundle by the db-init job. The quay-config
# job's superuser-config API route answers 403 on operator-managed Quay 3.17. The client secret
# comes from Vault through an ExternalSecret.
oidc:
  enabled: false
  configKey: RHBK_LOGIN_CONFIG      # <ID>_LOGIN_CONFIG; <ID> becomes the external login service id
  serviceName: Keycloak
  clientId: ""
  server: ""                        # realm URL; a trailing slash is added
  loginScopes: [openid, email, profile]
  groupClaim: groups
  authenticationType: OIDC          # upstream's intent (team sync from OIDC groups)
  clientSecret:
    secretStoreName: vault-backend
    vaultKey: ""
    property: ""

# shc: object storage on Ceph RGW (unmanaged objectstorage; set registry.components.objectstorage.
# managed: false). The db-init job merges DISTRIBUTED_STORAGE_* into the config bundle; the keys
# (access_key, secret_key) come from Vault through an ExternalSecret.
rgw:
  enabled: false
  hostname: ""
  port: 443
  isSecure: true
  bucket: ""
  storagePath: /datastorage/registry
  credentials:
    secretStoreName: vault-backend
    vaultKey: ""
