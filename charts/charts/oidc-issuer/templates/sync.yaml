apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [oidc-documents]
    verbs: [get, patch, update]
  # static issuers: ConfigMaps selected by label (public keys only)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oidc-sync}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ .Values.namespace }}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-oidc-sync-issuer-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:service-account-issuer-discovery}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ .Values.namespace }}}]
{{- range .Values.sync.clusters }}
{{- if eq .source "acm" }}
---
# {{ .name }}: service account on the managed cluster; its token is synced to Secret
# {{ $.Values.sync.acm.managedServiceAccount }} in namespace {{ .name }} on this hub.
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: {{ $.Values.sync.acm.managedServiceAccount }}
  namespace: {{ .name }}
spec:
  rotation:
    enabled: true
    validity: 168h
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shc-oidc-sync
  namespace: {{ .name }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $.Values.sync.acm.managedServiceAccount }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-oidc-sync
  namespace: {{ .name }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: shc-oidc-sync}
subjects: [{kind: ServiceAccount, name: oidc-sync, namespace: {{ $.Values.namespace }}}]
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oidc-sync
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: oidc-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: {{ .Values.sync.image }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -o pipefail
                  cd /tmp; mkdir -p old new; rc=0
                  # last published documents: a cluster that fails now keeps them
                  oc get configmap oidc-documents -n {{ $.Values.namespace }} -o json \
                    | jq -r '.data // {} | keys[]' | while read -r k; do
                        oc get configmap oidc-documents -n {{ $.Values.namespace }} -o json | jq -r --arg k "$k" '.data[$k]' > "old/$k"
                      done
                  publish() {  # <cluster> <oc args...>: fetch, rewrite issuer, check, stage
                    local n=$1; shift
                    oc "$@" get --raw /openid/v1/jwks > "new/${n}__keys.json" \
                      && oc "$@" get --raw /.well-known/openid-configuration \
                        | jq --arg iss "{{ $.Values.baseURL }}/$n" '.issuer = $iss | .jwks_uri = ($iss + "/keys.json")' \
                          > "new/${n}__openid-configuration" \
                      && test "$(jq -r .issuer "new/${n}__openid-configuration")" = "{{ $.Values.baseURL }}/$n" \
                      && jq -e '.keys | length > 0' "new/${n}__keys.json" >/dev/null
                  }
                  publish_url() {  # <name> <base URL> <keys path>: an HTTPS discovery endpoint (service CA), e.g. SPIRE's
                    local n=$1 u=$2 k=$3 ca=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
                    curl -sf --max-time 20 --cacert "$ca" "$u$k" > "new/${n}__keys.json" \
                      && curl -sf --max-time 20 --cacert "$ca" "$u/.well-known/openid-configuration" \
                        | jq --arg iss "{{ $.Values.baseURL }}/$n" '.issuer = $iss | .jwks_uri = ($iss + "/keys.json")' \
                          > "new/${n}__openid-configuration" \
                      && test "$(jq -r .issuer "new/${n}__openid-configuration")" = "{{ $.Values.baseURL }}/$n" \
                      && jq -e '.keys | length > 0' "new/${n}__keys.json" >/dev/null
                  }
                  {{- range .Values.sync.clusters }}
                  {{- if eq .source "local" }}
                  # {{ .name }}: this cluster's own issuer documents
                  publish {{ .name }} || { echo "{{ .name }}: fetch failed"; rc=1; }
                  {{- else if eq .source "acm" }}
                  # {{ .name }}: ManagedCluster through cluster-proxy with its ManagedServiceAccount token
                  T=$(oc get secret {{ $.Values.sync.acm.managedServiceAccount }} -n {{ .name }} -o jsonpath='{.data.token}' | base64 -d)
                  if [ -n "$T" ]; then
                    publish {{ .name }} --server={{ $.Values.sync.acm.proxyURL }}/{{ .name }} --token="$T" \
                      --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt \
                      || { echo "{{ .name }}: fetch failed"; rc=1; }
                  else
                    echo "{{ .name }}: no ManagedServiceAccount token yet"; rc=1
                  fi
                  unset T
                  {{- else if eq .source "url" }}
                  # {{ .name }}: an OIDC discovery endpoint inside the cluster; its keys are republished unchanged
                  publish_url {{ .name }} {{ .url | quote }} {{ .keysPath | default "/keys" | quote }} || { echo "{{ .name }}: fetch failed"; rc=1; }
                  {{- end }}
                  {{- end }}
                  # static issuers: ConfigMaps labelled {{ .Values.sync.static.label }}=true in this namespace, issuer name in
                  # label {{ .Values.sync.static.nameLabel }}, key set in data keys.json (an issuer whose signing key exists
                  # before its cluster does, e.g. an AWS cluster in STS mode). Names of the clusters above are not taken.
                  configured=" {{ range .Values.sync.clusters }}{{ .name }} {{ end }}"; static=""
                  oc get configmap -n {{ $.Values.namespace }} -l {{ .Values.sync.static.label }}=true -o json \
                    | jq -c '.items[] | {n: (.metadata.labels["{{ .Values.sync.static.nameLabel }}"] // ""), k: (.data["keys.json"] // "")}' \
                    > static.jsonl || { echo "static: list failed"; rc=1; }
                  while read -r e; do
                    n=$(jq -r .n <<<"$e")
                    if ! [[ "$n" =~ ^[a-z0-9-]+$ ]] || [[ "$configured" == *" $n "* ]]; then echo "static: skipping '$n'"; rc=1; continue; fi
                    jq -r .k <<<"$e" > "new/${n}__keys.json"
                    jq -n --arg iss "{{ $.Values.baseURL }}/$n" '{issuer: $iss, jwks_uri: ($iss + "/keys.json"),
                      response_types_supported: ["id_token"], subject_types_supported: ["public"],
                      id_token_signing_alg_values_supported: ["RS256"], claims_supported: ["aud", "exp", "sub", "iat", "iss"]}' \
                      > "new/${n}__openid-configuration"
                    if jq -e '.keys | length > 0' "new/${n}__keys.json" >/dev/null 2>&1; then static="$static $n"
                    else echo "$n: static key set invalid"; rm -f "new/${n}__keys.json" "new/${n}__openid-configuration"; rc=1; fi
                  done < static.jsonl
                  args=(); published=""
                  for n in {{ range .Values.sync.clusters }}{{ .name }} {{ end }}$static; do
                    if [ -s "new/${n}__keys.json" ] && [ -s "new/${n}__openid-configuration" ]; then d=new; published="$published $n"
                    elif [ -s "old/${n}__keys.json" ] && [ -s "old/${n}__openid-configuration" ]; then d=old; echo "$n: keeping the last published documents"
                    else continue; fi
                    args+=(--from-file="${n}__keys.json=$d/${n}__keys.json" --from-file="${n}__openid-configuration=$d/${n}__openid-configuration")
                  done
                  oc create configmap oidc-documents -n {{ $.Values.namespace }} --dry-run=client -o yaml "${args[@]}" \
                    | oc apply --server-side --force-conflicts --field-manager=oidc-sync -f - || rc=1
                  echo "published:$published"
                  exit $rc
              resources: {requests: {cpu: 10m, memory: 64Mi}}
