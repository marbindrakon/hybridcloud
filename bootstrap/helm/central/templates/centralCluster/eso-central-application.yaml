{{- if and (include "sovereign-central.applicationsEnabled" .) .Values.externalSecrets.enabled }}
---
# External Secrets Operator on central. Upstream relied on the lab's base-config (or the disabled
# ACM base-chart policy) to provide ESO on central; this installs it explicitly so central has no
# dependency on lab-hub automation (LAB-PLAN D3). The chart is a value: openshift-external-secrets
# (Red Hat operator, OLM) on central, external-secrets (community) where the old chart is still used.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-central
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "sovereign-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
    sovereign-cloud/target: central
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.externalSecrets.syncWave | quote }}
spec:
  project: default

  source:
    {{- $chart := .Values.externalSecrets.chart | default "external-secrets" }}
    repoURL: {{ printf "oci://%s/%s/%s" .Values.oci.registry .Values.oci.repositoryBase $chart | quote }}
    chart: {{ $chart }}
    targetRevision: {{ .Values.externalSecrets.chartVersion | quote }}
    helm:
      releaseName: external-secrets-central
      valuesObject:
        {{- toYaml .Values.externalSecrets.values | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.externalSecrets.values.namespace | default "external-secrets" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
{{- end }}
