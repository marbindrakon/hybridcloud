---
# shc (design/P7-PLAN.md P7.3.5): the gateway instance on one border gateway node (delegated over SSH, become).
# Inputs: bgw_node, cg_instance (apply config), cg_pe, cg_root_pe, cg_fabric, fab_spec, cg_bgp_password.
# Appends the node's state to cg_node_results (and its name to cg_changed_nodes when anything changed).
- name: "{{ bgw_node.name }}: the gateway's site address"
  ansible.builtin.set_fact:
    cg_node_addr: "{{ (fab_spec.siteUnderlay.addresses | selectattr('node', 'equalto', bgw_node.name) | first).address }}"

- name: "{{ bgw_node.name }}: the root instance must be up"
  ansible.builtin.command: systemctl is-active shc-fabric-apply@root.service
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: install the apply script and the gateway unit"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-fabric-apply, dest: /usr/local/sbin/shc-fabric-apply, mode: "0755"}
    - {src: shc-gw@.service, dest: /etc/systemd/system/shc-gw@.service, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_files

# a new apply script takes effect through the direct run below (and at the next unit start), so on its own it needs
# no restart; only a new unit file restarts the running instance (FRR stop/start in the namespace resets its sessions)
- name: "{{ bgw_node.name }}: did the gateway unit change"
  ansible.builtin.set_fact:
    _cg_unit_changed: >-
      {{ _cg_files.results | selectattr('changed') | map(attribute='item.dest') | select('search', 'shc-gw@')
         | list | length > 0 }}

# the ICMPv6 source of the namespace's VRFs differs per node (the node's position in borderGateway.nodes); only with
# the IPv6 core the fabric offers (cg_ipv6_core, main.yml)
- name: "{{ bgw_node.name }}: the gateway's ICMPv6 source on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: "{{ cg_pe.index }}"
      nodeOrdinal: "{{ (cg_fabric.spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when:
    - cg_ipv6_core | default(false) | bool
    - fab_real.core.icmpSource6 | default('', true) | length > 0

# the core's IPv6 keys are empty strings on an IPv4-only core and until the fabric offers the IPv6 core;
# loopbackPool6 and icmpSource6 let the apply remove addresses an earlier configuration left inside those ranges
- name: "{{ bgw_node.name }}: gateway instance config"
  vars:
    _cg_icmp6: >-
      {{ fab_check_result.icmp6 if (cg_ipv6_core | default(false) | bool
                                    and fab_real.core.icmpSource6 | default('', true) | length > 0) else '' }}
  ansible.builtin.copy:
    dest: "/etc/shc-fabric/gw-{{ fab_name }}.json"
    content: >
      {{ cg_instance | combine({'address': cg_node_addr ~ '/' ~ (fab_spec.siteUnderlay.cidr | split('/') | last),
                                'loopback6': cg_pe.loopback6 | default(''), 'icmp6': _cg_icmp6,
                                'loopbackPool6': fab_real.core.loopbackPool6 | default('', true),
                                'icmpSource6': fab_real.core.icmpSource6 | default('', true)}) | to_nice_json }}
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_conf

- name: "{{ bgw_node.name }}: apply the gateway instance (namespace, site leg, core leg)"
  ansible.builtin.command: "/usr/local/sbin/shc-fabric-apply gw-{{ fab_name }} up"
  register: _cg_apply
  changed_when: "'changed=yes' in _cg_apply.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR instance directory"
  ansible.builtin.file:
    path: "/etc/frr/gw-{{ fab_name }}"
    state: directory
    owner: frr
    group: frr
    mode: "0750"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR daemons and vtysh config"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/frr/gw-{{ fab_name }}/{{ item.dest }}"
    owner: frr
    group: frr
    mode: "0640"
  loop:
    - {src: daemons.j2, dest: daemons}
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_daemons

- name: "{{ bgw_node.name }}: vtysh config"
  ansible.builtin.copy:
    dest: "/etc/frr/gw-{{ fab_name }}/vtysh.conf"
    content: ""
    force: false
    owner: frr
    group: frrvty
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"

# the file holds the BGP session password: never shown. The desired configuration (frr.conf.shc): FRR rewrites its
# frr.conf after every reload, so comparing against that would always see a change
- name: "{{ bgw_node.name }}: FRR configuration"
  ansible.builtin.template:
    src: frr-gateway.conf.j2
    dest: "/etc/frr/gw-{{ fab_name }}/frr.conf.shc"
    owner: frr
    group: frr
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_frrconf
  no_log: true

- name: "{{ bgw_node.name }}: is the gateway instance running"
  ansible.builtin.command: "systemctl is-active shc-gw@{{ fab_name }}"
  register: _cg_active
  changed_when: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: start the gateway instance (enabled at boot)"
  ansible.builtin.systemd:
    name: "shc-gw@{{ fab_name }}.service"
    enabled: true
    daemon_reload: "{{ _cg_files is changed }}"
    state: >-
      {{ 'started' if _cg_active.stdout != 'active'
         else ('restarted' if (_cg_daemons is changed or _cg_unit_changed | bool) else omit) }}
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_state

# one retry: some changes take two passes (FRR 8.5 refuses `bgp graceful-restart` -> `bgp graceful-restart-disable` in
# one reload, "not valid at this moment", yet ends in the new state; the second reload has nothing left to change)
- name: "{{ bgw_node.name }}: reload the FRR configuration"
  ansible.builtin.systemd:
    name: "shc-gw@{{ fab_name }}.service"
    state: reloaded
  when:
    - _cg_active.stdout == 'active'
    - _cg_daemons is not changed and not (_cg_unit_changed | bool)
    - _cg_frrconf is changed
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_reload
  retries: 1
  delay: 5
  until: _cg_reload is succeeded

# the core side must come up: IS-IS adjacency with the root and the VPNv4 session to the route reflector; with the
# IPv6 core (cg_pe.loopback6) also IPv6 forwarding in the namespace, VPNv6 negotiated with the route reflector and its
# IPv6 loopback installed from IS-IS (prints ipv6Vpn=<state> for the node record)
- name: "{{ bgw_node.name }}: wait for the core (IS-IS, VPNv4 and VPNv6) and the upstream route reflectors"
  ansible.builtin.shell: |
    set -e
    V="vtysh -N gw-{{ fab_name }}"
    # MPLS input on the core leg (a reload that disagreed with the kernel turned it off once)
    [ "$(ip netns exec gw-{{ fab_name }} sysctl -n net.mpls.conf.core0.input)" = 1 ]
    $V -c 'show isis neighbor' | grep -q ' Up '
    $V -c 'show bgp ipv4 vpn summary json' | python3 -c '
    import json, sys
    p = json.load(sys.stdin).get("peers", {}).get(sys.argv[1], {})
    sys.exit(0 if p.get("state") == "Established" else 1)' {{ cg_root_pe.loopbackIp }}
    $V -c 'show bgp l2vpn evpn summary json' | python3 -c '
    import json, sys
    peers = json.load(sys.stdin).get("peers", {})
    sys.exit(0 if all(peers.get(r, {}).get("state") == "Established" for r in sys.argv[1:]) else 1)' {{ fab_spec.siteUnderlay.upstreamRouteReflectors | default([]) | join(' ') }}
    $V -c 'show vrf vni json' | python3 -c '
    import json, sys
    up = {v.get("vrf"): str(v.get("state", "")).lower() for v in json.load(sys.stdin).get("vrfs", [])}
    sys.exit(0 if all(up.get(n) == "up" for n in sys.argv[1:]) else 1)' {{ cg_vrfs | map(attribute='vrf') | join(' ') }}
    {% if cg_pe.loopback6 | default('') | length > 0 %}
    [ "$(ip netns exec gw-{{ fab_name }} sysctl -n net.ipv6.conf.all.forwarding)" = 1 ]
    python3 -c '
    import ipaddress, json, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def main(argv, run):
        """argv: <vtysh pathspace> <route reflector IPv4 loopback> <its IPv6 loopback>. Prints ipv6Vpn=<state>; exits 1
        while VPNv6 to the route reflector is not negotiated or its IPv6 loopback is not an installed IS-IS route."""
        pathspace, rr, rr6 = argv[0], argv[1], argv[2]
        show = lambda c: json.loads(run(["vtysh", "-N", pathspace, "-c", c]) or "{}")
        # "summary established" lists only the sessions that are up AND negotiated the address family; the plain summary
        # says Established for every session that is up, negotiated or not
        errors = []
        if rr in show("show bgp ipv6 vpn summary established json").get("peers", {}):
            state = "Established"
        else:
            s = show("show bgp ipv6 vpn summary json").get("peers", {}).get(rr, {}).get("state", "")
            state = "NoNeg" if s == "Established" else (s or "NotActivated")
            errors.append("VPNv6 to %s: %s" % (rr, state))
        lo6 = str(ipaddress.ip_address(rr6)) + "/128"
        if not any(r.get("protocol") == "isis" and r.get("selected") and r.get("installed")
                   for r in show("show ipv6 route isis json").get(lo6, [])):
            errors.append("the route reflector IPv6 loopback %s is not an installed IS-IS route" % lo6)
        for e in errors:
            print(e, file=sys.stderr)
        print("ipv6Vpn=" + state)
        return 1 if errors else 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' gw-{{ fab_name }} {{ cg_root_pe.loopbackIp }} "{{ cg_root_pe.loopbackIp6 | default('') }}"
    {% endif %}
  args:
    executable: /bin/bash
  register: _cg_verify
  retries: 18
  delay: 10
  until: _cg_verify.rc == 0
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

# FRR 8.5: a VRF deleted and created again under the same name (a placement's VNI used again) can keep zebra's old binding of
# its VPN label: bgpd exports the label, but zebra never installs it into the kernel, so traffic from the core for the
# VRF is dropped. Every VRF must have an MPLS route into it; a VRF without one gets its label bound again (label vpn
# export off and on, so the running configuration ends unchanged). Per address family: each family of a VRF has its
# own label (`show bgp ipv4|ipv6 vpn json detail`; the VRF table JSON has no label): the gateway's own VPN table shows
# it on paths leaked from the VRF (nhVrfName, remoteLabel) except for routes that came from EVPN, i.e. the site's,
# so the label is also read where the core sees it, on the route reflector (the root FRR of this node: the paths
# from this gateway's loopback under the VRF's RD). Only the family whose label has no route is bound again, under
# that family; a family with no exported route yet needs one more MPLS route into the VRF. A VRF without the IPv6
# family is checked as before (any MPLS route into it, IPv4 bound again). Same check code as the root's
# (python3 -c '<code>' <pathspace> <netns> <loopback> <vrf>:<families>:<rd> ...).
- name: "{{ bgw_node.name }}: every VRF's VPN label leads into it"
  ansible.builtin.shell: |
    {% set _vrfs = [] %}
    {% for v in cg_vrfs %}
    {% set _ = _vrfs.append(v.vrf ~ ':' ~ (v.families | default([4], true) | join(',')) ~ ':'
       ~ ((cg_fabric.spec.domainAsn ~ ':' ~ v.vni) if cg_fabric.spec.domainAsn | int <= 65535
          else (cg_pe.loopbackIp ~ ':' ~ (v.vni | int % 65536)))) %}
    {% endfor %}
    bad() {
    python3 -c '
    import json, re, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def kernel(text):
        """The MPLS table (ip -f mpls route): every device a line names, and per device the labels routed into it."""
        devs, into = set(), {}
        for line in text.splitlines():
            names = re.findall(r" dev (\S+)", line)
            devs.update(names)
            m = re.match(r"(\d+) ", line)
            if m:
                for d in names:
                    into.setdefault(d, set()).add(int(m.group(1)))
        return devs, into


    def paths(o):
        """Every path object (a dict with remoteLabel) below o."""
        if isinstance(o, dict):
            if "remoteLabel" in o:
                yield o
            for x in o.values():
                yield from paths(x)
        elif isinstance(o, list):
            for x in o:
                yield from paths(x)


    def own_labels(text):
        """VRF -> labels, from the own VPN table (show bgp ipv4|ipv6 vpn json detail): a path leaked from a VRF names it
        in nhVrfName and carries its label vpn export as remoteLabel. FRR 8.5 prints no remoteLabel on a path whose
        origin is an EVPN route (a gateway site route): those labels come from the route reflector."""
        found = {}
        for p in paths(json.loads(text or "{}")):
            if "nhVrfName" in p:
                found.setdefault(str(p["nhVrfName"]), set()).add(int(p["remoteLabel"]))
        return found


    def peer_labels(text, peer):
        """RD -> labels of the paths the route reflector holds from peer (its VPN table, json detail: routes,
        routeDistinguishers, <rd>, <prefix>, paths with peer.peerId and remoteLabel)."""
        found = {}
        rds = json.loads(text or "{}").get("routes", {}).get("routeDistinguishers", {})
        for rd, sub in rds.items():
            for p in paths(sub):
                if str((p.get("peer") or {}).get("peerId", "")) == peer:
                    found.setdefault(rd, set()).add(int(p["remoteLabel"]))
        return found


    def main(argv, run):
        """argv: <vtysh pathspace or ""> <netns or ""> <own loopback, the peer address the route reflector sees, or ""> then
        <vrf>:<families>[:<rd>] per VRF. Prints "<vrf> <family>" per address family whose label has no MPLS route into
        the VRF."""
        pathspace, netns, peer = argv[0], argv[1], argv[2]
        vrfs = []
        for spec in argv[3:]:
            name, fams, rd = (spec.split(":", 2) + ["", ""])[:3]
            vrfs.append((name, sorted({int(f) for f in (fams or "4").split(",") if f}), rd))
        if not vrfs:
            return 0
        ip = ["ip"] + (["-n", netns] if netns else [])
        vtysh = ["vtysh"] + (["-N", pathspace] if pathspace else [])
        devs, into = kernel(run(ip + ["-f", "mpls", "route"]))
        own, rr = {}, {}
        if any(6 in f for _, f, _ in vrfs):
            for fam in (4, 6):
                show = "show bgp ipv%d vpn json detail" % fam
                own[fam] = own_labels(run(vtysh + ["-c", show]))
                rr[fam] = {}
                if peer and pathspace:
                    # the route reflector (the root FRR on this node): unreadable means unseen, not an error
                    try:
                        rr[fam] = peer_labels(run(["vtysh", "-c", show]), peer)
                    except (OSError, ValueError, subprocess.CalledProcessError):
                        pass
        for name, fams, rd in vrfs:
            if 6 not in fams:
                # IPv4 only: any MPLS route into the VRF (unchanged)
                if name not in devs:
                    print(name, 4)
                continue
            have = into.get(name, set())
            known = {}
            for f in fams:
                labels = own[f].get(name, set()) | rr[f].get(rd, set())
                if labels:
                    known[f] = labels
            for f in sorted(known):
                if not known[f] <= have:
                    print(name, f)
            # a family that exports no route yet shows no label: it needs a route into the VRF that the other family
            # label does not account for (each family has its own label)
            unseen = [f for f in fams if f not in known]
            claimed = set().union(*known.values()) if known else set()
            if unseen and len(have - claimed) < len(unseen):
                for f in unseen:
                    print(name, f)
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' gw-{{ fab_name }} gw-{{ fab_name }} {{ cg_pe.loopbackIp }} {{ _vrfs | join(' ') }}
    }
    # the families still without their MPLS route after up to <tries> checks 5 s apart (in $b)
    settle() {
      for i in $(seq "$1"); do b=$(bad) || return 1; [ -z "$b" ] && return 0; sleep 5; done
      b=$(bad)
    }
    settle 3 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
    rebound=""
    if [ -n "$b" ]; then
      while read -r v f; do
        vtysh -N gw-{{ fab_name }} -c 'configure terminal' -c "router bgp {{ cg_fabric.spec.domainAsn }} vrf $v" -c "address-family ipv$f unicast" \
          -c 'no label vpn export auto' -c 'label vpn export auto' -c 'end' >/dev/null
        rebound="$rebound $v/ipv$f"
      done <<< "$b"
      settle 6 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
      if [ -n "$b" ]; then
        while read -r v f; do echo "VRF $v: its IPv$f VPN label has no MPLS route into it, even after binding it again" >&2; done <<< "$b"
        exit 1
      fi
    fi
    echo "rebound=$rebound"
  args:
    executable: /bin/bash
  register: _cg_labels
  changed_when: _cg_labels.stdout is search('rebound=.')
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: read the gateway's sessions"
  ansible.builtin.shell: |
    vtysh -N gw-{{ fab_name }} -c 'show bgp l2vpn evpn summary json' 2>/dev/null | python3 -c '
    import ipaddress, json, sys
    d = json.load(sys.stdin); net = ipaddress.ip_network(sys.argv[1], strict=False)
    up = [p for p, v in d.get("peers", {}).items() if v.get("state") == "Established"]
    print(json.dumps({"site": sum(1 for p in up if ipaddress.ip_address(p) in net),
                      "upstream": sum(1 for p in up if ipaddress.ip_address(p) not in net)}))' {{ fab_spec.siteUnderlay.cidr }}
  register: _cg_sessions
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

# transport wireguard: the node's public key and each peer's last handshake (never the private key: no `wg show dump`)
- name: "{{ bgw_node.name }}: read the tunnel"
  ansible.builtin.shell: |
    D={{ cg_instance.wireguard.device }}; X="ip netns exec gw-{{ fab_name }}"
    python3 - "$($X wg show $D public-key)" "$($X wg show $D listen-port)" <<EOF
    import json, subprocess, sys, time
    def show(what):
        out = subprocess.run(["ip", "netns", "exec", "gw-{{ fab_name }}", "wg", "show", "$D", what],
                             capture_output=True, text=True).stdout.split("\n")
        return dict(l.split("\t", 1) for l in out if "\t" in l)
    hs, ep = show("latest-handshakes"), show("endpoints")
    now = int(time.time())
    peers = [{"publicKey": k, "endpoint": ep.get(k, "(none)"), "latestHandshake": int(v),
              "up": int(v) > 0 and now - int(v) < 180} for k, v in sorted(hs.items())]
    print(json.dumps({"publicKey": sys.argv[1], "listenPort": int(sys.argv[2]), "peers": peers}))
    EOF
  args:
    executable: /bin/bash
  register: _cg_tunnel
  changed_when: false
  when: cg_instance.wireguard is defined
  delegate_to: "{{ bgw_node.name }}"

# "<vrf> <family> <routes>" per VRF: IPv4, and IPv6 too with the IPv6 core
- name: "{{ bgw_node.name }}: read the VRFs' routes"
  ansible.builtin.shell: |
    for v in {{ cg_vrfs | map(attribute='vrf') | join(' ') }}; do
      for f in 4{{ ' 6' if cg_pe.loopback6 | default('') | length > 0 else '' }}; do
        printf '%s %s ' "$v" "$f"; vtysh -N gw-{{ fab_name }} -c "show bgp vrf $v ipv$f unicast json" 2>/dev/null \
          | python3 -c 'import json, sys; print(len(json.load(sys.stdin).get("routes", {})))' 2>/dev/null || echo 0
      done
    done
  register: _cg_vrf_routes
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: record the node"
  vars:
    _s: "{{ _cg_sessions.stdout | from_json }}"
    _tun: "{{ (_cg_tunnel.stdout | from_json) if (_cg_tunnel.stdout | default('', true) | length > 0) else {} }}"
    # a tunnel is up while at least one peer handshook within the last 3 minutes
    _tun_state: "{{ ('up' if _tun.peers | default([]) | selectattr('up') | list | length > 0 else 'down') if _tun | length > 0 else '' }}"
    _v6: "{{ cg_pe.loopback6 | default('') | length > 0 }}"
    # IPv4 only: {"<vrf>": n}; with the IPv6 core: {"<vrf>": {"4": n, "6": m}}
    _vr: >-
      {%- set out = {} -%}
      {%- for l in _cg_vrf_routes.stdout_lines | default([]) if l.split() | length == 3 -%}
        {%- set w = l.split() -%}
        {%- if _v6 | bool -%}
          {%- set _ = out.update({w[0]: (out[w[0]] | default({})) | combine({w[1]: w[2] | int})}) -%}
        {%- elif w[1] == '4' -%}
          {%- set _ = out.update({w[0]: w[2] | int}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _ipv6vpn: >-
      {{ ((_cg_verify.stdout_lines | default([]) | select('match', '^ipv6Vpn=') | list | last | default('='))
          .split('=', 1) | last) if _v6 | bool else '' }}
  ansible.builtin.set_fact:
    cg_node_results: >-
      {{ cg_node_results + [{
           'name': bgw_node.name, 'address': cg_node_addr, 'ready': true,
           'siteSessions': _s.site | int, 'upstreamSessions': _s.upstream | int, 'coreSessions': 1,
           'vrfs': cg_vrfs | length, 'vrfRoutes': _vr, 'ipv6Vpn': _ipv6vpn | trim,
           'message': 'gateway instance gw-' ~ fab_name ~ ': VPNv4' ~ (' and VPNv6' if _v6 | bool else '') ~ ' to '
                      ~ cg_root_pe.loopbackIp ~ ', IS-IS SR SID ' ~ cg_pe.sid ~ ', loopback ' ~ cg_pe.loopbackIp
                      ~ ((' ' ~ cg_pe.loopbackIp6 | default('')) if _v6 | bool else '')
                      ~ ((', tunnel ' ~ _tun_state) if _tun | length > 0 else ''),
           'lastAppliedAt': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')}
           | combine({'tunnel': _tun_state} if _tun | length > 0 else {})] }}
    cg_wg_nodes: >-
      {{ (cg_wg_nodes | default([])) + ([_tun | combine({'name': bgw_node.name})] if _tun | length > 0 else []) }}
    cg_changed_nodes: >-
      {{ cg_changed_nodes + ([bgw_node.name] if [_cg_files, _cg_conf, _cg_apply, _cg_daemons, _cg_frrconf, _cg_state]
         | select('changed') | list | length > 0 else []) }}
