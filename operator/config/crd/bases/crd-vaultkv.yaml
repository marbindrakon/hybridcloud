apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultkvs.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "5"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: VaultKV
    listKind: VaultKVList
    plural: vaultkvs
    singular: vaultkv
    shortNames:
      - vkv
    categories:
      - shc
      - shc-tenant
      - shc-services
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A KV secrets engine: a set of secrets in the tenant's Vault with access for the tenant's
            access groups, comparable to a set of AWS Secrets Manager secrets or an Azure Key Vault.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The secrets engine and who gets which access.
              type: object
              required:
                - vault
              properties:
                vault:
                  description: Name of the Vault (Vault object) in this namespace.
                  type: string
                vaultAdminRbac:
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can manage the
                    secrets and their policies.
                  type: array
                  items:
                    type: string
                vaultReaderRbac:
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can read the secrets.
                  type: array
                  items:
                    type: string
                vaultOpsRbac:
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can create, read,
                    change and delete secrets, but not change policies.
                  type: array
                  items:
                    type: string
                vaultDeveloperRbac:
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can read secrets and
                    create new ones, but not delete them.
                  type: array
                  items:
                    type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                kvPath:
                  description: Mount path of the secrets engine in the Vault.
                  type: string
                adminPolicy:
                  description: Vault policy name for admin access
                  type: string
                readerPolicy:
                  description: Vault policy name for reader access
                  type: string
                adminRbacGroups:
                  description: Sign-in groups mapped to the admin policy.
                  type: array
                  items:
                    type: string
                readerRbacGroups:
                  description: Sign-in groups mapped to the reader policy.
                  type: array
                  items:
                    type: string
                opsRbacGroups:
                  description: Sign-in groups mapped to the ops policy.
                  type: array
                  items:
                    type: string
                developerRbacGroups:
                  description: Sign-in groups mapped to the developer policy.
                  type: array
                  items:
                    type: string
                loginUrl:
                  description: URL to sign in to this secrets engine.
                  type: string
                vaultUrl:
                  description: URL of the parent Vault instance
                  type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Vault
          type: string
          jsonPath: .spec.vault
        - name: KV Path
          type: string
          jsonPath: .status.kvPath
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
