# An app project (Project): application namespaces for the team on its cluster. Not an OpenStack
# project and not a Google Cloud project. The access fields (available with this release) give
# access groups rights on this app project on the services cluster: projectAdmin may change and
# delete it, projectDeveloperRbac may change it, projectViewerRbac may view it.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Project
metadata:
  name: example-app
  namespace: entity-example-corp
spec:
  displayName: Example application
  description: Namespaces of the example application.
  projectAdmin:
    - example-admins
  projectDeveloperRbac:
    - example-developers
  projectViewerRbac:
    - example-auditors
