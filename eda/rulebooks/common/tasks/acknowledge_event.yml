---
# shc (LAB-PLAN §11.1, design/DELIVERY-HARDENING.md §3.2/§3.3): first thing in every job playbook
# (pre_tasks). For an event with an eventId it writes "AAP job started" through patch_cr_status, which
# records status.delivery.acknowledgedEventId/jobId/jobStartedAt - or ends the job, successfully,
# when a newer request superseded this event. Events without an eventId (older operators) skip this.
# The roles' own "Announce AAP job started" tasks only ran with env TOWER_JOB_ID, which AAP 2.6 jobs
# don't have, so nothing acknowledged before.
- name: Acknowledge the event
  when:
    - event_payload is defined
    - event_payload is mapping
    - (event_payload.eventId | default('')) | length > 0
    - event_payload.regarding is defined
  block:
    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: resolve_services_cluster_connection.yml

    - name: Mark the job started (or end it when superseded)
      ansible.builtin.include_tasks: patch_cr_status.yml
      vars:
        cr_api_version: "{{ event_payload.regarding.apiVersion }}"
        # CRD plurals in this group: kind lowercased + s (Entity -> entities)
        cr_plural: "{{ event_payload.regarding.kind | lower | regex_replace('y$', 'ie') }}s"
        cr_name: "{{ event_payload.regarding.name }}"
        cr_namespace: "{{ event_payload.regarding.namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: reconciling
          ready: false
          message: AAP job started
