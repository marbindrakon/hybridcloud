---
# shc (design/P7-PLAN.md §12.3, H2): how this platform realizes a HybridFabric. The CRs state intent; these are
# the realization's own parameters: border gateway nodes are Linux hosts reached over SSH, each node runs the
# fabric root (VPNv4 route reflector) and one network namespace per CloudGateway (a provider edge: EVPN-VXLAN on
# the site side, IS-IS segment routing + MPLS L3VPN over a node-local core bridge on the fabric side).
# realization models these roles implement
fabric_realization_models: [linux-pe]
# An installation overrides any of it with the sovereign-localhost inventory variable `fabric_realization`
# (aap-config env FABRIC_REALIZATION, JSON), and per fabric under fabric_realization.fabrics.<name>.
fabric_realization_defaults:
  # which realization drives the border gateway: linux-pe = RHEL hosts with FRR (this platform's implementation).
  # Another model (e.g. a vendor router OS) would add its own node tasks; the CRs stay the same.
  model: linux-pe
  # route target values per HybridNetwork between the gateways (<domainAsn>:<value>); must stay clear of the
  # fabric's VNI pools so a VPN route target never equals a site route target
  vpnTargetPool: {start: 10000, end: 10999}
  # standard community <domainAsn>:<value> on the routes gateways originate into a site; never taken back
  gatewayCommunity: 999
  # standard community <domainAsn>:<value> on the routes a gateway originates for its own site only (its unreachable
  # IPv6 default while the network has no IPv6 egress, the covering routes): never exported into the network's VPN,
  # where an unreachable default of one site would compete with the egress default
  gatewayLocalCommunity: 997
  gateway:
    # per address family: only the placements' prefixes (and the host routes inside them) enter a VRF from the
    # site, so a site router can't put another prefix into a tenant's network. Off for a family: the site's routes
    # of that family pass unfiltered (only the gateways' own routes, gatewayCommunity, are refused)
    siteImportFilter:
      ipv4: false
      ipv6: true
    # milliseconds between ICMPv6 error messages a gateway namespace sends to one destination; 0 = no per-destination
    # limit (the kernel's global limit of 1000 messages a second still applies); "" = the kernel default (1000, after
    # a burst of six). A site's IPv6 traffic to destinations the fabric does not offer is answered with "unreachable"
    # by the gateway, and a guest connecting to a name with many addresses sends its attempts milliseconds apart:
    # every one must get its answer, or the guest waits a full retransmit
    icmp6RateLimitMs: 0
    # announce each border gateway node's ICMPv6 source (core.icmpSource6) to the site in every VRF with IPv6: a /128
    # route that stays out of the network's VPN, so the site returns traffic for a node's own address to that node
    # rather than to whichever node its ECMP picks (ping and traceroute from a gateway node, ping to a node's ICMPv6
    # source name). Only with the IPv6 core and core.icmpSource6. Whether on or off, IPv6 to the node itself from a
    # VRF is filtered statelessly, as a host with no open port answers: ICMPv6 and TCP segments with ACK or RST pass
    # (no connection tracking: "with ACK or RST" stands in for "established"), every other TCP segment gets a reset,
    # UDP a port unreachable, the rest is dropped
    announceIcmpSource6: true
    # per site (CloudInfrastructure name: true or false): overrides announceIcmpSource6 for that site's gateway
    announceIcmpSource6BySite: {}
  core:
    bridge: br-core
    loopbackPool: 10.255.0.0/24
    linkSubnet: 10.255.1.0/24
    isisArea: "49.0001"
    srgb: {start: 16000, end: 23999}
    # IPv6 transport of the core (dual-stack core): each root and gateway namespace gets an IPv6 /128 loopback in
    # the same IS-IS (with its own prefix SID), the core legs carry IPv6 link-local only, and the IPv6 VPN routes
    # use that loopback as next hop (FRR installs no labelled IPv6 route over an IPv4 next hop). The BGP sessions
    # stay on the IPv4 loopbacks. Empty = IPv4-only core: nothing IPv6 is rendered or applied. Take a range that
    # is never advertised outside the core (at least a /120; provider-edge index i gets address i).
    loopbackPool6: ""
    # SR index of a provider edge's IPv6 loopback = its IPv4 index + this offset; offset + highest index must stay
    # inside the SRGB
    sidOffset6: 1000
    # source of the ICMPv6 errors a VRF sends (Packet Too Big, Time Exceeded, Unreachable): a /128 per namespace
    # per node on every VRF device (network address + (node position << 16) + provider-edge index); announced to
    # the sites while gateway.announceIcmpSource6 is on for them. At least a /96, clear of loopbackPool6. A tenant
    # prefix may not overlap it (it is one of the exclusive ranges below, added automatically). Empty = none
    icmpSource6: ""
    # source of the IPv4 ICMP errors the root's VRFs send toward a network (fragmentation needed, time exceeded): one
    # IPv4 address, held on every root VRF device of every node; with it the egress VRF's errors toward a network
    # leave from the node's hand-off address (egress.nodes.<node>.address). So the errors never leave from a
    # link-local address of the egress link (sites drop some:
    # OVN-Kubernetes reserves part of 169.254.0.0/16). Never announced; a tenant prefix may not overlap it (added to
    # the exclusive ranges automatically). Default 192.0.0.8, the IPv4 dummy address (RFC 7600) the gateways' kernels
    # already send their errors from. Empty = the kernel's choice (the first address of the VRF's devices)
    icmpSource4: 192.0.0.8
    # VPN transport of the core, one for the fabric (every node's root and all its gateway namespaces): mpls = IS-IS
    # segment routing and MPLS L3VPN (labels over the loopbacks' node SIDs); srv6 = SRv6 L3VPN, one SID per VRF
    # (End.DT46, IPv4 and IPv6) from the provider edge's locator in core.srv6.block, the VPN sessions over the IPv6
    # loopbacks. srv6 needs the dual-stack core (loopbackPool6) and core.srv6.block. A running node is not switched
    # in place: after a change re-apply the nodes and restart their FRR instances (or reboot them)
    transport: mpls
    srv6:
      # the SID block: a /32 inside 5f00::/16 (the SRv6 SID space), never announced outside the core. Micro-SIDs
      # (block 32, node 16, function 16 bits): a provider edge's locator is the /48 with node id
      # (node position << 8) + provider-edge index, so it is unique across the nodes although the loopbacks repeat;
      # node position and index each at most 255. Packets addressed into the block are taken only from the core
      # leg. Empty = no SRv6
      block: ""
  nodes:
    trunkInterface: bond1
    sshUser: root
    # the lease fabric-config-<fabric> (coordination.k8s.io, in the fabric's namespace) that lets one job at a time
    # change the border gateway nodes: the fabric's job, its gateways' jobs and their teardowns. A lease not renewed
    # for durationSeconds (its holder crashed) is taken over by a job waiting for it; a job waits at most waitSeconds,
    # which must be longer. The holder renews it before each node, before and after its long waits, and before a step
    # that can run for minutes when less is left than that step may need. Every attempt of a node step ends after
    # stepTimeoutSeconds, cut to what the lease has left less a 60 s margin, and a step does not start with less than
    # 30 s of that: so a step's work, which goes on after a timeout until the job ends its SSH sessions, and a systemd
    # job it starts (systemdJobSeconds: the longest a start, stop, restart or reload of the node's FRR or a gateway
    # instance can take under the units' own limits, a restart's stop up to twice TimeoutSec=2m), ends before the
    # lease does. After a step timed out the job keeps the lease and lets it run out; other failures release it at
    # once. Each a positive whole number of seconds; the lease is refused when durationSeconds is below
    # max(stepTimeoutSeconds, systemdJobSeconds) + 120 or waitSeconds is not longer than durationSeconds + 15. Raise
    # them together on nodes where a single step takes minutes (an FRR reload of a very large configuration, a VPN
    # label check over very large VPN tables).
    configLease:
      durationSeconds: 600
      waitSeconds: 1200
      stepTimeoutSeconds: 180
      systemdJobSeconds: 360
    # after FRR (the root or a gateway instance) started or reloaded its configuration file, the job records the file
    # as loaded only when the running configuration holds all of it (frr-reload.py --test): a reload can end without
    # an error and part of the file unapplied. Lines left fail the job and the next run reloads again; lines that a
    # second start or reload leaves as well are recorded as loaded and reported (FRR does not take them). ignore: more
    # patterns (Python regular expressions) for lines the nodes' FRR always shows differently, matched against the
    # line and against "<context>: <line>"; enabled false records after any successful start or reload, unchecked
    frrLoadCheck:
      enabled: true
      ignore: []
  # the fabric health check (job template fabric-health): every intervalSeconds it reads each border gateway node
  # once over SSH (no lease; never while the lease is held or a fabric event is in flight; a read a job overlapped is
  # discarded) and changes nothing there: the units of the configuration and whether they start at boot, the
  # configuration's start at boot and why it failed, the routing daemons and their crashes, drift against what the
  # last apply and the last routing configuration load left on the node, the IPv6 egress sessions, the gateways'
  # site sessions; and the platform address pools. It writes status.health and the conditions NodesHealthy and
  # Degraded on the HybridFabric and its CloudGateways (a gateway of a paused site reads Unknown/SitePaused and is
  # not read), refreshes the IPv6 egress state and the pool rows, raises events on transitions, and wakes the
  # fabric's or a gateway's job for what a full run repairs. Cost per run: one job for all fabrics, one SSH session
  # per node, one status write per fabric (the gateways' only when their health changed).
  health:
    # off for one fabric (fabrics.<name>.health.enabled false) while its border gateway nodes are off on purpose:
    # nothing is read, the fabric and its gateways read NodesHealthy Unknown/NotChecked and no alert fires
    enabled: true
    # the job template's schedule (one value for the installation; at least 300) and the base of the stale alert
    intervalSeconds: 600
    # the limit on one node's read, on the node (each command in it has its own limit of 15 s)
    nodeReadTimeoutSeconds: 60
    # drift wakes the job only after this many consecutive checks found it (a failed or disabled unit at once)
    wakeAfterChecks: 2
    # no second wake of the same object within this
    wakeBackoffMinutes: 60
    # a routing daemon crash is reported for this long
    daemonRestartWindowMinutes: 60
    # a Warning event of an outage that lasts is repeated at most this often (IPv6EgressUpstreamDown)
    eventRepeatMinutes: 60
    # what is checked (each true by default)
    # (serviceSessions: each node with a platform circuit has an established session with the hub's network)
    checks: {units: true, routingDaemons: true, drift: true, upstream: true, siteSessions: true, serviceSessions: true,
             pools: true}
  openstack:
    # platform-owned project on OpenStack sites for the placements' networks and routers (shared to tenants)
    platformProject: hybrid-fabric
    # the Keystone domain of that project on every OpenStack site; "" = the site's own openstack.projectDomain
    # (CloudInfrastructure spec)
    projectDomain: ""
  openshift:
    # OpenShift sites: the FRRConfigurations (labels) whose BGP sessions to the site's gateway carry the placements'
    # routes; empty selects every FRRConfiguration of the site
    frrConfigurationSelector: {}
    # tenant sign-in on OpenShift sites: the site's OIDC client in the tenant realm (the cluster's OAuth uses it).
    # A CloudVirt's Rbac CRs become client roles <entity>.<rbac> of that client, mapped to the Rbac's Keycloak group;
    # the client puts the user's roles into the groups claim, and the VM namespaces bind edit/view to those groups.
    tenantSignIn:
      realm: sovereign-tenants
      clientId: "openshift-{cluster}"
      # name of the sign-in button on the site's login page (the site OAuth identity provider of the client
      # above); read from the site when it can be, else this; empty = the realm name
      idpName: ""
      editRole: edit
      viewRole: view
  # address management of the HybridNetworks (files/shc_ipam.py): where each network's space and its placements'
  # subnets are kept; ledger = the fabric's ledger (the only provider so far)
  ipam:
    provider: ledger
    # platform address pools (HybridNetwork spec.platformPrefixes): <pool>: {family, prefixes, reserved (never
    # given out), blockLengths (the block sizes offered), defaultBlock (when a network names no size), holdDownDays
    # (a released block is not given out again for this long; default below), perTenantBlocks (blocks per Entity;
    # absent = no limit), perTenantOverrides ({entity: blocks})}. None by default: a network asking for platform
    # address space is then refused (FamilyUnavailable). One pool per family per fabric (fabrics.<name>.ipam).
    publicPools: {}
    holdDownDays: 7
  # HybridNetwork address space: a tenant prefix (spec.prefixes) overlapping one of these ranges, in either
  # direction, is refused (PrefixReserved). Every ipam.publicPools prefix, core.icmpSource6 and core.srv6.block are
  # added to the list automatically.
  # An installation lists the platform's own globally routed space and its translation prefixes here.
  network:
    exclusiveRanges: []
  placement:
    # how long a placement job waits for the gateways to hold the site's routes for its prefixes (s)
    routeWait: 180
    # address families a placement may ask for, per backend kind; per site (CloudInfrastructure name)
    # ipFamiliesBySite overrides it. A family is offered at a site only when the site's probe also reports it
    # (CloudInfrastructure status.capabilities); spec.ipv6 elsewhere fails FamilyUnavailable.
    ipFamilies: {CloudVirt: [4], CloudOSO: [4], CloudAWS: [4], CloudGCP: [4]}
    ipFamiliesBySite: {}
    # sites (CloudInfrastructure name: true) that offer placements without IPv4 (IPv6-only)
    ipv6OnlyBySite: {}
    # per site: the IPv6 subnet sources it offers (Network, Provider); default ipv6.sources of the backend kind
    ipv6SourcesBySite: {}
    ipv6:
      # IPv6 subnet sources the product supports per backend kind (spec.ipv6.source)
      sources: {CloudVirt: [Network], CloudOSO: [Network], CloudAWS: [Network, Provider], CloudGCP: [Provider]}
      # the source of a placement that names none, per backend kind (Network when the kind is not listed)
      defaultSource: {CloudAWS: Network, CloudGCP: Provider}
      # the IPv6 subnet size of a placement that names none, per backend kind
      defaultPrefixLength: {CloudAWS: 60}
      # backend kinds that cannot carry IPv6 prefixes the tenant provides (spec.prefixes)
      tenantPrefixes: {CloudGCP: false}
      # how workloads get their IPv6 addresses, per backend kind: on OpenStack sites the IPv6 subnets' RA and
      # address mode (fixed when the subnet is created; empty = the site's default); on OpenShift sites
      # informational (the cluster network hands out addresses by stateful DHCPv6); shown in the placement's status
      addressMode: {CloudOSO: dhcpv6-stateful, CloudVirt: dhcpv6-stateful}
    # per site (CloudInfrastructure name): resolver addresses of either family handed to the site's placement
    # subnets (OpenStack dns_nameservers, each subnet taking the addresses of its own family); a site not listed
    # leaves the subnets on the site's default
    resolversBySite: {}
    # per site (CloudInfrastructure name): {url: "https://..."} of the site's router advertisement service, which
    # holds the advertisement of floating IPs on a placed network for the placement and cluster jobs. Empty = none:
    # a site without an entry has no service and the documented site requirement for floating IPs applies
    routerAdvertisementBySite: {}
    # ranges of a site the allocator steps around, per backend kind, besides the site underlay and (OpenShift) the
    # cluster's cluster and service networks: OVN-Kubernetes' join (100.64.0.0/16), Layer2 user-defined network
    # join (100.65.0.0/16), transit switch (100.88.0.0/16) and masquerade (169.254.0.0/17) subnets and their IPv6
    # counterparts; on AWS the ranges Amazon keeps for itself in a VPC's IPv6 space
    siteReserved:
      CloudVirt: [100.64.0.0/16, 100.65.0.0/16, 100.88.0.0/16, 169.254.0.0/17, fd69::/112, fd97::/64, fd98::/64,
                  fd99::/64]
      CloudOSO: []
      CloudAWS: [fd00::/16, 2001:db8::/32]
      CloudGCP: []
  # translation for placements without IPv4, per site (CloudInfrastructure name): {pref64 (the translator's /96),
  # dns64Resolvers (IPv6 resolvers that synthesize answers inside pref64)}; a site not listed offers none
  # (capabilities.ipv6Translation false). An IPv6-only placement of a network with platform IPv6 and internet access
  # gets both in its status (status.ipv6.translation; an OpenStack site also puts the resolvers on the placement's
  # IPv6 subnet); the IPv6 egress filter admits the resolvers on port 53 and denies the private IPv4 ranges of
  # egress.denyDestinations inside every pref64
  translation: {}
  # tenant DNS of the platform's own records
  dns:
    # reverse DNS of the platform's IPv6 space. Generic: no reverse zone, so nothing below happens.
    reverse6:
      # the reverse zones the platform owns under ip6.arpa (e.g. "8.b.d.0.1.0.0.2.ip6.arpa" for 2001:db8::/32). The
      # site job of the site that hosts the global tenant zone (the DNSConfig's) creates them in the DNSConfig's
      # Designate project, with the zone attributes of that site's dns settings (pool scheduling, e.g. public), and
      # records them in status.realization.dns.reverseZones. A platform address outside every zone gets no PTR
      # (provider-assigned space and tenant prefixes have their reverse DNS elsewhere).
      zones: []
      # the label under which gateway names are published: the IPv6 gateway of a placement is
      # <network>.<gatewayLabel>.<environment zone>, the ICMPv6 source of a border gateway node in a gateway namespace
      # <node>.<gateway>.<gatewayLabel>.<global tenant domain>; both get an AAAA and the matching PTR (forward-confirmed)
      gatewayLabel: gateways
      # the TTL of these records (seconds)
      ttl: 3600
      # how old the tenant DNS controller's last successful reconcile on a site may be before the site reports it
      staleMinutes: 30
  # CloudGateways over transport wireguard (remote sites): each node's tunnel listens on listenPort (unless the
  # gateway sets one); the tunnel's MTU is the site leg's MTU unless siteUnderlay.mtu says otherwise (1420 = a 1500
  # path minus WireGuard over IPv4); keepalives keep NAT state open
  wireguard:
    listenPort: 51820
    mtu: 1420
    persistentKeepalive: 25
  # address ranges of the deployment's own networks (either family). No tenant address space, edge connection route
  # or cluster network may overlap them; tenants see them as reserved (with the other ranges they may not use).
  infrastructure:
    # the networks the platform's management (cluster installation and management) connects from. Empty = none
    hub: []
  # the service VRF: the platform's management reaches the clusters it builds on tenant networks through it, handed
  # off to the hub's network by AttachmentCircuits of ceKind platform (an eBGP session per node and circuit: the service
  # range in, the clusters' prefixes out). A network takes part from its first cluster on: its VRF on every node gets
  # a veth pair (se<vpnTarget> in the network's VRF, so<vpnTarget> in the service VRF) on its root index's service link
  # (the upper half of egress.linkPool) over which it learns the service range from the service VRF (announced into
  # the network's VPN only while the node holds it from a platform circuit), and the service VRF a route to each of the
  # cluster's prefixes; the nftables table ip shc_service admits, statelessly (the two directions may cross different
  # nodes), from the hub only the service range to the clusters' prefixes on ports, and from a network only packets
  # to the service range (replies from those ports, connections to hubEndpoints). IPv4 only. Needs
  # attachments.enabled, an IPv4 infrastructure.hub range and service.range.
  service:
    enabled: false
    # the VRF on every node's root (not the egress VRF's name, not e<digits>) and its table (not 253-255, not the
    # egress VRF's, below egress.networkTableBase)
    vrf: {name: service, table: 9001}
    # the hub's IPv4 addresses the service VRF carries (an address is written /32), each inside an infrastructure.hub
    # range (it may be the same): the only sources admitted toward the clusters, the only destinations a cluster
    # reaches through the service VRF, the only routes taken from the hub's routers and offered to the networks.
    # Required with service.enabled (check-fabric names it when empty)
    range: []
    # TCP ports the hub may open toward a cluster's prefixes
    ports: [6443, 443]
    # destinations inside service.range the clusters may open TCP connections to: [{prefix, ports}] (e.g. the hub's
    # API). Empty = none: the clusters reach the hub by their network's own outbound path
    hubEndpoints: []
    # IPv4 ranges a cluster's prefixes must lie in to enter the service VRF, as an allow-list for the hub's network
    # (status.ceConfig gives them as "<range> le 32"). Empty = any IPv4 prefix the other checks admit, first come
    # first served: then the reserved ranges (infrastructure.hub, network.exclusiveRanges and the others published)
    # must cover everything the hub's network routes itself, since the hub's routers accept any other prefix up to /32
    # from the platform and would prefer a cluster's address over their own route to the same address
    attachableRanges: []
    # the most cluster prefixes the platform announces to the hub's network over a platform circuit (its
    # maximum-prefix, status.ceConfig.maxPrefixes); later ones wait, first come first served, until earlier ones go
    maxPrefixes: 1000
  # attachment circuits (AttachmentCircuit on a ProviderEdge of platform frr): each circuit gets a VLAN from vlanPool
  # on its bearer and the next /linkPrefixLength of linkPool (node i takes host address i+1, the CE the next one);
  # the network's root VRF on every node peers with the CE over that VLAN. providerEdges.<edge>.bearers.<bearer>
  # names the node interface carrying the bearer's VLANs and its MTU.
  attachments:
    enabled: false
    vlanPool: {start: 3000, end: 3099}
    linkPool: 10.255.128.0/20
    linkPrefixLength: 29
    # IPv6 on circuits: empty = circuits are IPv4 only (IPv6 accept entries are refused with FamilyUnavailable). An
    # IPv6 prefix of at least a /64: a circuit with IPv6 accept entries gets the /64 at its link index (node i
    # ::<i+1>, the CE the next) and a second BGP session over it
    linkPool6: ""
    # the platform's own IPv6 infrastructure ranges (e.g. the part of its routed space that holds linkPool6 and the
    # core's IPv6 ranges): a CE's IPv6 routes never reach into them, like linkPool6, core.loopbackPool6,
    # core.icmpSource6, core.srv6.block and the translation prefixes
    reserved6: []
    # central Vault KV path (mount central) for each circuit's BGP password
    secretPath: "fabric/circuits/{entity}/{name}"
    # minutes before a session closed for too many prefixes (maxPrefixes action teardown) is tried again; 0 = it
    # stays down until the circuit changes
    maxPrefixRestart: 2
    providerEdges: {}
    # AS numbers the platform keeps for its own sessions; a circuit's CE may not use one (PeerAsnReserved)
    reservedAsns: []
  # provider internet egress for HybridNetworks with spec.egress.internet: each node's root holds a VRF that hands
  # traffic to a network with internet access (a macvlan on parentInterface, default route via gateway); per network
  # a VRF e<vpnTarget> imports the network's routes, exports a default route into its VPN and source-NATs its traffic
  # to one address per node (natPool + the network's egress index from the ledger). Destinations in
  # denyDestinations (unless in allowDestinations) aren't reachable this way; nothing reaches a network unsolicited.
  egress:
    enabled: false
    vrf: {name: egress, table: 9000}
    # Linux table of a network's VRF = networkTableBase + vpnTarget
    networkTableBase: 100000
    # veth /31s between a network's VRF and the egress VRF, by egress index (the root index of the network); with the
    # service VRF on, the pool's lower half holds these and its upper half the service links (below), so the root
    # indexes are at most a quarter of the pool's addresses
    linkPool: 169.254.0.0/16
    parentInterface: ""       # an existing interface on every node (e.g. a VLAN device of the trunk)
    gateway: ""               # the next hop on that network
    prefixLength: 24
    mtu: 9000
    # per node (borderGateway.nodes[].name): {address, natPool}; natPool inside address/prefixLength
    nodes: {}
    denyDestinations: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12,
                       192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3]
    allowDestinations: []
    # IPv6 internet egress (routed, platform-assigned space only); off: the networks' IPv6 egress reads NotOffered.
    # On: the egress VRF of every node speaks eBGP (asn) with the upstream routers on the hand-off network, sends them
    # the placement prefixes of the networks with internet egress (IPv6 from the platform) and takes their default
    # route; per network the root VRF e<vpnTarget> gains an IPv6 session over its veth (the default route reaches the
    # network's VPN only while an upstream sends it) and the nftables table inet shc_egress6 admits outbound traffic
    # only from the network's platform block and inbound only replies and ICMPv6 errors. Needs the dual-stack core
    # (core.loopbackPool6).
    ipv6:
      enabled: false
      # the platform's globally routed IPv6 space (the platform address pools lie inside it): only prefixes inside
      # it, longer than it and at most /64, are announced upstream; the whole of it is discarded at the egress VRF
      # and in every network VRF, so unallocated space never loops; a source inside it arriving from upstream is
      # dropped. The gateways announce it (and each network's own IPv6 prefixes) into the sites, backed by an
      # unreachable route, so space the fabric does not route fails fast at the gateway
      routedPrefixes: []
      # the egress VRF's own AS toward the upstream routers (not domainAsn, not an upstream's)
      asn: 0
      # the upstream routers on the hand-off network: [{address, asn}]; one single-hop eBGP session each per node,
      # timers 10/30, no BFD, no password; in: the default route only; out: the placement prefixes
      upstream: []
      # per node (borderGateway.nodes[].name): {address: <address/length on the hand-off network>}
      nodes: {}
      # the smallest MTU on the way to the internet: IPv6 MTU of the hand-off device (the node itself sends Packet
      # Too Big) and the TCP MSS clamp (wanMtu - 60) on the networks' veths
      wanMtu: 1420
      # prefixes accepted from each upstream (the default plus the external site prefixes) and from each network
      maxPrefixesUpstream: 10
      maxPrefixesNetwork: 1000
      # each network's IPv6 internet traffic leaves and returns through one primary node (the filter is stateful):
      # the node at position (egress index mod number of nodes). The standby node marks its IPv6 default route with
      # <domainAsn>:<standbyCommunity> (the gateways announce it to the sites with standbyLocalPref) and prepends
      # its own AS standbyPrepend times toward the upstream
      standbyCommunity: 998
      standbyLocalPref: 50
      standbyPrepend: 2
      # a node whose upstream sessions are all down for this long is reported as an event on the HybridFabric; the
      # networks read Degraded for IPv6 egress meanwhile
      sessionDownAlertMinutes: 5
      # destinations never reachable through the IPv6 egress unless listed in allowDestinations6 (the IANA
      # special-purpose ranges); an installation adds its own address space here
      denyDestinations6: ["::/128", "::1/128", "::ffff:0:0/96", "64:ff9b::/96", "64:ff9b:1::/48", "100::/64",
                          "2001::/23", "2001:db8::/32", "2002::/16", "3fff::/20", "5f00::/16", "fc00::/7",
                          "fe80::/10", "ff00::/8"]
      allowDestinations6: []
      # resolver addresses reachable on port 53 only (TCP and UDP), also when inside denyDestinations6 (the DNS64
      # resolvers of every translation.<site> entry are added to these automatically)
      resolverDestinations6: []
      # (the IPv4 destinations of egress.denyDestinations stay unreachable through a translator: for every
      # translation prefix (translation.<site>.pref64) their embedded forms are denied before the allow list)
      # per network ("<namespace>/<name>": [prefixes]): sources inside routedPrefixes that legitimately arrive from
      # upstream (a site reached through the upstream rather than the fabric); filled by the platform's automation
      externalSitePrefixes: {}
