---
- block:
    - name: Get current timestamp
      ansible.builtin.set_fact:
        networkplacement_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark NetworkPlacement as awaiting EDA delete
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          message: Awaiting EDA delete
          lastReconciledAt: "{{ networkplacement_delete_transition_time }}"

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "NetworkPlacementDeleteRequested"
        operator_event_action: "Delete"
        operator_event_note: "{{ _hybridsovereign_redhat_networkplacement.spec | to_json }}"
        operator_reporting_controller: networkplacement-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: NetworkPlacement
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_networkplacement.metadata.uid }}"

    - name: Wake the CRs this one was holding up (deletion complete)
      ansible.builtin.include_role:
        name: _common
        tasks_from: nudge_referenced
      vars:
        nudge_targets:
          - kind: "{{ _hybridsovereign_redhat_networkplacement.spec.backend.kind | default('CloudOSO') }}"
            name: "{{ _hybridsovereign_redhat_networkplacement.spec.backend.name | default('') }}"
          - kind: HybridNetwork
            name: "{{ _hybridsovereign_redhat_networkplacement.spec.network | default('') }}"
      when: _hybridsovereign_redhat_networkplacement.status.deletionComplete | default(false) | bool

    - name: Exit cleanly when EDA completed deletion
      ansible.builtin.meta: end_host
      when: _hybridsovereign_redhat_networkplacement.status.deletionComplete | default(false) | bool

    - name: Block finalizer until EDA completes deletion
      ansible.builtin.fail:
        msg: Waiting for EDA to complete deletion

  rescue:
    - name: Mark NetworkPlacement delete as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Deletion failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal finalizer failure
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ ansible_operator_meta.name }} deletion failed — see status.message for details"
