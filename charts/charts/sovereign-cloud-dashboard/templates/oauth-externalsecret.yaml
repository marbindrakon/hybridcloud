{{- if .Values.oauthProxy.externalSecret.enabled }}
---
# Pulls cookie-secret and client-secret from Vault into the oauth-client k8s Secret.
# Vault path must contain: cookie_secret and client_secret keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dashboard.name" . }}-oauth-client
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.oauthProxy.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.oauthProxy.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.oauthProxy.externalSecret.secretStoreName | default "vault-backend" }}
  target:
    name: {{ include "dashboard.name" . }}-oauth-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.oauthProxy.externalSecret.vaultPath }}
        property: client_secret
        conversionStrategy: Default
    - secretKey: cookie-secret
      remoteRef:
        key: {{ .Values.oauthProxy.externalSecret.vaultPath }}
        property: cookie_secret
        conversionStrategy: Default
{{- end }}
