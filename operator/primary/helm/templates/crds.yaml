apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudgateways.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudGateway
    listKind: CloudGatewayList
    plural: cloudgateways
    singular: cloudgateway
    shortNames:
      - cgw
      - sitegw
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A site gateway: attaches one site (a CloudInfrastructure with EVPN) to a HybridFabric,
            comparable to a transit gateway attachment. The gateway runs on every border gateway
            node: on the site side it is the route reflector of the site's EVPN domain and the
            endpoint for each tenant network placed there; on the fabric side it connects those
            networks to the same networks on the other sites. One CloudGateway per site.
            Platform-owned.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required: [fabricRef, cloudRef, siteUnderlay]
              x-kubernetes-validations:
                - rule: "(has(self.transport) && self.transport == 'wireguard') || has(self.siteUnderlay.vlan)"
                  message: siteUnderlay.vlan is required with transport none
                - rule: "(has(self.transport) && self.transport == 'wireguard') == has(self.wireguard)"
                  message: spec.wireguard is required with transport wireguard, and only then
              properties:
                fabricRef:
                  type: object
                  description: The HybridFabric (same namespace) the gateway joins. Immutable.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.fabricRef is immutable
                  properties:
                    name:
                      description: Name of the referenced object.
                      type: string
                      minLength: 1
                      maxLength: 253
                cloudRef:
                  type: object
                  description: >-
                    The CloudInfrastructure (same namespace) whose EVPN domain the gateway terminates. The site must
                    report the evpn capability. Immutable.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.cloudRef is immutable
                  properties:
                    name:
                      description: Name of the referenced object.
                      type: string
                      minLength: 1
                      maxLength: 253
                transport:
                  type: string
                  enum: [none, wireguard]
                  default: none
                  description: >-
                    How the site's underlay reaches the border gateway nodes. none: the site's underlay VLAN is
                    trunked to the nodes directly (siteUnderlay.vlan). wireguard: a remote site over an encrypted
                    tunnel from every node (spec.wireguard); siteUnderlay.cidr is then the tunnel's subnet, holding
                    the nodes' tunnel addresses and the site's VTEPs.
                wireguard:
                  type: object
                  description: >-
                    The tunnel to a remote site (transport wireguard). Every border gateway node keeps its own key
                    pair (public keys in status.wireguard) and tunnels to each peer listed here. For a site whose
                    edge the platform runs (CloudInfrastructure type aws) the platform supplies the peers; leave
                    peers empty.
                  properties:
                    listenPort:
                      type: integer
                      minimum: 1024
                      maximum: 65535
                      description: The nodes' UDP port. Default 51820.
                    peers:
                      type: array
                      description: The remote site's tunnel endpoints.
                      items:
                        type: object
                        required: [publicKey, allowedIPs]
                        properties:
                          publicKey:
                            type: string
                            pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
                            description: The peer's WireGuard public key (base64).
                          endpoint:
                            type: string
                            maxLength: 261
                            description: >-
                              host:port the nodes connect to. Without it the peer must connect first (the nodes then
                              answer from where it came).
                          allowedIPs:
                            type: array
                            minItems: 1
                            description: The peer's tunnel addresses (CIDRs inside siteUnderlay.cidr).
                            items:
                              type: string
                              maxLength: 43
                          persistentKeepalive:
                            type: integer
                            minimum: 0
                            maximum: 3600
                            description: Seconds between keepalives (keeps NAT state open). Default 25; 0 turns it off.
                siteUnderlay:
                  type: object
                  description: The gateway's attachment to the site's EVPN underlay.
                  required: [cidr, addresses]
                  x-kubernetes-validations:
                    - rule: >-
                        !isCIDR(self.cidr) || self.addresses.all(a, isIP(a.address) && cidr(self.cidr).containsIP(a.address))
                      message: every address must be an IP address inside cidr
                    - rule: "!has(self.gateway) || !isCIDR(self.cidr) || (isIP(self.gateway) && cidr(self.cidr).containsIP(self.gateway))"
                      message: gateway must be an IP address inside cidr
                    - rule: >-
                        !has(self.upstreamRouteReflectors) || !isCIDR(self.cidr)
                        || self.upstreamRouteReflectors.all(r, cidr(self.cidr).containsIP(r)) || has(self.gateway)
                      message: upstream route reflectors outside cidr need a gateway
                  properties:
                    vlan:
                      type: integer
                      minimum: 1
                      maximum: 4094
                      description: VLAN of the site's underlay on the border gateway trunk interface.
                    cidr:
                      type: string
                      maxLength: 43
                      description: >-
                        The site's VTEP subnet. The gateway accepts the site's BGP sessions from this range.
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 4
                          message: cidr must be an IPv4 prefix
                    addresses:
                      type: array
                      description: >-
                        The gateway's address on the site underlay on each border gateway node (one per node, inside
                        cidr). The site's VTEPs peer with every one of them.
                      minItems: 1
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [node]
                      items:
                        type: object
                        required: [node, address]
                        properties:
                          node:
                            type: string
                            maxLength: 63
                            description: Border gateway node name (HybridFabric spec.borderGateway.nodes).
                          address:
                            type: string
                            maxLength: 39
                            description: IPv4 address of the gateway instance on that node.
                    mtu:
                      type: integer
                      minimum: 1280
                      maximum: 9216
                      description: >-
                        MTU of the gateway's underlay interface. Default: the trunk interface's MTU. Must carry the
                        fabric's overlayMtu + 50 bytes.
                    gateway:
                      type: string
                      maxLength: 39
                      description: >-
                        IPv4 next hop on the underlay VLAN for destinations outside cidr. Needed only to reach
                        upstream route reflectors outside cidr.
                    upstreamRouteReflectors:
                      type: array
                      description: >-
                        Existing BGP route reflectors of the site's EVPN domain that the gateway joins as a client:
                        for a site that keeps its own route reflectors, or while its VTEPs move to the gateway.
                        The gateway also accepts the site's VTEPs directly in either case. Empty: the gateway is the
                        site's only route reflector.
                      maxItems: 4
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 39
                        x-kubernetes-validations:
                          - rule: isIP(self) && ip(self).family() == 4
                            message: each upstream route reflector must be an IPv4 address
                bfd:
                  type: boolean
                  default: true
                  description: >-
                    Bidirectional Forwarding Detection on the site's BGP sessions, so the site stops using a failed
                    node within about a second.
                bgp:
                  type: object
                  description: Overrides of the fabric's BGP settings for this site.
                  properties:
                    passwordRef:
                      type: object
                      description: Vault KV path holding the site's TCP MD5 session password (key password).
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          description: Path of the secret in the platform's secret store.
                          type: string
                          minLength: 1
                          maxLength: 512
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                site:
                  type: object
                  description: The attached site as resolved by the last provision.
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    evpn:
                      type: boolean
                  x-kubernetes-preserve-unknown-fields: true
                realization:
                  type: object
                  description: How the platform realized the gateway (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                wireguard:
                  type: object
                  description: The tunnel (transport wireguard).
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    nodes:
                      type: array
                      description: Per border gateway node, its public key and listen port, and each peer's last handshake.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                nodes:
                  type: array
                  description: State of the gateway instance on each border gateway node.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                      ready:
                        type: boolean
                      siteSessions:
                        type: integer
                        description: Site BGP sessions established.
                      coreSessions:
                        type: integer
                        description: Sessions established toward the border gateway.
                      upstreamSessions:
                        type: integer
                        description: Sessions established with upstream route reflectors.
                      message:
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending gateway waits for.
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
