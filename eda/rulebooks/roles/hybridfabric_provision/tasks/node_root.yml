---
# shc (design/P7-PLAN.md P7.3.4): the border gateway root instance on one node (delegated over SSH, become).
# Input: bgw_node {name, address}, hf_root (instance config), hf_pe (provider-edge addresses), fab_spec, hf_egress,
# hf_attach (attachments-plan; a node's circuit with IPv6 carries address6, link6, sources6 and egress6 into the apply
# JSON as they are), hf_circuit_passwords.
# Appends {name, ready, message, lastAppliedAt} to hf_node_results and the node's name to hf_changed_nodes when
# anything on it changed.
# Runs under the lease fabric-config-<fabric>, renewed here before the node and before and after the wait for BGP and
# IS-IS (realization nodes.configLease), and before the unit start, the apply and the FRR start and reload when less
# is left than they may need (fabric_lease_ensure.yml); a renewal that finds the lease lost fails the job before the
# next step. The renewals set their own timeout: the node loop's step limit (common/vars/fabric_lease.yml) never
# stops them.
- name: "{{ bgw_node.name }}: renew the border gateway configuration lease"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
  vars:
    fab_ledger: {action: lease-renew, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}", holder: "{{ hf_holder }}",
                 step: "the root instance on {{ bgw_node.name }}"}
  timeout: 0

- name: "{{ bgw_node.name }}: the node's egress plan and attachment circuits"
  ansible.builtin.set_fact:
    hf_node_egress: "{{ (hf_egress.nodes | default({})).get(bgw_node.name, {}) }}"
    hf_node_attach: "{{ (hf_attach.nodes | default({})).get(bgw_node.name, {}) }}"
    hf_node_vrfs: "{{ (hf_attach.vrfs | default({})).get(bgw_node.name, []) }}"

# a circuit's IPv6 routes reach the sites only as IPv6 VPN routes, which need the dual-stack core (the IPv6 loopback
# is their next hop); the planner offers IPv6 on circuits only with it, so this is a guard, not a policy
- name: "{{ bgw_node.name }}: IPv6 on attachment circuits needs the IPv6 core"
  ansible.builtin.fail:
    msg: >-
      HybridFabric {{ fab_name }} on {{ bgw_node.name }}: attachment circuit(s)
      {{ hf_node_attach.circuits | selectattr('address6', 'defined') | map(attribute='circuit') | join(', ') }}
      carry IPv6, but the core has no IPv6 loopback for this node
  when:
    - hf_node_attach.circuits | default([]) | selectattr('address6', 'defined') | list | length > 0
    - hf_pe.loopback6 | default('') | length == 0

# the node's core transport (fab_node_transport) and FRR (fab_frr_major); requires FRR, and on an srv6 node what the
# SRv6 core needs, before anything on the node changes
- name: "{{ bgw_node.name }}: the core transport and FRR on this node"
  ansible.builtin.include_tasks: node_transport.yml
  vars:
    nt_who: "HybridFabric {{ fab_name }}"

# the root's SRv6 locator differs per node (the node's position in borderGateway.nodes); only on the SRv6 core
- name: "{{ bgw_node.name }}: the root's SRv6 locator on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: 1
      nodeOrdinal: "{{ (fab_spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: stop on an SRv6 locator that does not fit"
  ansible.builtin.fail:
    msg: >-
      HybridFabric {{ fab_name }} on {{ bgw_node.name }}: {{ (fab_check_result.errors | default([]) | join('; '))
      or 'the realization gives no SRv6 locator for this node' }}
  when:
    - fab_node_transport == 'srv6'
    - fab_check_result.errors | default([]) | length > 0 or fab_check_result.locator | default('', true) | length == 0

- name: "{{ bgw_node.name }}: the root's SRv6 locator"
  ansible.builtin.set_fact:
    hf_pe: "{{ hf_pe | combine({'locator': fab_check_result.locator, 'locatorNode': fab_check_result.locatorNode}) }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: install the fabric apply script and unit"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-fabric-apply, dest: /usr/local/sbin/shc-fabric-apply, mode: "0755"}
    - {src: shc-fabric-apply@.service, dest: /etc/systemd/system/shc-fabric-apply@.service, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_files

- name: "{{ bgw_node.name }}: load the MPLS modules at boot"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/shc-fabric.conf
    content: "# shc fabric: MPLS for the provider-edge core\nmpls_router\nmpls_iptunnel\n"
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_modules
  # the SRv6 core uses no MPLS
  when: fab_node_transport | default('mpls') == 'mpls'

# a node that ran the MPLS core before keeps that file, and would load the MPLS modules at every boot for nothing
- name: "{{ bgw_node.name }}: no MPLS modules at boot on the SRv6 core"
  ansible.builtin.file:
    path: /etc/modules-load.d/shc-fabric.conf
    state: absent
  delegate_to: "{{ bgw_node.name }}"
  when: fab_node_transport | default('mpls') == 'srv6'

- name: "{{ bgw_node.name }}: instance config directory"
  ansible.builtin.file:
    path: /etc/shc-fabric
    state: directory
    mode: "0755"
  delegate_to: "{{ bgw_node.name }}"

# the ICMPv6 source of the root's VRFs differs per node (the node's position in borderGateway.nodes)
- name: "{{ bgw_node.name }}: the root's ICMPv6 source on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: 1
      nodeOrdinal: "{{ (fab_spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when: fab_real.core.icmpSource6 | default('', true) | length > 0

- name: "{{ bgw_node.name }}: stop on an ICMPv6 source that does not fit"
  ansible.builtin.fail:
    msg: "HybridFabric {{ fab_name }} on {{ bgw_node.name }}: {{ fab_check_result.errors | join('; ') }}"
  when:
    - fab_real.core.icmpSource6 | default('', true) | length > 0
    - fab_check_result.errors | default([]) | length > 0

# the core's IPv6 keys are empty strings on an IPv4-only core; loopbackPool6 and icmpSource6 let the apply remove
# addresses an earlier configuration left inside those ranges. On an srv6 node transport and srv6 {block, locator}
# (absent: mpls, so an mpls node's file stays as it was)
- name: "{{ bgw_node.name }}: root instance config"
  vars:
    _hf_icmp6: "{{ fab_check_result.icmp6 if fab_real.core.icmpSource6 | default('', true) | length > 0 else '' }}"
  ansible.builtin.copy:
    dest: /etc/shc-fabric/root.json
    content: >
      {{ hf_root | combine({'egress': (hf_node_egress | combine({'ipv6': hf_node_egress.ipv6 | combine({'icmp6': _hf_icmp6})})
                                        if hf_node_egress.ipv6 is defined else hf_node_egress)}
                            if hf_node_egress | length > 0 else {})
         | combine({'attachments': hf_node_attach} if hf_node_attach | length > 0 else {})
         | combine({'loopback6': hf_pe.loopback6 | default(''), 'icmp6': _hf_icmp6,
                    'loopbackPool6': fab_real.core.loopbackPool6 | default('', true),
                    'icmpSource6': fab_real.core.icmpSource6 | default('', true)})
         | combine({'transport': 'srv6', 'srv6': {'block': fab_real.core.srv6.block, 'locator': hf_pe.locator}}
                   if fab_node_transport | default('mpls') == 'srv6' else {}) | to_nice_json }}
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_rootconf

# bgpd drops a neighbor's BFD session (bfdd) only while the neighbor's VRF still exists in the kernel. When the apply
# deletes a root VRF first, the reload then removes its BGP instance but the session stays in bfdd for good (FRR 8.5.3,
# seen after circuit teardowns). So the BGP instances of root VRFs that go away are removed here, before the apply
# (or a start of the root unit) deletes their kernel VRFs; the reload then has nothing left to remove for them
- name: "{{ bgw_node.name }}: remove the BGP instances of root VRFs that go away (before their kernel VRFs)"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl -q is-active frr || exit 0
    want=" {{ hf_node_vrfs | map(attribute='vrf') | join(' ') }} "
    for v in $(vtysh -c 'show bgp vrfs json' | jq -r '.vrfs // {} | keys[]' | grep -E '^e[0-9]+$' || true); do
      case "$want" in *" $v "*) continue ;; esac
      vtysh -c 'configure terminal' -c "no router bgp {{ fab_spec.domainAsn }} vrf $v" && echo "removed $v"
    done
  args:
    executable: /bin/bash
  register: _hf_vrfgone
  changed_when: "'removed ' in _hf_vrfgone.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: the lease lasts for the root instance's unit start"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the root instance's unit start on {{ bgw_node.name }}"
  timeout: 0

# A start that fails (the apply under the unit refused or failed) is judged by the next step, which takes the apply's
# own reason from the unit's journal: systemd's message ("Unable to start service …") names none, and the journal is
# out of reach once the job has left the node. A step that runs out of time still fails here (a timeout overrides
# failed_when)
- name: "{{ bgw_node.name }}: run the root instance at boot (and now)"
  ansible.builtin.systemd:
    name: shc-fabric-apply@root.service
    enabled: true
    state: started
    daemon_reload: "{{ _hf_files is changed }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_unit
  failed_when: false

# the unit is active (its apply succeeded), or the job fails with the apply's own reason: the lines it printed under
# this start ("shc-fabric-apply: …", what the apply refuses on either transport, or "transport srv6: …", what only
# the SRv6 core refuses), else systemd's message. Read only
- name: "{{ bgw_node.name }}: the root instance runs, or why not"
  ansible.builtin.shell: |
    u=shc-fabric-apply@root.service
    s=$(systemctl is-active "$u")
    [ "$s" = active ] && exit 0
    echo "state=$s"
    inv=$(systemctl show -p InvocationID --value "$u")
    if [ -n "$inv" ]; then journalctl -o cat --no-pager "_SYSTEMD_INVOCATION_ID=$inv"; else journalctl -o cat --no-pager -n 50 -u "$u"; fi \
      | grep -E '^(transport srv6|shc-fabric-apply): ' | tail -n 5
    exit 1
  args:
    executable: /bin/bash
  register: _hf_unit_state
  changed_when: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: stop when the root instance did not start"
  vars:
    _why: "{{ _hf_unit_state.stdout_lines | default([]) | select('match', '^(transport srv6|shc-fabric-apply): ') | list }}"
  ansible.builtin.fail:
    msg: >-
      HybridFabric {{ fab_name }} on {{ bgw_node.name }}: the root instance (shc-fabric-apply@root.service) did not
      start: {{ (_why | join('; ')) if _why | length > 0
                else (_hf_unit.msg | default('', true) or (_hf_unit_state.stdout_lines | default(['unknown']) | first)) }}
  when: _hf_unit_state.rc | default(1) != 0

- name: "{{ bgw_node.name }}: the lease lasts for the apply"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the apply on {{ bgw_node.name }}"
  timeout: 0

# A host interface that still learns from router advertisements makes the apply skip the root's IPv6 side (a boot keeps
# the IPv4 service); here that is a failure the operator has to look at. The apply runs under a limit on the node 15 s
# below the step's own: past it, timeout ends the apply and what it started (rc 124), an ordinary failure on a quiet
# node, so the lease is released at once
- name: "{{ bgw_node.name }}: apply the root instance"
  ansible.builtin.command: >-
    timeout -k 10 {{ [fab_lease_step_timeout | int - 15, 15] | max }} /usr/local/sbin/shc-fabric-apply root up
  register: _hf_apply
  changed_when: "'changed=yes' in _hf_apply.stdout"
  failed_when: _hf_apply.rc != 0 or 'IPv6 core not applied' in _hf_apply.stdout
  delegate_to: "{{ bgw_node.name }}"

# FRR runs what its last start or reload loaded. A job that wrote frr.conf or daemons and stopped before the reload
# (it failed, crashed, timed out or lost the lease) leaves files the next job finds unchanged, so the reload is also
# due while the files differ from what FRR last loaded: their digest, recorded in /etc/shc-fabric/root.frr-loaded
# after FRR took them. A node without that record (the first run with it) records the files as they are, before this
# run writes them: the assumption every run made before, so the upgrade alone reloads nothing
- name: "{{ bgw_node.name }}: what FRR last loaded (a node without the record: the files as they are)"
  ansible.builtin.shell: |
    f=/etc/shc-fabric/root.frr-loaded
    [ -s "$f" ] && exit 0
    cat /etc/frr/frr.conf /etc/frr/daemons 2>/dev/null | sha256sum | cut -d' ' -f1 > "$f.new" && mv "$f.new" "$f"
    echo recorded
  register: _hf_frr_seen
  changed_when: "'recorded' in _hf_frr_seen.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR daemons"
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^{{ item }}="
    line: "{{ item }}=yes"
  # bfdd: BFD on attachment circuits
  loop: "{{ ['bgpd', 'isisd'] + (['bfdd'] if fab_real.attachments.enabled | default(false) | bool else []) }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_daemons

- name: "{{ bgw_node.name }}: FRR configuration"
  ansible.builtin.template:
    src: frr-root.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_frrconf
  # the circuits' BGP passwords are in the file: no diff, no content in the log
  no_log: "{{ hf_circuit_passwords | default({}) | length > 0 }}"

- name: "{{ bgw_node.name }}: is a reload due (the files differ from what FRR last loaded)"
  ansible.builtin.shell: |
    now=$(cat /etc/frr/frr.conf /etc/frr/daemons 2>/dev/null | sha256sum | cut -d' ' -f1)
    was=$(cat /etc/shc-fabric/root.frr-loaded 2>/dev/null)
    if [ "$now" = "$was" ]; then echo reload=no; else echo reload=due; fi
  register: _hf_frr_due
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: is FRR running"
  ansible.builtin.command: systemctl is-active frr
  register: _hf_frr_active
  changed_when: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: the lease lasts for the FRR start"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the FRR start on {{ bgw_node.name }}"
  timeout: 0

# a new core bridge MAC is only seen by IS-IS after a restart
- name: "{{ bgw_node.name }}: start FRR (enabled at boot)"
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: >-
      {{ 'started' if _hf_frr_active.stdout != 'active'
         else ('restarted' if 'bridge-mac=changed' in _hf_apply.stdout else omit) }}
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_frr_state

- name: "{{ bgw_node.name }}: the lease lasts for the FRR reload"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the FRR reload on {{ bgw_node.name }}"
  timeout: 0

# a running FRR takes a new configuration through frr-reload (no session reset), and a newly enabled daemon (bfdd)
# the same way: the reload restarts watchfrr with the daemons file's list, which starts the missing daemon and
# leaves the running ones alone (FRR 8.5's frrinit.sh)
- name: "{{ bgw_node.name }}: reload the FRR configuration"
  ansible.builtin.systemd:
    name: frr
    state: reloaded
  when:
    - _hf_frr_active.stdout == 'active'
    - "'bridge-mac=changed' not in _hf_apply.stdout"
    - _hf_frrconf is changed or _hf_daemons is changed or 'reload=due' in _hf_frr_due.stdout
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_reload

# FRR runs the files when this job found it active and the reload (when one was due) succeeded, or when this job
# started or restarted it; a step above that failed ended the job before this. FRR that was starting or reloading on
# its own (activating, reloading: its automatic restart, or what a timed-out step began) may have read older files, so
# then nothing is recorded, nor while a job for it is still queued, and the next job finds the reload due
- name: "{{ bgw_node.name }}: record what FRR loaded"
  ansible.builtin.shell: |
    f=/etc/shc-fabric/root.frr-loaded
    state=$(systemctl is-active frr); job=$(systemctl show -p Job --value frr)
    if [ "$state" != active ] || [ -n "$job" ]; then echo "not recorded: frr $state${job:+, job $job}"; exit 0; fi
    now=$(cat /etc/frr/frr.conf /etc/frr/daemons 2>/dev/null | sha256sum | cut -d' ' -f1)
    [ "$now" = "$(cat "$f" 2>/dev/null)" ] && exit 0
    echo "$now" > "$f.new" && mv "$f.new" "$f"
    echo recorded
  register: _hf_frr_recorded
  changed_when: _hf_frr_recorded.stdout == 'recorded'
  when: _hf_frr_active.stdout == 'active' or (_hf_frr_active.stdout in ['inactive', 'failed'] and _hf_frr_state is changed)
  delegate_to: "{{ bgw_node.name }}"

# A root VRF the configuration no longer has (the egress VRF, or a network that lost its egress) stays in FRR after the
# reload: frr-reload removes the lines of its vrf stanza but never sends "no vrf", so zebra and the other daemons keep
# it as configured (show vrf: "vrf <name> inactive (configured)", nothing in the running configuration) until FRR
# restarts. The apply above already deleted its device, so FRR accepts the removal now; it touches no other VRF and
# no session. Only a VRF that zebra lists as inactive, that the rendered configuration does not name and that has no
# BGP instance left is removed. One that FRR refuses is reported and stays (inert: no device, no routes); the next
# job tries again. Same code as the gateway's (only the first line differs)
- name: "{{ bgw_node.name }}: remove from FRR the VRFs its configuration no longer has"
  ansible.builtin.shell: |
    u=frr.service; conf=/etc/frr/frr.conf; V=(vtysh)
    systemctl -q is-active "$u" && [ -r "$conf" ] || exit 0
    # whether the text on stdin names the VRF: its vrf stanza or a BGP instance in it
    named() {
      awk -v v="$1" '($1 == "vrf" && $2 == v) || ($1 == "router" && $2 == "bgp" && $4 == "vrf" && $5 == v) {f = 1} END {exit !f}'
    }
    vrfs=$("${V[@]}" -c 'show vrf') && run=$("${V[@]}" -c 'show running-config') \
      || { echo "the VRFs of the instance are unreadable; left to the next job" >&2; exit 0; }
    removed=""; kept=""
    for v in $(awk '$1 == "vrf" && $3 == "inactive" {print $2}' <<< "$vrfs"); do
      named "$v" < "$conf" && continue
      if named "$v" <<< "$run"; then
        kept="$kept $v"; echo "VRF $v: it still has a BGP instance; left to the next job" >&2; continue
      fi
      out=$("${V[@]}" -c 'configure terminal' -c "no vrf $v" 2>&1) && [[ $out != *%* ]] && { removed="$removed $v"; continue; }
      kept="$kept $v"; echo "VRF $v: FRR keeps it: ${out:-no reason given}" >&2
    done
    echo "removed=${removed# }"
    [ -z "$kept" ] || echo "kept=${kept# }"
  args:
    executable: /bin/bash
  register: _hf_vrfs_gone
  changed_when: _hf_vrfs_gone.stdout is search('removed=.')
  delegate_to: "{{ bgw_node.name }}"

# the fail-closed rule of the IPv6 egress (after the configuration reload: the filter table is loaded by the apply
# above and the sessions are in the configuration now): a timer unit that shuts the upstream sessions whenever the
# filter table is missing, and opens them again when it is back
- name: "{{ bgw_node.name }}: install the IPv6 egress guard"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-egress6-guard, dest: /usr/local/sbin/shc-egress6-guard, mode: "0755"}
    - {src: shc-egress6-guard.service, dest: /etc/systemd/system/shc-egress6-guard.service, mode: "0644"}
    - {src: shc-egress6-guard.timer, dest: /etc/systemd/system/shc-egress6-guard.timer, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_files
  when: hf_node_egress.ipv6 is defined

- name: "{{ bgw_node.name }}: run the IPv6 egress guard on its timer"
  ansible.builtin.systemd:
    name: shc-egress6-guard.timer
    enabled: true
    state: started
    daemon_reload: "{{ _hf_guard_files is changed }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_unit
  when: hf_node_egress.ipv6 is defined

- name: "{{ bgw_node.name }}: no IPv6 egress guard without IPv6 egress"
  ansible.builtin.shell: |
    changed=no
    if systemctl -q is-enabled shc-egress6-guard.timer 2>/dev/null || systemctl -q is-active shc-egress6-guard.timer 2>/dev/null; then
      systemctl disable --now shc-egress6-guard.timer; changed=yes
    fi
    for f in /etc/systemd/system/shc-egress6-guard.timer /etc/systemd/system/shc-egress6-guard.service /usr/local/sbin/shc-egress6-guard /run/shc-egress6-guard.shut; do
      [ -e "$f" ] && { rm -f "$f"; changed=yes; }
    done
    [ "$changed" = no ] || systemctl daemon-reload
    echo "changed=$changed"
  args:
    executable: /bin/bash
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_gone
  changed_when: "'changed=yes' in _hf_guard_gone.stdout"
  when: hf_node_egress.ipv6 is not defined

# SRv6 core: the guard is kept between jobs (core_guard_unit.yml); nothing of it on mpls
- name: "{{ bgw_node.name }}: keep the SRv6 core guard"
  ansible.builtin.include_tasks: core_guard_unit.yml
  vars:
    cgu_instance: root
  when: fab_node_transport | default('mpls') == 'srv6'

- name: "{{ bgw_node.name }}: renew the lease before the wait for BGP and IS-IS"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
  vars:
    fab_ledger: {action: lease-renew, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}", holder: "{{ hf_holder }}",
                 step: "the wait for BGP and IS-IS on {{ bgw_node.name }}"}
  timeout: 0

