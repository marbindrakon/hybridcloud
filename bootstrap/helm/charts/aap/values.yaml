operator:
  channel: stable-2.6
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: ansible-automation-platform-operator

namespace: aap

postgres:
  enabled: false
  # Backups of the database: a full backup and differential backups on a schedule (cron, UTC), and how many
  # full backups are kept. Older backups and the write-ahead log they need expire with each backup.
  backup:
    retentionFull: 2
    fullSchedule: "10 1 * * 0"
    differentialSchedule: "10 1 * * 1-6"

instance:
  enabled: true
  name: sovereign-aap

controller:
  enabled: true

eda:
  enabled: true

hub:
  enabled: false
