---
# ─── Read vault client secret for central keycloak ───────────────────────────
- name: Read vault client secret from central vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/central/data/keycloak-clients"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: [200]
  register: keycloak_clients_secret
  retries: 10
  delay: 10
  until: keycloak_clients_secret.status | default(0) == 200

- name: Set vault central client secret fact
  ansible.builtin.set_fact:
    vault_central_client_secret: "{{ keycloak_clients_secret.json.data.data.vault }}"

# ─── Central vault: enable and configure OIDC auth ───────────────────────────
- name: Check existing auth methods on central vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/auth"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: [200]
  register: central_vault_auth_methods
  retries: 5
  delay: 5
  until: central_vault_auth_methods.status | default(0) == 200

- name: Enable OIDC auth method on central vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/auth/{{ vault_oidc_mount }}"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: oidc
      description: "Keycloak OIDC authentication"
    status_code: [200, 204]
  when: (vault_oidc_mount + '/') not in central_vault_auth_methods.json
  retries: 3
  delay: 5

- name: Configure OIDC auth on central vault with central keycloak
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/{{ vault_oidc_mount }}/config"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      oidc_discovery_url: "{{ keycloak_central_url }}/realms/{{ keycloak_central_realm }}"
      oidc_client_id: "{{ vault_central_client_id }}"
      oidc_client_secret: "{{ vault_central_client_secret }}"
      default_role: "{{ oidc_role_name }}"
      oidc_discovery_ca_pem: "{{ central_ingress_ca_pem | default('') }}"
    status_code: [200, 204]
  retries: 3
  delay: 5

- name: Create OIDC role for sovereign-admin on central vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/{{ vault_oidc_mount }}/role/{{ oidc_role_name }}"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      role_type: oidc
      bound_audiences:
        - "{{ vault_central_client_id }}"
      user_claim: "sub"
      groups_claim: "groups"
      allowed_redirect_uris: "{{ vault_redirect_uris }}"
      # only members of the platform admin group get the admin policy; the realm's other users are refused
      bound_claims:
        groups:
          - "{{ vault_admin_group_claim }}"
      bound_claims_type: string
      policies:
        - "{{ admin_policy_name }}"
      ttl: "8h"
    status_code: [200, 204]
  retries: 3
  delay: 5

- name: Read back the central Vault admin role
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/{{ vault_oidc_mount }}/role/{{ oidc_role_name }}"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: [200]
  register: central_vault_admin_role

- name: The central Vault admin role is bound to the admin group
  ansible.builtin.assert:
    that:
      - (central_vault_admin_role.json.data.bound_claims | default({}, true)).groups | default([]) == [vault_admin_group_claim]
    fail_msg: "central Vault role {{ oidc_role_name }} is not bound to group {{ vault_admin_group_claim }}"
    quiet: true

- name: Create OIDC group alias mapping sovereign-admin → admin policy on central vault
  block:
    - name: Create or update external group for sovereign-admin on central vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/identity/group"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          name: "{{ vault_admin_group }}"
          type: external
          policies:
            - "{{ admin_policy_name }}"
        status_code: [200, 204]
      retries: 3
      delay: 5

    - name: Lookup sovereign-admin group by name to get canonical ID
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/identity/group/name/{{ vault_admin_group }}"
        method: GET
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        status_code: [200]
      register: admin_group_result
      retries: 3
      delay: 5

    - name: Get OIDC accessor for central vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth"
        method: GET
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        status_code: [200]
      register: central_auth_methods_for_accessor

    - name: Set OIDC accessor fact
      ansible.builtin.set_fact:
        oidc_accessor: "{{ central_auth_methods_for_accessor.json[vault_oidc_mount + '/'].accessor }}"

    # the alias is the claim value: the full group path the groups mapper emits (/sovereign-admin)
    - name: Create group alias for the sovereign-admin claim
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/identity/group-alias"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          name: "{{ vault_admin_group_claim }}"
          canonical_id: "{{ admin_group_result.json.data.id }}"
          mount_accessor: "{{ oidc_accessor }}"
        status_code: [200, 204]
      when: (admin_group_result.json.data.alias | default({}, true)).id | default('') | length == 0
      retries: 3
      delay: 5

    - name: Rename the group alias to the sovereign-admin claim value
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/identity/group-alias/id/{{ admin_group_result.json.data.alias.id }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          name: "{{ vault_admin_group_claim }}"
          canonical_id: "{{ admin_group_result.json.data.id }}"
          mount_accessor: "{{ oidc_accessor }}"
        status_code: [200, 204]
      when:
        - (admin_group_result.json.data.alias | default({}, true)).id | default('') | length > 0
        - admin_group_result.json.data.alias.name != vault_admin_group_claim
          or admin_group_result.json.data.alias.mount_accessor != oidc_accessor
      retries: 3
      delay: 5

# ─── Services vault: create vault client on services keycloak ─────────────────
- name: Configure OIDC on services vault
  when: vault_services_addr | length > 0 and vault_services_root_token | length > 0
  block:
    - name: Authenticate to services keycloak
      ansible.builtin.uri:
        url: "{{ keycloak_services_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ keycloak_services_admin_user }}"
          password: "{{ keycloak_services_admin_password }}"
        status_code: [200]
      register: kc_services_token_result
      retries: 5
      delay: 10
      until: kc_services_token_result.status | default(0) == 200

    - name: Set services keycloak admin token
      ansible.builtin.set_fact:
        kc_services_token: "{{ kc_services_token_result.json.access_token }}"

    - name: Check if vault client exists in sovereign-tenants realm
      ansible.builtin.uri:
        url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients?clientId={{ vault_services_client_id }}"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ kc_services_token }}"
        status_code: [200]
      register: vault_services_client_check
      retries: 5
      delay: 5
      until: vault_services_client_check.status | default(0) == 200

    - name: Create vault client in sovereign-tenants realm if not present
      ansible.builtin.uri:
        url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ kc_services_token }}"
          Content-Type: application/json
        body_format: json
        body:
          clientId: "{{ vault_services_client_id }}"
          name: "HashiCorp Vault Services"
          enabled: true
          publicClient: false
          standardFlowEnabled: true
          implicitFlowEnabled: false
          directAccessGrantsEnabled: false
          redirectUris: "{{ vault_services_keycloak_redirect_uris }}"
          webOrigins:
            - "+"
          protocolMappers:
            - "{{ vault_keycloak_groups_mapper }}"
        status_code: [201]
      register: vault_services_client_create
      when: vault_services_client_check.json | length == 0
      retries: 3
      delay: 5

    - name: Converge the existing vault client (exact callbacks, no password grant, groups claim)
      when: vault_keycloak_converge | bool and vault_services_client_check.json | length > 0
      block:
        - name: Read the vault client
          ansible.builtin.uri:
            url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients/{{ vault_services_client_check.json[0].id }}"
            method: GET
            validate_certs: false
            headers:
              Authorization: "Bearer {{ kc_services_token }}"
            status_code: [200]
          register: vault_services_client_full
          no_log: true

        - name: Work out what changes on the vault client
          vars:
            _cur: "{{ vault_services_client_full.json }}"
          ansible.builtin.set_fact:
            vault_client_fields: >-
              {{ (['redirectUris'] if (_cur.redirectUris | default([]) | sort | list) != (vault_services_keycloak_redirect_uris | sort | list) else [])
                 + (['directAccessGrantsEnabled'] if _cur.directAccessGrantsEnabled | default(false) | bool else []) }}
            vault_client_mapper: "{{ (_cur.protocolMappers | default([]) | selectattr('name', 'equalto', vault_keycloak_groups_mapper.name) | list + [{}]) | first }}"

        - name: Vault client changes
          ansible.builtin.debug:
            msg: >-
              {{ keycloak_services_realm }}/{{ vault_services_client_id }}:
              {{ (vault_client_fields + ([] if (vault_client_mapper.config | default({})).get('full.path') == 'true'
                  and vault_client_mapper.protocolMapper | default('') == vault_keycloak_groups_mapper.protocolMapper else ['mapper groups']))
                 | join(', ') or 'no change' }}{{ ' (plan only)' if vault_keycloak_plan_only | bool else '' }}

        - name: Update the vault client
          ansible.builtin.uri:
            url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients/{{ vault_services_client_check.json[0].id }}"
            method: PUT
            validate_certs: false
            headers:
              Authorization: "Bearer {{ kc_services_token }}"
              Content-Type: application/json
            body_format: json
            body: >-
              {{ vault_services_client_full.json | combine({'redirectUris': vault_services_keycloak_redirect_uris,
                 'directAccessGrantsEnabled': false}) }}
            status_code: [204]
          when: vault_client_fields | length > 0 and not (vault_keycloak_plan_only | bool)
          no_log: true

        - name: Add the groups mapper to the vault client
          ansible.builtin.uri:
            url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients/{{ vault_services_client_check.json[0].id }}/protocol-mappers/models"
            method: POST
            validate_certs: false
            headers:
              Authorization: "Bearer {{ kc_services_token }}"
              Content-Type: application/json
            body_format: json
            body: "{{ vault_keycloak_groups_mapper }}"
            status_code: [201]
          when: vault_client_mapper | length == 0 and not (vault_keycloak_plan_only | bool)

        - name: Update the groups mapper of the vault client
          ansible.builtin.uri:
            url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients/{{ vault_services_client_check.json[0].id }}/protocol-mappers/models/{{ vault_client_mapper.id }}"
            method: PUT
            validate_certs: false
            headers:
              Authorization: "Bearer {{ kc_services_token }}"
              Content-Type: application/json
            body_format: json
            body: >-
              {{ vault_keycloak_groups_mapper | combine({'id': vault_client_mapper.id,
                 'config': (vault_client_mapper.config | default({})) | combine(vault_keycloak_groups_mapper.config)}) }}
            status_code: [204]
          when:
            - vault_client_mapper | length > 0
            - (vault_client_mapper.config | default({})).get('full.path') != 'true'
              or vault_client_mapper.protocolMapper | default('') != vault_keycloak_groups_mapper.protocolMapper
            - not (vault_keycloak_plan_only | bool)

    - name: Get vault client secret from services keycloak
      ansible.builtin.uri:
        url: "{{ keycloak_services_url }}/admin/realms/{{ keycloak_services_realm }}/clients/{{ vault_services_client_check.json[0].id | default(vault_services_client_create.json.id) }}/client-secret"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ kc_services_token }}"
        status_code: [200]
      register: vault_services_client_secret_result
      when: vault_services_client_check.json | length > 0 or vault_services_client_create is defined
      retries: 3
      delay: 5

    - name: Set services vault client secret
      ansible.builtin.set_fact:
        vault_services_client_secret: "{{ vault_services_client_secret_result.json.value }}"
      when: vault_services_client_secret_result is defined and vault_services_client_secret_result.json is defined

    - name: Store services vault client secret in central vault KV
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/central/data/vault-services-client"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            client_id: "{{ vault_services_client_id }}"
            client_secret: "{{ vault_services_client_secret }}"
            realm: "{{ keycloak_services_realm }}"
        status_code: [200, 204]
      retries: 3
      delay: 5

    - name: Check existing auth methods on services vault
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/sys/auth"
        method: GET
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        status_code: [200]
      register: svc_vault_auth_methods_oidc
      retries: 10
      delay: 10
      until: svc_vault_auth_methods_oidc.status | default(0) == 200

    - name: Enable OIDC auth on services vault
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/sys/auth/oidc"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        body_format: json
        body:
          type: oidc
          description: "Keycloak services OIDC authentication"
        status_code: [200, 204]
      when: "'oidc/' not in svc_vault_auth_methods_oidc.json"
      retries: 3
      delay: 5

    - name: Configure OIDC on services vault with services keycloak
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/auth/oidc/config"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        body_format: json
        body:
          oidc_discovery_url: "{{ keycloak_services_url }}/realms/{{ keycloak_services_realm }}"
          oidc_client_id: "{{ vault_services_client_id }}"
          oidc_client_secret: "{{ vault_services_client_secret }}"
          default_role: "{{ oidc_role_name }}"
          oidc_discovery_ca_pem: "{{ services_ingress_ca_pem | default('') }}"
        status_code: [200, 204]
      retries: 3
      delay: 5

    - name: Create sovereign-admin-policy on services vault
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/sys/policies/acl/{{ admin_policy_name }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        body_format: json
        body:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
        status_code: [200, 204]
      retries: 3
      delay: 5

    - name: Create OIDC role for sovereign-admin on services vault
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/auth/oidc/role/{{ oidc_role_name }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        body_format: json
        body:
          role_type: oidc
          bound_audiences:
            - "{{ vault_services_client_id }}"
          user_claim: "sub"
          groups_claim: "groups"
          allowed_redirect_uris: "{{ vault_redirect_uris }}"
          # only members of the platform admin group get the admin policy; tenant users of the realm are refused
          bound_claims:
            groups:
              - "{{ vault_admin_group_claim }}"
          bound_claims_type: string
          policies:
            - "{{ admin_policy_name }}"
          ttl: "8h"
        status_code: [200, 204]
      retries: 3
      delay: 5

    - name: Read back the services Vault admin role
      ansible.builtin.uri:
        url: "{{ vault_services_addr }}/v1/auth/oidc/role/{{ oidc_role_name }}"
        method: GET
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_services_root_token }}"
        status_code: [200]
      register: svc_vault_admin_role

    - name: The services Vault admin role is bound to the admin group
      ansible.builtin.assert:
        that:
          - (svc_vault_admin_role.json.data.bound_claims | default({}, true)).groups | default([]) == [vault_admin_group_claim]
        fail_msg: "services Vault role {{ oidc_role_name }} is not bound to group {{ vault_admin_group_claim }}"
        quiet: true
