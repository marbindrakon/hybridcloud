{{- /*
Operations layer (shc LAB-PLAN §10.1/§10.3, review O1/O2/S7): scheduled etcd backups, Vault raft
snapshots, the transit seal token check, cert-manager metrics and the alert rules that watch them.
Rendered with layers.base, or on its own with layers.ops (central, which has no base layer).
Everything except the transit check runs in ops.namespace; the alert rules cover its CronJobs and
the transit check in the Vault namespace.
*/}}
{{- if or .Values.layers.base .Values.layers.ops }}
{{- $o := .Values.ops }}
{{- if $o.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $o.namespace }}
  labels:
    {{- include "shc-cluster-base.labels" . | nindent 4 }}
    openshift.io/cluster-monitoring: "true"
    # the etcd backup runs privileged on a control-plane node (hostPath /, chroot)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    security.openshift.io/scc.podSecurityLabelSync: "false"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false

{{- if $o.etcdBackup.enabled }}
{{- $e := $o.etcdBackup }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: {{ $o.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-backup-privileged
  namespace: {{ $o.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: {{ $o.namespace }}
---
# OCP's documented etcd backup (cluster-backup.sh: etcd snapshot + static pod resources) on one
# control-plane node, kept on that node under {{ $e.hostDir }} (newest {{ $e.keep }}). Restore:
# cluster-restore.sh from the same directory (OCP 4.22 "Restoring to a previous cluster state").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: {{ $o.namespace }}
spec:
  schedule: {{ $e.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: etcd-backup
          restartPolicy: Never
          hostNetwork: true
          hostPID: true
          nodeSelector:
            node-role.kubernetes.io/master: ""
          tolerations:
            - operator: Exists
          containers:
            - name: backup
              image: {{ $o.image }}
              securityContext:
                privileged: true
                runAsUser: 0
              env:
                - name: KEEP
                  value: {{ $e.keep | quote }}
                - name: DIR
                  value: {{ $e.hostDir | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  D="$DIR/$(date -u +%Y%m%dT%H%M%SZ)"
                  chroot /host /usr/local/bin/cluster-backup.sh "$D"
                  chroot /host /bin/sh -c "ls -1d '$DIR'/*/ | sort -r | tail -n +$((KEEP + 1)) | xargs -r rm -rf"
                  echo "backup on $(chroot /host hostname): $D"
                  chroot /host du -sh "$D"
              volumeMounts:
                - name: host
                  mountPath: /host
          volumes:
            - name: host
              hostPath:
                path: /
                type: Directory
{{- end }}

{{- if $o.vaultSnapshot.enabled }}
{{- $v := $o.vaultSnapshot }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: {{ $o.namespace }}
---
# TokenReview permission: a Vault Kubernetes auth mount without a reviewer JWT (central's
# kubernetes-central) reviews the client's token with the client's own credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-ops-vault-snapshot-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-snapshot
    namespace: {{ $o.namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots
  namespace: {{ $o.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with $v.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.size }}
---
# Raft snapshot of the platform Vault through its HTTP API: Kubernetes auth as this ServiceAccount
# (Vault role {{ $v.role }} on auth/{{ $v.authMount }}, policy: read sys/storage/raft/snapshot), then
# GET /v1/sys/storage/raft/snapshot into the PVC (newest {{ $v.keep }}). Restore: vault operator raft
# snapshot restore (transit-sealed: the same seal key must be reachable).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: {{ $o.namespace }}
spec:
  schedule: {{ $v.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          containers:
            - name: snapshot
              image: {{ $o.image }}
              env:
                - name: VAULT_ADDR
                  value: {{ required "ops.vaultSnapshot.vaultAddr is required" $v.vaultAddr | quote }}
                - name: AUTH_MOUNT
                  value: {{ $v.authMount | quote }}
                - name: ROLE
                  value: {{ $v.role | quote }}
                - name: KEEP
                  value: {{ $v.keep | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  TOKEN=$(curl -sSf -X POST "$VAULT_ADDR/v1/auth/$AUTH_MOUNT/login" \
                            -d "{\"role\":\"$ROLE\",\"jwt\":\"$JWT\"}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')
                  [ -n "$TOKEN" ] || { echo "Vault login failed"; exit 1; }
                  F="/snapshots/vault-$(date -u +%Y%m%dT%H%M%SZ).snap"
                  curl -sSfL -H "X-Vault-Token: $TOKEN" "$VAULT_ADDR/v1/sys/storage/raft/snapshot" -o "$F.part"
                  mv "$F.part" "$F"
                  curl -sS -o /dev/null -X POST -H "X-Vault-Token: $TOKEN" "$VAULT_ADDR/v1/auth/token/revoke-self" || true
                  ls -1 /snapshots/vault-*.snap | sort -r | tail -n +$((KEEP + 1)) | while read -r f; do rm -f "$f"; done
                  ls -l "$F"
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots
{{- end }}

{{- if $o.transitTokenCheck.enabled }}
{{- $t := $o.transitTokenCheck }}
---
# The platform Vault's transit seal token (D7) is periodic and renewed by the running Vault; if it
# lapses (lab Vault unreachable for longer than the period), the next Vault restart cannot unseal.
# Daily lookup-self against the lab Vault; fails below {{ $t.minTTLDays }} days left or when the lab Vault
# is unreachable, which ShcBackupJobFailed reports.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: transit-token-check
  namespace: {{ required "ops.transitTokenCheck.namespace is required" $t.namespace }}
spec:
  schedule: {{ $t.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: check
              image: {{ $o.image }}
              env:
                - name: LAB_VAULT_ADDR
                  value: {{ required "ops.transitTokenCheck.labVaultAddr is required" $t.labVaultAddr | quote }}
                - name: MIN_TTL
                  value: {{ mul $t.minTTLDays 86400 | quote }}
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $t.secretName }}
                      key: token
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TTL=$(curl -sSf -H "X-Vault-Token: $TOKEN" "$LAB_VAULT_ADDR/v1/auth/token/lookup-self" \
                          | sed -n 's/.*"ttl":\([0-9]*\).*/\1/p')
                  [ -n "$TTL" ] || { echo "token lookup failed"; exit 1; }
                  echo "transit seal token TTL: $((TTL / 3600)) h"
                  [ "$TTL" -ge "$MIN_TTL" ] || { echo "below $((MIN_TTL / 86400)) days"; exit 1; }
{{- end }}

{{- if $o.issuerProbe.enabled }}
{{- $p := $o.issuerProbe }}
---
# External check of the shared OIDC issuers (LAB-PLAN §9 Detection, design/P8-PLAN.md): through the public URL, each
# issuer's discovery document must name itself and its JWKS must serve keys. Cloud token exchanges (AWS STS) depend on
# them. Reads public URLs only (no RBAC). A failed run raises ShcOidcIssuerProbeFailed after 15 min. Run it on a
# cluster other than the one that serves the issuers, so it can alert when that one is down.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oidc-issuer-probe
  namespace: {{ $o.namespace }}
spec:
  schedule: {{ $p.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: probe
              image: {{ $p.image }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  rc=0; B={{ $p.baseURL | quote }}
                  for n in {{ join " " $p.issuers }}; do
                    d=$(curl -sf --max-time 15 "$B/$n/.well-known/openid-configuration") || { echo "$n: discovery document unreachable"; rc=1; continue; }
                    iss=$(echo "$d" | jq -r .issuer 2>/dev/null); ju=$(echo "$d" | jq -r .jwks_uri 2>/dev/null)
                    [ "$iss" = "$B/$n" ] || { echo "$n: discovery names issuer '$iss'"; rc=1; continue; }
                    k=$(curl -sf --max-time 15 "$ju") || { echo "$n: JWKS $ju unreachable"; rc=1; continue; }
                    c=$(echo "$k" | jq '.keys | length' 2>/dev/null)
                    [ "${c:-0}" -gt 0 ] || { echo "$n: JWKS has no keys"; rc=1; continue; }
                    echo "$n: ok ($c keys)"
                  done
                  exit $rc
              resources: {requests: {cpu: 10m, memory: 32Mi}}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                runAsNonRoot: true
                seccompProfile: {type: RuntimeDefault}
{{- end }}

{{- /* ops.shcTenancy; the former ops.edaRedrive block is read as its redrive section for one release */}}
{{- $t := $o.shcTenancy | default dict }}
{{- $legacy := $o.edaRedrive | default dict }}
{{- if or $t.enabled $legacy.enabled }}
{{- $cfg := deepCopy ($t.config | default dict) }}
{{- if $legacy.enabled }}
{{- $_ := set $cfg "redrive" (mergeOverwrite (deepCopy ($cfg.redrive | default dict)) (deepCopy ($legacy.config | default dict))) }}
{{- end }}
{{- $image := $t.image | default $legacy.image }}
{{- $schedule := $t.schedule | default $legacy.schedule | default "*/5 * * * *" }}
{{- $files := printf "%s%s%s%s%s" ($.Files.Get "files/shc_tenancy.py") ($.Files.Get "files/eda_redrive.py") ($.Files.Get "files/shc_status.py") ($.Files.Get "files/shc_status_reasons.py") (toYaml $cfg) }}
---
# Tenancy health (files/shc_tenancy.py): dispatch re-drive and stall detection, the tenants'
# ControllerAvailable/DeliveryStalled conditions, status.phase backfill, slow re-check of failed objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shc-tenancy
  namespace: {{ $o.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shc-ops-shc-tenancy
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [hybridsovereign.redhat]
    resources: ["*"]
    verbs: [get, list, patch]
  - apiGroups: [hybridsovereign.redhat]
    resources: ["*/status"]
    verbs: [patch]
  # the tenants' namespace operators (ControllerAvailable)
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-ops-shc-tenancy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shc-ops-shc-tenancy
subjects:
  - kind: ServiceAccount
    name: shc-tenancy
    namespace: {{ $o.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shc-tenancy
  namespace: {{ $o.namespace }}
data:
  shc_tenancy.py: |
    {{- $.Files.Get "files/shc_tenancy.py" | nindent 4 }}
  eda_redrive.py: |
    {{- $.Files.Get "files/eda_redrive.py" | nindent 4 }}
  shc_status.py: |
    {{- $.Files.Get "files/shc_status.py" | nindent 4 }}
  shc_status_reasons.py: |
    {{- $.Files.Get "files/shc_status_reasons.py" | nindent 4 }}
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shc-tenancy
  namespace: {{ $o.namespace }}
spec:
  schedule: {{ $schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          annotations:
            # the scripts and their config come from the ConfigMap; restart-free updates
            shc/config-hash: {{ $files | sha256sum | trunc 16 | quote }}
        spec:
          serviceAccountName: shc-tenancy
          restartPolicy: Never
          containers:
            - name: tenancy
              image: {{ $image }}
              command: [python3, /etc/shc-tenancy/shc_tenancy.py, --config, /etc/shc-tenancy/config.yaml]
              env:
                - name: PYTHONPATH
                  value: /etc/shc-tenancy
              volumeMounts:
                - name: config
                  mountPath: /etc/shc-tenancy
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: shc-tenancy
{{- end }}

{{- if $o.tenantOrphanCheck.enabled }}
{{- $c := $o.tenantOrphanCheck }}
---
# Tenant cloud orphan check (LAB-PLAN §11.6 phase D): files/tenant_orphan_check.py, report-only.
# Reads the CloudOSO/PlatformOpenshift CRs (get/list only) and the tenant domain/zone with the
# tenant admin account (a domain manager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-orphan-check
  namespace: {{ $o.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shc-ops-tenant-orphan-check
rules:
  - apiGroups: [hybridsovereign.redhat]
    resources: [cloudosos, platformopenshifts]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-ops-tenant-orphan-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shc-ops-tenant-orphan-check
subjects:
  - kind: ServiceAccount
    name: tenant-orphan-check
    namespace: {{ $o.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-orphan-check-account
  namespace: {{ $o.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $c.secretStore }}
  target:
    name: tenant-orphan-check-account
    creationPolicy: Owner
  data:
    - secretKey: clouds.yaml
      remoteRef:
        key: {{ required "ops.tenantOrphanCheck.accountVaultKey is required" $c.accountVaultKey }}
        property: clouds.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-orphan-check
  namespace: {{ $o.namespace }}
data:
  tenant_orphan_check.py: |
    {{- $.Files.Get "files/tenant_orphan_check.py" | nindent 4 }}
  config.yaml: |
    {{- toYaml $c.config | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-orphan-check
  namespace: {{ $o.namespace }}
  annotations:
    # Report-only: Argo CD reports the CronJob Degraded while its last check has findings. In the last
    # sync wave that health cannot hold back the resources of later waves (it did: wave 1 was never
    # applied while a finding was open).
    argocd.argoproj.io/sync-wave: "10"
spec:
  schedule: {{ $c.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          annotations:
            shc/config-hash: {{ printf "%s%s" ($.Files.Get "files/tenant_orphan_check.py") (toYaml $c.config) | sha256sum | trunc 16 | quote }}
        spec:
          serviceAccountName: tenant-orphan-check
          restartPolicy: Never
          containers:
            - name: check
              image: {{ required "ops.tenantOrphanCheck.image is required" $c.image }}
              command: [python3, /etc/tenant-orphan-check/tenant_orphan_check.py,
                        --config, /etc/tenant-orphan-check/config.yaml, --clouds, /etc/tenant-account/clouds.yaml]
              volumeMounts:
                - name: config
                  mountPath: /etc/tenant-orphan-check
                  readOnly: true
                - name: account
                  mountPath: /etc/tenant-account
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: tenant-orphan-check
            - name: account
              secret:
                secretName: tenant-orphan-check-account
{{- end }}

{{- if $o.certManagerMetrics.enabled }}
---
# cert-manager metrics into platform monitoring (certificate expiry/readiness alerts below).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    {{- include "shc-cluster-base.patchOnly" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-k8s
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-k8s
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: openshift-monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: cert-manager
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
{{- end }}

{{- if $o.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shc-platform
  namespace: {{ $o.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: shc-tenancy
      rules:
        - alert: ShcTenantControllerUnavailable
          expr: >-
            max by (namespace) (kube_deployment_status_replicas_available{namespace=~"entity-.*", deployment="hybridsovereign-namespace-operator"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}: the tenant controller has no available replica"
            description: "Changes in this tenant are not processed. Check the hybridsovereign-namespace-operator Deployment and its pod events."
        - alert: ShcTenantControllerRestarting
          expr: >-
            max by (namespace) (increase(kube_pod_container_status_restarts_total{namespace=~"entity-.*", pod=~"hybridsovereign-namespace-operator-.*"}[15m])) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}: the tenant controller keeps restarting"
            description: "The namespace operator restarted more than 3 times in 15 minutes (probes, memory). Check its last termination reason."
    - name: shc-ops-jobs
      rules:
        - alert: ShcBackupJobFailed
          expr: >-
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace=~"{{ $o.namespace }}|{{ $o.transitTokenCheck.namespace | default $o.namespace }}"})
            > max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace=~"{{ $o.namespace }}|{{ $o.transitTokenCheck.namespace | default $o.namespace }}"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.cronjob {{ "}}" }}: the last run failed"
            description: "The most recent run of CronJob {{ "{{" }} $labels.cronjob {{ "}}" }} did not succeed. Check its Job logs."
        - alert: ShcOidcIssuerProbeFailed
          expr: >-
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace="{{ $o.namespace }}", cronjob="oidc-issuer-probe"})
            > max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="{{ $o.namespace }}", cronjob="oidc-issuer-probe"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Shared OIDC issuer check failing"
            description: "oidc-issuer-probe fails: an issuer's public discovery document or JWKS is unreachable or wrong. Cloud token exchanges (AWS STS) fail once their caches expire. Check the issuer front end and the oidc-issuer sync."
        - alert: ShcOidcSyncFailing
          expr: >-
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace="{{ $o.alerts.oidcSyncNamespace }}", cronjob="oidc-sync"})
            > max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="{{ $o.alerts.oidcSyncNamespace }}", cronjob="oidc-sync"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "oidc-sync keeps failing: some issuer's published documents are stale"
            description: "The issuer document sync fails on at least one source (it keeps the last published documents). Check its Job logs."
        - alert: ShcBackupJobNeverSucceeded
          expr: >-
            kube_cronjob_status_last_schedule_time{namespace=~"{{ $o.namespace }}|{{ $o.transitTokenCheck.namespace | default $o.namespace }}"}
            unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.cronjob {{ "}}" }} has run but never succeeded"
            description: "CronJob {{ "{{" }} $labels.cronjob {{ "}}" }} has no successful run yet."
        - alert: ShcBackupStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="{{ $o.namespace }}"} > {{ mul $o.alerts.staleHours 3600 }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.cronjob {{ "}}" }}: no successful backup for {{ $o.alerts.staleHours }} h"
            description: "The newest successful {{ "{{" }} $labels.cronjob {{ "}}" }} run is older than {{ $o.alerts.staleHours }} hours."
    - name: shc-vault
      rules:
        - alert: ShcVaultPodsNotReady
          expr: >-
            kube_statefulset_status_replicas_ready{namespace=~"{{ $o.alerts.vaultNamespaces }}"}
            < kube_statefulset_replicas{namespace=~"{{ $o.alerts.vaultNamespaces }}"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Vault {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.statefulset {{ "}}" }}: pods not ready (sealed or down)"
            description: "A Vault pod is not ready: sealed (transit seal or lab Vault unreachable) or not running."
    {{- $ea := $o.alerts.etcd | default dict }}
    {{- if $ea.enabled }}
    - name: shc-etcd
      rules:
        - alert: ShcEtcdSlowFsync
          expr: >-
            histogram_quantile(0.99, sum by (namespace, pod, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m])))
            > {{ $ea.fsyncP99Seconds }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }}: WAL fsync p99 {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: "The 99th percentile of etcd's WAL fsync on {{ "{{" }} $labels.pod {{ "}}" }} has been above {{ $ea.fsyncP99Seconds }} s for 5 minutes (healthy: tens of milliseconds). The control plane's storage is slow or contended; leader elections follow when single fsyncs approach the election timeout. Check the storage backend's latency and bulk writes on the node's disk."
        - alert: ShcEtcdLeaderChanges
          expr: >-
            max(increase(etcd_server_leader_changes_seen_total{job=~".*etcd.*"}[30m])) >= {{ $ea.leaderChanges }}
            unless on () (max_over_time(cluster_operator_conditions{name=~"etcd|machine-config", condition="Progressing"}[30m]) == 1)
          labels:
            severity: warning
          annotations:
            summary: "etcd changed leader at least {{ $ea.leaderChanges }} times in 30 minutes"
            description: "etcd elected a new leader at least {{ $ea.leaderChanges }} times in the last 30 minutes outside an etcd or machine-config rollout. A leader change means the leader missed heartbeats for the whole election timeout: usually a disk stall (see ShcEtcdSlowFsync and slow fdatasync lines in the etcd log) or lost control-plane connectivity."
    {{- end }}
    {{- if $o.certManagerMetrics.enabled }}
    - name: shc-certificates
      rules:
        - alert: ShcCertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < {{ mul $o.alerts.certExpiryDays 86400 }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} expires within {{ $o.alerts.certExpiryDays }} days"
            description: "cert-manager has not renewed it; Let's Encrypt renews at 30 days left. Check the Certificate and its ACME order."
        - alert: ShcCertificateNotReady
          expr: certmanager_certificate_ready_status{condition!="True"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} is not ready"
            description: "The Certificate's Ready condition is {{ "{{" }} $labels.condition {{ "}}" }}."
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
