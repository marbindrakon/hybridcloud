---
- name: Extract namespaceRbac spec
  ansible.builtin.set_fact:
    ns_rbac: "{{ entity_spec.namespaceRbac | default({}) }}"

# every tenant Role carries the baseline (its namespace, its project, the tenant profile): common/vars/scope_levels.yml
- name: Tenant baseline rules
  ansible.builtin.include_vars:
    file: "{{ (shc_common_dir if shc_common_dir is defined else (role_path ~ '/../../../common')) ~ '/vars/scope_levels.yml' }}"

- name: Build combined rules list for each named role
  ansible.builtin.set_fact:
    _role_rules: >-
      {{
        (
          ([{'apiGroups': ['hybridsovereign.redhat'],
             'resources': item.crud_resources,
             'verbs': ['get','list','watch','create','update','patch','delete']}]
           if item.crud_resources | length > 0 else [])
          +
          ([{'apiGroups': ['hybridsovereign.redhat'],
             'resources': item.crud_resources | map('regex_replace', '$', '/status') | list,
             'verbs': ['get','list','watch']}]
           if item.crud_resources | length > 0 else [])
          +
          ([{'apiGroups': ['hybridsovereign.redhat'],
             'resources': item.read_resources,
             'verbs': ['get','list','watch']}]
           if item.read_resources | length > 0 else [])
          +
          ([{'apiGroups': ['hybridsovereign.redhat'],
             'resources': item.read_resources | map('regex_replace', '$', '/status') | list,
             'verbs': ['get','list','watch']}]
           if item.read_resources | length > 0 else [])
          +
          tenant_baseline_rules
        )
      }}
  loop: "{{ entity_named_roles }}"
  loop_control:
    label: "{{ item.role_name }}"
  when: ns_rbac[item.spec_key] is defined
  register: _role_rules_results

- name: Cache role rules by role_name
  ansible.builtin.set_fact:
    _role_rules_map: >-
      {{
        dict(
          _role_rules_results.results
          | selectattr('skipped', 'undefined')
          | selectattr('ansible_facts._role_rules', 'defined')
          | map(attribute='item')
          | map(attribute='role_name')
          | zip(
              _role_rules_results.results
              | selectattr('skipped', 'undefined')
              | selectattr('ansible_facts._role_rules', 'defined')
              | map(attribute='ansible_facts._role_rules')
            )
        )
      }}

- name: Create K8s Role for each present namespaceRbac entry
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: "{{ item.role_name }}"
        namespace: "{{ entity_namespace }}"
        labels:
          app.kubernetes.io/managed-by: entity-operator
          hybridsovereign.redhat/entity: "{{ entity_cr_name }}"
      rules: "{{ _role_rules_map[item.role_name] }}"
  loop: "{{ entity_named_roles }}"
  loop_control:
    label: "{{ item.role_name }}"
  when:
    - ns_rbac[item.spec_key] is defined
    - _role_rules_map[item.role_name] is defined

- name: Flatten all Rbac CR names needed across all roles
  ansible.builtin.set_fact:
    _all_rbac_names: >-
      {{
        entity_named_roles
        | selectattr('spec_key', 'in', ns_rbac.keys() | list)
        | map(attribute='spec_key')
        | map('extract', ns_rbac)
        | flatten
        | unique
        | list
      }}

- name: Lookup Rbac CRs for group path resolution
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: Rbac
    name: "{{ item }}"
    namespace: "{{ entity_namespace }}"
  loop: "{{ _all_rbac_names }}"
  loop_control:
    label: "{{ item }}"
  register: _rbac_lookup_results
  when: _all_rbac_names | length > 0

- name: Build name→group_path cache from lookup results
  ansible.builtin.set_fact:
    _rbac_group_cache: >-
      {{
        dict(
          _rbac_lookup_results.results
          | default([])
          | selectattr('skipped', 'undefined')
          | selectattr('resources', 'defined')
          | selectattr('resources', 'ne', [])
          | map(attribute='item')
          | zip(
              _rbac_lookup_results.results
              | default([])
              | selectattr('skipped', 'undefined')
              | selectattr('resources', 'defined')
              | selectattr('resources', 'ne', [])
              | map(attribute='resources')
              | map('first')
              | map(attribute='status.group')
              | map('default', '')
              | map('regex_replace', '^(.+)$', '/\1')
            )
        )
      }}

# shc (design/P7-PLAN.md §12.20): OpenShift can't hold the Keycloak group paths as groups; members of an Rbac's group
# sign in to services with the group <entity>.<rbac> (signin.yml), and the RoleBindings name that.
- name: The services sign-in groups of the Rbac CRs
  ansible.builtin.set_fact:
    es_wanted: >-
      {%- set out = [] -%}
      {%- for n in _all_rbac_names -%}
        {%- set p = _rbac_group_cache.get(n, '') -%}
        {%- if p -%}{%- set _ = out.append({'rbac': n, 'path': p, 'group': entity_cr_name ~ '.' ~ n}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Tenant sign-in on services
  ansible.builtin.include_tasks: signin.yml

- name: Build subjects and create RoleBinding for each named role
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ item.role_name }}"
        namespace: "{{ entity_namespace }}"
        labels:
          app.kubernetes.io/managed-by: entity-operator
          hybridsovereign.redhat/entity: "{{ entity_cr_name }}"
      subjects: >-
        {%- set out = [] -%}
        {%- for g in es_wanted | selectattr('rbac', 'in', ns_rbac[item.spec_key] | default([])) -%}
          {%- set _ = out.append({'name': g.group, 'kind': 'Group', 'apiGroup': 'rbac.authorization.k8s.io'}) -%}
        {%- endfor -%}
        {{ out }}
      roleRef:
        kind: Role
        name: "{{ item.role_name }}"
        apiGroup: rbac.authorization.k8s.io
  loop: "{{ entity_named_roles }}"
  loop_control:
    label: "{{ item.role_name }}"
  when:
    - ns_rbac[item.spec_key] is defined
    - (ns_rbac[item.spec_key] | default([]) | length) > 0

- name: Remove the named roles and bindings namespaceRbac no longer asks for
  ansible.builtin.include_tasks: prune_roles.yml
  vars:
    _keep_roles: "{{ entity_named_roles | selectattr('spec_key', 'in', ns_rbac.keys() | list) | map(attribute='role_name') | list }}"
    _keep_bindings: >-
      {{ entity_named_roles | selectattr('spec_key', 'in', ns_rbac.keys() | list)
         | selectattr('spec_key', 'in', ns_rbac | dict2items | selectattr('value') | map(attribute='key') | list)
         | map(attribute='role_name') | list }}
