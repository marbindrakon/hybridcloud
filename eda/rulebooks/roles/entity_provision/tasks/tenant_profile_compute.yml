---
# The status body of the tenant's TenantProfile "shc": display name, contacts and the sites the tenant may use
# (CloudInfrastructures in the platform namespace that are not being deleted, whose spec.entityRefs is empty or
# names the tenant, and that Entity spec.allowedSites lists when it is set), in tenant words
# (common/tasks/site_tenant_summary.yml), sorted by name. Read only.
#
# Input:  entity_cr_name, entity_cr_namespace (the platform namespace), entity_spec (live), entity_generation,
#         services_api_host/services_bearer_token (or services_kubeconfig, for the read-only render test)
# Output: tenant_profile_status  every key the Entity job owns; None for a key with no value (sent as JSON null, so
#         a value removed from the Entity is removed from the profile). conditions is never in it (shc-tenancy's).
- name: List the platform's sites
  kubernetes.core.k8s_info:
    host: "{{ omit if services_kubeconfig is defined else services_api_host }}"
    api_key: "{{ omit if services_kubeconfig is defined else services_bearer_token }}"
    kubeconfig: "{{ services_kubeconfig | default(omit) }}"
    validate_certs: "{{ services_validate_certs | default(true) | bool }}"
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudInfrastructure
    namespace: "{{ entity_cr_namespace }}"
  register: _tp_sites

- name: The sites this tenant may use
  vars:
    _allowed: "{{ entity_spec.allowedSites | default(none) }}"
  ansible.builtin.set_fact:
    _tp_site_objs: >-
      {%- set out = [] -%}
      {%- for o in _tp_sites.resources | default([]) | sort(attribute='metadata.name') -%}
        {%- set refs = (o.spec | default({}, true)).entityRefs | default([], true) | map(attribute='name') | list -%}
        {%- if o.metadata.deletionTimestamp is not defined
              and (refs | length == 0 or entity_cr_name in refs)
              and (_allowed is none or o.metadata.name in _allowed) -%}
          {%- set _ = out.append(o) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Summarize them in tenant words
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_tenant_summary.yml"
  vars:
    sts_sites: "{{ _tp_site_objs }}"

- name: The profile's status body
  ansible.builtin.set_fact:
    tenant_profile_status: >-
      {{ {'displayName': (entity_spec.displayName | default('', true)) or none,
          'contacts': (entity_spec.contacts | default([], true)) or none,
          'sites': site_tenant_summaries,
          'observedEntityGeneration': entity_generation | int,
          'lastUpdatedTime': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')} }}
