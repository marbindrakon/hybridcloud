        def show(c):
            try:
                return json.loads(read(vtysh + ["-c", c]) or "{}")
            except ValueError:
                return {}

        if (read(x + ["sysctl", "-n", "net.vrf.strict_mode"]) or "").strip() != "1":
            errors.append("net.vrf.strict_mode is not 1")
        for dev in ("all", "default", leg):
            if (read(x + ["sysctl", "-n", "net/ipv6/conf/%s/seg6_enabled" % dev]) or "").strip() != "0":
                errors.append("net.ipv6.conf.%s.seg6_enabled is not 0 (routing headers accepted)" % dev)
        rule = False
        for line in (read(x + ["ip", "-6", "rule", "show"]) or "").splitlines():
            w = line.split()
