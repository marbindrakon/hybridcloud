apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: uihealthcheckers.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: UIHealthChecker
    listKind: UIHealthCheckerList
    plural: uihealthcheckers
    singular: uihealthchecker
    shortNames:
      - uihc
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An endpoint health check: a URL the admin dashboard probes on request, for the platform
            team. It creates nothing; the dashboard probes spec.url when the platform team runs the
            checks.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The endpoint to probe.
              type: object
              properties:
                url:
                  type: string
                  description: Absolute HTTP(S) URL the admin dashboard probes from its pod.
                displayName:
                  description: Name shown for the check.
                  type: string
                description:
                  description: What the endpoint is.
                  type: string
                group:
                  type: string
                  description: >-
                    Group the check is listed under (for example central, services, quay, custom).
                expectedStatus:
                  description: HTTP status the endpoint must answer with. Default 200.
                  type: integer
                  default: 200
                timeoutSeconds:
                  description: How long to wait for an answer, in seconds.
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 120
            status:
              description: Observed state. Do not edit.
              type: object
              properties:
                url:
                  description: The URL as registered.
                  type: string
                group:
                  description: The group as registered.
                  type: string
                status:
                  description: Short state word written by the platform's automation.
                  type: string
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Group
          type: string
          jsonPath: .spec.group
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
