apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dashboard.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dashboard.selectorLabels" . | nindent 8 }}
        {{- include "dashboard.labels" . | nindent 8 }}
      {{- /* shc: Argo renders without cluster access, so lookup finds nothing; leave the
           annotation to the oauth-sync job then, or Argo and the job flip it every run. */}}
      {{- $oauthRev := include "dashboard.oauthSecretChecksum" . }}
      {{- $pages := .Values.oauthProxy.pages | default dict }}
      {{- if or (ne $oauthRev "pending") $pages.enabled }}
      annotations:
        {{- if ne $oauthRev "pending" }}
        oauth-client-secret-version: {{ $oauthRev | quote }}
        {{- end }}
        {{- if $pages.enabled }}
        # a change to the proxy's pages restarts the pod (oauth-proxy reads them at start)
        oauth-pages-checksum: {{ include (print $.Template.BasePath "/oauth-pages-configmap.yaml") . | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dashboard.name" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      volumes:
        - name: proxy-tls
          secret:
            secretName: {{ include "dashboard.name" . }}-proxy-tls
        - name: oauth-client-secret
          secret:
            secretName: {{ include "dashboard.name" . }}-oauth-client
        {{- if $pages.enabled }}
        - name: oauth-pages
          configMap:
            name: {{ include "dashboard.name" . }}-oauth-pages
        {{- end }}
      containers:
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8443
              protocol: TCP
          args:
            - --https-address=:8443
            - --provider=openshift
            - --client-id={{ include "dashboard.name" . }}
            - --client-secret-file=/var/run/secrets/oauth/client-secret
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --cookie-secret-file=/var/run/secrets/oauth/cookie-secret
            - --cookie-expire=8h0m0s
            - --cookie-httponly=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --email-domain=*
            - --scope=user:full
            - --pass-access-token=true
            # bearer-token callers (API clients, probes) authenticated through --openshift-delegate-urls reach the app with their token too
            - --pass-user-bearer-token=true
            - --pass-user-headers=true
            - --pass-basic-auth=false
            - --skip-auth-regex=^/healthz$
            - --skip-provider-button=true
            {{- if $pages.enabled }}
            # sign-in and error pages in the product's words, with the page for a user without the platform role
            - --custom-templates-dir=/etc/oauth-proxy/pages
            {{- end }}
            {{- with .Values.oauthProxy.logoutUrl }}
            - --logout-url={{ . }}
            {{- end }}
            {{- with .Values.oauthProxy.openshiftSar }}
            {{- /* Platform administrators only: a session whose user fails this review gets 403 from the
                 proxy; bearer tokens (the console's plugin proxy) are accepted with the same review.
                 --openshift-sar takes the OpenShift SubjectAccessReview keys (resourceAPIGroup,
                 resourceName); --openshift-delegate-urls takes Kubernetes ResourceAttributes (group, name)
                 and silently drops unknown keys, so the delegate entry is translated here. */}}
            - --openshift-sar={{ toJson . }}
            {{- $delegate := dict "resource" .resource "verb" .verb "group" (.resourceAPIGroup | default "") }}
            {{- with .namespace }}{{ $_ := set $delegate "namespace" . }}{{ end }}
            {{- with (.resourceName | default .name) }}{{ $_ := set $delegate "name" . }}{{ end }}
            - --openshift-delegate-urls={{ dict "/" $delegate | toJson }}
            {{- end }}
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-client-secret
              mountPath: /var/run/secrets/oauth
              readOnly: true
            {{- if $pages.enabled }}
            - name: oauth-pages
              mountPath: /etc/oauth-proxy/pages
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            {{- with .Values.oauthProxy.openshiftSar }}
            - name: SHC_PLATFORM_SAR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
