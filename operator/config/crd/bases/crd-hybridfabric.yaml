apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Platform-owned network fabric that connects tenant networks across cloud sites. Every site keeps its
            own EVPN-VXLAN domain; a CloudGateway per site terminates it on the border gateway, and the border
            gateway carries each tenant network between the sites it is placed on, isolated from every other
            network. The fabric holds the site-visible numbering (VNI pools), the border gateway and its
            credentials; tenants reference it from their HybridNetworks. How the border gateway realizes this is
            the platform's choice.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [domainAsn, overlayMtu, vniPool, l2vniPool, borderGateway]
              x-kubernetes-validations:
                - rule: >-
                    self.vniPool.end < self.l2vniPool.start || self.l2vniPool.end < self.vniPool.start
                  message: vniPool and l2vniPool must not overlap
              properties:
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                  description: >-
                    BGP AS number of the fabric: the sites' EVPN sessions, the cloud gateways and the border
                    gateway all use it. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.domainAsn is immutable
                overlayMtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    Largest MTU a tenant network on this fabric can offer its workloads, and the default for new
                    networks. Every site underlay and the border gateway trunk must carry overlayMtu + 50 bytes
                    (VXLAN encapsulation).
                vniPool:
                  type: object
                  description: >-
                    VNIs for the IP-VRFs (layer 3 VNI) of network placements, one per placement. A VNI is only
                    meaningful inside its site's EVPN domain. A pool change that would drop allocated numbers is
                    refused.
                  required: [start, end]
                  x-kubernetes-validations:
                    - rule: self.start <= self.end
                      message: start must not exceed end
                  properties:
                    start:
                      type: integer
                      minimum: 1
                      maximum: 16777215
                    end:
                      type: integer
                      minimum: 1
                      maximum: 16777215
                l2vniPool:
                  type: object
                  description: >-
                    VNIs for the MAC-VRFs (layer 2 VNI) of network placements that need one (OpenShift
                    Virtualization sites), one per placement.
                  required: [start, end]
                  x-kubernetes-validations:
                    - rule: self.start <= self.end
                      message: start must not exceed end
                  properties:
                    start:
                      type: integer
                      minimum: 1
                      maximum: 16777215
                    end:
                      type: integer
                      minimum: 1
                      maximum: 16777215
                borderGateway:
                  type: object
                  description: >-
                    The border gateway: the nodes that run the platform's gateways. Each CloudGateway runs on every
                    node, and every node is a complete path between the sites, so the fabric keeps working while a
                    node is down.
                  required: [nodes, credentialsRef]
                  properties:
                    nodes:
                      type: array
                      minItems: 1
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, address]
                        properties:
                          name:
                            type: string
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            description: Node name, referenced by the CloudGateway site addresses.
                          address:
                            type: string
                            maxLength: 253
                            description: Management address or host name the platform reaches the node at (SSH).
                    credentialsRef:
                      type: object
                      description: >-
                        Vault KV path holding the credential the platform manages the nodes with (for host nodes:
                        key ssh_private_key).
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          type: string
                          minLength: 1
                          maxLength: 512
                bgp:
                  type: object
                  description: BGP settings for the sessions between the sites' VTEPs and their cloud gateways.
                  properties:
                    passwordRef:
                      type: object
                      description: >-
                        Vault KV path holding the TCP MD5 session password (key password). Without it the
                        sessions have no password. A CloudGateway can override it.
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          type: string
                          minLength: 1
                          maxLength: 512
                entityRefs:
                  type: array
                  description: Entities whose HybridNetworks may use this fabric. Empty means every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
            status:
              type: object
              properties:
                ledger:
                  type: string
                  description: ConfigMap (same namespace) that records the fabric's allocations.
                allocated:
                  type: object
                  description: Allocated numbers per pool.
                  additionalProperties:
                    type: integer
                available:
                  type: object
                  description: Free numbers per pool.
                  additionalProperties:
                    type: integer
                realization:
                  type: object
                  description: How the platform realized the fabric (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                nodes:
                  type: array
                  description: State per border gateway node.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ready:
                        type: boolean
                      message:
                        type: string
                      lastAppliedAt:
                        type: string
                        format: date-time
                    x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  type: string
                ready:
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending fabric waits for.
                  items:
                    type: string
                deletionComplete:
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ASN
          type: integer
          jsonPath: .spec.domainAsn
        - name: MTU
          type: integer
          jsonPath: .spec.overlayMtu
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
