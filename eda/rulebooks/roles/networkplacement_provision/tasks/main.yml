---
# shc (design/P7-PLAN.md P7.3.3, §12.3): NetworkPlacement provision. Resolves the network, the backend (CloudOSO,
# CloudVirt or CloudAWS, design/P8-PLAN.md §11), the backend's site and the site's CloudGateway; records site and gateway as soon as they are known
# (the CloudGateway's delete waits on status.cloudGateway); checks the prefixes against the network's other
# placements. On a CloudVirt it serves the environment's namespaces that name the network (status.namespaces).
# Ends pending on the network, backend or gateway while those aren't ready. Then (P7.3.8): VNIs from the fabric's
# ledger (layer 3; layer 2 for a CloudVirt), recorded in status.realization (the gateway job reads them), the site
# side (backend_<kind>.yml), the gateway asked to carry the placement's VRF (pending WaitingForGateway until it
# does; the gateway job wakes the placement), and the site's routes checked on every border gateway node.
- block:
    - name: Read the NetworkPlacement
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    # a provision job that outlived the CR's deletion must not take the gateway back (status.realization)
    - name: End the job for a placement being deleted
      ansible.builtin.meta: end_play
      when: fab_deleting | bool

    - name: Start with nothing to wait for
      ansible.builtin.set_fact:
        np_waiting: []
        np_reason: WaitingForDependencies
        np_status: {entity: "{{ fab_entity }}"}
        np_backend_kind: "{{ fab_spec.backend.kind }}"
        np_backend_name: "{{ fab_spec.backend.name }}"

    - name: Read the network and the backend
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ fab_namespace }}"
      loop:
        - {kind: HybridNetwork, name: "{{ fab_spec.network }}"}
        - {kind: "{{ np_backend_kind }}", name: "{{ np_backend_name }}"}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      register: _np_refs

    - name: Set the network and backend facts
      ansible.builtin.set_fact:
        np_network: "{{ (_np_refs.results[0].resources | default([], true) + [{}]) | first }}"
        np_backend: "{{ (_np_refs.results[1].resources | default([], true) + [{}]) | first }}"

    - name: Refuse references that are being deleted
      ansible.builtin.set_fact:
        fab_fail_reason: ReferenceDeleting
        fab_fail_msg: >-
          NetworkPlacement {{ fab_name }}: {{ [np_network, np_backend] | selectattr('metadata.deletionTimestamp', 'defined')
          | map(attribute='kind') | join(' and ') }} being deleted
      when: >-
        [np_network, np_backend] | selectattr('metadata', 'defined') | selectattr('metadata.deletionTimestamp', 'defined')
        | list | length > 0

    - name: Stop on a deleting reference
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_reason | default('') == 'ReferenceDeleting'

    - name: Wait for missing references
      ansible.builtin.set_fact:
        np_waiting: >-
          {{ np_waiting
             + ([] if np_network else ['HybridNetwork ' ~ fab_spec.network ~ ' (not found)'])
             + ([] if np_backend else [np_backend_kind ~ ' ' ~ np_backend_name ~ ' (not found)']) }}

    # the backend's site: a CloudVirt names it; a CloudOSO records the site it took (its cloudRef or the default)
    - name: Find the backend's site
      ansible.builtin.set_fact:
        np_site: >-
          {{ (((np_backend.spec | default({}, true)).cloudRef | default({}, true)).name | default('', true))
             or ((np_backend.status | default({}, true)).cloudInfrastructure | default('', true)) }}

    - name: Wait for the backend to choose its site
      ansible.builtin.set_fact:
        np_waiting: "{{ np_waiting + [np_backend_kind ~ ' ' ~ np_backend_name ~ ' (no site yet)'] }}"
      when: np_backend and np_site | length == 0

    - name: Resolve the site and its gateway
      when: np_site | length > 0
      block:
        - name: Resolve the site
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
          vars:
            ci_ref_name: "{{ np_site }}"
            ci_ref_namespace: "{{ fabric_platform_namespace }}"

        - name: List the platform's gateways
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: hybridsovereign.redhat/v1alpha1
            kind: CloudGateway
            namespace: "{{ fabric_platform_namespace }}"
          register: _np_gateways

        - name: Find the site's gateway
          ansible.builtin.set_fact:
            np_gateway: >-
              {{ (_np_gateways.resources | default([]) | selectattr('spec.cloudRef.name', 'equalto', np_site)
                  | list + [{}]) | first }}
            np_status: "{{ np_status | combine({'site': np_site}) }}"

        - name: Record the gateway
          ansible.builtin.set_fact:
            np_status: "{{ np_status | combine({'cloudGateway': np_gateway.metadata.name}) }}"
          when: np_gateway | length > 0

        - name: Wait for an EVPN site with a gateway
          ansible.builtin.set_fact:
            np_waiting: >-
              {{ np_waiting
                 + ([ci_error | trim] if ci_error | trim | length > 0 else [])
                 + (['CloudInfrastructure ' ~ np_site ~ ': evpn capability']
                    if ci_error | trim | length == 0 and not (ci_capabilities.evpn | default(false) | bool) else [])
                 + ([] if np_gateway else ['a CloudGateway for site ' ~ np_site]) }}
            np_reason: >-
              {{ 'SiteNotEvpnCapable' if ci_error | trim | length == 0 and not (ci_capabilities.evpn | default(false) | bool)
                 else np_reason }}

    - name: Refuse a gateway on another fabric
      ansible.builtin.set_fact:
        fab_fail_reason: FabricMismatch
        fab_fail_msg: >-
          NetworkPlacement {{ fab_name }}: site {{ np_site }} is on HybridFabric {{ np_gateway.spec.fabricRef.name }},
          network {{ fab_spec.network }} on {{ (np_network.status | default({}, true)).fabric }}
      when:
        - np_gateway | default({}) | length > 0
        - (np_network.status | default({}, true)).fabric | default('', true) | length > 0
        - np_gateway.spec.fabricRef.name != np_network.status.fabric

    - name: List the network's other placements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ fab_namespace }}"
      register: _np_all

    # attachment circuits on the network: their policy lists the network's placement prefixes (the fabric job)
    - name: List the network's attachment circuits
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        namespace: "{{ fab_namespace }}"
      register: _np_circuits

    - name: Set the network's circuits
      ansible.builtin.set_fact:
        np_circuits: >-
          {{ _np_circuits.resources | default([]) | selectattr('spec.network', 'equalto', fab_spec.network)
             | rejectattr('metadata.deletionTimestamp', 'defined') | list }}

    - name: Check the prefixes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: check-placement
          prefixes: "{{ fab_spec.prefixes }}"
          siblings: >-
            {%- set out = [] -%}
            {%- for p in _np_all.resources | default([]) -%}
              {%- if p.metadata.name != fab_name and p.spec.network == fab_spec.network
                    and p.metadata.deletionTimestamp is not defined -%}
                {%- set _ = out.append({'name': p.metadata.name, 'prefixes': p.spec.prefixes | default([])}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ out }}
          circuits: >-
            {%- set out = [] -%}
            {%- for c in np_circuits -%}
              {%- set _ = out.append({'name': c.metadata.name, 'accept': (c.spec.routing | default({}, true)).accept | default([], true)}) -%}
            {%- endfor -%}
            {{ out }}

    - name: Refuse overlapping prefixes
      ansible.builtin.set_fact:
        fab_fail_reason: PrefixOverlap
        fab_fail_msg: "NetworkPlacement {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when:
        - fab_fail_msg | default('', true) | length == 0
        - fab_check_result.errors | length > 0

    - name: Stop on a refused placement
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_msg | default('', true) | length > 0

    - name: Map the CloudVirt's namespaces on this network
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: cloudvirt-namespaces
          entity: "{{ fab_entity }}"
          cloudvirt: "{{ np_backend_name }}"
          network: "{{ fab_spec.network }}"
          namespaces: >-
            {{ ((np_backend.spec | default({}, true)).namespaces | default([], true))
               | selectattr('network', 'defined') | selectattr('network', 'equalto', fab_spec.network) | list }}
      when: np_backend_kind == 'CloudVirt' and np_backend | length > 0

    - name: Record the namespaces the network serves (CloudVirt)
      ansible.builtin.set_fact:
        np_status: "{{ np_status | combine({'namespaces': fab_check_result.namespaces | map(attribute='namespace') | list}) }}"
        np_ns_map: "{{ fab_check_result }}"
      when: np_backend_kind == 'CloudVirt' and np_backend | length > 0

    - name: Record the readiness of the backend and the gateway
      ansible.builtin.set_fact:
        np_status: >-
          {{ np_status | combine({'backendReady': (np_backend.status | default({}, true)).ready | default(false) | bool,
                                  'gatewayReady': ((np_gateway | default({})).status | default({}, true)).ready | default(false) | bool}) }}

    - name: Wait for the network, backend and gateway to be ready
      vars:
        _deps:
          - {what: "HybridNetwork {{ fab_spec.network }}", obj: "{{ np_network }}"}
          - {what: "{{ np_backend_kind }} {{ np_backend_name }}", obj: "{{ np_backend }}"}
          - {what: "CloudGateway {{ (np_gateway | default({})).metadata.name | default('') }}", obj: "{{ np_gateway | default({}) }}"}
      ansible.builtin.set_fact:
        np_waiting: "{{ np_waiting + [item.what ~ ' (' ~ ((item.obj.status | default({}, true)).status | default('not provisioned', true)) ~ ')'] }}"
      loop: "{{ _deps }}"
      loop_control:
        label: "{{ item.what }}"
      when:
        - item.obj | length > 0
        # usable: ready, or realized and not failed (a CloudOSO: has its project); a dependency that re-runs or
        # waits on its own dependencies keeps working
        - not (((item.obj.status | default({}, true)).ready | default(false) | bool) or (((item.obj.status | default({}, true)).realized | default(false) | bool) and (item.obj.status | default({}, true)).status | default('') != 'failed') or ((item.obj.status | default({}, true)).projectId | default('', true) | length > 0
               and (item.obj.status | default({}, true)).status | default('') != 'failed'))

    - name: Report what the placement waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: "{{ np_reason | trim }}"
        fab_message: "Waiting for {{ np_waiting | join('; ') }}"
        fab_waiting_for: "{{ np_waiting }}"
        fab_status: "{{ np_status }}"
      when: np_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: np_waiting | length > 0

    # ---- realization (P7.3.8) ----
    - name: Read the fabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ np_gateway.spec.fabricRef.name }}"
        namespace: "{{ fabric_platform_namespace }}"
      register: _np_fabric

    - name: Set the fabric facts
      ansible.builtin.set_fact:
        np_fabric: "{{ _np_fabric.resources[0] }}"
        np_asn: "{{ _np_fabric.resources[0].spec.domainAsn }}"
        np_owner: "NetworkPlacement/{{ fab_namespace }}/{{ fab_name }}"

    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ np_fabric.metadata.name }}"

    - name: The placement's layer 3 VNI
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-allocate, namespace: "{{ fabric_platform_namespace }}", fabric: "{{ np_fabric.metadata.name }}",
                     kind: vni, owner: "{{ np_owner }}"}

    - name: Keep the layer 3 VNI
      ansible.builtin.set_fact:
        np_l3vni: "{{ fab_ledger_result.value | int }}"

    - name: The placement's layer 2 VNI (a CloudVirt's MAC-VRF)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-allocate, namespace: "{{ fabric_platform_namespace }}", fabric: "{{ np_fabric.metadata.name }}",
                     kind: l2vni, owner: "{{ np_owner }}"}
      when: np_backend_kind == 'CloudVirt'

    - name: Name the placement's objects
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: placement-names, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}", entity: "{{ fab_entity }}",
                    network: "{{ fab_spec.network }}", l3Vni: "{{ np_l3vni }}"}

    # a site over a tunnel carries less than the fabric: its leg's MTU minus VXLAN (the network's MTU elsewhere)
    - name: The site leg's MTU
      ansible.builtin.set_fact:
        np_site_mtu: >-
          {{ ((np_gateway.spec.siteUnderlay.mtu | default(fab_real.wireguard.mtu)) | int - 50)
             if (np_gateway.spec.transport | default('none')) == 'wireguard' else 65535 }}

    - name: Set the placement's numbers
      ansible.builtin.set_fact:
        np_names: "{{ fab_check_result }}"
        np_real: >-
          {{ {'l3Vni': np_l3vni | int, 'vpnTarget': np_network.status.realization.vpnTarget | int,
              'routeTarget': np_asn ~ ':' ~ np_l3vni, 'vrf': fab_check_result.vrf,
              'mtu': [(np_network.status.mtu | default(np_fabric.spec.overlayMtu)) | int, np_site_mtu | int] | min}
             | combine({'l2Vni': fab_ledger_result.value | int} if np_backend_kind == 'CloudVirt' else {}) }}
        np_recreated: "{{ ((fab_st.realization | default({}, true)).routerRecreated | default(false)) | bool }}"

    # the gateway job reads these to carry the placement's VRF
    - name: Record the numbers
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: networkplacements
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        cr_status_partial: true
        patch_ignore_not_found: true
        cr_status_body: "{{ np_status | combine({'mtu': np_real.mtu, 'realization': np_real | combine({'gatewayRelease': false})}) }}"

    - name: The CloudVirt namespaces that name the network (selected by label)
      ansible.builtin.set_fact:
        np_ns_selector: "{{ np_ns_map.networkSelector }}"
      when: np_backend_kind == 'CloudVirt'

    - name: The site side ({{ np_backend_kind }})
      ansible.builtin.include_tasks: "backend_{{ np_backend_kind | lower }}.yml"

    # read again: a gateway run may have picked the placement up while the site side was being built
    - name: Read the gateway again
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        name: "{{ np_gateway.metadata.name }}"
        namespace: "{{ fabric_platform_namespace }}"
      register: _np_gw_again

    - name: Does the gateway carry the placement
      vars:
        np_gateway: "{{ _np_gw_again.resources[0] }}"
      ansible.builtin.set_fact:
        np_gw_carries: >-
          {{ ((np_gateway.status | default({}, true)).realization | default({}, true)).vrfs | default([], true)
             | selectattr('placement', 'equalto', fab_namespace ~ '/' ~ fab_name)
             | selectattr('vni', 'equalto', np_l3vni | int) | list | length > 0 }}

    - name: Ask the gateway to carry the placement
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: CloudGateway, namespace: "{{ fabric_platform_namespace }}", name: "{{ np_gateway.metadata.name }}"}]
      when: not np_gw_carries | bool

    - name: Report the placement waiting for its gateway
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: WaitingForGateway
        fab_message: "Site side ready; waiting for CloudGateway {{ np_gateway.metadata.name }} to carry the network (VRF {{ np_names.vrf }})"
        fab_waiting_for: ["CloudGateway {{ np_gateway.metadata.name }} (VRF {{ np_names.vrf }})"]
        fab_status: "{{ np_status | combine({'realization': np_real | combine({'site': np_backend_status})}) }}"
      when: not np_gw_carries | bool

    - name: End the job until the gateway carries it
      ansible.builtin.meta: end_play
      when: not np_gw_carries | bool

    - name: Check the gateway's routes
      ansible.builtin.include_tasks: gateway_routes.yml
      vars:
        np_route_wait: "{{ fab_real.placement.routeWait }}"

    # an OpenStack site fills a router's gateway chassis only when the router is created: recreate it once
    - name: Recreate the router once when the site advertises nothing
      when:
        - np_routes_missing | bool
        - np_backend_kind == 'CloudOSO'
        - not np_recreated | bool
      block:
        - name: Recreate the router
          ansible.builtin.include_tasks: backend_cloudoso.yml
          vars:
            np_recreate_router: true

        - name: Remember the recreation
          ansible.builtin.set_fact:
            np_recreated: true

        - name: Check the gateway's routes after the recreation
          ansible.builtin.include_tasks: gateway_routes.yml
          vars:
            np_route_wait: "{{ fab_real.placement.routeWait }}"

    - name: Set the final status
      ansible.builtin.set_fact:
        np_final: >-
          {{ np_status | combine({'realization': np_real | combine({'site': np_backend_status, 'gateway': np_route_nodes,
                                                                    'routerRecreated': np_recreated | bool})}) }}

    - name: Report the placement waiting for the site's routes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: RoutesMissing
        fab_message: >-
          The gateway carries VRF {{ np_names.vrf }} but has no route from the site for
          {{ np_route_nodes | map(attribute='missing') | flatten | unique | join(', ') }}
          ({{ np_route_nodes | selectattr('missing') | map(attribute='name') | join(', ') }})
        fab_waiting_for: ["the site's routes for {{ np_route_nodes | map(attribute='missing') | flatten | unique | join(', ') }}"]
        fab_status: "{{ np_final }}"
      when: np_routes_missing | bool

    - name: End the job while routes are missing
      ansible.builtin.meta: end_play
      when: np_routes_missing | bool

    - name: Report the placement ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        fab_message: >-
          {{ fab_spec.prefixes | join(', ') }} on {{ np_site }} through CloudGateway {{ np_gateway.metadata.name }}
          (VNI {{ np_l3vni }}{{ (', MAC-VRF ' ~ np_real.l2Vni) if np_real.l2Vni is defined else '' }}); routes of
          the network's other placements on the gateway: {{ np_route_nodes | map(attribute='vpnRoutes') | map('string') | join('/') }}
        fab_status: "{{ np_final }}"

    - name: Tell the network and the backend
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs:
          - {kind: HybridNetwork, namespace: "{{ fab_namespace }}", name: "{{ fab_spec.network }}"}
          - {kind: "{{ np_backend_kind }}", namespace: "{{ fab_namespace }}", name: "{{ np_backend_name if np_backend_kind == 'CloudVirt' else '' }}"}
      when: fab_st.status | default('') != 'ready'

    # the circuits' policy (deny and advertise lists) holds the network's placement prefixes
    - name: Tell the fabric when the network has attachment circuits
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: HybridFabric, namespace: "{{ fabric_platform_namespace }}", name: "{{ np_fabric.metadata.name }}"}]
      when:
        - fab_st.status | default('') != 'ready'
        - np_circuits | length > 0

  rescue:
    - name: Mark the NetworkPlacement failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('NetworkPlacement provision failed') }}
        fab_status: "{{ np_status | default({}) }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
