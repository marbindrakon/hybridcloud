# Sample HybridFabric: two border gateway nodes, AS 65010. How the border gateway realizes the fabric (core
# addressing, routing protocols, host details) is the platform's installation configuration, not part of the CR.
# Apply manually to the services cluster: oc apply -f samples/hybridvpc/hybridfabric-lab.yaml
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: lab
  namespace: sovereign-cloud
spec:
  domainAsn: 65010
  overlayMtu: 9000
  vniPool: {start: 51000, end: 52127}
  l2vniPool: {start: 151000, end: 152127}
  borderGateway:
    nodes:
      - {name: bgw-1, address: 192.0.2.61}
      - {name: bgw-2, address: 192.0.2.62}
    credentialsRef: {vaultPath: fabric/bgw}
  bgp:
    passwordRef: {vaultPath: fabric/bgp}
