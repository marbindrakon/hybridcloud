# ─── HybridSovereign Primary Operator (services) ─────────────────────────────
hybridsovereignPrimaryOperator:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.1.22-shc.10"  # shc.10: CloudGateway transport wireguard, CloudInfrastructure type external (P7.3b); shc.9: HybridNetwork spec.egress / status.egress (P7.4); shc.4: CloudInfrastructure (P7.1); shc.5: DNSConfig, CloudInfrastructure.spec.dns (TENANT-DNS D1); shc.6: fabric API (P7.3.3); shc.7: CloudVirt owns its namespaces; shc.8: realization params out of the fabric CRDs, CloudGateway upstream RRs, CloudInfrastructure fabricCredentialsRef
  syncWave: "38"
  destinationNamespace: sovereign-cloud
  values:
    namespace: sovereign-cloud
    pluginsNamespace: sovereign-cloud-plugins
    # shc: "img-" tags - the operator charts share these Quay repositories, and a chart push of
    # hybridsovereign-namespace-operator 0.1.10 replaced the 0.1.10 image (namespace operators then
    # failed "image not known"); chart versions are semver, so img-* can never collide.
    image:
      repository: quay.signal9.gg/shc/hybridsovereign-primary-operator
      tag: "img-0.1.31"  # img-0.1.26: CloudInfrastructure watch (P7.1); img-0.1.27: DNSConfig watch (TENANT-DNS D1); img-0.1.28: reconcilePeriod + in-flight guard (P7.3.2); img-0.1.29: fabric delete guards (P7.3.3); img-0.1.30: a waiting delete is not marked failed; img-0.1.31: CloudVirt-owned namespaces (guards)
    namespaceOperator:
      image:
        repository: quay.signal9.gg/shc/hybridsovereign-namespace-operator
        tag: "img-0.1.19"  # img-0.1.16: reconcilePeriod + in-flight guard (P7.3.2); img-0.1.17: CloudVirt watch, fabric delete guards (P7.3.3); img-0.1.18: a waiting delete is not marked failed; img-0.1.19: CloudVirt-owned namespaces (guards)
    amqKafka:
      enabled: true
      vaultPath: amq-producer
    imagePullSecrets:
      - name: quay-pull-secret
    replicas: 2
    # P7.1 (P7-PLAN §3.2, decision 14): the platform's cloud sites. Credentials: central Vault cloudinfra/<site>
    # (openstack: the cloud-admin account shc-infra, bootstrap.sh seed-cloudinfra; openshift: the
    # ManagedServiceAccount kubeconfig from iaasClusters.<c>.cloudInfra). CloudOSO's default site:
    # aap-config CLOUDOSO_DEFAULTS.cloudRef.
    cloudInfrastructures:
      atuin:
        spec:
          type: openstack
          displayName: Atuin
          credentialsRef: {vaultPath: cloudinfra/atuin}
          openstack:
            region: ATUIN
            projectDomain: shc-tenants
            externalNetwork: internet
          # TENANT-DNS D1: environment zones in Atuin Designate, owned by shc-tenant-dns (which holds the global
          # zone) and shared with the environment's project
          dns: {mode: native, project: shc-tenant-dns, projectDomain: shc-tenants}
      rhoso-bm:
        spec:
          type: openstack
          displayName: RHOSO bare metal (FR6, EVPN)
          credentialsRef: {vaultPath: cloudinfra/rhoso-bm}
          openstack:
            region: regionOne
            projectDomain: shc-tenants
            createProjectDomain: true
            externalNetwork: public
          # TENANT-DNS D0/D1: Designate on rhoso-bm (ns1/ns2.rhoso-bm.lab.signal9.gg); shc-tenant-dns holds the
          # parent zone there; environment zones are delegated from the global zone
          dns: {mode: native, project: shc-tenant-dns, projectDomain: shc-tenants}
      iaas1:
        spec:
          type: openshift
          displayName: iaas1 (OpenShift Virtualization)
          credentialsRef: {vaultPath: cloudinfra/iaas1}
          openshift:
            clusterRef: iaas1
            storageClass: ocs-external-storagecluster-ceph-rbd
            fabricCredentialsRef: {vaultPath: cloudinfra/iaas1-fabric}   # P7.3.2: write MSA shc-fabric
          dns: {mode: platform}   # CloudVirt zones held by the platform (TENANT-DNS D3)
      edge1:
        spec:
          type: openshift
          displayName: edge1 (OpenShift Virtualization, compact)
          credentialsRef: {vaultPath: cloudinfra/edge1}
          openshift:
            clusterRef: edge1
            storageClass: ocs-external-storagecluster-ceph-rbd
            fabricCredentialsRef: {vaultPath: cloudinfra/edge1-fabric}   # P7.3.2: write MSA shc-fabric
          dns: {mode: platform}
    # P7.3 (P7-PLAN §12.3, H2 = gateway as PE): the fabric and a gateway per EVPN site on the BGW blades bgw-1/2
    # (blades 5/8). The fabric is realized from P7.3.4 (ledger + root instance on both blades), the gateways from
    # P7.3.5 (one site at a time). SSH key and BGP password: central Vault fabric/bgw, fabric/bgp (seed-fabric-hosts).
    hybridFabrics:
      lab:
        spec:
          domainAsn: 65010
          overlayMtu: 9000
          vniPool: {start: 51000, end: 52127}
          l2vniPool: {start: 151000, end: 152127}
          borderGateway:
            nodes:
              - {name: bgw-1, address: 172.18.0.61}
              - {name: bgw-2, address: 172.18.0.62}
            credentialsRef: {vaultPath: fabric/bgw}
          bgp:
            passwordRef: {vaultPath: fabric/bgp}
    cloudGateways:
      iaas1:
        spec:
          fabricRef: {name: lab}
          cloudRef: {name: iaas1}
          siteUnderlay:
            vlan: 236
            cidr: 172.18.236.0/24
            addresses: [{node: bgw-1, address: 172.18.236.4}, {node: bgw-2, address: 172.18.236.5}]
      edge1:
        spec:
          fabricRef: {name: lab}
          cloudRef: {name: edge1}
          siteUnderlay:
            vlan: 239
            cidr: 172.18.239.0/24
            addresses: [{node: bgw-1, address: 172.18.239.4}, {node: bgw-2, address: 172.18.239.5}]
      rhoso-bm:
        spec:
          fabricRef: {name: lab}
          cloudRef: {name: rhoso-bm}
          siteUnderlay:
            vlan: 235
            cidr: 172.18.235.0/24
            addresses: [{node: bgw-1, address: 172.18.235.4}, {node: bgw-2, address: 172.18.235.5}]
    # TENANT-DNS D1: the platform's tenant DNS namespace (DNSConfig in sovereign-cloud-plugins). The global zone
    # tenants.shc.signal9.gg lives in Atuin Designate (project shc-tenant-dns); credential = the DNS-only account
    # shc-tenant-dns (p7/tenant-dns-account.sh, bootstrap.sh seed-tenant-dns).
    pluginConfigs:
      DNSConfig:
        enabled: true
        name: tenant-dns
        spec:
          domain: tenants.shc.signal9.gg
          provider: designate
          secret: dns/tenant-designate
          designate:
            projectId: 5074bdc4023c4fa09405a43ec7bbc6ea
            zoneId: b19bb752-5aeb-4187-a303-12f9cb60378e

# ─── IAAC Git Sync StatefulSet (services) ────────────────────────────────────
iaacGitSync:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.1.2-shc.1"
  syncWave: "40"
  destinationNamespace: sovereign-cloud-plugins
  values:
    namespace: sovereign-cloud-plugins
    image:
      repository: quay.signal9.gg/shc/iaac-git-sync
      tag: "0.1.0"
    imagePullSecrets:
      - name: quay-pull-secret
    gitea:
      url: "https://gitea-gitea.apps.central.shc.signal9.gg"
      repoOwner: gitea_admin
      repoName: tenancy_repo
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: gitea-admin
        targetSecretName: gitea-admin-token
        tokenKey: admin_token

# ─── ACM GitOpsCluster pull model ────────────────────────────────────────────
acmGitOpsCluster:
  enabled: false
  syncWave: "11"
  namespace: open-cluster-management
  placementName: services-placement
  managedClusterSet: hybridsovereign-clusters

# ─── AAP config-as-code (infra.aap_configuration) ───────────────────────────
# Deployed via sovereignJobs.jobs.aapConfigAsCode (see above)
aapConfigAsCode:
  enabled: true
