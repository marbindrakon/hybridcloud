---
# Central cluster CoreDNS forwarders (DNS/default), from values: dnsForwarderCentral.servers.
#
# Upstream hardcoded its demo environment here: RHDP sandbox slug zones (*.opentlc.com) forwarded
# to their Route53 NS, the lab base domain forwarded to 8.8.8.8, and lab.* / extra zones from
# lab.dnsForwarderIps / lab.extraDnsServers. Forwarding the base domain to a public resolver hides
# every private zone below it (e.g. the iLO names in oob.<base>) from pods.
#
# shc: central's node resolver (lab IPA) already answers lab, OOB and public names, so central
# only forwards its own platform zone to the authoritative primary, so that freshly created
# records are visible at once (no negative caching in a recursor). See values.yaml.
#
# CoreDNS forwardPlugin is non-recursive and needs IP addresses: forward a zone only to servers
# that are authoritative for it (or to recursors).
apiVersion: operator.openshift.io/v1
kind: DNS
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
{{- with .Values.dnsForwarderCentral.servers }}
  servers:
{{- range . }}
    - name: {{ .name | quote }}
      zones:
{{- range .zones }}
        - {{ . | quote }}
{{- end }}
      forwardPlugin:
        policy: {{ .policy | default "Sequential" }}
        upstreams:
{{- range .upstreams }}
          - {{ . | quote }}
{{- end }}
{{- end }}
{{- else }}
  servers: []
{{- end }}
