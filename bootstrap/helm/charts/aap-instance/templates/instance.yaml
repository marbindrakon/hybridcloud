---
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  api:
    replicas: 1
  {{- if .Values.postgres.enabled }}
  database:
    database_secret: {{ .Values.name }}-external-postgres
  {{- end }}
  {{- if .Values.controller.enabled }}
  controller:
    replicas: {{ .Values.controller.replicas | default 1 }}
    {{- if .Values.postgres.enabled }}
    database:
      host: {{ printf "%s-writable.%s.svc" (.Values.postgres.name | default "aap-pgcluster") .Values.namespace }}
      port: 5432
      name: controller
      sslmode: prefer
      username_secret:
        name: {{ printf "%s-pguser-controller" (.Values.postgres.name | default "aap-pgcluster") }}
        key: user
      password_secret:
        name: {{ printf "%s-pguser-controller" (.Values.postgres.name | default "aap-pgcluster") }}
        key: password
    {{- end }}
    {{- with .Values.controller.extraSpec }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if .Values.eda.enabled }}
  eda:
    replicas: {{ .Values.eda.replicas | default 1 }}
  {{- end }}
  hub:
    disabled: true
    replicas: 0
  no_log: true
  redis_mode: standalone
  route_tls_termination_mechanism: Edge
