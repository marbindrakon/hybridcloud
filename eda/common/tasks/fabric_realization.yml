---
# shc (design/P7-PLAN.md §12.3): the platform's realization parameters for one fabric (common/vars defaults,
# then the installation's fabric_realization, then fabric_realization.fabrics.<fabric>). Included from a role.
# Input: fab_real_fabric (HybridFabric name). Sets fab_real.
- name: Load the realization defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../../common/vars/fabric_realization.yml"

- name: "Set the realization of the HybridFabric: {{ fab_real_fabric }}"
  vars:
    _inst: "{{ fabric_realization | default({}, true) }}"
  ansible.builtin.set_fact:
    fab_real: >-
      {{ fabric_realization_defaults
         | combine(_inst | dict2items | rejectattr('key', 'equalto', 'fabrics') | items2dict, recursive=True)
         | combine((_inst.fabrics | default({})).get(fab_real_fabric, {}), recursive=True) }}

- name: Refuse a realization model this platform does not implement (the step's sentence)
  ansible.builtin.fail:
    msg: "{{ shc_step | hybridsovereign.shc.shc_step_failed(shc_step_what | default('provisioning', true)) }}"
  when: shc_step is defined and fab_real.model not in fabric_realization_models

- name: Refuse a realization model this platform does not implement
  when: shc_step is not defined
  ansible.builtin.assert:
    that: fab_real.model in fabric_realization_models
    fail_msg: >-
      HybridFabric {{ fab_real_fabric }}: realization model {{ fab_real.model }} is not implemented
      (implemented: {{ fabric_realization_models | join(', ') }})
    quiet: true
