        - name: EDA_REPO_URL
          value: "http://gitea-http.gitea.svc:3000/hybrid-sovereign/eda-lab.git"
        - name: RULEBOOK_REPO_URL
          value: "http://gitea-http.gitea.svc:3000/hybrid-sovereign/eda-lab.git"
        - name: OCP_CENTRAL_SERVER
