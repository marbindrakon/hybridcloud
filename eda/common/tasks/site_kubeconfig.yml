---
# shc (design/P7-PLAN.md P7.3): the fabric write credential of an OpenShift site (CloudInfrastructure
# spec.openshift.fabricCredentialsRef, else credentialsRef) as a temporary kubeconfig file (0600, never shown).
# Inputs: ci_spec (the CloudInfrastructure spec), site_kc_tag (unique per job). Sets site_kubeconfig (the path);
# the caller removes the file in an `always` (path: site_kubeconfig).
- name: Read the site's fabric credential
  ansible.builtin.include_tasks: vault_kv_read.yml
  vars:
    vault_kv_path: "{{ ((ci_spec.openshift | default({})).fabricCredentialsRef | default(ci_spec.credentialsRef)).vaultPath }}"

- name: Require a kubeconfig
  ansible.builtin.assert:
    that: (vault_kv_data.kubeconfig | default('')) | length > 0
    fail_msg: "the site's fabric credential has no kubeconfig"
    quiet: true
  no_log: true

- name: Write the site kubeconfig (temp, 0600)
  ansible.builtin.copy:
    content: "{{ vault_kv_data.kubeconfig }}"
    dest: "/tmp/eda-{{ site_kc_tag }}-kubeconfig"
    mode: "0600"
  no_log: true

- name: Drop the credential from the facts
  ansible.builtin.set_fact:
    vault_kv_data: {}
    site_kubeconfig: "/tmp/eda-{{ site_kc_tag }}-kubeconfig"
  no_log: true
