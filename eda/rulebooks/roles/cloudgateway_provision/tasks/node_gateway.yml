---
# shc (design/P7-PLAN.md P7.3.5): the gateway instance on one border gateway node (delegated over SSH, become).
# Inputs: bgw_node, cg_instance (apply config), cg_pe, cg_root_pe, cg_fabric, fab_spec, cg_bgp_password.
# Appends the node's state to cg_node_results (and its name to cg_changed_nodes when anything changed).
# Runs under the fabric's lease fabric-config-<fabric>, renewed here before the node and before and after the wait for
# the core (realization nodes.configLease), and before the apply and the instance's start and reload when less is left
# than they may need (fabric_lease_ensure.yml); a renewal that finds the lease lost fails the job before the next
# step. The renewals set their own timeout: the node loop's step limit (common/vars/fabric_lease.yml) never stops them.
- name: "{{ bgw_node.name }}: renew the border gateway configuration lease"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
  vars:
    fab_ledger: {action: lease-renew, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cg_holder }}",
                 step: "the gateway instance on {{ bgw_node.name }}"}
  timeout: 0

- name: "{{ bgw_node.name }}: the gateway's site address"
  ansible.builtin.set_fact:
    cg_node_addr: "{{ (fab_spec.siteUnderlay.addresses | selectattr('node', 'equalto', bgw_node.name) | first).address }}"

- name: "{{ bgw_node.name }}: the root instance must be up"
  ansible.builtin.command: systemctl is-active shc-fabric-apply@root.service
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

# the core transport (fab_node_transport: the fabric's one transport, the root's too) and the node's FRR
# (fab_frr_major); on the SRv6 core what it needs, before anything on the node changes
- name: "{{ bgw_node.name }}: the core transport and FRR on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../hybridfabric_provision/tasks/node_transport.yml"
  vars:
    nt_who: "CloudGateway {{ fab_name }}"

# the SRv6 locators differ per node (the node's position in borderGateway.nodes): the root's (index 1) and this
# gateway's; only on the SRv6 core
- name: "{{ bgw_node.name }}: the root's SRv6 locator on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: 1
      nodeOrdinal: "{{ (cg_fabric.spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: keep the root's SRv6 locator"
  ansible.builtin.set_fact:
    cg_root_pe: >-
      {{ cg_root_pe | combine({'locator': fab_check_result.locator | default(''),
                               'locatorNode': fab_check_result.locatorNode | default(0)}) }}
    _cg_locator_errors: "{{ fab_check_result.errors | default([]) }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: the gateway's SRv6 locator on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: "{{ cg_pe.index }}"
      nodeOrdinal: "{{ (cg_fabric.spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: stop on an SRv6 locator that does not fit"
  ansible.builtin.fail:
    msg: >-
      CloudGateway {{ fab_name }} on {{ bgw_node.name }}: {{ ((_cg_locator_errors + fab_check_result.errors | default([]))
      | unique | join('; ')) or 'the realization gives no SRv6 locator for this node' }}
  when:
    - fab_node_transport == 'srv6'
    - (_cg_locator_errors + fab_check_result.errors | default([])) | length > 0
      or fab_check_result.locator | default('', true) | length == 0
      or cg_root_pe.locator | default('', true) | length == 0

- name: "{{ bgw_node.name }}: the gateway's SRv6 locator"
  ansible.builtin.set_fact:
    cg_pe: "{{ cg_pe | combine({'locator': fab_check_result.locator, 'locatorNode': fab_check_result.locatorNode}) }}"
  when: fab_node_transport == 'srv6'

- name: "{{ bgw_node.name }}: install the apply script and the gateway unit"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-fabric-apply, dest: /usr/local/sbin/shc-fabric-apply, mode: "0755"}
    - {src: shc-frr-check, dest: /usr/local/sbin/shc-frr-check, mode: "0755"}
    - {src: shc-gw@.service, dest: /etc/systemd/system/shc-gw@.service, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_files

# a new apply script takes effect through the direct run below (and at the next unit start), so on its own it needs
# no restart; only a new unit file restarts the running instance (FRR stop/start in the namespace resets its sessions)
- name: "{{ bgw_node.name }}: did the gateway unit change"
  ansible.builtin.set_fact:
    _cg_unit_changed: >-
      {{ _cg_files.results | selectattr('changed') | map(attribute='item.dest') | select('search', 'shc-gw@')
         | list | length > 0 }}

# the ICMPv6 source of the namespace's VRFs differs per node (the node's position in borderGateway.nodes); only with
# the IPv6 core the fabric offers (cg_ipv6_core, main.yml)
- name: "{{ bgw_node.name }}: the gateway's ICMPv6 source on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: "{{ cg_pe.index }}"
      nodeOrdinal: "{{ (cg_fabric.spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when:
    - cg_ipv6_core | default(false) | bool
    - fab_real.core.icmpSource6 | default('', true) | length > 0

- name: "{{ bgw_node.name }}: stop on an ICMPv6 source that does not fit"
  ansible.builtin.fail:
    msg: "CloudGateway {{ fab_name }} on {{ bgw_node.name }}: {{ fab_check_result.errors | join('; ') }}"
  when:
    - cg_ipv6_core | default(false) | bool
    - fab_real.core.icmpSource6 | default('', true) | length > 0
    - fab_check_result.errors | default([]) | length > 0

# the node's ICMPv6 source gets a forward-confirmed name after the nodes are done (reverse_dns.yml)
- name: "{{ bgw_node.name }}: remember the ICMPv6 source for its name"
  ansible.builtin.set_fact:
    cg_rdns_nodes: >-
      {{ cg_rdns_nodes | default([]) + [{'node': bgw_node.name, 'address': fab_check_result.icmp6 | regex_replace('/.*$', '')}] }}
  when:
    - cg_ipv6_core | default(false) | bool
    - fab_real.core.icmpSource6 | default('', true) | length > 0
    - fab_check_result.icmp6 | default('', true) | length > 0

# with the announcement on (cg_icmp6_announce, main.yml) the node announces its own ICMPv6 source to the site in every
# IPv6 VRF (frr-gateway.conf.j2). The apply loads the VRFs' input filter with the IPv6 core whether or not the node
# announces, so the filter is in place before the route is announced and stays after it is withdrawn
- name: "{{ bgw_node.name }}: the ICMPv6 source this node announces to the site"
  ansible.builtin.set_fact:
    cg_node_icmp6_announce: >-
      {{ (fab_check_result.icmp6 | default('', true)) if cg_icmp6_announce | default(false) | bool else '' }}

# the core's IPv6 keys are empty strings on an IPv4-only core and until the fabric offers the IPv6 core;
# loopbackPool6 and icmpSource6 let the apply remove addresses an earlier configuration left inside those ranges. On
# an srv6 node transport and srv6 {block, locator} (absent: mpls, so an mpls node's file stays as it was)
- name: "{{ bgw_node.name }}: gateway instance config"
  vars:
    _cg_icmp6: >-
      {{ fab_check_result.icmp6 if (cg_ipv6_core | default(false) | bool
                                    and fab_real.core.icmpSource6 | default('', true) | length > 0) else '' }}
  ansible.builtin.copy:
    dest: "/etc/shc-fabric/gw-{{ fab_name }}.json"
    content: >
      {{ cg_instance | combine({'address': cg_node_addr ~ '/' ~ (fab_spec.siteUnderlay.cidr | split('/') | last),
                                'loopback6': cg_pe.loopback6 | default(''), 'icmp6': _cg_icmp6,
                                'loopbackPool6': fab_real.core.loopbackPool6 | default('', true),
                                'icmpSource6': fab_real.core.icmpSource6 | default('', true),
                                'icmp6RateLimitMs': ('' if (fab_real.gateway | default({}, true)).icmp6RateLimitMs | default(none) is none
                                                     else (fab_real.gateway.icmp6RateLimitMs | string))})
         | combine({'transport': 'srv6', 'srv6': {'block': fab_real.core.srv6.block, 'locator': cg_pe.locator}}
                   if fab_node_transport | default('mpls') == 'srv6' else {})
         | to_nice_json }}
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_conf

# A VRF this run removes (a network no longer placed here) leaves FRR before the apply deletes its devices. Deleted
# first, FRR 8.5.3 zebra could crash withdrawing the site remote EVPN routes of the VRF (a neighbour entry on a device
# already gone), and watchfrr then restarts the whole instance: the site loses its traffic for half a minute, and a
# second crash soon after leaves the instance without zebra for minutes. The VRFs removed are the VRF devices t<n>
# of the namespace that the configuration no longer lists: their layer 3 VNI goes first (FRR refuses to remove the
# BGP instance of a VRF that still has one), then their BGP instance, then 3 s for zebra to withdraw the routes. The
# apply then deletes the devices, the reload below finds these lines gone already, and the step after it removes the
# VRF itself. Nothing is sent on a first run (no namespace), when nothing is removed, or while the instance is not
# active (its start loads the file without the VRF); a refusal is reported and the apply goes on as before
- name: "{{ bgw_node.name }}: take the VRFs this run removes out of FRR before the apply deletes their devices"
  ansible.builtin.shell: |
    ns=gw-{{ fab_name }}; u=shc-gw@{{ fab_name }}.service; V=(vtysh -N "$ns")
    want=" {{ cg_vrfs | map(attribute='vrf') | join(' ') }} "
    ip netns list | awk -v n="$ns" '$1 == n {f = 1} END {exit !f}' || { echo "out="; exit 0; }
    systemctl -q is-active "$u" || { echo "out="; exit 0; }
    gone=""
    for v in $(ip netns exec "$ns" ip -br link show type vrf | awk '$1 ~ /^t[0-9]+$/ {print $1}'); do
      case "$want" in *" $v "*) ;; *) gone="$gone $v" ;; esac
    done
    [ -n "$gone" ] || { echo "out="; exit 0; }
    run=$("${V[@]}" -c 'show running-config') || { echo "the running configuration is unreadable" >&2; echo "out="; exit 0; }
    cmds=(-c 'configure terminal'); out=""
    for v in $gone; do
      b=$(awk -v v="$v" '$1 == "router" && $2 == "bgp" && $4 == "vrf" && $5 == v {print; exit}' <<< "$run")
      n=$(awk -v v="$v" '$1 == "vrf" && $2 == v {s = 1; next} s && $1 == "exit-vrf" {s = 0} s && $1 == "vni" {print $2; exit}' <<< "$run")
      [ -z "$n" ] || cmds+=(-c "vrf $v" -c "no vni $n" -c "exit-vrf")
      [ -z "$b" ] || cmds+=(-c "no $b")
      [ -z "$b$n" ] || out="$out $v"
    done
    if [ -n "$out" ]; then
      r=$("${V[@]}" "${cmds[@]}" -c end 2>&1) || true
      [[ $r != *%* ]] || echo "FRR refused part of it: $r" >&2
      sleep 3
    fi
    echo "out=${out# }"
  args:
    executable: /bin/bash
  register: _cg_vrfs_out
  changed_when: _cg_vrfs_out.stdout is search('out=.')
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: the lease lasts for the apply"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the apply on {{ bgw_node.name }}"
  timeout: 0

# an IPv6 step that fails leaves IPv6 out and the IPv4 side as always (exit 0, so a boot keeps the gateway), and
# prints the marker the job fails on. The apply runs under a limit on the node 15 s below the step's own: past it,
# timeout ends the apply and what it started (rc 124), an ordinary failure on a quiet node
- name: "{{ bgw_node.name }}: apply the gateway instance (namespace, site leg, core leg)"
  ansible.builtin.command: >-
    timeout -k 10 {{ [fab_lease_step_timeout | int - 15, 15] | max }} /usr/local/sbin/shc-fabric-apply gw-{{ fab_name }} up
  register: _cg_apply
  changed_when: "'changed=yes' in _cg_apply.stdout"
  failed_when: _cg_apply.rc != 0 or 'IPv6 core not applied' in _cg_apply.stdout
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR instance directory"
  ansible.builtin.file:
    path: "/etc/frr/gw-{{ fab_name }}"
    state: directory
    owner: frr
    group: frr
    mode: "0750"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR daemons and vtysh config"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/frr/gw-{{ fab_name }}/{{ item.dest }}"
    owner: frr
    group: frr
    mode: "0640"
  loop:
    - {src: daemons.j2, dest: daemons}
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_daemons

- name: "{{ bgw_node.name }}: vtysh config"
  ansible.builtin.copy:
    dest: "/etc/frr/gw-{{ fab_name }}/vtysh.conf"
    content: ""
    force: false
    owner: frr
    group: frrvty
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"

# The instance runs what its last start or reload loaded from frr.conf.shc. A job that wrote the file and stopped
# before the reload (it failed, crashed, timed out or lost the lease) leaves a file the next job finds unchanged, so
# the reload is also due while the file differs from what was last loaded: its digest, recorded in
# /etc/shc-fabric/gw-<gateway>.frr-loaded after the instance took it (frr.conf itself is FRR's own copy). An instance
# without that record (the first run with it) records the file as it is, before this run writes it: the assumption
# every run made before, so the upgrade alone reloads nothing
- name: "{{ bgw_node.name }}: what the instance last loaded (without the record: the file as it is)"
  ansible.builtin.shell: |
    f=/etc/shc-fabric/gw-{{ fab_name }}.frr-loaded
    [ -s "$f" ] && exit 0
    cat /etc/frr/gw-{{ fab_name }}/frr.conf.shc 2>/dev/null | sha256sum | cut -d' ' -f1 > "$f.new" && mv "$f.new" "$f"
    echo recorded
  register: _cg_frr_seen
  changed_when: "'recorded' in _cg_frr_seen.stdout"
  delegate_to: "{{ bgw_node.name }}"

# the file holds the BGP session password: never shown. The desired configuration (frr.conf.shc): FRR rewrites its
# frr.conf after every reload, so comparing against that would always see a change
- name: "{{ bgw_node.name }}: FRR configuration"
  ansible.builtin.template:
    src: frr-gateway.conf.j2
    dest: "/etc/frr/gw-{{ fab_name }}/frr.conf.shc"
    owner: frr
    group: frr
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_frrconf
  no_log: true

- name: "{{ bgw_node.name }}: is a reload due (the file differs from what the instance last loaded)"
  ansible.builtin.shell: |
    now=$(cat /etc/frr/gw-{{ fab_name }}/frr.conf.shc 2>/dev/null | sha256sum | cut -d' ' -f1)
    was=$(cat /etc/shc-fabric/gw-{{ fab_name }}.frr-loaded 2>/dev/null)
    if [ "$now" = "$was" ]; then echo reload=no; else echo reload=due; fi
  register: _cg_frr_due
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: is the gateway instance running"
  ansible.builtin.command: "systemctl is-active shc-gw@{{ fab_name }}"
  register: _cg_active
  changed_when: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: the lease lasts for the instance's start"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the instance's start on {{ bgw_node.name }}"
  timeout: 0

- name: "{{ bgw_node.name }}: start the gateway instance (enabled at boot)"
  ansible.builtin.systemd:
    name: "shc-gw@{{ fab_name }}.service"
    enabled: true
    daemon_reload: "{{ _cg_files is changed }}"
    state: >-
      {{ 'started' if _cg_active.stdout != 'active'
         else ('restarted' if (_cg_daemons is changed or _cg_unit_changed | bool) else omit) }}
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_state

- name: "{{ bgw_node.name }}: the lease lasts for the FRR reload"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_ensure.yml"
  vars:
    fab_lease_step: "the FRR reload on {{ bgw_node.name }}"
  timeout: 0

# one retry: some changes take two passes (FRR 8.5 refuses `bgp graceful-restart` -> `bgp graceful-restart-disable` in
# one reload, "not valid at this moment", yet ends in the new state; the second reload has nothing left to change)
- name: "{{ bgw_node.name }}: reload the FRR configuration"
  ansible.builtin.systemd:
    name: "shc-gw@{{ fab_name }}.service"
    state: reloaded
  when:
    - _cg_active.stdout == 'active'
    - _cg_daemons is not changed and not (_cg_unit_changed | bool)
    - _cg_frrconf is changed or 'reload=due' in _cg_frr_due.stdout
  delegate_to: "{{ bgw_node.name }}"
  register: _cg_reload
  retries: 1
  delay: 5
  until: _cg_reload is succeeded

# the instance runs the file when this job found it active and the reload (when one was due) succeeded, or when this
# job started or restarted it; a step above that failed ended the job before this. An instance that was starting or
# reloading on its own (activating, reloading: its automatic restart, or what a timed-out step began) may have read an
# older file, so then nothing is recorded, nor while a job for it is still queued, and the next job finds the reload
# due. A reload only the record made due changed the node too: it counts as a configuration change (_cg_frrconf).
# A start or reload can also end without an error and part of the file unapplied: before the record, the running
# configuration must hold the whole file (shc-frr-check, realization nodes.frrLoadCheck); with lines left nothing is
# recorded and the job fails after the next step, so the next one reloads again
- name: "{{ bgw_node.name }}: record what the instance loaded"
  ansible.builtin.shell: |
    f=/etc/shc-fabric/gw-{{ fab_name }}.frr-loaded
    u=shc-gw@{{ fab_name }}.service
    state=$(systemctl is-active "$u"); job=$(systemctl show -p Job --value "$u")
    if [ "$state" != active ] || [ -n "$job" ]; then echo "not recorded: $u $state${job:+, job $job}"; exit 0; fi
    now=$(cat /etc/frr/gw-{{ fab_name }}/frr.conf.shc 2>/dev/null | sha256sum | cut -d' ' -f1)
    [ "$now" = "$(cat "$f" 2>/dev/null)" ] && exit 0
    {% if fab_real.nodes.frrLoadCheck.enabled | default(true) | bool %}
    check=$(/usr/local/sbin/shc-frr-check --conf /etc/frr/gw-{{ fab_name }}/frr.conf.shc --pathspace gw-{{ fab_name }} --note /etc/shc-fabric/gw-{{ fab_name }}.frr-unapplied{% for p in fab_real.nodes.frrLoadCheck.ignore | default([]) %} --ignore {{ p | quote }}{% endfor %}) || exit 1
    echo "$check"
    [ "${check%%$'\n'*}" = result=unapplied ] && exit 0
    {% endif %}
    echo "$now" > "$f.new" && mv "$f.new" "$f"
    echo recorded
  args:
    executable: /bin/bash
  register: _cg_frr_recorded
  changed_when: "'recorded' in _cg_frr_recorded.stdout_lines"
  when: _cg_active.stdout == 'active' or (_cg_active.stdout in ['inactive', 'failed'] and _cg_state is changed)
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: a reload the record made due changed the node"
  ansible.builtin.set_fact:
    _cg_frrconf: "{{ _cg_frrconf | combine({'changed': true}) }}"
  when: _cg_reload is changed and _cg_frrconf is not changed

- name: "{{ bgw_node.name }}: the instance holds the whole configuration"
  ansible.builtin.fail:
    msg: >-
      The gateway instance gw-{{ fab_name }} on {{ bgw_node.name }} did not apply all of its configuration
      (frr.conf.shc) after its start or reload ({{ _cg_frr_recorded.stdout_lines | select('match', '^line: ')
      | map('regex_replace', '^line: ', '') | join('; ') }}). What it loaded is not recorded, so the next run reloads
      again; lines a second start or reload leaves as well are recorded as loaded and shown by the step after this
  when: "'result=unapplied' in (_cg_frr_recorded.stdout_lines | default([]))"

- name: "{{ bgw_node.name }}: lines the instance does not take"
  ansible.builtin.debug:
    msg: >-
      The gateway instance gw-{{ fab_name }} on {{ bgw_node.name }} left these lines of its configuration unapplied
      after two starts or reloads; the file is recorded as loaded, so no run reloads for them again: {{
      _cg_frr_recorded.stdout_lines | select('match', '^line: ') | map('regex_replace', '^line: ', '') | join('; ') }}
  when: "'result=accepted' in (_cg_frr_recorded.stdout_lines | default([]))"

# A VRF the configuration no longer has (a network no longer placed here) stays in FRR after the reload: frr-reload
# removes the lines of its vrf stanza but never sends "no vrf", so zebra and the other daemons keep it as configured
# (show vrf: "vrf <name> inactive (configured)", nothing in the running configuration) until FRR restarts. The apply
# above already deleted its device, so FRR accepts the removal now; it touches no other VRF and no session. Only a
# VRF that zebra lists as inactive, that the rendered configuration does not name and that has no BGP instance left
# is removed. One that FRR refuses is reported and stays (inert: no device, no routes); the next job tries again.
# Same code as the root's (only the first line differs)
- name: "{{ bgw_node.name }}: remove from FRR the VRFs its configuration no longer has"
  ansible.builtin.shell: |
    u=shc-gw@{{ fab_name }}.service; conf=/etc/frr/gw-{{ fab_name }}/frr.conf.shc; V=(vtysh -N gw-{{ fab_name }})
    systemctl -q is-active "$u" && [ -r "$conf" ] || exit 0
    # whether the text on stdin names the VRF: its vrf stanza or a BGP instance in it
    named() {
      awk -v v="$1" '($1 == "vrf" && $2 == v) || ($1 == "router" && $2 == "bgp" && $4 == "vrf" && $5 == v) {f = 1} END {exit !f}'
    }
    vrfs=$("${V[@]}" -c 'show vrf') && run=$("${V[@]}" -c 'show running-config') \
      || { echo "the VRFs of the instance are unreadable; left to the next job" >&2; exit 0; }
    removed=""; kept=""
    for v in $(awk '$1 == "vrf" && $3 == "inactive" {print $2}' <<< "$vrfs"); do
      named "$v" < "$conf" && continue
      if named "$v" <<< "$run"; then
        kept="$kept $v"; echo "VRF $v: it still has a BGP instance; left to the next job" >&2; continue
      fi
      out=$("${V[@]}" -c 'configure terminal' -c "no vrf $v" 2>&1) && [[ $out != *%* ]] && { removed="$removed $v"; continue; }
      kept="$kept $v"; echo "VRF $v: FRR keeps it: ${out:-no reason given}" >&2
    done
    echo "removed=${removed# }"
    [ -z "$kept" ] || echo "kept=${kept# }"
  args:
    executable: /bin/bash
  register: _cg_vrfs_gone
  changed_when: _cg_vrfs_gone.stdout is search('removed=.')
  delegate_to: "{{ bgw_node.name }}"

