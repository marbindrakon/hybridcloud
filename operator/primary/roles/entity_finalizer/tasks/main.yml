---
- block:
    - name: Get current timestamp
      ansible.builtin.set_fact:
        entity_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark Entity as awaiting EDA delete
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          message: Awaiting EDA delete
          lastReconciledAt: "{{ entity_delete_transition_time }}"

    - name: Build compact Entity delete event note (K8s Event note field max 1024 chars)
      ansible.builtin.set_fact:
        entity_delete_event_note: >-
          {{
            {
              'billingID': (_hybridsovereign_redhat_entity.spec.billingID | default('')),
              'description': (_hybridsovereign_redhat_entity.spec.description | default('')) | truncate(400, True, '…'),
              'websiteLink': (_hybridsovereign_redhat_entity.spec.websiteLink | default(''))
            } | to_json
          }}

    # shc (LAB-PLAN §11.6): tear down the entity's CRs in dependency order first. The namespace operator
    # runs their finalizers, so it and the namespace go only after every tier is gone (upstream removed
    # both at once, stranding CloudOSO/PlatformOpenshift finalizers - the P0 orphans).
    - name: List the entity namespace's CRs
      kubernetes.core.k8s_info:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item }}"
        namespace: "entity-{{ ansible_operator_meta.name }}"
      loop: "{{ entity_teardown_tiers | flatten }}"
      register: _entity_crs

    - name: Find the first tier that still has CRs
      ansible.builtin.set_fact:
        _entity_tier_json: >-
          {%- set by_kind = {} -%}
          {%- for r in _entity_crs.results -%}
            {%- set _ = by_kind.update({r.item: (r.resources | default([]) | map(attribute='metadata.name') | list)}) -%}
          {%- endfor -%}
          {%- set ns = namespace(tier=none) -%}
          {%- for tier in entity_teardown_tiers -%}
            {%- if ns.tier is none -%}
              {%- set left = [] -%}
              {%- for k in tier -%}{%- for n in by_kind.get(k, []) -%}{%- set _ = left.append(k ~ '/' ~ n) -%}{%- endfor -%}{%- endfor -%}
              {%- if left | length > 0 -%}{%- set ns.tier = {'index': loop.index, 'left': left} -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.tier | to_json }}

    - name: Tear down the current tier
      when: (_entity_tier_json | from_json) is not none
      block:
        - name: Delete the tier's CRs
          kubernetes.core.k8s:
            state: absent
            api_version: hybridsovereign.redhat/v1alpha1
            kind: "{{ item.split('/')[0] }}"
            name: "{{ item.split('/')[1] }}"
            namespace: "entity-{{ ansible_operator_meta.name }}"
            wait: false
          loop: "{{ (_entity_tier_json | from_json).left }}"

        - name: Record the teardown progress
          operator_sdk.util.k8s_status:
            api_version: hybridsovereign.redhat/v1alpha1
            kind: Entity
            name: "{{ ansible_operator_meta.name }}"
            namespace: "{{ ansible_operator_meta.namespace }}"
            status:
              status: reconciling
              ready: false
              message: >-
                Deleting tier {{ (_entity_tier_json | from_json).index }}/{{ entity_teardown_tiers | length }}:
                waiting for {{ (_entity_tier_json | from_json).left | join(', ') }}

        - name: Requeue until the tier is gone
          ansible.builtin.fail:
            msg: >-
              Entity teardown waits for {{ (_entity_tier_json | from_json).left | join(', ') }}
              (tier {{ (_entity_tier_json | from_json).index }}/{{ entity_teardown_tiers | length }})

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "EntityDeleteRequested"
        operator_event_action: "Delete"
        operator_event_note: "{{ entity_delete_event_note }}"
        operator_reporting_controller: entity-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: Entity
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_entity.metadata.uid }}"


  rescue:
    - name: Mark Entity delete as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Deletion failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal finalizer failure
      ansible.builtin.fail:
        msg: "Entity {{ ansible_operator_meta.name }} deletion failed — see status.message for details"

- name: Exit cleanly when EDA completed deletion
  ansible.builtin.meta: end_host
  when: _hybridsovereign_redhat_entity.status.deletionComplete | default(false) | bool

- name: Derive entity tenant namespace for teardown
  ansible.builtin.set_fact:
    entity_tenant_namespace: "entity-{{ ansible_operator_meta.name }}"

- name: Remove namespace operator Deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: hybridsovereign-namespace-operator
    namespace: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Remove namespace operator ClusterRoleBinding
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: "hybridsovereign-namespace-operator-{{ ansible_operator_meta.name }}"
  ignore_errors: true

- name: Remove namespace operator RoleBinding
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    name: hybridsovereign-namespace-operator
    namespace: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Remove namespace operator Role
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: Role
    name: hybridsovereign-namespace-operator
    namespace: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Remove AMQ producer credentials from entity tenant namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: amq-producer-credentials
    namespace: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Remove namespace operator ServiceAccount
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ServiceAccount
    name: hybridsovereign-namespace-operator
    namespace: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Remove entity tenant namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ entity_tenant_namespace }}"
  ignore_errors: true

- name: Block finalizer until EDA completes deletion
  ansible.builtin.fail:
    msg: Waiting for EDA to complete deletion
