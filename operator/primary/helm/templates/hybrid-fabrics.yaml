{{- /*
shc (design/P7-PLAN.md P7.3.3): the platform's HybridFabrics in the platform namespace, keyed by name, each
{spec: <HybridFabric spec>} (enabled: false skips one). Removing one deletes it; its finalizer waits until no
CloudGateway or HybridNetwork uses it.
*/}}
{{- range $name, $f := .Values.hybridFabrics }}
{{- if ne (toString $f.enabled) "false" }}
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- toYaml $f.spec | nindent 2 }}
{{- end }}
{{- end }}
