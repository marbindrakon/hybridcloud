---
# The tenant realm's automation client for sign-in flows (client-credentials grant): the realm-management role
# manage-realm, which the identity provider asks for any change of an authentication flow. Published by the RbacConfig
# (platformopenshift_rbac_config) in central Vault <keycloak_automation_vault_prefix>/<rbacconfig> as flowsClientId and
# flowsClientSecret, next to the membership and clients ones (common/tasks/obtain_keycloak_realm_token.yml). Asked at
# kc_base_url (the address the job sends its requests to). Sets csl_flows_token.
- name: Read the realm automation credentials for sign-in flows
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: >-
      {{ keycloak_automation_vault_prefix | default('keycloak-automation') }}/{{ platformopenshift_rbac_config
         | default('keycloak-sovereign-tenants-services', true) }}
    vault_kv_read_missing_ok: true

- name: Keep the credentials for sign-in flows
  ansible.builtin.set_fact:
    _cft_id: "{{ vault_kv_data.flowsClientId | default('') }}"
    _cft_secret: "{{ vault_kv_data.flowsClientSecret | default('') }}"
    _cft_realm: "{{ vault_kv_data.realm | default('') }}"
    vault_kv_data: {}
  no_log: true

- name: Require the published automation client for sign-in flows
  ansible.builtin.fail:
    msg: >-
      The sign-in directory's automation client for sign-in flows is not published, so who can sign in to the cluster
      cannot be limited; the cluster is not connected to the sign-in directory.
  when: _cft_id | length == 0 or _cft_secret | length == 0 or _cft_realm | length == 0

- name: Request the realm token for sign-in flows
  ansible.builtin.uri:
    url: "{{ kc_base_url | regex_replace('/$', '') }}/realms/{{ _cft_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ _cft_id }}"
      client_secret: "{{ _cft_secret }}"
    validate_certs: false
    status_code: [200]
  register: _cft_resp
  retries: 5
  delay: 5
  until: _cft_resp is succeeded
  no_log: true

- name: Keep the realm token for sign-in flows
  ansible.builtin.set_fact:
    csl_flows_token: "{{ _cft_resp.json.access_token }}"
    _cft_secret: ""
    _cft_resp: {}
  no_log: true
