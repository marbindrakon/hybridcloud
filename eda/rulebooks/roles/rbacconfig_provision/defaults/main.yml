---
plugin_rbac_operator_namespace: sovereign-cloud-plugins
plugin_rbac_keycloak_realm: sovereign-tenants
# Realm automation clients of an RbacConfig (tasks/automation_client.yml): purpose, client id suffix and the exact
# realm-management roles of its service account. Credentials in central Vault <keycloak_automation_vault_prefix>/<name>.
# membership never reads client representations: view-clients would hand it every confidential client's secret
# (the clients one included). clients holds view-users (read-only) because the tool orgs' sign-in check
# (keycloak_verify_group_claim.yml) asks Keycloak for a member's example token of a client, which needs view of the
# client and of the user in one token; clients already sees every client secret through manage-clients.
plugin_rbac_automation_clients:
  - purpose: membership
    suffix: ""
    roles: [manage-users, view-users, query-users, query-groups, query-clients]
  - purpose: clients
    suffix: "-clients"
    roles: [manage-clients, view-clients, query-clients, view-users]
# Protocol mapper types the clients automation client may add to, change on or remove from a client. The sign-in
# directory lets an account that manages clients but not the realm touch only the mapper types its realm lists
# (realm attribute allowedProtocolMapperTypesForClientAdministrators; without it such an account is refused every
# mapper). The platform's jobs use exactly these two: group membership for the tools' sign-in clients, client roles
# for a cluster's and a site's sign-in client. Types an administrator listed there by hand are kept.
plugin_rbac_automation_mapper_types:
  - oidc-group-membership-mapper
  - oidc-usermodel-client-role-mapper
keycloak_automation_vault_prefix: keycloak-automation
