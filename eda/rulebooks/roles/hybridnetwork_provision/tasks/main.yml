---
# shc (design/P7-PLAN.md P7.3.3, §12.3): HybridNetwork provision. Resolves the fabric (spec.fabricRef, else the
# one recorded earlier, else the platform's only fabric), checks the Entity may use it and the MTU, and records
# entity, fabric, MTU and the placement counts; ends pending while the fabric isn't ready. Then allocates the
# network's VPN route target from the fabric's ledger (P7.3.8): the gateways of the sites the network is placed on
# exchange its routes under it. Internet egress (spec.egress.internet, P7.4): the network holds an egress index in
# the ledger while it wants egress; the HybridFabric job realizes it on the border gateway nodes (default route into
# the network, source NAT) and wakes the network when it did; status.egress {internet: pending|ready|removing|
# unavailable, sourceAddresses}. Turning it off: the fabric removes it first, then the index goes back.
# Address space (design/P10-PLAN.md §2.1): the IPAM holds spec.prefixes with the platform's ranges inside them, which
# it never allocates (a prefix wholly inside one is refused: PrefixReserved); no prefix may hold an accept entry of
# the network's attachment circuits (PrefixInUse); the IPAM refuses an edit that would leave a placement's subnet
# outside (PrefixInUse, the space unchanged); status.addressSpace. A change wakes the network's placements waiting
# for address space.
# IPv6 (design/IPV6-PLAN.md §2.1, §2.2; OD63, OD65, OD66, OD73): the mode comes from the fields (ipv6_mode.yml) and
# can't change while the network has placements (IPv6ModeInUse); a tenant prefix overlapping the platform's own
# space (realization network.exclusiveRanges, the public pools, core.icmpSource6 and 4, core.srv6.block) is refused
# (PrefixReserved); a mode-Tenant IPv6 prefix may not overlap another network of the same tenant (PrefixInUse, in
# the IPAM); mode Platform takes a block from the fabric's public pool (pending WaitingForAddressSpace while none is
# free, the tenant's allowance is used or the pinned block is held back), given back when the mode changes or the
# network goes (hold-down); status.ipv6 and the per-family status.egress (egress_status.yml).
# status.ipv6.providerPrefixes lists the IPv6 subnets cloud providers assigned to the placements (read-only, outside
# the address space).
# Platform access (spec.platformAccess, default true; platform_access.yml): status.platformAccess and the condition
# PlatformReachable say whether the platform's management can reach the OpenShift clusters it builds on the network;
# the prefixes those clusters ask for (PlatformOpenshift status.platformPrefixes) are checked one by one and handed to
# the fabric, which realizes them in its service routing domain. The network's own readiness never depends on it.
# The ranges the platform's management connects from (realization infrastructure.hub) are exclusive: a new prefix
# overlapping one is refused (PrefixReserved); one the address space already holds keeps working and is reported
# (PlatformReachable InfrastructureOverlap and an event).
- block:
    - name: Read the HybridNetwork
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    # the platform reach annotation is replaced by spec.platformAccess and the clusters' status.platformPrefixes: a
    # network that still carries it loses it
    - name: Remove the retired platform reach annotation
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: patched
        merge_type: merge
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridNetwork
        name: "{{ fab_name }}"
        namespace: "{{ fab_namespace }}"
        definition:
          metadata:
            annotations:
              shc.signal9.gg/platform-reach: null
      when: "'shc.signal9.gg/platform-reach' in (fab_obj.metadata.annotations | default({}, true))"

    - name: List the network's placements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ fab_namespace }}"
      register: _hn_placements

    # the IPv6 subnets cloud providers assigned to the network's placements (their status.subnets rows with source
    # Provider), one entry per row as the placement reports it, ordered by placement: status.ipv6.providerPrefixes.
    # Read-only: never allocated and not part of status.addressSpace (the IPAM, the circuits, the fabric's
    # announcements and egress filters don't read it). Absent (null) when there is none, like block and holdDownUntil.
    # A placement whose teardown finished (deletionComplete: it only waits for its finalizer) is left out. The
    # placement wakes the network when its provider subnet came, went or changed since the network listed it, and
    # its teardown wakes it once it is complete (networkplacement_provision, networkplacement_teardown). Computed first,
    # so that every status write carries it: the ready write and the wait for platform address space in status.ipv6,
    # the wait for the fabric and a failure through hn_provider6_patch (a merge patch of status.ipv6 that leaves its
    # other keys as they are); otherwise a list that never clears makes every ready provider placement wake the
    # network again.
    - name: The placements' provider-assigned IPv6 subnets
      ansible.builtin.set_fact:
        hn_provider6: >-
          {%- set out = [] -%}
          {%- for p in _hn_placements.resources | default([]) -%}
            {%- set st = p.status | default({}, true) -%}
            {%- if p.spec.network == fab_name and not (st.deletionComplete | default(false, true) | bool) -%}
              {%- for sn in st.subnets | default([], true) -%}
                {%- if sn.source | default('', true) == 'Provider' and ':' in sn.prefix | default('', true) -%}
                  {%- set _ = out.append({'prefix': sn.prefix, 'placement': p.metadata.name}
                                         | combine({'site': st.site} if st.site | default('', true) | length > 0 else {})) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | sort(attribute='prefix') | sort(attribute='placement') }}

    - name: The provider-assigned subnets for the writes without the network's IPv6 status
      ansible.builtin.set_fact:
        # null removes the list; nothing at all on a status without status.ipv6 and with no list to write
        hn_provider6_patch: >-
          {{ {'ipv6': {'providerPrefixes': hn_provider6 if hn_provider6 | length > 0 else none}}
             if (hn_provider6 | length > 0 or (fab_st.ipv6 | default({}, true)) | length > 0) else {} }}

    - name: List the platform's fabrics
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        namespace: "{{ fabric_platform_namespace }}"
      register: _hn_fabrics

    - name: Choose the fabric
      ansible.builtin.set_fact:
        hn_waiting: []
        hn_fabric_name: >-
          {{ (fab_spec.fabricRef | default({})).name | default('', true)
             or fab_st.fabric | default('', true)
             or ((_hn_fabrics.resources | map(attribute='metadata.name') | list | first)
                 if _hn_fabrics.resources | length == 1 else '') }}

    - name: Refuse a fabric change
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: it uses HybridFabric {{ fab_st.fabric }}; spec.fabricRef
          {{ fab_spec.fabricRef.name }} cannot move it
      when:
        - (fab_spec.fabricRef | default({})).name | default('', true) | length > 0
        - fab_st.fabric | default('', true) | length > 0
        - fab_spec.fabricRef.name != fab_st.fabric

    - name: Refuse an ambiguous default
      ansible.builtin.set_fact:
        fab_fail_reason: FabricAmbiguous
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the platform has {{ _hn_fabrics.resources | length }} fabrics; set
          spec.fabricRef
      when:
        - fab_fail_msg | default('', true) | length == 0
        - hn_fabric_name | length == 0
        - _hn_fabrics.resources | length > 1

    - name: Stop on an invalid network
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_msg | default('', true) | length > 0

    - name: Set the fabric facts
      ansible.builtin.set_fact:
        hn_fabric: >-
          {{ (_hn_fabrics.resources | selectattr('metadata.name', 'equalto', hn_fabric_name) | list
              + [{}]) | first }}

    - name: Wait for a fabric
      ansible.builtin.set_fact:
        hn_waiting: >-
          {{ [('HybridFabric ' ~ hn_fabric_name ~ ' (not found)') if hn_fabric_name else 'a HybridFabric (the platform has none)'] }}
      when: hn_fabric | length == 0

    - name: Check the fabric allows the Entity and the MTU
      when: hn_fabric | length > 0
      block:
        - name: Refuse an Entity the fabric does not allow
          ansible.builtin.set_fact:
            fab_fail_reason: EntityNotAllowed
            fab_fail_msg: "Entity {{ fab_entity }} may not use HybridFabric {{ hn_fabric_name }} (spec.entityRefs)"
          when:
            - hn_fabric.spec.entityRefs | default([]) | length > 0
            - fab_entity not in (hn_fabric.spec.entityRefs | map(attribute='name') | list)

        - name: Refuse an MTU above the fabric's
          ansible.builtin.set_fact:
            fab_fail_reason: InvalidSpec
            fab_fail_msg: >-
              HybridNetwork {{ fab_name }}: mtu {{ fab_spec.mtu }} is above HybridFabric {{ hn_fabric_name }}'s
              overlayMtu {{ hn_fabric.spec.overlayMtu }}
          when:
            - fab_fail_msg | default('', true) | length == 0
            - fab_spec.mtu is defined
            - fab_spec.mtu | int > hn_fabric.spec.overlayMtu | int

        - name: Stop on a refused network
          ansible.builtin.fail:
            msg: "{{ fab_fail_msg }}"
          when: fab_fail_msg | default('', true) | length > 0

        - name: Wait for the fabric to be ready
          ansible.builtin.set_fact:
            hn_waiting: >-
              {{ ['HybridFabric ' ~ hn_fabric_name ~ ' (' ~ ((hn_fabric.status | default({}, true)).status
                  | default('not provisioned', true)) ~ ')'] }}
          # usable: ready, or realized and not failed
          when: not (((hn_fabric.status | default({}, true)).ready | default(false) | bool) or (((hn_fabric.status | default({}, true)).realized | default(false) | bool) and (hn_fabric.status | default({}, true)).status | default('') != 'failed'))

    - name: Set the network status
      vars:
        _mine: "{{ _hn_placements.resources | default([]) | selectattr('spec.network', 'equalto', fab_name) | list }}"
        # the counts leave out a placement whose deletion is complete (only its finalizer is left): its teardown wakes
        # the network after deletionComplete, which may come before the placement is gone
        _counted: >-
          {%- set out = [] -%}
          {%- for p in _mine if not ((p.status | default({}, true)).deletionComplete | default(false, true) | bool) -%}
            {%- set _ = out.append(p) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.set_fact:
        # every placement of the network that still exists holds (or may hold) a subnet
        hn_holders: "{{ _mine | map(attribute='metadata.name') | map('regex_replace', '^', 'NetworkPlacement/' ~ fab_namespace ~ '/') | list }}"
        hn_status: >-
          {{ {'entity': fab_entity,
              'placementCount': _counted | length,
              'placementsReady': _counted | selectattr('status.ready', 'defined') | selectattr('status.ready') | list | length}
             | combine({'fabric': hn_fabric_name} if hn_fabric | length > 0 else {})
             | combine({'mtu': (fab_spec.mtu | default(hn_fabric.spec.overlayMtu)) | int} if hn_fabric | length > 0 else {}) }}

    - name: Report what the network waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: WaitingForDependencies
        fab_message: "Waiting for {{ hn_waiting | join('; ') }}"
        fab_waiting_for: "{{ hn_waiting }}"
        fab_status: "{{ hn_status | combine(hn_provider6_patch) }}"
      when: hn_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: hn_waiting | length > 0

    # ---- address space ----
    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ hn_fabric_name }}"

    - name: List the attachment circuits
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        namespace: "{{ fab_namespace }}"
      register: _hn_circuits

    # the platform's own ranges inside the networks' VRFs (as the circuit job and the fabric's circuit policy), and
    # the ranges the platform's management connects from (infrastructure.hub): stepped around by the IPAM; a prefix
    # overlapping one of the latter is refused below unless the address space already holds it
    - name: The platform's ranges
      ansible.builtin.set_fact:
        hn_hub: "{{ (fab_real.infrastructure | default({}, true)).hub | default([], true) }}"
        hn_platform_ranges: >-
          {{ [fab_real.attachments.linkPool, fab_real.core.loopbackPool, fab_real.core.linkSubnet,
              fab_real.egress.linkPool | default('169.254.0.0/16')]
             + ((fab_real.infrastructure | default({}, true)).hub | default([], true)) }}

    - name: The network's IPv6 mode
      ansible.builtin.include_tasks: ipv6_mode.yml

    # address space the platform keeps for itself (its own globally routed space, translation prefixes) and every
    # public pool: no tenant prefix may overlap it
    # the SRv6 SID block is exclusive too: inside every provider edge a destination in it is looked up outside the
    # VRFs, so a network could never use a prefix that overlaps it. So is core.icmpSource6: the gateways refuse every
    # route inside it from a site (the nodes' own addresses, announced to the sites) and the cloud edge routers hold
    # addresses from it, so a tenant prefix overlapping it would lose its site routes. And core.icmpSource4, local in
    # every root VRF
    - name: The platform's exclusive ranges
      ansible.builtin.set_fact:
        hn_exclusive: >-
          {{ (fab_real.network | default({}, true)).exclusiveRanges | default([], true)
             + ((fab_real.ipam | default({}, true)).publicPools | default({}, true) | dict2items
                | map(attribute='value') | map(attribute='prefixes', default=[]) | flatten)
             + ([((fab_real.core | default({}, true)).srv6 | default({}, true)).block]
                if ((fab_real.core | default({}, true)).srv6 | default({}, true)).block | default('', true) else [])
             + ([(fab_real.core | default({}, true)).icmpSource6]
                if (fab_real.core | default({}, true)).icmpSource6 | default('', true) else [])
             + ([(fab_real.core | default({}, true)).icmpSource4 | regex_replace('/32$', '') ~ '/32']
                if (fab_real.core | default({}, true)).icmpSource4 | default('', true) else []) }}

    - name: Check the address space against the platform's ranges and the circuits
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: check-network
          prefixes: "{{ fab_spec.prefixes | default([], true) }}"
          reserved: "{{ hn_platform_ranges }}"
          exclusive: "{{ hn_exclusive }}"
          circuits: >-
            {%- set out = [] -%}
            {%- for c in _hn_circuits.resources | default([]) -%}
              {%- if c.spec.network == fab_name and c.metadata.deletionTimestamp is not defined -%}
                {%- set _ = out.append({'name': c.metadata.name, 'accept': (c.spec.routing | default({}, true)).accept | default([], true)}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ out }}

    - name: Refuse a prefix inside a platform range or holding a circuit's accept entry
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ 'PrefixReserved' if fab_check_result.reserved | length > 0 else 'PrefixInUse' }}"
        fab_fail_msg: "HybridNetwork {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on a refused address space
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    # the hub's ranges are exclusive: a prefix overlapping one is refused (PrefixReserved), except one the address
    # space already holds (a network that predates the rule keeps working; PlatformReachable reports it)
    - name: Check the address space against the ranges the platform's management connects from
      ansible.builtin.command:
        argv: [python3, "{{ role_path }}/files/shc_platform_access.py"]
        stdin: >-
          {{ {'action': 'hub-check', 'prefixes': fab_spec.prefixes | default([], true), 'hub': hn_hub,
              'held': fab_st.addressSpace | default([], true) | map(attribute='prefix') | list,
              'reserved': (hn_fabric.status | default({}, true)).reservedRanges | default([], true)} | to_json }}
      register: _hn_hub_check
      changed_when: false
      when: hn_hub | length > 0

    - name: Keep the hub check
      ansible.builtin.set_fact:
        hn_hub_check: "{{ (_hn_hub_check.stdout | from_json) if _hn_hub_check is not skipped else {'refused': [], 'overlaps': []} }}"

    - name: Refuse a prefix overlapping the ranges the platform's management connects from
      ansible.builtin.set_fact:
        fab_fail_reason: PrefixReserved
        fab_fail_msg: "HybridNetwork {{ fab_name }}: {{ hn_hub_check.refused | join('; ') }}"
      when: hn_hub_check.refused | length > 0

    - name: Stop on a prefix overlapping the hub's ranges
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: hn_hub_check.refused | length > 0

    # ---- IPv6 mode and the platform block ----
    - name: The address space the IPAM holds
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam: {action: ipam-get, fabric: "{{ hn_fabric_name }}", network: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"}

    - name: The IPv6 mode in effect
      ansible.builtin.include_tasks: ipv6_realized.yml
      vars:
        hn_held: "{{ fab_ipam_result }}"

    # the sentence is shc_ipam.MODE_IN_USE (and the reason's summary in the status reasons registry, the UI words),
    # followed by the two modes; tests/unit/test_ipv6_api.py compares them
    - name: Refuse a change of the IPv6 mode while the network has placements
      ansible.builtin.set_fact:
        fab_fail_reason: IPv6ModeInUse
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the network's IPv6 mode can't change while it has placements;
          remove them or create a new network (it is {{ hn_mode6_realized }}, the spec asks for {{ hn_mode6 }})
      when:
        - hn_mode6_realized | length > 0
        - hn_mode6_realized != hn_mode6
        - hn_holders | length > 0

    - name: Stop on a refused mode change
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_reason | default('') == 'IPv6ModeInUse'

    - name: Start without a platform block
      ansible.builtin.set_fact:
        hn_block: ""
        hn_pool: ""
        hn_block_new: false

    - name: The network's platform IPv6 block
      ansible.builtin.include_tasks: platform_block.yml
      when: hn_mode6 == 'Platform'

    - name: The address space in the IPAM
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam:
          action: ipam-space
          fabric: "{{ hn_fabric_name }}"
          network: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
          prefixes: "{{ fab_spec.prefixes | default([], true) + ([hn_block] if hn_block | length > 0 else []) }}"
          platform: "{{ [hn_block] if hn_block | length > 0 else [] }}"
          mode6: "{{ hn_mode6 }}"
          holders: "{{ hn_holders }}"
          tenant: "{{ fab_entity }}"
          reserved: "{{ hn_platform_ranges }}"

    - name: Refuse an edit that leaves placements' subnets outside the space
      ansible.builtin.set_fact:
        hn_space_refused: "{{ fab_ipam_result.refused | default([]) | length > 0 }}"
        fab_fail_reason: "{{ fab_ipam_result.reason | default('PrefixInUse', true) }}"
        fab_fail_msg: >-
          HybridNetwork {{ fab_name }}: the address space stays {{ fab_ipam_result.addressSpace | map(attribute='prefix') | join(', ') }}:
          {{ fab_ipam_result.refused | join('; ') }}
      when: fab_ipam_result.refused | default([]) | length > 0

    # a block taken in this run for a space that is refused goes back (one held before stays)
    - name: Give back a block taken for a refused space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam: {action: ipam-pool-release, fabric: "{{ hn_fabric_name }}", owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"}
      when:
        - hn_space_refused | default(false) | bool
        - hn_block_new | bool

    - name: Stop on a refused edit
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: hn_space_refused | default(false) | bool

    - name: Keep the address space
      ansible.builtin.set_fact:
        hn_space: "{{ fab_ipam_result.addressSpace }}"
        hn_space_changed: "{{ fab_ipam_result.changed | default(false) | bool }}"
        # (merge-patched: block and holdDownUntil are written as null when they don't apply)
        hn_ipv6_status: >-
          {{ {'mode': hn_mode6,
              'prefixes': [hn_block] if hn_block | length > 0 else hn_tenant6,
              'block': {'prefix': hn_block, 'prefixLength': hn_block.split('/')[1] | int,
                        'source': 'Pinned' if hn_platform6.prefix | default('', true) | length > 0 else 'Allocated'}
                       if hn_block | length > 0 else none,
              'holdDownUntil': none,
              'providerPrefixes': hn_provider6 if hn_provider6 | length > 0 else none} }}

    # not mode Platform (any more): a block the network still holds goes back to the pool (held down there, with the
    # hold-down realization has now)
    - name: The fabric's platform address pools before a release
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam_pools.yml"
      vars:
        fab_ipam_pools_fabric: "{{ hn_fabric_name }}"
        fab_ipam_pools_tolerant: true
      when:
        - hn_mode6 != 'Platform'
        - (fab_real.ipam | default({}, true)).publicPools | default({}, true) | length > 0

    - name: Give a platform block back
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
      vars:
        fab_ipam: {action: ipam-pool-release, fabric: "{{ hn_fabric_name }}", owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"}
      when:
        - hn_mode6 != 'Platform'
        - (fab_real.ipam | default({}, true)).publicPools | default({}, true) | length > 0

    - name: Wake the networks waiting for platform address space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/wake_waiting_networks.yml"
      vars:
        wn_fabric: "{{ hn_fabric_name }}"
        wn_except: {namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}
      when:
        - hn_mode6 != 'Platform'
        - (fab_real.ipam | default({}, true)).publicPools | default({}, true) | length > 0
        - fab_ipam_result.released | default(none, true) is not none

    # a placement without room waits; the space changed, so it may fit now
    - name: Wake the placements waiting for address space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: >-
          {%- set out = [] -%}
          {%- for p in _hn_placements.resources | default([]) -%}
            {%- set c = ((p.status | default({}, true)).conditions | default([], true) + [{}]) | first -%}
            {%- if p.spec.network == fab_name and p.metadata.deletionTimestamp is not defined
                  and (p.status | default({}, true)).status | default('') == 'pending'
                  and c.reason | default('') == 'WaitingForAddressSpace' -%}
              {%- set _ = out.append({'kind': 'NetworkPlacement', 'namespace': fab_namespace, 'name': p.metadata.name}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: hn_space_changed | bool

    # the network's VPN route target: the gateways of every site it is placed on import and export it
    - name: The network's VPN route target
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-allocate
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: vpnTarget
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"

    - name: Keep the route target
      ansible.builtin.set_fact:
        hn_vpn_target: "{{ fab_ledger_result.value | int }}"

    # internet egress: the fabric is the only writer of it on the nodes
    - name: What the fabric realizes for the network's egress
      vars:
        _eg: "{{ ((hn_fabric.status | default({}, true)).realization | default({}, true)).egress | default({}, true) }}"
      ansible.builtin.set_fact:
        hn_egress_want: "{{ (fab_spec.egress | default({})).internet | default(false) | bool }}"
        # IPv4 egress (source NAT) needs IPv4 space; IPv6 egress (routed) a platform block, and the fabric must offer
        # it (egress.ipv6.enabled in its realization)
        hn_egress_want4: "{{ ((fab_spec.egress | default({})).internet | default(false) | bool) and hn_v4 | length > 0 }}"
        hn_egress_want6: >-
          {{ ((fab_spec.egress | default({})).internet | default(false) | bool) and hn_mode6 == 'Platform'
             and (hn_block | default('', true)) | length > 0 }}
        hn_egress_offered: "{{ _eg.enabled | default(false) | bool }}"
        hn_egress_offered6: "{{ (_eg.ipv6 | default({}, true)).enabled | default(false) | bool }}"
        # translation for IPv6-only placements: some site of the realization has a translation prefix
        hn_translation_offered: >-
          {{ (fab_real.translation | default({}, true)).values() | select('mapping') | selectattr('pref64', 'defined')
             | map(attribute='pref64') | select | list | length > 0 }}
        # and the cloud provider's own translator: some site of the realization says provider: true
        hn_translation_provider_offered: >-
          {{ (fab_real.translation | default({}, true)).values() | select('mapping') | selectattr('provider', 'defined')
             | map(attribute='provider') | map('bool') | select | list | length > 0 }}
        hn_egress6_degraded: "{{ (_eg.ipv6 | default({}, true)).degraded | default(false) | bool }}"
        hn_egress6_degraded_nodes: "{{ (_eg.ipv6 | default({}, true)).degradedNodes | default([], true) }}"
        # the nodes that report an IPv6 egress (every one degraded = the IPv6 internet access is down)
        hn_egress6_nodes: "{{ (_eg.ipv6 | default({}, true)).nodes | default({}, true) | list }}"
        hn_egress_carried: >-
          {{ (_eg.networks | default([], true) | selectattr('network', 'equalto', fab_namespace ~ '/' ~ fab_name) | list
              + [{}]) | first }}

    # platform access (status.platformAccess, condition PlatformReachable): the prefixes of the clusters the
    # platform builds on the network enter the fabric's service routing domain; never fails the network
    - name: The network's platform access
      ansible.builtin.include_tasks: platform_access.yml

    # the root index (ledger kind egress) is held while the network has internet egress or accepted service prefixes:
    # both use the network's root VRF on the nodes
    - name: Hold an egress index
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-allocate
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: egress
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
      when: >-
        ((hn_egress_want4 | bool or (hn_egress_want6 | bool and hn_egress_offered6 | bool)) and hn_egress_offered | bool)
        or hn_service_hold | bool

    # off, and the fabric no longer carries the network (egress or service): the index goes back
    - name: Give the egress index back
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-release
          namespace: "{{ fabric_platform_namespace }}"
          fabric: "{{ hn_fabric_name }}"
          kind: egress
          owner: "HybridNetwork/{{ fab_namespace }}/{{ fab_name }}"
      when: >-
        not (((hn_egress_want4 | bool or (hn_egress_want6 | bool and hn_egress_offered6 | bool)) and hn_egress_offered | bool)
             or hn_service_hold | bool)
        and hn_egress_carried | length == 0
        and hn_service_carried | length == 0

    - name: Set the egress state
      ansible.builtin.include_tasks: egress_status.yml

    # the fabric adds or removes the network's egress (either family) and wakes it again when it did; with the IPv6
    # egress realized, the fabric announces exactly the placements' IPv6 subnets upstream, so a placement that came or
    # went since the fabric's last run wakes it too (its /64 has no return path from the internet until then). Like the
    # fabric's announced set, only subnets from the network's space count: a provider-assigned subnet is never
    # announced (its internet path is the provider's), so counting it would wake the fabric on every run
    - name: Wake the fabric
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: HybridFabric, namespace: "{{ fabric_platform_namespace }}", name: "{{ hn_fabric_name }}"}]
        _placed6: >-
          {%- set out = [] -%}
          {%- for p in _hn_placements.resources | default([]) -%}
            {%- if p.spec.network == fab_name and p.metadata.deletionTimestamp is not defined -%}
              {%- for sn in (p.status | default({}, true)).subnets | default([], true) -%}
                {%- if sn.family | default(0) | int == 6 and sn.prefix | default('') | length > 0
                      and sn.source | default('Network', true) != 'Provider' -%}
                  {%- set _ = out.append(sn.prefix) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | unique | sort }}
        _announced6: "{{ hn_egress_carried.prefixes6 | default([], true) | unique | sort }}"
      when: >-
        (hn_egress.families | default([]) | selectattr('state', 'in', ['pending', 'removing']) | list | length > 0)
        or (hn_access_result.wakeFabric | default(false) | bool)
        or ((hn_egress_carried.ipv6 | default(false) | bool) and (_placed6 != _announced6))

    - name: Report the network ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        fab_message: >-
          {{ hn_space | map(attribute='prefix') | join(', ') }} on HybridFabric {{ hn_fabric_name }}, MTU {{ hn_status.mtu }};
          {{ hn_status.placementsReady }}/{{ hn_status.placementCount }} placements ready{{ hn_egress_note }}
        fab_status: >-
          {{ hn_status | combine({'addressSpace': hn_space, 'ipv6': hn_ipv6_status,
                                  'realization': {'vpnTarget': hn_vpn_target | int,
                                                  'routeTarget': hn_fabric.spec.domainAsn ~ ':' ~ hn_vpn_target}})
             | combine({'egress': hn_egress if hn_egress | length > 0 else none, 'platformAccess': hn_access}) }}
        fab_conditions: "{{ [hn_access_condition] }}"

    # the placements on the fabric's path copy the network's IPv6 row into status.ipv6.internet when they run
    # (networkplacement_provision ipv6_status.yml); nothing else runs them while Ready, so when the row changed
    # (state, reason or message; the row came or went) the placements with a network-sourced IPv6 subnet are woken,
    # after the network's status is written so they read the new row
    - name: Wake the placements whose IPv6 internet row changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        _before6: >-
          {{ ((((fab_st | default({}, true)).egress | default({}, true)).families | default([], true)
              | selectattr('family', 'defined') | selectattr('family', 'equalto', 6) | list) + [{}]) | first }}
        _after6: >-
          {{ (((hn_egress | default({}, true)).families | default([], true)
              | selectattr('family', 'defined') | selectattr('family', 'equalto', 6) | list) + [{}]) | first }}
        nudge_crs: >-
          {%- set out = [] -%}
          {%- for p in _hn_placements.resources | default([]) -%}
            {%- set sn6 = (p.status | default({}, true)).subnets | default([], true) | selectattr('family', 'defined')
                          | selectattr('family', 'equalto', 6) | list -%}
            {%- if p.spec.network == fab_name and p.metadata.deletionTimestamp is not defined
                  and sn6 | length > 0 and (sn6 | first).source | default('Network', true) != 'Provider' -%}
              {%- set _ = out.append({'kind': 'NetworkPlacement', 'namespace': fab_namespace, 'name': p.metadata.name}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: >-
        [_before6.state | default(''), _before6.reason | default(''), _before6.message | default('')]
        != [_after6.state | default(''), _after6.reason | default(''), _after6.message | default('')]

  rescue:
    - name: Mark the HybridNetwork failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('HybridNetwork provision failed') }}
        # the placements' provider-assigned subnets, when the job got as far as listing them
        fab_status: "{{ hn_provider6_patch | default({}) }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridNetwork {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
