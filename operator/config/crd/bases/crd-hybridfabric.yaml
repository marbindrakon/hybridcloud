apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A fabric: the platform-owned network that connects tenant networks across sites,
            comparable to an AWS Cloud WAN core network. Every site keeps its own EVPN-VXLAN domain;
            a CloudGateway per site terminates it on the border gateway, and the border gateway
            carries each tenant network between the sites it is placed on, isolated from every other
            network. The fabric holds the site-visible numbering (VNI pools), the border gateway and
            its credentials; tenants reference it from their HybridNetworks. How the border gateway
            realizes this is the platform's choice.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required: [domainAsn, overlayMtu, vniPool, l2vniPool, borderGateway]
              x-kubernetes-validations:
                - rule: >-
                    self.vniPool.end < self.l2vniPool.start || self.l2vniPool.end < self.vniPool.start
                  message: vniPool and l2vniPool must not overlap
              properties:
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                  description: >-
                    BGP AS number of the fabric: the sites' EVPN sessions, the cloud gateways and the border
                    gateway all use it. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.domainAsn is immutable
                overlayMtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    Largest MTU a tenant network on this fabric can offer its workloads, and the default for new
                    networks. Every site underlay and the border gateway trunk must carry overlayMtu + 50 bytes
                    (VXLAN encapsulation).
                vniPool:
                  type: object
                  description: >-
                    VNIs for the IP-VRFs (layer 3 VNI) of network placements, one per placement. A VNI is only
                    meaningful inside its site's EVPN domain. A pool change that would drop allocated numbers is
                    refused.
                  required: [start, end]
                  x-kubernetes-validations:
                    - rule: self.start <= self.end
                      message: start must not exceed end
                  properties:
                    start:
                      description: First VNI of the pool (1 to 16777215).
                      type: integer
                      minimum: 1
                      maximum: 16777215
                    end:
                      description: Last VNI of the pool, not lower than start.
                      type: integer
                      minimum: 1
                      maximum: 16777215
                l2vniPool:
                  type: object
                  description: >-
                    VNIs for the MAC-VRFs (layer 2 VNI) of network placements that need one (OpenShift
                    Virtualization sites), one per placement.
                  required: [start, end]
                  x-kubernetes-validations:
                    - rule: self.start <= self.end
                      message: start must not exceed end
                  properties:
                    start:
                      description: First VNI of the pool (1 to 16777215).
                      type: integer
                      minimum: 1
                      maximum: 16777215
                    end:
                      description: Last VNI of the pool, not lower than start.
                      type: integer
                      minimum: 1
                      maximum: 16777215
                borderGateway:
                  type: object
                  description: >-
                    The border gateway: the nodes that run the platform's gateways. Each CloudGateway runs on every
                    node, and every node is a complete path between the sites, so the fabric keeps working while a
                    node is down.
                  required: [nodes, credentialsRef]
                  properties:
                    nodes:
                      description: The border gateway nodes, 1 to 8, by unique name.
                      type: array
                      minItems: 1
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, address]
                        properties:
                          name:
                            type: string
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            description: Node name, referenced by the CloudGateway site addresses.
                          address:
                            type: string
                            maxLength: 253
                            description: Management address or host name the platform reaches the node at (SSH).
                    credentialsRef:
                      type: object
                      description: >-
                        Vault KV path holding the credential the platform manages the nodes with (for host nodes:
                        key ssh_private_key).
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          description: Path of the secret in the platform's secret store.
                          type: string
                          minLength: 1
                          maxLength: 512
                bgp:
                  type: object
                  description: BGP settings for the sessions between the sites' VTEPs and their cloud gateways.
                  properties:
                    passwordRef:
                      type: object
                      description: >-
                        Vault KV path holding the TCP MD5 session password (key password). Without it the
                        sessions have no password. A CloudGateway can override it.
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          description: Path of the secret in the platform's secret store.
                          type: string
                          minLength: 1
                          maxLength: 512
                entityRefs:
                  type: array
                  description: Entities whose HybridNetworks may use this fabric. Empty means every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                ledger:
                  type: string
                  description: ConfigMap (same namespace) that records the fabric's allocations.
                allocated:
                  type: object
                  description: Allocated numbers per pool.
                  additionalProperties:
                    type: integer
                available:
                  type: object
                  description: Free numbers per pool.
                  additionalProperties:
                    type: integer
                reservedRanges:
                  description: >-
                    The address ranges tenants may not use on this fabric, with what the platform uses them for.
                    The tenants' profiles publish the same list.
                  type: array
                  maxItems: 512
                  x-kubernetes-list-type: atomic
                  items:
                    description: One range.
                    type: object
                    required:
                      - prefix
                      - purpose
                      - rule
                    properties:
                      prefix:
                        description: The address range (IPv4 or IPv6).
                        type: string
                        maxLength: 43
                      purpose:
                        description: What the platform uses the range for, in plain words.
                        type: string
                        maxLength: 256
                      rule:
                        description: >-
                          Refused (a network prefix, edge connection route or cluster network may not overlap it) or
                          SteppedAround (inside a network prefix, never allocated to a placement).
                        type: string
                        enum: [Refused, SteppedAround]
                      site:
                        description: The site the range applies to; absent when it applies everywhere.
                        type: string
                        maxLength: 63
                realization:
                  type: object
                  description: How the platform realized the fabric (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                nodes:
                  type: array
                  description: State per border gateway node.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ready:
                        type: boolean
                      message:
                        type: string
                      lastAppliedAt:
                        type: string
                        format: date-time
                    x-kubernetes-preserve-unknown-fields: true
                health:
                  type: object
                  description: >-
                    The latest periodic health check of the border gateway nodes as they serve this object. It reads
                    the nodes and changes nothing on them; what only a full run repairs is handed to one. The
                    condition NodesHealthy sums it up (Unknown while the object's site is paused, while the object is
                    not realized on the nodes yet or a change of it is in progress, or while the check is off) and
                    Degraded is True while a finding reduces service.
                  properties:
                    checkedAt:
                      type: string
                      format: date-time
                      description: When the nodes were last read.
                    lastRunAt:
                      type: string
                      format: date-time
                      description: >-
                        When the health check last ran for the fabric, whether or not it read the nodes (a check
                        leaves them alone while a change to them is in progress; skipped says so). HybridFabric only.
                    healthy:
                      type: boolean
                      description: >-
                        True when the last check found nothing at all on any node. A finding that waits for its
                        second sighting already makes it false, before it counts in the conditions; absent while the
                        object is not checked.
                    lastWakeAt:
                      type: string
                      format: date-time
                      description: When the check last asked for a full run to repair what it found.
                    skipped:
                      type: object
                      description: >-
                        Present while the nodes were left alone because a change to them was in progress or queued;
                        the findings are those of the last check that read them.
                      properties:
                        reason:
                          type: string
                          description: LeaseHeld (a change to the nodes was in progress) or JobInFlight (one is queued).
                        since:
                          type: string
                          format: date-time
                    nodes:
                      type: array
                      description: Per node, what the last check found.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          reachable:
                            type: boolean
                            description: The node answered the check.
                          bootedAt:
                            type: string
                            format: date-time
                            description: When the node last started.
                          reason:
                            type: string
                            description: The reason of the node's worst finding that counts; absent when none does.
                          message:
                            type: string
                            description: That finding's message.
                          findings:
                            type: array
                            description: What is wrong on the node, worst first; empty when healthy.
                            items:
                              type: object
                              properties:
                                check:
                                  type: string
                                  description: >-
                                    The area: Reachability, Start (the configuration's start at boot), Service,
                                    RoutingDaemon, Configuration (the node differs from its configuration),
                                    SiteSessions or ServiceSessions.
                                reason:
                                  type: string
                                  description: >-
                                    NodeUnreachable, ReadFailed (the node answered, its check did not complete),
                                    StartFailed, StartIncomplete, ServiceFailed, RoutingDaemonDown,
                                    RoutingDaemonRestarted, ConfigurationDrift, ConfigurationNotTaken (lines of the
                                    routing configuration the node does not take), SiteSessionsDown or
                                    ServiceSessionsDown (no session with the platform's router for clusters on
                                    networks).
                                message:
                                  type: string
                                since:
                                  type: string
                                  format: date-time
                                  description: The first check that found it, without a check in between that did not.
                                confirmed:
                                  type: boolean
                                  description: >-
                                    The finding counts in the conditions, events and wakes: a lasting state (a start
                                    that failed, a unit not started at boot) at once, a moment (a node not answering, a
                                    unit restarting, a daemon down) once a second check found it too.
                                checks:
                                  type: integer
                                  description: >-
                                    The number of consecutive checks that found it (see confirmed).
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending fabric waits for.
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                phase:
                  type: string
                  description: >-
                    State of the object, written by the platform: Waiting (for something else),
                    Creating, Updating, Ready, Degraded (usable, with reduced health), Paused (the
                    site is paused), Failed or Deleting.
                phaseSince:
                  type: string
                  description: >-
                    When the object entered the state in status.phase (RFC 3339). It changes only
                    when the state changes.
                summary:
                  type: string
                  description: >-
                    One line on what the platform is doing or waiting for, in plain words. Read it
                    together with status.phase.
                realized:
                  type: boolean
                  description: >-
                    True from the first time the platform finished realizing this object, until a
                    later run fails (then false). A run that waits for something else leaves it as
                    it was. Objects that depend on this one keep treating it as usable while it
                    re-runs or waits.
                lastHandledReconcileRequest:
                  type: string
                  description: >-
                    The Retry now request the platform last handled: the value of the
                    ansible.sdk.operatorframework.io/reconcileNow annotation at that time. A request
                    is open while the annotation differs from this value.
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ASN
          type: integer
          jsonPath: .spec.domainAsn
        - name: MTU
          type: integer
          jsonPath: .spec.overlayMtu
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
