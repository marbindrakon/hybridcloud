---
# Retry now: the annotation ansible.sdk.operatorframework.io/reconcileNow with any non-empty value is a
# request (writers use an RFC 3339 UTC timestamp, so repeated requests differ). A request is new while its
# value differs from status.lastHandledReconcileRequest; publish_operator_event records the value there
# after it published. The annotation is never cleared, except the legacy literal "true" (older dashboards,
# runbooks and docs): it is a new request every time it is written, and publish_operator_event removes it
# after publishing instead of recording it, so writing "true" again is a new request.
# Input: reconcile_request_cr (the role's CR, e.g. _hybridsovereign_redhat_hybridnetwork).
# Sets: reconcile_request (the annotation value, '' when absent), reconcile_request_legacy (the value is
# "true"), reconcile_now (a new request).
- name: Read the Retry-now request
  ansible.builtin.set_fact:
    reconcile_request: >-
      {{ ((reconcile_request_cr.metadata | default({}, true)).annotations | default({}, true))
         .get('ansible.sdk.operatorframework.io/reconcileNow', '') | default('', true) | string | trim }}
    _reconcile_request_handled: >-
      {{ (reconcile_request_cr.status | default({}, true)).lastHandledReconcileRequest | default('', true) | string | trim }}

# set_fact turns a stored "true" into a boolean (and "1" into a number), so the decision reads the
# annotation and the handled value from the CR again and compares them as strings.
- name: Decide whether the request is new
  ansible.builtin.set_fact:
    reconcile_request_legacy: >-
      {{ (((reconcile_request_cr.metadata | default({}, true)).annotations | default({}, true))
          .get('ansible.sdk.operatorframework.io/reconcileNow', '') | default('', true) | string | trim | lower) == 'true' }}
    reconcile_now: >-
      {%- set req = ((reconcile_request_cr.metadata | default({}, true)).annotations | default({}, true))
                    .get('ansible.sdk.operatorframework.io/reconcileNow', '') | default('', true) | string | trim -%}
      {%- set handled = (reconcile_request_cr.status | default({}, true)).lastHandledReconcileRequest
                        | default('', true) | string | trim -%}
      {{ (req | length > 0) and ((req | lower) == 'true' or req != handled) }}
