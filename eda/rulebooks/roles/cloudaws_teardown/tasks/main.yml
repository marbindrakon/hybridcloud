---
# shc (design/P8-PLAN.md §11): CloudAWS teardown. The operator holds the delete while NetworkPlacements use the
# environment. Removes the delegation from the tenant zone, then the environment's Route53 zone in the Entity's
# account (with its records). The account itself stays (it belongs to the Entity in this installation).
- block:
    - name: Read the CloudAWS
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: What the environment recorded
      ansible.builtin.set_fact:
        cad_dns: "{{ (fab_st.dns | default({}, true)) }}"
        cad_account: "{{ fab_st.awsAccountId | default('', true) }}"
        cad_region: "{{ fab_st.awsRegion | default('', true) }}"

    - name: Remove the delegation from the tenant zone
      when: (cad_dns.zone | default('')) | length > 0 and (cad_dns.dnsConfig | default('')) | length > 0
      block:
        - name: The platform's tenant DNS namespace
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_dns_config.yml"

        - name: Load the DNSConfig account
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
          vars:
            os_account_vault_path: "{{ dnscfg_secret }}"
            os_account_tag: "cloudaws-dns-{{ fab_name }}"
          when: dnscfg_found | default(false) | bool

        - name: Delete the delegation
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
          vars:
            os_helper: shc_dns.py
            os_call_no_log: false
            os_request:
              action: delete-delegation
              project_id: "{{ dnscfg_project_id }}"
              zone_id: "{{ dnscfg_zone_id }}"
              name: "{{ cad_dns.zone }}"
          when: dnscfg_found | default(false) | bool

    - name: Remove the environment's zone
      when: (cad_dns.zone | default('')) | length > 0 and cad_account | length > 0
      block:
        - name: The installation's AWS realization
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_realization.yml"

        - name: Delete the zone
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
          vars:
            aws_helper: shc_aws_tenant.py
            aws_config:
              account: "{{ cad_account }}"
              region: "{{ cad_region }}"
              memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
              entry: automation
            aws_args: [zone-down, --zone, "{{ cad_dns.zone }}"]

    # an account outside the Organization was added to the hub's transit gateway share by its first placement: take
    # it off again (a no-op for Organization accounts, which the share reaches through the OU)
    - name: Stop sharing the hub's transit gateway with the account
      when: cad_account | length > 0
      block:
        - name: The installation's AWS realization
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_realization.yml"

        - name: Remove the account from the share
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
          vars:
            aws_helper: shc_aws_tenant.py
            aws_config:
              account: "{{ cad_account }}"
              region: "{{ cad_region }}"
              memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
              entry: automation
              azs: []
              edge: >-
                {{ aws_real.edge | combine({'account': aws_real.hub.account, 'region': aws_real.hub.region,
                     'memberRole': aws_real.hub.memberRole | default('shc-automation'), 'entry': 'automation',
                     'site': 'share', 'asn': 0, 'shareName': ((aws_real.hub.tgw | default({})).share | default({})).name
                     | default(aws_real.edge.tgwName)}) }}
            aws_args: [share-down]

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudawss
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: deleted
          ready: false
          deletionComplete: true
          message: "Zone {{ cad_dns.zone | default('(none)') }} and its delegation removed"

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: CloudAWS, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}]

  rescue:
    - name: Mark the CloudAWS delete failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: TeardownFailed
        fab_message: "{{ ansible_failed_result.msg | default('CloudAWS teardown failed') }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudAWS {{ fab_name | default('unknown') }} teardown failed"
