---
# Obtain an OpenShift API bearer token by logging in through the cluster's OAuth server.
#   in:  ocp_api_host (https://api.<cluster>:6443), ocp_username, ocp_password
#   out: openshift_access_token
# shc: this file was referenced by resolve_{central,services}_cluster_connection.yml but never
# committed upstream (.gitignore's *token* pattern hid it). Uses the challenging client's implicit
# grant, as `oc login` does: the token is returned in the redirect's fragment.
- name: Discover the OAuth authorization endpoint
  ansible.builtin.uri:
    url: "{{ ocp_api_host }}/.well-known/oauth-authorization-server"
    method: GET
    validate_certs: false
    status_code: [200]
  register: _ocp_oauth_metadata

- name: Log in through OAuth (openshift-challenging-client)
  ansible.builtin.uri:
    url: "{{ _ocp_oauth_metadata.json.authorization_endpoint }}?response_type=token&client_id=openshift-challenging-client"
    method: GET
    url_username: "{{ ocp_username }}"
    url_password: "{{ ocp_password }}"
    force_basic_auth: true
    follow_redirects: none
    headers:
      X-CSRF-Token: "1"
    validate_certs: false
    status_code: [302]
  register: _ocp_oauth_login
  retries: 3
  delay: 5
  until: _ocp_oauth_login.status | default(0) == 302
  no_log: true

- name: Extract the access token from the redirect
  ansible.builtin.set_fact:
    openshift_access_token: "{{ _ocp_oauth_login.location | regex_search('access_token=([^&]+)', '\\1') | first }}"
  no_log: true
