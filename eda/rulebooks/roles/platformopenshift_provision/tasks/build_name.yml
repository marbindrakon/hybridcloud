---
# The build name of a cluster (DESIGN cnet §4.2, C-12): the cluster's identity on the hub (Helm release, namespace,
# ClusterDeployment, ManagedCluster, Vault cluster/<provider>/<build>/). A build name once recorded
# (status.buildName) stays the cluster's; otherwise <prefix>-<entity>-<name>-<digest> (files/po_preflight.py
# build-name: the digest of the exact pair keeps two tenants' or two clusters' names apart, the readable part is cut
# to fit). Inputs: bn_entity, bn_name, optional bn_prefix (shc-oso), bn_max (53), bn_recorded (status.buildName).
# Sets bn_build_name and bn_derived (the derived name, also when a recorded one wins). Included from this role and
# from platformopenshift_teardown.
- name: Require the tenant of the cluster
  ansible.builtin.assert:
    that: bn_entity | default('', true) | length > 0
    fail_msg: >-
      PlatformOpenshift {{ bn_name }}: its namespace has no label hybridsovereign.redhat/entity, so the cluster has
      no build name.
  when: bn_recorded | default('', true) | length == 0

- name: Derive the build name
  ansible.builtin.include_tasks: "{{ role_path }}/../platformopenshift_provision/tasks/po_call.yml"
  vars:
    po_request:
      action: build-name
      prefix: "{{ bn_prefix | default('shc-oso', true) }}"
      max: "{{ bn_max | default(53, true) | int }}"
      entity: "{{ bn_entity }}"
      name: "{{ bn_name }}"
  when: bn_entity | default('', true) | length > 0

- name: Keep the build name
  ansible.builtin.set_fact:
    bn_derived: "{{ po_result.buildName if bn_entity | default('', true) | length > 0 else '' }}"
    bn_build_name: >-
      {{ bn_recorded | default('', true) or (po_result.buildName if bn_entity | default('', true) | length > 0 else '') }}
