# The IPv6 translation probe's objects, in a tenant of the tester's own (here entity-example-platform): an IPv6-only
# network with IPv6 from the platform and internet access, an OpenShift Virtualization environment and an OpenStack
# environment, and one placement of the network per OpenShift Virtualization or OpenStack site to test (a site that
# offers IPv6-only placements with translation: capabilities ipv6Only and ipv6Translation). Then one probe per
# placement (vm-cloudvirt.yaml, server-cloudoso.md). Site names (site-vm, site-osp) are placeholders.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: ipv6-probe
  namespace: entity-example-platform
spec:
  description: IPv6 translation probe (IPv6-only, IPv6 from the platform, internet access).
  platformPrefixes:
    - family: 6
  egress:
    internet: true
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: probe-vms
  namespace: entity-example-platform
spec:
  cloudRef:
    name: site-vm
  description: The IPv6 translation probe on an OpenShift Virtualization site.
  namespaces:
    - name: probes
      network: ipv6-probe
  quota:
    cpu: "2"
    memory: 4Gi
    storage: 20Gi
    virtualMachines: 2
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: ipv6-probe-vms
  namespace: entity-example-platform
spec:
  network: ipv6-probe
  backend:
    kind: CloudVirt
    name: probe-vms
  ipv6:
    prefixLength: 64
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudOSO
metadata:
  name: probe-osp
  namespace: entity-example-platform
spec:
  cloudRef:
    name: site-osp
  project: probe-osp
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: ipv6-probe-osp
  namespace: entity-example-platform
spec:
  network: ipv6-probe
  backend:
    kind: CloudOSO
    name: probe-osp
  ipv6:
    prefixLength: 64
