apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenancy-dashboard.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenancy-dashboard.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "tenancy-dashboard.name" . }}-proxy-tls
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: proxy
      protocol: TCP
      name: proxy
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tenancy-dashboard.selectorLabels" . | nindent 4 }}
