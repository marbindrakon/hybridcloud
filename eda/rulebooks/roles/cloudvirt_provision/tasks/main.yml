---
# shc (design/P7-PLAN.md P7.3.3, §12.3): CloudVirt provision. Resolves the site (type openshift, the Entity
# allowed, virtualization offered), checks the Rbac CRs it grants access to, maps its namespaces to site
# namespaces (<entity>-<cloudvirt>-<name>; none may clash with another environment's) and records per namespace
# whether its network is placed here; ends pending on the site or the Rbac CRs while those aren't there. Then
# (P7.3.7) realizes the namespaces on the site with the fabric credential: labels (a namespace with a network gets
# the primary-network label at creation; the network's placement selects it by label), a ResourceQuota from
# spec.quota, and removal of namespaces that left the spec once they hold no VMs. Tenant access to the namespaces
# (sign-in on the site, RoleBindings for the Rbac CRs) is not realized yet.
- block:
    - name: Read the CloudVirt
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: Start with nothing to wait for
      ansible.builtin.set_fact:
        cv_waiting: []
        cv_reason: WaitingForDependencies
        cv_site_name: "{{ fab_spec.cloudRef.name }}"

    - name: Resolve the site
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ cv_site_name }}"
        ci_ref_namespace: "{{ fabric_platform_namespace }}"
        ci_expected_type: openshift

    - name: Refuse a site of another type or one the Entity may not use
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ 'SiteTypeMismatch' if (ci_found and ci_type != 'openshift') else 'EntityNotAllowed' }}"
        fab_fail_msg: >-
          {{ ('CloudVirt ' ~ fab_name ~ ': CloudInfrastructure ' ~ cv_site_name ~ ' has type ' ~ ci_type ~ ', not openshift')
             if (ci_found and ci_type != 'openshift')
             else ('Entity ' ~ fab_entity ~ ' may not use CloudInfrastructure ' ~ cv_site_name ~ ' (spec.entityRefs)') }}
      when: >-
        ci_found and (ci_type != 'openshift'
        or ((ci_spec.entityRefs | default([]) | length > 0)
            and fab_entity not in (ci_spec.entityRefs | map(attribute='name') | list)))

    - name: Stop on a refused site
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_msg | default('', true) | length > 0

    - name: Wait for a missing or unusable site
      ansible.builtin.set_fact:
        cv_waiting: "{{ cv_waiting + [ci_error | trim] }}"
      when: ci_error | trim | length > 0

    - name: Wait for the site's virtualization capability
      ansible.builtin.set_fact:
        cv_waiting: "{{ cv_waiting + ['CloudInfrastructure ' ~ cv_site_name ~ ': virtualization capability'] }}"
        cv_reason: SiteNotVirtualizationCapable
      when:
        - ci_error | trim | length == 0
        - not (ci_capabilities.virtualization | default(false) | bool)

    - name: List the Entity's Rbac CRs
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Rbac
        namespace: "{{ fab_namespace }}"
      register: _cv_rbacs

    - name: Wait for the Rbac CRs the environment grants access to
      vars:
        _wanted: "{{ ((fab_spec.toolRbac | default({})).editRbac | default([])) + ((fab_spec.toolRbac | default({})).viewRbac | default([])) }}"
        _have: "{{ _cv_rbacs.resources | default([]) | map(attribute='metadata.name') | list }}"
      ansible.builtin.set_fact:
        cv_waiting: "{{ cv_waiting + (_wanted | unique | difference(_have) | map('regex_replace', '^(.*)$', 'Rbac \\1 (not found)') | list) }}"

    - name: Map the namespaces to site namespaces
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: cloudvirt-namespaces
          entity: "{{ fab_entity }}"
          cloudvirt: "{{ fab_name }}"
          namespaces: "{{ fab_spec.namespaces | default([{'name': 'vms'}], true) }}"

    - name: Set the namespace facts
      ansible.builtin.set_fact:
        cv_namespaces: "{{ fab_check_result.namespaces }}"
        cv_ns_errors: "{{ fab_check_result.errors }}"
        cv_selector: "{{ fab_check_result.selector }}"

    - name: List the Entity's other environments, networks and placements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item }}"
        namespace: "{{ fab_namespace }}"
      loop: [CloudVirt, HybridNetwork, NetworkPlacement]
      register: _cv_lists

    - name: Collect the site namespaces other environments use
      vars:
        _others: "{{ _cv_lists.results[0].resources | default([]) | rejectattr('metadata.name', 'equalto', fab_name) | list }}"
      ansible.builtin.set_fact:
        cv_taken: >-
          {%- set out = [] -%}
          {%- for o in _others -%}
            {%- for n in (o.status | default({}, true)).namespaces | default([], true) if n is mapping -%}
              {%- if n.namespace | default('') in (cv_namespaces | map(attribute='namespace') | list) -%}
                {%- set _ = out.append(n.namespace ~ ' (CloudVirt ' ~ o.metadata.name ~ ')') -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ cv_ns_errors + out }}

    - name: Refuse clashing namespaces
      ansible.builtin.set_fact:
        fab_fail_reason: NamespaceTaken
        fab_fail_msg: "CloudVirt {{ fab_name }}: site namespace already used: {{ cv_taken | join('; ') }}"
      when: cv_taken | length > 0

    - name: Stop on clashing namespaces
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: cv_taken | length > 0

    # a namespace with a network is usable once a NetworkPlacement puts that network on this environment
    - name: Set the namespace states
      vars:
        _nets: "{{ _cv_lists.results[1].resources | default([]) | map(attribute='metadata.name') | list }}"
        _placed: >-
          {{ _cv_lists.results[2].resources | default([]) | selectattr('spec.backend.kind', 'equalto', 'CloudVirt')
             | selectattr('spec.backend.name', 'equalto', fab_name) | list }}
      ansible.builtin.set_fact:
        cv_ns_status: >-
          {%- set out = [] -%}
          {%- for n in cv_namespaces -%}
            {%- set p = _placed | selectattr('spec.network', 'equalto', n.network) | list -%}
            {%- if not n.network -%}
              {%- set st = {'ready': true, 'message': "site's default network"} -%}
            {%- elif n.network not in _nets -%}
              {%- set st = {'ready': false, 'message': 'waiting for HybridNetwork ' ~ n.network ~ ' (not found)'} -%}
            {%- elif p | length == 0 -%}
              {%- set st = {'ready': false, 'message': 'waiting for a NetworkPlacement of ' ~ n.network ~ ' on this environment'} -%}
            {%- elif not ((p[0].status | default({}, true)).ready | default(false)) -%}
              {%- set st = {'ready': false, 'message': 'waiting for NetworkPlacement ' ~ p[0].metadata.name ~ ' ('
                            ~ ((p[0].status | default({}, true)).status | default('not provisioned', true)) ~ ')'} -%}
            {%- else -%}
              {%- set st = {'ready': true, 'message': 'network ' ~ n.network ~ ' via NetworkPlacement ' ~ p[0].metadata.name} -%}
            {%- endif -%}
            {%- set _ = out.append(n | combine(st)) -%}
          {%- endfor -%}
          {{ out }}

    - name: Set the environment status
      ansible.builtin.set_fact:
        cv_status: >-
          {{ {'entity': fab_entity,
              'site': {'name': cv_site_name,
                       'endpoint': ((ci_obj.status | default({}, true)).site | default({}, true)).endpoint | default('', true)},
              'storageClass': fab_spec.storageClass | default((ci_spec.openshift | default({})).storageClass | default(''), true),
              'namespaces': cv_ns_status} }}

    - name: Report what the environment waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: "{{ cv_reason }}"
        fab_message: "Waiting for {{ cv_waiting | join('; ') }}"
        fab_waiting_for: "{{ cv_waiting }}"
        fab_status: "{{ cv_status }}"
      when: cv_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: cv_waiting | length > 0

    - name: Realize the namespaces on the site
      block:
        - name: The site's fabric credential
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_kubeconfig.yml"
          vars:
            site_kc_tag: "cv-{{ fab_namespace }}-{{ fab_name }}"

        - name: Ensure the site namespaces
          kubernetes.core.k8s:
            kubeconfig: "{{ site_kubeconfig }}"
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ item.namespace }}"
                annotations:
                  openshift.io/display-name: "{{ fab_entity }} / {{ fab_name }} / {{ item.name }}"
                  openshift.io/description: >-
                    VM namespace {{ item.name }} of CloudVirt {{ fab_namespace }}/{{ fab_name }}{{ (', network '
                    ~ item.network) if item.network else '' }} (managed by the platform)
                # a namespace with a network takes it as its primary network: the label has to be there from the start
                labels: >-
                  {{ item.labels | combine({'k8s.ovn.org/primary-user-defined-network': ''} if item.network else {}) }}
          loop: "{{ cv_namespaces }}"
          loop_control:
            label: "{{ item.namespace }}"
          register: _cv_ns_apply

        - name: Set the namespaces' quota
          kubernetes.core.k8s:
            kubeconfig: "{{ site_kubeconfig }}"
            state: "{{ 'present' if _hard | length > 0 else 'absent' }}"
            definition:
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: cloudvirt-quota
                namespace: "{{ item.namespace }}"
                labels: "{{ item.labels }}"
              spec:
                hard: "{{ _hard }}"
          vars:
            _q: "{{ fab_spec.quota | default({}, true) }}"
            _hard: >-
              {{ ({'requests.cpu': _q.cpu | string} if _q.cpu is defined else {})
                 | combine({'requests.memory': _q.memory | string} if _q.memory is defined else {})
                 | combine({'requests.storage': _q.storage | string} if _q.storage is defined else {})
                 | combine({'count/virtualmachines.kubevirt.io': _q.virtualMachines | string} if _q.virtualMachines is defined else {}) }}
          loop: "{{ cv_namespaces }}"
          loop_control:
            label: "{{ item.namespace }}"
          register: _cv_quota

        # namespaces of this environment that left spec.namespaces: removed once they hold no VMs
        - name: List the environment's site namespaces
          kubernetes.core.k8s_info:
            kubeconfig: "{{ site_kubeconfig }}"
            api_version: v1
            kind: Namespace
            label_selectors: "{{ cv_selector | dict2items | map(attribute='key') | zip(cv_selector.values()) | map('join', '=') | list }}"
          register: _cv_site_ns

        - name: Find the namespaces to remove
          ansible.builtin.set_fact:
            cv_stale: >-
              {{ _cv_site_ns.resources | default([]) | map(attribute='metadata.name')
                 | difference(cv_namespaces | map(attribute='namespace')) | list }}

        - name: Count the VMs in the namespaces to remove
          kubernetes.core.k8s_info:
            kubeconfig: "{{ site_kubeconfig }}"
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            namespace: "{{ item }}"
          loop: "{{ cv_stale }}"
          register: _cv_stale_vms

        - name: Remove the namespaces without VMs
          kubernetes.core.k8s:
            kubeconfig: "{{ site_kubeconfig }}"
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ item.item }}"
          loop: "{{ _cv_stale_vms.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.resources | default([]) | length == 0

        - name: Keep the removed namespaces that still hold VMs
          ansible.builtin.set_fact:
            cv_kept: >-
              {{ _cv_stale_vms.results | default([]) | rejectattr('resources', 'equalto', []) | map(attribute='item') | list }}
      always:
        - name: Remove the site kubeconfig
          ansible.builtin.file:
            path: "{{ site_kubeconfig | default('/tmp/eda-cv-' ~ fab_namespace ~ '-' ~ fab_name ~ '-kubeconfig') }}"
            state: absent

    - name: Report the environment ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        fab_message: >-
          {{ cv_namespaces | length }} namespace(s) on {{ cv_site_name }}
          ({{ cv_ns_status | selectattr('ready') | list | length }} with their network){{ '; removed from spec but still
          holding VMs: ' ~ cv_kept | join(', ') if cv_kept | length > 0 else '' }}{{ '; ' ~ cv_stale | difference(cv_kept)
          | length ~ ' removed' if cv_stale | difference(cv_kept) | length > 0 else '' }}
        fab_status: >-
          {{ cv_status | combine({'realization': {'siteNamespacesKept': cv_kept}} if cv_kept | length > 0 else {}) }}

  rescue:
    - name: Mark the CloudVirt failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('CloudVirt provision failed') }}
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudVirt {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
