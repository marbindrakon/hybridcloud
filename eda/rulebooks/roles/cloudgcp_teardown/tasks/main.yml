---
# shc (design/P11-GCP-PLAN.md §3.5): CloudGCP teardown. The operator holds the delete while NetworkPlacements use
# the environment. Removes the delegation from the tenant zone, then the environment's Cloud DNS zone in the
# Entity's project (with its records). The project itself stays (it belongs to the Entity or to RHDP).
- block:
    # nothing on a site (refused at validation): delete without site cleanup
    - name: Skip the site cleanup when nothing was realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/teardown_unrealized.yml"

    - name: Read the CloudGCP
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: What the environment recorded
      ansible.builtin.set_fact:
        cad_dns: "{{ (fab_st.dns | default({}, true)) }}"
        cad_account: "{{ fab_st.project | default('', true) }}"
        cad_region: "{{ fab_st.region | default('', true) }}"

    - name: Remove the delegation from the tenant zone
      when: (cad_dns.zone | default('')) | length > 0 and (cad_dns.dnsConfig | default('')) | length > 0
      block:
        - name: The platform's tenant DNS namespace
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_dns_config.yml"

        - name: Load the DNSConfig account
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
          vars:
            os_account_vault_path: "{{ dnscfg_secret }}"
            os_account_tag: "cloudgcp-dns-{{ fab_name }}"
          when: dnscfg_found | default(false) | bool

        - name: Delete the delegation
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
          vars:
            os_helper: shc_dns.py
            os_call_no_log: false
            os_request:
              action: delete-delegation
              project_id: "{{ dnscfg_project_id }}"
              zone_id: "{{ dnscfg_zone_id }}"
              name: "{{ cad_dns.zone }}"
              # only the NS recordset the provision wrote (its description is the mark); another one is kept
              description: "Delegation of CloudGCP {{ fab_namespace }}/{{ fab_name }} (Cloud DNS, project {{ cad_account }})"
          when: dnscfg_found | default(false) | bool

        - name: What happened to the delegation
          ansible.builtin.set_fact:
            cad_deleg: "{{ os_result }}"
          when: dnscfg_found | default(false) | bool

    - name: Remove the environment's zone
      when: (cad_dns.zone | default('')) | length > 0 and cad_account | length > 0
      block:
        - name: The installation's GCP realization
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_realization.yml"

        - name: Delete the zone
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
          vars:
            gcp_helper: shc_gcp_tenant.py
            # only the zone the environment recorded, whatever its labels say (labels in the tenant's project are
            # written for people); without a recorded zone nothing is deleted
            gcp_config: {project: "{{ cad_account }}", region: "{{ cad_region }}", labels: {shc-entity: "{{ fab_entity }}"}}
            gcp_args: >-
              {{ ['zone-down', '--zone', cad_dns.zone]
                 + (['--zone-name', cad_dns.zoneId] if cad_dns.zoneId | default('', true) | length > 0 else []) }}

        - name: What happened to the zone
          ansible.builtin.set_fact:
            cad_zone: "{{ gcp_result.result | default({}, true) }}"

    # what was deleted and what was left (never "removed" for a zone or a delegation that was kept or not found)
    - name: What the teardown deleted and left
      vars:
        _zone: "{{ cad_dns.zone | default('', true) }}"
        _z: "{{ cad_zone | default({}, true) }}"
        _d: "{{ cad_deleg | default({}, true) }}"
      ansible.builtin.set_fact:
        cad_done: >-
          {%- if _zone | length == 0 -%}
          No DNS zone was recorded for the environment, so none was deleted
          {%- else -%}
          {%- if _z.deleted | default(false) | bool -%}
          Zone {{ _zone }} deleted
          {%- elif _z.note | default('', true) | length > 0 -%}
          Zone {{ _zone }} was not deleted: the environment recorded no zone id, so nothing was deleted in the project
          {%- elif _z | length > 0 -%}
          Zone {{ _zone }} was already gone
          {%- else -%}
          Zone {{ _zone }} was not deleted: the environment recorded no project
          {%- endif -%}
          {%- if _d | length > 0 and _d.deleted | default(false) | bool -%}
          ; its delegation in the tenant zone deleted
          {%- elif _d.kept | default('', true) | length > 0 -%}
          ; its delegation in the tenant zone was kept ({{ _d.kept }})
          {%- elif _d | length > 0 -%}
          ; no delegation of it was found in the tenant zone
          {%- elif cad_dns.dnsConfig | default('', true) | length > 0 -%}
          ; its delegation in the tenant zone was not deleted: the platform's tenant DNS configuration was not found
          {%- else -%}
          ; no delegation in a tenant zone was recorded
          {%- endif -%}
          {%- endif -%}

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgcps
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        # the final write of every teardown: a successful write (status ready) on a deleting object is
        # Ready=False/Deleted and ends an earlier Stalled=TeardownFailed (status library)
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          message: "{{ cad_done }}"

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: CloudGCP, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}]

  rescue:
    - name: Mark the CloudGCP delete failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: TeardownFailed
        fab_message: "{{ ansible_failed_result.msg | default('CloudGCP teardown failed') }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudGCP {{ fab_name | default('unknown') }} teardown failed"
