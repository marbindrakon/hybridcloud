---
# Services AAP admin credentials from central Vault (KV `aap-admin`: username/password/token, seeded
# from the services AAP by `bootstrap.sh seed-services`). Upstream included this file but never
# committed it (.gitignore `*credentials*`). Sets aap_admin_user / aap_admin_password and the
# aap_username / aap_password names the AAP plugin roles use. Requires VAULT_TOKEN on the job
# (sovereign-vault-admin-credential).
- name: Read {{ aap_vault_path | default('aap-admin') }} from Vault
  ansible.builtin.include_tasks: vault_kv_read.yml
  vars:
    vault_kv_path: "{{ aap_vault_path | default('aap-admin') }}"

- name: Set AAP admin facts
  ansible.builtin.set_fact:
    aap_admin_user: "{{ vault_kv_data.username }}"
    aap_admin_password: "{{ vault_kv_data.password }}"
    aap_username: "{{ vault_kv_data.username }}"
    aap_password: "{{ vault_kv_data.password }}"
  no_log: true

- name: Assert AAP admin credentials present
  ansible.builtin.assert:
    that:
      - aap_admin_user | default('') | length > 0
      - aap_admin_password | default('') | length > 0
    fail_msg: "Vault {{ aap_vault_path | default('aap-admin') }} has no username/password"
