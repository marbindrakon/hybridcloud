apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantprofiles.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "skip"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: TenantProfile
    listKind: TenantProfileList
    plural: tenantprofiles
    singular: tenantprofile
    shortNames:
      - tprofile
    categories:
      - shc
      - shc-tenant
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A tenant profile: the read-only summary of a tenant for the tenant's own users, with its
            display name, the contacts its users ask about access, and the sites its environments may
            use. The platform writes it; one object named shc exists in each tenant namespace and goes
            away with it.
          type: object
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'shc'"
              message: The tenant profile is named shc.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: No fields; the profile is written by the platform.
              type: object
              maxProperties: 0
            status:
              description: The tenant as its users see it. Written by the platform; do not edit.
              type: object
              properties:
                displayName:
                  description: Human-readable name of the tenant.
                  type: string
                  maxLength: 64
                contacts:
                  description: Who the tenant's users contact about access and the tenant.
                  type: array
                  maxItems: 10
                  x-kubernetes-list-type: atomic
                  items:
                    description: One contact.
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: Name of the person or team.
                        type: string
                        maxLength: 128
                      email:
                        description: E-mail address.
                        type: string
                        maxLength: 254
                      url:
                        description: Web page or ticket queue (https).
                        type: string
                        maxLength: 512
                        pattern: "^https://"
                sites:
                  description: >-
                    The sites this tenant's environments may use. An environment names one in
                    spec.cloudRef.name.
                  type: array
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    description: One site.
                    type: object
                    required:
                      - name
                      - type
                      - state
                    properties:
                      name:
                        description: Name of the site, the value of an environment's spec.cloudRef.name.
                        type: string
                        maxLength: 63
                      displayName:
                        description: Human-readable name of the site.
                        type: string
                        maxLength: 128
                      type:
                        description: >-
                          What the site is: openstack (OpenStack environments), openshift (VM
                          environments on OpenShift Virtualization), aws, gcp or external.
                        type: string
                        enum: [openstack, openshift, aws, gcp, external]
                      location:
                        description: Where the site is, in words; omitted when the platform has not set it.
                        type: string
                        maxLength: 128
                      region:
                        description: Cloud region of an aws or gcp site.
                        type: string
                        maxLength: 64
                      billable:
                        description: True when using the site is charged to the tenant (aws and gcp sites).
                        type: boolean
                      state:
                        description: Available when environments can be created on the site now, else Unavailable.
                        type: string
                        enum: [Available, Unavailable]
                      capabilities:
                        description: >-
                          What the site offers: Virtualization (VM environments), HybridNetworking
                          (networks that span sites), DNS (names for environments), IPv6 (placements can have an
                          IPv6 subnet), IPv6Only (placements without IPv4), IPv6NetworkSource (IPv6 subnets from the
                          network's address space), IPv6ProviderSource (IPv6 subnets from the cloud provider),
                          IPv6Translation (placements without IPv4 reach IPv4-only destinations by translation).
                        type: array
                        maxItems: 16
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          enum: [Virtualization, HybridNetworking, DNS, IPv6, IPv6Only, IPv6NetworkSource,
                                 IPv6ProviderSource, IPv6Translation]
                      storageClasses:
                        description: >-
                          Storage classes (OpenShift) or volume types (OpenStack) an environment on the
                          site can use.
                        type: array
                        maxItems: 64
                        x-kubernetes-list-type: atomic
                        items:
                          description: One storage class or volume type.
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              description: Name of the storage class or volume type.
                              type: string
                              maxLength: 253
                            default:
                              description: True for the site's default.
                              type: boolean
                observedEntityGeneration:
                  description: The metadata.generation of the tenant that this profile describes.
                  type: integer
                  format: int64
                lastUpdatedTime:
                  description: When the platform last wrote this profile (RFC 3339).
                  type: string
                  format: date-time
                conditions:
                  description: >-
                    Standard conditions about the tenant's delivery, for example whether the platform
                    automation for the tenant is available.
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    description: One condition.
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        description: Condition type, for example ControllerAvailable.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this tenant, in plain words.
                        type: string
                      observedGeneration:
                        description: The metadata.generation the condition describes.
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Display name
          type: string
          jsonPath: .status.displayName
        - name: Updated
          type: date
          jsonPath: .status.lastUpdatedTime
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="ControllerAvailable")].reason
        - name: Delivery
          type: string
          priority: 1
          jsonPath: .status.conditions[?(@.type=="DeliveryStalled")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
