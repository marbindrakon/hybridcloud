---
# shc (design/P7-PLAN.md P7.1): the CloudOSO's site. spec.cloudRef, else the installation default
# (cloudoso_defaults.cloudRef), names a CloudInfrastructure of type openstack; it supplies the account
# (credentialsRef: the site's cloud admin) and every site setting. The tenant's own site-level spec fields
# are ignored then: a tenant must not choose the Vault account or the Keystone domain its project is made
# with. Without any cloudRef the legacy fields (spec over cloudoso_defaults) apply unchanged.
#
# Expects oso_spec, entity_name, cloudoso_cr_name, services_api_host/token.
# Sets oso_cloudinfra_name ('' = legacy), oso_settings {vaultPath, projectDomain, externalNetwork,
# baseDomain, regionName, dnsProvider (designate|route53|none legacy; zone = an environment zone),
# designateZoneId, designateProjectId, route53VaultPath}, oso_settings_note, oso_env_dns (zone only).
- name: Pick the site
  vars:
    _default: "{{ cloudoso_defaults.cloudRef | default('', true) }}"
  ansible.builtin.set_fact:
    oso_cloudinfra_name: >-
      {{ (oso_spec.cloudRef | default({}, true)).name | default('', true)
         or (_default.name | default('') if _default is mapping else _default) }}
    oso_settings_note: ""

# (No block with `when` around an include_tasks: in AAP that skipped every following task.)
- name: Read the CloudInfrastructure
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
  vars:
    ci_ref_name: "{{ oso_cloudinfra_name }}"
    ci_expected_type: openstack
  when: oso_cloudinfra_name | length > 0

- name: Require a usable openstack site
  ansible.builtin.assert:
    that: ci_error | length == 0
    fail_msg: "CloudOSO {{ cloudoso_cr_name }}: {{ ci_error }}"
  when: oso_cloudinfra_name | length > 0

# one rule for every environment: spec.entityRefs of the site and Entity spec.allowedSites (fails closed)
- name: Check that the tenant may use the site
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/tenant_site_allowed.yml"
  vars:
    tsa_entity: "{{ entity_name }}"
    tsa_site: "{{ oso_cloudinfra_name }}"
    tsa_site_spec: "{{ ci_spec }}"
  when: oso_cloudinfra_name | length > 0

- name: Record the refusal reason
  ansible.builtin.set_fact:
    cloudoso_failure_reason: "{{ tsa_reason }}"
  when:
    - oso_cloudinfra_name | length > 0
    - not (tsa_allowed | bool)

- name: Require the tenant to be allowed on the site
  ansible.builtin.assert:
    that: tsa_allowed | bool
    fail_msg: "{{ tsa_message }}"
  when: oso_cloudinfra_name | length > 0

- name: Take the account and settings from the site
  when: oso_cloudinfra_name | length > 0
  vars:
    _os: "{{ ci_spec.openstack | default({}) }}"
    _ignored: >-
      {{ ['vaultPath', 'projectDomain', 'externalNetwork', 'baseDomain', 'regionName', 'dnsProvider',
          'designateZoneId', 'designateProjectId', 'route53VaultPath']
         | select('in', oso_spec | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list) | list }}
  ansible.builtin.set_fact:
    oso_settings:
      vaultPath: "{{ (ci_spec.credentialsRef | default({})).vaultPath | default('') }}"
      projectDomain: "{{ _os.projectDomain | default('') }}"
      externalNetwork: "{{ _os.externalNetwork | default('') }}"
      regionName: "{{ _os.region | default('') }}"
      # tenant DNS (design/TENANT-DNS.md): set below from the site's dns.mode and the DNSConfig
      baseDomain: ""
      dnsProvider: none
      designateZoneId: ""
      designateProjectId: ""
      route53VaultPath: ""
    oso_settings_note: >-
      {{ ('Site settings from CloudInfrastructure ' ~ oso_cloudinfra_name ~ '; ignored spec.' ~ (_ignored | join(', spec.')) ~ '.')
         if _ignored | length > 0 else '' }}

# Tenant DNS (design/TENANT-DNS.md D1): on a site with dns.mode native the environment gets its own zone
# <cloudoso>.<entity>.<tenant domain> in the site's Designate, owned by the site's DNS project and shared with
# the CloudOSO's project. platform mode (no OpenStack tenant zones yet) leaves the environment without DNS.
- name: Read the platform's DNSConfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_dns_config.yml"
  when:
    - oso_cloudinfra_name | length > 0
    - ((ci_spec.dns | default({}, true)).mode | default('platform', true)) == 'native'

- name: Require tenant DNS for a site with native DNS
  ansible.builtin.assert:
    that:
      - dnscfg_usable | bool
      - (((ci_obj.status | default({})).site | default({})).dns | default({})).projectId | default('') | length > 0
    fail_msg: >-
      CloudOSO {{ cloudoso_cr_name }}: site {{ oso_cloudinfra_name }} has dns.mode native, but
      {{ 'no DNSConfig is usable' if not (dnscfg_usable | bool) else 'the site has no DNS project yet (probe it again)' }}.
  when:
    - oso_cloudinfra_name | length > 0
    - ((ci_spec.dns | default({}, true)).mode | default('platform', true)) == 'native'

- name: Use an environment zone
  ansible.builtin.set_fact:
    oso_settings: "{{ oso_settings | combine({'dnsProvider': 'zone', 'baseDomain': dnscfg_domain}) }}"
    oso_env_dns:
      ownerProjectId: "{{ ci_obj.status.site.dns.projectId }}"
      zoneAttributes: "{{ (ci_spec.dns | default({}, true)).zoneAttributes | default({}) }}"
      siteNameservers: "{{ ci_obj.status.site.dns.nameservers | default([]) }}"
      globalNameservers: "{{ dnscfg_nameservers }}"
      dnsConfig: "{{ dnscfg_name }}"
      dnsConfigSecret: "{{ dnscfg_secret }}"
      globalProjectId: "{{ dnscfg_project_id }}"
      globalZoneId: "{{ dnscfg_zone_id }}"
  when:
    - oso_cloudinfra_name | length > 0
    - ((ci_spec.dns | default({}, true)).mode | default('platform', true)) == 'native'

# A legacy spec may name only the accounts the platform lists (cloudoso_allowed_vault_paths, role defaults): the
# job reads them with the platform's Vault token.
- name: Legacy settings (no cloudRef in effect)
  when: oso_cloudinfra_name | length == 0
  vars:
    _spec_account: "{{ oso_spec.vaultPath | default('', true) }}"
    _spec_route53: "{{ oso_spec.route53VaultPath | default('', true) }}"
    _ignored: >-
      {{ ([] if _spec_account in ([''] + cloudoso_allowed_vault_paths) else ['vaultPath'])
         + ([] if _spec_route53 in ([''] + cloudoso_allowed_vault_paths) else ['route53VaultPath']) }}
  ansible.builtin.set_fact:
    oso_settings_note: >-
      {{ ('Ignored spec.' ~ (_ignored | join(', spec.')) ~ ' (chosen by the platform).') if _ignored | length > 0 else '' }}
    oso_settings:
      vaultPath: >-
        {{ _spec_account if (_spec_account | length > 0 and 'vaultPath' not in _ignored)
           else (cloudoso_defaults.vaultPath | default('')) }}
      projectDomain: "{{ oso_spec.projectDomain | default(cloudoso_defaults.projectDomain | default(''), true) }}"
      externalNetwork: "{{ oso_spec.externalNetwork | default(cloudoso_defaults.externalNetwork | default(''), true) }}"
      baseDomain: "{{ oso_spec.baseDomain | default(cloudoso_defaults.baseDomain | default(''), true) }}"
      regionName: "{{ oso_spec.regionName | default(cloudoso_defaults.regionName | default(''), true) }}"
      dnsProvider: >-
        {{ oso_spec.dnsProvider | default(cloudoso_defaults.dnsProvider | default(''), true)
           | default('designate' if (oso_spec.designateZoneId | default(cloudoso_defaults.designateZoneId | default(''), true)) else 'route53', true) }}
      designateZoneId: "{{ oso_spec.designateZoneId | default(cloudoso_defaults.designateZoneId | default(''), true) }}"
      designateProjectId: "{{ oso_spec.designateProjectId | default(cloudoso_defaults.designateProjectId | default(''), true) }}"
      route53VaultPath: >-
        {{ _spec_route53 if (_spec_route53 | length > 0 and 'route53VaultPath' not in _ignored)
           else (cloudoso_defaults.route53VaultPath | default('')) }}
