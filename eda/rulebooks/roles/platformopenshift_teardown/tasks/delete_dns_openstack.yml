---
# shc (§11.6 phase C): delete the Designate records the provision recorded (status.dns), with the
# account and zone project it recorded. Route53 OpenStack environments go through delete_dns_aws.yml.
- name: Load the OpenStack account
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
  vars:
    os_account_vault_path: "{{ po_dns.accountVaultPath }}"
    os_account_tag: "po-teardown-{{ platformopenshift_cr_name }}"

- name: Delete the recorded Designate records
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
  vars:
    os_call_no_log: false
    os_request:
      action: dns-delete
      dns_zone_id: "{{ item.0 }}"
      dns_project_id: "{{ po_dns.projectId }}"
      records: "{{ item.1 }}"
  loop: "{{ po_dns.records | groupby('zoneId') }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 | map(attribute='name') | join(', ') }}"
