---
# Services Quay admin credentials from central Vault: KV `quay_vault_path` (default
# quay-services-admin: username/password/token/url, written by the quay-config job). Upstream
# included this file but never committed it (.gitignore `*credentials*`); its lab read a hand-seeded
# `quay-admin`. Sets quay_url (unless QUAY_URL is set) and quay_api_token, verified against
# GET /api/v1/user/.
- name: Read {{ quay_vault_path | default('quay-services-admin') }} from Vault
  ansible.builtin.include_tasks: vault_kv_read.yml
  vars:
    vault_kv_path: "{{ quay_vault_path | default('quay-services-admin') }}"

- name: Set Quay admin facts
  ansible.builtin.set_fact:
    quay_admin_user: "{{ vault_kv_data.username | default('') }}"
    quay_admin_url: "{{ vault_kv_data.url | default('') }}"
    quay_url: "{{ (quay_url | default('', true)) or (vault_kv_data.url | default('')) }}"
    # trimmed: a stray newline in the stored token ends up in the Authorization header, and the
    # role's failure message (CR status) then quotes the header, token included
    quay_api_token: "{{ vault_kv_data.token | default('') | trim }}"
  no_log: true

- name: Verify the Quay API token
  ansible.builtin.uri:
    url: "{{ quay_url | regex_replace('/$', '') }}/api/v1/user/"
    method: GET
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
    validate_certs: true
    status_code: [200]
  register: _quay_user_probe
  retries: 5
  delay: 10
  until: (_quay_user_probe.status | default(0) | int) == 200
  no_log: true
