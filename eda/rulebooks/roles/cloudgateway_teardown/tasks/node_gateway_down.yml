---
# shc (design/P7-PLAN.md P7.3.5): remove a gateway instance from one node (delegated, become). The gateway's
# delete waited for its placements; VRFs of placements deleted together with the gateway (which didn't wait for a
# release) go with the instance. Runs under the fabric's lease fabric-config-<fabric>, renewed here before the node
# (realization nodes.configLease, with its own timeout: the node loop's step limit never stops it); a renewal
# that finds the lease lost fails the job before the node.
- name: "{{ bgw_node.name }}: renew the border gateway configuration lease"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
  vars:
    fab_ledger: {action: lease-renew, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cgt_holder }}",
                 step: "removing the gateway instance from {{ bgw_node.name }}"}
  timeout: 0

- name: "{{ bgw_node.name }}: stop the gateway instance and keep it off at boot"
  ansible.builtin.systemd:
    name: "shc-gw@{{ fab_name }}.service"
    state: stopped
    enabled: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

# the instance's SRv6 core guard timer (installed only on the SRv6 core: nothing to do without the unit template)
- name: "{{ bgw_node.name }}: stop the instance's SRv6 core guard"
  ansible.builtin.shell: |
    [ -e /etc/systemd/system/shc-core-guard@.timer ] || exit 0
    u=shc-core-guard@gw-{{ fab_name }}.timer
    if systemctl -q is-enabled "$u" 2>/dev/null || systemctl -q is-active "$u" 2>/dev/null; then
      systemctl disable --now "$u" && echo stopped
    fi
  register: _cgt_guard
  changed_when: "'stopped' in _cgt_guard.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: is the instance installed"
  ansible.builtin.stat:
    path: "/etc/shc-fabric/gw-{{ fab_name }}.json"
  register: _cgt_conf
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: remove the namespace and the core leg"
  ansible.builtin.command: "/usr/local/sbin/shc-fabric-apply gw-{{ fab_name }} down"
  register: _cgt_down
  changed_when: "'changed=yes' in _cgt_down.stdout"
  when: _cgt_conf.stat.exists
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: remove the instance's configuration"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: ["/etc/frr/gw-{{ fab_name }}", "/etc/shc-fabric/gw-{{ fab_name }}.json", "/etc/shc-fabric/gw-{{ fab_name }}.wgkey",
         "/etc/shc-fabric/gw-{{ fab_name }}.frr-loaded", "/var/run/frr/gw-{{ fab_name }}"]
  delegate_to: "{{ bgw_node.name }}"
