---
controller_inventories:
  - name: sovereign-localhost
    organization: sovereign
    # shc (LAB-PLAN §11.3): environment endpoints for the EDA job roles, from the config-as-code job env
    variables:
      aap_ui_url: "{{ lookup('env', 'AAP_GATEWAY_URL') }}"
      eda_log_s3_endpoint: "{{ lookup('env', 'EDA_LOG_S3_ENDPOINT') }}"
      # shc (§11.6 phase C): installation defaults for CloudOSO / PlatformOpenshift (JSON objects)
      cloudoso_defaults: "{{ lookup('env', 'CLOUDOSO_DEFAULTS') | default('{}', true) | from_json }}"
      platformopenshift_defaults: "{{ lookup('env', 'PLATFORMOPENSHIFT_DEFAULTS') | default('{}', true) | from_json }}"
      # shc (design/P7-PLAN.md §12.3): how this installation realizes HybridFabrics (overrides of
      # eda/common/vars/fabric_realization.yml; per fabric under fabrics.<name>)
      fabric_realization: "{{ lookup('env', 'FABRIC_REALIZATION') | default('{}', true) | from_json }}"

controller_hosts:
  - name: localhost
    inventory: sovereign-localhost
