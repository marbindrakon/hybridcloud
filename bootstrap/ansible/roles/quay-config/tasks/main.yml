---
# ─── Step 1: Read Vault token ──────────────────────────────────────────────
- name: Read Vault root token from Kubernetes secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: vault-init-secrets
    namespace: "{{ vault_namespace | default('central-vault') }}"
  register: _vault_init_secret
  retries: 5
  delay: 10

- name: Set vault token fact
  set_fact:
    vault_root_token: "{{ _vault_init_secret.resources[0].data.root_token | b64decode }}"
  when: _vault_init_secret.resources | length > 0

# ─── Step 2: Wait for Quay to become ready ────────────────────────────────
# shc: health over HTTP. The k8s_info form looked for the QuayRegistry on the cluster the job runs
# on (central), so for the services Quay it never matched and waited out its 60 retries.
- name: Wait for Quay to report healthy
  ansible.builtin.uri:
    url: "{{ quay_url }}/health/instance"
    method: GET
    validate_certs: false
    status_code: [200]
  register: _quay_health
  retries: 60
  delay: 10
  until: _quay_health.status | default(0) == 200
  ignore_errors: true

- name: Wait additional time for Quay API to stabilize
  pause:
    seconds: 30
  when: _quay_health.status | default(0) == 200

# ─── Step 3: Initialize Quay superuser ────────────────────────────────────
- name: Generate secure admin password
  set_fact:
    quay_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"

# shc: re-runs reuse the stored admin token. /api/v1/user/initialize only works on an empty
# database, so after the first run the init failed every time (10 retries, then fatal).
- name: Read stored Quay admin credentials from Vault
  uri:
    url: "{{ vault_addr }}/v1/{{ vault_secret_path | regex_replace('^central/', 'central/data/') }}"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: [200, 404]
  register: _quay_vault_existing
  no_log: true

- name: Check the stored Quay admin token
  uri:
    url: "{{ quay_url }}/api/v1/user/"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _quay_vault_existing.json.data.data.token }}"
    status_code: [200, 401, 403]
  register: _quay_token_check
  when: _quay_vault_existing.status == 200 and (_quay_vault_existing.json.data.data.token | default('')) | length > 0
  no_log: true

- name: Reuse the stored Quay admin token
  set_fact:
    quay_access_token: "{{ _quay_vault_existing.json.data.data.token }}"
  when: _quay_token_check is not skipped and _quay_token_check.status == 200
  no_log: true

# 400 = the database already has users (initialize only works once); the token is then minted below.
- name: Initialize Quay superuser via API
  uri:
    url: "{{ quay_url }}/api/v1/user/initialize"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "{{ quay_admin_user }}"
      password: "{{ quay_admin_password }}"
      email: "admin@sovereign.local"
      access_token: true
    status_code: [200, 201, 400]
  register: _quay_init
  retries: 10
  delay: 15
  until: _quay_init.status in [200, 201, 400]
  when: quay_access_token is not defined
  no_log: true

# shc: the initialize token lasts 2.5 h (Quay's create_user_access_token default expires_in=9000), and
# with AUTHENTICATION_TYPE OIDC there is no password sign-in to get another. Whenever the stored token
# isn't usable, mint a long-lived one (quay_admin_token_ttl_days) on the same "automation" application
# through Quay's own data model in the quay-app pod (files/quay_mint_admin_token.py on stdin). The
# Quay cluster is reached with Argo CD's cluster credentials (as mtv-catalog-sync does) when
# quay_cluster_secret is set, else in-cluster. Re-run this job to replace an expired token.
- name: Decide whether to mint a token
  set_fact:
    _quay_need_mint: "{{ quay_access_token is not defined }}"

- name: Mint a long-lived Quay admin token
  when: _quay_need_mint | bool
  block:
    - name: Read the Quay cluster's Argo CD credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ quay_cluster_secret }}"
        namespace: openshift-gitops
      register: _quay_cluster
      when: quay_cluster_secret | length > 0
      no_log: true

    - name: Set the Quay cluster connection
      set_fact:
        _quay_k8s_host: "{{ _quay_cluster.resources[0].data.server | b64decode }}"
        _quay_k8s_token: "{{ (_quay_cluster.resources[0].data.config | b64decode | from_json).bearerToken }}"
      when: quay_cluster_secret | length > 0
      no_log: true

    - name: Find a running quay-app pod
      kubernetes.core.k8s_info:
        host: "{{ _quay_k8s_host | default(omit) }}"
        api_key: "{{ _quay_k8s_token | default(omit) }}"
        validate_certs: false
        api_version: v1
        kind: Pod
        namespace: "{{ quay_namespace }}"
        label_selectors: [quay-component=quay-app]
        field_selectors: [status.phase=Running]
      register: _quay_app_pods
      failed_when: _quay_app_pods.resources | length == 0

    - name: Mint the token through Quay's data model
      kubernetes.core.k8s_exec:
        host: "{{ _quay_k8s_host | default(omit) }}"
        api_key: "{{ _quay_k8s_token | default(omit) }}"
        validate_certs: false
        namespace: "{{ quay_namespace }}"
        pod: "{{ _quay_app_pods.resources[0].metadata.name }}"
        container: quay-app
        command: >-
          sh -c "cd /quay-registry && echo {{ lookup('file', 'quay_mint_admin_token.py') | b64encode }} | base64 -d
          | QUAY_ADMIN_USER={{ quay_admin_user }} QUAY_TOKEN_TTL_DAYS={{ quay_admin_token_ttl_days }} timeout 300 python3 -W ignore -"
      register: _quay_mint
      no_log: true

    - name: Set Quay access token
      set_fact:
        quay_access_token: "{{ _quay_mint.stdout_lines | last | trim }}"
      no_log: true

    - name: Verify the minted token
      uri:
        url: "{{ quay_url }}/api/v1/user/"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ quay_access_token }}"
        status_code: [200]
      no_log: true

# ─── Step 4: Store admin credentials in Vault ─────────────────────────────
# The password is the new one only when initialize created the user; otherwise keep the stored one.
- name: Write Quay admin credentials to Vault
  uri:
    url: "{{ vault_addr }}/v1/{{ vault_secret_path | regex_replace('^central/', 'central/data/') }}"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      data:
        username: "{{ quay_admin_user }}"
        password: >-
          {{ quay_admin_password if (_quay_init is not skipped and _quay_init.status in [200, 201])
             else (_quay_vault_existing.json.data.data.password | default('')) }}
        token: "{{ quay_access_token }}"
        url: "{{ quay_url }}"
    status_code: [200, 204]
  when: _quay_need_mint | bool
  no_log: true

# ─── Step 5: Get Keycloak client secret from Vault ────────────────────────
- name: Read Keycloak admin credentials from secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ keycloak_admin_secret }}"
    namespace: "{{ keycloak_admin_secret_ns }}"
  register: _rhbk_secret
  retries: 5
  delay: 5

- name: Set Keycloak admin credentials
  set_fact:
    keycloak_admin_username: "{{ _rhbk_secret.resources[0].data.username | b64decode }}"
    keycloak_admin_password: "{{ _rhbk_secret.resources[0].data.password | b64decode }}"
  no_log: true
  when: _rhbk_secret.resources | length > 0

- name: Get Keycloak admin token
  uri:
    url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_admin_username }}"
      password: "{{ keycloak_admin_password }}"
    status_code: 200
  register: _kc_token
  no_log: true
  retries: 5
  delay: 10

- name: Set Keycloak admin token
  set_fact:
    kc_admin_token: "{{ _kc_token.json.access_token }}"
  no_log: true

- name: Get Keycloak client secret for Quay
  uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/clients"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
    status_code: 200
  register: _kc_clients
  retries: 3
  delay: 5

- name: Find Quay client UUID
  set_fact:
    quay_client_uuid: "{{ (_kc_clients.json | selectattr('clientId', 'equalto', keycloak_client_id) | list | first).id }}"
  when: _kc_clients.json | selectattr('clientId', 'equalto', keycloak_client_id) | list | length > 0

- name: Get Quay client secret from Keycloak
  uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ quay_client_uuid }}/client-secret"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
    status_code: 200
  register: _quay_client_secret
  no_log: true
  when: quay_client_uuid is defined

- name: Set Quay OIDC client secret
  set_fact:
    quay_oidc_client_secret: "{{ _quay_client_secret.json.value }}"
  no_log: true
  when: _quay_client_secret is not skipped and _quay_client_secret.json is defined

# ─── Step 6: Configure Quay OIDC via superuser config endpoint ────────────
- name: Get current Quay superuser config
  uri:
    url: "{{ quay_url }}/api/v1/superuser/config"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ quay_access_token }}"
    # shc: operator-managed Quay (3.17) answers 403: no runtime config API. OIDC then comes from
    # the quay chart's config-bundle injection (oidc values) instead of the PUT below.
    status_code: [200, 403]
  register: _quay_config
  retries: 3
  delay: 5
  until: _quay_config.status in [200, 403]

- name: Note that OIDC is configured through the config bundle
  ansible.builtin.debug:
    msg: "Quay has no superuser config API (403); OIDC login comes from the quay chart's config bundle (oidc values)."
  when: _quay_config.status == 403

- name: Apply OIDC config to Quay
  uri:
    url: "{{ quay_url }}/api/v1/superuser/config"
    method: PUT
    validate_certs: false
    headers:
      Authorization: "Bearer {{ quay_access_token }}"
    body_format: json
    body:
      config: "{{ _quay_config.json.config | combine({
        'AUTHENTICATION_TYPE': 'OIDC',
        'PREFERRED_URL_SCHEME': 'https',
        'OIDC_LOGIN_CONFIG': {
          'CLIENT_ID': keycloak_client_id,
          'CLIENT_SECRET': quay_oidc_client_secret,
          'OIDC_SERVER': keycloak_url ~ '/realms/' ~ keycloak_realm,
          'SERVICE_NAME': 'Keycloak',
          'VERIFIED_EMAIL_CLAIM_NAME': 'email',
          'PREFERRED_GROUP_CLAIM_NAME': 'groups',
          'LOGIN_SCOPES': ['openid', 'email', 'profile', 'groups']
        },
        'FEATURE_TEAM_SYNCING': true,
        'TEAM_RESYNC_STALE_TIME': '60m'
      }) }}"
    status_code: [200, 201]
  no_log: true
  when: quay_oidc_client_secret is defined and _quay_config.status == 200

- name: Trigger Quay config reload
  uri:
    url: "{{ quay_url }}/api/v1/superuser/registrystatus"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ quay_access_token }}"
    status_code: [200, 404]
  ignore_errors: true
