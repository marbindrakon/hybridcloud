---
# shc (design/P9-PLAN.md §3–4): AttachmentCircuit provision. Resolves the network and the ProviderEdge, checks the
# circuit against both (Entity allowed on the edge, bearer and CE kind, same fabric, CE ASN, accept list against the
# network's address space and the platform's ranges), then takes a VLAN and a link subnet from the fabric's ledger,
# keeps the BGP password in Vault (the tenant's Secret, or a generated one written to a Secret <name>-bgp), and
# records the circuit's realization (status.realization, with its revision rev) and what the CE needs
# (status.ceConfig). The fabric job realizes it on the border nodes; this job wakes the fabric when the realization
# changes. Once the fabric reports this revision on its nodes (status.realization.attachments), the job reads the BGP
# session from each node: ready when every session is established, else pending (realized; the operator runs the
# job again on its reconcilePeriod).
- block:
    - name: Read the AttachmentCircuit
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: End the job for a circuit being deleted
      ansible.builtin.meta: end_play
      when: fab_deleting | bool

    - name: Start with nothing to wait for
      ansible.builtin.set_fact:
        ac_waiting: []
        ac_status: {entity: "{{ fab_entity }}"}
        ac_owner: "AttachmentCircuit/{{ fab_namespace }}/{{ fab_name }}"
        ac_bgp: "{{ fab_spec.routing.bgp | default({}, true) }}"
        ac_auth_type: "{{ ((fab_spec.routing.bgp | default({}, true)).authentication | default({}, true)).type | default('md5', true) }}"

    - name: Read the network and the edge
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      loop:
        - {kind: HybridNetwork, name: "{{ fab_spec.network }}", namespace: "{{ fab_namespace }}"}
        - {kind: ProviderEdge, name: "{{ fab_spec.edgeRef.name }}", namespace: "{{ fabric_platform_namespace }}"}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      register: _ac_refs

    - name: Set the network and edge facts
      ansible.builtin.set_fact:
        ac_network: "{{ (_ac_refs.results[0].resources | default([], true) + [{}]) | first }}"
        ac_edge: "{{ (_ac_refs.results[1].resources | default([], true) + [{}]) | first }}"

    - name: Refuse references that are being deleted
      ansible.builtin.set_fact:
        fab_fail_reason: ReferenceDeleting
        fab_fail_msg: >-
          AttachmentCircuit {{ fab_name }}: {{ [ac_network, ac_edge] | selectattr('metadata', 'defined')
          | selectattr('metadata.deletionTimestamp', 'defined') | map(attribute='kind') | join(' and ') }} being deleted
      when: >-
        [ac_network, ac_edge] | selectattr('metadata', 'defined') | selectattr('metadata.deletionTimestamp', 'defined')
        | list | length > 0

    # an edge offers bearers to the Entities it lists (none listed: every Entity), each bearer to some CE kinds
    - name: Check the circuit against the edge
      vars:
        _refs: "{{ (ac_edge.spec | default({}, true)).entityRefs | default([], true) | map(attribute='name') | list }}"
        _bearer: >-
          {{ ((ac_edge.spec | default({}, true)).bearers | default([], true)
              | selectattr('name', 'equalto', fab_spec.edgeRef.bearer) | list + [{}]) | first }}
        _kind: "{{ fab_spec.ceKind | default('customer') }}"
      ansible.builtin.set_fact:
        ac_edge_problem: >-
          {{ ['EntityNotAllowed', 'Entity ' ~ fab_entity ~ ' may not use ProviderEdge ' ~ fab_spec.edgeRef.name]
               if _refs | length > 0 and fab_entity not in _refs
             else ['BearerNotFound', 'ProviderEdge ' ~ fab_spec.edgeRef.name ~ ' has no bearer ' ~ fab_spec.edgeRef.bearer]
               if not _bearer
             else ['CeKindNotAccepted', 'bearer ' ~ fab_spec.edgeRef.bearer ~ ' does not accept CE kind ' ~ _kind]
               if _kind not in (_bearer.ceKinds | default([]))
             else [] }}
      when: ac_edge | length > 0

    - name: Refuse a circuit the edge doesn't offer
      ansible.builtin.set_fact:
        fab_fail_reason: "{{ ac_edge_problem[0] }}"
        fab_fail_msg: "AttachmentCircuit {{ fab_name }}: {{ ac_edge_problem[1] }}"
      when:
        - fab_fail_msg | default('', true) | length == 0
        - ac_edge_problem | default([]) | length > 0

    - name: Refuse a network on another fabric
      ansible.builtin.set_fact:
        fab_fail_reason: FabricMismatch
        fab_fail_msg: >-
          AttachmentCircuit {{ fab_name }}: ProviderEdge {{ fab_spec.edgeRef.name }} is on HybridFabric
          {{ ac_edge.spec.fabricRef.name }}, network {{ fab_spec.network }} on {{ ac_network.status.fabric }}
      when:
        - fab_fail_msg | default('', true) | length == 0
        - ac_edge | length > 0
        - (ac_network.status | default({}, true)).fabric | default('', true) | length > 0
        - ac_edge.spec.fabricRef.name != ac_network.status.fabric

    - name: Stop on a refused circuit
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_msg | default('', true) | length > 0

    - name: Wait for the network and the edge
      vars:
        _deps:
          - {what: "HybridNetwork {{ fab_spec.network }}", obj: "{{ ac_network }}"}
          - {what: "ProviderEdge {{ fab_spec.edgeRef.name }}", obj: "{{ ac_edge }}"}
      ansible.builtin.set_fact:
        ac_waiting: >-
          {{ ac_waiting + [item.what ~ ' (' ~ (((item.obj.status | default({}, true)).status | default('not provisioned', true))
                                               if item.obj else 'not found') ~ ')'] }}
      loop: "{{ _deps }}"
      loop_control:
        label: "{{ item.what }}"
      when: >-
        not item.obj or not (((item.obj.status | default({}, true)).ready | default(false) | bool)
                             or (((item.obj.status | default({}, true)).realized | default(false) | bool)
                                 and (item.obj.status | default({}, true)).status | default('') != 'failed'))

    - name: Wait for the network's VPN target
      ansible.builtin.set_fact:
        ac_waiting: "{{ ac_waiting + ['HybridNetwork ' ~ fab_spec.network ~ ' (no VPN target yet)'] }}"
      when:
        - ac_network | length > 0
        - ac_waiting | length == 0
        - ((ac_network.status | default({}, true)).realization | default({}, true)).vpnTarget is not defined

    - name: Report what the circuit waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: WaitingForDependencies
        fab_message: "Waiting for {{ ac_waiting | join('; ') }}"
        fab_waiting_for: "{{ ac_waiting }}"
        fab_status: "{{ ac_status }}"
      when: ac_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: ac_waiting | length > 0

    # ---- numbers and policy ----
    - name: Read the fabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ac_edge.spec.fabricRef.name }}"
        namespace: "{{ fabric_platform_namespace }}"
      register: _ac_fabric

    - name: Set the fabric facts
      ansible.builtin.set_fact:
        ac_fabric: "{{ _ac_fabric.resources[0] }}"
        ac_asn: "{{ _ac_fabric.resources[0].spec.domainAsn | int }}"
        ac_status: "{{ ac_status | combine({'fabric': _ac_fabric.resources[0].metadata.name}) }}"

    - name: Refuse the fabric's own AS number for the CE
      ansible.builtin.set_fact:
        fab_fail_reason: AsnConflict
        fab_fail_msg: >-
          AttachmentCircuit {{ fab_name }}: routing.bgp.peerAsn {{ ac_bgp.peerAsn }} is the fabric's own AS number;
          the CE needs a different one
      when: ac_bgp.peerAsn | int == ac_asn | int

    - name: Stop on the fabric's AS number
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: ac_bgp.peerAsn | int == ac_asn | int

    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ ac_fabric.metadata.name }}"

    # the platform's own BGP sessions (e.g. its internet hand-off) use these AS numbers; a CE on one would collide
    - name: Refuse an AS number the platform keeps for itself
      ansible.builtin.set_fact:
        fab_fail_reason: PeerAsnReserved
        fab_fail_msg: >-
          AttachmentCircuit {{ fab_name }}: routing.bgp.peerAsn {{ ac_bgp.peerAsn }}: this AS is reserved by the
          platform; the CE needs a different one
      when: ac_bgp.peerAsn | int in ((fab_real.attachments | default({}, true)).reservedAsns | default([], true) | map('int') | list)

    - name: Stop on a reserved AS number
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_fail_reason | default('') == 'PeerAsnReserved'

    # the network's address space (as asked for and as the IPAM holds it) is the tenant's own: no CE route in it
    - name: Check the accept list
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: check-circuit
          accept: "{{ fab_spec.routing.accept | default([]) }}"
          space: >-
            {{ ((ac_network.spec | default({}, true)).prefixes | default([], true))
               + ((ac_network.status | default({}, true)).addressSpace | default([], true) | map(attribute='prefix') | list) }}
          reserved: >-
            {{ [fab_real.attachments.linkPool, fab_real.core.loopbackPool, fab_real.core.linkSubnet,
                fab_real.egress.linkPool | default('169.254.0.0/16')]
               + (fab_real.egress.platformSources | default([], true)) }}
          egressInternet: "{{ (ac_network.spec.egress | default({}, true)).internet | default(false) | bool }}"
          advertiseDefault: "{{ (fab_spec.routing.advertise | default({}, true)).default | default(false) | bool }}"

    - name: Refuse an accept list that reaches into the network or the platform
      ansible.builtin.set_fact:
        fab_fail_reason: PolicyRefused
        fab_fail_msg: "AttachmentCircuit {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on a refused accept list
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    - name: Keep the policy result
      ansible.builtin.set_fact:
        ac_policy: "{{ fab_check_result }}"

    # ---- BGP password (before the ledger: a circuit waiting for its Secret holds no VLAN) ----
    - name: The password's Vault path
      ansible.builtin.set_fact:
        ac_vault_path: "{{ fab_real.attachments.secretPath | replace('{entity}', fab_entity) | replace('{name}', fab_name) }}"
        ac_secret_name: >-
          {{ ((ac_bgp.authentication | default({}, true)).secretRef | default({}, true)).name
             | default(fab_name ~ '-bgp', true) }}
        ac_secret_given: "{{ ((ac_bgp.authentication | default({}, true)).secretRef | default({}, true)).name is defined }}"

    - name: Keep the BGP password
      when: ac_auth_type == 'md5'
      block:
        - name: Read the tenant's Secret
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: v1
            kind: Secret
            name: "{{ ac_secret_name }}"
            namespace: "{{ fab_namespace }}"
          register: _ac_secret
          no_log: true
          when: ac_secret_given | bool

        - name: Wait for the tenant's Secret
          ansible.builtin.set_fact:
            ac_waiting: ["Secret {{ ac_secret_name }} with key password"]
          when:
            - ac_secret_given | bool
            - ((_ac_secret.resources | default([{}], true))[0].data | default({}, true)).password | default('') | length == 0

        # the password goes into the nodes' BGP configuration as one word
        - name: Refuse a password the BGP configuration can't carry
          ansible.builtin.set_fact:
            fab_fail_reason: InvalidSecret
            fab_fail_msg: >-
              AttachmentCircuit {{ fab_name }}: the password in Secret {{ ac_secret_name }} must be 1-80 characters
              from A-Z, a-z, 0-9 and _.:,+=@%^*~-
          when:
            - ac_secret_given | bool
            - ac_waiting | length == 0
            - not ((_ac_secret.resources[0].data.password | b64decode) is match('^[A-Za-z0-9_.:,+=@%^*~-]{1,80}$'))
          no_log: true

        - name: Stop on an unusable password
          ansible.builtin.fail:
            msg: "{{ fab_fail_msg }}"
          when: fab_fail_reason | default('') == 'InvalidSecret'

        - name: Report the circuit waiting for its Secret
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
          vars:
            fab_outcome: pending
            fab_reason: WaitingForSecret
            fab_message: "Waiting for Secret {{ ac_secret_name }} (key password) in {{ fab_namespace }}"
            fab_waiting_for: "{{ ac_waiting }}"
            fab_status: "{{ ac_status }}"
          when: ac_waiting | length > 0

        - name: End the job while waiting for the Secret
          ansible.builtin.meta: end_play
          when: ac_waiting | length > 0

        - name: Read the kept password
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: "{{ ac_vault_path }}"
            vault_kv_read_missing_ok: true

        - name: The password to keep
          ansible.builtin.set_fact:
            ac_password: >-
              {{ (_ac_secret.resources[0].data.password | b64decode) if ac_secret_given | bool
                 else (vault_kv_data.password | default('', true)
                       or lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}
          no_log: true

        - name: Keep the password in Vault
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_write.yml"
          vars:
            vault_kv_path: "{{ ac_vault_path }}"
            vault_kv_write_data: {password: "{{ ac_password }}"}
          when: ac_password != (vault_kv_data.password | default(''))

        # a generated password goes to a Secret the tenant reads; it goes with the circuit (owner reference)
        - name: Write the generated password to the tenant's namespace
          kubernetes.core.k8s:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                name: "{{ ac_secret_name }}"
                namespace: "{{ fab_namespace }}"
                labels:
                  hybridsovereign.redhat/attachmentcircuit: "{{ fab_name }}"
                ownerReferences:
                  - apiVersion: hybridsovereign.redhat/v1alpha1
                    kind: AttachmentCircuit
                    name: "{{ fab_name }}"
                    uid: "{{ fab_obj.metadata.uid }}"
              stringData:
                password: "{{ ac_password }}"
          no_log: true
          when: not ac_secret_given | bool

        - name: Drop the password
          ansible.builtin.set_fact:
            ac_password: ""
            vault_kv_data: {}
          no_log: true

    - name: The circuit's VLAN
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-allocate, namespace: "{{ fabric_platform_namespace }}", fabric: "{{ ac_fabric.metadata.name }}",
                     kind: attachVlan, owner: "{{ ac_owner }}"}

    - name: Keep the VLAN
      ansible.builtin.set_fact:
        ac_vlan: "{{ fab_ledger_result.value | int }}"

    - name: The circuit's link subnet (its index in the link pool)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-allocate, namespace: "{{ fabric_platform_namespace }}", fabric: "{{ ac_fabric.metadata.name }}",
                     kind: attachLink, owner: "{{ ac_owner }}"}

    - name: Keep the link index
      ansible.builtin.set_fact:
        ac_link_index: "{{ fab_ledger_result.value | int }}"

    - name: The circuit's link addresses
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: circuit-plan
          attachments: "{{ fab_real.attachments }}"
          nodes: "{{ (ac_fabric.spec.borderGateway | default({}, true)).nodes | default([], true) | map(attribute='name') | list }}"
          index: "{{ ac_link_index | int }}"

    - name: Refuse a link the platform can't number
      ansible.builtin.fail:
        msg: "AttachmentCircuit {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Keep the link plan
      ansible.builtin.set_fact:
        ac_plan: "{{ fab_check_result }}"
        ac_bearer_real: >-
          {{ ((fab_real.attachments.providerEdges | default({}, true)).get(fab_spec.edgeRef.name, {}).bearers
              | default({}, true)).get(fab_spec.edgeRef.bearer, {}) }}

    # ---- record ----
    # one expression per dict: values nested in a YAML mapping stay strings on older ansible-core (no native types)
    - name: The circuit's realization and the CE's parameters
      vars:
        _maxp: "{{ ac_bgp.maxPrefixes | default({}, true) }}"
        _adv: "{{ fab_spec.routing.advertise | default({}, true) }}"
        _mtu: "{{ (ac_bearer_real.mtu | default(1500)) | int }}"
      ansible.builtin.set_fact:
        ac_real: >-
          {{ {'vlan': ac_vlan | int, 'linkIndex': ac_link_index | int, 'link': ac_plan.link, 'nodes': ac_plan.nodes,
              'ce': ac_plan.ce, 'vrf': 'e' ~ ac_network.status.realization.vpnTarget,
              'vpnTarget': ac_network.status.realization.vpnTarget | int, 'bearer': fab_spec.edgeRef.bearer,
              'interface': ac_bearer_real.interface | default(''), 'mtu': _mtu | int, 'peerAsn': ac_bgp.peerAsn | int,
              'authentication': ac_auth_type, 'passwordPath': ac_vault_path if ac_auth_type == 'md5' else '',
              'maxPrefixes': (_maxp.limit | default(100)) | int, 'maxPrefixAction': _maxp.action | default('teardown'),
              'bfd': ac_bgp.bfd | default(false) | bool, 'accept': fab_spec.routing.accept,
              'acceptsDefault': ac_policy.acceptsDefault | bool,
              'advertiseNetworkPrefixes': _adv.networkPrefixes | default(true) | bool,
              'advertiseDefault': _adv.default | default(false) | bool} }}
        ac_ce_config: >-
          {{ {'vlan': ac_vlan | int, 'address': ac_plan.ce ~ '/' ~ ac_plan.prefixLength,
              'secondAddress': ac_plan.ceSecond ~ '/' ~ ac_plan.prefixLength, 'localAsn': ac_bgp.peerAsn | int,
              'neighbors': ac_plan.nodes | map('combine', {'asn': ac_asn | int}) | list,
              'mtu': _mtu | int,
              'authentication': {'type': ac_auth_type} | combine({'secretName': ac_secret_name} if ac_auth_type == 'md5' else {}),
              'bfd': ac_bgp.bfd | default(false) | bool} }}

    # the revision the fabric reports when it has realized exactly this
    - name: The realization's revision
      ansible.builtin.set_fact:
        ac_real: "{{ ac_real | combine({'rev': (ac_real | to_json(sort_keys=True) | hash('sha1'))[:12]}) }}"

    - name: Has the realization changed
      ansible.builtin.set_fact:
        ac_changed: "{{ (fab_st.realization | default({}, true)) != ac_real }}"

    - name: Record the circuit
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: attachmentcircuits
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        cr_status_partial: true
        patch_ignore_not_found: true
        cr_status_body: >-
          {{ ac_status | combine({'vlan': ac_vlan | int, 'link': ac_plan.link, 'peAsn': ac_asn | int,
                                  'notes': ac_policy.notes, 'ceConfig': ac_ce_config, 'realization': ac_real}) }}

    # ---- on the border nodes? ----
    - name: Does the fabric hold this revision on its nodes
      vars:
        _key: "{{ fab_namespace }}/{{ fab_name }}"
        _real: "{{ (ac_fabric.status | default({}, true)).realization | default({}, true) }}"
      ansible.builtin.set_fact:
        ac_entry: "{{ (_real.attachments | default([], true) | selectattr('circuit', 'equalto', _key) | list + [{}]) | first }}"
        ac_fabric_skip: >-
          {{ ((_real.attachmentsSkipped | default([], true) | selectattr('circuit', 'equalto', _key) | list + [{}])
              | first).reason | default('') }}

    - name: Set whether the circuit is on the nodes
      ansible.builtin.set_fact:
        ac_on_nodes: "{{ not (ac_changed | bool) and ac_entry.rev | default('') == ac_real.rev and ac_entry.nodes | default([]) | length > 0 }}"

    # a changed realization, or one the fabric hasn't taken up yet (and hasn't refused): the fabric runs again
    - name: Ask the fabric to realize the circuit
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: HybridFabric, namespace: "{{ fabric_platform_namespace }}", name: "{{ ac_fabric.metadata.name }}"}]
      when: ac_changed | bool or (not (ac_on_nodes | bool) and ac_fabric_skip | length == 0)

    - name: Report the circuit waiting for the fabric
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: WaitingForFabric
        fab_message: >-
          VLAN {{ ac_vlan }} on {{ fab_spec.edgeRef.name }}/{{ fab_spec.edgeRef.bearer }}, link {{ ac_plan.link }}
          (CE {{ ac_plan.ce }}); {{ ('HybridFabric ' ~ ac_fabric.metadata.name ~ ' does not realize the circuit: ' ~ ac_fabric_skip)
          if ac_fabric_skip | length > 0 and not ac_changed | bool
          else 'waiting for HybridFabric ' ~ ac_fabric.metadata.name ~ ' to realize the circuit' }}
        fab_waiting_for: ["HybridFabric {{ ac_fabric.metadata.name }} (circuit on VRF {{ ac_real.vrf }})"]
        fab_status: >-
          {{ ac_status | combine({'vlan': ac_vlan | int, 'link': ac_plan.link, 'peAsn': ac_asn | int,
                                  'notes': ac_policy.notes, 'ceConfig': ac_ce_config, 'realization': ac_real,
                                  'sessions': []}) }}
      when: not (ac_on_nodes | bool)

    - name: End the job until the fabric realizes the circuit
      ansible.builtin.meta: end_play
      when: not (ac_on_nodes | bool)

    # ---- the sessions ----
    - name: Read the sessions on the border nodes
      block:
        - name: Connect to the border gateway nodes
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_connect.yml"
          vars:
            bgw_fabric_spec: "{{ ac_fabric.spec }}"
            bgw_ssh_user: "{{ fab_real.nodes.sshUser }}"

        - name: The session from each node
          ansible.builtin.shell:
            cmd: |
              python3 - '{{ ac_real.vrf }}' '{{ ac_real.ce }}' <<'PY'
              import json, subprocess, sys
              vrf, ce = sys.argv[1], sys.argv[2]
              r = subprocess.run(["vtysh", "-c", f"show bgp vrf {vrf} neighbors {ce} json"], capture_output=True, text=True)
              try:
                  nb = json.loads(r.stdout or "{}").get(ce) or {}
              except ValueError:
                  nb = {}
              af = (nb.get("addressFamilyInfo") or {}).get("ipv4Unicast") or {}
              print(json.dumps({"state": nb.get("bgpState", "NotConfigured"), "established": nb.get("bgpTimerUpString"),
                                "accepted": af.get("acceptedPrefixCounter", 0), "advertised": af.get("sentPrefixCounter", 0),
                                "lastReset": nb.get("lastNotificationReason") or nb.get("lastResetDueTo") or "",
                                "bfd": (nb.get("peerBfdInfo") or {}).get("status")}))
              PY
            executable: /bin/bash
          register: _ac_sessions
          changed_when: false
          failed_when: false
          # a node that can't be reached shows as Unknown
          ignore_unreachable: true
          delegate_to: "{{ item }}"
          loop: "{{ ac_entry.nodes }}"
      always:
        - name: Remove the SSH key
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"

    - name: Keep the sessions
      ansible.builtin.set_fact:
        ac_sessions: >-
          {%- set out = [] -%}
          {%- for r in _ac_sessions.results | default([]) -%}
            {%- set ok = (r.stdout | default('') | trim).startswith('{') -%}
            {%- set s = (r.stdout | from_json) if ok else {'state': 'Unknown', 'lastReset': (r.msg | default('node unreachable', true) | string)[:200]} -%}
            {%- set _ = out.append({'node': r.item,
                                    'address': (ac_real.nodes | selectattr('name', 'equalto', r.item) | map(attribute='address') | list + [''])[0]}
                                   | combine(s)) -%}
          {%- endfor -%}
          {{ out }}

    - name: Report the circuit
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        _up: "{{ ac_sessions | selectattr('state', 'equalto', 'Established') | list }}"
        _down: "{{ ac_sessions | rejectattr('state', 'equalto', 'Established') | list }}"
        _all_up: "{{ _up | length == ac_sessions | length and ac_sessions | length > 0 }}"
        fab_outcome: "{{ 'ready' if _all_up | bool else 'pending' }}"
        fab_reason: "{{ 'Ready' if _all_up | bool else ('PartiallyEstablished' if _up | length > 0 else 'WaitingForPeer') }}"
        fab_message: >-
          {{ (('Established on ' ~ _up | map(attribute='node') | join(', ') ~ '; routes accepted '
               ~ _up | map(attribute='accepted') | map('string') | join('/') ~ ', advertised '
               ~ _up | map(attribute='advertised') | map('string') | join('/')) if _up else
              ('Realized on ' ~ ac_entry.nodes | join(', ') ~ ' (VLAN ' ~ ac_vlan ~ ', CE ' ~ ac_plan.ce ~ ')'))
             ~ ((('; ' if _up else '; BGP ') ~ _down | map(attribute='node') | zip(_down | map(attribute='state'),
                 _down | map(attribute='lastReset')) | map('join', ' ') | map('trim') | join(', ')
                 ~ ((': the CE sends more routes than routing.bgp.maxPrefixes allows (the session is tried again every '
                     ~ fab_real.attachments.maxPrefixRestart | default(2) ~ ' minutes)')
                    if _down | selectattr('lastReset', 'search', 'Maximum Number of Prefixes') | list
                    else ('' if _up else ': configure the CE from status.ceConfig'))) if _down else '') }}
        fab_waiting_for: "{{ [] if _all_up | bool else ['the CE: BGP from ' ~ _down | map(attribute='node') | join(', ')] }}"
        fab_status: >-
          {{ ac_status | combine({'vlan': ac_vlan | int, 'link': ac_plan.link, 'peAsn': ac_asn | int,
                                  'notes': ac_policy.notes, 'ceConfig': ac_ce_config, 'realization': ac_real,
                                  'sessions': ac_sessions, 'realized': true}) }}

  rescue:
    - name: Mark the AttachmentCircuit failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('AttachmentCircuit provision failed') }}
        fab_status: "{{ ac_status | default({}) }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "AttachmentCircuit {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
