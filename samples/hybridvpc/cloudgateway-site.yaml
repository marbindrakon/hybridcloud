# Sample CloudGateway: attaches the CloudInfrastructure "virt-site" (EVPN underlay on VLAN 236) to the fabric.
# One address per border gateway node; the site's VTEPs peer with both.
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: virt-site
  namespace: sovereign-cloud
spec:
  fabricRef: {name: lab}
  cloudRef: {name: virt-site}
  siteUnderlay:
    vlan: 236
    cidr: 198.51.100.0/24
    addresses:
      - {node: bgw-1, address: 198.51.100.4}
      - {node: bgw-2, address: 198.51.100.5}
