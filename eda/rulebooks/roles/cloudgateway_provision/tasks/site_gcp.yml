---
# shc (design/P11-GCP-PLAN.md §3.3): a gcp site's edge is run by the platform. The gateway's existence is the edge's
# (billed while it exists): `shc_aws_edge.py up` brings the routers (one per zone of the edge subnet, static external addresses, a mesh
# between them), and waits for the routers' published keys.
# The routers are the gateway's WireGuard peers: the border gateway nodes dial their static external addresses (they may sit behind
# NAT). site_aws_post.yml then gives the routers the nodes' keys and the site's BGP key. Sets cg_site_extra,
# cg_site_changed and the instance's peers.
- name: The installation's GCP realization and this site's edge settings
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_realization.yml"
  vars:
    gcp_edge_site: "{{ fab_name }}"
    gcp_edge_cidr: "{{ fab_spec.siteUnderlay.cidr }}"
    gcp_edge_asn: "{{ cg_fabric.spec.domainAsn }}"

- name: Refuse a gateway without its own BGP key (the fabric's key never leaves the platform)
  ansible.builtin.set_fact:
    fab_fail_reason: InvalidSpec
    fab_fail_msg: "CloudGateway {{ fab_name }}: a gcp site needs its own spec.bgp.passwordRef"
  when: ((fab_spec.bgp | default({})).passwordRef | default({})).vaultPath | default('') | length == 0

- name: Stop on a missing site key
  ansible.builtin.fail:
    msg: "{{ fab_fail_msg }}"
  when: fab_fail_reason == 'InvalidSpec'

- name: Refuse a tunnel MTU the instance doesn't carry
  ansible.builtin.set_fact:
    fab_fail_reason: InvalidSpec
    fab_fail_msg: >-
      CloudGateway {{ fab_name }}: the site's edge runs its tunnel at MTU {{ gcp_edge_cfg.tunnel.mtu | default(1420) }},
      siteUnderlay.mtu says {{ fab_spec.siteUnderlay.mtu }}
  when: (fab_spec.siteUnderlay.mtu | default(gcp_edge_cfg.tunnel.mtu | default(1420))) | int != (gcp_edge_cfg.tunnel.mtu | default(1420)) | int

- name: Stop on a mismatched tunnel MTU
  ansible.builtin.fail:
    msg: "{{ fab_fail_msg }}"
  when: fab_fail_reason == 'InvalidSpec'

- name: Bring up the edge
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
  vars:
    gcp_helper: shc_gcp_edge.py
    gcp_config: "{{ gcp_edge_cfg }}"
    gcp_args: [up]

- name: The routers
  vars:
    _r: "{{ gcp_result.result }}"
  ansible.builtin.set_fact:
    cg_gcp_routers: >-
      {%- set out = [] -%}
      {%- for i in _r.instances -%}
        {%- set n = _r.nodes.get(i.name, {}) -%}
        {%- set _ = out.append({'name': i.name, 'instance': i.id | string, 'zone': i.zone, 'publicIp': i.publicIp, 'privateIp': i.privateIp,
                                'tunnelAddress': _r.tunnelAddresses.get(i.name, ''), 'publicKey': n.publicKey | default('')}) -%}
      {%- endfor -%}
      {{ out }}
    cg_site_changed: "{{ gcp_result.changed | default([]) | length > 0 }}"

- name: Wait for routers that haven't published their keys
  ansible.builtin.set_fact:
    cg_waiting: "{{ cg_waiting + ['edge router ' ~ item.name ~ ' (no published key yet)'] }}"
    cg_reason: WaitingForSiteEdge
  loop: "{{ cg_gcp_routers | selectattr('publicKey', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Report what the gateway waits for
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
  vars:
    fab_outcome: pending
    fab_reason: "{{ cg_reason }}"
    fab_message: "Waiting for {{ cg_waiting | join('; ') }}"
    fab_waiting_for: "{{ cg_waiting }}"
    fab_status: "{{ cg_status }}"
  when: cg_waiting | length > 0

- name: End the job while waiting
  ansible.builtin.meta: end_play
  when: cg_waiting | length > 0

- name: The routers are the gateway's WireGuard peers
  ansible.builtin.set_fact:
    cg_instance: >-
      {%- set peers = [] -%}
      {%- for r in cg_gcp_routers -%}
        {%- set _ = peers.append({'publicKey': r.publicKey, 'endpoint': r.publicIp ~ ':' ~ (gcp_edge_cfg.tunnel.listenPort | default(51820)),
                                  'allowedIPs': [r.tunnelAddress ~ '/32']}) -%}
      {%- endfor -%}
      {{ cg_instance | combine({'wireguard': cg_instance.wireguard | combine({'peers': peers})}) }}
    cg_site_extra:
      managed: true
      account: "{{ gcp_edge_cfg.account }}"
      region: "{{ gcp_edge_cfg.region }}"
      routers: "{{ cg_gcp_routers | map('dict2items') | map('rejectattr', 'key', 'equalto', 'privateIp') | map('items2dict') | list }}"
