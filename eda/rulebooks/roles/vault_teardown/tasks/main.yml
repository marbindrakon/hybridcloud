---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        vault_cr_name: "{{ event_payload.regarding.name }}"
        vault_cr_namespace: "{{ event_payload.regarding.namespace }}"
        vault_instance_name: "vault-{{ event_payload.regarding.name }}"

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read Vault CR for entity context
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Vault
        name: "{{ vault_cr_name }}"
        namespace: "{{ vault_cr_namespace }}"
      register: vault_cr_final

    - name: Delete Vault StatefulSet
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ vault_instance_name }}"
        namespace: "{{ vault_cr_namespace }}"
      ignore_errors: true

    - name: Delete Vault Services
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: v1
        kind: Service
        name: "{{ item }}"
        namespace: "{{ vault_cr_namespace }}"
      loop:
        - "{{ vault_instance_name }}"
        - "{{ vault_instance_name }}-internal"
      ignore_errors: true

    - name: Delete Vault Route
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: route.openshift.io/v1
        kind: Route
        name: "{{ vault_instance_name }}"
        namespace: "{{ vault_cr_namespace }}"
      ignore_errors: true

    - name: Delete Vault init Secret
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ vault_instance_name }}-init"
        namespace: "{{ vault_cr_namespace }}"
      ignore_errors: true

    - name: Delete Vault ServiceAccount
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: v1
        kind: ServiceAccount
        name: "{{ vault_instance_name }}"
        namespace: "{{ vault_cr_namespace }}"
      ignore_errors: true

    # the client id the provision recorded (never rebuilt); nothing recorded = no client was made or kept
    - name: The Vault's recorded sign-in client
      ansible.builtin.set_fact:
        vault_fin_entity: "{{ vault_cr_final.resources[0].status.entity | default('') }}"
        vault_fin_oidc_client_id: "{{ vault_cr_final.resources[0].status.oidcClientId }}"
        vault_fin_owner: "Vault/{{ vault_cr_namespace }}/{{ vault_cr_name }}"
      when:
        - vault_cr_final.resources | length > 0
        - (vault_cr_final.resources[0].status | default({}, true)).oidcClientId | default('', true) | length > 0

    # the tenant realm's clients automation client (published by the RbacConfig job), not the master realm admin
    - name: Run Keycloak OIDC client cleanup
      when: vault_fin_oidc_client_id is defined
      block:
        # the labelled Route, else KEYCLOAK_EXTERNAL_URL (the block's errors are ignored: the delete goes on)
        - name: The sign-in directory's address
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/services_keycloak_url.yml"

        - name: Set Keycloak URL
          ansible.builtin.set_fact:
            kc_external_url_fin: "{{ skc_url }}"

        - name: Obtain the realm token for the Vault sign-in client
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_realm_token.yml"
          vars:
            krt_purpose: clients
            krt_rbac_config: >-
              {{ (shc_live_spec | default({}, true)).rbacConfig
                 | default((vault_cr_final.resources[0].spec | default({}, true)).rbacConfig
                           if vault_cr_final.resources | default([]) | length > 0 else '', true)
                 | default('', true) }}
            krt_url: "{{ kc_external_url_fin }}"
            krt_token_fact: kc_token_fin

        # the client representation carries the client secret
        - name: Look up Vault Keycloak OIDC client
          ansible.builtin.uri:
            url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_name }}/clients?clientId={{ vault_fin_oidc_client_id | urlencode }}"
            method: GET
            headers:
              Authorization: "Bearer {{ kc_token_fin }}"
            validate_certs: false
            status_code: [200]
          register: kc_client_lookup_fin
          no_log: true

        # only the recorded client with this Vault's mark, or with none (made before the mark)
        - name: "Decide: delete or leave"
          vars:
            _found: "{{ kc_client_lookup_fin.json | default([], true) | selectattr('clientId', 'equalto', vault_fin_oidc_client_id) | list }}"
            _mark: >-
              {{ (((_found | first).attributes | default({}, true))['hybridsovereign.redhat/owner'] | default('', true))
                 if _found | length > 0 else '' }}
          ansible.builtin.set_fact:
            vault_fin_client_uuid: "{{ (_found | first).id if _found | length > 0 else '' }}"
            vault_fin_decision: >-
              {{ 'gone' if _found | length == 0 else ('delete' if _mark in [vault_fin_owner, ''] else 'leave') }}

        - name: Delete Vault Keycloak OIDC client
          ansible.builtin.uri:
            url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_name }}/clients/{{ vault_fin_client_uuid }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ kc_token_fin }}"
            validate_certs: false
            status_code: [200, 204, 404]
          when: vault_fin_decision == 'delete'
      always:
        - name: Forget the realm token and the client
          ansible.builtin.set_fact:
            kc_token_fin: ""
            kc_client_lookup_fin: {}
          no_log: true
      ignore_errors: true

    - name: Get current timestamp
      ansible.builtin.set_fact:
        vault_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark Vault deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: vaults
        cr_name: "{{ vault_cr_name }}"
        cr_namespace: "{{ vault_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          lastReconciledAt: "{{ vault_delete_transition_time }}"
          message: Vault {{ vault_cr_name }} finalized by EDA

  rescue:
    - name: Mark Vault delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: vaults
        cr_name: "{{ vault_cr_name }}"
        cr_namespace: "{{ vault_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA deletion failed')) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "Vault {{ vault_cr_name | default('unknown') }} EDA teardown failed"
