---
# The placement's subnets from the ipam-allocate result: status.prefixes (IPv4 first, unchanged meaning) and
# status.subnets, one row per family {family, prefix, gateway (IPv4: the first host; IPv6 on a CloudVirt or CloudOSO:
# the first host too, OVN-Kubernetes' gateway and Neutron's default; a CloudOSO's row then takes the gateway the site
# reports, backend_cloudoso.yml), source} — the IPAM's own rows when it returns them, else built from the prefixes
# (source Network). A provider's subnet (source Provider) gets no gateway here.
# Inputs: fab_ipam_result, np_status, np_backend_kind. Sets np_prefixes, np_prefixes_v4, np_prefixes_v6 (the IPv6 rows' prefixes, also
# the ones only status.subnets holds, e.g. a provider prefix), np_subnets, np_status.
- name: Keep the subnets
  vars:
    _rows: >-
      {%- set out = [] -%}
      {%- set given = fab_ipam_result.subnets | default([], true) -%}
      {%- if given | length > 0 -%}
        {%- for r in given -%}{%- set _ = out.append(r) -%}{%- endfor -%}
      {%- else -%}
        {%- for p in fab_ipam_result.prefixes | default([], true) -%}
          {%- set _ = out.append({'family': 6 if ':' in p else 4, 'prefix': p, 'source': 'Network'}) -%}
        {%- endfor -%}
      {%- endif -%}
      {%- set rows = [] -%}
      {%- for r in out | sort(attribute='family') -%}
        {%- if r.family | int == 4 -%}
          {%- set a = r.prefix.split('/')[0].split('.') -%}
          {%- set _ = rows.append(r | combine({'gateway': a[:3] | join('.') ~ '.' ~ (a[3] | int + 1)})) -%}
        {%- elif np_backend_kind | default('') in ['CloudVirt', 'CloudOSO'] and r.source | default('Network') != 'Provider' -%}
          {#- the first host: the network address has its last bit clear, so its last group + 1 never carries -#}
          {%- set a = r.prefix.split('/')[0] | lower -%}
          {%- if a.endswith('::') -%}
            {%- set gw = a ~ '1' -%}
          {%- else -%}
            {%- set parts = a.split(':') -%}
            {%- set gw = parts[:-1] | join(':') ~ ':' ~ '%x' | format(parts[-1] | int(base=16) + 1) -%}
          {%- endif -%}
          {%- set _ = rows.append(r | combine({'gateway': gw})) -%}
        {%- else -%}
          {%- set _ = rows.append(r) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ rows }}
    _v6: >-
      {%- set out = [] -%}
      {%- for r in _rows if r.family | int == 6 -%}{%- set _ = out.append(r.prefix) -%}{%- endfor -%}
      {{ (out + (fab_ipam_result.prefixes | default([], true) | select('search', ':') | list)) | unique | list }}
  ansible.builtin.set_fact:
    np_prefixes: "{{ fab_ipam_result.prefixes }}"
    np_prefixes_v4: "{{ fab_ipam_result.prefixes | reject('search', ':') | list }}"
    np_prefixes_v6: "{{ _v6 }}"
    np_subnets: "{{ _rows }}"
    np_status: "{{ np_status | combine({'prefixes': fab_ipam_result.prefixes, 'subnets': _rows}) }}"
