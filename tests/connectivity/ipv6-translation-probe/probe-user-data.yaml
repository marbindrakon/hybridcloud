#cloud-config
# The IPv6 translation probe (Fedora): a CLAT (clatd) for IPv4 literals, a check script run every minute by a systemd
# timer, and a small HTTP server that serves the last run's results at http://[<address>]:__PORT__/metrics in
# Prometheus text format. A tester reads that page (README.md, "Reading the result"). The guest uses only the
# resolvers of its network configuration (ignore-auto-dns, at every boot). Replace every placeholder first (README.md
# lists them); the file is the same for an OpenShift Virtualization VM and an OpenStack server.
package_update: false
packages:
  - clatd
  - python3
  - bind-utils
  - iputils
  - curl
  # reports the VM's addresses to OpenShift Virtualization (the VirtualMachineInstance's status then lists them)
  - qemu-guest-agent
write_files:
  # the CLAT: IPv4 literals leave as IPv6 through the site's translation prefix
  - path: /etc/clatd.conf
    permissions: "0644"
    content: |
      plat-prefix=__PREF64__
  - path: /usr/local/bin/shc-ipv6-probe
    permissions: "0755"
    content: |
      #!/bin/bash
      # IPv6 translation probe: run every check once and write the results atomically to /var/lib/shc-ipv6-probe/metrics
      # (Prometheus text format): shc_ipv6_probe_check{check="<name>"} 1 when the check passed, 0 when it failed,
      # and shc_ipv6_probe_run_timestamp_seconds, the time the run finished.
      PREF64="__PREF64__"
      RESOLVERS="__RESOLVERS__"
      IPV4_ONLY_NAME="__IPV4_ONLY_NAME__"
      IPV4_LITERAL="__IPV4_LITERAL__"
      IPV6_NAME="__IPV6_NAME__"
      IPV6_PING_TARGET="__IPV6_PING_TARGET__"
      DENIED_IPV4="__DENIED_IPV4__"
      DIR=/var/lib/shc-ipv6-probe

      # address: a global IPv6 address on the NIC (not unique local, past duplicate address detection)
      check_address() {
        ip -6 -o addr show scope global -tentative | awk '{print $4}' | grep -Eqv '^f[cd]'
      }

      # resolver: every resolver answers an A query
      check_resolver() {
        local r n=0
        for r in ${RESOLVERS//,/ }; do
          n=$((n + 1))
          dig +short +time=2 +tries=2 A ipv4only.arpa "@$r" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || return 1
        done
        [ "$n" -gt 0 ]
      }

      # pref64: the synthesized AAAA of ipv4only.arpa lies inside the translation prefix (its first 96 bits)
      check_pref64() {
        local a
        a=$(dig +short +time=2 +tries=2 AAAA ipv4only.arpa | grep ':' | head -n 1)
        [ -n "$a" ] || return 1
        python3 -c 'import ipaddress, sys; sys.exit(0 if ipaddress.ip_address(sys.argv[1]) in ipaddress.ip_network(sys.argv[2], strict=False) else 1)' "$a" "$PREF64"
      }

      # name4: an IPv4-only name by name over IPv6 (the resolver synthesizes its address, the translator carries it)
      check_name4() {
        curl -6 -s -o /dev/null --max-time 10 "https://$IPV4_ONLY_NAME/"
      }

      # literal4: an IPv4 literal through the CLAT; any HTTP status counts
      check_literal4() {
        local code
        code=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$IPV4_LITERAL/")
        [ -n "$code" ] && [ "$code" != "000" ]
      }

      # name6: a native IPv6 name
      check_name6() {
        curl -6 -s -o /dev/null --max-time 10 "https://$IPV6_NAME/"
      }

      # mtu: 1400 bytes on the wire with "don't fragment" (1352 bytes of payload + 8 ICMPv6 + 40 IPv6)
      check_mtu() {
        ping -6 -M do -c 2 -W 3 -s 1352 "$IPV6_PING_TARGET"
      }

      # deny: a denied IPv4 destination embedded in the translation prefix stays refused (the check passes when the
      # connection fails)
      check_deny() {
        local t
        t=$(python3 -c 'import ipaddress, sys; n = ipaddress.ip_network(sys.argv[1], strict=False); print(ipaddress.IPv6Address(int(n.network_address) | int(ipaddress.IPv4Address(sys.argv[2]))))' "$PREF64" "$DENIED_IPV4") || return 1
        ! curl -6 -s -o /dev/null --max-time 5 "http://[$t]/"
      }

      # the resolver the guest's stub resolver uses at the end of the run (systemd-resolved's current server, else the
      # first nameserver of /etc/resolv.conf), labelled translation="1" when it is one of RESOLVERS: an information
      # metric, not a check, that tells why pref64 and name4 fail when the guest left the translation resolvers
      resolver_info() {
        local s r t=0
        s=$(resolvectl status 2>/dev/null | sed -n 's/^ *Current DNS Server: *//p' | head -n 1)
        [ -n "$s" ] || s=$(awk '$1 == "nameserver" {print $2; exit}' /etc/resolv.conf 2>/dev/null)
        s=${s%%[%#]*}
        s=${s//[^0-9A-Fa-f:.]/}
        for r in ${RESOLVERS//,/ }; do
          [ "${r,,}" = "${s,,}" ] && t=1
        done
        echo "# HELP shc_ipv6_probe_resolver_info The resolver the guest used at the end of the last run; translation 1 when it is a translation resolver"
        echo "# TYPE shc_ipv6_probe_resolver_info gauge"
        echo "shc_ipv6_probe_resolver_info{server=\"$s\",translation=\"$t\"} 1"
      }

      result() {
        local name=$1
        shift
        if "$@" >/dev/null 2>&1; then
          echo "shc_ipv6_probe_check{check=\"$name\"} 1"
        else
          echo "shc_ipv6_probe_check{check=\"$name\"} 0"
        fi
      }

      main() {
        local tmp
        mkdir -p "$DIR" && chmod 0755 "$DIR" || exit 1
        tmp=$(mktemp "$DIR/.metrics.XXXXXX") || exit 1
        {
          echo "# HELP shc_ipv6_probe_check 1 when the check passed in the last run, 0 when it failed"
          echo "# TYPE shc_ipv6_probe_check gauge"
          result address check_address
          result resolver check_resolver
          result pref64 check_pref64
          result name4 check_name4
          result literal4 check_literal4
          result name6 check_name6
          result mtu check_mtu
          result deny check_deny
          resolver_info
          echo "# HELP shc_ipv6_probe_run_timestamp_seconds When the last run finished, in seconds since the epoch"
          echo "# TYPE shc_ipv6_probe_run_timestamp_seconds gauge"
          echo "shc_ipv6_probe_run_timestamp_seconds $(date +%s)"
        } > "$tmp"
        chmod 0644 "$tmp"
        mv -f "$tmp" "$DIR/metrics"
      }

      main "$@"
  - path: /etc/systemd/system/shc-ipv6-probe.service
    permissions: "0644"
    content: |
      [Unit]
      Description=IPv6 translation probe: run the checks once
      Wants=network-online.target
      After=network-online.target clatd.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/shc-ipv6-probe
  - path: /etc/systemd/system/shc-ipv6-probe.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=IPv6 translation probe: run the checks every minute

      [Timer]
      OnBootSec=30s
      OnUnitActiveSec=60s
      AccuracySec=1s

      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/system/shc-ipv6-probe-http.service
    permissions: "0644"
    content: |
      [Unit]
      Description=IPv6 translation probe: serve the last results at /metrics
      Wants=network-online.target
      After=network-online.target

      [Service]
      ExecStartPre=+/usr/bin/install -d -m 0755 /var/lib/shc-ipv6-probe
      ExecStart=/usr/bin/python3 -m http.server __PORT__ --bind :: --directory /var/lib/shc-ipv6-probe
      User=nobody
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  # only the network data's resolvers on the NIC: the resolvers the network hands out by DHCP (on an OpenShift
  # Virtualization site, the cluster's DNS service, without DNS64) are ignored, so they never take over after a brief
  # outage of the translation resolvers
  - path: /usr/local/sbin/ignore-auto-dns
    permissions: "0755"
    content: |
      #!/bin/bash
      # Use only the resolvers of the guest's own network configuration (the cloud-init network data) on the NIC with the
      # IPv6 default route: resolvers the network hands out (DHCP, router advertisements) are ignored, so a resolver the
      # configuration does not name never takes over. NetworkManager or systemd-networkd; runs at every boot.
      FAMILIES="ipv6 ipv4"
      dev=""
      for _ in $(seq 1 60); do
        dev=$(ip -6 route show default | awk '{for (i = 1; i < NF; i++) if ($i == "dev") {print $(i + 1); exit}}')
        [ -n "$dev" ] && break
        sleep 2
      done
      [ -n "$dev" ] || { echo "no IPv6 default route: nothing changed"; exit 0; }
      if command -v nmcli >/dev/null && [ "$(nmcli -g RUNNING general 2>/dev/null)" = running ]; then
        con=$(nmcli -g GENERAL.CON-UUID device show "$dev")
        [ -n "$con" ] || { echo "$dev: no NetworkManager connection: nothing changed"; exit 0; }
        # only a connection with resolvers of its own, so the guest is never left without one
        [ -n "$(nmcli -g ipv4.dns,ipv6.dns connection show "$con" | tr -d '[:space:]')" ] || { echo "$dev: no resolvers configured: nothing changed"; exit 0; }
        set --
        for f in $FAMILIES; do
          [ "$(nmcli -g "$f.ignore-auto-dns" connection show "$con")" = yes ] || set -- "$@" "$f.ignore-auto-dns" yes
        done
        [ $# -gt 0 ] || { echo "$dev: already ignores the resolvers handed out"; exit 0; }
        nmcli connection modify "$con" "$@" || exit 1
        # a full reactivation, not "nmcli device reapply": before NetworkManager 1.58 a reapply keeps the DNS of a running
        # DHCPv6 lease
        nmcli connection up "$con" || exit 1
        echo "$dev: ignores the resolvers handed out from now on"
      elif command -v networkctl >/dev/null && networkctl status "$dev" >/dev/null 2>&1; then
        file=$(networkctl status "$dev" | sed -n 's/^ *Network File: *//p' | head -n 1)
        if [ -z "$file" ] || ! grep -q '^DNS=' "$file"; then echo "$dev: no resolvers configured: nothing changed"; exit 0; fi
        dir="/etc/systemd/network/$(basename "$file").d"
        want=$(printf '[DHCPv6]\nUseDNS=false\n\n[IPv6AcceptRA]\nUseDNS=false\n'
          case " $FAMILIES " in *" ipv4 "*) printf '\n[DHCPv4]\nUseDNS=false\n' ;; esac)
        [ "$(cat "$dir/90-ignore-auto-dns.conf" 2>/dev/null)" != "$want" ] || { echo "$dev: already ignores the resolvers handed out"; exit 0; }
        mkdir -p "$dir" && printf '%s\n' "$want" > "$dir/90-ignore-auto-dns.conf" || exit 1
        networkctl reload && networkctl reconfigure "$dev" || exit 1
        echo "$dev: ignores the resolvers handed out from now on"
      else
        echo "$dev: managed by neither NetworkManager nor systemd-networkd: nothing changed"
      fi
      command -v resolvectl >/dev/null && resolvectl dns "$dev"
      exit 0
  - path: /etc/systemd/system/ignore-auto-dns.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Use only the configured resolvers on the NIC with the default route
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/ignore-auto-dns
      StandardOutput=journal+console

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, ignore-auto-dns.service]
  - [systemctl, start, qemu-guest-agent.service]
  - [systemctl, enable, --now, clatd.service]
  - [systemctl, enable, --now, shc-ipv6-probe-http.service]
  - [systemctl, enable, --now, shc-ipv6-probe.timer]
