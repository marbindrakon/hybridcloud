---
# The installer finds the cluster's external network by name (install-config platform.openstack.externalNetwork takes
# a name only, and the installer fails when the project sees two networks of that name, or takes the only one it
# sees). Before anything is created (Review R2 M3, DESIGN cnet §10 R2): the networks of that name, listed with the
# environment's own credential (the installer's: oso/projects/<environment>/clouds-config, scoped to the
# environment's project), so that Neutron itself decides what the project sees (shc_openstack.py network-name-check),
# must be exactly the chosen one, and it must be external for the project. The site account only lends the site's CA
# bundle. Inputs: pnn_name, pnn_id (the placed network, or the global external network in effect), pnn_hybrid (true:
# a placed network, whose policy for the project may still be on its way), pnn_credential (the Vault path of the
# environment's credential). Uses cb_oso_project_id, cb_fip_account, cb_app_name. Sets pnn_reason / pnn_message
# ("" = the name leads to the network alone) and stops through preflight_stop.yml: refuses NetworkNameNotUnique (another network of the name is
# visible: the tenant renames or removes its own, or the platform team the share), waits WaitingForPlacement (a placed
# network not visible or not external for the project yet), or refuses ExternalNetworkNotListed (a global external
# network the project does not see as external).
- name: Require the environment's credential
  ansible.builtin.assert:
    that: (pnn_credential | default('', true)) | length > 0
    fail_msg: >-
      PlatformOpenshift {{ ansible_operator_meta.name }}: the Vault path of the environment's credential (pnn_credential)
      is not set.

# the accounts' clouds.yaml files in /tmp go whatever happens (Review R2 L11)
- name: The networks of that name the environment's project sees
  block:
    - name: Load the site account (for the site's CA bundle)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
      vars:
        os_account_vault_path: "{{ cb_fip_account }}"
        os_account_tag: "po-netname-{{ cb_app_name }}"

    - name: Keep the site's CA bundle
      ansible.builtin.set_fact:
        pnn_site_cacert: "{{ os_account_cacert | default('', true) }}"

    - name: Load the environment's credential (the one the installer runs with)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
      vars:
        os_account_vault_path: "{{ pnn_credential }}"
        os_account_tag: "po-netname-env-{{ cb_app_name }}"

    - name: The site's CA bundle unless the credential brings its own
      ansible.builtin.set_fact:
        os_account_cacert: "{{ os_account_cacert | default('', true) or pnn_site_cacert }}"

    - name: List them as the environment's project
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        os_call_no_log: false
        os_request:
          action: network-name-check
          project_id: "{{ cb_oso_project_id }}"
          name: "{{ pnn_name }}"
          network_id: "{{ pnn_id }}"
  always:
    - name: Remove the accounts' temp files
      ansible.builtin.file:
        path: "/tmp/eda-{{ item[0] }}-{{ cb_app_name }}-{{ item[1] }}"
        state: absent
      loop: "{{ ['po-netname', 'po-netname-env'] | product(['clouds.yaml', 'ca.crt']) | list }}"

- name: Judge the answer
  vars:
    _visible: "{{ os_result.visible | default([], true) }}"
    _others: "{{ _visible | rejectattr('id', 'equalto', pnn_id) | list }}"
    _usable: "{{ (os_result.unique | default(false) | bool) and (os_result.external | default(false) | bool) }}"
    _named: >-
      {%- set out = [] -%}
      {%- for v in _visible -%}
        {%- set _ = out.append(v.id ~ (', your own' if (v.project_id | default('')) == cb_oso_project_id else '')) -%}
      {%- endfor -%}
      {{ out | join('; ') }}
  ansible.builtin.set_fact:
    pnn_reason: >-
      {{ '' if _usable | bool
         else ('NetworkNameNotUnique' if _others | length > 0
               else ('WaitingForPlacement' if pnn_hybrid | bool else 'ExternalNetworkNotListed')) }}
    pnn_message: >-
      {{ '' if _usable | bool
         else ('PlatformOpenshift ' ~ ansible_operator_meta.name ~ ': '
               ~ (('the environment sees ' ~ (_visible | length) ~ ' network(s) named ' ~ pnn_name ~ ' (' ~ _named
                   ~ ') and the installer takes the network by name; rename or remove the other network of that name, '
                   ~ 'or ask the platform team about a network shared with the environment') if _others | length > 0
                  else ('the environment does not see network ' ~ pnn_name ~ ' (' ~ pnn_id ~ ')'
                        ~ (' as an external network' if _visible | length > 0 else '')
                        ~ (' yet' if pnn_hybrid | bool else '')))) }}

- name: Refuse or wait when the name does not lead to the network alone
  ansible.builtin.include_tasks: preflight_stop.yml
  vars:
    ps_reason: "{{ pnn_reason | trim }}"
    ps_message: "{{ pnn_message | trim }}"
  when: pnn_reason | trim | length > 0
