---
keycloak_central_url: ""
keycloak_services_url: ""
keycloak_central_realm: "sovereign-central"
keycloak_services_realm: "sovereign-tenants"
keycloak_central_admin_user: "admin"
keycloak_central_admin_password: ""
keycloak_services_admin_user: "admin"
keycloak_services_admin_password: ""

# Persistent test users. The acme-corp ones are members of the demo tenant's access groups
# (bootstrap/ansible/project/files/demo/acme-corp.yaml): a group that starts with "/" is a Keycloak group path
# /<tenant>/<access group> (created when missing; the access group job adopts it), so each user signs in to the
# services cluster with the group <tenant>.<access group>. Other names are top-level groups (sovereign-admin).
# shc: passwords live in central Vault (keycloak_test_users_vault_path), one random per user.
keycloak_test_users_vault_path: "keycloak-test-users"
keycloak_test_users:
  - realm: "sovereign-central"
    keycloak_url_key: central
    username: "sovereign-test-admin"
    email: "sovereign-test-admin@example.com"
    firstName: "Test"
    lastName: "Admin"
    groups:
      - "sovereign-admin"
  - realm: "sovereign-tenants"
    keycloak_url_key: services
    username: "acme-platform-eng-admin"
    email: "acme-platform-eng-admin@example.com"
    firstName: "Acme"
    lastName: "PlatformEngAdmin"
    groups:
      - "/acme-corp/platform-admins"

  - realm: "sovereign-tenants"
    keycloak_url_key: services
    username: "acme-platform-eng-editor"
    email: "acme-platform-eng-editor@example.com"
    firstName: "Acme"
    lastName: "PlatformEngEditor"
    groups:
      - "/acme-corp/editors"

  - realm: "sovereign-tenants"
    keycloak_url_key: services
    username: "acme-platform-eng-viewer"
    email: "acme-platform-eng-viewer@example.com"
