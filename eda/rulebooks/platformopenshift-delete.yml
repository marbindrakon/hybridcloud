---
- name: PlatformOpenshift Delete Rulebook
  hosts: all
  # run_job_template waits for its job (a teardown takes minutes): run the actions in parallel so one cluster's
  # teardown doesn't hold the next cluster's event; the operator publishes a delete event once per deletion.
  execution_strategy: parallel
  sources:
    - ansible.eda.kafka:
        host: "{{ KAFKA_HOST }}"
        port: "{{ KAFKA_PORT }}"
        topic: hybridsovereign-events
        group_id: eda-platformopenshift-delete
        security_protocol: SASL_SSL
        sasl_mechanism: SCRAM-SHA-512
        sasl_plain_username: "{{ KAFKA_USERNAME }}"
        sasl_plain_password: "{{ KAFKA_PASSWORD }}"
        check_hostname: true
        verify_mode: CERT_REQUIRED
  rules:
    - name: Handle PlatformOpenshift Delete
      condition: event.body.payload.reason in ["PlatformOpenshiftDeleteRequested"] and event.body.payload.regarding.kind == "PlatformOpenshift"
      action:
        run_job_template:
          name: platformopenshift-teardown
          organization: sovereign
          job_args:
            extra_vars:
              event_payload: "{{ event.body.payload }}"
