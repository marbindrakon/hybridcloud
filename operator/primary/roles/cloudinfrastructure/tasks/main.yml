---
# shc (design/P7-PLAN.md P7.1): CloudInfrastructure, a platform-owned cloud site. The EDA job
# (cloudinfrastructure-provision) probes the site and records status.capabilities; nothing is created on
# the site except the tenant domain grants (see the EDA role).
- block:
    # Pull only leaf fields: never dump metadata/status dicts into Jinja (see the CloudOSO role).
    - name: Set CloudInfrastructure CR facts
      ansible.builtin.set_fact:
        cloudinfrastructure_spec: "{{ _hybridsovereign_redhat_cloudinfrastructure.spec | default({}) }}"
        cloudinfrastructure_generation: "{{ _hybridsovereign_redhat_cloudinfrastructure.metadata.generation | default(0) | int }}"
        cloudinfrastructure_observed_generation: "{{ _hybridsovereign_redhat_cloudinfrastructure.status.observedGeneration | default(0) | int }}"
        cloudinfrastructure_status: "{{ _hybridsovereign_redhat_cloudinfrastructure.status.status | default('') | string }}"
        cloudinfrastructure_ready: "{{ _hybridsovereign_redhat_cloudinfrastructure.status.ready | default(false) | bool }}"
        cloudinfrastructure_last_reconciled: "{{ _hybridsovereign_redhat_cloudinfrastructure.status.lastReconciledAt | default('') | string }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_cloudinfrastructure }}"

    - name: Age of the last probe
      ansible.builtin.set_fact:
        cloudinfrastructure_probe_age: >-
          {{
            ((now(utc=True) - (cloudinfrastructure_last_reconciled[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() | int)
            if cloudinfrastructure_last_reconciled | length >= 19 else 999999999
          }}

    - name: Set event action and reason
      ansible.builtin.set_fact:
        cloudinfrastructure_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        cloudinfrastructure_event_reason: >-
          {{ 'CloudInfrastructureReconcileRequested' if reconcile_now | bool else 'CloudInfrastructureCreateRequested' }}
        cloudinfrastructure_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (cloudinfrastructure_observed_generation | int >= cloudinfrastructure_generation | int)
            and (cloudinfrastructure_status == 'ready')
            and (cloudinfrastructure_ready | bool)
            and (cloudinfrastructure_probe_age | int < cloudinfrastructure_reprobe_seconds | int)
          }}

    - name: Skip when already processed and the last probe is recent
      ansible.builtin.meta: end_host
      when: cloudinfrastructure_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: CloudInfrastructure
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        cloudinfrastructure_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # A periodic re-probe of a Ready site keeps ready/conditions/capabilities as they are until the job
    # reports: consumers keep working while the site is being re-checked.
    - name: Mark CloudInfrastructure as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudInfrastructure
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          lastReconciledAt: "{{ cloudinfrastructure_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ cloudinfrastructure_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to probe the site
      when: not (cloudinfrastructure_ready | bool) or cloudinfrastructure_observed_generation | int < cloudinfrastructure_generation | int

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ cloudinfrastructure_event_reason | trim }}"
        operator_event_action: "{{ cloudinfrastructure_event_action }}"
        operator_event_note: "{{ cloudinfrastructure_spec | to_json }}"
        operator_reporting_controller: cloudinfrastructure-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: CloudInfrastructure
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_cloudinfrastructure.metadata.uid }}"

  rescue:
    - name: Truncate failure message
      ansible.builtin.set_fact:
        cloudinfrastructure_failure_message: >-
          {{
            (ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) | string)
            | truncate(500, True, '…')
          }}

    - name: Mark CloudInfrastructure as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudInfrastructure
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ cloudinfrastructure_failure_message }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ cloudinfrastructure_failure_message }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "CloudInfrastructure {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
