apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridnetworks.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "4"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridNetwork
    listKind: HybridNetworkList
    plural: hybridnetworks
    singular: hybridnetwork
    shortNames:
      - hnet
    categories:
      - shc
      - shc-tenant
      - shc-network
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A network (hybrid network): the tenant's routed private network across sites, comparable
            to an Amazon VPC, a Google Cloud VPC network, an Azure virtual network or a Neutron
            network with its router. It is one isolated routing domain (VRF) on the platform's
            HybridFabric. NetworkPlacements put it on environments (CloudOSO, CloudVirt, CloudAWS,
            CloudGCP); every placement's subnets can reach every other placement's subnets of the
            same network, and nothing else. The network's address space is the tenant's own prefixes
            (spec.prefixes), IPv6 space the platform assigns (spec.platformPrefixes), or both; the
            platform allocates each placement's subnets from it. Networks may use the same addresses
            as other networks.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                description:
                  description: What this object is for, in a few words.
                  type: string
                  maxLength: 512
                fabricRef:
                  type: object
                  description: >-
                    The HybridFabric (platform namespace) the network uses. Default: the platform's only fabric.
                    Immutable once set.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.fabricRef is immutable
                  properties:
                    name:
                      description: Name of the referenced object.
                      type: string
                      minLength: 1
                      maxLength: 253
                mtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    MTU of the network as its workloads see it. Default and maximum: the fabric's overlayMtu. A site
                    whose networks cannot reach it gets that site's maximum instead (shown on the placement).
                networkViewerRbac:
                  type: array
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can view this network
                    and its placements.
                  items:
                    type: string
                egress:
                  type: object
                  description: Traffic from the network to destinations outside it.
                  properties:
                    internet:
                      type: boolean
                      default: false
                      description: >-
                        Outbound internet access through the platform: the platform advertises a default route into
                        the network. IPv4 leaves through source address translation to platform source addresses
                        (status.egress.sourceAddresses). IPv6 leaves unchanged from addresses the platform assigned
                        (platformPrefixes), through a filter that admits only replies to connections opened from
                        inside. IPv6 from the tenant's own prefixes has no internet access in either direction. A
                        network without IPv4 reaches IPv4-only destinations by translation where the platform offers
                        it. The platform's private address ranges are not reachable this way. Leave it off when the
                        network's default route comes from your own edge router. Can be changed at any time.
                prefixes:
                  type: array
                  description: >-
                    The tenant's own address space, IPv4 and IPv6 prefixes the platform allocates the placements'
                    subnets from (NetworkPlacement spec.ipv4 and spec.ipv6). May be empty when platformPrefixes
                    gives the network its address space. Prefixes are in canonical form (host bits zero, e.g.
                    10.60.0.0/16 or fd12:3456:789a::/48) and must not overlap each other. An IPv6 prefix is global
                    unicast (2000::/3) or unique local (fc00::/7) space the tenant holds; the platform carries it
                    between the network's placements but offers no internet access to or from it. IPv6 prefixes
                    here and an IPv6 entry in platformPrefixes exclude each other. The platform's own ranges inside
                    a prefix are never allocated; a prefix wholly inside one, or overlapping address space the
                    platform keeps for itself, is refused.
                    Prefixes can be added at any time; a change that would leave a placement's subnet outside the
                    space is refused, as is a prefix holding a route an AttachmentCircuit of the network accepts
                    from its CE, and a change of the network's IPv6 source while it has placements.
                  maxItems: 8
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(a, self.all(b, a == b || !isCIDR(a) || !isCIDR(b)
                        || cidr(a).ip().family() != cidr(b).ip().family()
                        || !(cidr(a).containsCIDR(cidr(b)) || cidr(b).containsCIDR(cidr(a)))))
                      message: prefixes must not overlap
                  items:
                    type: string
                    maxLength: 43
                    x-kubernetes-validations:
                      - rule: isCIDR(self) && string(cidr(self).masked()) == self
                        message: each prefix must be a network prefix in canonical form (host bits zero, e.g. 10.60.0.0/16)
                      - rule: >-
                          !isCIDR(self) || (cidr(self).ip().family() == 4
                          ? cidr(self).prefixLength() >= 8 && cidr(self).prefixLength() <= 29
                          : cidr(self).prefixLength() >= 32 && cidr(self).prefixLength() <= 64)
                        message: prefix length must be /8 to /29 for IPv4 and /32 to /64 for IPv6
                      - rule: >-
                          !isCIDR(self) || cidr(self).ip().family() == 4
                          || cidr('2000::/3').containsCIDR(cidr(self)) || cidr('fc00::/7').containsCIDR(cidr(self))
                        message: an IPv6 prefix must be global unicast (2000::/3) or unique local (fc00::/7)
                platformPrefixes:
                  type: array
                  description: >-
                    Address space the platform assigns to the network from its own globally routed space, one
                    entry per address family (IPv6 only). The platform allocates a block of the requested size, or
                    the pinned block, and the placements' subnets of that family from it; status.addressSpace
                    shows the block. Traffic from these addresses can reach the internet when egress.internet is
                    on. An entry cannot be changed; it can be removed while no placement holds a subnet in its
                    block, and the family's source cannot change while the network has placements.
                  maxItems: 2
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [family]
                  items:
                    type: object
                    required: [family]
                    x-kubernetes-validations:
                      - rule: self == oldSelf
                        message: a platformPrefixes entry cannot be changed; remove it and add another
                      - rule: >-
                          !has(self.prefix) || !has(self.prefixLength) || !isCIDR(self.prefix)
                          || cidr(self.prefix).prefixLength() == self.prefixLength
                        message: platformPrefixes prefix must be as long as prefixLength
                    properties:
                      family:
                        description: Address family of the block, 6.
                        type: integer
                        enum: [6]
                      prefixLength:
                        description: >-
                          Size of the block, 48 to 64 in steps of 4 (for example 56 for a /56). The platform offers
                          some of these sizes; when omitted, the platform's default size applies. status.addressSpace
                          reports the block it assigned.
                        type: integer
                        minimum: 48
                        maximum: 64
                        x-kubernetes-validations:
                          - rule: self % 4 == 0
                            message: platformPrefixes prefixLength must be a multiple of 4
                      prefix:
                        description: >-
                          A specific free block of the platform's space, in canonical form (host bits zero). Optional;
                          a block outside the platform's space is refused, and one in use waits until it is free.
                        type: string
                        maxLength: 43
                        x-kubernetes-validations:
                          - rule: isCIDR(self) && cidr(self).ip().family() == 6 && string(cidr(self).masked()) == self
                            message: platformPrefixes prefix must be an IPv6 network prefix in canonical form (host bits zero)
                          - rule: >-
                              !isCIDR(self) || (cidr(self).prefixLength() >= 48 && cidr(self).prefixLength() <= 64
                              && cidr(self).prefixLength() % 4 == 0)
                            message: platformPrefixes prefix must be /48 to /64 in steps of 4
              x-kubernetes-validations:
                - rule: has(self.fabricRef) || !has(oldSelf.fabricRef)
                  message: spec.fabricRef cannot be removed
                - rule: >-
                    (has(self.prefixes) && size(self.prefixes) > 0)
                    || (has(self.platformPrefixes) && size(self.platformPrefixes) > 0)
                  message: the network needs address space (prefixes, platformPrefixes or both)
                - rule: >-
                    !has(self.platformPrefixes) || !self.platformPrefixes.exists(q, q.family == 6)
                    || !has(self.prefixes) || !self.prefixes.exists(p, isCIDR(p) && cidr(p).ip().family() == 6)
                  message: IPv6 address space comes either from prefixes or from platformPrefixes, not both
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                entity:
                  type: string
                fabric:
                  type: string
                  description: The HybridFabric in use.
                realization:
                  type: object
                  description: How the platform realized the network (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                egress:
                  type: object
                  description: State of the network's egress.
                  properties:
                    internet:
                      type: string
                      description: >-
                        Internet egress of the network: pending (being added), ready, removing, or unavailable. For a
                        network with IPv4 address space it is the state of its IPv4 egress; for a network without IPv4
                        the state of its IPv6 egress. families gives the state and the reason per family.
                    sourceAddresses:
                      type: array
                      description: The IPv4 source addresses the network's internet traffic leaves with.
                      items:
                        type: string
                    families:
                      type: array
                      description: Internet egress per address family.
                      items:
                        type: object
                        properties:
                          family:
                            type: integer
                            description: 4 or 6.
                          state:
                            type: string
                            description: ready, pending, removing or unavailable.
                          mode:
                            type: string
                            description: >-
                              How the family leaves: SourceNAT (translated to platform source addresses) or Routed
                              (unchanged, through a filter that admits only replies).
                          reason:
                            type: string
                            description: >-
                              One-word reason, for example AddressChoice (tenant-provided IPv6 has no internet
                              access), NotOffered (the platform offers none for the family) or Degraded.
                          message:
                            type: string
                            description: What the reason means for this network, in plain words.
                    ipv4Translation:
                      type: object
                      description: >-
                        For a network without IPv4: whether its IPv6 workloads reach IPv4-only destinations by
                        translation.
                      properties:
                        state:
                          type: string
                          description: ready, pending or unavailable.
                        reason:
                          type: string
                          description: One-word reason when not ready.
                        message:
                          type: string
                          description: What the reason means for this network, in plain words.
                ipv6:
                  type: object
                  description: The network's IPv6 as the platform derived it from the spec.
                  properties:
                    mode:
                      type: string
                      description: >-
                        Where the network's IPv6 comes from: Tenant (IPv6 prefixes in spec.prefixes), Platform
                        (spec.platformPrefixes) or None. It is the mode in effect: a refused change of the mode
                        leaves it as it was.
                    prefixes:
                      type: array
                      description: The network's IPv6 address space in effect (the tenant's prefixes or the assigned block).
                      items:
                        type: string
                    block:
                      type: object
                      description: The block the platform assigned to the network (mode Platform).
                      properties:
                        prefix:
                          type: string
                          description: The block.
                        prefixLength:
                          type: integer
                          description: Its length.
                        source:
                          type: string
                          description: >-
                            Pinned (the block named in spec.platformPrefixes) or Allocated (the first free block of
                            the requested size).
                    holdDownUntil:
                      type: string
                      description: >-
                        While the network waits for a block that was released recently: when that block can be
                        assigned again (RFC 3339). Released blocks are held back for a while before another network
                        gets them.
                mtu:
                  type: integer
                  description: Effective MTU.
                placementCount:
                  type: integer
                placementsReady:
                  type: integer
                addressSpace:
                  type: array
                  description: >-
                    The network's address space as the platform holds it, per prefix: its family, how many
                    placement subnets it holds, and the largest block still free.
                  items:
                    type: object
                    properties:
                      prefix:
                        type: string
                      family:
                        type: integer
                        description: 4 or 6.
                      source:
                        type: string
                        description: >-
                          Tenant (from spec.prefixes) or Platform (a block assigned from spec.platformPrefixes).
                          Absent means Tenant.
                      allocations:
                        type: integer
                        description: Placement subnets inside the prefix.
                      largestFree:
                        type: integer
                        description: >-
                          Prefix length of the largest free block (the platform's ranges are not free, a site's own
                          ranges are not counted); absent when the prefix is full.
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending network waits for.
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fabric
          type: string
          jsonPath: .status.fabric
        - name: MTU
          type: integer
          jsonPath: .status.mtu
        - name: Placements
          type: integer
          jsonPath: .status.placementCount
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
