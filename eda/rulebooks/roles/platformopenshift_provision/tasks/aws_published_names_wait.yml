---
# One part (about five minutes) of the wait for the cluster's published names (Internal), with the check time written
# first; aws_clusterbuild_postinstall.yml repeats it until the names are published or the parts run out.
- name: Write the check time
  ansible.builtin.include_tasks: install_check_time.yml

- name: The cluster's published names (Internal)
  ansible.builtin.async_status:
    jid: "{{ cb_dns_alias_job.ansible_job_id }}"
  register: _cb_dns_alias
  until: _cb_dns_alias.finished
  retries: 9
  delay: 30
  failed_when: false
