apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aaporgs.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "5"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: AAPOrg
    listKind: AAPOrgList
    plural: aaporgs
    singular: aaporg
    shortNames:
      - aaporg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AAP Config
          type: string
          jsonPath: .spec.aapConfig
        - name: Org ID
          type: string
          jsonPath: .status.orgId
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            An AAP organization: the tenant's organization in the platform's Ansible Automation
            Platform, with access for the tenant's access groups. Members sign in with their
            platform identity.
          type: object
          properties:
            spec:
              description: The organization and who gets which access.
              type: object
              properties:
                aapConfig:
                  type: string
                  description: >-
                    Optional. The automation connection (an AAPConfig in the platform's
                    integration namespace) this organization is created through. When omitted
                    the platform uses its default connection; the one used is reported in
                    status.config.
                aapAdminRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members are admins of the
                    organization.
                aapJobExecutorRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can run the
                    organization's job templates.
                aapViewerRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can read the
                    organization (jobs, inventories, templates).
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
                orgId:
                  type: string
                  description: AAP organization ID (controller-side).
                orgName:
                  type: string
                  description: AAP organization name.
                aapControllerUrl:
                  type: string
                  description: External AAP controller URL.
                loginUrl:
                  type: string
                  description: OIDC login URL for accessing this org.
                adminGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to organization admin.
                executorGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to running job templates.
                viewerGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to read-only access.
                authMethodId:
                  type: string
                  description: Reference to the AAP authenticator.
                teamMappings:
                  type: string
                  description: JSON summary of team/role mappings.
                entity:
                  type: string
                  description: The tenant this organization belongs to.
                message:
                  type: string
                  description: Human-readable status message.
              x-kubernetes-preserve-unknown-fields: true
