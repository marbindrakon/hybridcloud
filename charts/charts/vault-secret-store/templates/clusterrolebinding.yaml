{{- if eq .Values.auth.type "kubernetes" }}
---
# system:auth-delegator allows the ESO SA to perform TokenReview API calls,
# which Vault uses to validate Kubernetes service account tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.auth.serviceAccountName }}-vault-auth-delegator
  labels:
    app.kubernetes.io/name: vault-secret-store
    app.kubernetes.io/component: external-secrets-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.auth.serviceAccountName }}
    namespace: {{ .Values.auth.serviceAccountNamespace }}
{{- end }}
