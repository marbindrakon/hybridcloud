{{- if and .Values.keycloak.enabled .Values.keycloak.db.enabled .Values.keycloak.db.crunchy.enabled }}
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.keycloak.db.crunchy.name | default "rhbk-pgcluster" }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  postgresVersion: 16
  {{- if .Values.keycloak.db.crunchy.patroniFailsafe }}
  # The primary stays primary while it cannot reach the Kubernetes API but every other member still answers it.
  patroni:
    dynamicConfiguration:
      failsafe_mode: true
  {{- end }}
  instances:
    - name: pgha
      replicas: {{ .Values.keycloak.db.crunchy.instances | default 2 }}
      # One replica per node, so one node going down never takes every copy of the database with it.
      # With a single schedulable node the skew is always 0 and all replicas still start there.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ .Values.keycloak.db.crunchy.name | default "rhbk-pgcluster" }}
              postgres-operator.crunchydata.com/instance-set: pgha
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.keycloak.db.crunchy.storage | default "10Gi" }}
  backups:
    pgbackrest:
      # Backups run on a schedule and old ones expire. Without a schedule the repository keeps every write-ahead
      # log since the first backup, fills, and the database stops when it can no longer archive.
      global:
        repo1-retention-full: {{ ((.Values.keycloak.db.crunchy.backup).retentionFull | default 2) | quote }}
        repo1-retention-full-type: count
        repo1-retention-diff: {{ ((.Values.keycloak.db.crunchy.backup).retentionDifferential | default 2) | quote }}
        {{- /* The waiting archive: past this size the segments that wait in the data volume are dropped (and
             reported in the database's log) instead of filling the volume; the database then cannot be restored to a
             moment after the drop until the next backup. Default a quarter of the data volume; empty: no limit. */}}
        {{- $arc := (.Values.keycloak.db.crunchy.backup) | default dict }}
        {{- $qmax := "auto" }}
        {{- if and (hasKey $arc "archivePushQueueMax") (not (kindIs "invalid" $arc.archivePushQueueMax)) }}
        {{- $q := $arc.archivePushQueueMax }}
        {{- if kindIs "float64" $q }}
        {{- /* a YAML number is a number of bytes; a values file gives it as a float */}}
        {{- if or (lt $q 0.0) (ne $q (float64 (int64 $q))) }}
        {{- fail (printf "keycloak.db.crunchy.backup.archivePushQueueMax must be a whole size such as 4GiB, got the number %v" $q) }}
        {{- end }}
        {{- $qmax = printf "%d" (int64 $q) }}
        {{- else }}
        {{- $qmax = toString $q }}
        {{- end }}
        {{- end }}
        {{- if eq $qmax "auto" }}
        {{- $size := toString (.Values.keycloak.db.crunchy.storage | default "10Gi") }}
        {{- if not (regexMatch "^[0-9]+(Mi|Gi|Ti)$" $size) }}
        {{- fail (printf "keycloak.db.crunchy.backup.archivePushQueueMax must be set (a size such as 4GiB, or empty for no limit): a quarter of keycloak.db.crunchy.storage %q cannot be computed" $size) }}
        {{- end }}
        {{- $n := regexFind "^[0-9]+" $size | atoi }}
        {{- $mib := div $n 4 }}
        {{- if hasSuffix "Gi" $size }}{{ $mib = mul $n 256 }}{{ else if hasSuffix "Ti" $size }}{{ $mib = mul $n 262144 }}{{ end }}
        {{- if lt $mib 1 }}
        {{- fail (printf "keycloak.db.crunchy.backup.archivePushQueueMax must be set: keycloak.db.crunchy.storage %q is too small to take a quarter of" $size) }}
        {{- end }}
        {{- $qmax = ternary (printf "%dGiB" (div $mib 1024)) (printf "%dMiB" $mib) (eq (mod $mib 1024) 0) }}
        {{- end }}
        {{- if $qmax }}
        {{- if not (regexMatch "(?i)^[0-9]+(b|k|kb|kib|m|mb|mib|g|gb|gib|t|tb|tib|p|pb|pib)?$" $qmax) }}
        {{- fail (printf "keycloak.db.crunchy.backup.archivePushQueueMax must be a whole size such as 4GiB or 2560MiB, or empty for no limit, got %q" $qmax) }}
        {{- end }}
        {{- /* pgBackRest takes 1 byte to 4PiB; 0 would drop every segment at once (empty is how to say no limit) */}}
        {{- $digits := regexFind "^[0-9]+" $qmax }}
        {{- $unit := lower (trimPrefix $digits $qmax) | trimSuffix "ib" | trimSuffix "b" }}
        {{- $mult := get (dict "" 1 "k" 1024 "m" 1048576 "g" 1073741824 "t" 1099511627776 "p" 1125899906842624) $unit }}
        {{- if or (gt (len $digits) 16) (eq (atoi $digits) 0) (gt (atoi $digits) (div 4503599627370496 $mult)) }}
        {{- fail (printf "keycloak.db.crunchy.backup.archivePushQueueMax must be more than 0 and at most 4PiB (empty for no limit), got %q" $qmax) }}
        {{- end }}
        archive-push-queue-max: {{ $qmax | quote }}
        {{- end }}
      # A full backup on demand: annotate the PostgresCluster with postgres-operator.crunchydata.com/pgbackrest-backup
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: {{ ((.Values.keycloak.db.crunchy.backup).fullSchedule | default "20 1 * * 0") | quote }}
            {{- $backup := (.Values.keycloak.db.crunchy.backup) | default dict }}
            {{- if not (hasKey $backup "differentialSchedule") }}
            differential: "20 1 * * 1-6"
            {{- else if $backup.differentialSchedule }}
            differential: {{ $backup.differentialSchedule | quote }}
            {{- end }}
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: {{ .Values.keycloak.db.crunchy.backupStorage | default "10Gi" }}
  users:
    - name: keycloak
      databases:
        - keycloak
      options: "SUPERUSER"
{{- end }}
