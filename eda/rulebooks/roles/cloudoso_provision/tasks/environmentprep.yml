---
# shc (§11.6 phase C): environment preparation through files/shc_openstack.py with the platform's
# OpenStack account: the site's cloud admin (P7.1, CloudInfrastructure credentialsRef) or the legacy
# tenant admin (domain `manager`). Everything provision creates is recorded on the CR status so teardown
# works from ids, not from names it re-derives. shc (DESIGN cnet §4.3): the environment holds no floating IPs (each
# OpenShift cluster allocates its own) and needs no external network; a pair an older run allocated is released
# once no PlatformOpenshift names the environment. The environment holds no credential either: each OpenShift
# cluster has its own Keystone user and credential (common/tasks/openstack_cluster_credential.yml), people sign
# in with their platform identity (access.yml). An application credential an earlier release made for the
# environment (as the site account, Vault oso/projects/<name>/clouds-config) is deleted here.
# the project's name: <tenant>_<environment> from the names function. Found again by the id recorded in status after
# the first run (an environment keeps the project it was given); by name only with the platform's tag
- name: The project's name
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/names_call.yml"
  vars:
    names_request: {action: name, kind: openstack-project, parts: ["{{ entity_name }}", "{{ cloudoso_cr_name }}"]}

- name: Set environmentprep spec facts
  ansible.builtin.set_fact:
    ep_project: "{{ names_result.name }}"
    ep_project_display: "{{ names_result.display }}"
    ep_project_id: "{{ (cloudoso_cr_lookup.resources[0].status | default({}, true)).projectId | default('', true) }}"
    # shc (P7.1): from the CloudInfrastructure (cloudref.yml), or the legacy spec/defaults
    ep_vault_path: "{{ oso_settings.vaultPath }}"
    ep_base_domain: "{{ oso_settings.baseDomain }}"
    ep_project_domain: "{{ oso_settings.projectDomain }}"
    ep_region_name: "{{ oso_settings.regionName }}"
    ep_dns_provider: "{{ oso_settings.dnsProvider | trim }}"
    ep_designate_zone_id: "{{ oso_settings.designateZoneId }}"
    ep_designate_project_id: "{{ oso_settings.designateProjectId }}"
    ep_route53_vault_path: "{{ oso_settings.route53VaultPath }}"
    ep_slug: "{{ (cloudoso_cr_name | hash('sha256'))[:5] }}"
    # the legacy record: the application credential an earlier release made as the site account, and its
    # name-only Vault path (this object holds the name: name_unique.yml)
    ep_legacy_cred_id: "{{ (cloudoso_cr_lookup.resources[0].status | default({}, true)).appCredentialId | default('', true) }}"
    ep_legacy_clouds_config_vault: "oso/projects/{{ cloudoso_cr_name }}/clouds-config"

- name: Validate the CloudOSO environment settings
  ansible.builtin.assert:
    that:
      - ep_vault_path | length > 0
      - ep_project_domain | length > 0
      - ep_dns_provider in ['designate', 'route53', 'none', 'zone']
      - ep_dns_provider == 'none' or ep_base_domain | length > 0
      - ep_dns_provider != 'designate' or (ep_designate_zone_id | length > 0 and ep_designate_project_id | length > 0)
      - ep_dns_provider != 'route53' or ep_route53_vault_path | length > 0
    fail_msg: >-
      CloudOSO {{ cloudoso_cr_name }} needs an account (vaultPath), projectDomain and a DNS
      provider (designate: baseDomain + designateZoneId + designateProjectId; route53: baseDomain +
      route53VaultPath; zone: the tenant DNS domain; none), from {{ ('CloudInfrastructure ' ~ oso_cloudinfra_name) if oso_cloudinfra_name | length > 0
      else "the spec or the installation's cloudoso_defaults" }}.

- name: Derive the environment DNS domain
  ansible.builtin.set_fact:
    # Designate: <cloudoso>.<entity>.<baseDomain> inside the delegated tenant zone (entity keeps two
    # entities' same-named CloudOSOs apart); zone (design/TENANT-DNS.md): the same name as its own zone.
    # Route53 keeps upstream's <slug>.<baseDomain>. none: no domain.
    ep_cluster_domain: >-
      {{ (cloudoso_cr_name ~ '.' ~ entity_name ~ '.' ~ ep_base_domain) if ep_dns_provider in ['designate', 'zone']
         else ((ep_slug ~ '.' ~ ep_base_domain) if ep_dns_provider == 'route53' else '') }}

- name: Load the OpenStack account
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
  vars:
    os_account_vault_path: "{{ ep_vault_path }}"
    os_account_tag: "cloudoso-{{ cloudoso_cr_name }}"

# the helper returns ids only (no credential is made); the legacy application credential goes by its recorded id
# and by its name
- name: Create or reconcile the project
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
  vars:
    os_call_no_log: false
    os_call_soft: true
    os_request:
      action: provision
      domain: "{{ ep_project_domain }}"
      project: "{{ ep_project }}"
      project_id: "{{ ep_project_id }}"
      # the platform's mark: a project tag naming this environment (a project of the name without it is refused)
      owner: "CloudOSO/{{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }}"
      # refreshed on each run
      description: >-
        Environment {{ cloudoso_cr_name }} of tenant {{ entity_name }} ({{ ep_project_display }}; CloudOSO
        {{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }}). Managed by the sovereign cloud platform; do not change.
      legacy_app_cred_ids: "{{ [ep_legacy_cred_id] | select | list }}"
      legacy_app_cred_name: "sovereign-{{ ep_project }}"
      region: "{{ ep_region_name }}"
      dns_zone_id: "{{ ep_designate_zone_id if ep_dns_provider == 'designate' else '' }}"
      dns_project_id: "{{ ep_designate_project_id }}"

- name: Refuse a project of that name the platform did not make for this environment
  when: os_result.error is defined
  block:
    - name: Record the reason
      ansible.builtin.set_fact:
        cloudoso_failure_reason: "{{ os_result.reason | default('EDAFailed', true) }}"

    - name: Stop before anything else is made
      ansible.builtin.fail:
        msg: >-
          {{ os_result.message if (os_result.reason | default('', true)) == 'NameTakenOnSite'
             else 'OpenStack provision failed: ' ~ os_result.error }}

- name: Keep the provision result
  ansible.builtin.set_fact:
    ep_os: "{{ os_result }}"

# the legacy credential is gone from the site: its secret goes from Vault (only a record that names one wrote it)
- name: Delete the legacy credential's Vault path
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_delete.yml"
  vars:
    vault_kv_delete_paths: ["{{ ep_legacy_clouds_config_vault }}"]
  when: ep_legacy_cred_id | length > 0

# an older run allocated the environment's pair of floating IPs (status apiFloatingIPId / ingressFloatingIPId,
# apiVIP / ingressVIP, descriptions sovereign-<name>-api / -ingress); it goes once no cluster names the environment.
# No cluster takes it over: each cluster allocates its own.
- name: The environment's legacy floating IP pair
  vars:
    _st: "{{ cloudoso_cr_lookup.resources[0].status | default({}, true) }}"
  ansible.builtin.set_fact:
    ep_legacy_fip_ids: >-
      {{ [_st.apiFloatingIPId | default('', true), _st.ingressFloatingIPId | default('', true)] | select | list }}
    ep_legacy_fip_recorded: >-
      {{ ([_st.apiFloatingIPId | default('', true), _st.ingressFloatingIPId | default('', true),
           _st.apiVIP | default('', true), _st.ingressVIP | default('', true)] | select | list | length > 0)
         or ('externalNetwork' in _st) }}

- name: List the clusters of this namespace
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: PlatformOpenshift
    namespace: "{{ cloudoso_cr_namespace }}"
  register: ep_clusters
  when: ep_legacy_fip_recorded | bool

- name: Release the legacy pair when no cluster names the environment
  when:
    - ep_legacy_fip_recorded | bool
    - >-
      ep_clusters.resources | default([]) | selectattr('spec.type', 'defined') | selectattr('spec.type', 'equalto', 'openstack')
      | map(attribute='spec.openstack') | map('default', {}) | selectattr('environment', 'defined')
      | selectattr('environment', 'equalto', cloudoso_cr_name) | list | length == 0
  block:
    - name: Release the environment's floating IPs
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        os_call_no_log: false
        os_request:
          action: cluster-fips
          state: absent
          project_id: "{{ ep_os.project.id }}"
          ids: "{{ ep_legacy_fip_ids }}"
          descriptions:
            api: "sovereign-{{ cloudoso_cr_name }}-api"
            ingress: "sovereign-{{ cloudoso_cr_name }}-ingress"

    - name: Remove the pair from the record
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudosos
        cr_name: "{{ cloudoso_cr_name }}"
        cr_namespace: "{{ cloudoso_cr_namespace }}"
        cr_status_partial: true
        cr_status_body:
          apiVIP: null
          ingressVIP: null
          externalNetwork: null
          apiFloatingIPId: null
          ingressFloatingIPId: null

# shc (design/TENANT-DNS.md D1): the environment's own zone in the site's Designate, owned by the site's DNS
# project (the site account holds member there) and shared with this CloudOSO's project, so the tenant manages
# its recordsets with the project's credentials. Served by other nameservers than the global zone -> delegated
# from it with the DNSConfig's DNS-only account.
- name: Create the environment zone and share it with the project
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
  vars:
    os_helper: shc_dns.py
    os_call_no_log: false
    os_call_soft: true
    os_request:
      action: ensure-zone
      owner_project_id: "{{ oso_env_dns.ownerProjectId }}"
      name: "{{ ep_cluster_domain }}"
      # the recorded zone first; a zone of the name is this environment's only when it carries this description (the
      # platform's mark; Designate keeps no tags on zones). Any other is refused, never reused and shared.
      zone_id: "{{ ((cloudoso_cr_lookup.resources[0].status | default({}, true)).dns | default({}, true)).zoneId | default('', true) }}"
      email: "hostmaster@{{ ep_base_domain }}"
      description: "Environment zone of CloudOSO {{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }} (shared with its project)"
      share_with: "{{ ep_os.project.id }}"
      attributes: "{{ oso_env_dns.zoneAttributes | default({}) }}"
      region: "{{ ep_region_name }}"
  when: ep_dns_provider == 'zone'

- name: Refuse a zone or delegation of the name that is not this environment's
  ansible.builtin.include_tasks: dns_refusal.yml
  when: ep_dns_provider == 'zone'

- name: Keep the environment zone
  ansible.builtin.set_fact:
    ep_env_zone: "{{ os_result }}"
    ep_env_delegate: "{{ (os_result.nameservers | sort) != (oso_env_dns.globalNameservers | sort) }}"
  when: ep_dns_provider == 'zone'

- name: Load the DNSConfig account for the delegation
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
  vars:
    os_account_vault_path: "{{ oso_env_dns.dnsConfigSecret }}"
    os_account_tag: "cloudoso-dns-{{ cloudoso_cr_name }}"
  when: ep_dns_provider == 'zone' and ep_env_delegate | bool

- name: Delegate the environment zone from the global zone
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
  vars:
    os_helper: shc_dns.py
    os_call_no_log: false
    os_call_soft: true
    os_request:
      action: ensure-delegation
      project_id: "{{ oso_env_dns.globalProjectId }}"
      zone_id: "{{ oso_env_dns.globalZoneId }}"
      name: "{{ ep_cluster_domain }}"
      nameservers: "{{ ep_env_zone.nameservers }}"
      # the mark: an NS recordset of the name with another description is refused (teardown deletes only this one)
      description: "Delegation of CloudOSO {{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }} (site {{ oso_cloudinfra_name }})"
  when: ep_dns_provider == 'zone' and ep_env_delegate | bool

- name: Refuse a delegation of the name that is not this environment's
  ansible.builtin.include_tasks: dns_refusal.yml
  when: ep_dns_provider == 'zone' and ep_env_delegate | bool

- name: Check the environment domain sits inside the Designate zone
  ansible.builtin.assert:
    that:
      - (ep_cluster_domain ~ '.').endswith('.' ~ ep_os.dns_zone.name)
    fail_msg: "{{ ep_cluster_domain }} is not inside Designate zone {{ ep_os.dns_zone.name }} (baseDomain {{ ep_base_domain }})"
  when: ep_dns_provider == 'designate'

- name: Read the Route53 credentials
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ ep_route53_vault_path }}"
  when: ep_dns_provider == 'route53'

- name: Find the parent Route53 hosted zone
  amazon.aws.route53_info:
    query: hosted_zone
  register: r53_zones
  environment:
    AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
    AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
    AWS_DEFAULT_REGION: "us-east-1"
  when: ep_dns_provider == 'route53'

- name: Set the Route53 zone id
  ansible.builtin.set_fact:
    ep_route53_zone_id: >-
      {{ (r53_zones.hosted_zones | selectattr('name', 'equalto', ep_base_domain ~ '.')
          | map(attribute='id') | first | default('')) | regex_replace('^/hostedzone/', '') }}
    vault_kv_data: {}
  when: ep_dns_provider == 'route53'

- name: Fail if the parent Route53 zone is missing
  ansible.builtin.fail:
    msg: "Parent Route53 zone '{{ ep_base_domain }}' not found"
  when: ep_dns_provider == 'route53' and ep_route53_zone_id | length == 0

- name: Set CloudOSO environmentprep output facts
  ansible.builtin.set_fact:
    oso_project_name: "{{ ep_os.project.name }}"
    oso_project_id: "{{ ep_os.project.id }}"
    oso_domain_id: "{{ ep_os.project.domain_id }}"
    oso_domain_name: "{{ ep_os.project.domain_name }}"
    oso_slug: "{{ ep_slug }}"
    oso_dns_domain: "{{ ep_cluster_domain }}"
    oso_route53_zone_id: "{{ ep_route53_zone_id | default('') }}"
    # the status record: ids only, no account or Vault path (eda/common/tasks/resolve_cloudoso_accounts.yml)
    oso_record:
      # migrated (the legacy credential above is gone): null removes the key
      appCredentialId: null
      # zone: recorded as designate so PlatformOpenshift writes its records into the environment zone
      # (owner = the site's DNS project, account = the site account)
      dnsProvider: "{{ 'designate' if ep_dns_provider == 'zone' else ep_dns_provider }}"
      dnsZoneId: >-
        {{ ep_env_zone.zone_id if ep_dns_provider == 'zone'
           else (ep_designate_zone_id if ep_dns_provider == 'designate' else (ep_route53_zone_id | default(''))) }}
      dnsZoneName: >-
        {{ ep_env_zone.zone if ep_dns_provider == 'zone'
           else ((ep_os.dns_zone.name | default('')) if ep_dns_provider == 'designate'
                 else ((ep_base_domain ~ '.') if ep_dns_provider == 'route53' else '')) }}
      dnsProjectId: >-
        {{ oso_env_dns.ownerProjectId if ep_dns_provider == 'zone'
           else (ep_designate_project_id if ep_dns_provider == 'designate' else '') }}
      # design/TENANT-DNS.md: the environment zone (teardown deletes it with its shares, and the delegation)
      dns: >-
        {{ {'mode': 'native', 'zone': ep_env_zone.zone, 'zoneId': ep_env_zone.zone_id,
            'ownerProjectId': oso_env_dns.ownerProjectId, 'sharedWith': ep_env_zone.shared_with,
            'shareId': ep_env_zone.share_id, 'nameservers': ep_env_zone.nameservers,
            'delegated': ep_env_delegate | bool, 'dnsConfig': oso_env_dns.dnsConfig,
            'dnsConfigSecret': none, 'globalProjectId': oso_env_dns.globalProjectId,
            'globalZoneId': oso_env_dns.globalZoneId}
           if ep_dns_provider == 'zone' else {} }}
