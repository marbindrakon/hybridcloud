{{- if include "sovereign-init.schemaFixEnabled" . }}
{{- /*
  ArgoCD OpenAPI v2 Schema Compatibility Shim
  ===========================================
  ArgoCD's embedded kube-openapi library fails to resolve JSON Pointer ~1-encoded $ref
  keys in the aggregated /openapi/v2 spec when MCE (multicluster-engine) is installed.
  The ocm-proxyserver and other MCE aggregated API servers use ~1-encoded keys in $ref
  but kube-openapi looks them up literally (without URL-decoding ~1 → /).

  This shim registers a fake APIService backed by a minimal HTTPS server. The server
  dynamically discovers all missing tilde-encoded definitions from the live cluster
  OpenAPI spec and re-serves them under their tilde-encoded keys so kube-openapi can
  resolve the references. The cluster cache sync then succeeds.

  This is a workaround until ArgoCD/kube-openapi decodes ~1 itself. argocdSchemaFix.enabled false renders none
  of these objects, and an upgrade of the release then removes them.
*/ -}}
{{- $sf := .Values.argocdSchemaFix | default dict }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schema-fix-server
  namespace: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
---
# schema-fix-server needs to GET /openapi/v2 from the cluster API server
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: schema-fix-openapi-reader
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/openapi/v2", "/openapi/v3", "/openapi/v3/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: schema-fix-openapi-reader
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: schema-fix-openapi-reader
subjects:
  - kind: ServiceAccount
    name: schema-fix-server
    namespace: argocd-schema-fix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-fix-server
  namespace: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
data:
  serve.sh: |
    #!/bin/sh
    set -e
    mkdir -p /tmp/certs
    openssl genrsa -out /tmp/certs/server.key 2048 2>/dev/null
    openssl req -new -x509 -key /tmp/certs/server.key -out /tmp/certs/server.crt \
      -days 3650 -subj "/CN=argocd-schema-fix.argocd-schema-fix.svc" 2>/dev/null
    echo "Schema fix: TLS cert generated, starting HTTPS server on :6443"
    exec python3 /config/server.py

  # The server's code: files/schema-fix-server.py (unit-tested there).
  server.py: |
{{ .Files.Get "files/schema-fix-server.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-fix-server
  namespace: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
spec:
  replicas: {{ $sf.replicas | default 2 }}
  # a new pod is Ready before an old one goes, so the APIService keeps an endpoint through an upgrade
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: schema-fix-server
  template:
    metadata:
      labels:
        app: schema-fix-server
      annotations:
        # a change of the server's code rolls the pods (the ConfigMap alone would not)
        checksum/server: {{ .Files.Get "files/schema-fix-server.py" | sha256sum | trunc 16 | quote }}
    spec:
      serviceAccountName: schema-fix-server
      imagePullSecrets:
        - name: quay-pull-secret
      # the replicas on different nodes where the cluster has several, so one node going down leaves the API served
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: schema-fix-server
      containers:
        - name: server
          image: {{ $sf.image | default "/hybrid-sovereign/ansible-runner:latest" }}
          command: ["/bin/sh", "/config/serve.sh"]
          env:
            - name: SCHEMA_FIX_HANDSHAKE_TIMEOUT
              value: {{ $sf.handshakeTimeoutSeconds | default 10 | quote }}
            - name: SCHEMA_FIX_READ_TIMEOUT
              value: {{ $sf.readTimeoutSeconds | default 30 | quote }}
          ports:
            - containerPort: 6443
              name: https
          volumeMounts:
            - name: config
              mountPath: /config
          # Each probe is a real HTTPS request through the server, the path every API request takes. The first
          # load of the cluster's OpenAPI documents happens before the server listens: the startup probe allows for
          # it; after that liveness restarts a server that stopped answering.
          startupProbe:
            httpGet:
              path: /healthz
              port: 6443
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: {{ div (int ($sf.startupAllowanceSeconds | default 600)) 5 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6443
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6443
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $sf.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: schema-fix-server
            defaultMode: 0755
{{- if gt (int ($sf.replicas | default 2)) 1 }}
---
# a voluntary eviction (a node drain) leaves at least one server
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: schema-fix-server
  namespace: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: schema-fix-server
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-schema-fix
  namespace: argocd-schema-fix
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: 6443
      name: https
  selector:
    app: schema-fix-server
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1.schemafix.sovereign-bootstrap.io
  labels:
    {{- include "sovereign-init.labels" . | nindent 4 }}
spec:
  group: schemafix.sovereign-bootstrap.io
  groupPriorityMinimum: 1
  insecureSkipTLSVerify: true
  service:
    name: argocd-schema-fix
    namespace: argocd-schema-fix
    port: 443
  version: v1
  versionPriority: 1
{{- end }}
