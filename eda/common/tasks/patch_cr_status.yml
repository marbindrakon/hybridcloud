---
# Status writer of every job (status contract: hybridsovereign.shc collection, module cr_status).
# Inputs (unchanged): cr_api_version, cr_plural, cr_name, cr_namespace, cr_status_body,
# patch_ignore_not_found (default false), cr_status_partial (default false).
# Conditions in cr_status_body are merged by type; a legacy body (status: ready|failed|pending|
# reconciling) gets a Ready condition; status.phase/phaseSince/summary are derived on every write.
# A job whose event is no longer the object's current event ends here, successfully.
- name: "Patch {{ cr_plural }}/{{ cr_name }} status subresource"
  vars:
    _pcs_action: "{{ cr_status_body.status | default('reconcile') }}"
    _pcs_tower_job_id: "{{ tower_job_id | default(awx_job_id | default('')) | string | trim }}"
    _pcs_tower_url: "{{ aap_ui_url | default('') | regex_replace('/$', '') }}"
    _pcs_activation_id: "{{ (ansible_eda['rulebook_activation_id'] | default('')) if ansible_eda is defined else '' }}"
    _pcs_eda_host: "{{ eda_dashboard_host | default(aap_ui_url | default('')) | regex_replace('/$', '') }}"
    _pcs_job_name: "{{ cr_plural | regex_replace('s$', '') }}-{{ _pcs_action }}"
    _pcs_job:
      name: "{{ _pcs_job_name }}"
      jobId: >-
        {{ _pcs_tower_job_id if (_pcs_tower_job_id | length > 0 and _pcs_tower_url | length > 0)
           else (_pcs_activation_id | string if (_pcs_activation_id | string) not in ['', 'manual'] else _pcs_job_name) }}
      url: >-
        {{ (_pcs_tower_url ~ '/execution/jobs/playbook/' ~ _pcs_tower_job_id ~ '/output')
           if (_pcs_tower_job_id | length > 0 and _pcs_tower_url | length > 0)
           else (_pcs_eda_host ~ '/#/rulebook-activations' ~ (('/' ~ _pcs_activation_id) if (_pcs_activation_id | string) not in ['', 'manual'] else '')) }}
  hybridsovereign.shc.cr_status:
    host: "{{ services_api_host | trim }}"
    api_key: "{{ services_bearer_token | trim }}"
    validate_certs: "{{ services_validate_certs | default(true) | bool }}"
    api_version: "{{ cr_api_version }}"
    plural: "{{ cr_plural }}"
    name: "{{ cr_name }}"
    namespace: "{{ cr_namespace }}"
    status: "{{ cr_status_body }}"
    action: "{{ _pcs_action }}"
    event_id: "{{ (event_payload.eventId | default('')) if event_payload is defined and event_payload is mapping else '' }}"
    partial: "{{ cr_status_partial | default(false) | bool }}"
    ignore_not_found: "{{ patch_ignore_not_found | default(false) | bool }}"
    give_up_attempts: "{{ teardown_give_up_attempts | default(10) | int }}"
    job: "{{ _pcs_job }}"
  register: _patch_cr_status_result
  changed_when: _patch_cr_status_result.http | default(0) in [200, 201]

- name: "Log status patch result for {{ cr_plural }}/{{ cr_name }}"
  ansible.builtin.debug:
    msg: "{{ _patch_cr_status_result.stdout | default('') }}"

# A superseded event ends the job here, successfully, before it does any work.
- name: "End the job: a newer request for {{ cr_plural }}/{{ cr_name }} superseded this event"
  ansible.builtin.meta: end_play
  when: _patch_cr_status_result.superseded | default(false) | bool

# A teardown that finished (deletionComplete) on an object that is being deleted: wake its controller now, so it
# releases the finalizer at once and not at its next requeue (which backs off after failed attempts, e.g. after
# Stalled=TeardownFailed and a successful retry).
- name: "Release the finalizer of {{ cr_plural }}/{{ cr_name }} now"
  ansible.builtin.include_tasks: nudge_cr.yml
  vars:
    nudge_crs: [{kind: "{{ cr_plural }}", namespace: "{{ cr_namespace }}", name: "{{ cr_name }}"}]
  when:
    - not (cr_status_partial | default(false) | bool)
    - cr_status_body.deletionComplete | default(false) | bool
    - _patch_cr_status_result.http | default(0) in [200, 201]
    - ((_patch_cr_status_result.resource | default({}, true)).metadata | default({}, true)).deletionTimestamp is defined
