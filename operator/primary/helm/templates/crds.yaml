    argocd.argoproj.io/sync-wave: "1"
spec:
  group: hybridsovereign.redhat
  names:
    kind: Entity
    listKind: EntityList
    plural: entities
    singular: entity
    shortNames:
      - ent
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Entity represents a tenant namespace in the Hybrid Sovereign Cloud platform.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of the Entity
              type: object
              required:
                - description
                - billingID
              properties:
                description:
                  description: Multi-line description of the entity
                  type: string
                billingID:
                  description: Billing identifier (also applied as a namespace label)
                  type: string
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
                websiteLink:
                  description: URL to the entity's external website
                  type: string
                namespaceRbac:
                  description: Maps each named RBAC role to a list of Rbac CR names
                  type: object
                  properties:
                    entityAdmin:
                      description: Full admin over all CRs in the entity namespace
                      type: array
                      items:
                        type: string
                    auditor:
                      description: Read-all access across all CR types
                      type: array
                      items:
                        type: string
                    BobsTeam:
                      description: Read-all access across all CR types (same as auditor)
                      type: array
                      items:
                        type: string
                    cloudOSOAdmin:
                      description: Create/edit/delete CloudOSO CRs; view Rbac CRs
                      type: array
                      items:
                        type: string
                    cloudOSOView:
                      description: View CloudOSO CRs and Rbac CRs
                      type: array
                      items:
                        type: string
                    cloudVirtAdmin:
                      description: Create/edit/delete CloudVirt CRs; view Rbac CRs
                      type: array
                      items:
                        type: string
                    cloudVirtView:
                      description: View CloudVirt CRs and Rbac CRs
                      type: array
                      items:
                        type: string
                    networkAdmin:
                      description: Create/edit/delete HybridNetwork and NetworkPlacement CRs; view CloudOSO, CloudVirt and Rbac CRs
                      type: array
                      items:
                        type: string
                    networkView:
                      description: View HybridNetwork, NetworkPlacement and Rbac CRs
                      type: array
                      items:
                        type: string
                    cloudAWSAdmin:
                      description: Create/edit/delete CloudAWS CRs; view Rbac CRs
                      type: array
                      items:
                        type: string
                    cloudAWSView:
                      description: View CloudAWS CRs and Rbac CRs
                      type: array
                      items:
                        type: string
                    platformOpenshiftAdmin:
                      description: Create/edit/delete PlatformOpenshift CRs; view Rbac CRs
                      type: array
                      items:
                        type: string
                    platformOpenshiftView:
                      description: View PlatformOpenshift CRs and Rbac CRs
                      type: array
                      items:
                        type: string
                    teamAdmin:
                      description: Create/edit/delete Team CRs; view Assignment and Rbac CRs
                      type: array
                      items:
                        type: string
                    teamView:
                      description: View Team, Assignment, and Rbac CRs
                      type: array
                      items:
                        type: string
                    projectAdmin:
                      description: Create/edit/delete Project CRs; view Assignment and Rbac CRs
                      type: array
                      items:
                        type: string
                    projectView:
