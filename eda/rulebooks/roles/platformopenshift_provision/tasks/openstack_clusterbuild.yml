---
- name: Validate slug is 5 characters (Route53 environments)
  ansible.builtin.assert:
    that:
      - cb_slug | length == 5
    fail_msg: "CloudOSO slug must be exactly 5 characters. Got: '{{ cb_slug }}'"
  when: not (use_designate_dns | default(false) | bool)

# The pull secret and SSH key are read with the platform's Vault token and end up in a cluster the tenant
# administers: a spec value is honoured only when the platform lists it (role defaults), else the default applies.
- name: Note the Vault fields of the spec the platform does not honour
  vars:
    _os: "{{ platform_spec.openstack | default({}, true) }}"
  ansible.builtin.set_fact:
    cb_ignored_spec_fields: >-
      {{ ([] if (_os.pullSecretVaultPath | default('', true)) in ([''] + platformopenshift_allowed_vault_paths)
          else ['spec.openstack.pullSecretVaultPath'])
         + ([] if (_os.pullSecretVaultProperty | default('', true)) in ([''] + platformopenshift_allowed_pull_secret_properties)
            else ['spec.openstack.pullSecretVaultProperty'])
         + ([] if (_os.sshKeyVaultPath | default('', true)) in ([''] + platformopenshift_allowed_vault_paths)
            else ['spec.openstack.sshKeyVaultPath']) }}

- name: Say which spec fields were ignored
  ansible.builtin.debug:
    msg: "Ignored (chosen by the platform): {{ cb_ignored_spec_fields | join(', ') }}"
  when: cb_ignored_spec_fields | length > 0

# where an installation is about to start (not for an installed cluster or one whose installation runs), each role
# that will have nodes needs a flavor: the spec's, else the installation's default, which has no fallback
- name: Fail without the installation's default flavors
  vars:
    _ocb_st: "{{ (po_cr_current.resources | default([{}], true) | first).status | default({}, true) }}"
    _ocb_missing: >-
      {{ (['controlPlaneFlavor'] if (oso_control_plane_flavor | default('', true) | length) == 0 else [])
         + (['workerFlavor'] if (oso_worker_flavor | default('', true) | length) == 0
                                and (oso_worker_count | default(0, true) | int) > 0 else []) }}
  ansible.builtin.fail:
    msg: >-
      Set platformopenshift_defaults.{{ _ocb_missing | first }} (the installation's default flavor for an OpenShift
      cluster's {{ 'control plane' if (_ocb_missing | first) == 'controlPlaneFlavor' else 'worker' }} nodes, used when
      the cluster's spec names none).
  when:
    - _ocb_missing | length > 0
    - not (_ocb_st.clusterInstalled | default(false) | bool)
    - (_ocb_st.install | default({}, true)).stage | default('') not in ['Installing', 'Finishing', 'Installed']

- name: Derive cluster identifiers
  vars:
    _os: "{{ platform_spec.openstack | default({}, true) }}"
  ansible.builtin.set_fact:
    cb_image_set: "{{ platform_spec.openstack.ocpImageSet | default(default_ocp_image_set, true) }}"
    cb_controller_flavor: "{{ oso_control_plane_flavor }}"
    # a cluster without workers whose spec and defaults name no worker flavor: its (empty) worker pool takes the
    # control plane's flavor, which the installer accepts for a pool of no machines
    cb_worker_flavor: "{{ oso_worker_flavor if (oso_worker_flavor | default('', true) | length) > 0 else oso_control_plane_flavor }}"
    cb_control_plane_count: "{{ oso_control_plane_count }}"
    cb_worker_count: "{{ oso_worker_count }}"
    cb_pull_secret_vault: >-
      {{ _os.pullSecretVaultPath if 'spec.openstack.pullSecretVaultPath' not in cb_ignored_spec_fields
         and (_os.pullSecretVaultPath | default('', true)) | length > 0 else default_pull_secret_vault_path }}
    cb_pull_secret_vault_property: >-
      {{ _os.pullSecretVaultProperty if 'spec.openstack.pullSecretVaultProperty' not in cb_ignored_spec_fields
         and (_os.pullSecretVaultProperty | default('', true)) | length > 0 else default_pull_secret_vault_property }}
    cb_ssh_key_vault: >-
      {{ _os.sshKeyVaultPath if 'spec.openstack.sshKeyVaultPath' not in cb_ignored_spec_fields
         and (_os.sshKeyVaultPath | default('', true)) | length > 0 else default_ssh_key_vault_path }}
    # the cluster's own credential (common/tasks/openstack_cluster_credential.yml, made in the preflight)
    cb_provider_creds_vault: "cluster/oso/{{ cb_app_name }}/build/provider-creds"
    # shc (§11.6 phase C): per cluster (two clusters on one CloudOSO overwrote each other)
    cb_install_config_vault: "oso/projects/{{ oso_env_name }}/clusters/{{ ansible_operator_meta.name }}/install-config"
    cb_trust_bundle: "{{ platform_spec.openstack.trustBundle | default('') }}"
    cb_glance_image: "{{ platform_spec.openstack.glanceImageOverride | default(default_glance_image_override, true) }}"

# the resolvers of the cluster's machine subnet: on a hybrid network the placement's, else the installation default
- name: The cluster's resolvers
  ansible.builtin.include_tasks: cluster_resolvers.yml

# the teardown derives the same list (eda/common/tasks/resolve_platformopenshift_paths.yml): change both
- name: Record the Vault paths this cluster writes (install-config here, PushSecrets in the monitor)
  ansible.builtin.set_fact:
    cb_vault_paths:
      - "{{ cb_install_config_vault }}"
      - "cluster/oso/{{ cb_app_name }}/admin-kubeconfig"
      - "cluster/oso/{{ cb_app_name }}/admin-password"
      - "cluster/oso/{{ cb_app_name }}/ssh-key"
      - "cluster/oso/{{ cb_app_name }}/install-config"
      - "{{ cb_provider_creds_vault }}"

- name: Fail without a cluster-build chart
  ansible.builtin.assert:
    that:
      - (mce_cluster_build_chart | trim) is match('oci://[^/]+/')
    fail_msg: >-
      Set platformopenshift_defaults.mceClusterBuildChart (or env OCI_HOST) for the mce-cluster-build chart
      (got '{{ mce_cluster_build_chart | trim }}').

# shc (DESIGN cnet §4.2): the build name, the network choice, the floating IPs and (hybrid network) the cluster's
# prefixes, each recorded before the next step uses it
- name: The cluster's recorded build and addresses
  ansible.builtin.include_tasks: openstack_cluster_addresses.yml

# a stopped installation is removed only when someone asked for a new one (remove_stopped_build.yml); never a build
# that is installing or installed
- name: Remove a stopped installation before a new one
  ansible.builtin.include_tasks: remove_stopped_build.yml
  vars:
    rsb_obj: "{{ po_cr_current.resources[0] }}"

- name: Create Route53 records for the cluster
  when: not (use_designate_dns | default(false) | bool)
  block:
    - name: Read the Route53 credentials
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
      vars:
        vault_kv_path: "{{ cb_route53_vault_path }}"

    - name: Record the Route53 records before they are created
      ansible.builtin.include_tasks: dns_record.yml
      vars:
        dr_records:
          - {zone: "{{ cb_base_domain }}", name: "api.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", type: A}
          - {zone: "{{ cb_base_domain }}", name: "*.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", type: A}

    - name: Create Route53 A records for the API and apps wildcard
      amazon.aws.route53:
        state: present
        zone: "{{ cb_base_domain }}"
        record: "{{ item.name }}"
        type: A
        ttl: 300
        value:
          - "{{ item.ip }}"
        overwrite: true
      environment:
        AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
        AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
        AWS_DEFAULT_REGION: "us-east-1"
      loop:
        - {name: "api.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", ip: "{{ cb_api_vip }}"}
        - {name: "*.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", ip: "{{ cb_ingress_vip }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: Record the Route53 records
      ansible.builtin.set_fact:
        vault_kv_data: {}
        cb_dns_records:
          - {zone: "{{ cb_base_domain }}", name: "api.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", type: A}
          - {zone: "{{ cb_base_domain }}", name: "*.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", type: A}

- name: Create Designate DNS records for internet-facing cluster
  ansible.builtin.include_tasks: designate_dns.yml
  when: use_designate_dns | default(false) | bool

- name: Read the OCP pull secret
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ cb_pull_secret_vault }}"

- name: Keep the pull secret
  ansible.builtin.set_fact:
    cb_pull_secret_raw: "{{ vault_kv_data[cb_pull_secret_vault_property] | default('') }}"
  no_log: true

- name: Read the cluster SSH key
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ cb_ssh_key_vault }}"

- name: Keep the SSH public key
  ansible.builtin.set_fact:
    cb_ssh_public_key: "{{ vault_kv_data.ssh_public_key | default('') }}"
    vault_kv_data: {}
  no_log: true

- name: Fail without a pull secret or SSH key
  ansible.builtin.assert:
    that:
      - cb_pull_secret_raw | string | length > 0
      - cb_ssh_public_key | length > 0
    fail_msg: >-
      Vault {{ cb_pull_secret_vault }} (property {{ cb_pull_secret_vault_property }}) or
      {{ cb_ssh_key_vault }} (ssh_public_key) is missing.

- name: Normalize pull secret to valid JSON
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, ast, json
        raw = sys.stdin.read().strip()
        try:
            parsed = json.loads(raw)
            print(json.dumps(parsed, separators=(',', ':')))
        except (json.JSONDecodeError, ValueError):
            try:
                parsed = ast.literal_eval(raw)
                print(json.dumps(parsed, separators=(',', ':')))
            except Exception:
                print(raw)
    stdin: "{{ cb_pull_secret_raw if (cb_pull_secret_raw is string) else (cb_pull_secret_raw | to_json) }}"
  register: _pull_secret_json_result
  no_log: true
  changed_when: false

- name: Set normalized pull secret JSON
  ansible.builtin.set_fact:
    cb_pull_secret_json: "{{ _pull_secret_json_result.stdout | trim }}"
  no_log: true

- name: Render OpenStack install-config YAML
  ansible.builtin.set_fact:
    cb_install_config: "{{ lookup('template', 'install-config-openstack.yaml.j2') }}"
  no_log: true

- name: Write install-config to Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_write.yml"
  vars:
    vault_kv_path: "{{ cb_install_config_vault }}"
    vault_kv_write_data:
      install-config.yaml: "{{ cb_install_config }}"

- name: Read the cluster's installation as it stands now
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: PlatformOpenshift
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: _po_now

# shc (§11.6 phase C): record the DNS records and Vault paths as soon as they exist, so a build
# that fails later still tears down cleanly (and the orphan check doesn't flag a running install).
# A new installation is announced ("The installation is starting."); a run on an installation that already runs or is
# done records only these fields (a partial write: the watch's last message stays).
- name: Record DNS records and Vault paths on the status
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ ansible_operator_meta.name }}"
    cr_namespace: "{{ ansible_operator_meta.namespace }}"
    _po_install_start: "{{ _po_now.resources[0].status | default({}, true) | hybridsovereign.shc.shc_install_starting }}"
    _po_status_fields:
      install: "{{ _po_install_start }}"
      dns:
        provider: "{{ 'designate' if (use_designate_dns | bool) else 'route53' }}"
        accountVaultPath: null
        projectId: "{{ designate_project_id if (use_designate_dns | bool) else '' }}"
        records: "{{ cb_dns_records | default([]) }}"
      vaultPaths: null
    cr_status_partial: "{{ (_po_install_start | length) == 0 }}"
    # the install starts with the Helm release below: from here on a refusal never gives the floating IPs back
    cr_status_body: >-
      {{ _po_status_fields | combine({'installStarted': true})
         | combine({'status': 'reconciling', 'ready': false, 'reason': 'Installing',
                                      'message': 'The installation is starting.'}
                                     if (_po_install_start | length) > 0 else {}) }}

# the network marks the cluster's rows installed, so the fabric's limit keeps the slot for good (Review R4 NM1)
- name: Wake the network now the install starts
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
  vars:
    nudge_crs: [{kind: HybridNetwork, namespace: "{{ ansible_operator_meta.namespace }}", name: "{{ oso_network }}"}]
  when: cb_platform_path | default(false) | bool

- name: Render build-values YAML to tempfile
  ansible.builtin.copy:
    content: "{{ lookup('template', 'build-values.yaml.j2') }}"
    dest: "/tmp/{{ cb_app_name }}-build-values.yaml"
    mode: '0600'
  changed_when: false

- name: Write central cluster kubeconfig for Helm
  ansible.builtin.include_tasks: write_central_helm_kubeconfig.yml

# shc (§11.6 phase C): the chart registry may be private; the platform pull secret is a Docker
# config.json, which Helm reads as its registry config.
- name: Write the Helm registry config from the pull secret
  ansible.builtin.copy:
    content: "{{ cb_pull_secret_json }}"
    dest: "/tmp/{{ cb_app_name }}-registry.json"
    mode: "0600"
  no_log: true

- name: Check existing Helm release
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - json
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_release_status
  failed_when: false
  changed_when: false

- name: Set helm release exists flag
  ansible.builtin.set_fact:
    cb_helm_release_exists: "{{ helm_release_status.rc == 0 }}"

- name: Set helm release failed flag
  ansible.builtin.set_fact:
    cb_helm_release_failed: >-
      {{ cb_helm_release_exists | bool and
         (helm_release_status.stdout | from_json).info.status | default('') == 'failed' }}
  when: cb_helm_release_exists | bool

- name: Set helm release failed flag (when release does not exist)
  ansible.builtin.set_fact:
    cb_helm_release_failed: false
  when: not (cb_helm_release_exists | bool)

- name: Get current Helm values for idempotency check
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - yaml
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_current_values
  failed_when: false
  changed_when: false
  when: cb_helm_release_exists | bool

- name: Determine if Helm upgrade is needed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        new = yaml.safe_load(open('/tmp/{{ cb_app_name }}-build-values.yaml').read()) or {}
        cur_raw = """{{ helm_current_values.stdout | default('null') }}"""
        cur = yaml.safe_load(cur_raw) or {}
        print("true" if new != cur else "false")
  register: values_diff_result
  changed_when: false
  when: cb_helm_release_exists | bool

# while an installation runs (or a build this run adopted) the release is not changed: the running build is the one
# that was installed; settings changed meanwhile are used only by a later installation
- name: Set values changed flag
  vars:
    _cb_running: >-
      {{ (po_adopted | default(false) | bool)
         or ((((_po_now.resources | default([{}], true) | first).status | default({}, true)).install
              | default({}, true)).stage | default('')) in ['Installing', 'Finishing'] }}
  ansible.builtin.set_fact:
    cb_values_changed: >-
      {{ not (cb_helm_release_exists | bool) or
         (not (_cb_running | bool) and
          ((cb_helm_release_failed | bool) or (values_diff_result.stdout | default('true') | trim == 'true'))) }}

# the object may have been deleted, replaced or given a newer request since the job's last status write
- name: Check right before the release that the object is still this job's
  ansible.builtin.include_tasks: install_same_object.yml
  vars:
    # the spec this job read is the one it installs
    iso_generation: "{{ platformopenshift_generation }}"

- name: Deploy mce-cluster-build chart
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - "{{ cb_app_name }}"
      - "{{ mce_cluster_build_chart | trim }}"
      - --version
      - "{{ mce_cluster_build_chart_version }}"
      - --install
      - --namespace
      - "{{ cb_cluster_name }}"
      - --create-namespace
      - --values
      - "/tmp/{{ cb_app_name }}-build-values.yaml"
      - --history-max
      - "2"
      - --wait
      - --timeout
      - "10m"
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
      - --registry-config
      - "/tmp/{{ cb_app_name }}-registry.json"
  register: helm_deploy_result
  when: cb_values_changed | bool
  changed_when: "'has been upgraded' in helm_deploy_result.stdout or 'Installing it now' in helm_deploy_result.stdout"
  failed_when: false
  # one more try after a passing failure (a hub admission timeout, another release operation finishing)
  until: (helm_deploy_result.rc | default(0) | int) == 0
  retries: 1
  delay: 30

- name: A failed release of the build
  ansible.builtin.include_tasks: install_release_failed.yml
  when: (helm_deploy_result.rc | default(0) | int) != 0

- name: Clean up temp values and registry files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/{{ cb_app_name }}-build-values.yaml"
    - "/tmp/{{ cb_app_name }}-registry.json"
  changed_when: false

# the watch ends the job unless the cluster is installed (install_observe.yml)
- name: Watch the installation
  ansible.builtin.include_tasks: install_observe.yml
  vars:
    io_network_path: "{{ cb_platform_path | bool }}"
    io_tenant_values:
      controlPlane: "{{ cb_controller_flavor }}"
      compute: "{{ cb_worker_flavor }}"
      image: "{{ cb_glance_image | default('', true) }}"

- name: Read the installed cluster and push its secrets
  ansible.builtin.include_tasks: openstack_clusterbuild_monitor.yml

- name: The cluster router's gateway address joins the cluster's prefixes
  ansible.builtin.include_tasks: router_gateway.yml
  vars:
    rg_infra_id: "{{ (cd_info.resources | default([]) | first | default({})).spec.clusterMetadata.infraID | default('', true) }}"
  when:
    - cb_platform_path | bool
    - cb_cluster_installed | default(false) | bool
    - (pf.service.hubEndpoints | default([], true)) | length > 0
    - ((cd_info.resources | default([]) | first | default({})).spec.clusterMetadata.infraID | default('', true)) | length > 0
