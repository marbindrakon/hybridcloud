      enabled: false
      playbook: quay-config.yml
      activeDeadlineSeconds: 1200
      syncWave: "37"
      externalSecrets:
        rhbkCentralAdmin:
          enabled: true
          targetSecretName: rhbk-central-admin-quay
          data:
            - secretKey: username
              remoteKey: rhbk-central-admin
              property: username
            - secretKey: password
              remoteKey: rhbk-central-admin
              property: password
