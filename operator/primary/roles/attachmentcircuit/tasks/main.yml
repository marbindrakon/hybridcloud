---
# The platform's AttachmentCircuits (ceKind platform, in the platform's namespace): the same acknowledgement, event
# and status as the namespace operator's role for a tenant's circuits (operator/namespace/roles/attachmentcircuit),
# task for task, except the namespace check: the platform's namespace has no Entity, and a circuit of another kind,
# or in another watched namespace, is refused here. tests/unit/test_platform_circuit_operator.py keeps the two in step.
- block:
    - name: Set AttachmentCircuit CR facts
      ansible.builtin.set_fact:
        attachmentcircuit_spec: "{{ _hybridsovereign_redhat_attachmentcircuit.spec | default({}) }}"
        attachmentcircuit_generation: "{{ _hybridsovereign_redhat_attachmentcircuit.metadata.generation | default(0) | int }}"
        attachmentcircuit_observed_generation: "{{ _hybridsovereign_redhat_attachmentcircuit.status.observedGeneration | default(0) | int }}"
        attachmentcircuit_status: "{{ _hybridsovereign_redhat_attachmentcircuit.status.status | default('') }}"
        attachmentcircuit_ready: "{{ _hybridsovereign_redhat_attachmentcircuit.status.ready | default(false) | bool }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_attachmentcircuit }}"

    # The primary operator watches the platform's namespace and the plugins namespace. It realizes only circuits of
    # ceKind platform, and only in the platform's namespace; it refuses any other circuit it sees in its status
    # (refuse.yml: Ready False/InvalidSpec, phase Failed, no event). A tenant's circuits are the namespace operator's.
    # The circuit job refuses a platform circuit outside the platform's namespace too (NotPlatformNamespace).
    - name: Require the platform namespace setting
      ansible.builtin.assert:
        that:
          - attachmentcircuit_platform_namespace | default('', true) | length > 0
        fail_msg: PLATFORM_NAMESPACE is not set on the primary operator (the platform's namespace)
        quiet: true

    - name: Decide whether this operator realizes the circuit
      ansible.builtin.set_fact:
        attachmentcircuit_refusal: >-
          {%- set kind = attachmentcircuit_spec.ceKind | default('customer', true) -%}
          {%- if ansible_operator_meta.namespace != attachmentcircuit_platform_namespace -%}
          AttachmentCircuit {{ ansible_operator_meta.name }}: namespace {{ ansible_operator_meta.namespace }} is not
          the platform's namespace ({{ attachmentcircuit_platform_namespace }}); a circuit of ceKind platform is
          realized only there, a tenant network's circuit (ceKind customer) only in the tenant's namespace
          {%- elif kind != 'platform' -%}
          AttachmentCircuit {{ ansible_operator_meta.name }}: spec.ceKind {{ kind }} is not realized in the
          platform's namespace, only ceKind platform; a tenant network's circuit (ceKind customer, with spec.network)
          belongs in the tenant's namespace
          {%- endif -%}

    - name: Refuse a circuit the platform's namespace does not realize
      ansible.builtin.include_tasks: refuse.yml
      when: attachmentcircuit_refusal | default('', true) | trim | length > 0

    - name: Set event action and reason
      ansible.builtin.set_fact:
        attachmentcircuit_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        attachmentcircuit_event_reason: "{{ 'AttachmentCircuitReconcileRequested' if reconcile_now | bool else 'AttachmentCircuitCreateRequested' }}"
        attachmentcircuit_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (attachmentcircuit_observed_generation | int >= attachmentcircuit_generation | int)
            and (attachmentcircuit_status == 'ready')
            and (attachmentcircuit_ready | bool)
          }}

    - name: Skip when already processed
      ansible.builtin.meta: end_host
      when: attachmentcircuit_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: AttachmentCircuit
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        attachmentcircuit_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # The acknowledgement carries the phase (Creating for a new AttachmentCircuit, Updating for a change), so no status
    # write is without a phase (_common/tasks/ack_phase.yml).
    - name: Decide the phase of the acknowledgement
      ansible.builtin.include_role:
        name: _common
        tasks_from: ack_phase
      vars:
        ack_phase_cr: "{{ _hybridsovereign_redhat_attachmentcircuit }}"
      when: not (reconcile_keeps_ready | default(false) | bool)

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark AttachmentCircuit as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          phase: "{{ ack_phase.phase }}"
          phaseSince: "{{ ack_phase.phaseSince }}"
          summary: "{{ ack_phase.summary }}"
          lastReconciledAt: "{{ attachmentcircuit_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ attachmentcircuit_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark AttachmentCircuit as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ attachmentcircuit_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ attachmentcircuit_event_reason }}"
        operator_event_action: "{{ attachmentcircuit_event_action }}"
        operator_event_note: "{{ attachmentcircuit_spec | to_json }}"
        operator_reporting_controller: attachmentcircuit-operator
        operator_event_phase_recorded: >-
          {{ '' if (reconcile_keeps_ready | default(false) | bool) else (ack_phase | default({})).phase | default('') }}
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: AttachmentCircuit
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_attachmentcircuit.metadata.uid }}"

  rescue:
    - name: Mark AttachmentCircuit as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "AttachmentCircuit {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
