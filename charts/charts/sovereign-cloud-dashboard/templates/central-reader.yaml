---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashboard-central-reader
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dashboard-central-reader
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: dashboard-central-reader
        property: token
    - secretKey: ca.crt
      remoteRef:
        key: dashboard-central-reader
        property: ca_crt
    - secretKey: api_server
      remoteRef:
        key: dashboard-central-reader
        property: api_server
