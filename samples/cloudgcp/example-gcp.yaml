# A Google Cloud environment (CloudGCP) on the site site-gcp. Billable: a Google Cloud project is
# assigned to the tenant. The platform enters it with its own identity; the spec holds no keys.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGCP
metadata:
  name: example-gcp
  namespace: entity-example-corp
spec:
  cloudRef:
    name: site-gcp
