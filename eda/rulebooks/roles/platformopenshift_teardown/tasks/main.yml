---
# shc (LAB-PLAN §11.6 phase C, design/TENANT-TEARDOWN.md §3.3): a teardown that verifies, against
# central through the resolved Vault SA connection (job pods have no kubeconfig) and with the job's
# VAULT_TOKEN. Order: ACM detach, Hive deprovision (checked), the recorded DNS records, for AWS the
# cluster's IAM (roles, OIDC provider) and its published issuer, the central namespace (its PushSecrets
# would re-push deleted Vault keys), the recorded Vault paths, the Keycloak client, the services viewer
# RBAC. Any failure lands in status.deletion and the CR stays Terminating; deletionComplete only after
# every step succeeded. The build's objects on central are named after status.buildName (OpenStack:
# shc-oso-<entity>-<name>, AWS: shc-aws-<entity>-<name>, GCP: shc-gcp-<entity>-<name>); without a record OpenStack
# derives its build name again and AWS and GCP fall back to the CR's name. A cluster on a hybrid network leaves the
# platform's service routing domain (status.platformPrefixes cleared, the withdrawal checked) before an OpenStack
# cluster's floating IPs are released (DESIGN cnet §4.3): the reverse of the build. Cloud teardowns run in the
# shc-cloud container group.
- block:
    # nothing on a site (refused at validation): delete without site cleanup
    - name: Skip the site cleanup when nothing was realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/teardown_unrealized.yml"

    - name: Parse event payload
      ansible.builtin.set_fact:
        platformopenshift_cr_name: "{{ event_payload.regarding.name }}"
        platformopenshift_cr_namespace: "{{ event_payload.regarding.namespace }}"
        platform_spec: "{{ shc_live_spec }}"
        teardown_step: read

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Resolve central cluster API connection from Vault SA
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_central_cluster_sa_from_vault.yml"

    - name: Read PlatformOpenshift CR from services cluster
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: PlatformOpenshift
        name: "{{ platformopenshift_cr_name }}"
        namespace: "{{ platformopenshift_cr_namespace }}"
      register: po_cr

    - name: Read the namespace for the tenant (an OpenStack cluster's build name)
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Namespace
        name: "{{ platformopenshift_cr_namespace }}"
      register: _po_ns
      when:
        - ((po_cr.resources | default([]) | first | default({})).spec | default({}, true)).type | default(platform_spec.type | default(''), true) == 'openstack'
        - (((po_cr.resources | default([]) | first | default({})).status | default({}, true)).buildName | default('', true)) | length == 0

    - name: Derive the build name of an OpenStack cluster without a record
      ansible.builtin.include_tasks: "{{ role_path }}/../platformopenshift_provision/tasks/build_name.yml"
      vars:
        bn_entity: >-
          {{ (((_po_ns.resources | default([]) | first | default({})).metadata | default({})).labels | default({}, true))
             ['hybridsovereign.redhat/entity'] | default('', true) }}
        bn_name: "{{ platformopenshift_cr_name }}"
      when: _po_ns is not skipped

    # Vault paths and the DNS account are derived from the cluster's identity (an object written before they left
    # the status is read from its old keys)
    - name: Resolve the cluster's Vault paths and DNS account
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_platformopenshift_paths.yml"
      vars:
        rpp_cr: "{{ po_cr.resources | default([]) | first | default({}) }}"
        rpp_build_name: "{{ bn_build_name if _po_ns is not skipped else '' }}"

    - name: Set platform type and recorded status facts
      vars:
        _st: "{{ (po_cr.resources | default([]) | first | default({})).status | default({}) }}"
      ansible.builtin.set_fact:
        platform_type: "{{ (po_cr.resources | default([]) | first | default({})).spec.type | default(platform_spec.type | default('')) }}"
        po_status_slug: "{{ _st.slug | default('') }}"
        po_status_domain: "{{ _st.domain | default('') }}"
        po_dns: "{{ _st.dns | default({}) }}"
        po_vault_paths: "{{ rpp_vault_paths }}"
        po_dns_account_vault_path: "{{ rpp_dns_account_vault_path }}"
        po_oidc_client_id: "{{ _st.oidcClientId | default('', true) | default(platformopenshift_cr_name ~ '-keycloak-oidc', true) }}"
        po_build_name: "{{ rpp_build_name_in_effect }}"
        po_aws_account: "{{ _st.awsAccountId | default('', true) }}"
        po_aws_region: "{{ _st.awsRegion | default('', true) }}"
        po_gcp_project: "{{ _st.gcpProject | default('', true) }}"
        po_gcp_region: "{{ _st.gcpRegion | default('', true) }}"
        po_gcp_vpc: "{{ _st.gcpVpc | default('', true) }}"
        po_issuer: "{{ _st.serviceAccountIssuer | default('', true) }}"
        po_network: "{{ _st.network | default('', true) }}"
        po_placement: "{{ _st.placement | default('', true) }}"
        po_publish: "{{ _st.publish | default('', true) }}"
        po_machine_network: "{{ _st.machineNetwork | default('', true) }}"
        po_domain: "{{ _st.domain | default('', true) }}"
        po_platform_prefixes: "{{ _st.platformPrefixes | default([], true) }}"
        po_fip_ids: >-
          {{ [((_st.floatingIPs | default({}, true)).api | default({}, true)).id | default('', true),
              ((_st.floatingIPs | default({}, true)).ingress | default({}, true)).id | default('', true)] | select | list }}
        po_oso_env: "{{ ((po_cr.resources | default([]) | first | default({})).spec | default({}, true)).openstack.environment | default('', true) }}"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: acm-detach

    - name: Tear down ACM policies and ManagedCluster
      ansible.builtin.include_tasks: delete_acm.yml

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: deprovision

    - name: Tear down the Hive cluster build on central
      ansible.builtin.include_tasks: delete_clusterbuild.yml

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: dns

    - name: Tear down the recorded Designate records
      ansible.builtin.include_tasks: delete_dns_openstack.yml
      when:
        - platform_type == "openstack"
        - po_dns.provider | default('') == 'designate'
        - po_dns.records | default([]) | length > 0

    - name: Tear down the recorded Route53 records (OpenStack)
      ansible.builtin.include_tasks: delete_dns_aws.yml
      vars:
        r53_vault_path: "{{ po_dns_account_vault_path }}"
        r53_records: "{{ po_dns.records }}"
      when:
        - platform_type == "openstack"
        - po_dns.provider | default('') == 'route53'
        - po_dns.records | default([]) | length > 0

    # AWS: the installer's records in the environment's zone went with Hive's deprovision
    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: aws-sts

    - name: Tear down the AWS cluster's IAM and its published issuer
      when: platform_type == "aws" and po_aws_account | length > 0
      block:
        - name: The installation's AWS realization and the job's AWS identity
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_realization.yml"

        - name: The cluster's roles and OIDC provider in its account
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
          vars:
            aws_helper: shc_aws_cluster.py
            aws_config:
              account: "{{ po_aws_account }}"
              region: "{{ po_aws_region }}"
              memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
              entry: automation
            aws_args: [sts-down, --cluster, "{{ po_build_name }}", --issuer, "{{ po_issuer }}"]
          when: po_issuer | length > 0

        # a cluster on a hybrid network (P8 §13): its published names (Internal), the platform reach to its prefix,
        # the placement's public subnets (External; their load balancers went with the deprovision)
        - name: Remove the cluster's published names (Internal)
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
          vars:
            aws_helper: shc_aws_cluster.py
            aws_config:
              account: "{{ po_aws_account }}"
              region: "{{ po_aws_region }}"
              memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
              entry: automation
            aws_args: [dns-alias, --state, down, --zone, "{{ po_domain.split('.', 1)[1] }}", --name,
                       "{{ po_domain.split('.', 1)[0] }}"]
          when: po_publish == 'Internal' and po_domain | length > 0

        - name: The placement's public subnets go (External)
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
          vars:
            aws_helper: shc_aws_tenant.py
            aws_config:
              account: "{{ po_aws_account }}"
              region: "{{ po_aws_region }}"
              memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
              entry: automation
              azs: []
            aws_args: [place-public, --placement, "{{ po_placement }}", --state, down]
          when: po_publish == 'External' and po_placement | length > 0

        - name: Unpublish the cluster's issuer (its static issuer ConfigMap on central)
          kubernetes.core.k8s:
            host: "{{ central_api_host }}"
            api_key: "{{ central_bearer_token }}"
            validate_certs: false
            state: absent
            api_version: v1
            kind: ConfigMap
            name: "oidc-static-{{ po_build_name }}"
            namespace: "{{ (aws_real.clusterIssuer | default({})).namespace | default('shc-oidc') }}"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: gcp-wif

    # GCP: the installer's records in the environment's zone went with Hive's deprovision
    - name: Tear down the GCP cluster's workload identity and its published issuer
      when: platform_type == "gcp" and po_gcp_project | length > 0
      block:
        - name: The installation's GCP realization and the job's GCP identity
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_realization.yml"

        - name: The cluster's service accounts, custom roles and pool in its project
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
          vars:
            gcp_helper: shc_gcp_cluster.py
            gcp_config: {project: "{{ po_gcp_project }}", region: "{{ po_gcp_region }}"}
            gcp_args: [wif-down, --cluster, "{{ po_build_name }}"]

        - name: Remove the cluster's published names (Internal)
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
          vars:
            gcp_helper: shc_gcp_cluster.py
            gcp_config: {project: "{{ po_gcp_project }}", region: "{{ po_gcp_region }}"}
            gcp_args: [dns-alias, --state, down, --zone, "{{ po_domain.split('.', 1)[1] }}", --name,
                       "{{ po_domain.split('.', 1)[0] }}"]
          when: po_publish == 'Internal' and po_domain | length > 0

        - name: Unpublish the cluster's issuer (its static issuer ConfigMap on central)
          kubernetes.core.k8s:
            host: "{{ central_api_host }}"
            api_key: "{{ central_bearer_token }}"
            validate_certs: false
            state: absent
            api_version: v1
            kind: ConfigMap
            name: "oidc-static-{{ po_build_name }}"
            namespace: "{{ (gcp_real.clusterIssuer | default({})).namespace | default('shc-oidc') }}"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: service-prefixes

    # the cluster's prefixes leave the platform's service routing domain: the record goes, the network drops them
    # and wakes the fabric, and the withdrawal is checked
    - name: Take the cluster's prefixes out of the platform's service routing domain
      ansible.builtin.include_tasks: withdraw_prefixes.yml
      when: po_network | length > 0 and po_platform_prefixes | length > 0

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: floating-ips

    - name: Release the cluster's floating IPs
      ansible.builtin.include_tasks: release_fips.yml
      when: platform_type == "openstack"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: central-namespace

    - name: Delete the cluster namespace on central
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ po_build_name }}"
        wait: true
        wait_timeout: 600

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: vault

    - name: Delete the cluster's Vault paths
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_delete.yml"
      vars:
        # the build's paths (cluster/<provider>/<build name>/...); no CR-name paths: CR names are not unique across
        # tenants
        vault_kv_delete_paths: "{{ po_vault_paths }}"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: keycloak-client

    - name: Open a Keycloak admin session
      ansible.builtin.include_tasks: "{{ role_path }}/../platformopenshift_provision/tasks/keycloak_admin_session.yml"

    - name: Find the cluster's OIDC client
      ansible.builtin.uri:
        url: "{{ kc_base_url }}/admin/realms/{{ keycloak_realm }}/clients?clientId={{ po_oidc_client_id | urlencode }}"
        headers:
          Authorization: "Bearer {{ kc_admin_token }}"
        validate_certs: false
      register: kc_client

    - name: Delete the cluster's OIDC client
      ansible.builtin.uri:
        url: "{{ kc_base_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ kc_admin_token }}"
        validate_certs: false
        status_code: [204, 404]
      loop: "{{ kc_client.json | default([]) }}"
      loop_control:
        label: "{{ item.clientId }}"

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: services-rbac

    - name: Delete the per-CR viewer Role and RoleBinding on services
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: rbac.authorization.k8s.io/v1
        kind: "{{ item }}"
        name: "{{ platformopenshift_cr_name }}-viewer"
        namespace: "{{ platformopenshift_cr_namespace }}"
      loop: [RoleBinding, Role]

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: acm-detach-check

    - name: Check the ManagedCluster is gone
      kubernetes.core.k8s_info:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ po_build_name }}"
      register: mc_final

    - name: Fail while the ManagedCluster remains
      ansible.builtin.fail:
        msg: "ManagedCluster {{ po_build_name }} is still present (finalizers) after the deprovision"
      when: mc_final.resources | length > 0

    - name: Get current timestamp for status
      ansible.builtin.set_fact:
        platformopenshift_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark PlatformOpenshift deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: platformopenshifts
        cr_name: "{{ platformopenshift_cr_name }}"
        cr_namespace: "{{ platformopenshift_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          deletion: null
          lastReconciledAt: "{{ platformopenshift_delete_transition_time }}"
          message: PlatformOpenshift {{ platformopenshift_cr_name }} deleted by EDA

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: PlatformOpenshift, namespace: "{{ platformopenshift_cr_namespace }}", name: "{{ platformopenshift_cr_name }}"}]

  rescue:
    - name: Mark PlatformOpenshift delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        _msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA teardown failed')) }}"
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: platformopenshifts
        cr_name: "{{ platformopenshift_cr_name }}"
        cr_namespace: "{{ platformopenshift_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ _msg }}"
          deletion:
            failed: true
            step: "{{ teardown_step | default('read') }}"
            message: "{{ _msg }}"
            at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "PlatformOpenshift {{ platformopenshift_cr_name | default('unknown') }} EDA teardown failed at {{ teardown_step | default('read') }}"

  always:
    - name: Remove temp credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/eda-po-teardown-{{ platformopenshift_cr_name | default('unknown') }}-clouds.yaml"
        - "/tmp/{{ platformopenshift_cr_name | default('unknown') }}-kubeconfig"
        - "/tmp/{{ po_build_name | default('unknown') }}-kubeconfig"
