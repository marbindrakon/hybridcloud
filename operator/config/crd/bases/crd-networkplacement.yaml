apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkplacements.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: NetworkPlacement
    listKind: NetworkPlacementList
    plural: networkplacements
    singular: networkplacement
    shortNames:
      - nplace
    categories:
      - shc
      - shc-tenant
      - shc-network
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A network placement: puts a HybridNetwork on one environment of the same tenant,
            comparable to a subnet with its attachment (on AWS and Google Cloud, a VPC of its own).
            The environment is a CloudOSO (an OpenStack project), a CloudVirt (OpenShift
            Virtualization), a CloudAWS (a VPC in the environment's account) or a CloudGCP (a VPC in
            the environment's project). The platform allocates the placement's subnets from the
            network's address space (one per address family, of the requested size or pinned),
            creates the network there with them and connects it, through the site's CloudGateway, to
            the network's other placements. On a CloudVirt, the network serves every namespace of
            the environment that names it (CloudVirt spec.namespaces). The environment's site must
            offer EVPN and have a CloudGateway. A CloudVirt placement is deleted only after no
            namespace of the environment names the network.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The network and the environment it is placed on.
              type: object
              required: [network, backend, ipv4]
              x-kubernetes-validations:
                - rule: >-
                    self.backend.kind != 'CloudAWS' || (has(self.ipv4.prefixLength) ? self.ipv4.prefixLength <= 24
                    : (!isCIDR(self.ipv4.prefix) || cidr(self.ipv4.prefix).prefixLength() <= 24))
                  message: the IPv4 subnet of a CloudAWS placement must be /16 to /24
                - rule: has(self.ipv6) == has(oldSelf.ipv6)
                  message: spec.ipv6 cannot be added or removed
              properties:
                network:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: The HybridNetwork (this namespace) to place. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.network is immutable
                backend:
                  type: object
                  description: The cloud environment (this namespace) the network is placed on. Immutable.
                  required: [kind, name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.backend is immutable
                  properties:
                    kind:
                      description: >-
                        Kind of the environment, CloudOSO, CloudVirt, CloudAWS or CloudGCP.
                      type: string
                      enum: [CloudOSO, CloudVirt, CloudAWS, CloudGCP]
                    name:
                      description: Name of the environment in this namespace.
                      type: string
                      minLength: 1
                      maxLength: 253
                ipv4:
                  type: object
                  description: >-
                    The placement's IPv4 subnet: a size (prefixLength) the platform allocates from the network's
                    IPv4 prefixes, or a pinned prefix inside them (prefix), or both when they agree. A pinned prefix
                    is never replaced by another: one outside the network's space or clashing with the site's own
                    networks is refused, and one held by another placement waits until it is free. Without room the
                    placement waits until the network grows or a placement goes away. The first usable address is
                    the gateway. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.ipv4 is immutable
                    - rule: has(self.prefixLength) || has(self.prefix)
                      message: spec.ipv4 needs prefixLength or prefix
                    - rule: >-
                        !has(self.prefix) || !has(self.prefixLength) || !isCIDR(self.prefix)
                        || cidr(self.prefix).prefixLength() == self.prefixLength
                      message: spec.ipv4.prefix must be as long as spec.ipv4.prefixLength
                  properties:
                    prefixLength:
                      description: >-
                        Size of the subnet the platform allocates, 16 to 29 (for example 24 for a
                        /24).
                      type: integer
                      minimum: 16
                      maximum: 29
                    prefix:
                      description: >-
                        A pinned IPv4 subnet in canonical form (host bits zero, for example
                        10.20.30.0/24), inside one of the network's IPv4 prefixes.
                      type: string
                      maxLength: 18
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked()) == self
                          message: spec.ipv4.prefix must be an IPv4 network prefix in canonical form (host bits zero)
                        - rule: "!isCIDR(self) || (cidr(self).prefixLength() >= 16 && cidr(self).prefixLength() <= 29)"
                          message: spec.ipv4.prefix must be /16 to /29
                ipv6:
                  type: object
                  description: >-
                    The placement's IPv6 subnet (optional), from the network's IPv6 prefixes, by
                    size or pinned as for ipv4. Refused (FamilyUnavailable) where the platform does
                    not offer IPv6 for the environment type. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.ipv6 is immutable
                    - rule: has(self.prefixLength) || has(self.prefix)
                      message: spec.ipv6 needs prefixLength or prefix
                  properties:
                    prefixLength:
                      description: Size of the subnet the platform allocates. Only 64 is accepted.
                      type: integer
                      minimum: 64
                      maximum: 64
                    prefix:
                      description: >-
                        A pinned IPv6 /64 in canonical form, inside one of the network's IPv6
                        prefixes.
                      type: string
                      maxLength: 43
                      x-kubernetes-validations:
                        - rule: isCIDR(self) && cidr(self).ip().family() == 6 && string(cidr(self).masked()) == self
                          message: spec.ipv6.prefix must be an IPv6 network prefix in canonical form (host bits zero)
                        - rule: "!isCIDR(self) || cidr(self).prefixLength() == 64"
                          message: spec.ipv6.prefix must be a /64
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                entity:
                  type: string
                site:
                  type: string
                  description: The site (CloudInfrastructure) the environment runs on.
                cloudGateway:
                  type: string
                  description: The CloudGateway that connects this placement.
                l3Vni:
                  type: integer
                  description: The placement's IP-VRF VNI inside its site.
                l2Vni:
                  type: integer
                  description: The placement's MAC-VRF VNI inside its site (CloudVirt).
                realization:
                  type: object
                  description: How the platform realized the placement (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                mtu:
                  type: integer
                  description: Effective MTU at this placement.
                prefixes:
                  type: array
                  description: The subnets allocated to the placement, IPv4 first. Fixed for the placement's life.
                  items:
                    type: string
                namespaces:
                  type: array
                  description: CloudVirt site namespaces the network serves (the environment's namespaces that name it).
                  items:
                    type: string
                backendReady:
                  type: boolean
                gatewayReady:
                  type: boolean
                validated:
                  type: boolean
                lastValidatedAt:
                  type: string
                  format: date-time
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending placement waits for.
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Backend
          type: string
          jsonPath: .spec.backend.kind
        - name: Environment
          type: string
          jsonPath: .spec.backend.name
        - name: Site
          type: string
          jsonPath: .status.site
        - name: Prefix
          type: string
          jsonPath: .status.prefixes[0]
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
