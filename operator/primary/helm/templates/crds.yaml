apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackmigrations.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: OpenStackMigration
    listKind: OpenStackMigrationList
    plural: openstackmigrations
    singular: openstackmigration
    shortNames:
      - osm
    categories:
      - shc
      - shc-tenant
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Experimental. A VM migration to OpenStack: moves one virtual machine from VMware into an
            OpenStack environment (CloudOSO) of the tenant, comparable to AWS Application Migration
            Service or Azure Migrate. The platform's automation runs the migration with credentials
            it reads from its secret store; the spec holds no secrets.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: What to migrate and where to.
              type: object
              required:
                - vmName
                - cloudoso
              properties:
                source:
                  type: string
                  description: >-
                    Name of the migration provider (a forklift.konveyor.io Provider) that lists the
                    VM.
                providerNamespace:
                  type: string
                  description: Namespace of that provider.
                  default: openshift-mtv
                vmName:
                  type: string
                  description: Virtual machine name to migrate
                cloudoso:
                  type: string
                  description: >-
                    Name of the target OpenStack environment (CloudOSO) in this namespace.
                plan:
                  description: Detailed os-migrate migration plan (Vault refs only — no secrets in spec)
                  type: object
                  properties:
                    source:
                      description: VMware source connection (credentials resolved from Vault)
                      type: object
                      properties:
                        vcenterHost:
                          type: string
                          description: vCenter FQDN or IP (overrides Vault host when set)
                        datacenter:
                          type: string
                          description: VMware datacenter name
                        credentialsSecret:
                          type: string
                          description: Vault KV path for VMware credentials (default vmware-credentials)
                          default: vmware-credentials
                    migrationMethod:
                      type: string
                      description: Data transfer method for os-migrate
                      enum: [nbdkit, virtv2v, cold, warm]
                      default: nbdkit
                    cbt:
                      type: boolean
                      description: Enable VMware changed-block-tracking warm migration
                      default: false
                    conversionHost:
                      description: Destination conversion host on CloudOSO
                      type: object
                      properties:
                        name:
                          type: string
                          description: OpenStack instance name for conversion host
                        address:
                          type: string
                          description: Existing conversion host IP (skip deploy when set)
                        deploy:
                          type: boolean
                          description: Deploy conversion host before migration
                          default: true
                        flavor:
                          type: string
                          description: OpenStack flavor for conversion host
                        network:
                          type: string
                          description: Neutron network for conversion host
                        externalNetwork:
                          type: string
                          description: External network for floating IP
                    targetProject:
                      type: string
                      description: Override OpenStack project name (defaults to CloudOSO project)
                    networkMapping:
                      type: array
                      description: VMware to OpenStack network map for os-migrate
                      items:
                        type: object
                        required:
                          - sourceNetwork
                          - targetNetwork
                        properties:
                          sourceNetwork:
                            description: Network name on the source side.
                            type: string
                          targetNetwork:
                            description: Network name in the target OpenStack project.
                            type: string
                    flavorStrategy:
                      type: string
                      description: How to select target flavor
                      enum: [auto, existing, specify]
                      default: auto
            status:
              description: Observed state of the migration, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the migration.
                  type: string
                namespace:
                  description: Namespace of the migration.
                  type: string
                entity:
                  description: Tenant the migration belongs to.
                  type: string
                source:
                  description: Migration provider the run used.
                  type: string
                vmName:
                  description: Virtual machine being migrated.
                  type: string
                cloudoso:
                  description: Target OpenStack environment.
                  type: string
                targetProject:
                  description: Target OpenStack project.
                  type: string
                migrationMethod:
                  description: Data transfer method the run used.
                  type: string
                phase:
                  type: string
                  description: >-
                    Lifecycle phase, written by the platform: Waiting, Creating, Updating, Ready,
                    Degraded, Failed or Deleting. The steps of the migration are in status.phases.
                phases:
                  type: array
                  description: Steps of the migration, with timestamps.
                  items:
                    description: One step.
                    type: object
                    properties:
                      name:
                        description: Name of the step.
                        type: string
                      status:
                        description: Result of the step.
                        type: string
                        enum: [pending, running, succeeded, failed]
                      startedAt:
                        description: When the step started.
                        type: string
                        format: date-time
                      completedAt:
                        description: When the step finished.
                        type: string
                        format: date-time
                      message:
                        description: What happened in the step, in plain words.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: VM
          type: string
          jsonPath: .spec.vmName
        - name: CloudOSO
          type: string
          jsonPath: .spec.cloudoso
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
