---
- block:
    # shc (P7.3.3): no dependents guard. The environment's namespaces go first (its teardown refuses while they
    # hold VMs); its NetworkPlacements wait for that (networkplacement_delete) and are nudged when it completes.
    - name: Get current timestamp
      ansible.builtin.set_fact:
        cloudvirt_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark CloudVirt as awaiting EDA delete
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudVirt
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          message: Awaiting EDA delete
          lastReconciledAt: "{{ cloudvirt_delete_transition_time }}"

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "CloudVirtDeleteRequested"
        operator_event_action: "Delete"
        operator_event_note: "{{ _hybridsovereign_redhat_cloudvirt.spec | to_json }}"
        operator_reporting_controller: cloudvirt-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: CloudVirt
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_cloudvirt.metadata.uid }}"

    - name: List the placements on this environment
      kubernetes.core.k8s_info:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ ansible_operator_meta.namespace }}"
      register: _cloudvirt_placements
      when: _hybridsovereign_redhat_cloudvirt.status.deletionComplete | default(false) | bool

    - name: Wake the placements that waited for this environment (deletion complete)
      ansible.builtin.include_role:
        name: _common
        tasks_from: nudge_referenced
      vars:
        nudge_targets: >-
          {%- set out = [] -%}
          {%- for p in _cloudvirt_placements.resources | default([])
                if p.spec.backend.kind == 'CloudVirt' and p.spec.backend.name == ansible_operator_meta.name -%}
            {%- set _ = out.append({'kind': 'NetworkPlacement', 'name': p.metadata.name}) -%}
          {%- endfor -%}
          {{ out }}
      when: _hybridsovereign_redhat_cloudvirt.status.deletionComplete | default(false) | bool

    - name: Exit cleanly when EDA completed deletion
      ansible.builtin.meta: end_host
      when: _hybridsovereign_redhat_cloudvirt.status.deletionComplete | default(false) | bool

    - name: Block finalizer until EDA completes deletion
      ansible.builtin.fail:
        msg: Waiting for EDA to complete deletion

  rescue:
    - name: Mark CloudVirt delete as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudVirt
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Deletion failed')) }}"
      ignore_errors: true
      # a delete that waits (for dependents, or for the EDA teardown) is not failed: the status it set stays
      when: not (ansible_failed_result.msg | default('') is match('(Deletion waits for |Waiting for EDA to complete deletion)'))

    - name: Re-raise to signal finalizer failure
      ansible.builtin.fail:
        msg: "CloudVirt {{ ansible_operator_meta.name }} deletion failed — see status.message for details"
