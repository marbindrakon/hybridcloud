{{- if .Values.crunchy.enabled }}
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.crunchy.name | default "quay-pgcluster" }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  postgresVersion: 16
  instances:
    - name: pgha
      replicas: {{ .Values.crunchy.instances | default 2 }}
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.crunchy.storage | default "20Gi" }}
  backups:
    pgbackrest:
      # Backups run on a schedule and old ones expire. Without a schedule the repository keeps every write-ahead
      # log since the first backup, fills, and the database stops when it can no longer archive.
      global:
        repo1-retention-full: {{ ((.Values.crunchy.backup).retentionFull | default 2) | quote }}
        repo1-retention-full-type: count
      # A full backup on demand: annotate the PostgresCluster with postgres-operator.crunchydata.com/pgbackrest-backup
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: {{ ((.Values.crunchy.backup).fullSchedule | default "40 1 * * 0") | quote }}
            differential: {{ ((.Values.crunchy.backup).differentialSchedule | default "40 1 * * 1-6") | quote }}
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: {{ .Values.crunchy.backupStorage | default "20Gi" }}
  users:
    - name: quay
      databases:
        - quay
      options: "SUPERUSER"
{{- end }}
