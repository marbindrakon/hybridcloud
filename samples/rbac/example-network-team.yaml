# An access group (Rbac). Members sign in with the group example-corp.example-network-team; the platform team
# adds people to example-corp/example-network-team in the sign-in directory.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Rbac
metadata:
  name: example-network-team
  namespace: entity-example-corp
spec:
  description: People who build Example Corp's networks and VM environments.
