cluster:
  # <name>.<baseDomain> is the cluster domain: api.<name>.<baseDomain>, *.apps.<name>.<baseDomain>
  name: ""
  baseDomain: ""

# Two layers so one cluster can run them as two Argo CD Applications: "base" has no Vault
# dependency and goes first (it installs ESO); "certs" needs the ClusterSecretStore, which comes
# after ESO, for the TSIG key. A single release with both true is fine once the store exists.
layers:
  base: true
  certs: true
  # The ops section renders with the base layer, or alone with ops: true (central, which has no
  # base layer from this chart).
  ops: false

# ─── cert-manager Operator for Red Hat OpenShift ────────────────────────────
certManager:
  enabled: true
  subscription:
    channel: stable-v1
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  # DNS-01 self-check against a recursive resolver only (the zone primary is not reachable as a
  # recursor). Empty = operator default.
  recursiveNameservers: ""

# ─── Let's Encrypt ClusterIssuer (DNS-01 over RFC 2136) — layer "certs" ──────
letsencrypt:
  enabled: true
  issuerName: letsencrypt-shc
  server: https://acme-v02.api.letsencrypt.org/directory
  email: ""
  dnsZones: []
  rfc2136:
    nameserver: ""          # host:port of the zone primary
    tsigKeyName: ""         # with trailing dot
    tsigAlgorithm: HMACSHA256
  # TSIG secret (key "secret") in the cert-manager namespace, from Vault through ESO.
  tsigSecret:
    name: shc-acme-tsig
    secretStoreName: vault-backend
    vaultKey: ""            # KV path relative to the store, property "secret"
  # ACME account key. With vaultKey set, every cluster shares one platform account (one CAA
  # accounturi); empty = cert-manager registers a new account for this cluster.
  account:
    secretName: letsencrypt-shc-account
    vaultKey: ""            # property "tls.key"

# ─── API and default-ingress certificates — layer "certs" ────────────────────
certificates:
  privateKey:
    algorithm: ECDSA
    size: 256
  api:
    # Named certificate for api.<cluster>. Clients that pinned the installer's CA must trust the
    # public roots too: the Hive admin kubeconfig and Vault's kubernetes auth for remote clusters.
    enabled: true
  ingress:
    enabled: true

# ─── chrony (MachineConfig per pool) ────────────────────────────────────────
timesync:
  enabled: true
  servers: []
  # Pools to configure; names match install-time manifests (99-<role>-chrony) so the chart
  # adopts them without a reboot.
  roles:
    - master
    - worker
  ignitionVersion: 3.4.0

# ─── External Secrets Operator for Red Hat OpenShift ─────────────────────────
externalSecrets:
  enabled: true
  namespace: external-secrets-operator
  subscription:
    name: openshift-external-secrets-operator
    channel: stable-v1
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  # ExternalSecretsConfig "cluster" spec. The operands run behind deny-all NetworkPolicies:
  # add egress to the secret backend under controllerConfig.networkPolicies.
  config:
    spec: {}

# ─── Cluster monitoring config ───────────────────────────────────────────────
monitoring:
  enabled: true
  userWorkload: true
  # Empty storageClass = no PVCs (emptyDir), as on a cluster without a default StorageClass.
  storageClass: ""
  prometheus:
    retention: 7d
    size: 50Gi
  alertmanager:
    size: 10Gi

# ─── Operations: backups, seal token check, alert rules (layer base or ops) ──
ops:
  enabled: true
  namespace: shc-ops
  # curl, sed, coreutils, chroot; the cluster pull secret covers registry.redhat.io
  image: registry.redhat.io/ubi9/ubi-minimal:latest
  # cluster-backup.sh on one control-plane node, kept on that node's disk
  etcdBackup:
    enabled: true
    schedule: "0 1 * * *"     # UTC
    keep: 7
    hostDir: /var/lib/etcd-backup
  # Raft snapshots of this cluster's platform Vault into a PVC. The Vault side (policy reading
  # sys/storage/raft/snapshot, a Kubernetes auth role for <namespace>/vault-snapshot) is
  # bootstrap.sh vault-snapshot-auth.
  vaultSnapshot:
    enabled: false
    schedule: "30 1 * * *"
    vaultAddr: ""             # e.g. http://vault-active.central-vault.svc:8200
    authMount: kubernetes
    role: shc-vault-snapshot
    keep: 14
    size: 5Gi
    storageClass: ""
  # Daily lookup of the transit seal token's remaining TTL on the lab Vault (D7)
  transitTokenCheck:
    enabled: false
    namespace: ""             # the platform Vault's namespace (holds the token Secret)
    secretName: vault-transit-token
    labVaultAddr: ""
    minTTLDays: 7
    schedule: "15 6 * * *"
  # Tenancy health (files/shc_tenancy.py), on the cluster that holds the hybridsovereign.redhat CRs:
  # dispatch re-drive, the tenants' ControllerAvailable/DeliveryStalled conditions, status.phase backfill
  # and a slow re-check of failed objects of kinds without a periodic re-run. Problems surface as
  # ShcBackupJobFailed; the tenant controllers also have their own alerts (ShcTenantController*).
  shcTenancy:
    enabled: false
    schedule: "*/5 * * * *"
    # python3 + kubernetes client + PyYAML
    image: quay.signal9.gg/shc/ansible-runner:latest
    config:
      redrive:
        ackTimeoutMinutes: 10
        jobTimeoutMinutes: 30
        publishFailedMinutes: 15
        maxRedrives: 3
        # kinds whose jobs are idempotent (create-if-absent); others are only reported
        redriveKinds: [Entity, Team, Project, Persona, AAPOrg, QuayOrg, RbacConfig, AAPConfig, QuayConfig, VaultKV, Assignment]
        # a job still JobRunning this long after its start without its final status write is reported
        # (NoCompletion, DeliveryStalled); per kind jobFinishedMinutes, else the kind's jobTimeoutMinutes
        jobFinishedMinutes: 10
        kinds:
          PlatformOpenshift: {jobTimeoutMinutes: 150}
          CloudOSO: {jobTimeoutMinutes: 150}
          # jobs that wait on cloud or fabric work for minutes
          CloudAWS: {jobFinishedMinutes: 30}
          CloudGCP: {jobFinishedMinutes: 30}
          CloudGateway: {jobFinishedMinutes: 30}
          HybridFabric: {jobFinishedMinutes: 30}
          HybridNetwork: {jobFinishedMinutes: 30}
          NetworkPlacement: {jobFinishedMinutes: 30}
          CloudVirt: {jobFinishedMinutes: 30}
          AttachmentCircuit: {jobFinishedMinutes: 30}
          ProviderEdge: {jobFinishedMinutes: 30}
          TransportLink: {jobFinishedMinutes: 30}
      tenancy:
        unavailableMinutes: 2
        restartWindowMinutes: 15
        restartThreshold: 3
        deliveryStalledMinutes: 15
        # a new Entity's controller starts after its namespace exists: not reported for this long after creation
        newEntityGraceMinutes: 10
      # write: false only reports the objects whose stored phase differs
      phase:
        write: false
      failedRecheck:
        enabled: true
        intervalMinutes: 30
        maxRechecks: 6
      # a finished teardown (deletionComplete) whose finalizer is still set: wake its controller after
      # afterMinutes, report it after problemMinutes
      finalizerRelease:
        enabled: true
        afterMinutes: 2
        problemMinutes: 30
      # the VirtualMachine lists of the environments on a Ready OpenShift site (CloudVirt status.virtualMachines):
      # older than intervalMinutes, the site's probe is woken to refresh them (at most once per interval per site)
      vmRefresh:
        enabled: true
        intervalMinutes: 10
        maxSitesPerRun: 10
  # Former name of shcTenancy (its config = shcTenancy.config.redrive); read for one release.
  edaRedrive:
    enabled: false
  # Tenant cloud orphan check (LAB-PLAN §11.6 phase D, design/TENANT-TEARDOWN.md §3.5): report-only,
  # on the cluster that holds the CloudOSO/PlatformOpenshift CRs (services). Findings fail the job
  # (ShcBackupJobFailed). Scope: the tenant Keystone domain and the tenant DNS zone.
  tenantOrphanCheck:
    enabled: false
    schedule: "45 5 * * *"
    # python3 + openstacksdk + kubernetes client + PyYAML
    image: ""
    # central Vault key with the tenant admin's clouds.yaml (property clouds.yaml), via secretStore
    accountVaultKey: ""
    secretStore: vault-backend
    config:
      domain: ""
      # CloudInfrastructure name of the cloud the account belongs to; CloudOSOs on other clouds are
      # not compared with its projects. Empty = every CloudOSO.
      cloudInfrastructure: ""
      ignoreProjects: []
      dnsZoneId: ""
      dnsProjectId: ""
  # External check of the shared OIDC issuers through their public URL (LAB-PLAN §9 Detection). Enable it on a
  # cluster other than the one that serves them.
  issuerProbe:
    enabled: false
    schedule: "*/5 * * * *"
    image: registry.redhat.io/openshift4/ose-tools-rhel9:latest   # curl + jq
    baseURL: https://oidc.shc.signal9.gg
    issuers: []                 # names under baseURL, e.g. [central, spire]
  certManagerMetrics:
    enabled: true
  alerts:
    enabled: true
    staleHours: 26
    certExpiryDays: 14
    vaultNamespaces: "central-vault|services-vault"
    oidcSyncNamespace: shc-oidc   # where the oidc-issuer sync CronJob runs (central)
    # etcd on virtual or network-backed disks: warns well before OpenShift's own etcd alerts
    # (fsync p99 > 0.5 s / 1 s for 10 min, more than 5 leader changes in 10 min)
    etcd:
      enabled: true
      fsyncP99Seconds: 0.1   # WAL fsync p99 (5 min rate), sustained for 5 min
      leaderChanges: 2       # within 30 min, outside etcd and machine-config rollouts
  # The platform's own health (templates/platform-health.yaml, docs/platform/platform-alerts.md): alert rules in the
  # cluster's monitoring, and two small checks where no metric exists. Each switch renders its rules or its CronJob
  # only when on; all are off by default. Alerts reach a person only through a receiver of the cluster monitoring's
  # Alertmanager, which the installation configures (OpenShift's own alert AlertmanagerReceiversNotConfigured warns
  # while there is none).
  platformHealth:
    # Persistent volumes filling up, read from the kubelet's volume statistics. OpenShift's own alert already covers
    # its namespaces, hence the default exclusion.
    volumes:
      enabled: false
      namespaces: ".+"                               # regular expression of the namespaces watched
      excludeNamespaces: "openshift-.*|kube-.*|default"
      warningPercent: 80
      criticalPercent: 90
      fullWithinDays: 3                              # critical when the present rate fills the volume in this time
      rateWindow: 6h                                 # the rate is the trend over this window
      fillsSoonMinPercent: 50                        # ... and only once it is this full (a backup's burst is not a trend)
    # Backups of the platform's PostgreSQL databases: the backup CronJobs the database operator creates for each
    # scheduled backup (<cluster>-<repository>-full, -diff, -incr). Suspended CronJobs (a database shut down or a
    # standby) are left out.
    databaseBackups:
      enabled: false
      namespaces: ".+"
      failedFor: 3h                                  # the last run has not succeeded for this long
      overdueHours:                                  # no success for this long; keep above each schedule's period
        full: 192
        diff: 50
        incr: 50
      # a database with a backup repository volume but no scheduled full backup, for this long
      notScheduledFor: 6h
    # An aggregated API (an APIService served by a pod) unavailable: namespace deletes hang meanwhile. Fires while it
    # has been unavailable for `for`, or while it was unavailable for at least unavailableFraction of the last
    # flapWindow (an API that keeps dropping out; only once the APIService has existed for a whole flapWindow), held
    # for `for`.
    aggregatedAPIs:
      enabled: false
      names: ".+"                                    # regular expression of the APIService names watched
      for: 10m
      flapWindow: 1h
      unavailableFraction: 0.5
    # The event activations of the automation platform (files/eda_activations.py), on the cluster that runs it:
    # a watched activation (enabled, restart policy `always`) that does not run is restarted (one call), at most
    # maxRepairsPerHour times an hour each; the count is kept in the ConfigMap eda-activations-state of ops.namespace.
    # A disabled activation is never touched. A second CronJob (eda-api-check) reports an event-automation API that
    # does not answer (while it does, the activation alert stays quiet: one fault, one alert).
    edaActivations:
      enabled: false
      schedule: "*/5 * * * *"
      apiCheckSchedule: "*/5 * * * *"
      # the API check quiets the activation alert only while it was scheduled within this many minutes (keep it
      # above the interval of apiCheckSchedule): a suspended or stopped API check never hides it
      apiCheckScheduledWithinMinutes: 10
      # python3 (3.9 or later, standard library only)
      image: registry.redhat.io/ubi9/python-312-minimal:latest
      url: ""                       # the platform gateway's base URL (https), e.g. https://automation.example.com
      automationNamespace: ""       # the namespace where the platform runs the activation Jobs
      # Secret in ops.namespace with key token (a bearer token), or keys username and password. The account needs to
      # view and restart the activations (docs/platform/platform-alerts.md names the role).
      credentialSecret: ""
      caConfigMap: ""               # ConfigMap in ops.namespace with key ca.crt when the gateway's CA is private
      maxRepairsPerHour: 3
      maxRepairsPerDay: 6           # more restarts of one activation in a day: reported although each one worked
      allowNoActivations: false     # an empty activations list is reported (an account that sees none) unless true
      notRunningMinutes: 4          # not running on two runs this far apart before a restart
      transitionalMinutes: 10       # pending, starting or stopping this long counts as not running
      startTimeoutSeconds: 180
      # status messages of an activation that cannot run as it is (reported, never restarted)
      cannotRunPatterns: ["pull failed", "container request is not valid"]
      # remove the older Job when one activation has two running Jobs and its latest instance runs (also grants
      # deleting Jobs in automationNamespace)
      removeStaleJobs: false
      alertFor: 10m
      staleMinutes: 60              # no successful run for this long, or the CronJob suspended: alerted (keep it
                                    # well above the schedule's interval)
    # A write to each listed Keycloak's database (files/identity_write_probe.py): in a dedicated realm, a client's
    # service account updates its own user through the Admin API. Turn it on per Keycloak;
    # docs/platform/platform-alerts.md says what to create.
    identityWriteProbe:
      enabled: false
      schedule: "*/5 * * * *"
      image: registry.redhat.io/ubi9/python-312-minimal:latest
      alertFor: 10m
      staleMinutes: 60
      # [{name, url (https), realm, clientId, credentialSecret, attribute (default lastName), caConfigMap}]; the
      # Secret, in ops.namespace, holds the client's secret under the key clientSecret
      keycloaks: []
    # The report behind the admin dashboard's platform-health banner (files/platform_health_report.py): every
    # interval, this cluster's firing platform alerts (names starting with Shc, read from the cluster monitoring's
    # Alertmanager) and the findings of the checks' last failed runs, written as the key report.json of the
    # ConfigMap shc-platform-health-<cluster> in `namespace` of the services cluster. The services cluster makes
    # that ConfigMap for itself and for each of `writers`, and the index shc-platform-health that lists them; each
    # cluster only patches its own. It does not replace sending the alerts to the installation's Alertmanager.
    report:
      enabled: false
      cluster: ""                   # the cluster's name as the banner shows it; empty = cluster.name
      intervalMinutes: 5            # one of 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30
      image: registry.redhat.io/ubi9/python-312-minimal:latest
      # the platform namespace of the services cluster, where the dashboard reads the banner's ConfigMaps: the admin
      # dashboard chart's `namespace`
      namespace: ""
      # true on the services cluster (the writer uses its own service account); false on any other cluster, which
      # then needs servicesCluster. No default.
      onServicesCluster: null
      # another cluster only: a Secret in ops.namespace holding the services cluster's API address (https), a bearer
      # token of an account allowed to write (see writers) and, when the API's certificate is not publicly trusted,
      # its CA bundle. The settings name the Secret and its keys.
      servicesCluster:
        secret: ""
        serverKey: ""
        tokenKey: ""
        caKey: ""                   # empty = the image's trust store
      # the services cluster only: names of the other reporting clusters (each its `cluster` setting). Each gets the
      # ConfigMap shc-platform-health-<name>, a service account platform-health-writer-<name> in ops.namespace with a
      # token Secret of the same name, allowed to get and patch that ConfigMap only; its token goes into that
      # cluster's servicesCluster Secret.
      writers: []
      # the services cluster only: groups allowed to read the banner's ConfigMaps (the platform admins who see it)
      readerGroups: []
      # true: alertsDelivered says whether OpenShift's AlertmanagerReceiversNotConfigured is firing; false: null
      receiverCheck: false
  # fabric health metrics and alerts (templates/fabric-health.yaml): on the cluster that holds the HybridFabric and
  # CloudGateway objects. A kube-state-metrics instance of its own (custom resource state only) and the rules
  # shc-fabric-health. Off: nothing of it is rendered.
  fabricHealth:
    enabled: false
    # kube-state-metrics with custom resource state (2.9 or later: it reads RFC 3339 times as Unix seconds); take the
    # cluster's minor version
    image: registry.redhat.io/openshift4/ose-kube-state-metrics-rhel9:v4.22
    scrapeInterval: 60s
    alerts:
      nodeUnhealthyFor: 2m
      driftFor: 30m
      siteSessionsFor: 10m
      # a node without a session with the hub's router on its platform circuits (the service VRF)
      serviceSessionsFor: 10m
      # a network's session over its service link (the service VRF to the network's VRF) down on a node whose platform
      # circuit is up
      serviceLinksFor: 10m
      # as the realization's egress.ipv6.sessionDownAlertMinutes (default 5)
      upstreamDownFor: 5m
      # no health run reported for this many of its intervals (the schedule, AAP or the job broken)
      staleIntervals: 3
      # runs report but the nodes were not read for this many intervals (changes held the lease): above an ordinary
      # rollout's back-to-back jobs (tens of minutes), below a lease that is never released
      notReadIntervals: 9
      poolFreePercent: 10

# ─── Fabric underlay (P7.2) — layer "certs" ──────────────────────────────────
# EVPN underlay of an IaaS cluster (templates/fabric.yaml): NMState operator + per-node VTEP VLAN interface and
# fabric routes, CNO FRR + route advertisements, per-node FRRConfiguration to the route reflectors. Off by default.
fabric:
  enabled: false
  asn: 65010
  routeReflectors: []        # standalone route reflectors, e.g. [172.18.234.11, 172.18.234.12]
  gateways: []               # the fabric's CloudGateway addresses on this site's underlay (with BFD)
  bfd: {receiveInterval: 300, transmitInterval: 300, detectMultiplier: 3}
  password:
    secretStoreName: vault-backend
    vaultKey: fabric/bgp     # property "password"
  nmstate:
    channel: stable
  vtepInterface:
    base: bond0              # the fabric bond
    vlan: 0                  # the site's fabric VLAN
    mtu: 9000
    prefixLength: 24
  gateway: ""                # the site's fabric gateway (.1)
  routes: []                 # the other fabric subnets, via the gateway
  absentRoutes: []           # destinations to remove from the VTEP interface (NMState keeps routes left out of routes)
  nodes: []                  # [{name: <node>, vtepIP: <address>}]
  # OVN-K creates the EVPN SVIs at 1500 and shrinks them whenever a network is added (templates/evpn-svi-mtu.yaml):
  # a node service keeps them at the overlay MTU. MachineConfig per pool (one reboot when first enabled).
  sviMtu:
    enabled: false
    mtu: 9000
    roles: [master, worker]

# ─── Tenant access (P7.3.7) — layer "certs" ──────────────────────────────────
# Tenant sign-in through the platform's tenant realm, no self-provisioning, and the CloudVirt network guard
# (templates/tenant-access.yaml).
tenantAccess:
  enabled: false
  identityProvider:
    # also the last path segment of the client's redirect URI (/oauth2callback/<name>)
    name: sovereign-tenants
    issuer: ""
  clientId: ""              # default openshift-<cluster.name>
  clientSecret:
    name: tenant-oidc-client
    secretStoreName: vault-backend
    vaultKey: ""            # default clusters/<cluster.name>/tenant-oidc (property clientSecret)
  # false: nobody may create projects (the self-provisioners binding is emptied)
  selfProvisioners: false
  # admission policy: in namespaces labelled hybridsovereign.redhat/cloudvirt, only system identities and
  # cluster admins may manage NetworkAttachmentDefinitions and UserDefinedNetworks
  networkGuard: true

# ─── Project self-provisioning — layer "certs" ───────────────────────────────
# restricted true: only the groups listed here may create projects (templates/self-provisioners.yaml replaces the
# self-provisioners ClusterRoleBinding; an empty list leaves it to cluster admins). restricted false leaves the
# cluster default (every signed-in user), unless tenantAccess.enabled with tenantAccess.selfProvisioners false,
# which implies restricted with no groups.
selfProvisioning:
  restricted: false
  groups: []

# ─── Tenant DNS controller (TENANT-DNS D3) — layer "certs" ───────────────────
# Tenants publish names in their CloudVirt environment's zone with DNSEndpoint objects and external-dns hostname
# annotations on Services/Routes (templates/tenant-dns.yaml, files/tenant_dns_controller.py). Installs the
# DNSEndpoint CRD (schema only). Reverse names: an AAAA address inside the namespace's placement prefixes (platform
# annotation hybridsovereign.redhat/ipv6-prefixes) gets a forward-confirmed PTR in the DNS project's reverse zone
# (*.ip6.arpa, created by the platform; no reverse zone = no PTRs). Health: the ConfigMap tenant-dns-status in
# `namespace` {lastSuccess, lastError, lastErrorAt, refused, ptrs}, read by the platform's site job
# (status.realization.tenantDns and the site's TenantDns condition).
tenantDns:
  enabled: false
  namespace: shc-tenant-dns
  # python3 + openstacksdk + kubernetes client + PyYAML
  image: ""
  account:
    secretStoreName: vault-backend
    # central Vault key with the DNS-only account's clouds.yaml (property clouds.yaml), scoped to the zones' project
    vaultKey: dns/tenant-designate
  config:
    domain: ""              # the global tenant domain; environment zones are zoneDepth labels below it
    zoneDepth: 2            # <cloudvirt>.<entity>.<domain>
    defaultTTL: 300
    resyncSeconds: 300
    types: [A, AAAA, CNAME, TXT, MX, SRV, CAA]
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {memory: 256Mi}
