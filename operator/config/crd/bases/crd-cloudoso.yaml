apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudosos.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "3"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudOSO
    listKind: CloudOSOList
    plural: cloudosos
    singular: cloudoso
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            CloudOSO declares OpenStack/Routed53 environment prerequisites and
            creates an OSOHelper (type environmentprep) on the central cluster
            while exposing observed helper outputs and Namespace entity metadata on status.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: >-
                Desired helper inputs forwarded to OSOHelper spec.environmentprep
                on the central cluster.
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                cloudRef:
                  type: object
                  description: >-
                    The platform CloudInfrastructure (type openstack, namespace sovereign-cloud) the project is
                    created on. It supplies the infrastructure credential and every site setting (projectDomain,
                    externalNetwork, DNS, region); with a cloudRef in effect those spec fields below are ignored.
                    Default: the installation's default site. Immutable once set.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.cloudRef is immutable
                  properties:
                    name:
                      type: string
                      maxLength: 253
                project:
                  type: string
                  description: OpenStack project name hint (required)
                vaultPath:
                  type: string
                  description: >-
                    Legacy, ignored with a cloudRef in effect. Vault path of the platform's
                    OpenStack account (property clouds.yaml; a tenant domain manager).
                baseDomain:
                  type: string
                  description: >-
                    Base DNS domain. With Designate the environment gets <name>.<entity>.<baseDomain>
                    inside the zone designateZoneId. Ignored with a cloudRef in effect. Default: the installation default.
                projectDomain:
                  type: string
                  description: "Keystone domain for the project. Ignored with a cloudRef in effect. Default: the installation default."
                externalNetwork:
                  type: string
                  description: "External Neutron network for the floating IPs. Ignored with a cloudRef in effect. Default: the installation default."
                regionName:
                  type: string
                  description: "OpenStack region. Default: the account's clouds.yaml region."
                dnsProvider:
                  type: string
                  description: >-
                    DNS for the environment's clusters: designate (designateZoneId + designateProjectId)
                    or route53 (route53VaultPath). Ignored with a cloudRef in effect. Default: the installation default, else
                    designate when designateZoneId is set.
                  enum: [designate, route53, none]
                route53VaultPath:
                  type: string
                  description: Vault path for Route53 credentials (e.g. oso/accounts/route53-openstack)
                landingzone:
                  type: string
                  description: Landing Zone template name
                  default: default
                designateZoneId:
                  type: string
                  description: "Designate zone id for the environment's records. Ignored with a cloudRef in effect. Default: the installation default."
                designateProjectId:
                  type: string
                  description: >-
                    Project owning the Designate zone (the account needs member there). Default: the
                    installation default. Ignored with a cloudRef in effect.
                enableVRF:
                  type: boolean
                  description: Enable VRF networking for this environment (passed to provisioning; no effect until implemented)
                  default: false
                vrfId:
                  type: string
                  description: VRF identifier when enableVRF is true
            status:
              description: Observed OSOHelper outputs, Namespace labels/annotations, and readiness.
              type: object
              properties:
                name:
                  type: string
                namespace:
                  type: string
                entity:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
                route53ZoneId:
                  type: string
                apiVIP:
                  type: string
                ingressVIP:
                  type: string
                externalNetwork:
                  type: string
                billingId:
                  type: string
                description:
                  type: string
                osoHelperName:
                  type: string
                  description: Name of the OSOHelper CR created in central cluster
                osoHelperCreated:
                  type: boolean
                  description: Whether the OSOHelper CR was created successfully
                centralApiServer:
                  type: string
                  description: Central cluster API server URL
                projectName:
                  type: string
                  description: OpenStack project name created by OSOHelper
                projectId:
                  type: string
                  description: OpenStack project ID returned by OSOHelper
                domainId:
                  type: string
                  description: OpenStack domain ID from OSOHelper
                domainName:
                  type: string
                  description: OpenStack domain name from OSOHelper
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Project
          type: string
          jsonPath: .status.projectName
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
