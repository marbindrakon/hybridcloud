apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformopenshifts.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "2"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: PlatformOpenshift
    listKind: PlatformOpenshiftList
    plural: platformopenshifts
    singular: platformopenshift
    shortNames:
      - ocpcluster
    categories:
      - shc
      - shc-tenant
      - shc-appplatform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An OpenShift cluster the platform installs and manages for the tenant in one of its
            environments, comparable to Red Hat OpenShift Service on AWS, Google Kubernetes Engine
            or Azure Red Hat OpenShift. spec.type names the environment type, and the block of the
            same name says which environment and what size.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The cluster.
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                type:
                  type: string
                  description: Environment type the cluster runs in; set the block of the same name.
                  enum: [openstack, aws, gcp]
                openstack:
                  type: object
                  description: Cluster in an OpenStack environment.
                  properties:
                    environment:
                      type: string
                      description: Name of the OpenStack environment (CloudOSO) in this namespace.
                    controlPlaneCount:
                      type: integer
                      description: >-
                        Number of control plane nodes. Default: the installation's default, else 3.
                      minimum: 1
                    workerCount:
                      type: integer
                      description: >-
                        Number of worker nodes; 0 makes a compact cluster. Default: the
                        installation's default, else 3.
                      minimum: 0
                    controlPlaneFlavor:
                      type: string
                      description: >-
                        OpenStack flavor of the control plane nodes. Default: the installation's
                        default.
                    workerFlavor:
                      type: string
                      description: >-
                        OpenStack flavor of the worker nodes. Default: the installation's default.
                    externalNetwork:
                      type: string
                      description: >-
                        External network of the cluster's floating IPs. Default: the environment's.
                    ocpImageSet:
                      type: string
                      description: >-
                        OpenShift release to install (a cluster image set name). Default: the
                        installation's default.
                    pullSecretVaultPath:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Location of the pull secret in the platform's
                        secret store.
                    pullSecretVaultProperty:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Property that holds the pull secret at that
                        location.
                    sshKeyVaultPath:
                      type: string
                      description: >-
                        Set by the platform; leave unset. Requests from tenant users that set or
                        change it are refused, or accepted with a warning, depending on the
                        platform's admission settings. Location of the nodes' SSH key pair in the
                        platform's secret store.
                    glanceImageOverride:
                      type: string
                      description: >-
                        Existing image for the nodes. Empty: the installer uploads the release's
                        image.
                    trustBundle:
                      type: string
                      description: Additional trusted CA certificates (PEM) for the cluster.
                aws:
                  type: object
                  description: Cluster in an AWS environment.
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: Name of the AWS environment (CloudAWS) in this namespace.
                    network:
                      type: string
                      description: "HybridNetwork (same namespace) whose NetworkPlacement in the environment hosts the cluster's machines; unset: the cluster gets a network of its own"
                    publish:
                      type: string
                      description: "How the cluster's API and ingress are published: External (internet-facing load balancers) or Internal (reachable only from the cluster's network)"
                      enum: [External, Internal]
                      default: External
                    region:
                      type: string
                      description: "AWS region; must be the environment's region (default: the environment's region)"
                    clusterType:
                      type: string
                      description: "Cluster topology type"
                      default: standalone
                      enum: [standalone, ha]
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                    workerCount:
                      type: integer
                      description: "Worker node count"
                      default: 2
                    controllerFlavor:
                      type: string
                      description: "AWS instance type for control plane"
                      default: m5.xlarge
                    workerFlavor:
                      type: string
                      description: "AWS instance type for workers"
                      default: m5.large
                gcp:
                  type: object
                  description: Cluster in a Google Cloud environment.
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: >-
                        Name of the Google Cloud environment (CloudGCP) in this namespace.
                    network:
                      type: string
                      description: "HybridNetwork (same namespace) whose NetworkPlacement in the environment hosts the cluster's machines; unset: the cluster gets a VPC of its own"
                    publish:
                      type: string
                      description: "How the cluster's API and ingress are published: External (internet-facing load balancers) or Internal (reachable only from the cluster's network)"
                      enum: [External, Internal]
                      default: External
                    region:
                      type: string
                      description: "Google Cloud region; must be the environment's region (default: the environment's region)"
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                    workerCount:
                      type: integer
                      description: "Worker node count"
                      default: 2
                    controllerFlavor:
                      type: string
                      description: "Machine type for control plane"
                      default: n2-standard-4
                    workerFlavor:
                      type: string
                      description: "Machine type for workers"
                      default: n2-standard-4
                toolRbac:
                  description: >-
                    Access on the new cluster. Each field lists access groups (Rbac names in this
                    namespace).
                  type: object
                  properties:
                    clusterAdminRbac:
                      description: Access groups whose members get cluster-admin on the cluster.
                      type: array
                      items:
                        type: string
                    clusterOperatorRbac:
                      description: >-
                        Access groups whose members can manage workloads and power state on the
                        cluster, without changing its access.
                      type: array
                      items:
                        type: string
                    clusterDeveloperRbac:
                      description: >-
                        Access groups whose members can deploy applications in the namespaces
                        assigned to them.
                      type: array
                      items:
                        type: string
                    clusterViewerRbac:
                      description: Access groups whose members get read-only access to the cluster.
                      type: array
                      items:
                        type: string
                clusterViewerRbac:
                  description: >-
                    Access groups whose members can read this object on the services cluster.
                    Distinct from toolRbac.clusterViewerRbac, which gives read access on the cluster
                    itself.
                  type: array
                  items:
                    type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the cluster object.
                  type: string
                namespace:
                  description: Namespace of the cluster object.
                  type: string
                entity:
                  description: The tenant this cluster belongs to.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                description:
                  description: The tenant's description.
                  type: string
                platformType:
                  description: Environment type of the cluster.
                  type: string
                slug:
                  description: Short unique name of the cluster, used in its DNS names.
                  type: string
                domain:
                  description: Base DNS domain of the cluster.
                  type: string
                apiURL:
                  description: URL of the cluster's API.
                  type: string
                appsURL:
                  description: Wildcard domain of the cluster's applications.
                  type: string
                consoleURL:
                  type: string
                  description: URL of the cluster's web console.
                adminPasswordVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                kubeconfigVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                secretsVaultPath:
                  type: string
                  description: Not written any more; removed from older objects.
                clusterVersion:
                  type: string
                  description: OpenShift version of the cluster.
                powerState:
                  type: string
                  description: Power state of the cluster (Running, Hibernating, ...).
                clusterHealth:
                  type: string
                  description: Overall health of the cluster.
                provisionStatus:
                  type: string
                  description: Installation status.
                acmAvailable:
                  type: boolean
                  description: True when the platform's cluster management reaches the cluster.
                acmJoined:
                  type: boolean
                  description: True when the cluster has joined the platform's cluster management.
                clusterInstalled:
                  type: boolean
                  description: True when the installation is complete.
                oidcConfigured:
                  type: boolean
                  description: >-
                    True when sign-in with the platform identity is set up on the cluster.
                oidcClientId:
                  type: string
                  description: Client of the cluster in the platform's sign-in directory.
                awsHelperName:
                  description: No longer set.
                  type: string
                awsRegion:
                  description: AWS region of the cluster.
                  type: string
                gcpProject:
                  description: Google Cloud project of the cluster.
                  type: string
                gcpRegion:
                  description: Google Cloud region of the cluster.
                  type: string
                status:
                  type: string
                  description: Short state word written by the platform's automation.
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: When the platform last finished processing this object (RFC 3339).
                message:
                  type: string
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: string
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Health
          type: string
          jsonPath: .status.clusterHealth
        - name: Power
          type: string
          jsonPath: .status.powerState
        - name: Version
          type: string
          jsonPath: .status.clusterVersion
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
