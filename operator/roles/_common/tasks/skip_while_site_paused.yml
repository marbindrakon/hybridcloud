---
# A paused site (CloudInfrastructure spec.paused) is neither probed nor realized: its job records it Ready=False/Paused,
# and what is on it (its CloudGateway, the environments and placements on it) waits with Ready=False/SitePaused and
# keeps its last state. Publishing such an object again on its reconcilePeriod only starts a job that finds the site
# still paused and writes the same status. This ends the reconcile, without touching status, while a paused site
# holds the object's processed spec:
#   - no Retry-now request (paused_hold_force, the role's reconcile_now; a wake from another job is one too),
#   - its current spec was processed (status.observedGeneration >= metadata.generation; a spec change publishes,
#     also the pause switch itself),
#   - its Ready condition says SitePaused and its site's CloudInfrastructure, read now (site_paused_now.yml), still
#     has spec.paused; or Paused on a CloudInfrastructure whose spec.paused is still set.
# A delete runs the kind's finalizer role, not this. What resumes a held object: the site's job wakes everything held
# on it once the resumed site is probed ready (cloudinfrastructure_provision, "Wake the ones pending on it"); without
# that wake (lost, or listed before the object wrote SitePaused) the object's own next reconcile finds the site no
# longer paused and publishes. A held deletion resumes the same two ways (publish_operator_event).
# Vars: paused_hold_cr (the role's CR), paused_hold_force (the role's reconcile_now).
- name: Decide whether this object reports a hold by a paused site
  ansible.builtin.set_fact:
    _paused_hold_reported: >-
      {%- set obj = paused_hold_cr | default({}, true) -%}
      {%- set meta = obj.metadata | default({}, true) -%}
      {%- set st = obj.status | default({}, true) -%}
      {%- set ready = (st.conditions | default([], true) | selectattr('type', 'equalto', 'Ready') | list + [{}]) | first -%}
      {%- set reason = ready.reason | default('', true) | string -%}
      {%- set generation = meta.generation | default(0, true) | int -%}
      {%- set observed = st.observedGeneration | default(0, true) | int -%}
      {%- set site_paused = (obj.spec | default({}, true)).paused | default(false, true) | bool -%}
      {{ not (paused_hold_force | default(false) | bool)
         and meta.deletionTimestamp is not defined
         and generation > 0 and observed >= generation
         and (reason == 'SitePaused' or (reason == 'Paused' and site_paused)) }}
    # a dependant's record may be older than the resume: its site is read before it is held (a CloudInfrastructure's
    # own spec.paused is current)
    _paused_hold_by_site: >-
      {{ (((paused_hold_cr | default({}, true)).status | default({}, true)).conditions | default([], true)
          | selectattr('type', 'equalto', 'Ready') | selectattr('reason', 'equalto', 'SitePaused') | list | length) > 0 }}

- name: Read whether the object's site is paused now
  ansible.builtin.include_tasks: site_paused_now.yml
  vars:
    site_paused_cr: "{{ paused_hold_cr }}"
  when:
    - _paused_hold_reported | bool
    - _paused_hold_by_site | bool

- name: Decide whether a paused site holds this object
  ansible.builtin.set_fact:
    _paused_hold: >-
      {{ (_paused_hold_reported | bool)
         and ((not (_paused_hold_by_site | bool)) or (site_paused_now | default(false) | bool)) }}

- name: End the reconcile while a paused site holds this object (no new event, status untouched)
  ansible.builtin.meta: end_host
  when: _paused_hold | bool
