apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transportlinks.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: TransportLink
    listKind: TransportLinkList
    plural: transportlinks
    singular: transportlink
    shortNames:
      - tlink
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Not implemented. A TransportLink has no effect on any network; a site's transport to the
            fabric is set on its site gateway (CloudGateway spec.transport). Kept so existing
            objects stay readable.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: No effect.
              type: object
              properties:
                enabled:
                  description: No effect.
                  type: boolean
                  default: false
                fabricRef:
                  description: No effect.
                  type: string
                cloudGatewayRef:
                  description: No effect.
                  type: string
                tunnelType:
                  description: No effect.
                  type: string
                  enum: [wireguard, ipsec, macsec, none]
                vaultConfigRef:
                  description: No effect.
                  type: string
            status:
              description: >-
                Observed state. The platform marks a TransportLink ready without changing anything.
              type: object
              properties:
                tunnelUp:
                  description: Never written.
                  type: boolean
                borderEndpoint:
                  description: Never written.
                  type: string
                cloudEndpoint:
                  description: Never written.
                  type: string
                lastHandshakeAt:
                  description: Never written.
                  type: string
                  format: date-time
                status:
                  description: Short state word written by the platform's automation.
                  type: string
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: >-
                    True once the platform has seen the object. It does not mean a tunnel exists.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fabric
          type: string
          jsonPath: .spec.fabricRef
        - name: Gateway
          type: string
          jsonPath: .spec.cloudGatewayRef
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
