# ─── Rebuild baseline (005-phased-env-rebuild) ───────────────────────────────
# applicationsEnabled MUST stay true so sovereign-central-apps syncs.
# Every Application-level *.enabled below MUST be false for phased rebuild.
# Enable one component per commit — see specs/005-phased-env-rebuild/quickstart.md
# Do NOT change nested chart sub-values (vault HA, keycloak instance, etc.) here.
#
# Lab topology: real hostnames/IPs live in local .env (gitignored) and Vault
# path central/data/lab-config. Generate overlay with: make render-values-lab
# Merge values-lab.yaml (gitignored) over this file for local/bootstrap use.
# Do not commit passwords, lab IPs, or private lab domains to git.

# ─── Lab topology primitives (override via values-lab.yaml / Vault lab-config)
# Keep empty in the public tree; populate from .env via make render-values-lab.
# Lab topology — populated for live platform; override via values-lab.yaml / Vault.
# After make sync-lab-helm-params, prefer empty placeholders in git and inject from .env.
lab:
  domain: "lab.signal9.gg"
  baseDomain: "signal9.gg"
  centralClusterName: "central"
  servicesClusterName: "services"
  appsSubdomain: apps
  centralAppsDomain: "apps.central.shc.signal9.gg"
  servicesAppsDomain: "apps.services.shc.signal9.gg"
  dnsForwarderZone: "lab.signal9.gg"
  dnsForwarderIps:
    - "172.18.42.10"
    - "172.18.42.11"

# ─── shc: central CoreDNS forwarders (templates/centralCluster/dns-forwarder.yaml) ───────────
# Central's node resolver (IPA 172.18.42.20) answers lab, OOB (iLO) and public names, so the only
# forwarder is the platform zone, straight to its authoritative primary ns1 (fresh records, no
# recursor negative cache), with IPA as fallback when ns1 is unreachable. Upstream's RHDP sandbox
# forwarders and "signal9.gg -> 8.8.8.8" (which hid oob.signal9.gg from pods) are gone.
dnsForwarderCentral:
  servers:
    - name: shc-zone-forwarder
      zones:
        - shc.signal9.gg
      policy: Sequential
      upstreams:
        - "75.8.222.11"
        - "172.18.42.20"

# Pull lab-config from Vault after `make upload-lab-config`.
labConfigExternalSecret:
  enabled: true
  namespace: openshift-gitops
  syncWave: "28"
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore

# ─── ArgoCD namespace ─────────────────────────────────────────────────────────
argocd:
  namespace: openshift-gitops
  # Per-Application automated sync retry (after controller terminates sync at 10m).
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

# Master switch: when false, no Application CRs render at all. For phased rebuild
# keep true and disable each component's enabled flag individually.
applicationsEnabled: true

# ─── Services cluster (managed by central ArgoCD) ────────────────────────────
servicesCluster:
  server: "https://api.services.shc.signal9.gg:6443"

# ─── OCI registry that stores platform Helm charts ───────────────────────────
oci:
  registry: &oci_registry "quay.signal9.gg"
  repositoryBase: "shc"

# ─── Sovereign Namespaces (central cluster) ──────────────────────────────────
sovereignNamespaces:
  enabled: true
  chartVersion: "0.2.7-shc.1"
  syncWave: "1"
  values:
    namespaces:
      - name: sovereign-cloud-jobs
        enabled: true
      - name: sovereign-cloud-helpers
        enabled: true
      - name: gitea
        enabled: true
      # central-vault, central-rhbk, central-quay, and aap are created by their
      # respective charts. Do NOT add them here to avoid ArgoCD ownership conflicts.
    oauth:
      enabled: true
      identityProviderName: "sovereign-central"
      clientId: "openshift-central"
      clientSecretName: "sovereign-central-oauth-secret"
      issuer: "https://rhbk-central.apps.central.shc.signal9.gg/realms/sovereign-central"
      caConfigMap: "keycloak-central-ca"

# ─── Sovereign Namespaces (services cluster) ────────────────────────────────
sovereignNamespacesServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.2.7-shc.1"
  syncWave: "1"
  values:
    ociPullSecret:
      enabled: true
      vaultPath: "oci-credentials"
      secretStoreName: "vault-backend"
      secretStoreKind: "ClusterSecretStore"
    namespaces:
      - name: sovereign-cloud-jobs
        enabled: true
      - name: sovereign-cloud-helpers
        enabled: true
      - name: sovereign-cloud
        enabled: true
      - name: sovereign-cloud-plugins
        enabled: true
      - name: services-rhbk
        enabled: true
      - name: services-quay
        enabled: true
      # aap and services-vault namespaces are created by their respective charts
      # (aap/templates/operator.yaml and vault/templates/namespace.yaml).
      # Do NOT add them here to avoid ArgoCD ownership conflicts.
    oauth:
      enabled: true
      identityProviderName: "sovereign-services"
      clientId: "openshift-services"
      clientSecretName: "sovereign-services-oauth-secret"
      issuer: "https://rhbk-services.apps.services.shc.signal9.gg/realms/sovereign-tenants"
      caConfigMap: "keycloak-services-ca"

# ─── RHBK Central (Keycloak) ─────────────────────────────────────────────────
rhbk:
  enabled: true
  chartVersion: "0.10.2"
  syncWave: "20"
  destinationNamespace: central-rhbk
  values:
    namespace: central-rhbk
    instanceName: rhbk-central
    pushSecretToVault: true
    vaultSecretPath: "central/data/rhbk-central-admin"
    operator:
      channel: stable-v26.4
    keycloak:
      enabled: true
      instances: 2
      hostname: "rhbk-central.apps.central.shc.signal9.gg"
      db:
        enabled: true
        vendor: postgres
        host: "rhbk-pgcluster-primary.central-rhbk.svc"
        database: keycloak
        usernameSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: user
        passwordSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: password
        crunchy:
          enabled: true
          name: rhbk-pgcluster
          instances: 2
          storage: 10Gi
          backupStorage: 10Gi
      tls:
        enabled: false

# ─── RHBK Services (Keycloak) ────────────────────────────────────────────────
rhbkServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.10.2"
  syncWave: "20"
  destinationNamespace: services-rhbk
  values:
    namespace: services-rhbk
    instanceName: rhbk-services
    pushSecretToVault: true
    vaultSecretPath: "central/data/rhbk-services-admin"
    operator:
      channel: stable-v26.4
    keycloak:
      enabled: true
      instances: 2
      hostname: "rhbk-services.apps.services.shc.signal9.gg"
      db:
        enabled: true
        vendor: postgres
        host: "rhbk-pgcluster-primary.services-rhbk.svc"
        database: keycloak
        usernameSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: user
        passwordSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: password
        crunchy:
          enabled: true
          name: rhbk-pgcluster
          instances: 2
          storage: 10Gi
