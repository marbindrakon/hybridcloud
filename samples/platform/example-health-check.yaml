# Reference only: platform objects are managed in Git by the platform team, not
# applied by hand. This shows the shape of the object.
# An endpoint health check (UIHealthChecker) for the admin dashboard.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: UIHealthChecker
metadata:
  name: example-registry
  namespace: sovereign-cloud
spec:
  url: https://registry.example.com/health/instance
  displayName: Registry
  description: The container registry.
  group: custom
  expectedStatus: 200
  timeoutSeconds: 10
