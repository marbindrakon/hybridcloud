---
- name: RBACConfig Create Rulebook
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: "{{ KAFKA_HOST }}"
        port: "{{ KAFKA_PORT }}"
        topic: hybridsovereign-events
        group_id: eda-rbacconfig-create
        security_protocol: SASL_SSL
        sasl_mechanism: SCRAM-SHA-512
        sasl_plain_username: "{{ KAFKA_USERNAME }}"
        sasl_plain_password: "{{ KAFKA_PASSWORD }}"
        check_hostname: true
        verify_mode: CERT_REQUIRED
  rules:
    - name: Handle RBACConfig Create
      condition: event.body.payload.reason in ["RbacConfigCreateRequested", "RbacConfigReconcileRequested", "RBACConfigCreateRequested", "RBACConfigReconcileRequested"] and event.body.payload.regarding.kind in ["RbacConfig", "RBACConfig"]
      action:
        run_job_template:
          name: rbacconfig-provision
          organization: sovereign
          job_args:
            extra_vars:
              event_payload: "{{ event.body.payload }}"
