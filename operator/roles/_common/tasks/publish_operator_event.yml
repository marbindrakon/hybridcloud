---
# shc (LAB-PLAN §11.1, design/DELIVERY-HARDENING.md §3.1). Every event carries an eventId, written to
# status.delivery *before* publishing so a fast job never sees an older id. The EDA job acknowledges it
# (status.delivery.acknowledgedEventId) and exits when a newer eventId superseded its event. A failed
# publish records Published=False/PublishFailed and fails the reconcile: ansible-operator requeues it
# with exponential backoff until Kafka accepts it.
# shc (LAB-PLAN §11.6, design/TENANT-TEARDOWN.md §3.2): a delete finalizer runs this on every requeue;
# a delete event is published once. Not again while it is in flight (published, its job not finished),
# never after deletionComplete; again when the last delete job finished without completing (failed) or
# when the re-drive CronJob set the hybridsovereign.redhat/redeliver annotation, or on a new Retry-now request
# (reconcileNow differs from status.lastHandledReconcileRequest; see reconcile_request.yml), which also resets
# status.retry.
- name: Read the CR before publishing a delete event
  kubernetes.core.k8s_info:
    api_version: "{{ operator_event_regarding.apiVersion }}"
    kind: "{{ operator_event_regarding.kind }}"
    name: "{{ operator_event_regarding.name }}"
    namespace: "{{ operator_event_regarding.namespace }}"
  register: _publish_cr
  when: operator_event_reason is search('DeleteRequested$')

- name: Read the Retry-now request of the deleting CR
  ansible.builtin.include_tasks: reconcile_request.yml
  vars:
    reconcile_request_cr: "{{ _publish_cr.resources[0] }}"
  when:
    - operator_event_reason is search('DeleteRequested$')
    - _publish_cr.resources | default([]) | length > 0

- name: Decide whether to publish
  ansible.builtin.set_fact:
    _publish_redeliver: >-
      {{ (operator_event_reason is search('DeleteRequested$')) and (_publish_cr.resources | default([]) | length > 0)
         and ((((_publish_cr.resources[0].metadata.annotations | default({}, true))['hybridsovereign.redhat/redeliver'] | default('')) == 'true')
              or (reconcile_now | default(false) | bool)) }}
    _publish_skip: >-
      {%- if operator_event_reason is search('DeleteRequested$') and (_publish_cr.resources | default([]) | length > 0) -%}
        {%- set st = _publish_cr.resources[0].status | default({}, true) -%}
        {%- set d = st.delivery | default({}, true) -%}
        {%- set redeliver = (((_publish_cr.resources[0].metadata.annotations | default({}, true))['hybridsovereign.redhat/redeliver'] | default('')) == 'true')
                            or (reconcile_now | default(false) | bool) -%}
        {{ (st.deletionComplete | default(false) | bool)
           or ((not redeliver) and (d.reason | default('')) == operator_event_reason
               and (d.publishedAt | default('', true)) != ''
               and (d.completedEventId | default('')) != (d.eventId | default('-'))) }}
      {%- else -%}False{%- endif -%}

- name: Publish the event
  when: not (_publish_skip | bool)
  block:
    - name: Generate the event id
      ansible.builtin.set_fact:
        operator_event_id: "{{ lookup('ansible.builtin.pipe', 'cat /proc/sys/kernel/random/uuid') }}"
        operator_event_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Build operator event payload for AMQ Streams
      ansible.builtin.set_fact:
        amq_event_payload:
          eventId: "{{ operator_event_id }}"
          reason: "{{ operator_event_reason }}"
          regarding: "{{ operator_event_regarding }}"
          note: "{{ operator_event_note | default('') }}"
          reportingController: "{{ operator_reporting_controller | default('hybridsovereign-operator') }}"
          action: "{{ operator_event_action | default('Create') }}"
          cluster: services
          timestamp: "{{ operator_event_time }}"

    - name: Record the event id before publishing
      operator_sdk.util.k8s_status:
        api_version: "{{ operator_event_regarding.apiVersion }}"
        kind: "{{ operator_event_regarding.kind }}"
        name: "{{ operator_event_regarding.name }}"
        namespace: "{{ operator_event_regarding.namespace }}"
        status:
          delivery:
            eventId: "{{ operator_event_id }}"
            reason: "{{ operator_event_reason }}"
            publishedAt: null
          conditions:
            - type: Published
              status: Unknown
              reason: Publishing
              message: "{{ operator_event_reason }} event {{ operator_event_id }}"
              lastTransitionTime: "{{ operator_event_time }}"
      when: amq_kafka_enabled | default(true) | bool

    - name: Publish operator event to AMQ Streams
      block:
        - name: Publish
          ansible.builtin.include_tasks: amq_publish.yml
      rescue:
        - name: Keep the last line of the producer error (credentials are env-only, never in it)
          ansible.builtin.set_fact:
            _amq_publish_error: "{{ ((amq_publish_result.stderr | default('')) | string).splitlines() | select | list | last | default(ansible_failed_result.msg | default('publish failed'), true) }}"

        # The condition's transition time resets on every attempt; publishFailingSince keeps the first one.
        - name: Read when publishing started failing
          kubernetes.core.k8s_info:
            api_version: "{{ operator_event_regarding.apiVersion }}"
            kind: "{{ operator_event_regarding.kind }}"
            name: "{{ operator_event_regarding.name }}"
            namespace: "{{ operator_event_regarding.namespace }}"
          register: _amq_publish_cr

        - name: Record the failed publish
          operator_sdk.util.k8s_status:
            api_version: "{{ operator_event_regarding.apiVersion }}"
            kind: "{{ operator_event_regarding.kind }}"
            name: "{{ operator_event_regarding.name }}"
            namespace: "{{ operator_event_regarding.namespace }}"
            status:
              delivery:
                publishFailingSince: >-
                  {{ (((_amq_publish_cr.resources | first | default({})).get('status') or {}).get('delivery') or {}).get('publishFailingSince')
                     or operator_event_time }}
              conditions:
                - type: Published
                  status: "False"
                  reason: PublishFailed
                  message: "{{ _amq_publish_error | truncate(300, True, '…') }}"
                  lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Fail the reconcile so it is retried with backoff
          ansible.builtin.fail:
            msg: >-
              AMQ publish failed for {{ operator_event_regarding.kind }}/{{ operator_event_regarding.name }}
              (event {{ operator_event_id }}); the operator retries with backoff

    - name: Record the published event
      operator_sdk.util.k8s_status:
        api_version: "{{ operator_event_regarding.apiVersion }}"
        kind: "{{ operator_event_regarding.kind }}"
        name: "{{ operator_event_regarding.name }}"
        namespace: "{{ operator_event_regarding.namespace }}"
        status:
          delivery:
            eventId: "{{ operator_event_id }}"
            reason: "{{ operator_event_reason }}"
            publishedAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
            publishFailingSince: null
          conditions:
            - type: Published
              status: "True"
              reason: Published
              message: "{{ operator_event_reason }} event {{ operator_event_id }}"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      when: amq_kafka_enabled | default(true) | bool

    # Retry now: the request is handled once its event is published (the annotation is never cleared).
    - name: Record the handled Retry-now request
      operator_sdk.util.k8s_status:
        api_version: "{{ operator_event_regarding.apiVersion }}"
        kind: "{{ operator_event_regarding.kind }}"
        name: "{{ operator_event_regarding.name }}"
        namespace: "{{ operator_event_regarding.namespace }}"
        status:
          lastHandledReconcileRequest: "{{ reconcile_request }}"
      when:
        - amq_kafka_enabled | default(true) | bool
        - reconcile_now | default(false) | bool
        - (reconcile_request | default('')) | length > 0

    # A new request on a deleting CR starts the teardown attempts again.
    - name: Reset the teardown retry count
      operator_sdk.util.k8s_status:
        api_version: "{{ operator_event_regarding.apiVersion }}"
        kind: "{{ operator_event_regarding.kind }}"
        name: "{{ operator_event_regarding.name }}"
        namespace: "{{ operator_event_regarding.namespace }}"
        status:
          retry: null
          conditions:
            - type: Stalled
              status: "False"
              reason: AsExpected
              message: ""
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      when:
        - amq_kafka_enabled | default(true) | bool
        - _publish_redeliver | bool

    - name: Emit optional Kubernetes Event for debugging
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: events.k8s.io/v1
          kind: Event
          metadata:
            namespace: "{{ operator_event_regarding.namespace }}"
            generateName: "{{ operator_event_regarding.kind | lower }}-{{ operator_event_regarding.name }}-eda-"
          regarding: "{{ operator_event_regarding }}"
          reason: "{{ operator_event_reason }}"
          note: "{{ operator_event_note | default('') | truncate(1024, True, '…') }}"
          type: Normal
          action: "{{ operator_event_action | default('Create') }}"
          reportingController: "{{ operator_reporting_controller | default('hybridsovereign-operator') }}"
          reportingInstance: "{{ operator_reporting_controller | default('hybridsovereign-operator') }}"
          eventTime: "{{ now(utc=true).isoformat() }}Z"
      when: operator_emit_k8s_events | default(false) | bool

    - name: Clear the redeliver request
      kubernetes.core.k8s:
        state: patched
        api_version: "{{ operator_event_regarding.apiVersion }}"
        kind: "{{ operator_event_regarding.kind }}"
        name: "{{ operator_event_regarding.name }}"
        namespace: "{{ operator_event_regarding.namespace }}"
        definition:
          metadata:
            annotations:
              hybridsovereign.redhat/redeliver: null
      when: _publish_redeliver | bool
