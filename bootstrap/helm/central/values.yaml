      image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
      # cookieSecret and clientSecret are NOT stored here.
      # Vault key pulled via ExternalSecret into the sovereign-cloud namespace.
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: "dashboard-oauth"
        refreshInterval: "1h"
    route:
      enabled: true
    env:
      ENTITY_NAMESPACE: sovereign-cloud
      NODE_ENV: production
      OAUTH_SYNC_VERSION: "2"

# ─── Tenancy Dashboard (services cluster) ────────────────────────────────
tenancyDashboard:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "1.1.13-shc.1"  # shc: vendored into charts/charts, ESO v1
  syncWave: "41"
  destinationNamespace: sovereign-cloud
  values:
    namespace: sovereign-cloud
    clusterDomain: apps.services.shc.signal9.gg
    image:
      repository: quay.signal9.gg/shc/tenancy-dashboard
      tag: "5.0.17"
      pullPolicy: Always
    imagePullSecrets:
      - name: quay-pull-secret
    oauthProxy:
      image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
      # cookieSecret and clientSecret are NOT stored here.
      # Vault key pulled via ExternalSecret into the sovereign-cloud namespace.
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: "tenancy-dashboard-oauth"
        refreshInterval: "1h"
    route:
      enabled: true
    env:
      NODE_ENV: production
      OAUTH_SYNC_VERSION: "2"

# ─── Sovereign Admin Console Plugin (services cluster) ───────────────────────
sovereignAdminPlugin:
