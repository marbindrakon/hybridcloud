---
# shc (design/P7-PLAN.md P7.3.4): the border gateway root instance on one node (delegated over SSH, become).
# Input: bgw_node {name, address}, hf_root (instance config), hf_pe (provider-edge addresses), fab_spec, hf_egress,
# hf_attach (attachments-plan), hf_circuit_passwords.
# Appends {name, ready, message, lastAppliedAt} to hf_node_results and the node's name to hf_changed_nodes when
# anything on it changed.
- name: "{{ bgw_node.name }}: the node's egress plan and attachment circuits"
  ansible.builtin.set_fact:
    hf_node_egress: "{{ (hf_egress.nodes | default({})).get(bgw_node.name, {}) }}"
    hf_node_attach: "{{ (hf_attach.nodes | default({})).get(bgw_node.name, {}) }}"
    hf_node_vrfs: "{{ (hf_attach.vrfs | default({})).get(bgw_node.name, []) }}"

- name: "{{ bgw_node.name }}: require FRR"
  ansible.builtin.command: rpm -q frr
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: install the fabric apply script and unit"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-fabric-apply, dest: /usr/local/sbin/shc-fabric-apply, mode: "0755"}
    - {src: shc-fabric-apply@.service, dest: /etc/systemd/system/shc-fabric-apply@.service, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_files

- name: "{{ bgw_node.name }}: load the MPLS modules at boot"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/shc-fabric.conf
    content: "# shc fabric: MPLS for the provider-edge core\nmpls_router\nmpls_iptunnel\n"
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_modules

- name: "{{ bgw_node.name }}: instance config directory"
  ansible.builtin.file:
    path: /etc/shc-fabric
    state: directory
    mode: "0755"
  delegate_to: "{{ bgw_node.name }}"

# the ICMPv6 source of the root's VRFs differs per node (the node's position in borderGateway.nodes)
- name: "{{ bgw_node.name }}: the root's ICMPv6 source on this node"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check:
      action: pe-addresses
      core: "{{ fab_real.core }}"
      index: 1
      nodeOrdinal: "{{ (fab_spec.borderGateway.nodes | map(attribute='name') | list).index(bgw_node.name) + 1 }}"
  when: fab_real.core.icmpSource6 | default('', true) | length > 0

- name: "{{ bgw_node.name }}: stop on an ICMPv6 source that does not fit"
  ansible.builtin.fail:
    msg: "HybridFabric {{ fab_name }} on {{ bgw_node.name }}: {{ fab_check_result.errors | join('; ') }}"
  when:
    - fab_real.core.icmpSource6 | default('', true) | length > 0
    - fab_check_result.errors | default([]) | length > 0

# the core's IPv6 keys are empty strings on an IPv4-only core; loopbackPool6 and icmpSource6 let the apply remove
# addresses an earlier configuration left inside those ranges
- name: "{{ bgw_node.name }}: root instance config"
  vars:
    _hf_icmp6: "{{ fab_check_result.icmp6 if fab_real.core.icmpSource6 | default('', true) | length > 0 else '' }}"
  ansible.builtin.copy:
    dest: /etc/shc-fabric/root.json
    content: >
      {{ hf_root | combine({'egress': (hf_node_egress | combine({'ipv6': hf_node_egress.ipv6 | combine({'icmp6': _hf_icmp6})})
                                        if hf_node_egress.ipv6 is defined else hf_node_egress)}
                            if hf_node_egress | length > 0 else {})
         | combine({'attachments': hf_node_attach} if hf_node_attach | length > 0 else {})
         | combine({'loopback6': hf_pe.loopback6 | default(''), 'icmp6': _hf_icmp6,
                    'loopbackPool6': fab_real.core.loopbackPool6 | default('', true),
                    'icmpSource6': fab_real.core.icmpSource6 | default('', true)}) | to_nice_json }}
    mode: "0644"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_rootconf

# bgpd drops a neighbor's BFD session (bfdd) only while the neighbor's VRF still exists in the kernel. When the apply
# deletes a root VRF first, the reload then removes its BGP instance but the session stays in bfdd for good (FRR 8.5.3,
# seen after circuit teardowns). So the BGP instances of root VRFs that go away are removed here, before the apply
# (or a start of the root unit) deletes their kernel VRFs; the reload then has nothing left to remove for them
- name: "{{ bgw_node.name }}: remove the BGP instances of root VRFs that go away (before their kernel VRFs)"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl -q is-active frr || exit 0
    want=" {{ hf_node_vrfs | map(attribute='vrf') | join(' ') }} "
    for v in $(vtysh -c 'show bgp vrfs json' | jq -r '.vrfs // {} | keys[]' | grep -E '^e[0-9]+$' || true); do
      case "$want" in *" $v "*) continue ;; esac
      vtysh -c 'configure terminal' -c "no router bgp {{ fab_spec.domainAsn }} vrf $v" && echo "removed $v"
    done
  args:
    executable: /bin/bash
  register: _hf_vrfgone
  changed_when: "'removed ' in _hf_vrfgone.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: run the root instance at boot (and now)"
  ansible.builtin.systemd:
    name: shc-fabric-apply@root.service
    enabled: true
    state: started
    daemon_reload: "{{ _hf_files is changed }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_unit

# A host interface that still learns from router advertisements makes the apply skip the root's IPv6 side (a boot keeps
# the IPv4 service); here that is a failure the operator has to look at
- name: "{{ bgw_node.name }}: apply the root instance"
  ansible.builtin.command: /usr/local/sbin/shc-fabric-apply root up
  register: _hf_apply
  changed_when: "'changed=yes' in _hf_apply.stdout"
  failed_when: _hf_apply.rc != 0 or 'IPv6 core not applied' in _hf_apply.stdout
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR daemons"
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^{{ item }}="
    line: "{{ item }}=yes"
  # bfdd: BFD on attachment circuits
  loop: "{{ ['bgpd', 'isisd'] + (['bfdd'] if fab_real.attachments.enabled | default(false) | bool else []) }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_daemons

- name: "{{ bgw_node.name }}: FRR configuration"
  ansible.builtin.template:
    src: frr-root.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_frrconf
  # the circuits' BGP passwords are in the file: no diff, no content in the log
  no_log: "{{ hf_circuit_passwords | default({}) | length > 0 }}"

- name: "{{ bgw_node.name }}: is FRR running"
  ansible.builtin.command: systemctl is-active frr
  register: _hf_frr_active
  changed_when: false
  failed_when: false
  delegate_to: "{{ bgw_node.name }}"

# a new core bridge MAC is only seen by IS-IS after a restart
- name: "{{ bgw_node.name }}: start FRR (enabled at boot)"
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: >-
      {{ 'started' if _hf_frr_active.stdout != 'active'
         else ('restarted' if 'bridge-mac=changed' in _hf_apply.stdout else omit) }}
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_frr_state

# a running FRR takes a new configuration through frr-reload (no session reset), and a newly enabled daemon (bfdd)
# the same way: the reload restarts watchfrr with the daemons file's list, which starts the missing daemon and
# leaves the running ones alone (FRR 8.5's frrinit.sh)
- name: "{{ bgw_node.name }}: reload the FRR configuration"
  ansible.builtin.systemd:
    name: frr
    state: reloaded
  when:
    - _hf_frr_active.stdout == 'active'
    - "'bridge-mac=changed' not in _hf_apply.stdout"
    - _hf_frrconf is changed or _hf_daemons is changed
  delegate_to: "{{ bgw_node.name }}"

# the fail-closed rule of the IPv6 egress (after the configuration reload: the filter table is loaded by the apply
# above and the sessions are in the configuration now): a timer unit that shuts the upstream sessions whenever the
# filter table is missing, and opens them again when it is back
- name: "{{ bgw_node.name }}: install the IPv6 egress guard"
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../common/files/bgw/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: shc-egress6-guard, dest: /usr/local/sbin/shc-egress6-guard, mode: "0755"}
    - {src: shc-egress6-guard.service, dest: /etc/systemd/system/shc-egress6-guard.service, mode: "0644"}
    - {src: shc-egress6-guard.timer, dest: /etc/systemd/system/shc-egress6-guard.timer, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_files
  when: hf_node_egress.ipv6 is defined

- name: "{{ bgw_node.name }}: run the IPv6 egress guard on its timer"
  ansible.builtin.systemd:
    name: shc-egress6-guard.timer
    enabled: true
    state: started
    daemon_reload: "{{ _hf_guard_files is changed }}"
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_unit
  when: hf_node_egress.ipv6 is defined

- name: "{{ bgw_node.name }}: no IPv6 egress guard without IPv6 egress"
  ansible.builtin.shell: |
    changed=no
    if systemctl -q is-enabled shc-egress6-guard.timer 2>/dev/null || systemctl -q is-active shc-egress6-guard.timer 2>/dev/null; then
      systemctl disable --now shc-egress6-guard.timer; changed=yes
    fi
    for f in /etc/systemd/system/shc-egress6-guard.timer /etc/systemd/system/shc-egress6-guard.service /usr/local/sbin/shc-egress6-guard /run/shc-egress6-guard.shut; do
      [ -e "$f" ] && { rm -f "$f"; changed=yes; }
    done
    [ "$changed" = no ] || systemctl daemon-reload
    echo "changed=$changed"
  args:
    executable: /bin/bash
  delegate_to: "{{ bgw_node.name }}"
  register: _hf_guard_gone
  changed_when: "'changed=yes' in _hf_guard_gone.stdout"
  when: hf_node_egress.ipv6 is not defined

- name: "{{ bgw_node.name }}: wait for BGP and IS-IS"
  ansible.builtin.shell:
    cmd: |
      set -e
      run=$(vtysh -c 'show running-config')
      echo "$run" | grep -q '^router bgp {{ fab_spec.domainAsn }}$'
      echo "$run" | grep -q 'bgp listen range {{ fab_real.core.loopbackPool }} peer-group PE'
      echo "$run" | grep -q '^router isis CORE$'
      vtysh -c 'show isis summary' | grep -q 'Area CORE'
      ss -Hltn 'sport = :179' | grep -q LISTEN
      ip -br addr show dev {{ hf_root.bridge }} | grep -q ' {{ hf_root.link }} '
      [ "$(sysctl -n net.mpls.platform_labels)" = 1048575 ]
      {% if hf_node_egress | length > 0 %}
      # egress: the hand-off answers, the table is loaded, each network VRF has its default route and exports it
      ip -br addr show dev egress0 | grep -q ' {{ hf_node_egress.address }}'
      ping -c 2 -W 2 -I {{ hf_node_egress.vrf }} {{ hf_node_egress.gateway }} >/dev/null
      nft list table ip shc_egress >/dev/null
      {% for n in hf_node_egress.networks %}
      {% if n.internet | default(true) %}
      ip route show vrf {{ n.vrf }} | grep -Eq '^default (nhid [0-9]+ )?via {{ n.xoIp }} dev {{ n.xe }} '
      vtysh -c 'show bgp vrf {{ n.vrf }} ipv4 unicast 0.0.0.0/0' | grep -q 'Local'
      {% endif %}
      {% for c in n.platform | default([]) %}
      ip route show vrf {{ hf_node_egress.vrf }} | grep -Eq '^{{ c }} (nhid [0-9]+ )?via {{ n.xeIp }} '
      {% endfor %}
      {% endfor %}
      {% if hf_node_egress.ipv6 is defined %}
      # IPv6 egress: the hand-off address is on egress0 and past duplicate address detection, egress0's IPv6 MTU is the
      # WAN MTU, the filter table is loaded (fail closed), the egress VRF's BGP instance knows every upstream, and while
      # the egress VRF holds the default route from an upstream every network VRF with IPv6 egress holds it too (over
      # its veth). The upstream sessions' states are reported, not required (the upstream decides when they come up).
      # Prints egress6=<json> for the node record.
      python3 - <<'PY'
      import json, subprocess, sys


      def run(cmd):
          p = subprocess.run(cmd, capture_output=True, text=True)
          return p.stdout if p.returncode == 0 else ""


      def main(run):
          ev, addr, mtu = {{ hf_node_egress.vrf | to_json }}, {{ hf_node_egress.ipv6.address | to_json }}, {{ hf_node_egress.ipv6.wanMtu | int }}
          ups = {{ hf_node_egress.ipv6.upstream | to_json }}
          nets = {{ hf_node_egress.networks | selectattr('ipv6', 'defined') | map(attribute='vrf') | list | to_json }}
          errors = []
          ip, plen = addr.split("/")
          have = [a for l in json.loads(run(["ip", "-j", "-6", "addr", "show", "dev", "egress0"]) or "[]")
                  for a in l.get("addr_info", []) if a.get("local", "").lower() == ip.lower()]
          if not have:
              errors.append("egress0 lacks %s" % addr)
          elif have[0].get("tentative"):
              errors.append("egress0: %s is still tentative" % addr)
          if run(["sysctl", "-n", "net/ipv6/conf/egress0/mtu"]).strip() != str(mtu):
              errors.append("egress0 IPv6 MTU is not %d" % mtu)
          table = subprocess.run(["nft", "list", "table", "inet", "shc_egress6"], capture_output=True).returncode == 0
          if not table:
              errors.append("the filter table inet shc_egress6 is not loaded")
          peers = json.loads(run(["vtysh", "-c", "show bgp vrf %s ipv6 unicast summary json" % ev]) or "{}").get("peers", {})
          sessions = []
          for u in ups:
              p = peers.get(u["address"])
              if p is None:
                  errors.append("upstream %s is not configured in the egress VRF's BGP instance" % u["address"])
              sessions.append({"address": u["address"], "asn": u["asn"], "state": (p or {}).get("state", "Missing")})
          default = bool(json.loads(run(["vtysh", "-c", "show ipv6 route vrf %s ::/0 json" % ev]) or "{}").get("::/0"))
          if default:
              for v in nets:
                  if not json.loads(run(["vtysh", "-c", "show ipv6 route vrf %s ::/0 json" % v]) or "{}").get("::/0"):
                      errors.append("network VRF %s lacks the default route from the egress VRF" % v)
          up = [s for s in sessions if s["state"] == "Established"]
          healthy = bool(table and default and up and not errors)
          for e in errors:
              print(e, file=sys.stderr)
          print("egress6=" + json.dumps({"address": addr, "upstream": sessions, "default": default, "table": table,
                                         "networks": len(nets), "healthy": healthy}, sort_keys=True))
          return 1 if errors else 0


      if __name__ == "__main__":
          sys.exit(main(run))
      PY
      {% endif %}
      {% endif %}
      {% for v in hf_node_vrfs %}
      {% for c in v.circuits %}
      # circuit {{ c.circuit }}: the device in the network's VRF with the node's address, the CE configured as a peer
      [ "$(ip -j link show dev {{ c.device }} | jq -r '.[0].master')" = {{ v.vrf }} ]
      ip -br -4 addr show dev {{ c.device }} | grep -q ' {{ c.address }}/'
      vtysh -c 'show bgp vrf {{ v.vrf }} neighbors {{ c.ce }} json' | grep -q '"remoteAs":{{ c.peerAsn }}'
      {% if c.bfd %}
      pgrep -x bfdd >/dev/null
      {% endif %}
      {% endfor %}
      {% endfor %}
      {% if hf_pe.loopback6 | default('') | length > 0 %}
      # IPv6 core: every PE session Established for VPNv4 is listed Established for VPNv6 (the PE group has the
      # family), and every gateway whose session negotiated VPNv6 has its IPv6 loopback installed from IS-IS; a gateway
      # not yet rendered with the IPv6 core (the root is rolled out first) negotiates no VPNv6 and is not waited for.
      # Prints ipv6Vpn=<state> for the node record.
      python3 -c '
      import ipaddress, json, subprocess, sys


      def run(cmd):
          return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


      def peers(text, established=False):
          p = json.loads(text or "{}").get("peers", {})
          return {k for k, v in p.items() if established or v.get("state") == "Established"}


      def main(argv, run):
          """argv: <IPv4 loopback pool> <IPv6 loopback pool>. Prints ipv6Vpn=<state>; exits 1 while the IPv6 core is not
          ready on the route reflector."""
          pool4 = ipaddress.ip_network(argv[0])
          pool6 = ipaddress.ip_network(argv[1])
          show = lambda c: run(["vtysh", "-c", c])
          # "summary established" lists only the sessions that are up AND negotiated the address family; the plain summary
          # says Established for every session that is up, negotiated or not
          pe4 = peers(show("show bgp ipv4 vpn summary established json"), True)
          up6 = peers(show("show bgp ipv6 vpn summary json"))
          neg6 = peers(show("show bgp ipv6 vpn summary established json"), True)
          isis6 = json.loads(show("show ipv6 route isis json") or "{}")
          errors = ["%s: Established for VPNv4 but not listed Established for VPNv6" % p for p in sorted(pe4 - up6)]
          # a gateway that is not rendered with the IPv6 core yet negotiates no VPNv6: its IPv6 loopback is required only
          # once its session carries VPNv6
          for p in sorted(neg6 & pe4):
              a = ipaddress.ip_address(p)
              if a not in pool4:
                  continue
              lo6 = str(pool6.network_address + (int(a) - int(pool4.network_address))) + "/128"
              if not any(r.get("protocol") == "isis" and r.get("selected") and r.get("installed")
                         for r in isis6.get(lo6, [])):
                  errors.append("%s: VPNv6 negotiated but its IPv6 loopback %s is not an installed IS-IS route" % (p, lo6))
          for e in errors:
              print(e, file=sys.stderr)
          state = ("NoPeers" if not pe4 else "Established" if pe4 <= neg6
                   else "NoNeg" if not pe4 & neg6 else "Partial")
          print("ipv6Vpn=" + state)
          return 1 if errors else 0


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:], run))
      ' {{ fab_real.core.loopbackPool }} "{{ fab_real.core.loopbackPool6 | default('') }}"
      {% endif %}
  register: _hf_verify
  retries: 12
  delay: 5
  until: _hf_verify.rc == 0
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

# FRR 8.5: a VRF deleted and created again under the same name (a network's VPN target used again) can keep zebra's old binding of
# its VPN label: bgpd exports the label, but zebra never installs it into the kernel, so traffic from the core for the
# VRF is dropped. Every VRF must have an MPLS route into it; a VRF without one gets its label bound again (label vpn
# export off and on, so the running configuration ends unchanged). Per address family: each family of a VRF has its
# own label, read from the VPN table (`show bgp ipv4|ipv6 vpn json detail`: the VRF's paths carry nhVrfName and
# remoteLabel), and only the family whose label has no route is bound again, under that family; a family with no
# exported route yet needs one more MPLS route into the VRF. A VRF without the IPv6 family is checked as before (any
# MPLS route into it, IPv4 bound again). Same check code as the gateway's.
- name: "{{ bgw_node.name }}: every root VRF's VPN label leads into it"
  ansible.builtin.shell: |
    {% set _vrfs = [] %}
    {% for v in hf_node_vrfs %}
    {% set _ = _vrfs.append(v.vrf ~ ':' ~ (v.families | default([4], true) | join(','))) %}
    {% endfor %}
    bad() {
    python3 -c '
    import json, re, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def kernel(text):
        """The MPLS table (ip -f mpls route): every device a line names, and per device the labels routed into it."""
        devs, into = set(), {}
        for line in text.splitlines():
            names = re.findall(r" dev (\S+)", line)
            devs.update(names)
            m = re.match(r"(\d+) ", line)
            if m:
                for d in names:
                    into.setdefault(d, set()).add(int(m.group(1)))
        return devs, into


    def paths(o):
        """Every path object (a dict with remoteLabel) below o."""
        if isinstance(o, dict):
            if "remoteLabel" in o:
                yield o
            for x in o.values():
                yield from paths(x)
        elif isinstance(o, list):
            for x in o:
                yield from paths(x)


    def own_labels(text):
        """VRF -> labels, from the own VPN table (show bgp ipv4|ipv6 vpn json detail): a path leaked from a VRF names it
        in nhVrfName and carries its label vpn export as remoteLabel. FRR 8.5 prints no remoteLabel on a path whose
        origin is an EVPN route (a gateway site route): those labels come from the route reflector."""
        found = {}
        for p in paths(json.loads(text or "{}")):
            if "nhVrfName" in p:
                found.setdefault(str(p["nhVrfName"]), set()).add(int(p["remoteLabel"]))
        return found


    def peer_labels(text, peer):
        """RD -> labels of the paths the route reflector holds from peer (its VPN table, json detail: routes,
        routeDistinguishers, <rd>, <prefix>, paths with peer.peerId and remoteLabel)."""
        found = {}
        rds = json.loads(text or "{}").get("routes", {}).get("routeDistinguishers", {})
        for rd, sub in rds.items():
            for p in paths(sub):
                if str((p.get("peer") or {}).get("peerId", "")) == peer:
                    found.setdefault(rd, set()).add(int(p["remoteLabel"]))
        return found


    def main(argv, run):
        """argv: <vtysh pathspace or ""> <netns or ""> <own loopback, the peer address the route reflector sees, or ""> then
        <vrf>:<families>[:<rd>] per VRF. Prints "<vrf> <family> <case>" per address family whose label has no MPLS
        route into the VRF: unseen = the kernel routes the label nowhere, stale = it routes it into another device."""
        pathspace, netns, peer = argv[0], argv[1], argv[2]
        vrfs = []
        for spec in argv[3:]:
            name, fams, rd = (spec.split(":", 2) + ["", ""])[:3]
            vrfs.append((name, sorted({int(f) for f in (fams or "4").split(",") if f}), rd))
        if not vrfs:
            return 0
        ip = ["ip"] + (["-n", netns] if netns else [])
        vtysh = ["vtysh"] + (["-N", pathspace] if pathspace else [])
        devs, into = kernel(run(ip + ["-f", "mpls", "route"]))
        routed = set().union(*into.values()) if into else set()
        own, rr = {}, {}
        if any(6 in f for _, f, _ in vrfs):
            for fam in (4, 6):
                show = "show bgp ipv%d vpn json detail" % fam
                own[fam] = own_labels(run(vtysh + ["-c", show]))
                rr[fam] = {}
                if peer and pathspace:
                    # the route reflector (the root FRR on this node): unreadable means unseen, not an error
                    try:
                        rr[fam] = peer_labels(run(["vtysh", "-c", show]), peer)
                    except (OSError, ValueError, subprocess.CalledProcessError):
                        pass
        for name, fams, rd in vrfs:
            if 6 not in fams:
                # IPv4 only: any MPLS route into the VRF (unchanged)
                if name not in devs:
                    print(name, 4, "unseen")
                continue
            have = into.get(name, set())
            known = {}
            for f in fams:
                labels = own[f].get(name, set()) | rr[f].get(rd, set())
                if labels:
                    known[f] = labels
            for f in sorted(known):
                missing = known[f] - have
                if missing:
                    print(name, f, "stale" if missing & routed else "unseen")
            # a family that exports no route yet shows no label: it needs a route into the VRF that the other family
            # label does not account for (each family has its own label)
            unseen = [f for f in fams if f not in known]
            claimed = set().union(*known.values()) if known else set()
            if unseen and len(have - claimed) < len(unseen):
                for f in unseen:
                    print(name, f, "unseen")
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' "" "" "" {{ _vrfs | join(' ') }}
    }
    # the families still without their MPLS route after up to <tries> checks 5 s apart (in $b)
    settle() {
      for i in $(seq "$1"); do b=$(bad) || return 1; [ -z "$b" ] && return 0; sleep 5; done
      b=$(bad)
    }
    settle 3 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
    # what each case means, for the job output (<vrf> <family> <unseen|stale>, then "" or " even after binding it again")
    why() {
      case "$3" in
        stale) echo "VRF $1: the kernel routes its IPv$2 VPN label into another device (stale)$4" >&2 ;;
        *) echo "VRF $1: its IPv$2 VPN label is not seen in the kernel (no MPLS route into the VRF)$4" >&2 ;;
      esac
    }
    rebound=""
    if [ -n "$b" ]; then
      while read -r v f c; do
        why "$v" "$f" "$c" "; binding it again"
        vtysh -c 'configure terminal' -c "router bgp {{ fab_spec.domainAsn }} vrf $v" -c "address-family ipv$f unicast" \
          -c 'no label vpn export auto' -c 'label vpn export auto' -c 'end' >/dev/null
        rebound="$rebound $v/ipv$f"
      done <<< "$b"
      settle 6 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
      if [ -n "$b" ]; then
        while read -r v f c; do why "$v" "$f" "$c" ", even after binding it again"; done <<< "$b"
        exit 1
      fi
    fi
    echo "rebound=$rebound"
  args:
    executable: /bin/bash
  register: _hf_labels
  changed_when: _hf_labels.stdout is search('rebound=.')
  delegate_to: "{{ bgw_node.name }}"

# ipv6Vpn: "" without the IPv6 core; else Established (every VPNv4 PE peer negotiated VPNv6), Partial, NoNeg (none
# did yet) or NoPeers
# egressIpv6 (with IPv6 egress): {address, upstream: [{address, asn, state}], default, table, networks, healthy}
- name: "{{ bgw_node.name }}: record the node"
  vars:
    _v6: "{{ hf_pe.loopback6 | default('') | length > 0 }}"
    _ipv6vpn: >-
      {{ ((_hf_verify.stdout_lines | default([]) | select('match', '^ipv6Vpn=') | list | last | default('='))
          .split('=', 1) | last) if _v6 | bool else '' }}
    _eg6: >-
      {{ (((_hf_verify.stdout_lines | default([]) | select('match', '^egress6=') | list | last | default('egress6={}'))
           .split('=', 1) | last) | from_json) if hf_node_egress.ipv6 is defined else {} }}
  ansible.builtin.set_fact:
    hf_node_results: >-
      {{ hf_node_results | default([]) + [{
           'name': bgw_node.name,
           'ready': true,
           'ipv6Vpn': _ipv6vpn | trim,
           'message': 'root instance: VPNv4' ~ (' and VPNv6' if _v6 | bool else '') ~ ' route reflector, IS-IS SR (SID '
                      ~ hf_pe.sid ~ '), ' ~ hf_root.bridge ~ ' ' ~ hf_root.link ~ ', loopback ' ~ hf_pe.loopbackIp
                      ~ ((' ' ~ hf_pe.loopbackIp6 | default('')) if _v6 | bool else '')
                      ~ ((', internet egress via ' ~ hf_node_egress.address ~ ' for ' ~ hf_node_egress.networks | length
                          ~ ' network(s)') if hf_node_egress | length > 0 else '')
                      ~ ((', IPv6 internet egress via ' ~ hf_node_egress.ipv6.address ~ ' (AS ' ~ hf_node_egress.ipv6.asn ~ ', '
                          ~ (_eg6.upstream | default([]) | selectattr('state', 'equalto', 'Established') | list | length)
                          ~ '/' ~ (_eg6.upstream | default([]) | length) ~ ' upstream sessions up) for '
                          ~ (_eg6.networks | default(0)) ~ ' network(s)') if hf_node_egress.ipv6 is defined else '')
                      ~ ((', ' ~ hf_node_attach.circuits | length ~ ' attachment circuit(s)')
                         if hf_node_attach.circuits | default([]) | length > 0 else ''),
           'lastAppliedAt': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')}
           | combine({'egressIpv6': _eg6} if hf_node_egress.ipv6 is defined else {})] }}
    hf_changed_nodes: >-
      {{ hf_changed_nodes | default([]) + ([bgw_node.name] if [_hf_files, _hf_modules, _hf_rootconf, _hf_vrfgone, _hf_unit,
         _hf_apply, _hf_daemons, _hf_frrconf, _hf_frr_state, _hf_guard_files, _hf_guard_unit, _hf_guard_gone]
         | select('changed') | list | length > 0 else []) }}
