---
# Keycloak (RHBK) admin credentials from central Vault: KV `keycloak_vault_path` (the RbacConfig's
# spec.secret; default rhbk-services-admin, username/password). Upstream included this file but
# never committed it (.gitignore `*credentials*`). Sets keycloak_admin_user / keycloak_admin_password.
- name: Read {{ keycloak_vault_path | default('rhbk-services-admin') }} from Vault
  ansible.builtin.include_tasks: vault_kv_read.yml
  vars:
    vault_kv_path: "{{ keycloak_vault_path | default('rhbk-services-admin') }}"

- name: Set Keycloak admin facts
  ansible.builtin.set_fact:
    keycloak_admin_user: "{{ vault_kv_data.username }}"
    keycloak_admin_password: "{{ vault_kv_data.password }}"
  no_log: true

- name: Assert Keycloak admin credentials present
  ansible.builtin.assert:
    that:
      - keycloak_admin_user | default('') | length > 0
      - keycloak_admin_password | default('') | length > 0
    fail_msg: "Vault {{ keycloak_vault_path | default('rhbk-services-admin') }} has no username/password"
