# The platform automation account on services (servicesCluster.automation in the central values): allowed what the
# EDA jobs do, denied what they never need.
- id: automation-shc-kinds
  resolves: [UX-107]
  principal: {user: "{automation}", groups: [system:serviceaccounts, system:authenticated]}
  namespace: entity-{entity}
  resource: {group: hybridsovereign.redhat, resource: "@shc-kinds"}
  verbs: [get, list, watch, create, update, patch, delete]
  expect: allow
- id: automation-shc-status
  resolves: [UX-107]
  principal: {user: "{automation}", groups: [system:serviceaccounts, system:authenticated]}
  namespace: entity-{entity}
  resource: {group: hybridsovereign.redhat, resource: hybridnetworks, subresource: status}
  verbs: [get, update, patch]
  expect: allow
- id: automation-platform-kinds
