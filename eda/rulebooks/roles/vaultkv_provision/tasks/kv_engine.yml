            | map(attribute='status.group')
            | list
          }}

- name: Default reader groups to empty
  when: vaultkv_spec.vaultReaderRbac is not defined or vaultkv_spec.vaultReaderRbac | length == 0
  ansible.builtin.set_fact:
    reader_group_paths: []

- name: Resolve ops Rbac groups
  when: vaultkv_spec.vaultOpsRbac is defined and vaultkv_spec.vaultOpsRbac | length > 0
  block:
    - name: Read ops Rbac CRs
      kubernetes.core.k8s_info:
