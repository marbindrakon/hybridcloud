{{- if and .Values.oidc.enabled .Values.crunchy.enabled (not .Values.registry.components.postgres.managed) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.registry.name }}-oidc-client
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.oidc.clientSecret.secretStoreName }}
  target:
    name: {{ .Values.registry.name }}-oidc-client
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ required "oidc.clientSecret.vaultKey is required" .Values.oidc.clientSecret.vaultKey }}
        property: {{ required "oidc.clientSecret.property is required" .Values.oidc.clientSecret.property }}
{{- end }}
