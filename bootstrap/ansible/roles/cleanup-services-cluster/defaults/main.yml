---
services_api_host: ""
services_api_token: ""

# Namespaces to delete entirely (platform-provisioned, non-sovereign-* prefix)
services_platform_namespaces:
  - vault
  - rhbk
  - aap
  - quay-enterprise
  - gitea
  - openshift-storage

# CR groups to remove from all namespaces
services_cr_groups:
  - group: hybridsovereign.redhat
    version: v1alpha1
    # shc (LAB-PLAN §11.6): deleted in this order, each kind waited for (its finalizers' EDA teardowns)
    # before the next. Entity first: its finalizer tears down the entity namespace's CRs in dependency
    # order. Then anything left outside entity namespaces, clusters before clouds, platform config last.
    kinds:
      - Entity
      - Assignment
      - PlatformOpenshift
      - CloudOSO
      - Team
      - Project
      - AAPOrg
      - QuayOrg
      - VaultKV
      - Rbac
      - Vault
      - Iaac
      - AAPConfig
      - QuayConfig
      - RbacConfig

# Per kind: how long to wait for its CRs to be gone (cluster teardowns take ~30-60 min)
services_cr_delete_wait_minutes: 120

# OLM subscription and CSV names (operator lifecycle manager)
services_olm_subscriptions:
  - namespace: sovereign-cloud-plugins
    names:
      - plugin-rbac-operator
      - plugin-vault-operator
      - plugin-aap-operator
      - plugin-quay-operator
      - plugin-iaac-operator
  - namespace: sovereign-cloud
    names:
      - entity-operator
      - team-operator
      - assignment-operator
      - project-operator
      - platformopenshift-operator

# Namespaces NOT to delete (sovereign-* prefix protected)
protected_namespace_prefixes:
  - sovereign-

# Dynamic plugin ConfigMaps to remove from openshift-gitops
dynamic_plugin_configmaps: []
