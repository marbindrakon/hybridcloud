---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        quayorg_cr_name: "{{ event_payload.regarding.name }}"
        quayorg_cr_namespace: "{{ event_payload.regarding.namespace }}"
        quayorg_spec: "{{ shc_live_spec }}"

    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    # The registry connection is optional on the object: the teardown cleans up in the connection the
    # object recorded in status.config (else the one it names, else the platform's default).
    - name: Resolve the registry connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_integration_config.yml"
      vars:
        resolve_config_kind: QuayConfig
        resolve_config_name: "{{ quayorg_spec.quayConfig | default('') }}"
        resolve_config_recorded: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).config | default('', true) }}"
        resolve_config_teardown: true
        resolve_config_namespace: "{{ plugin_quay_config_namespace }}"
        resolve_config_required: false

    - name: Use the resolved registry connection
      ansible.builtin.set_fact:
        quayorg_spec: "{{ quayorg_spec | combine({'quayConfig': resolved_config_name}) }}"

    # the name the provision recorded; nothing recorded = the provision never made or kept an organization
    - name: The organization's recorded name
      ansible.builtin.set_fact:
        fin_org_name: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).orgName | default('', true) }}"

    - name: Read QuayConfig
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: QuayConfig
        name: "{{ quayorg_spec.quayConfig }}"
        namespace: "{{ plugin_quay_config_namespace }}"
      register: _quay_config
      when: quayorg_spec.quayConfig | length > 0
      ignore_errors: true

    - name: Delete Quay org
      when: _quay_config.resources | default([]) | length > 0 and fin_org_name | length > 0
      block:
        - name: Require the registry organizations' mail domain
          ansible.builtin.fail:
            msg: >-
              The setting REGISTRY_ORG_MAIL_DOMAIN of the automation configuration is not set: without it the
              platform cannot tell its own registry organization from another of the same name.
          when: quayorg_mail_domain | default('', true) | length == 0

        # the same credentials and URL the provision role uses (central Vault KV quay-services-admin); the
        # QuayConfig's spec.secret is a legacy pointer without a token, so the delete below ran with an undefined
        # token while the deletion was still reported complete
        - name: Load Quay admin credentials from Vault
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_quay_admin_credentials.yml"

        - name: Read the organization in Quay
          ansible.builtin.uri:
            url: "{{ quay_url }}/api/v1/organization/{{ fin_org_name | urlencode }}"
            method: GET
            headers:
              Authorization: "Bearer {{ quay_api_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: _fin_org

        # only an organization with the platform's mark (or none, made before the mark) under the recorded name
        - name: "Decide: delete or leave"
          vars:
            _email: "{{ (_fin_org.json | default({}, true)).email | default('', true) if (_fin_org.status | int) == 200 else '' }}"
          ansible.builtin.set_fact:
            quayorg_fin_decision: >-
              {{ 'gone' if (_fin_org.status | int) == 404
                 else ('delete' if _email in [fin_org_name ~ '@' ~ quayorg_mail_domain, ''] else 'leave') }}

        - name: Delete organization from Quay
          when: quayorg_fin_decision == 'delete'
          ansible.builtin.uri:
            url: "{{ quay_url }}/api/v1/organization/{{ fin_org_name | urlencode }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ quay_api_token }}"
            validate_certs: false
            status_code: [200, 204, 404]
      # a tool-side failure fails the teardown (TeardownFailed, retried) instead of leaving the organization behind

    - name: Get current timestamp for status
      ansible.builtin.set_fact:
        quayorg_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark QuayOrg deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: quayorgs
        cr_name: "{{ quayorg_cr_name }}"
        cr_namespace: "{{ quayorg_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          lastReconciledAt: "{{ quayorg_delete_transition_time }}"
          message: >-
            {{ ('QuayOrg ' ~ quayorg_cr_name ~ ' deleted by EDA') if quayorg_fin_decision | default('') != 'leave'
               else ('QuayOrg ' ~ quayorg_cr_name ~ ' deleted; the registry organization ' ~ fin_org_name
                     ~ ' does not carry the platform\'s mark and was left untouched') }}

  rescue:
    - name: Mark QuayOrg delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: quayorgs
        cr_name: "{{ quayorg_cr_name }}"
        cr_namespace: "{{ quayorg_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA deletion failed')) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "QuayOrg {{ quayorg_cr_name | default('unknown') }} EDA teardown failed"
