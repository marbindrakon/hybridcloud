---
# The cluster's own identity on its OpenStack site: a Keystone user of the environment's domain made for this cluster
# alone (realization openstack.clusterIdentity: userName, roles or rolesBySite.<site>, credentialName; "{build}" = the
# build name), with the roles on the environment's project, and its restricted application credential at the
# cluster's Vault path cluster/oso/<build>/build/provider-creds (the installer's, the hub's copy for Hive, the
# network-name preflight's). files/shc_openstack.py cluster-identity keeps a credential that still signs in (a steady
# run touches no password); a new one reaches Vault from the helper's private file (vault_kv_write.yml with a source
# file), never through a fact or a task argument. Only this cluster's user is touched, so no other cluster loses a
# token. Included by platformopenshift_provision openstack_preflight.yml once the build name is known to be this
# cluster's.
# Uses cb_app_name, cloudoso_cr (the environment), cb_fip_account (the site account), cb_oso_site, cb_oso_project_id.
# Sets cb_provider_creds_vault, cb_credential; records status.credential and condition ClusterCredential; a refusal of
# the site fails the job with reason UserRefused / RoleRefused / PasswordRefused / CredentialRefused; a recorded
# credential whose secret Vault does not hold fails it with CredentialSecretMissing and changes nothing (replacing the
# credential of a running cluster is not offered); a site that does not answer fails it plainly, refusing nothing.
- name: Load the realization defaults (the cluster's identity)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../../common/vars/fabric_realization.yml"

- name: The cluster's identity settings
  vars:
    _real: "{{ fabric_realization_defaults | combine(fabric_realization | default({}, true), recursive=True) }}"
    _ci: "{{ (_real.openstack | default({})).clusterIdentity | default({}) }}"
    _by_site: "{{ _ci.rolesBySite | default({}, true) }}"
    _st: "{{ cloudoso_cr.resources[0].status | default({}, true) }}"
  ansible.builtin.set_fact:
    cc_user: "{{ (_ci.userName | default('{build}', true)) | replace('{build}', cb_app_name) }}"
    cc_cred_name: "{{ (_ci.credentialName | default('{build}', true)) | replace('{build}', cb_app_name) }}"
    cc_roles: "{{ _by_site[cb_oso_site] if cb_oso_site in _by_site else (_ci.roles | default(['member'], true)) }}"
    cc_domain: "{{ _st.domainName | default('', true) }}"
    cb_provider_creds_vault: "cluster/oso/{{ cb_app_name }}/build/provider-creds"
    cc_tmp: "/tmp/eda-po-cred-{{ cb_app_name }}"

- name: Require the environment's project and domain
  ansible.builtin.assert:
    that:
      - cc_domain | length > 0
      - cb_oso_project_id | length > 0
      - cb_fip_account | length > 0
    fail_msg: >-
      PlatformOpenshift {{ ansible_operator_meta.name }}: environment {{ oso_env_name }} has no recorded project,
      domain or site account; reconcile the environment first.

- name: The cluster's user and credential
  block:
    - name: Load the site account
      ansible.builtin.include_tasks: openstack_account.yml
      vars:
        shc_step: "Prepare the cluster's identity on the site"
        os_account_vault_path: "{{ cb_fip_account }}"
        os_account_tag: "po-cred-{{ cb_app_name }}"

    # the credential Vault holds goes to a private file the helper reads (files/shc_vault_files.py: the task's
    # result names the fields only, no result or fact ever holds the secret); Vault not answering stops the job here
    # with nothing changed (a missing path is "no credential yet")
    - name: Read the cluster's credential from Vault into a private file
      ansible.builtin.command:
        argv: [python3, "{{ role_path }}/../../../common/files/shc_vault_files.py"]
        stdin: >-
          {{ {'path': cb_provider_creds_vault, 'missing_ok': true,
              'files': {'clouds.yaml': cc_tmp ~ '-vault.yaml'}} | to_json }}
      register: _cc_vault
      changed_when: false
      failed_when: false

    - name: What Vault holds for the cluster
      ansible.builtin.set_fact:
        cc_vault_fields: >-
          {{ (_cc_vault.stdout | from_json) if (_cc_vault.stdout | default('') | trim).startswith('{')
             else {'error': (_cc_vault.stderr | default('') | trim)[-300:]} }}

    # what Vault or the site answered goes to the job's log only; the failures and refusals below are the
    # platform's own sentences
    - name: Vault's answer, for the job's log
      ansible.builtin.debug:
        msg: "{{ cc_vault_fields.error | default('') }}"
      when: _cc_vault.rc != 0

    - name: Stop when Vault did not answer (nothing changed)
      ansible.builtin.fail:
        msg: >-
          PlatformOpenshift {{ ansible_operator_meta.name }}: the cluster's credential could not be read from the
          platform's secret store; nothing was changed, the next run reads it again.
      when: _cc_vault.rc != 0

    - name: The cluster's user, its roles and its credential on the site
      ansible.builtin.include_tasks: openstack_call.yml
      vars:
        shc_step: "Prepare the cluster's identity on the site"
        os_call_no_log: false
        os_call_soft: true
        os_request:
          action: cluster-identity
          domain: "{{ cc_domain }}"
          project_id: "{{ cb_oso_project_id }}"
          user_name: "{{ cc_user }}"
          description: "User of OpenShift cluster {{ ansible_operator_meta.namespace }}/{{ ansible_operator_meta.name }} (build {{ cb_app_name }})"
          roles: "{{ cc_roles }}"
          credential_name: "{{ cc_cred_name }}"
          credential_description: "OpenShift cluster {{ ansible_operator_meta.namespace }}/{{ ansible_operator_meta.name }}"
          vault_file: "{{ (cc_tmp ~ '-vault.yaml') if 'clouds.yaml' in (cc_vault_fields.written | default([])) else '' }}"
          # a recorded credential whose secret Vault does not hold is never replaced by the job (the cluster may
          # still run on it): CredentialSecretMissing
          recorded_credential_id: >-
            {{ ((((po_cr_current | default({})).resources | default([]) | first | default({})).status
                | default({}, true)).credential | default({}, true)).id | default('', true) | trim }}
          out_file: "{{ cc_tmp }}-write.json"

    - name: Keep the site's answer
      ansible.builtin.set_fact:
        cb_credential: "{{ os_result }}"

    # the site did not answer (5xx, a timeout, no connection): the job stops, nothing was changed and nothing is
    # refused; the next run asks again
    - name: The site's answer, for the job's log
      ansible.builtin.debug:
        msg: "{{ cb_credential.message | default('', true) or cb_credential.error | default('', true) }}"
      when: (cb_credential.error | default('', true)) | length > 0

    - name: Stop when the site did not answer
      ansible.builtin.fail:
        msg: >-
          PlatformOpenshift {{ ansible_operator_meta.name }}: the site did not answer the cluster's identity step;
          nothing was refused, the next run asks again.
      when:
        - (cb_credential.error | default('', true)) | length > 0
        - (cb_credential.reason | default('', true)) | length == 0

    - name: Refuse the cluster when the site refused its identity
      when: (cb_credential.reason | default('', true)) | length > 0
      block:
        - name: Note the refusal
          vars:
            # the site's reason when it is one of these, its own sentence never
            _texts:
              UserRefused: The site refused the cluster's user.
              RoleRefused: The site refused a role for the cluster's user.
              PasswordRefused: The site refused to set up the cluster's user.
              CredentialRefused: The site refused the cluster's credential.
              CredentialSecretMissing: >-
                The cluster's credential is recorded, but its secret is not in the platform's secret store. The
                cluster may still be using the credential, so nothing was changed on the site. A platform
                administrator must restore the secret or replace the credential in the cluster.
            _reason: "{{ cb_credential.reason if cb_credential.reason in _texts else 'CredentialRefused' }}"
            _msg: >-
              {{ _texts[_reason] ~ ('' if _reason == 'CredentialSecretMissing'
                 else " The cluster cannot be built; the platform team can see why in the job's log.") }}
          ansible.builtin.set_fact:
            po_fail_reason: "{{ _reason }}"
            po_preflight_condition:
              type: ClusterCredential
              status: "False"
              reason: "{{ _reason }}"
              message: "{{ _msg | trim | truncate(1000, true, '') }}"

        - name: Fail with the site's refusal
          ansible.builtin.fail:
            msg: "{{ po_preflight_condition.message }}"

    - name: Write the new credential to Vault
      ansible.builtin.include_tasks: vault_kv_write.yml
      vars:
        vault_kv_path: "{{ cb_provider_creds_vault }}"
        vault_kv_write_src: "{{ cc_tmp }}-write.json"
      when: cb_credential.wrote | bool
  always:
    - name: Remove the private files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cc_tmp }}-vault.yaml"
        - "{{ cc_tmp }}-write.json"
        - "/tmp/eda-po-cred-{{ cb_app_name }}-clouds.yaml"
        - "/tmp/eda-po-cred-{{ cb_app_name }}-ca.crt"

# recorded before anything else uses it: a refusal of a later check leaves a cluster whose delete removes the user
- name: Record the cluster's credential
  ansible.builtin.include_tasks: patch_cr_status.yml
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ ansible_operator_meta.name }}"
    cr_namespace: "{{ ansible_operator_meta.namespace }}"
    cr_status_partial: true
    cr_status_body:
      credential:
        id: "{{ cb_credential.credential.id }}"
        user: "{{ cb_credential.user.name }}"
        userId: "{{ cb_credential.user.id }}"
        domain: "{{ cc_domain }}"
        domainId: "{{ cb_credential.user.domainId }}"
        # when the platform made it (the site reports no time): this run's, else the recorded one of the same
        # credential; a kept credential never loses its recorded time
        createdAt: >-
          {%- set _rec = ((po_cr_current.resources[0].status | default({}, true)).credential | default({}, true)) -%}
          {{ cb_credential.credential.createdAt | default('', true)
             or (_rec.createdAt | default('', true) if (_rec.id | default('', true)) == cb_credential.credential.id
                 else '') }}
      conditions:
        - type: ClusterCredential
          status: "True"
          lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          reason: OwnCredential
          message: "The cluster uses its own credential on the site, owned by the site user {{ cb_credential.user.name }}."
