{{- /*
The management cluster's ACM creator credential for the Assignment jobs (OD48): the token and CA of a service
account that may only manage ACM Policies, Placements and PlacementBindings in the policy namespace there. The
management cluster pushes them to Vault (key .Values.assignmentAcmCreator.vaultPath, properties token and ca.crt);
this ExternalSecret brings them here as the Secret the Assignment provision and teardown jobs read
(acm_central_sa_secret_name in .Values.namespace). Off by default.
The credential is powerful: an enforcing ACM ConfigurationPolicy runs with cluster-admin rights on every cluster
its Placement selects, so every principal that may read Secrets in .Values.namespace (including accounts with
cluster-wide Secret read) holds that power. Turn it on only once the management cluster binds the policy
namespace to the tenant cluster set alone (no hub or platform cluster) and the account has no
ManagedClusterSetBinding or bind rights.
*/}}
{{- with .Values.assignmentAcmCreator }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "primary-operator.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .secretStoreName }}
    kind: {{ .secretStoreKind }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: {{ .vaultPath }}
        property: token
    - secretKey: ca.crt
      remoteRef:
        key: {{ .vaultPath }}
        property: ca.crt
{{- end }}
{{- end }}
