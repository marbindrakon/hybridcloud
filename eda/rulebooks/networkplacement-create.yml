---
- name: NetworkPlacement Create Rulebook
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: "hybridsovereign-kafka-kafka-bootstrap-amq-streams.apps.central.shc.signal9.gg"
        port: "443"
        topic: hybridsovereign-events
        group_id: eda-networkplacement-create
        security_protocol: SASL_SSL
        sasl_mechanism: SCRAM-SHA-512
        sasl_plain_username: "{{ KAFKA_USERNAME }}"
        sasl_plain_password: "{{ KAFKA_PASSWORD }}"
        check_hostname: false
        verify_mode: CERT_NONE
  rules:
    - name: Handle NetworkPlacement Create
      condition: event.body.payload.reason in ["NetworkPlacementCreateRequested", "NetworkPlacementReconcileRequested"] and event.body.payload.regarding.kind == "NetworkPlacement"
      action:
        run_job_template:
          name: networkplacement-provision
          organization: sovereign
          job_args:
            extra_vars:
              event_payload: "{{ event.body.payload }}"
