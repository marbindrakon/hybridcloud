# The tenant baseline and the tenant profile (plan be-tenantprofile-catalogue section 4: R1-R6), and the acme-corp
# demo grants (R16-R22; samples/demo/acme-corp.yaml, only for tenant acme-corp). Format: tests/rbac-access/README.md.
# envtest for the demo: --entity acme-corp --entity-spec samples/demo/acme-corp.yaml
#   --scope-fixture samples/demo/acme-corp.yaml --render-roles
- id: R1-namespace-visible
  resolves: [UX-002]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: "", resource: namespaces, name: "entity-{entity}"}
  verbs: [get]
  expect: allow
- id: R2-project-visible
  resolves: [UX-002]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: project.openshift.io, resource: projects, name: "entity-{entity}"}
  verbs: [get]
  expect: allow
- id: R3-tenantprofile-readable
  resolves: [UX-001, UX-005, UX-039]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: hybridsovereign.redhat, resource: tenantprofiles}
  verbs: [get, list, watch]
  expect: allow
- id: R3-tenantprofile-read-only
  resolves: [UX-100]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: hybridsovereign.redhat, resource: tenantprofiles}
  verbs: [create, update, patch, delete]
  expect: deny
- id: R3-tenantprofile-status-read-only
  resolves: [UX-100]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: hybridsovereign.redhat, resource: tenantprofiles, subresource: status}
  verbs: [update, patch]
  expect: deny
- id: R4-no-platform-entities
  resolves: [UX-100]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: sovereign-cloud
  resource: {group: hybridsovereign.redhat, resource: entities}
  verbs: [get, list]
  expect: deny
- id: R4-no-platform-sites
  resolves: [UX-039]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: sovereign-cloud
  resource: {group: hybridsovereign.redhat, resource: cloudinfrastructures}
  verbs: [get, list]
  expect: deny
- id: R5-not-other-tenant-namespace
  resolves: [UX-002]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{other_entity}"
  resource: {group: "", resource: namespaces, name: "entity-{other_entity}"}
  verbs: [get]
  expect: deny
- id: R5-not-other-tenant-profile
  resolves: [UX-100]
  principal: {groups: ["{group:*}", system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{other_entity}"
  resource: {group: hybridsovereign.redhat, resource: tenantprofiles}
  verbs: [get, list]
  expect: deny
- id: R6-norole-no-profile
  resolves: [UX-005]
  principal: {user: uxr-nobody, groups: [system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: hybridsovereign.redhat, resource: tenantprofiles}
  verbs: [get, list]
  expect: deny
- id: R6-norole-no-namespace
  resolves: [UX-005]
  principal: {user: uxr-nobody, groups: [system:authenticated, system:authenticated:oauth]}
  namespace: "entity-{entity}"
  resource: {group: "", resource: namespaces, name: "entity-{entity}"}
  verbs: [get]
  expect: deny

