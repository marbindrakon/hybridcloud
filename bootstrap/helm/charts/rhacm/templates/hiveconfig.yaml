{{- with .Values.hive.awsServiceProvider }}
{{- if .roleArn }}
---
# Hive's AWS service-provider identity (shc P8): no keys. Hive's controllers and its install/uninstall pods present
# their own service-account token (web identity) for this role; each ClusterDeployment then assumes its account's
# role through spec.platform.aws.credentialsAssumeRole. Hive reads key aws_config, copies this secret into
# ClusterDeployment namespaces and uses it as the source profile of the assumed role.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.hive.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  aws_config: |
    [default]
    role_arn = {{ .roleArn }}
    web_identity_token_file = {{ .tokenFile }}
---
# HiveConfig "hive" is created (empty) and owned by the MultiClusterEngine, which never updates it: only this field is
# applied (server-side) and Argo CD never deletes the object.
apiVersion: hive.openshift.io/v1
kind: HiveConfig
metadata:
  name: hive
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,SkipDryRunOnMissingResource=true
spec:
  serviceProviderCredentialsConfig:
    aws:
      credentialsSecretRef:
        name: {{ .secretName }}
{{- end }}
{{- end }}
