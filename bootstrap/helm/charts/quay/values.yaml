namePrefix: ""
skipNamespace: false

operator:
  channel: stable-3.17
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace

namespace: quay-enterprise

registry:
  enabled: true
  name: sovereign-registry
  components:
    objectstorage:
      managed: false
    postgres:
      managed: true
    clair:
      managed: true
    redis:
      managed: true
    mirror:
      managed: true
    route:
      managed: true
    tls:
      managed: true
    monitoring:
      managed: true
    horizontalpodautoscaler:
      managed: true
    clairpostgres:
      managed: true

objectStorage:
  bucketName: "quay-datastorage"

crunchy:
  enabled: false
  name: quay-pgcluster
  instances: 2
  storage: 20Gi
  backupStorage: 20Gi

dbInitJob:
  image: "/hybrid-sovereign/ansible-runner:latest"

# shc: OIDC login (Keycloak/RHBK) written into the config bundle by the db-init job. The quay-config
# job's superuser-config API route answers 403 on operator-managed Quay 3.17. The client secret
# comes from Vault through an ExternalSecret.
oidc:
  enabled: false
  configKey: RHBK_LOGIN_CONFIG      # <ID>_LOGIN_CONFIG; <ID> becomes the external login service id
  serviceName: Keycloak
  clientId: ""
  server: ""                        # realm URL; a trailing slash is added
  loginScopes: [openid, email, profile]
  groupClaim: groups
  authenticationType: OIDC          # upstream's intent (team sync from OIDC groups)
  clientSecret:
    secretStoreName: vault-backend
    vaultKey: ""
    property: ""

# shc: object storage on Ceph RGW (unmanaged objectstorage; set registry.components.objectstorage.
# managed: false). The db-init job merges DISTRIBUTED_STORAGE_* into the config bundle; the keys
# (access_key, secret_key) come from Vault through an ExternalSecret.
rgw:
  enabled: false
  hostname: ""
  port: 443
  isSecure: true
  bucket: ""
  storagePath: /datastorage/registry
  credentials:
    secretStoreName: vault-backend
    vaultKey: ""
