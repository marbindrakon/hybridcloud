{{- if .Values.postgres.enabled }}
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.postgres.name | default "aap-pgcluster" }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if .Values.postgres.syncRunId }}
    postgres-operator.crunchydata.com/reconcile: {{ .Values.postgres.syncRunId | quote }}
    {{- end }}
spec:
  postgresVersion: 16
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          max_wal_size: "2GB"
          min_wal_size: "512MB"
          wal_keep_size: "512MB"
  instances:
    - name: pgha
      replicas: {{ .Values.postgres.instances | default 1 }}
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage | default "10Gi" }}
  backups:
    pgbackrest:
      # Backups run on a schedule and old ones expire. Without a schedule the repository keeps every write-ahead
      # log since the first backup, fills, and the database stops when it can no longer archive.
      global:
        repo1-retention-full: {{ ((.Values.postgres.backup).retentionFull | default 2) | quote }}
        repo1-retention-full-type: count
        repo1-retention-diff: {{ ((.Values.postgres.backup).retentionDifferential | default 2) | quote }}
      # A full backup on demand: annotate the PostgresCluster with postgres-operator.crunchydata.com/pgbackrest-backup
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: {{ ((.Values.postgres.backup).fullSchedule | default "10 1 * * 0") | quote }}
            {{- $backup := (.Values.postgres.backup) | default dict }}
            {{- if not (hasKey $backup "differentialSchedule") }}
            differential: "10 1 * * 1-6"
            {{- else if $backup.differentialSchedule }}
            differential: {{ $backup.differentialSchedule | quote }}
            {{- end }}
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: {{ .Values.postgres.backupStorage | default "10Gi" }}
  users:
    - name: aap
      databases:
        - aap
      options: "SUPERUSER"
{{- end }}
