---
# Route53 environments: remove an NS delegation for the slug domain if one exists (upstream's older
# provision created one). Credentials come straight from Vault, not a temporary ExternalSecret.
- name: Read the Route53 credentials
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ oso_route53_vault_path }}"

- name: Remove NS delegation for slug zone
  amazon.aws.route53:
    state: absent
    zone: "{{ oso_base_domain }}"
    record: "{{ oso_domain }}"
    type: NS
  environment:
    AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
    AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
    AWS_DEFAULT_REGION: "us-east-1"
  register: r53_ns_delete
  failed_when: r53_ns_delete.failed and 'not found' not in (r53_ns_delete.msg | default('') | lower)
