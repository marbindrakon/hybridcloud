---
# shc (design/P7-PLAN.md P7.3.9): fabric orphan check, report only. Gathers what the fabric jobs realized (the
# fabric ledgers; on each gateway's site: the placements' networks and advertisements and the CloudVirt namespaces
# by the platform's labels, or the platform project's networks and routers; on the border gateway nodes: the
# gateway namespaces and their VRFs; the root's VRFs and attachment circuit devices) and compares it with the CRs
# (files/shc_fabric.py orphan-report). Fails when
# anything has no owner, so the job shows red; changes nothing.
- name: Resolve services cluster API connection from Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

- name: Read the fabric CRs
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: "{{ item }}"
  loop: [HybridFabric, CloudGateway, HybridNetwork, NetworkPlacement, CloudVirt, AttachmentCircuit]
  register: _foc_crs

- name: Set the CR facts
  ansible.builtin.set_fact:
    foc_crs:
      fabrics: "{{ _foc_crs.results[0].resources }}"
      gateways: "{{ _foc_crs.results[1].resources }}"
      networks: "{{ _foc_crs.results[2].resources }}"
      placements: "{{ _foc_crs.results[3].resources }}"
      cloudvirts: "{{ _foc_crs.results[4].resources }}"
      circuits: "{{ _foc_crs.results[5].resources }}"
    foc_ledgers: {}
    foc_sites: []
    foc_nodes: []

- name: Read the ledgers
  ansible.builtin.include_tasks: ledger.yml
  loop: "{{ foc_crs.fabrics }}"
  loop_control:
    loop_var: foc_fabric
    label: "{{ foc_fabric.metadata.name }}"

- name: Read each gateway's site
  ansible.builtin.include_tasks: site.yml
  loop: "{{ foc_crs.gateways }}"
  loop_control:
    loop_var: foc_gw
    label: "{{ foc_gw.metadata.name }}"

- name: Read the border gateway nodes
  ansible.builtin.include_tasks: nodes.yml
  loop: "{{ foc_crs.fabrics }}"
  loop_control:
    loop_var: foc_fabric
    label: "{{ foc_fabric.metadata.name }}"

- name: Compare
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
  vars:
    fab_check: {action: orphan-report, crs: "{{ foc_crs }}", ledgers: "{{ foc_ledgers }}", sites: "{{ foc_sites }}", nodes: "{{ foc_nodes }}"}

- name: Report
  ansible.builtin.debug:
    msg: "{{ ['fabric orphan check: ' ~ (fab_check_result.findings | length) ~ ' finding(s); ' ~ (fab_check_result.counts | to_json)] + fab_check_result.findings }}"

- name: Record the result for the job
  ansible.builtin.set_stats:
    data:
      fabric_orphan_findings: "{{ fab_check_result.findings }}"

- name: Fail on findings
  ansible.builtin.fail:
    msg: "fabric orphan check: {{ fab_check_result.findings | length }} finding(s): {{ fab_check_result.findings | join('; ') }}"
  when: fab_check_result.findings | length > 0
