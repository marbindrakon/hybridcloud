---
# shc (design/P7-PLAN.md P7.3.4, §12.3 + H2): HybridFabric provision.
# 1. Validate the fabric and its credentials (SSH key for the border gateway nodes, BGP password).
# 2. Ledger: ConfigMap fabric-ledger-<fabric> (pools; provider-edge index 1 = the border gateway root).
#    The platform address pools (realization ipam.publicPools) are kept in the ledger on every run and their use is
#    reported in status.realization.ipam.pools; a pool change wakes the networks waiting for platform address space.
# 3. Under the lease fabric-config-<fabric>, one node at a time: the root instance (shc-fabric-apply root: MPLS,
#    the node-local core bridge, the loopback; FRR: VPNv4 route reflector for the core's loopback range, IS-IS
#    with segment routing; with the core transport srv6 (realization core.transport):
#    SRv6 instead of MPLS and segment routing, the VPN sessions over the IPv6 loopbacks). A failure stops before the
#    next node. The job renews the lease before each node, around
#    its long wait and before its long steps, and every step on a node runs within the lease (fabric_lease.yml); a
#    step that timed out keeps the lease until it runs out (fabric_lease_keep.yml).
# 4. Provider internet egress (realization egress.enabled): the HybridNetworks holding an egress index in the
#    ledger that still want it (spec.egress.internet, not being deleted) get a VRF on every node's root with a
#    default route into their VPN and source NAT (status.realization.egress); the job is the only writer of it and
#    wakes the networks it added or removed.
# 5. Attachment circuits (realization attachments.enabled, design/P9-PLAN.md §4): the AttachmentCircuits holding a
#    VLAN and a link in the ledger on a network that holds its VPN target (not being deleted, not released) get, in
#    the network's root VRF on every node, a VLAN device on their bearer and an eBGP session to the CE with the
#    circuit's routing policy (status.realization.attachments, with what wasn't realized and why under
#    attachmentsSkipped); the job wakes the circuits whose realization changed.
# 6. The service VRF (realization service.enabled): the AttachmentCircuits of ceKind platform hand it off to the hub's
#    network; each HybridNetwork with cluster prefixes (status.platformAccess.prefixes, written by the network job)
#    gets a service link on every node with a platform circuit and its accepted prefixes routed there, first come
#    first served by the ledger (kind servicePrefix) (status.realization.service); the job wakes the networks whose
#    realized or refused prefixes changed and the platform circuits whose realization changed.
# 7. The ranges tenants may not use (status.reservedRanges: the realization's infrastructure, core and pool ranges,
#    and each site's own); when they or the ranges a cluster may take (service.attachableRanges; none = any range not
#    reserved) change, the Entities are woken to copy them into the tenants' profiles.
# 8. Wakes from other jobs that came during the run waited for it (the controller does not let them supersede a job
#    in flight): the job has the controller publish them once it has written its status (deferred_wakes.yml).
- block:
    - name: Read the HybridFabric
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"

    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ fab_name }}"

    - name: Check the numbering and the core
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: check-fabric, spec: "{{ fab_spec }}", realization: "{{ fab_real }}"}

    - name: Refuse an invalid fabric
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: "HybridFabric {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on an invalid fabric
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    - name: Keep the pool sizes
      ansible.builtin.set_fact:
        hf_pools: "{{ fab_check_result.poolSize }}"
        hf_pe_max: "{{ fab_check_result.peIndexMax | int }}"

    - name: Expect the border gateway SSH key
      ansible.builtin.set_fact:
        fab_fail_reason: CredentialsMissing
        fab_fail_msg: >-
          HybridFabric {{ fab_name }}: borderGateway.credentialsRef {{ fab_spec.borderGateway.credentialsRef.vaultPath }}
          is not readable or has no ssh_private_key

    - name: Connect to the border gateway nodes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_connect.yml"
      vars:
        bgw_fabric_spec: "{{ fab_spec }}"
        bgw_ssh_user: "{{ fab_real.nodes.sshUser }}"

    - name: Read the BGP session password
      when: (fab_spec.bgp | default({})).passwordRef is defined
      block:
        - name: Expect the BGP password
          ansible.builtin.set_fact:
            fab_fail_msg: >-
              HybridFabric {{ fab_name }}: bgp.passwordRef {{ fab_spec.bgp.passwordRef.vaultPath }} is not readable
              or has no password

        - name: Read bgp.passwordRef
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: "{{ fab_spec.bgp.passwordRef.vaultPath }}"

        - name: Require password
          ansible.builtin.assert:
            that: (vault_kv_data.password | default('')) | length > 0
            quiet: true
          no_log: true

    - name: Drop the secrets
      ansible.builtin.set_fact:
        vault_kv_data: {}
        fab_fail_reason: ProvisionFailed
        fab_fail_msg: ""
      no_log: true

    - name: Ensure the ledger
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-ensure
          namespace: "{{ fab_namespace }}"
          fabric: "{{ fab_name }}"
          fabric_uid: "{{ fab_obj.metadata.uid }}"
          pools:
            vni: ["{{ fab_spec.vniPool.start }}", "{{ fab_spec.vniPool.end }}"]
            l2vni: ["{{ fab_spec.l2vniPool.start }}", "{{ fab_spec.l2vniPool.end }}"]
            vpnTarget: ["{{ fab_real.vpnTargetPool.start }}", "{{ fab_real.vpnTargetPool.end }}"]
            peIndex: [1, "{{ hf_pe_max }}"]
            # empty when egress is off: the ledger refuses that while networks hold an index
            egress: [0, "{{ (hf_pools.egressPool | int) - 1 }}"]
            # attachment circuits (empty when attachments are off; refused while circuits hold values)
            attachVlan: "{{ hf_pools.attachVlanPool }}"
            attachLink: [0, "{{ (hf_pools.attachLinks | int) - 1 }}"]
            # the service VRF's prefixes (owner HybridNetwork/<ns>/<name>/<prefix>; the value orders them: first come
            # first served), recorded by the network job when it accepts a cluster's prefix
            servicePrefix: [1, 1048575]
          # (dict keys are not templated: build the owner key in an expression)
          reserve: "{{ {'peIndex': {'HybridFabric/' ~ fab_namespace ~ '/' ~ fab_name: 1}} }}"

    - name: Keep the ledger counts
      ansible.builtin.set_fact:
        hf_ledger: "{{ fab_ledger_result }}"

    # the platform address pools (realization ipam.publicPools) and the offer tenants see of them, on every fabric run
    # (pools.yml: a realization change reaches the ledger and status.realization.ipam without a network run; a
    # malformed or refused pool realization never fails the fabric). The offer the Entities were told is stored in
    # status.realization.ipam.tenantOffer before the status write below.
    - name: The platform address pools and the tenants' offer
      ansible.builtin.include_tasks: pools.yml

    - name: The root's provider-edge addresses (index 1)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: pe-addresses, core: "{{ fab_real.core }}", index: 1}

    - name: Set the root instance
      ansible.builtin.set_fact:
        hf_pe: "{{ fab_check_result }}"
        hf_root:
          type: root
          bridge: "{{ fab_real.core.bridge }}"
          mtu: "{{ fab_spec.overlayMtu | int + 100 }}"
          loopback: "{{ fab_check_result.loopback }}"
          loopbackPool: "{{ fab_real.core.loopbackPool }}"
          link: "{{ fab_check_result.link }}"
        hf_holder: "HybridFabric/{{ fab_name }} job {{ tower_job_id | default(awx_job_id | default(lookup('pipe', 'date +%s'))) }}"
        hf_node_results: []
        hf_changed_nodes: []

    # provider internet egress: the ledger's egress holders that still want it
    - name: Read the ledger
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-get, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}"}

    - name: Keep the ledger's allocations
      ansible.builtin.set_fact:
        hf_alloc: "{{ fab_ledger_result.ledger.alloc | default({}) }}"

    - name: List the HybridNetworks
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridNetwork
      register: _hf_networks

    # the placements: their IPv6 prefixes are what the IPv6 egress announces for a network
    - name: List the NetworkPlacements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
      register: _hf_placements

    # the cloud edge routers' ICMPv6 sources (CloudGateway status.realization.edgeRouterIcmpSources6): a network's
    # source set at the root admits those of the gateways its IPv6 placements use (egress.ipv6 only)
    - name: List the CloudGateways for their edge routers' ICMPv6 sources
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        namespace: "{{ fab_namespace }}"
      register: _hf_edge_gateways
      when: (fab_real.egress.ipv6 | default({}, true)).enabled | default(false) | bool

    # ipv4: the network has IPv4 address space (the IPv4 egress, source NAT, needs it). ipv6 (with egress.ipv6
    # enabled): the network wants internet egress and holds a platform block (status.ipv6 mode Platform): its block
    # and the IPv6 prefixes of its placements (status.subnets), the ones that are not being deleted and that come
    # from the network's space (a provider-assigned prefix is never announced upstream nor part of the network's block)
    # and the edge routers' ICMPv6 sources of the gateways those placements use (status.cloudGateway)
    - name: Set the networks with internet egress
      vars:
        _alloc: "{{ fab_ledger_result.ledger.alloc | default({}) }}"
        _v6on: "{{ (fab_real.egress.ipv6 | default({}, true)).enabled | default(false) | bool }}"
        _edge6: >-
          {%- set out = {} -%}
          {%- for g in (_hf_edge_gateways | default({})).resources | default([])
                if (g.spec.fabricRef | default({})).name | default('') == fab_name -%}
            {%- set _ = out.update({g.metadata.name: ((g.status | default({}, true)).realization | default({}, true)).edgeRouterIcmpSources6
                                                     | default([], true)}) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.set_fact:
        hf_egress_networks: >-
          {%- set out = [] -%}
          {%- for n in _hf_networks.resources | default([]) -%}
            {%- set owner = 'HybridNetwork/' ~ n.metadata.namespace ~ '/' ~ n.metadata.name -%}
            {%- set st = n.status | default({}, true) -%}
            {%- set internet = ((n.spec | default({})).egress | default({})).internet | default(false) | bool -%}
            {%- set has4 = ((((n.spec | default({})).prefixes | default([], true)) | reject('search', ':') | list | length > 0)
                            or ((st.addressSpace | default([], true)) | selectattr('family', 'defined')
                                | selectattr('family', 'equalto', 4) | list | length > 0)) -%}
            {%- set block = ((st.ipv6 | default({}, true)).block | default({}, true)).prefix | default('', true) -%}
            {%- set v6 = _v6on | bool and internet and (st.ipv6 | default({}, true)).mode | default('') == 'Platform'
                         and block | length > 0 -%}
            {%- if st.fabric | default('') == fab_name
                  and internet
                  and n.metadata.deletionTimestamp is not defined
                  and owner in (_alloc.egress | default({})) and owner in (_alloc.vpnTarget | default({})) -%}
              {%- set p6 = [] -%}
              {%- set e6 = [] -%}
              {%- if v6 -%}
                {%- for p in _hf_placements.resources | default([])
                      if p.metadata.namespace == n.metadata.namespace
                         and (p.spec | default({})).network | default('') == n.metadata.name
                         and p.metadata.deletionTimestamp is not defined -%}
                  {%- set ps = p.status | default({}, true) -%}
                  {%- for s in ps.subnets | default([], true)
                            if (s.family | default(4) | int) == 6 and (s.source | default('Network')) != 'Provider' -%}
                    {%- set _ = p6.append(s.prefix) -%}
                    {%- set _ = e6.extend(_edge6.get(ps.cloudGateway | default('', true), [])) -%}
                  {%- endfor -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set _ = out.append({'network': n.metadata.namespace ~ '/' ~ n.metadata.name,
                                      'vpnTarget': _alloc.vpnTarget[owner] | int, 'index': _alloc.egress[owner] | int,
                                      'internet': internet, 'ipv4': has4}
                                     | combine({'ipv6': {'block': block, 'prefixes': p6 | unique | list}
                                                        | combine({'edgeSources6': e6 | unique | sort | list}
                                                                  if e6 | length > 0 else {})} if v6 else {})) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out if fab_real.egress.enabled | default(false) | bool else [] }}
        hf_egress_before: >-
          {{ ((fab_st.realization | default({}, true)).egress | default({}, true)).networks | default([], true)
             | map(attribute='network') | list }}
        hf_egress6_before: >-
          {{ ((fab_st.realization | default({}, true)).egress | default({}, true)).networks | default([], true)
             | selectattr('ipv6', 'defined') | selectattr('ipv6', 'equalto', true) | map(attribute='network') | list }}

    - name: Plan the egress on the nodes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: egress-plan
          egress: "{{ fab_real.egress | default({}) }}"
          nodes: "{{ fab_spec.borderGateway.nodes | map(attribute='name') | list }}"
          networks: "{{ hf_egress_networks }}"
          domainAsn: "{{ fab_spec.domainAsn }}"
          core: "{{ fab_real.core | default({}) }}"
          translation: "{{ fab_real.translation | default({}, true) }}"
          # with the service VRF the egress links take the link pool's lower half
          service: "{{ (fab_real.service | default({}, true)).enabled | default(false) | bool }}"

    - name: Refuse an unusable egress plan
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: "HybridFabric {{ fab_name }}: egress: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on an unusable egress plan
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    - name: Keep the egress plan
      ansible.builtin.set_fact:
        hf_egress: "{{ fab_check_result }}"

    # the networks the platform's management connects from (realization infrastructure.hub, validated by check-fabric),
    # by family
    - name: The hub's ranges
      ansible.builtin.set_fact:
        hf_hub4: >-
          {{ (fab_real.infrastructure | default({}, true)).hub | default([], true) | reject('search', ':') | list }}
        hf_hub6: >-
          {{ (fab_real.infrastructure | default({}, true)).hub | default([], true) | select('search', ':') | list }}

    # attachment circuits: the circuits, their networks (address space: deny list) and placements (advertise list)
    - name: List the attachment circuits and the placements
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item }}"
      loop: [AttachmentCircuit, NetworkPlacement]
      register: _hf_att
      when: fab_real.attachments.enabled | default(false) | bool

    - name: Set the circuits of this fabric
      ansible.builtin.set_fact:
        hf_circuits: >-
          {{ ((_hf_att.results | default([{}]))[0].resources | default([]))
             | selectattr('status.fabric', 'defined') | selectattr('status.fabric', 'equalto', fab_name) | list }}
        hf_circuit_passwords: {}

    - name: Read the circuits' BGP passwords
      ansible.builtin.include_tasks: circuit_password.yml
      loop: >-
        {%- set out = [] -%}
        {%- for c in hf_circuits -%}
          {%- set r = (c.status | default({}, true)).realization | default({}, true) -%}
          {%- if r.authentication | default('') == 'md5' and r.passwordPath | default('') | length > 0
                and c.metadata.deletionTimestamp is not defined and not r.release | default(false) -%}
            {%- set _ = out.append({'circuit': c.metadata.namespace ~ '/' ~ c.metadata.name, 'passwordPath': r.passwordPath}) -%}
          {%- endif -%}
        {%- endfor -%}
        {{ out }}
      loop_control:
        loop_var: hf_circuit
        label: "{{ hf_circuit.circuit }}"

    - name: Plan the attachment circuits on the nodes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: attachments-plan
          fabric: "{{ fab_name }}"
          attachments: "{{ fab_real.attachments | default({}) }}"
          nodes: "{{ fab_spec.borderGateway.nodes | map(attribute='name') | list }}"
          tableBase: "{{ fab_real.egress.networkTableBase | default(100000) }}"
          domainAsn: "{{ fab_spec.domainAsn }}"
          circuits: "{{ hf_circuits }}"
          passwords: "{{ hf_circuit_passwords.keys() | list }}"
          networks: "{{ _hf_networks.resources | default([]) }}"
          placements: "{{ ((_hf_att.results | default([{}, {}]))[1] | default({})).resources | default([]) }}"
          ledger: "{{ hf_alloc }}"
          egress: "{{ hf_egress.networks }}"
          egressNodes: "{{ hf_egress.nodes }}"
          # the platform's ranges a CE's routes never reach into (as the circuit job checks the accept list), with the
          # IPv4 ranges of the networks the platform's management connects from (infrastructure.hub); a circuit's
          # traffic never reaches those (platformSources), and its IPv6 routes never reach into the IPv6 ones (hub6)
          reserved: >-
            {{ ([fab_real.attachments.linkPool, fab_real.core.loopbackPool, fab_real.core.linkSubnet,
                 fab_real.egress.linkPool | default('169.254.0.0/16')]
                + hf_hub4) if fab_real.attachments.enabled | default(false) | bool
               else [] }}
          platformSources: "{{ hf_hub4 }}"
          hub6: "{{ hf_hub6 }}"
          # circuits of ceKind platform: the service VRF's hand-off, in the fabric's namespace only
          service: "{{ fab_real.service | default({}, true) }}"
          fabricNamespace: "{{ fab_namespace }}"
          # circuits with IPv6: the helper derives the platform's IPv6 ranges (attachments.linkPool6 and reserved6,
          # the core's IPv6 loopbacks and ICMPv6 sources, the translation prefixes); egress[].ipv6 says which
          # networks have IPv6 internet egress
          core: "{{ fab_real.core | default({}, true) }}"
          translation: "{{ fab_real.translation | default({}, true) }}"

    - name: Keep the circuits' plan
      ansible.builtin.set_fact:
        hf_attach_plan: "{{ fab_check_result }}"

    # the ranges tenants may not use: the realization's and each site's own (its gateway's underlay and the
    # realization's placement.siteReserved of the site's kind), for status.reservedRanges (the Entity job copies them)
    # and for the service VRF, where every site's ranges refuse a cluster prefix (Review R4 H1)
    - name: List the gateways and sites for the ranges tenants may not use
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ item }}"
        namespace: "{{ fab_namespace }}"
      loop: [CloudGateway, CloudInfrastructure]
      register: _hf_sites

    - name: The fabric's sites and their own ranges
      vars:
        _types: >-
          {%- set out = {} -%}
          {%- for c in _hf_sites.results[1].resources | default([]) -%}
            {%- set _ = out.update({c.metadata.name: (c.spec | default({})).type | default('')}) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.set_fact:
        hf_sites: >-
            {%- set out = [] -%}
            {%- for g in _hf_sites.results[0].resources | default([])
                  if (g.spec.fabricRef | default({})).name | default('') == fab_name
                     and g.metadata.deletionTimestamp is not defined -%}
              {%- set site = (g.spec.cloudRef | default({})).name | default('') -%}
              {%- set cidr = (g.spec.siteUnderlay | default({})).cidr | default('', true) -%}
              {%- set _ = out.append({'name': site, 'kind': _types.get(site, ''),
                                      'ranges': [cidr] if cidr | length > 0 else []}) -%}
            {%- endfor -%}
            {{ out | sort(attribute='name') }}

    - name: The ranges tenants may not use
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: reserved-ranges
          realization: "{{ fab_real }}"
          sites: "{{ hf_sites }}"

    - name: Keep the ranges tenants may not use
      ansible.builtin.set_fact:
        hf_reserved: "{{ fab_check_result.ranges }}"

    # the service VRF: the networks' cluster prefixes (status.platformAccess) on every node with a platform circuit,
    # the root VRFs of the networks gaining their service links
    - name: Plan the service VRF on the nodes
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: service-plan
          realization: "{{ fab_real }}"
          nodes: "{{ fab_spec.borderGateway.nodes | map(attribute='name') | list }}"
          fabric: "{{ fab_name }}"
          domainAsn: "{{ fab_spec.domainAsn }}"
          networks: "{{ _hf_networks.resources | default([]) }}"
          ledger: "{{ hf_alloc }}"
          circuits: "{{ hf_attach_plan.platform | default([]) }}"
          vrfs: "{{ hf_attach_plan.vrfs | default({}) }}"
          previous: "{{ (fab_st.realization | default({}, true)).service | default({}, true) }}"
          sites: "{{ hf_sites }}"
          # (the admissions' age: service.admissionHoldMinutes)
          now: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Refuse an unusable service plan
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: "HybridFabric {{ fab_name }}: service: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on an unusable service plan
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    - name: Keep the service plan
      ansible.builtin.set_fact:
        hf_service: "{{ fab_check_result }}"
        hf_service_before: "{{ (fab_st.realization | default({}, true)).service | default({}, true) }}"

    # a wrong service setting stops the service only (Review R4 M2): the plan realizes none and its status says why;
    # the fabric says so once per change of the reason as a Warning event, and its other work goes on
    - name: Report the service routing domain not realized
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Event
          metadata:
            name: "{{ fab_name }}-service-{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"
            namespace: "{{ fab_namespace }}"
          involvedObject:
            apiVersion: hybridsovereign.redhat/v1alpha1
            kind: HybridFabric
            name: "{{ fab_name }}"
            namespace: "{{ fab_namespace }}"
            uid: "{{ fab_obj.metadata.uid }}"
          type: Warning
          reason: ServiceNotRealized
          message: "The service routing domain is not realized: {{ hf_service.status.message }}"
          source: {component: shc-hybridfabric}
          reportingComponent: shc-hybridfabric
          firstTimestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          lastTimestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          count: 1
      when:
        - (hf_service.status | default({})).reason | default('', true) | length > 0
        - (hf_service_before.message | default('', true)) != hf_service.status.message

    # what tenants see of these (the ranges and the ranges a managed cluster's prefixes must lie in) joins the offer
    # the Entities were told (status.realization.ipam.tenantOffer), so a change wakes them
    - name: Tell the Entities of the ranges tenants may not use
      ansible.builtin.set_fact:
        hf_tenant_offer: >-
          {{ hf_tenant_offer ~ '; ranges ' ~ ({'reservedRanges': hf_reserved,
                                               'managedClusterRanges': hf_service.status.attachableRanges}
                                              | to_json | hash('sha1'))[:12] }}

    # the address families of each root VRF (its FRR VRF's unicast families): IPv4, and IPv6 for a network with IPv6
    # egress (its default route into the VPN) or a circuit with IPv6 (a service link is IPv4 only). A node's circuit
    # with IPv6 also learns whether its IPv6 traffic may leave through the network's egress (egress6: the CE is given
    # the IPv6 default route)
    - name: Keep the attachment plan
      vars:
        # (a step run on its own, as the tests do, has the circuits' plan in fab_check_result and no service plan)
        _plan: >-
          {{ (hf_attach_plan | default(fab_check_result))
             | combine({'vrfs': (hf_service | default({})).vrfs
                                | default((hf_attach_plan | default(fab_check_result)).vrfs | default({}))}) }}
      ansible.builtin.set_fact:
        hf_attach: >-
          {%- set vrfs = {} -%}
          {%- for node, vs in (_plan.vrfs | default({})).items() -%}
            {%- set lst = [] -%}
            {%- for v in vs -%}
              {%- set v6 = v.ipv6 is defined or (v.circuits | default([]) | selectattr('ipv6', 'defined') | list | length > 0) -%}
              {%- set _ = lst.append(v | combine({'families': [4, 6] if v6 else [4]})) -%}
            {%- endfor -%}
            {%- set _ = vrfs.update({node: lst}) -%}
          {%- endfor -%}
          {%- set open6 = {} -%}
          {%- for c in _plan.circuits | default([]) if c.ipv6 is defined -%}
            {%- set _ = open6.update({c.circuit: c.ipv6.advertiseDefault | default(false) | bool}) -%}
          {%- endfor -%}
          {%- set nodes = {} -%}
          {%- for node, n in (_plan.nodes | default({})).items() -%}
            {%- set lst = [] -%}
            {%- for c in n.circuits | default([]) -%}
              {%- set _ = lst.append(c | combine({'egress6': open6.get(c.circuit, false)}) if c.address6 | default('') else c) -%}
            {%- endfor -%}
            {%- set _ = nodes.update({node: n | combine({'circuits': lst})}) -%}
          {%- endfor -%}
          {{ _plan | combine({'vrfs': vrfs, 'nodes': nodes}) }}
        hf_attach_restart: "{{ fab_real.attachments.maxPrefixRestart | default(2) }}"
        hf_attach_before: >-
          {{ ((fab_st.realization | default({}, true)).attachments | default([], true)) }}

    - name: Take the border gateway configuration lease
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: lease-acquire, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}", holder: "{{ hf_holder }}"}

    # every step on a node runs within the lease (common/vars/fabric_lease.yml): a block keyword, evaluated again for
    # each step; the includes and the lease tasks set their own timeout, so the renewals, the SSH cleanup and the
    # release run even when the lease is short
    - name: Configure the nodes, one at a time
      timeout: "{{ fab_lease_step_timeout }}"
      # the node ends each step's commands by the same limit (common/vars/fabric_lease.yml); through hostvars: a
      # delegated step's become command is templated with the node's variables, which lack this job's facts
      vars:
        ansible_become_exe: "{{ hostvars[inventory_hostname].fab_lease_node_become }}"
      block:
        - name: Configure the root instance on each node
          ansible.builtin.include_tasks: node_root.yml
          timeout: 0
          loop: "{{ fab_spec.borderGateway.nodes }}"
          loop_control:
            loop_var: bgw_node
            label: "{{ bgw_node.name }}"

      always:
        - name: Remove the SSH key
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"
          timeout: 0

        - name: Release the lease
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
          timeout: 0
          vars:
            fab_ledger: {action: lease-release, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}", holder: "{{ hf_holder }}"}
      # a step that timed out may still run on a node: the lease is kept (fabric_lease_keep.yml) and the always block
      # skips the release; any other failure releases it at once
      rescue:
        # an apply that refused (exit 4 with "shc-fabric-apply: …" or, for what only the SRv6 core refuses, "transport
        # srv6: …" on stderr, run directly on a node) fails its step with
        # "non-zero return code" only: its own lines go into the status message (fab_fail_msg, read by the rescue below).
        # Only the message changes, and only when the failed step printed such lines; a step that timed out keeps the lease
        # keeper's message
        - name: Keep the apply's own reason for the status
          vars:
            _why: >-
              {{ (ansible_failed_result.stderr_lines | default([], true) | select('match', '^(transport srv6|shc-fabric-apply): ') | list)
                 if ansible_failed_result is mapping and ansible_failed_result.timedout is not defined else [] }}
          ansible.builtin.set_fact:
            fab_fail_msg: >-
              {{ (ansible_failed_task.name | default('a node step')) ~ ': ' ~ (ansible_failed_result.msg | default('failed'))
                 ~ ': ' ~ _why | join('; ') }}
          when: _why | length > 0
          timeout: 0

        - name: Keep the lease while a step may still run on a node
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_keep.yml"
          timeout: 0

    - name: Set the egress status
      ansible.builtin.set_fact:
        hf_egress_status: >-
          {%- set out = [] -%}
          {%- for k, v in hf_egress.networks | dictsort -%}
            {%- set _ = out.append({'network': k, 'vpnTarget': v.vpnTarget, 'sourceAddresses': v.sourceAddresses,
                                    'internet': v.internet | default(true),
                                    'ipv6': v.ipv6 | default(false), 'prefixes6': v.prefixes6 | default([]),
                                    'primary': v.primary | default('')}) -%}
          {%- endfor -%}
          {{ out }}

    # the IPv6 egress as the nodes report it (node_root.yml egressIpv6): per node the hand-off address, the upstream
    # sessions and the default route; degraded while a node has no upstream session or no default (its networks'
    # traffic takes the other node); degradedSince is kept across runs, and a node down for
    # egress.ipv6.sessionDownAlertMinutes is reported as an event below (once, then at most every
    # health.eventRepeatMinutes)
    - name: Set the IPv6 egress status
      vars:
        _on: "{{ hf_egress.ipv6 | default(false) | bool }}"
        _prev: "{{ (((fab_st.realization | default({}, true)).egress | default({}, true)).ipv6 | default({}, true)) }}"
        _nodes: >-
          {%- set out = {} -%}
          {%- for r in hf_node_results if r.egressIpv6 is defined -%}{%- set _ = out.update({r.name: r.egressIpv6}) -%}{%- endfor -%}
          {{ out }}
        _down: "{{ _nodes | dict2items | rejectattr('value.healthy', 'defined') | map(attribute='key') | list
                   + (_nodes | dict2items | selectattr('value.healthy', 'defined') | rejectattr('value.healthy') | map(attribute='key') | list) }}"
        _now: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        _since: >-
          {{ (_prev.degradedSince | default('', true) or _now) if (_down | length > 0 and _prev.degraded | default(false) | bool)
             else (_now if _down | length > 0 else '') }}
        # (merge patch: a node no longer in the fabric (every node is in hf_node_results on a ready run), and with
        # IPv6 egress off the whole state, is removed with null)
        _gone: >-
          {{ dict((_prev.nodes | default({}, true)).keys() | list
                  | reject('in', hf_node_results | map(attribute='name') | list) | list
                  | zip_longest([], fillvalue=none)) }}
      ansible.builtin.set_fact:
        hf_egress6_status: >-
          {{ {'enabled': _on | bool, 'nodes': _nodes | combine(_gone), 'degraded': _down | length > 0,
              'degradedNodes': _down | sort, 'degradedSince': _since | trim} if _on | bool
             else {'enabled': false, 'nodes': none, 'degraded': none, 'degradedNodes': none, 'degradedSince': none,
                   'reportedAt': none} }}
        hf_egress6_alert: >-
          {{ _on | bool and _down | length > 0 and (_since | trim) | length > 0
             and (((_now | to_datetime('%Y-%m-%dT%H:%M:%SZ')) - ((_since | trim) | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds()
                  >= (fab_real.egress.ipv6.sessionDownAlertMinutes | default(5) | int) * 60) }}

    # an outage is reported once it lasted sessionDownAlertMinutes, then again at most every health.eventRepeatMinutes
    # (the fabric health check reports it the same way): reportedAt records the last report
    - name: Decide whether the IPv6 egress upstream outage is reported now
      vars:
        _prev: "{{ (((fab_st.realization | default({}, true)).egress | default({}, true)).ipv6 | default({}, true)) }}"
        _last: "{{ _prev.reportedAt | default('', true) | string }}"
        _now: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        _repeat: "{{ (fab_real.health | default({}, true)).eventRepeatMinutes | default(60, true) | int }}"
        _due: >-
          {{ (hf_egress6_alert | bool)
             and (_last | length < 19
                  or ((_now | to_datetime('%Y-%m-%dT%H:%M:%SZ')) - (_last[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds()
                     >= (_repeat | int) * 60) }}
      ansible.builtin.set_fact:
        hf_egress6_report: "{{ _due | bool }}"
        hf_egress6_status: >-
          {{ hf_egress6_status | combine({'reportedAt': (_now if _due | bool
                                                         else (_last if (hf_egress6_status.degraded | default(false)) and _last
                                                               else none))})
             if hf_egress6_status.enabled | default(false) else hf_egress6_status }}

    - name: Report the IPv6 egress upstream outage as an event
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Event
          metadata:
            name: "{{ fab_name }}-ipv6-egress-{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"
            namespace: "{{ fab_namespace }}"
          involvedObject:
            apiVersion: hybridsovereign.redhat/v1alpha1
            kind: HybridFabric
            name: "{{ fab_name }}"
            namespace: "{{ fab_namespace }}"
            uid: "{{ fab_obj.metadata.uid }}"
          type: Warning
          reason: IPv6EgressUpstreamDown
          message: >-
            IPv6 internet egress: {{ hf_egress6_status.degradedNodes | join(', ') }} without an upstream session or
            the default route since {{ hf_egress6_status.degradedSince }}; the networks' IPv6 internet traffic takes
            the other node(s) meanwhile
          source: {component: shc-hybridfabric}
          reportingComponent: shc-hybridfabric
          firstTimestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          lastTimestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          count: 1
      failed_when: false
      when: hf_egress6_report | bool

    # what tenants see of the fabric changed since the Entities were last told (status.realization.ipam.tenantOffer,
    # stored below; absent before the first run that stores it): its IPv6 offer, or its spec (who may use it). The
    # wake comes before the status write: the pool rows the Entity job reads are published already (the ensure
    # publishes them whenever the ledger changed, and the offer only changes with the ledger). A ready Entity runs
    # only when woken or changed, so the offer counts as told only when the Entities could be listed; otherwise the
    # stored offer is dropped and the next fabric run wakes them again
    - name: Tell whether the tenants' view of the fabric changed
      ansible.builtin.set_fact:
        hf_wake_entities: >-
          {{ (hf_tenant_offer != (((fab_st.realization | default({}, true)).ipam | default({}, true)).tenantOffer
                                   | default('', true)))
             or (fab_generation | int != (fab_st.observedGeneration | default(0, true) | int)) }}

    - name: Wake the Entities when the tenants' view of the fabric changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/wake_entities.yml"
      vars:
        we_namespace: "{{ fab_namespace }}"
      when: hf_wake_entities | bool

    - name: Keep the offer the Entities were told
      ansible.builtin.set_fact:
        hf_ipam: >-
          {{ hf_ipam | combine({'tenantOffer': hf_tenant_offer
                                 if (not hf_wake_entities | bool) or (we_entities_listed | default(false) | bool)
                                 else none}) }}

    - name: Report the fabric ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        # the cluster prefixes the platform does not announce yet: service.maxPrefixes or a tenant's share reached
        # (status.realization.service.waiting; they wait in order)
        _svc_capped: "{{ ((hf_service | default({})).status | default({})).waiting | default([], true) }}"
        fab_message: >-
          Ledger fabric-ledger-{{ fab_name }}; root instance on {{ hf_node_results | map(attribute='name') | join(', ') }}
          ({{ ('changed on ' ~ hf_changed_nodes | join(', ')) if hf_changed_nodes else 'no change' }}){{
          ('; internet egress for ' ~ hf_egress.networks | length ~ ' network(s)') if fab_real.egress.enabled | default(false) | bool else '' }}{{
          ('; IPv6 internet egress for ' ~ (hf_egress_status | selectattr('ipv6') | list | length) ~ ' network(s)'
           ~ ((', degraded: ' ~ hf_egress6_status.degradedNodes | join(', ') ~ ' without upstream')
              if hf_egress6_status.degraded | default(false) else ''))
          if hf_egress6_status.enabled | default(false) else '' }}{{
          ('; ' ~ hf_attach.status | length ~ ' attachment circuit(s)' ~ ((', not realized: ' ~ hf_attach.skipped
             | map(attribute='circuit') | join(', ')) if hf_attach.skipped else ''))
          if fab_real.attachments.enabled | default(false) | bool else '' }}{{
          ('; service VRF with ' ~ hf_service.status.circuits | length ~ ' platform circuit(s) for '
           ~ hf_service.status.networks | length ~ ' network(s)'
           ~ ((', refused: ' ~ hf_service.status.refused | length ~ ' prefix(es)') if hf_service.status.refused else '')
           ~ ((', waiting for service.maxPrefixes or a tenant share: ' ~ _svc_capped | length ~ ' prefix(es)')
              if _svc_capped else '')
           if not ((hf_service.status | default({})).reason | default('', true))
           else ('; service VRF not realized: ' ~ hf_service.status.message))
          if (hf_service | default({})).enabled | default(false) else '' }}{{
          ('; platform address pools not updated: ' ~ hf_ipam.refused) if hf_ipam.refused else '' }}{{
          '; SRv6 core' if (fab_real.core | default({}, true)).transport | default('mpls', true) == 'srv6' else '' }}
        # the IPv6 egress condition (only with IPv6 egress): True while every node has an upstream session and the
        # default route; Degraded otherwise (the networks' rows say the same)
        fab_conditions: >-
          {{ ([{'type': 'IPv6EgressUpstream',
               'status': 'False' if hf_egress6_status.degraded | default(false) else 'True',
               'reason': 'Degraded' if hf_egress6_status.degraded | default(false) else 'Ready',
               'message': (('no upstream session or default route on ' ~ hf_egress6_status.degradedNodes | join(', ')
                            ~ ' since ' ~ hf_egress6_status.degradedSince) if hf_egress6_status.degraded | default(false)
                           else 'every node has an upstream session and the default route')}]
             if hf_egress6_status.enabled | default(false)
             else ([{'type': 'IPv6EgressUpstream', 'status': 'Unknown', 'reason': 'NotEnabled',
                     'message': 'IPv6 internet egress is off on this fabric'}]
                   if fab_st.conditions | default([], true) | selectattr('type', 'equalto', 'IPv6EgressUpstream')
                      | list | length > 0 else [])) }}
        # coreTransport: the core's transport (mpls or srv6); srv6Locators (SRv6 core): {node: the root's locator}.
        # status.realization.translation is no longer written: the null removes what an earlier release recorded there
        # (the status is merge-patched and keeps unknown fields; a no-op once it is gone). Its former condition,
        # IPv6Translation, goes with the same write (the status library drops retired condition types)
        fab_status: >-
          {{ {'ledger': 'fabric-ledger-' ~ fab_name,
              'allocated': hf_ledger.allocated,
              'available': hf_ledger.available,
              'nodes': hf_node_results,
              'reservedRanges': hf_reserved | default(none),
              'realization': {'model': fab_real.model, 'routeReflector': hf_pe.loopbackIp, 'nodeSid': hf_pe.sid,
                              'routeReflector6': hf_pe.loopbackIp6 | default(''),
                              'ipv6Core': hf_pe.loopbackIp6 | default('') | length > 0,
                              'core': fab_real.core.loopbackPool ~ ' / ' ~ fab_real.core.linkSubnet,
                              'egress': {'enabled': fab_real.egress.enabled | default(false) | bool,
                                         'networks': hf_egress_status, 'ipv6': hf_egress6_status},
                              'attachments': hf_attach.status, 'attachmentsSkipped': hf_attach.skipped,
                              'service': (hf_service | default({})).status | default(none),
                              'ipam': hf_ipam,
                              'coreTransport': (fab_real.core | default({}, true)).transport | default('mpls', true),
                              'translation': none}
                             | combine({'srv6Locators': hf_node_results | selectattr('locator', 'defined')
                                                        | items2dict(key_name='name', value_name='locator')}
                                       if hf_node_results | selectattr('locator', 'defined') | list | length > 0 else {})} }}

    # the networks this run added to or removed from the egress (or whose IPv6 egress came or went) wait for it: wake
    # them; when the IPv6 egress became degraded or recovered, every network with IPv6 egress (their family row says so)
    - name: Wake the networks whose egress changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        _now6: "{{ hf_egress_status | selectattr('ipv6') | map(attribute='network') | list }}"
        _prev6: "{{ (((fab_st.realization | default({}, true)).egress | default({}, true)).ipv6 | default({}, true)) }}"
        # degraded came or went, or the set of nodes without upstream changed (one node down -> all down: the networks'
        # rows go from Degraded to UpstreamDown)
        _degraded_flip: >-
          {{ (hf_egress6_status.degraded | default(false) | bool) != (_prev6.degraded | default(false) | bool)
             or (hf_egress6_status.degradedNodes | default([]) | sort) != (_prev6.degradedNodes | default([], true) | sort) }}
        nudge_crs: >-
          {%- set out = [] -%}
          {%- for k in ((hf_egress.networks.keys() | list) | symmetric_difference(hf_egress_before))
                        | union(_now6 | symmetric_difference(hf_egress6_before))
                        | union(_now6 if _degraded_flip | bool else []) -%}
            {%- set _ = out.append({'kind': 'HybridNetwork', 'namespace': k.split('/')[0], 'name': k.split('/')[1]}) -%}
          {%- endfor -%}
          {{ out }}

    # a network whose realized or refused service prefixes changed (or whose service came or went with the service
    # VRF) waits for it: wake it (the network job reads realization.service.networks and .refused back)
    - name: Wake the networks whose service prefixes changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        _now: "{{ hf_service.status.networks + hf_service.status.refused }}"
        _was: "{{ (hf_service_before.networks | default([], true)) + (hf_service_before.refused | default([], true)) }}"
        _flip: "{{ (hf_service.status.enabled | bool) != (hf_service_before.enabled | default(false) | bool)
                   or (hf_service.status.circuits | length > 0) != (hf_service_before.circuits | default([], true) | length > 0) }}"
        nudge_crs: >-
          {%- set keys = [] -%}
          {%- for e in _now if e not in _was -%}{%- set _ = keys.append(e.network) -%}{%- endfor -%}
          {%- for e in _was if e not in _now -%}{%- set _ = keys.append(e.network) -%}{%- endfor -%}
          {%- if _flip | bool -%}
            {%- for n in _hf_networks.resources | default([])
                  if (n.status | default({}, true)).fabric | default('') == fab_name -%}
              {%- set _ = keys.append(n.metadata.namespace ~ '/' ~ n.metadata.name) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set out = [] -%}
          {%- for k in keys | unique -%}
            {%- set _ = out.append({'kind': 'HybridNetwork', 'namespace': k.split('/')[0], 'name': k.split('/')[1]}) -%}
          {%- endfor -%}
          {{ out }}

    # a network's IPv6 egress came or went: its gateways stop or resume announcing their own default route
    - name: List the CloudGateways when a network's IPv6 egress changed
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        namespace: "{{ fab_namespace }}"
      register: _hf_gateways
      when: (hf_egress_status | selectattr('ipv6') | map(attribute='network') | list) | symmetric_difference(hf_egress6_before) | length > 0

    - name: Wake the gateways when a network's IPv6 egress changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: >-
          {%- set out = [] -%}
          {%- for g in _hf_gateways.resources | default([]) if (g.spec.fabricRef | default({})).name | default('') == fab_name -%}
            {%- set _ = out.append({'kind': 'CloudGateway', 'namespace': g.metadata.namespace, 'name': g.metadata.name}) -%}
          {%- endfor -%}
          {{ out }}
      when: _hf_gateways is not skipped

    # a pool change (more blocks, a larger allowance, a shorter hold-down) may give a waiting network its block
    - name: Wake the networks waiting for platform address space
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/wake_waiting_networks.yml"
      vars:
        wn_fabric: "{{ fab_name }}"
      when: hf_ipam_changed | bool

    # a circuit added, changed (its realization or its policy) or removed: the circuit job reads the sessions, or
    # continues the circuit's deletion (a platform circuit: its entry under realization.service.circuits)
    - name: Wake the circuits whose realization changed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: >-
          {%- set keys = [] -%}
          {%- for e in hf_attach.status if e not in hf_attach_before -%}{%- set _ = keys.append(e.circuit) -%}{%- endfor -%}
          {%- for e in hf_attach_before if e not in hf_attach.status -%}{%- set _ = keys.append(e.circuit) -%}{%- endfor -%}
          {%- set svc_was = (hf_service_before | default({})).circuits | default([], true) -%}
          {%- set svc_now = ((hf_service | default({})).status | default({})).circuits | default([]) -%}
          {%- for e in svc_now if e not in svc_was -%}{%- set _ = keys.append(e.circuit) -%}{%- endfor -%}
          {%- for e in svc_was if e not in svc_now -%}{%- set _ = keys.append(e.circuit) -%}{%- endfor -%}
          {%- set out = [] -%}
          {%- for k in keys | unique -%}
            {%- set _ = out.append({'kind': 'AttachmentCircuit', 'namespace': k.split('/')[0], 'name': k.split('/')[1]}) -%}
          {%- endfor -%}
          {{ out }}

    # the wakes from other jobs that waited for this one (deferred_wakes.yml)
    - name: Run the wakes that came during this job
      ansible.builtin.include_tasks: deferred_wakes.yml

  rescue:
    - name: Remove the SSH key
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"
      ignore_errors: true

    - name: Mark the HybridFabric failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('HybridFabric provision failed') }}
        fab_status: "{{ {'nodes': hf_node_results} if hf_node_results | default([]) | length > 0 else {} }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Run the wakes that came during the failed job
      ansible.builtin.include_tasks: deferred_wakes.yml
      when: fab_name is defined and services_api_host is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridFabric {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
