# ─── shc: platform IaaS clusters (LAB-PLAN P5/P6) ───────────────────────────────────────────────
# Bare-metal clusters built by central from metal-infra-env (mce-cluster-build Agent provider, lab
# workspace p5/build-iaas1.sh). templates/iaasClusters renders, per enabled cluster, the base layer, a
# ClusterSecretStore on central Vault (auth mount kubernetes-<name>, policy limited to that cluster's
# keys), ODF external on Atuin Ceph and CNV. Enable a cluster once it is registered in Argo CD and its
# Vault auth mount exists.
iaasClusterDefaults:
  enabled: false
  server: ""
  syncWaves:
    base: "0"
    store: "0"
    certs: "2"
    odf: "3"
    cnv: "4"
  clusterBase:
    chartVersion: "0.3.1"
    values:
      cluster:
        baseDomain: shc.signal9.gg
      certManager:
        recursiveNameservers: "172.18.42.20:53"
      letsencrypt:
        dnsZones: [shc.signal9.gg]
        rfc2136:
          nameserver: "75.8.222.11:53"
          tsigKeyName: shc-acme.
        tsigSecret:
          vaultKey: dns/shc-acme-tsig
        account:
          vaultKey: dns/letsencrypt-shc-account
      timesync:
        servers: [172.18.42.20, 172.18.0.79]
      externalSecrets:
        config:
          spec:
            controllerConfig:
              networkPolicies:
                # central Vault through its route on central's ingress VIP
                - name: allow-egress-to-central-vault
                  componentName: ExternalSecretsCoreController
                  egress:
                    - to:
                        - ipBlock:
                            cidr: 172.18.230.7/32
                      ports:
                        - protocol: TCP
                          port: 443
      monitoring:
        storageClass: ocs-external-storagecluster-ceph-rbd
  secretStore:
    chartVersion: "0.3.3-shc.2"
    values:
      vault:
        server: "https://vault-central.apps.central.shc.signal9.gg"
        path: "central"
      auth:
        type: kubernetes
        role: "external-secrets"
        serviceAccountName: "vault-eso-sa"
        serviceAccountNamespace: "external-secrets"
  odfExternal:
    enabled: true
    chartVersion: "0.1.2"
    values: {}
  cnv:
    enabled: true
    chartVersion: "0.1.0"
    values:
      namespace: openshift-cnv
      subscription:
        channel: stable
        installPlanApproval: Automatic
        source: redhat-operators
        sourceNamespace: openshift-marketplace
      hyperconverged:
        enabled: true
        name: kubevirt-hyperconverged
        featureGates:
          deployKubeSecondaryDNS: false
          # golden images would import into the default StorageClass (Atuin Ceph); off until wanted
          enableCommonBootImageImport: false
        infra:
          nodePlacement: {}
        workloads:
          nodePlacement: {}
      # virt-operator creates and owns virt-api-pdb / virt-controller-pdb itself. When the chart's
      # copies land first (fresh cluster), virt-operator fails "poddisruptionbudget ... already exists"
      # and KubeVirt never becomes Available (iaas1, P5). Central got away with it by ordering luck.
      pdb:
        virtApi:
          enabled: false
        virtController:
          enabled: false

iaasClusters:
  iaas1:
    enabled: true  # shc: P5 - installed 2026-10-11, registered in Argo, Vault mount kubernetes-iaas1
    server: "https://api.iaas1.shc.signal9.gg:6443"
  edge1:
    enabled: true  # shc: P6 two-node with fencing (blades 5/8), installed 2026-10-11, Argo + Vault kubernetes-edge1
    server: "https://api.edge1.shc.signal9.gg:6443"

# ─── AAP (services cluster) ─────────────────────────────────────────────────
aap:
  enabled: true  # shc: P4 (services cluster) enabled
  # shc (owner 10-11): the same chart as central (aap-instance). The aap chart's AAP CR set
  # controller.database, which AAP 2.6 ignores, so gateway, controller and EDA ran on the operator's
  # managed Postgres while the Crunchy cluster sat unused. aap-instance points them at Crunchy
  # (external-postgres-sync job). manageNamespace keeps the aap Namespace the old chart owned.
  chart: aap-instance
  chartVersion: "0.5.5-shc.2"
  syncWave: "30"
  destinationNamespace: aap
  values:
    namespace: aap
    name: sovereign-aap
    manageNamespace: true
    controller:
      enabled: true
    eda:
      # the operator runs EDA on services either way (the old chart's "false" only omitted replicas)
      enabled: true
      rbac:
        enabled: false
    hub:
      enabled: false
    postgres:
      enabled: true
      name: aap-pgcluster
      instances: 2
      storage: 20Gi
      backupStorage: 10Gi

# ─── AAP (central cluster — EDA controller) ────────────────────────────────
aapCentral:
  enabled: true
  chartVersion: "0.5.5-shc.2"
  syncWave: "30"
  destinationNamespace: aap
  values:
    namespace: aap
    name: sovereign-aap
    controller:
      enabled: true
      replicas: 1
      # shc: the controller SA is cluster-admin, so its pods are admitted under anyuid: the
      # control-plane EE (project clones) runs as root, the task container as awx. git >= 2.35 then
      # rejects the shared project checkouts ("dubious ownership"); trust them in both containers.
      extraSpec:
        task_extra_env: |
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: safe.directory
          - name: GIT_CONFIG_VALUE_0
            value: "*"
        ee_extra_env: |
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: safe.directory
          - name: GIT_CONFIG_VALUE_0
            value: "*"
    eda:
      enabled: true
      replicas: 1
    hub:
      enabled: false
    postgres:
      enabled: true
      name: aap-pgcluster
      instances: 1
      storage: 40Gi
      backupStorage: 10Gi
      syncRunId: "2026-08-26-pg-wal-disk-fix"

# ─── Plugin IaaC Operator (services cluster) — Go direct Gitea sync ─────────
pluginIaac:
  enabled: false
  chartVersion: "0.2.1"
  syncWave: "40"
  destinationNamespace: sovereign-cloud-plugins
  values:
    namespace: sovereign-cloud-plugins
    createNamespace: false
    replicas: 2
    leaderElection: true
    metricsPort: 8443
    image:
      repository: quay.signal9.gg/shc/plugin-iaac
      tag: "v0.2.0"
      pullPolicy: Always
    imagePullSecrets:
      - name: quay-pull-secret
    gitea:
      url: "https://gitea-gitea.apps.central.shc.signal9.gg"
      repoOwner: "gitea_admin"
      repoName: "tenancy_repo"
      secretName: "gitea-admin-token"
      tokenSecretKey: "admin_token"
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: gitea-admin
    defaultIaac:
      enabled: true
      name: iaac

# ─── Event Forwarder (central cluster — K8s Events → EDA Event Stream) ───────
eventForwarder:
  enabled: false  # shc: off: no sink reachable from services (Kafka default is central's in-cluster service; no EDA event stream)
  chartVersion: "0.5.5-shc.1"
  syncWave: "32"
  image:
    repository: quay.signal9.gg/shc/event-forwarder
    tag: "0.3.0"
  eventStreamUrl: "https://sovereign-aap-aap.apps.central.shc.signal9.gg/eda-event-streams/api/eda/v1/external_event_stream/4392c64b-2faf-4414-a6e6-5ff1bc8d5a75/post/"
  vaultSecretPath: "event-forwarder"

# ─── OpenShift Virtualization (CNV) — central cluster ───────────────────────
cnv:
  enabled: true  # shc: D12 rev 3: CNV on central (no nested virt; central runs no VMs)
  chartVersion: "0.1.0"
  syncWave: "12"
  destinationNamespace: openshift-cnv
  values:
    namespace: openshift-cnv
    subscription:
      channel: stable
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    hyperconverged:
      enabled: true
      name: kubevirt-hyperconverged
      featureGates:
        deployKubeSecondaryDNS: false
        enableCommonBootImageImport: false
      infra:
        nodePlacement: {}
      workloads:
        nodePlacement: {}
    pdb:
      virtApi:
        enabled: true
        minAvailable: 1
      virtController:
        enabled: true
        minAvailable: 1

# ─── Migration Toolkit for Virtualization (MTV) — central cluster ────────────
mtv:
  enabled: true  # shc: D12 rev 3: MTV on central
  chartVersion: "0.1.8-shc.1"
  syncWave: "28"
  destinationNamespace: openshift-mtv
  values:
    namespace: openshift-mtv
    subscription:
      channel: release-v2.12
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    forkliftController:
      enabled: true
      name: forklift-controller
      controller:
        replicas: 2
      ui:
        replicas: 2
    vmwareProvider:
      enabled: false  # shc: vSphere decommissioned (no source provider in the lab build)
      name: vmware-vcenter
      type: vsphere
      url: "https://xna-vcenter-8.lab.signal9.gg/sdk"
      credentialsSecretName: vmware-vcenter-secret
    externalSecret:
      enabled: false  # shc: vSphere decommissioned
      name: vmware-vcenter-es
      secretStoreName: vault-backend
      secretStoreKind: ClusterSecretStore
      vaultPath: vmware-credentials
      refreshInterval: "1h"
      targetSecretName: vmware-vcenter-secret
    pdb:
      mtvController:
        enabled: true
        minAvailable: 1

# ─── ODF / Noobaa (central) ─────────────────────────────────────────────────
# shc (review O1/O2/S7): shc-cluster-base's ops layer on central (central has no base layer from
# that chart: p2/day1). etcd backup, central Vault raft snapshots (bootstrap.sh vault-snapshot-auth),
# transit seal token check, cert-manager metrics, alert rules.
shcClusterOpsCentral:
  enabled: true
  chartVersion: "0.3.1"
  syncWave: "24"
  values:
    layers:
      base: false
      certs: false
      ops: true
    ops:
      vaultSnapshot:
        enabled: true
        vaultAddr: http://vault-active.central-vault.svc:8200
        authMount: kubernetes-central
      transitTokenCheck:
        enabled: true
        namespace: central-vault
        labVaultAddr: https://vault.lab.signal9.gg

# shc (LAB-PLAN D9/D21): ODF external on central (charts/charts/odf-external). Adopts the day-1 objects
# (p2/day1 40/50 + bootstrap.sh ceph-central); after the vault-backend store (wave 22).
odfExternalCentral:
  enabled: true
  chartVersion: "0.1.2"
  syncWave: "23"
  values:
    externalDetails:
      vaultKey: clusters/central/ceph-external

odf:
  enabled: false  # shc: replaced by ODF external (LAB-PLAN D9/§7.5)
  chartVersion: "0.6.0"
  syncWave: "12"
  destinationNamespace: openshift-storage
  values:
    namespace: openshift-storage
    noobaa:
      enabled: true
      name: noobaa

# ─── ODF / Noobaa (services) ────────────────────────────────────────────────
odfServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.6.0"
  syncWave: "12"
  destinationNamespace: openshift-storage
  values:
    namePrefix: "svc-"
    skipNamespace: true
    namespace: openshift-storage
    noobaa:
      enabled: true
      name: noobaa
    edaLogsObc:
      enabled: true

# ─── Quay (central) ─────────────────────────────────────────────────────────
# Temporarily disabled to free CPU/memory for AAP controller/EDA on central.
quay:
  enabled: false
  chartVersion: "0.6.3"
  syncWave: "35"
  destinationNamespace: central-quay
  values:
    namespace: central-quay
    registry:
      enabled: true
      name: sovereign-registry
      configBundle: |
        SERVER_HOSTNAME: quay.signal9.gg
        FEATURE_USER_INITIALIZE: true
        FEATURE_SUPERUSERS_FULL_ACCESS: true
        SUPER_USERS:
          - sovereign_admin
        FEATURE_USER_CREATION: false
        FEATURE_TEAM_SYNCING: true
        TEAM_RESYNC_STALE_TIME: "60m"
        FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: false
      configBundleSecretName: sovereign-registry-config-bundle
      components:
        objectstorage:
          managed: true
        postgres:
          managed: false
        clair:
          managed: true
        redis:
          managed: true
        mirror:
          managed: true
        route:
          managed: true
        tls:
          managed: true
        monitoring:
          managed: false
        quay:
          overrides:
            resources:
              requests:
                cpu: "500m"
                memory: "4Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
        horizontalpodautoscaler:
          managed: false
    crunchy:
      enabled: true
      name: quay-pgcluster
      instances: 2
      storage: 20Gi
      backupStorage: 20Gi

# ─── Quay (services) ────────────────────────────────────────────────────────
quayServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.6.4-shc.2"  # shc: OIDC and RGW storage through the config bundle
  syncWave: "35"
  destinationNamespace: services-quay
  values:
    # shc: Quay login through RHBK (sovereign-tenants, client quay-services); the secret is the
    # services realm's client secret (keycloak-clients-services)
    oidc:
      enabled: true
      clientId: quay-services
      server: https://rhbk-services.apps.services.shc.signal9.gg/realms/sovereign-tenants
      clientSecret:
        vaultKey: keycloak-clients-services
        property: quay-services
    # shc: registry storage on Atuin RGW (RGW-local user shc-services-quay, 200 GiB quota, bucket
    # created by the lab bootstrap); keys from central Vault quay-services-rgw
    rgw:
      enabled: true
      hostname: objectstore.atuin.signal9.gg
      bucket: shc-services-quay
      credentials:
        vaultKey: quay-services-rgw
    dbInitJob:
      image: quay.signal9.gg/shc/ansible-runner:latest  # shc: chart default has no registry
    namePrefix: "svc-"
    skipNamespace: true
    namespace: services-quay
    registry:
      enabled: true
      name: svc-sovereign-registry
      configBundle: |
        SERVER_HOSTNAME: svc-sovereign-registry-quay-services-quay.apps.services.shc.signal9.gg  # shc: not the lab registry
        FEATURE_USER_INITIALIZE: true
        FEATURE_SUPERUSERS_FULL_ACCESS: true
        SUPER_USERS:
          - sovereign_admin
        FEATURE_USER_CREATION: true
        FEATURE_TEAM_SYNCING: true
        TEAM_RESYNC_STALE_TIME: "60m"
        FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: false
      configBundleSecretName: svc-sovereign-registry-config-bundle
      components:
        objectstorage:
          managed: false  # shc: Atuin Ceph RGW (rgw below), not NooBaa
        postgres:
          managed: false
        clair:
          managed: false
        redis:
          managed: true
        mirror:
          managed: false
        monitoring:
          managed: false
        horizontalpodautoscaler:
          managed: false
        clairpostgres:
          managed: false
        route:
          managed: true
        tls:
          managed: true
        quay:
          overrides:
            resources:
              requests:
                cpu: "250m"
                memory: "4Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
    crunchy:
      enabled: true
      name: svc-quay-pgcluster
      instances: 2
      storage: 20Gi
      backupStorage: 20Gi

# ─── Gitea (services cluster) ──────────────────────────────────────────────
gitea:
  enabled: false
  chartVersion: "0.4.6-shc.2"
  syncWave: "18"
  values:
    gitea:
      global:
        security:
          allowInsecureImages: true
        imagePullSecrets:
          - quay-pull-secret
      replicaCount: 1
      image:
        registry: quay.signal9.gg
        repository: shc/gitea
        tag: "28.1.0"  # shc: 2026-10-06 advisories (critical, fixed only in >= 28.0.0); gitea chart 12.7.0 (edit-ini, Gitea >= 1.26)
        rootless: true
      gitea:
        admin:
          # Credentials sourced from k8s Secret 'gitea-admin-credentials' (created by init chart from env vars)
          # DEVIATION: Gitea chart deploys at wave 18, before Vault is initialized (wave 23).
          # A k8s Secret pre-created during 'make init-central-argo' is used as a bridge.
          # Post-init, credentials are pushed to Vault via PushSecret in giteaInit job.
          existingSecret: "gitea-admin-credentials"
        config:
          server:
            DOMAIN: "gitea-gitea.apps.services.shc.signal9.gg"
            ROOT_URL: "https://gitea-gitea.apps.central.shc.signal9.gg"
          database:
            DB_TYPE: postgres
          session:
            PROVIDER: memory
          cache:
            ADAPTER: memory
          queue:
            TYPE: level
      postgresql:
        enabled: true
        image:
          registry: quay.signal9.gg
          repository: shc/postgresql
          tag: "17.6.0-debian-12-r4"
        volumePermissions:
          image:
            registry: quay.signal9.gg
            repository: shc/os-shell
            tag: "12-debian-12-r51"
      postgresql-ha:
        enabled: false
      redis:
        enabled: false
      redis-cluster:
        enabled: false
      valkey-cluster:
        enabled: true
        image:
          registry: quay.signal9.gg
          repository: shc/valkey-cluster
          tag: "8.1.3-debian-12-r3"
        volumePermissions:
          image:
            registry: quay.signal9.gg
            repository: shc/os-shell
            tag: "12-debian-12-r51"
        sysctlImage:
          registry: quay.signal9.gg
          repository: shc/os-shell
          tag: "12-debian-12-r51"
      persistence:
        enabled: true
        size: 10Gi
      route:
        enabled: true
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
    pullSecret:
      # Disabled: quay-pull-secret is provisioned by the init chart via make init-central-argo.
      # The OCI robot credentials must NEVER be committed to git.
      enabled: false
      dockerconfigjson: ""
    giteaTokenExternalSecret:
      enabled: true
      targetNamespace: sovereign-cloud-plugins
      targetSecretName: gitea-admin-token
      secretStoreName: vault-backend
      secretStoreKind: ClusterSecretStore
      vaultPath: gitea-admin
      refreshInterval: "1h"
    adminCredentialsExternalSecret:
      enabled: true
      namespace: gitea
      secretName: gitea-admin-credentials
      secretStoreName: vault-backend
      secretStoreKind: ClusterSecretStore
      vaultPath: gitea-admin
      refreshInterval: "1h"
    pullSecretExternalSecret:
      enabled: false
      namespace: gitea
      secretStoreName: vault-backend
      secretStoreKind: ClusterSecretStore
      vaultPath: oci-credentials
      refreshInterval: "1h"

# ─── Gitea (central cluster instance) ───────────────────────────────────────
# Manages the Gitea instance running on the central cluster itself.
# This is separate from the services-cluster Gitea (managed by the 'gitea' app above).
giteaCentral:
  enabled: true
  chartVersion: "0.4.6-shc.2"
  syncWave: "18"
  values:
    gitea:
      global:
        security:
          allowInsecureImages: true
        imagePullSecrets:
          - quay-pull-secret
      replicaCount: 1
      strategy:
        type: Recreate
      image:
        registry: quay.signal9.gg
        repository: shc/gitea
        tag: "28.1.0"  # shc: 2026-10-06 advisories (critical, fixed only in >= 28.0.0); gitea chart 12.7.0 (edit-ini, Gitea >= 1.26)
        rootless: true
      gitea:
        admin:
          existingSecret: "gitea-admin-credentials"
        additionalConfigFromEnvs:
          - name: GITEA__DATABASE__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-pgcluster-pguser-gitea
                key: password
        config:
          server:
            DOMAIN: "gitea-gitea.apps.central.shc.signal9.gg"
            ROOT_URL: "https://gitea-gitea.apps.central.shc.signal9.gg"
          database:
            DB_TYPE: postgres
            HOST: "gitea-pgcluster-primary.gitea.svc:5432"
            NAME: gitea
            USER: gitea
            SSL_MODE: require
          # shc (review C3, owner 10-11): no Valkey. The bitnamilegacy images are frozen upstream, and
          # while any valkey subchart is on, the gitea chart forces cache/session/queue to redis and
          # ignores these. Single replica: in-process cache, sessions in Postgres (survive restarts),
          # LevelDB queues on the data volume.
          session:
            PROVIDER: db
          cache:
            ADAPTER: memory
          queue:
            TYPE: level
      postgresql:
        enabled: false
      postgresql-ha:
        enabled: false
      redis:
        enabled: false
      redis-cluster:
        enabled: false
      valkey-cluster:
        enabled: false
      valkey:
        enabled: false
      persistence:
        enabled: true
        size: 10Gi
      route:
        enabled: true
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
    pullSecret:
      enabled: false
      dockerconfigjson: ""
    giteaTokenExternalSecret:
      enabled: false
    adminCredentialsExternalSecret:
      enabled: true
      namespace: gitea
      secretName: gitea-admin-credentials
      secretStoreName: vault-backend
      secretStoreKind: ClusterSecretStore
      vaultPath: gitea-admin
      refreshInterval: "1h"
    pullSecretExternalSecret:
      enabled: false
    crunchy:
      enabled: true
      name: gitea-pgcluster
      namespace: gitea
      instances: 2
      storage: 10Gi
      backupStorage: 10Gi

# ─── Crunchy Postgres (central) ─────────────────────────────────────────────
crunchyPostgres:
  enabled: true
  chartVersion: "0.5.0"
  syncWave: "11"
  destinationNamespace: postgres-operator
  values:
    namespace: postgres-operator

# ─── Crunchy Postgres (services) ────────────────────────────────────────────
crunchyPostgresServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.5.0"
  syncWave: "11"
  destinationNamespace: postgres-operator
  values:
    namePrefix: "svc-"
    namespace: postgres-operator

# ─── External Secrets Operator (central) ────────────────────────────────────
externalSecrets:
  enabled: true
  # shc: central runs the Red Hat ESO operator from OLM (openshift-external-secrets chart), not the
  # community operator from the external-secrets 0.1.4 chart.
  chart: openshift-external-secrets
  chartVersion: "0.1.0"
  syncWave: "5"

  values:
    namespace: external-secrets-operator
    subscription:
      name: openshift-external-secrets-operator
      channel: stable-v1
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    # The operator isolates its pods (deny-all + API server/DNS); the controller needs Vault.
    externalSecretsConfig:
      spec:
        controllerConfig:
          networkPolicies:
            - name: allow-egress-to-central-vault
              componentName: ExternalSecretsCoreController
              egress:
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: central-vault
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: vault
                  ports:
                    - protocol: TCP
                      port: 8200

# ─── DNS Forwarder (services) ────────────────────────────────────────────────
# Adds lab.signal9.gg → 172.18.42.10/172.18.42.11 forwarder to the services
# cluster CoreDNS so pods can resolve internal lab hostnames (vCenter, ESXi, etc.)
# without falling through to public DNS which has no knowledge of private hosts.
dnsForwarderServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.1.0"
  syncWave: "2"
  # Zone/IPs mirrored from lab.* (keep in sync via make render-values-lab)
  values:
    servers:
      - name: lab-domain-forwarder
        zones:
          - lab.signal9.gg
        policy: Sequential
        upstreams:
          - "172.18.42.10"
          - "172.18.42.11"

# ─── shc cluster base layer (services) ──────────────────────────────────────
# shc (LAB-PLAN D3/§7 item 12): ESO (Red Hat operator), cert-manager, chrony, monitoring ("base",
# wave 0) and the Let's Encrypt issuer + API/ingress certificates ("certs", wave 2, after the store).
shcClusterBaseServices:
  enabled: true
  chartVersion: "0.3.1"
  syncWaves:
    base: "0"
    certs: "2"
  values:
    cluster:
      name: services
      baseDomain: shc.signal9.gg
    certManager:
      recursiveNameservers: "172.18.42.20:53"
    letsencrypt:
      dnsZones: [shc.signal9.gg]
      rfc2136:
        nameserver: "75.8.222.11:53"
        tsigKeyName: shc-acme.
      tsigSecret:
        vaultKey: dns/shc-acme-tsig
      account:
        vaultKey: dns/letsencrypt-shc-account
    timesync:
      servers: [172.18.42.20, 172.18.0.79]
    externalSecrets:
      config:
        spec:
          controllerConfig:
            networkPolicies:
              # central Vault through its route on central's ingress VIP
              - name: allow-egress-to-central-vault
                componentName: ExternalSecretsCoreController
                egress:
                  - to:
                      - ipBlock:
                          cidr: 172.18.230.7/32
                    ports:
                      - protocol: TCP
                        port: 443
    monitoring:
      storageClass: standard-csi
    # review O1/O2/S7: etcd backup, services Vault raft snapshots (bootstrap.sh
    # vault-snapshot-auth services), transit seal token check, alert rules
    ops:
      vaultSnapshot:
        enabled: true
        vaultAddr: http://vault-services-active.services-vault.svc:8200
        authMount: kubernetes
        storageClass: standard-csi
      transitTokenCheck:
        enabled: true
        namespace: services-vault
        labVaultAddr: https://vault.lab.signal9.gg
      # §11.1 dispatch re-drive (design/DELIVERY-HARDENING.md); the CRs live on services
      edaRedrive:
        enabled: true
        # TEMPORARY (10-11 outage tests): short timings; revert after the tests
        schedule: "* * * * *"
        config:
          ackTimeoutMinutes: 2
          publishFailedMinutes: 3
          jobTimeoutMinutes: 3
          maxRedrives: 2

# ─── External Secrets Operator (services) ───────────────────────────────────
externalSecretsServices:
  enabled: false  # shc: replaced by shc-cluster-base (Red Hat ESO operator; community chart can't serve v1)
  chartVersion: "0.1.4"
  syncWave: "5"
  values:
    operator:
      channel: stable
      installPlanApproval: Automatic
      source: community-operators
      sourceNamespace: openshift-marketplace
    namespace: external-secrets

# ─── Vault Central Namespace (backup copies of init secrets) ─────────────────
vaultCentralNamespace:
  enabled: true
  chartVersion: "0.1.9-shc.2"
  syncWave: "27"
  argocdChartsRepo: false
  # Used only when argocdChartsRepo is true. Prefer Gitea / internal mirror for disconnected.
  argocdChartsRepoURL: ""
  values:
    namespace: vault-central
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    # shc: central Vault auto-unseals via lab Vault transit (D7): vault-init-secrets holds only
    # root_token (recovery keys are kept in lab Vault).
    vaultInitPushSecret:
      pushUnsealKeys: false
    vaultInitSecretsCopy:
      enabled: true
      keys:
        - secretKey: root_token
          property: root_token
    vaultServicesInitSecretsCopy:
      enabled: true  # shc: P4 (services cluster) enabled
      keys:  # shc: transit seal, root token only
        - secretKey: root_token
          property: root_token
    # Services vault init PushSecret disabled: services-vault namespace is on services cluster
    vaultServicesInitPushSecret:
      enabled: false
    dashboardCentralReader:
      enabled: true
      namespace: sovereign-cloud-jobs
      jobServiceAccount: sovereign-ansible-runner
      image: "quay.signal9.gg/shc/ansible-runner:latest"
      imagePullSecrets:
        - name: quay-pull-secret
      vaultAddr: "http://vault-active.central-vault.svc:8200"
      vaultPath: "central/data/dashboard-central-reader"
      apiServer: "https://api.central.shc.signal9.gg:6443"
    edaS3Creds:
      enabled: true  # shc: P4 enabled (NooBaa bucket eda-job-logs on services; creds pushed to Vault eda-s3-logs)
      bucketName: "eda-job-logs"
      endpoint: "https://s3-openshift-storage.apps.services.shc.signal9.gg"
    centralServiceAccounts:
      # DEVIATION: awshelper-creator-sa disabled — HELPERAWS operator is obsolete (feature 009).
      # WHY: User confirmed no active tenants; helper_CloudAWS operator will not be re-deployed.
      # WHERE: vaultCentralNamespace.centralServiceAccounts.awshelper-creator-sa
      # REMEDIATION: If CloudAWS helper is reintroduced, create a dedicated operator chart.
      awshelper-creator-sa:
        enabled: false
        namespace: sovereign-cloud-jobs
        clusterRoleRules:
          - apiGroups: ["helper.hybridsovereign.redhat"]
            resources: ["*"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["namespaces", "secrets", "configmaps"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
      # DEVIATION: osohelper-creator-sa disabled — HELPEROSO operator is obsolete (feature 009).
      # WHY: User confirmed no active tenants; helper_CloudOSO operator will not be re-deployed.
      # WHERE: vaultCentralNamespace.centralServiceAccounts.osohelper-creator-sa
      # REMEDIATION: If CloudOSO helper is reintroduced, create a dedicated operator chart.
      osohelper-creator-sa:
        enabled: false
        namespace: sovereign-cloud-jobs
        clusterRoleRules:
          - apiGroups: ["helper.hybridsovereign.redhat"]
            resources: ["*"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["namespaces", "secrets", "configmaps"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
      aap-central-cluster-sa:
        enabled: true
        namespace: sovereign-cloud-jobs
        # Used by AAP platformopenshift jobs on central (Hive/ACM/Helm/ESO).
        # Lab scope: cluster-admin equivalent; tighten for production.
        clusterRoleRules:
          - apiGroups: ["*"]
            resources: ["*"]
            verbs: ["*"]
          - nonResourceURLs: ["*"]
            verbs: ["*"]

# ─── ArgoCD Repo Secret: cluster_builds (Gitea → Vault → ESO) ────────────────
argocdClusterBuildsRepo:
  enabled: false  # Phase 5: direct Helm by operators replaces Gitea→ArgoCD cluster-build flow
  giteaUrl: "https://gitea-gitea.apps.central.shc.signal9.gg"
  giteaUser: "gitea_admin"

# ─── Vault ClusterSecretStore (central) — uses k8s auth ─────────────────────
vaultSecretStore:
  enabled: true
  chartVersion: "0.3.3-shc.2"  # shc: upstream 0.3.3 lost its templates; rebuilt with the public 0.3.0 templates
  syncWave: "22"
  values:
    vault:
      server: "http://vault-active.central-vault.svc:8200"
      path: "central"
    auth:
      type: kubernetes
      mountPath: "kubernetes-central"
      role: "external-secrets"
      serviceAccountName: "external-secrets-vault-sa"
      serviceAccountNamespace: "external-secrets"

# ─── Vault ClusterSecretStore (services → vault-central via external route) ─
# Uses kubernetes-services auth mount on central vault (k8s auth, no root token)
vaultSecretStoreServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.3.3-shc.2"  # shc: upstream 0.3.3 lost its templates; rebuilt with the public 0.3.0 templates
  syncWave: "0"  # shc: ESO + store before every ExternalSecret on services
  values:
    vault:
      server: "https://vault-central.apps.central.shc.signal9.gg"
      path: "central"
    auth:
      type: kubernetes
      mountPath: "kubernetes-services"
      role: "external-secrets"
      serviceAccountName: "vault-eso-sa"
      serviceAccountNamespace: "external-secrets"

# ─── Sovereign Jobs RBAC ────────────────────────────────────────────────────
sovereignJobsRbac:
  enabled: true
  chartVersion: "0.1.10"
  syncWave: "3"
  values:
    namespace: sovereign-cloud-jobs
    serviceAccount: sovereign-ansible-runner
    imagePullSecrets:
      - name: quay-pull-secret

# ─── Sovereign Jobs (individual Ansible job Applications) ────────────────────
sovereignJobs:
  chartVersion: "0.1.7-shc.1"
  namespace: sovereign-cloud-jobs
  serviceAccount: sovereign-ansible-runner
  image: "quay.signal9.gg/shc/ansible-runner:latest"
  backoffLimit: 5
  imagePullSecrets:
    - name: quay-pull-secret
  jobs:
