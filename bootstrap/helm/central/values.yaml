# ─── Rebuild baseline (005-phased-env-rebuild) ───────────────────────────────
# applicationsEnabled MUST stay true so sovereign-central-apps syncs.
# Every Application-level *.enabled below MUST be false for phased rebuild.
# Enable one component per commit — see specs/005-phased-env-rebuild/quickstart.md
# Do NOT change nested chart sub-values (vault HA, keycloak instance, etc.) here.
#
# Lab topology: real hostnames/IPs live in local .env (gitignored) and Vault
# path central/data/lab-config. Generate overlay with: make render-values-lab
# Merge values-lab.yaml (gitignored) over this file for local/bootstrap use.
# Do not commit passwords, lab IPs, or private lab domains to git.

# ─── Lab topology primitives (override via values-lab.yaml / Vault lab-config)
# Keep empty in the public tree; populate from .env via make render-values-lab.
# Lab topology — populated for live platform; override via values-lab.yaml / Vault.
# After make sync-lab-helm-params, prefer empty placeholders in git and inject from .env.
lab:
  domain: "lab.signal9.gg"
  baseDomain: "signal9.gg"
  centralClusterName: "central"
  servicesClusterName: "services"
  appsSubdomain: apps
  centralAppsDomain: "apps.central.shc.signal9.gg"
  servicesAppsDomain: "apps.services.shc.signal9.gg"
  dnsForwarderZone: "lab.signal9.gg"
  dnsForwarderIps:
    - "172.18.42.10"
    - "172.18.42.11"

# ─── shc: central CoreDNS forwarders (templates/centralCluster/dns-forwarder.yaml) ───────────
# None (design/TENANT-DNS.md D1, owner 10-13). Central's node resolver (IPA 172.18.42.20, recursive) answers
# lab, OOB, public, platform and tenant names and follows delegations. The earlier shc.signal9.gg -> ns1
# forwarder ("fresh records") made ns1's referral for the delegated tenants zone the final answer, and the
# tenants.shc.signal9.gg -> Atuin Designate forwarder that compensated broke on environment zones delegated
# to other clouds (CoreDNS forward doesn't follow referrals). Negative TTLs: ns1 300 s, Designate 3600 s;
# records are created before anything resolves them. Upstream's RHDP sandbox forwarders and
# "signal9.gg -> 8.8.8.8" (which hid oob.signal9.gg from pods) are gone too.
dnsForwarderCentral:
  servers: []

# Pull lab-config from Vault after `make upload-lab-config`.
labConfigExternalSecret:
  enabled: true
  namespace: openshift-gitops
  syncWave: "28"
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore

# ─── ArgoCD namespace ─────────────────────────────────────────────────────────
argocd:
  namespace: openshift-gitops
  # Per-Application automated sync retry (after controller terminates sync at 10m).
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

# Master switch: when false, no Application CRs render at all. For phased rebuild
# keep true and disable each component's enabled flag individually.
applicationsEnabled: true

# ─── Services cluster (managed by central ArgoCD) ────────────────────────────
servicesCluster:
  server: "https://api.services.shc.signal9.gg:6443"

# ─── OCI registry that stores platform Helm charts ───────────────────────────
oci:
  registry: &oci_registry "quay.signal9.gg"
  repositoryBase: "shc"

# ─── Sovereign Namespaces (central cluster) ──────────────────────────────────
sovereignNamespaces:
  enabled: true
  chartVersion: "0.2.7-shc.1"
  syncWave: "1"
  values:
    namespaces:
      - name: sovereign-cloud-jobs
        enabled: true
      - name: sovereign-cloud-helpers
        enabled: true
      - name: gitea
        enabled: true
      # central-vault, central-rhbk, central-quay, and aap are created by their
      # respective charts. Do NOT add them here to avoid ArgoCD ownership conflicts.
    oauth:
      enabled: true
      identityProviderName: "sovereign-central"
      clientId: "openshift-central"
      clientSecretName: "sovereign-central-oauth-secret"
      issuer: "https://rhbk-central.apps.central.shc.signal9.gg/realms/sovereign-central"
      caConfigMap: "keycloak-central-ca"

# ─── Sovereign Namespaces (services cluster) ────────────────────────────────
sovereignNamespacesServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.2.7-shc.1"
  syncWave: "1"
  values:
    ociPullSecret:
      enabled: true
      vaultPath: "oci-credentials"
      secretStoreName: "vault-backend"
      secretStoreKind: "ClusterSecretStore"
    namespaces:
      - name: sovereign-cloud-jobs
        enabled: true
      - name: sovereign-cloud-helpers
        enabled: true
      - name: sovereign-cloud
        enabled: true
      - name: sovereign-cloud-plugins
        enabled: true
      - name: services-rhbk
        enabled: true
      - name: services-quay
        enabled: true
      # aap and services-vault namespaces are created by their respective charts
      # (aap/templates/operator.yaml and vault/templates/namespace.yaml).
      # Do NOT add them here to avoid ArgoCD ownership conflicts.
    oauth:
      enabled: true
      identityProviderName: "sovereign-services"
      clientId: "openshift-services"
      clientSecretName: "sovereign-services-oauth-secret"
      issuer: "https://rhbk-services.apps.services.shc.signal9.gg/realms/sovereign-tenants"
      caConfigMap: "keycloak-services-ca"

# ─── RHBK Central (Keycloak) ─────────────────────────────────────────────────
rhbk:
  enabled: true
  chartVersion: "0.10.2"
  syncWave: "20"
  destinationNamespace: central-rhbk
  values:
    namespace: central-rhbk
    instanceName: rhbk-central
    pushSecretToVault: true
    vaultSecretPath: "central/data/rhbk-central-admin"
    operator:
      channel: stable-v26.4
    keycloak:
      enabled: true
      instances: 2
      hostname: "rhbk-central.apps.central.shc.signal9.gg"
      db:
        enabled: true
        vendor: postgres
        host: "rhbk-pgcluster-primary.central-rhbk.svc"
        database: keycloak
        usernameSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: user
        passwordSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: password
        crunchy:
          enabled: true
          name: rhbk-pgcluster
          instances: 2
          storage: 10Gi
          backupStorage: 10Gi
      tls:
        enabled: false

# ─── RHBK Services (Keycloak) ────────────────────────────────────────────────
rhbkServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.10.2"
  syncWave: "20"
  destinationNamespace: services-rhbk
  values:
    namespace: services-rhbk
    instanceName: rhbk-services
    pushSecretToVault: true
    vaultSecretPath: "central/data/rhbk-services-admin"
    operator:
      channel: stable-v26.4
    keycloak:
      enabled: true
      instances: 2
      hostname: "rhbk-services.apps.services.shc.signal9.gg"
      db:
        enabled: true
        vendor: postgres
        host: "rhbk-pgcluster-primary.services-rhbk.svc"
        database: keycloak
        usernameSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: user
        passwordSecret:
          name: rhbk-pgcluster-pguser-keycloak
          key: password
        crunchy:
          enabled: true
          name: rhbk-pgcluster
          instances: 2
          storage: 10Gi
          backupStorage: 10Gi
      tls:
        enabled: false

# ─── RHBK Config (DEPRECATED — replaced by sovereignJobs keycloak* jobs) ─────
rhbkConfig:
  enabled: false
  chartVersion: "0.4.0"
  syncWave: "30"
  destinationNamespace: central-rhbk
  values:
    namespace: central-rhbk
    ansibleJob:
      enabled: false

# ─── ACS (disabled) ──────────────────────────────────────────────────────────
acs:
  enabled: true
  chartVersion: "0.2.0"
  syncWave: "25"
  destinationNamespace: rhacs-operator
  values:
    namespace: rhacs-operator
    central:
      enabled: true
      namespace: stackrox
      instanceName: stackrox-central-services
    consolePlugin:
      enabled: true

acsServices:
  enabled: false
  chartVersion: "0.2.0"
  syncWave: "25"
  destinationNamespace: rhacs-operator
  values:
    namespace: rhacs-operator
    central:
      enabled: false
    consolePlugin:
      enabled: true

# ─── Vault Central ───────────────────────────────────────────────────────────
vault:
  enabled: true
  chartVersion: "0.6.11"
  syncWave: "15"
  destinationNamespace: central-vault
  values:
    namespace: central-vault
    pushSecretToVault: false
    vault:
      global:
        openshift: true
        imagePullSecrets:
          - name: quay-pull-secret
      server:
        standalone:
          enabled: false
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
              }
              # shc (LAB-PLAN D7): auto-unseal against the lab Vault transit engine. Unseal-only:
              # the token (Secret vault-transit-token, periodic, policy shc-central-unseal) can only
              # encrypt/decrypt with this key. Recovery keys from init are kept offline.
              seal "transit" {
                address         = "https://vault.lab.signal9.gg"
                mount_path      = "lab/shc-transit/"
                key_name        = "shc-central-unseal"
                disable_renewal = "false"
              }
              service_registration "kubernetes" {}
        # shc: transit seal token (VAULT_TOKEN is read by the seal; jobs use explicit X-Vault-Token)
        extraSecretEnvironmentVars:
          - envName: VAULT_TOKEN
            secretName: vault-transit-token
            secretKey: token
        dataStorage:
          enabled: true
          size: 10Gi
        route:
          enabled: true
          host: vault-central.apps.central.shc.signal9.gg
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        image:
          repository: quay.signal9.gg/shc/vault
          tag: "1.21.2"
      ui:
        enabled: true
      injector:
        enabled: true
        image:
          repository: quay.signal9.gg/shc/vault-k8s
          tag: "1.5.0"

# ─── Vault Services ─────────────────────────────────────────────────────────
vaultServices:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.6.11"
  syncWave: "15"
  destinationNamespace: services-vault
  values:
    namespace: services-vault
    pushSecretToVault: false
    ociCredentials:
      enabled: true
      vaultPath: "oci-credentials"
      secretStoreName: "vault-backend"
      secretStoreKind: "ClusterSecretStore"
    vault:
      global:
        openshift: true
        imagePullSecrets:
          - name: quay-pull-secret
      server:
        standalone:
          enabled: false
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
                retry_join {
                  leader_api_addr = "http://vault-services-0.vault-services-internal.services-vault.svc:8200"
                }
                retry_join {
                  leader_api_addr = "http://vault-services-1.vault-services-internal.services-vault.svc:8200"
                }
                retry_join {
                  leader_api_addr = "http://vault-services-2.vault-services-internal.services-vault.svc:8200"
                }
              }
              service_registration "kubernetes" {}
              # shc (LAB-PLAN D7): auto-unseal against the lab Vault transit engine, key
              # shc-services-unseal (token in Secret vault-transit-token, encrypt/decrypt only).
              seal "transit" {
                address         = "https://vault.lab.signal9.gg"
                mount_path      = "lab/shc-transit/"
                key_name        = "shc-services-unseal"
                disable_renewal = "false"
              }
        # shc: transit seal token (VAULT_TOKEN is read by the seal; jobs use explicit X-Vault-Token)
        extraSecretEnvironmentVars:
          - envName: VAULT_TOKEN
            secretName: vault-transit-token
            secretKey: token
        dataStorage:
          enabled: true
          size: 10Gi
        route:
          enabled: true
          host: vault-services.apps.services.shc.signal9.gg
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        image:
          repository: quay.signal9.gg/shc/vault
          tag: "1.21.2"
        readinessProbe:
          enabled: true
          path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      ui:
        enabled: true
      injector:
        enabled: true
        image:
          repository: quay.signal9.gg/shc/vault-k8s
          tag: "1.5.0"

# ─── Vault Services Init (separate App to avoid StatefulSet health deadlock) ─
vaultServicesInit:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.2.3-shc.1"
  syncWave: "20"
  values:
    namespace: services-vault
    serviceAccount: vault-init-runner
    image: "quay.signal9.gg/shc/ansible-runner:latest"
    imagePullSecretName: "quay-pull-secret"
    secretName: "vault-services-init-secrets"
    vaultAddr: "http://vault-services-0.vault-services-internal.services-vault.svc:8200"
    vaultNamespace: "services-vault"
    activeDeadlineSeconds: 600
    backoffLimit: 5
    pushSecretToVaultCentral: true
    pushSecretStoreName: "vault-backend"
    vaultCentralPath: "vault-services-init"
    pushUnsealKeys: false  # shc: transit seal, no unseal keys (LAB-PLAN §7.6)

# ─── RHACM ───────────────────────────────────────────────────────────────────
rhacm:
  enabled: true
  chartVersion: "0.5.1-shc.2"  # shc: + AgentServiceConfig + Provisioning (LAB-PLAN §7.4), assisted-service env overrides (P6)
  enableMultiClusterHub: true
  destinationNamespace: open-cluster-management
  syncWave: "10"
  values:
    operator:
      channel: "release-2.17"  # shc: D13
      installPlanApproval: Automatic
    multiClusterHub:
      enabled: true
      availabilityConfig: High
      disableHubSelfManagement: false
      components:
        console: true
        search: true
        cluster-lifecycle: true
        volsync: false
        cluster-backup: false
    # shc (D19): CIM for mce-cluster-build agent clusters; storage on the default SC (ODF external)
    agentServiceConfig:
      enabled: true
      # shc: TNF_CLUSTERS_SUPPORT (P6 two-node edge1) removed 2026-10-12 with that cluster: assisted installs
      # two-node-with-fencing as featureSet DevPreviewNoUpgrade; edge1 is now compact.
      # shc (D13, §7 item 4): MCE 2.17.3's built-in list maps 4.22 to a pre-release RHCOS
      # (4.22.0-ec.5). Pin the discovery OS to the GA boot image of the 4.22 installer in use
      # (openshift-install 4.22.16 `coreos print-stream-json`). Replaces the whole built-in list.
      osImages:
        - openshiftVersion: "4.22"
          version: "9.8.20260715-1"
          cpuArchitecture: x86_64
          url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-9.8/builds/9.8.20260715-1/x86_64/rhcos-9.8.20260715-1-live-iso.x86_64.iso
    # shc (§4): metal3 Managed provisioning network on VLAN 231 via the masters' second NIC
    provisioning:
      enabled: true
      network: Managed
      ip: "172.18.231.3"
      networkCIDR: "172.18.231.0/24"
      dhcpRange: "172.18.231.20,172.18.231.199"
      macAddresses:
        - "fa:16:3e:87:83:fa"  # central-0-prov
        - "fa:16:3e:e5:54:08"  # central-1-prov
        - "fa:16:3e:0d:d1:dc"  # central-2-prov
      watchAllNamespaces: true

# ─── shc: cluster OIDC issuer (LAB-PLAN D17/§9) ──────────────────────────────
oidcIssuer:
  enabled: true
  chartVersion: "0.1.3"
  syncWave: "8"
  values:
    host: oidc.shc.signal9.gg
    baseURL: https://oidc.shc.signal9.gg
    namespace: shc-oidc
    sync:
      clusters:
        - name: central
          source: local
        # spokes through ACM (ManagedServiceAccount + cluster-proxy); each gets its issuer at install
        - name: services
          source: acm
        - name: iaas1
          source: acm
        - name: edge1
          source: acm

# ─── shc: bare-metal node inventory (LAB-PLAN D19, §7 item 3) ───────────────────────────────
# charts/charts/metal-node-assignment on central: BareMetalHosts (ipmi://, legacy boot, converged
# flow), BMC credentials from central Vault (metal/bmc-sl230, p2/bootstrap.sh seed-metal) and the
# shared late-binding InfraEnv metal-infra-env. iaas1 blades 1-4, 6, 7; (until 2026-10-12: edge1 blades 5, 8, P6 two-node
# with fencing: per-node Redfish fencing Secrets); Dell C6220 sleds 1-4 (edge1 rebuild, design
# EDGE1-C6220-BGW-PLAN: 1G LOMs on N3K native 231 + VLAN 238, 10G LACP to AST Po11-14 for VLANs 11/239,
# IPMI 172.18.2.43+N with metal/bmc-c6220). Generated by the lab
# workspace's p3/gen-metal-values.py; every MAC verified from the Agent inventories (NetBox had blade 1
# and 3 Port2 wrong, signal9-lab-gitops the 40G MACs). VLAN 233 .10+N at MTU 9000 (HSC SVI 9000), VLAN 11 .210+N, iLO 172.18.2.30+N.
metalNodes:
  enabled: true
  chartVersion: "0.1.1"
  syncWave: "12"
  namespace: metal-infra-env
  values:
    secretStoreName: vault-backend
    bmcDefaults:
      externalSecret:
        vaultName: metal/bmc-sl230
        usernameKey: username
        passwordKey: password
    infraEnvs:
    - name: metal-infra-env
      namespace: metal-infra-env
      pullSecretVault: metal/pull-secret
      sshAuthorizedKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIV2XhtthRYpWXMsQ31Im40+UHcYUGv0HA3NlJ86Iwbw shc-central-core
      ntpSources:
      - 172.18.42.20
      - 172.18.0.79
      kernelArguments:
