---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        aaporg_cr_name: "{{ event_payload.regarding.name }}"
        aaporg_cr_namespace: "{{ event_payload.regarding.namespace }}"
        aaporg_spec: "{{ shc_live_spec }}"

    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    # The automation connection is optional on the object: the teardown cleans up in the connection the
    # object recorded in status.config (else the one it names, else the platform's default).
    - name: Resolve the automation connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_integration_config.yml"
      vars:
        resolve_config_kind: AAPConfig
        resolve_config_name: "{{ aaporg_spec.aapConfig | default('') }}"
        resolve_config_recorded: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).config | default('', true) }}"
        resolve_config_teardown: true
        resolve_config_namespace: "{{ plugin_aap_config_namespace }}"
        resolve_config_required: false

    - name: Use the resolved automation connection
      ansible.builtin.set_fact:
        aaporg_spec: "{{ aaporg_spec | combine({'aapConfig': resolved_config_name}) }}"

    # the name, the gateway id and the sign-in maps the provision recorded; nothing is found by a name's beginning
    - name: The organization's recorded name, id and maps
      ansible.builtin.set_fact:
        fin_status: "{{ (shc_live_cr | default({}, true)).status | default({}, true) }}"
        fin_org_name: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).orgName | default('', true) }}"
        fin_org_id: >-
          {{ (((shc_live_cr | default({}, true)).status | default({}, true)).gatewayOrgId | default('', true) | string | trim)
             | regex_replace('^0$', '') }}

    - name: Read AAPConfig CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AAPConfig
        name: "{{ aaporg_spec.aapConfig }}"
        namespace: "{{ plugin_aap_config_namespace }}"
      register: _aap_config
      when: aaporg_spec.aapConfig | length > 0
      ignore_errors: true

    - name: Delete AAP org and teams
      when: _aap_config.resources | default([]) | length > 0
      block:
        # the same credentials the provision role uses (central Vault KV aap-admin: username/password); the
        # AAPConfig's spec.secret is a legacy pointer that holds no username, so decoding it failed and every
        # gateway call below ran with undefined credentials while the deletion was still reported complete
        - name: Load AAP admin credentials from Vault
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_aap_admin_credentials.yml"

        - name: Discover AAP gateway Route from services cluster
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: route.openshift.io/v1
            kind: Route
            name: sovereign-aap
            namespace: aap
          register: aap_gw_route

        - name: Override aap_gateway_internal_url with discovered Route
          ansible.builtin.set_fact:
            aap_gateway_internal_url: "https://{{ aap_gw_route.resources[0].spec.host }}"
          when: aap_gw_route.resources | length > 0

        - name: Read the recorded organization in the gateway
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/organizations/{{ fin_org_id }}/"
            method: GET
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 404]
          register: _gw_org_by_id
          when: fin_org_id | length > 0

        # an object of the release before records the name only: the organization of exactly that name
        - name: Find org in gateway
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/organizations/?name={{ fin_org_name | urlencode }}"
            method: GET
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          register: _gw_org_lookup
          when: fin_org_id | length == 0 and fin_org_name | length > 0

        # the organization the status records is this object's, whatever its name or description now: by the
        # recorded id, else (recorded before the ids were kept) by the recorded name; nothing recorded, nothing
        # deleted
        - name: "Decide: delete or gone"
          vars:
            _by_id: "{{ _gw_org_by_id.json | default({}, true) if (_gw_org_by_id.status | default(0) | int) == 200 else {} }}"
            _found: >-
              {{ (_gw_org_lookup.json | default({}, true)).results | default([], true)
                 | selectattr('name', 'equalto', fin_org_name) | list }}
          ansible.builtin.set_fact:
            aaporg_fin_org: >-
              {{ _by_id if fin_org_id | length > 0 else ((_found | first) if _found | length > 0 else {}) }}
            aaporg_fin_decision: >-
              {{ ('delete' if _by_id | length > 0 else 'gone') if fin_org_id | length > 0
                 else ('delete' if _found | length > 0 else 'gone') }}

        - name: Delete org from gateway
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/organizations/{{ aaporg_fin_org.id }}/"
            method: DELETE
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 204, 404]
          when: aaporg_fin_decision == 'delete'

        # the maps the provision recorded by id; an object that recorded none (made before the ids were kept): the
        # exact names it would have made for the groups its status records, pointing at its organization
        - name: The sign-in maps to delete
          ansible.builtin.set_fact:
            aaporg_fin_map_ids: "{{ fin_status.signInMaps | default([], true) | map(attribute='id') | map('string') | list }}"
            aaporg_fin_map_names: >-
              {%- set out = [] -%}
              {%- if fin_org_name | length > 0 -%}
                {%- for kind, groups in [('admin', fin_status.adminGroups | default([], true)),
                                         ('executor', fin_status.executorGroups | default([], true)),
                                         ('viewer', fin_status.viewerGroups | default([], true))] -%}
                  {%- for g in groups -%}{%- set _ = out.append(fin_org_name ~ '-' ~ kind ~ '-map-' ~ g) -%}{%- endfor -%}
                {%- endfor -%}
              {%- endif -%}
              {{ out }}

        - name: Find the recorded sign-in maps
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/{{ item }}/"
            method: GET
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 404]
          loop: "{{ aaporg_fin_map_ids }}"
          register: _fin_maps_by_id

        - name: Find the sign-in maps by their exact names
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/?name={{ item | urlencode }}"
            method: GET
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          loop: "{{ aaporg_fin_map_names if aaporg_fin_map_ids | length == 0 else [] }}"
          register: _fin_maps_by_name

        - name: Delete each authenticator map
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/{{ item.id }}/"
            method: DELETE
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 204, 404]
          loop: >-
            {%- set out = [] -%}
            {%- for r in _fin_maps_by_id.results | default([]) if r.status | default(0) == 200 -%}
              {%- set _ = out.append(r.json) -%}
            {%- endfor -%}
            {%- for r in _fin_maps_by_name.results | default([]) -%}
              {%- for m in (r.json | default({}, true)).results | default([], true)
                    if m.name == r.item and (m.organization | default('', true) | string)
                       == (aaporg_fin_org.name | default(fin_org_name, true)) -%}
                {%- set _ = out.append(m) -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ out }}
          loop_control:
            label: "{{ item.name }}"
      # a tool-side failure fails the teardown (the object shows TeardownFailed and retries) instead of
      # reporting a deletion that left the organization, its teams and maps behind

    - name: Get current timestamp for status
      ansible.builtin.set_fact:
        aaporg_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark AAPOrg deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: aaporgs
        cr_name: "{{ aaporg_cr_name }}"
        cr_namespace: "{{ aaporg_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          lastReconciledAt: "{{ aaporg_delete_transition_time }}"
          message: >-
            {{ ('AAPOrg ' ~ aaporg_cr_name ~ ' deleted by EDA') if (fin_org_id ~ fin_org_name) | length > 0
               else ('AAPOrg ' ~ aaporg_cr_name ~ ' deleted; its status records no automation organization, so nothing'
                     ~ ' was deleted in the automation platform') }}

  rescue:
    - name: Mark AAPOrg delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: aaporgs
        cr_name: "{{ aaporg_cr_name }}"
        cr_namespace: "{{ aaporg_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA deletion failed')) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "AAPOrg {{ aaporg_cr_name | default('unknown') }} EDA teardown failed"
