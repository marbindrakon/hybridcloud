apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaults.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "6"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: Vault
    listKind: VaultList
    plural: vaults
    singular: vault
    shortNames:
      - vlt
    categories:
      - shc
      - shc-tenant
      - shc-services
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A Vault: a HashiCorp Vault instance of the tenant's own, comparable to AWS Secrets
            Manager, Google Cloud Secret Manager, Azure Key Vault or OpenStack Barbican. Members of
            the tenant's access groups sign in with their platform identity; KV secrets engines
            (VaultKV) say who may use which secrets.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The Vault instance.
              type: object
              properties:
                ha:
                  description: Run Vault highly available. Default true.
                  type: boolean
                  default: true
                rbacConfig:
                  description: >-
                    Optional. The identity provider connection (an RbacConfig in the platform's
                    integration namespace) used for sign-in. When omitted the platform uses its
                    default connection.
                  type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                vaultUrl:
                  description: URL of the Vault instance.
                  type: string
                vaultInternalUrl:
                  description: URL of the Vault instance inside the services cluster.
                  type: string
                adminSecretName:
                  description: Platform detail. Secret that holds the instance's root credentials.
                  type: string
                adminSecretNamespace:
                  description: Platform detail. Namespace of that Secret.
                  type: string
                oidcClientId:
                  description: Client of the instance in the platform's sign-in directory.
                  type: string
                entity:
                  description: The tenant this Vault belongs to.
                  type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .status.vaultUrl
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
