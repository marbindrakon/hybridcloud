                        return True
                except ValueError:
                    pass
        return False


    def guarded(text, block, leg):
        """Whether the guard table (nft list table inet shc_core_guard) holds the drop rule for the block: a rule that
        drops what is addressed to the block (ip6 daddr) unless it came in on the core leg or lo (iifname != {...})."""
        for line in text.splitlines():
            w = line.replace("{", " { ").replace("}", " } ").replace(",", " ").split()
            if "drop" not in w or "daddr" not in w or w[w.index("daddr") - 1] != "ip6" or "iifname" not in w:
                continue
            try:
                if ipaddress.ip_network(w[w.index("daddr") + 1], strict=False) != block:
                    continue
            except (ValueError, IndexError):
                continue
            i = w.index("iifname")
            if w[i + 1:i + 3] != ["!=", "{"] or "}" not in w[i + 3:]:
                continue
            devs = {d.strip(chr(34)) for d in w[i + 3:w.index("}", i + 3)]}
            if devs == {leg, "lo"}:
                return True
        return False


    def main(argv, run):
        """argv: <vtysh pathspace or ""> <netns or ""> <core leg> <SID block> <own IPv6 loopback> <own locator>
        <IPv6 loopback pool> [<peer IPv6 loopback>...]. The SRv6 core of this instance: the kernel (VRF strict mode, no
        routing header accepted (seg6_enabled 0 on all, default and the core leg: the SID routes need none), the rule that
        looks the block up in the main table at preference 999, the IPv4 lookup local rule after the l3mdev rule, the guard
        with its drop rule for the block), the own
        locator (its anchor on lo and its prefix in the own LSP), and per provider-edge peer the VPN session over the IPv6 loopbacks with VPNv4 and VPNv6
        negotiated, its IPv6 loopback and its locator installed from IS-IS. With a peer named (a gateway) all of it is
        required. Without one (the route reflector) the PE group must listen on the pool and the peers are the sessions up
        from the pool: a peer that lacks a family or whose loopback or locator has not arrived is reported (stderr, and
        the state: Established = every peer complete, Partial = some, NoNeg = none, NoPeers = no session), not an error,
        so a gateway that its own job still has to repair never fails the fabric. Prints ipv6Vpn=<state> (and on the
        route reflector pendingPeers=<peer,...>); exits 1 while anything required is missing."""
        pathspace, netns, leg = argv[0], argv[1], argv[2]
        block, own6 = ipaddress.ip_network(argv[3]), ipaddress.ip_address(argv[4])
        loc, pool6 = ipaddress.ip_network(argv[5]), ipaddress.ip_network(argv[6])
        want = [a for a in (addr(p) for p in argv[7:]) if a]
        x = ["ip", "netns", "exec", netns] if netns else []
        vtysh = ["vtysh"] + (["-N", pathspace] if pathspace else [])
        errors = []

        def read(cmd):
