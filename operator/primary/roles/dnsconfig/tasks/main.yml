---
# shc (design/TENANT-DNS.md D1): DNSConfig, the platform's tenant DNS namespace. The EDA job
# (dnsconfig-provision) probes the global zone with the DNS-only account and records its nameservers.
- block:
    # Pull only leaf fields: never dump metadata/status dicts into Jinja (see the CloudOSO role).
    - name: Set DNSConfig CR facts
      ansible.builtin.set_fact:
        dnsconfig_spec: "{{ _hybridsovereign_redhat_dnsconfig.spec | default({}) }}"
        dnsconfig_generation: "{{ _hybridsovereign_redhat_dnsconfig.metadata.generation | default(0) | int }}"
        dnsconfig_observed_generation: "{{ _hybridsovereign_redhat_dnsconfig.status.observedGeneration | default(0) | int }}"
        dnsconfig_status: "{{ _hybridsovereign_redhat_dnsconfig.status.status | default('') | string }}"
        dnsconfig_ready: "{{ _hybridsovereign_redhat_dnsconfig.status.ready | default(false) | bool }}"
        dnsconfig_last_reconciled: "{{ _hybridsovereign_redhat_dnsconfig.status.lastReconciledAt | default('') | string }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_dnsconfig }}"

    - name: Age of the last probe
      ansible.builtin.set_fact:
        dnsconfig_probe_age: >-
          {{
            ((now(utc=True) - (dnsconfig_last_reconciled[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() | int)
            if dnsconfig_last_reconciled | length >= 19 else 999999999
          }}

    - name: Set event action and reason
      ansible.builtin.set_fact:
        dnsconfig_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        dnsconfig_event_reason: >-
          {{ 'DNSConfigReconcileRequested' if reconcile_now | bool else 'DNSConfigCreateRequested' }}
        dnsconfig_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (dnsconfig_observed_generation | int >= dnsconfig_generation | int)
            and (dnsconfig_status == 'ready')
            and (dnsconfig_ready | bool)
            and (dnsconfig_probe_age | int < dnsconfig_reprobe_seconds | int)
          }}

    - name: Skip when already processed and the last probe is recent
      ansible.builtin.meta: end_host
      when: dnsconfig_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: DNSConfig
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        dnsconfig_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark DNSConfig as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: DNSConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          lastReconciledAt: "{{ dnsconfig_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ dnsconfig_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to probe the DNS service
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark DNSConfig as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: DNSConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ dnsconfig_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ dnsconfig_event_reason | trim }}"
        operator_event_action: "{{ dnsconfig_event_action }}"
        operator_event_note: "{{ dnsconfig_spec | to_json }}"
        operator_reporting_controller: dnsconfig-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: DNSConfig
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_dnsconfig.metadata.uid }}"

  rescue:
    - name: Truncate failure message
      ansible.builtin.set_fact:
        dnsconfig_failure_message: >-
          {{
            (ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) | string)
            | truncate(500, True, '…')
          }}

    - name: Mark DNSConfig as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: DNSConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ dnsconfig_failure_message }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ dnsconfig_failure_message }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "DNSConfig {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
