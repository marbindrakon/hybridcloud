# Sample NetworkPlacements: payments-vpc on a VM environment (CloudVirt) and on an OpenStack project (CloudOSO).
# The first gets the lowest free /24 of the network's space; the second asks for a pinned prefix. VMs on both reach
# each other through the sites' CloudGateways (status.prefixes shows each placement's subnet).
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: payments-dev-virt
  namespace: entity-acme-corp
spec:
  network: payments-vpc
  backend: {kind: CloudVirt, name: dev}
  ipv4: {prefixLength: 24}
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: payments-dev-openstack
  namespace: entity-acme-corp
spec:
  network: payments-vpc
  backend: {kind: CloudOSO, name: acme-dev-openstack}
  ipv4: {prefix: 10.50.1.0/24}
