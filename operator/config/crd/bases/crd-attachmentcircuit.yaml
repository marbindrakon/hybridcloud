apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: attachmentcircuits.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: AttachmentCircuit
    listKind: AttachmentCircuitList
    plural: attachmentcircuits
    singular: attachmentcircuit
    shortNames:
      - acirc
    categories:
      - shc
      - shc-tenant
      - shc-network
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An edge connection: connects a HybridNetwork of this tenant to a customer edge router
            (CE) on a bearer of a ProviderEdge, comparable to an AWS Direct Connect virtual
            interface, a Cloud Interconnect VLAN attachment or an ExpressRoute private peering. The
            platform allocates a VLAN and a link subnet on the bearer, peers with the CE from every
            node of the edge, and exchanges routes with it inside the network: routes the CE sends
            that match spec.routing.accept reach the network's placements, and the network's
            placement prefixes are advertised to the CE. status.ceConfig lists what the CE needs.
            Routes inside the network's address space (HybridNetwork spec.prefixes) or the
            platform's ranges are never accepted, and an accept entry inside the address space is
            refused; a default route from the CE is accepted only while the network has no provider
            internet egress of that address family. Accept entries may be IPv4 and IPv6: with at least
            one IPv6 entry the circuit also gets an IPv6 link subnet and a second BGP session over
            IPv6 from every node. A circuit of ceKind platform (only in the platform's namespace) connects
            the router of the network the platform's management runs on instead, with no network: it
            accepts the platform's management ranges and advertises the addresses of the clusters the
            platform builds on networks (status.ceConfig acceptedRanges and advertisedRanges).
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required: [edgeRef, routing]
              x-kubernetes-validations:
                - rule: (self.ceKind == 'platform') != has(self.network)
                  message: spec.network is required for ceKind customer and not allowed for ceKind platform
                - rule: self.ceKind != 'platform' || !has(self.routing.accept)
                  message: >-
                    a platform circuit accepts the platform's infrastructure ranges; routing.accept is not allowed
              properties:
                network:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: >-
                    The HybridNetwork (this namespace) to connect. Required for ceKind customer, not allowed for
                    ceKind platform. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.network is immutable
                edgeRef:
                  type: object
                  description: The ProviderEdge (platform namespace) and the bearer on it. Immutable.
                  required: [name, bearer]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.edgeRef is immutable
                  properties:
                    name:
                      description: Name of the referenced object.
                      type: string
                      minLength: 1
                      maxLength: 253
                    bearer:
                      description: >-
                        Name of the bearer on that ProviderEdge (one of its spec.bearers) the
                        circuit is ordered on.
                      type: string
                      minLength: 1
                      maxLength: 63
                ceKind:
                  type: string
                  description: >-
                    The kind of router at the other end. customer: a router the tenant operates, connected to
                    spec.network. platform: the router of the network the platform's management runs on, connected
                    to the platform's service routing domain; only in the platform namespace. Immutable.
                  enum: [customer, platform]
                  default: customer
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.ceKind is immutable
                routing:
                  description: How the network and the CE exchange routes.
                  type: object
                  required: [protocol]
                  x-kubernetes-validations:
                    - rule: self.protocol != 'bgp' || has(self.bgp)
                      message: protocol bgp needs routing.bgp
                  properties:
                    protocol:
                      type: string
                      description: How routes are exchanged with the CE.
                      enum: [bgp]
                    bgp:
                      description: The BGP session with the CE. Required when protocol is bgp.
                      type: object
                      required: [peerAsn]
                      properties:
                        peerAsn:
                          type: integer
                          format: int64
                          minimum: 1
                          maximum: 4294967295
                          description: >-
                            The CE's autonomous system number. It must differ from the fabric's and from the AS numbers
                            the platform keeps for its own sessions (refused with PeerAsnReserved).
                        authentication:
                          type: object
                          description: >-
                            Session authentication. md5 with secretRef uses the password in that Secret (this
                            namespace, key "password"); md5 without secretRef has the platform generate one and write
                            it to a Secret named in status.ceConfig.
                          properties:
                            type:
                              description: >-
                                md5: TCP MD5 password on the session (default). none: no password.
                              type: string
                              enum: [md5, none]
                              default: md5
                            secretRef:
                              description: >-
                                A Secret in this namespace whose key "password" holds the session
                                password. Omit it to have the platform generate one.
                              type: object
                              required: [name]
                              properties:
                                name:
                                  description: Name of the referenced object.
                                  type: string
                                  minLength: 1
                                  maxLength: 253
                        maxPrefixes:
                          type: object
                          description: How many routes the CE may send. teardown closes the session above the limit.
                          properties:
                            limit:
                              description: Most routes the CE may send (1 to 100000, default 100).
                              type: integer
                              minimum: 1
                              maximum: 100000
                              default: 100
                            action:
                              description: >-
                                What happens above the limit. teardown (default): the session is
                                closed. warning: the session stays up and the excess is only logged.
                              type: string
                              enum: [teardown, warning]
                              default: teardown
                        bfd:
                          type: boolean
                          default: false
                          description: Fast failure detection on the session (the CE must run BFD too).
                    accept:
                      type: array
                      description: >-
                        Routes accepted from the CE (ceKind customer: at least one entry; not allowed for ceKind
                        platform), as prefix-list entries "<prefix>[ ge <n>][ le <n>]" of either
                        address family (e.g. "10.50.0.0/16 le 24", "2001:db8:50::/48 le 64"); ge and le are at most
                        32 for an IPv4 prefix and 128 for an IPv6 prefix. Everything else from the CE is dropped. With
                        at least one IPv6 entry the circuit also carries IPv6: an IPv6 link subnet and a second BGP
                        session over it (status.ceConfig address6 and neighbors6). That is refused
                        (FamilyUnavailable) where the platform offers no IPv6 on edge connections or the network has
                        no IPv6 address space. Removing every IPv6 entry removes the IPv6 session again.
                      maxItems: 64
                      items:
                        type: string
                        maxLength: 64
                        x-kubernetes-validations:
                          - rule: "self.matches('^[0-9A-Fa-f:.]+/[0-9]{1,3}( ge [0-9]{1,3})?( le [0-9]{1,3})?$')"
                            message: an entry is "<prefix>[ ge <n>][ le <n>]"
                          - rule: >-
                              isCIDR(self.split(' ')[0])
                              && cidr(self.split(' ')[0]) == cidr(self.split(' ')[0]).masked()
                            message: the entry must start with an IPv4 or IPv6 network prefix (host bits zero)
                          - rule: >-
                              !self.matches('^[0-9A-Fa-f:.]+/[0-9]{1,3}( ge [0-9]{1,3})?( le [0-9]{1,3})?$')
                              || !isCIDR(self.split(' ')[0]) || !self.contains(' ge ')
                              || (int(self.split(' ge ')[1].split(' ')[0]) > cidr(self.split(' ')[0]).prefixLength()
                                  && int(self.split(' ge ')[1].split(' ')[0])
                                     <= (cidr(self.split(' ')[0]).ip().family() == 4 ? 32 : 128))
                            message: ge must be longer than the prefix and at most 32 (IPv4) or 128 (IPv6)
                          - rule: >-
                              !self.matches('^[0-9A-Fa-f:.]+/[0-9]{1,3}( ge [0-9]{1,3})?( le [0-9]{1,3})?$')
                              || !isCIDR(self.split(' ')[0]) || !self.contains(' le ')
                              || (int(self.split(' le ')[1]) > cidr(self.split(' ')[0]).prefixLength()
                                  && int(self.split(' le ')[1])
                                     <= (cidr(self.split(' ')[0]).ip().family() == 4 ? 32 : 128))
                            message: le must be longer than the prefix and at most 32 (IPv4) or 128 (IPv6)
                          - rule: >-
                              !self.matches('^[0-9A-Fa-f:.]+/[0-9]{1,3} ge [0-9]{1,3} le [0-9]{1,3}$')
                              || int(self.split(' ge ')[1].split(' ')[0]) <= int(self.split(' le ')[1])
                            message: ge must not exceed le
                    advertise:
                      type: object
                      description: What the network advertises to the CE. Does not apply to ceKind platform.
                      properties:
                        networkPrefixes:
                          type: boolean
                          default: true
                          description: The prefixes of the network's placements.
                        default:
                          type: boolean
                          default: false
                          description: >-
                            A default route, while the network has provider internet egress (the CE's own traffic
                            may then use it); with IPv6 accept entries also ::/0 over the IPv6 session, while the
                            network has IPv6 internet egress.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                entity:
                  type: string
                fabric:
                  type: string
                vlan:
                  type: integer
                  description: The circuit's VLAN on the bearer.
                link:
                  type: string
                  description: The circuit's link subnet.
                peAsn:
                  type: integer
                  format: int64
                  description: The autonomous system the CE peers with.
                sessions:
                  type: array
                  description: >-
                    The sessions from each edge node, one per address family the circuit carries. The circuit is
                    ready when every session is established.
                  items:
                    type: object
                    properties:
                      node:
                        type: string
                      family:
                        type: integer
                        description: 4 or 6.
                      address:
                        type: string
                        description: The node's address on the circuit's link of this family.
                      peer:
                        type: string
                        description: The CE address the node peers with.
                      state:
                        type: string
                      accepted:
                        type: integer
                      advertised:
                        type: integer
                    x-kubernetes-preserve-unknown-fields: true
                ceConfig:
                  type: object
                  description: >-
                    What the CE needs to configure. With IPv6 accept entries also address6, secondAddress6 and
                    neighbors6; for ceKind platform also advertisedRanges and acceptedRanges.
                  properties:
                    advertisedRanges:
                      type: array
                      description: >-
                        ceKind platform: the routes the platform advertises over the circuit, as prefix-list entries
                        the router at the other end can accept with a fixed filter; the platform never announces a
                        route outside them.
                      items:
                        type: string
                    acceptedRanges:
                      type: array
                      description: >-
                        ceKind platform: the routes the platform accepts from the router at the other end (the
                        ranges the platform's management connects from), as prefix-list entries.
                      items:
                        type: string
                    address6:
                      type: string
                      description: The CE's address on the circuit's IPv6 link subnet (with its length).
                    secondAddress6:
                      type: string
                      description: The address for a second CE router on the IPv6 link subnet.
                    neighbors6:
                      type: array
                      description: The edge nodes to peer with over IPv6 (one session each), with their AS number.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                notes:
                  type: array
                  description: Parts of the routing policy that don't apply right now, and why.
                  items:
                    type: string
                realization:
                  type: object
                  description: >-
                    How the platform realized the circuit (informational; depends on the platform). With IPv6 accept
                    entries it also holds the IPv6 link (link6), the CE's IPv6 address (ce6) and each node's
                    (nodes[].address6).
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                realized:
                  description: >-
                    True from the first time the platform finished realizing this object, until a
                    later run fails (then false). A run that waits for something else leaves it as
                    it was. Objects that depend on this one keep treating it as usable while it
                    re-runs or waits.
                  type: boolean
                waitingFor:
                  type: array
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                phase:
                  type: string
                  description: >-
                    State of the object, written by the platform: Waiting (for something else),
                    Creating, Updating, Ready, Degraded (usable, with reduced health), Paused (the
                    site is paused), Failed or Deleting.
                phaseSince:
                  type: string
                  description: >-
                    When the object entered the state in status.phase (RFC 3339). It changes only
                    when the state changes.
                summary:
                  type: string
                  description: >-
                    One line on what the platform is doing or waiting for, in plain words. Read it
                    together with status.phase.
                lastHandledReconcileRequest:
                  type: string
                  description: >-
                    The Retry now request the platform last handled: the value of the
                    ansible.sdk.operatorframework.io/reconcileNow annotation at that time. A request
                    is open while the annotation differs from this value.
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Edge
          type: string
          jsonPath: .spec.edgeRef.name
        - name: VLAN
          type: integer
          jsonPath: .status.vlan
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
