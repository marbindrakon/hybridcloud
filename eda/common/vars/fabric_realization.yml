---
# shc (design/P7-PLAN.md §12.3, H2): how this platform realizes a HybridFabric. The CRs state intent; these are
# the realization's own parameters: border gateway nodes are Linux hosts reached over SSH, each node runs the
# fabric root (VPNv4 route reflector) and one network namespace per CloudGateway (a provider edge: EVPN-VXLAN on
# the site side, IS-IS segment routing + MPLS L3VPN over a node-local core bridge on the fabric side).
# realization models these roles implement
fabric_realization_models: [linux-pe]
# An installation overrides any of it with the sovereign-localhost inventory variable `fabric_realization`
# (aap-config env FABRIC_REALIZATION, JSON), and per fabric under fabric_realization.fabrics.<name>.
fabric_realization_defaults:
  # which realization drives the border gateway: linux-pe = RHEL hosts with FRR (this platform's implementation).
  # Another model (e.g. a vendor router OS) would add its own node tasks; the CRs stay the same.
  model: linux-pe
  # route target values per HybridNetwork between the gateways (<domainAsn>:<value>); must stay clear of the
  # fabric's VNI pools so a VPN route target never equals a site route target
  vpnTargetPool: {start: 10000, end: 10999}
  # standard community <domainAsn>:<value> on the routes gateways originate into a site; never taken back
  gatewayCommunity: 999
  # standard community <domainAsn>:<value> on the routes a gateway originates for its own site only (its unreachable
  # IPv6 default while the network has no IPv6 egress, the covering routes): never exported into the network's VPN,
  # where an unreachable default of one site would compete with the egress default
  gatewayLocalCommunity: 997
  gateway:
    # per address family: only the placements' prefixes (and the host routes inside them) enter a VRF from the
    # site, so a site router can't put another prefix into a tenant's network. Off for a family: the site's routes
    # of that family pass unfiltered (only the gateways' own routes, gatewayCommunity, are refused)
    siteImportFilter:
      ipv4: false
      ipv6: true
    # milliseconds between ICMPv6 error messages a gateway namespace sends to one destination; 0 = no per-destination
    # limit (the kernel's global limit of 1000 messages a second still applies); "" = the kernel default (1000, after
    # a burst of six). A site's IPv6 traffic to destinations the fabric does not offer is answered with "unreachable"
    # by the gateway, and a guest connecting to a name with many addresses sends its attempts milliseconds apart:
    # every one must get its answer, or the guest waits a full retransmit
    icmp6RateLimitMs: 0
  core:
    bridge: br-core
    loopbackPool: 10.255.0.0/24
    linkSubnet: 10.255.1.0/24
    isisArea: "49.0001"
    srgb: {start: 16000, end: 23999}
    # IPv6 transport of the core (dual-stack core): each root and gateway namespace gets an IPv6 /128 loopback in
    # the same IS-IS (with its own prefix SID), the core legs carry IPv6 link-local only, and the IPv6 VPN routes
    # use that loopback as next hop (FRR installs no labelled IPv6 route over an IPv4 next hop). The BGP sessions
    # stay on the IPv4 loopbacks. Empty = IPv4-only core: nothing IPv6 is rendered or applied. Take a range that
    # is never advertised outside the core (at least a /120; provider-edge index i gets address i).
    loopbackPool6: ""
    # SR index of a provider edge's IPv6 loopback = its IPv4 index + this offset; offset + highest index must stay
    # inside the SRGB
    sidOffset6: 1000
    # source of the ICMPv6 errors a VRF sends (Packet Too Big, Time Exceeded, Unreachable): a /128 per namespace
    # per node on every VRF device (network address + (node position << 16) + provider-edge index); never
    # announced. At least a /96, clear of loopbackPool6. Empty = none
    icmpSource6: ""
  nodes:
    trunkInterface: bond1
    sshUser: root
  openstack:
    # platform-owned project on OpenStack sites for the placements' networks and routers (shared to tenants)
    platformProject: hybrid-fabric
  openshift:
    # OpenShift sites: the FRRConfigurations (labels) whose BGP sessions to the site's gateway carry the placements'
    # routes; empty selects every FRRConfiguration of the site
    frrConfigurationSelector: {}
    # tenant sign-in on OpenShift sites: the site's OIDC client in the tenant realm (the cluster's OAuth uses it).
    # A CloudVirt's Rbac CRs become client roles <entity>.<rbac> of that client, mapped to the Rbac's Keycloak group;
    # the client puts the user's roles into the groups claim, and the VM namespaces bind edit/view to those groups.
    tenantSignIn:
      realm: sovereign-tenants
      clientId: "openshift-{cluster}"
      # name of the sign-in button on the site's login page (the site OAuth identity provider of the client
      # above); read from the site when it can be, else this; empty = the realm name
      idpName: ""
      editRole: edit
      viewRole: view
  # address management of the HybridNetworks (files/shc_ipam.py): where each network's space and its placements'
  # subnets are kept; ledger = the fabric's ledger (the only provider so far)
  ipam:
    provider: ledger
    # platform address pools (HybridNetwork spec.platformPrefixes): <pool>: {family, prefixes, reserved (never
    # given out), blockLengths (the block sizes offered), defaultBlock (when a network names no size), holdDownDays
    # (a released block is not given out again for this long; default below), perTenantBlocks (blocks per Entity;
    # absent = no limit), perTenantOverrides ({entity: blocks})}. None by default: a network asking for platform
    # address space is then refused (FamilyUnavailable). One pool per family per fabric (fabrics.<name>.ipam).
    publicPools: {}
    holdDownDays: 7
  # HybridNetwork address space: a tenant prefix (spec.prefixes) overlapping one of these ranges, in either
  # direction, is refused (PrefixReserved). Every ipam.publicPools prefix is added to the list automatically.
  # An installation lists the platform's own globally routed space and its translation prefixes here.
  network:
    exclusiveRanges: []
  placement:
    # how long a placement job waits for the gateways to hold the site's routes for its prefixes (s)
    routeWait: 180
    # address families a placement may ask for, per backend kind; per site (CloudInfrastructure name)
    # ipFamiliesBySite overrides it. A family is offered at a site only when the site's probe also reports it
    # (CloudInfrastructure status.capabilities); spec.ipv6 elsewhere fails FamilyUnavailable.
    ipFamilies: {CloudVirt: [4], CloudOSO: [4], CloudAWS: [4], CloudGCP: [4]}
    ipFamiliesBySite: {}
    # sites (CloudInfrastructure name: true) that offer placements without IPv4 (IPv6-only)
    ipv6OnlyBySite: {}
    # per site: the IPv6 subnet sources it offers (Network, Provider); default ipv6.sources of the backend kind
    ipv6SourcesBySite: {}
    ipv6:
      # IPv6 subnet sources the product supports per backend kind (spec.ipv6.source)
      sources: {CloudVirt: [Network], CloudOSO: [Network], CloudAWS: [Network, Provider], CloudGCP: [Provider]}
      # the source of a placement that names none, per backend kind (Network when the kind is not listed)
      defaultSource: {CloudAWS: Network, CloudGCP: Provider}
      # the IPv6 subnet size of a placement that names none, per backend kind
      defaultPrefixLength: {CloudAWS: 60}
      # backend kinds that cannot carry IPv6 prefixes the tenant provides (spec.prefixes)
      tenantPrefixes: {CloudGCP: false}
      # how workloads get their IPv6 addresses, per backend kind: on OpenStack sites the IPv6 subnets' RA and
      # address mode (fixed when the subnet is created; empty = the site's default); on OpenShift sites
      # informational (the cluster network hands out addresses by stateful DHCPv6); shown in the placement's status
      addressMode: {CloudOSO: dhcpv6-stateful, CloudVirt: dhcpv6-stateful}
    # per site (CloudInfrastructure name): resolver addresses of either family handed to the site's placement
    # subnets (OpenStack dns_nameservers, each subnet taking the addresses of its own family); a site not listed
    # leaves the subnets on the site's default
    resolversBySite: {}
    # ranges of a site the allocator steps around, per backend kind, besides the site underlay and (OpenShift) the
    # cluster's cluster and service networks: OVN-Kubernetes' join (100.64.0.0/16), Layer2 user-defined network
    # join (100.65.0.0/16), transit switch (100.88.0.0/16) and masquerade (169.254.0.0/17) subnets and their IPv6
    # counterparts; on AWS the ranges Amazon keeps for itself in a VPC's IPv6 space
    siteReserved:
      CloudVirt: [100.64.0.0/16, 100.65.0.0/16, 100.88.0.0/16, 169.254.0.0/17, fd69::/112, fd97::/64, fd98::/64,
                  fd99::/64]
      CloudOSO: []
      CloudAWS: [fd00::/16, 2001:db8::/32]
      CloudGCP: []
  # translation for placements without IPv4, per site (CloudInfrastructure name): {pref64, dns64Resolvers}; a site
  # not listed offers none (capabilities.ipv6Translation false)
  translation: {}
  # platform canaries: workloads the platform team runs on an Entity of its own, read by the platform's jobs to tell
  # whether a service works end to end for a tenant. Generic: no canary runs by default.
  canaries:
    # the translation canary (samples/platform/ipv6-canary): one probe VM on every site that offers IPv6-only
    # placements with translation. Every minute it checks its address, the resolvers, the translation prefix, an
    # IPv4-only name and an IPv4 literal through its CLAT, a native IPv6 name, the path MTU and that a denied IPv4
    # destination stays refused, and serves the results in Prometheus text format at http://[<address>]:<port>/metrics.
    # The site job finds the probe's address (status.realization.ipv6Canary of the CloudInfrastructure), the fabric
    # job reads the metrics from the site's gateway (status.realization.translation.canaries of the HybridFabric,
    # condition IPv6Translation, Warning event IPv6TranslationCanaryFailed).
    ipv6Translation:
      # "<namespace>/<name>" of the platform team's IPv6-only HybridNetwork (platformPrefixes family 6, mode Platform,
      # egress.internet true) that carries the probes; "" = no canary (no status, no condition, no event)
      network: ""
      # the name of the probe VM (CloudVirt: the VirtualMachineInstance) or server (CloudOSO) on every placement of
      # that network
      workload: ""
      # the TCP port the probe serves its metrics on
      port: 9464
      # how long a site's canary may fail, be stale or be unreachable before the fabric reports it as an event (and
      # every run while it lasts)
      alertMinutes: 5
  # CloudGateways over transport wireguard (remote sites): each node's tunnel listens on listenPort (unless the
  # gateway sets one); the tunnel's MTU is the site leg's MTU unless siteUnderlay.mtu says otherwise (1420 = a 1500
  # path minus WireGuard over IPv4); keepalives keep NAT state open
  wireguard:
    listenPort: 51820
    mtu: 1420
    persistentKeepalive: 25
  # attachment circuits (AttachmentCircuit on a ProviderEdge of platform frr): each circuit gets a VLAN from vlanPool
  # on its bearer and the next /linkPrefixLength of linkPool (node i takes host address i+1, the CE the next one);
  # the network's root VRF on every node peers with the CE over that VLAN. providerEdges.<edge>.bearers.<bearer>
  # names the node interface carrying the bearer's VLANs and its MTU.
  attachments:
    enabled: false
    vlanPool: {start: 3000, end: 3099}
    linkPool: 10.255.128.0/20
    linkPrefixLength: 29
    # central Vault KV path (mount central) for each circuit's BGP password
    secretPath: "fabric/circuits/{entity}/{name}"
    # minutes before a session closed for too many prefixes (maxPrefixes action teardown) is tried again; 0 = it
    # stays down until the circuit changes
    maxPrefixRestart: 2
    providerEdges: {}
    # AS numbers the platform keeps for its own sessions; a circuit's CE may not use one (PeerAsnReserved)
    reservedAsns: []
  # provider internet egress for HybridNetworks with spec.egress.internet: each node's root holds a VRF that hands
  # traffic to a network with internet access (a macvlan on parentInterface, default route via gateway); per network
  # a VRF e<vpnTarget> imports the network's routes, exports a default route into its VPN and source-NATs its traffic
  # to one address per node (natPool + the network's egress index from the ledger). Destinations in
  # denyDestinations (unless in allowDestinations) aren't reachable this way; nothing reaches a network unsolicited.
  egress:
    enabled: false
    vrf: {name: egress, table: 9000}
    # Linux table of a network's VRF = networkTableBase + vpnTarget
    networkTableBase: 100000
    # veth /31s between a network's VRF and the egress VRF, by egress index
    linkPool: 169.254.0.0/16
    parentInterface: ""       # an existing interface on every node (e.g. a VLAN device of the trunk)
    gateway: ""               # the next hop on that network
    prefixLength: 24
    mtu: 9000
    # per node (borderGateway.nodes[].name): {address, natPool}; natPool inside address/prefixLength
    nodes: {}
    denyDestinations: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12,
                       192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3]
    allowDestinations: []
    # IPv6 internet egress (routed, platform-assigned space only); off: the networks' IPv6 egress reads NotOffered.
    # On: the egress VRF of every node speaks eBGP (asn) with the upstream routers on the hand-off network, sends them
    # the placement prefixes of the networks with internet egress (IPv6 from the platform) and takes their default
    # route; per network the root VRF e<vpnTarget> gains an IPv6 session over its veth (the default route reaches the
    # network's VPN only while an upstream sends it) and the nftables table inet shc_egress6 admits outbound traffic
    # only from the network's platform block and inbound only replies and ICMPv6 errors. Needs the dual-stack core
    # (core.loopbackPool6).
    ipv6:
      enabled: false
      # the platform's globally routed IPv6 space (the platform address pools lie inside it): only prefixes inside
      # it, longer than it and at most /64, are announced upstream; the whole of it is discarded at the egress VRF
      # and in every network VRF, so unallocated space never loops; a source inside it arriving from upstream is
      # dropped. The gateways announce it (and each network's own IPv6 prefixes) into the sites, backed by an
      # unreachable route, so space the fabric does not route fails fast at the gateway
      routedPrefixes: []
      # the egress VRF's own AS toward the upstream routers (not domainAsn, not an upstream's)
      asn: 0
      # the upstream routers on the hand-off network: [{address, asn}]; one single-hop eBGP session each per node,
      # timers 10/30, no BFD, no password; in: the default route only; out: the placement prefixes
      upstream: []
      # per node (borderGateway.nodes[].name): {address: <address/length on the hand-off network>}
      nodes: {}
      # the smallest MTU on the way to the internet: IPv6 MTU of the hand-off device (the node itself sends Packet
      # Too Big) and the TCP MSS clamp (wanMtu - 60) on the networks' veths
      wanMtu: 1420
      # prefixes accepted from each upstream (the default plus the external site prefixes) and from each network
      maxPrefixesUpstream: 10
      maxPrefixesNetwork: 1000
      # each network's IPv6 internet traffic leaves and returns through one primary node (the filter is stateful):
      # the node at position (egress index mod number of nodes). The standby node marks its IPv6 default route with
      # <domainAsn>:<standbyCommunity> (the gateways announce it to the sites with standbyLocalPref) and prepends
      # its own AS standbyPrepend times toward the upstream
      standbyCommunity: 998
      standbyLocalPref: 50
      standbyPrepend: 2
      # a node whose upstream sessions are all down for this long is reported as an event on the HybridFabric; the
      # networks read Degraded for IPv6 egress meanwhile
      sessionDownAlertMinutes: 5
      # destinations never reachable through the IPv6 egress unless listed in allowDestinations6 (the IANA
      # special-purpose ranges); an installation adds its own address space here
      denyDestinations6: ["::/128", "::1/128", "::ffff:0:0/96", "64:ff9b::/96", "64:ff9b:1::/48", "100::/64",
                          "2001::/23", "2001:db8::/32", "2002::/16", "3fff::/20", "5f00::/16", "fc00::/7",
                          "fe80::/10", "ff00::/8"]
      allowDestinations6: []
      # resolver addresses reachable on port 53 only (TCP and UDP), also when inside denyDestinations6
      resolverDestinations6: []
      # (the IPv4 destinations of egress.denyDestinations stay unreachable through a translator: for every
      # translation prefix (translation.<site>.pref64) their embedded forms are denied before the allow list)
      # per network ("<namespace>/<name>": [prefixes]): sources inside routedPrefixes that legitimately arrive from
      # upstream (a site reached through the upstream rather than the fabric); filled by the platform's automation
      externalSitePrefixes: {}
