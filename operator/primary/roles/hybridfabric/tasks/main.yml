---
- block:
    - name: Set HybridFabric CR facts
      ansible.builtin.set_fact:
        hybridfabric_spec: "{{ _hybridsovereign_redhat_hybridfabric.spec | default({}) }}"
        hybridfabric_generation: "{{ _hybridsovereign_redhat_hybridfabric.metadata.generation | default(0) | int }}"
        hybridfabric_observed_generation: "{{ _hybridsovereign_redhat_hybridfabric.status.observedGeneration | default(0) | int }}"
        hybridfabric_status: "{{ _hybridsovereign_redhat_hybridfabric.status.status | default('') }}"
        hybridfabric_ready: "{{ _hybridsovereign_redhat_hybridfabric.status.ready | default(false) | bool }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_hybridfabric }}"

    # the translation canary's last read (defaults/main.yml): due for a re-read, or stale
    - name: Age of the translation canary's last read
      vars:
        _st: "{{ _hybridsovereign_redhat_hybridfabric.status | default({}, true) }}"
        _tr: >-
          {{ (((_st.realization | default({}, true)).translation | default({}, true))) }}
        _alert: "{{ _tr.alertMinutes | default(5, true) | int }}"
        _reread: "{{ [_alert | int * 60, hybridfabric_canary_reread_min_seconds | default(900) | int] | max }}"
        # the last fabric job's end: its completion (status.delivery.completedAt), or the read when that is later;
        # none without a read (a status from before readAt existed is read again at once)
        _read19: "{{ (_tr.readAt | default('', true) | string)[:19] }}"
        _ended: >-
          {{ ([_read19, ((_st.delivery | default({}, true)).completedAt | default('', true) | string)[:19]] | max)
             if _read19 | length == 19 else '' }}
      ansible.builtin.set_fact:
        hybridfabric_canary_sites: >-
          {{ (_tr.canaries | default({}, true)) | dict2items | selectattr('value', 'mapping') | map(attribute='key') | sort | list }}
        hybridfabric_canary_read_at: "{{ _tr.readAt | default('', true) | string }}"
        hybridfabric_canary_age: >-
          {{ ((now(utc=True) - ((_tr.readAt | string)[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() | int)
             if (_tr.readAt | default('', true) | string | length >= 19) else 999999999 }}
        # seconds since the last fabric job ended: the re-read waits for the interval after it, so runs never chain
        hybridfabric_canary_idle: >-
          {{ ((now(utc=True) - (_ended | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() | int)
             if (_ended | length == 19) else 999999999 }}
        hybridfabric_canary_reread_seconds: "{{ _reread }}"
        # three re-read intervals (the job writes the same, 3 x max(alertMinutes, the minimum interval)); never less
        # here, so a healthy fabric's reading never reads stale between two re-reads
        hybridfabric_canary_stale_minutes: >-
          {{ [_tr.staleAfterMinutes | default(_alert | int * 3, true) | int, (_reread | int * 3 + 59) // 60] | max }}

    - name: Decide whether the canary is due or stale
      vars:
        _st: "{{ _hybridsovereign_redhat_hybridfabric.status | default({}, true) }}"
        _canaries: "{{ ((_st.realization | default({}, true)).translation | default({}, true)).canaries | default({}, true) }}"
        _cond: "{{ (_st.conditions | default([], true) | selectattr('type', 'equalto', 'IPv6Translation') | list + [{}]) | first }}"
      ansible.builtin.set_fact:
        hybridfabric_canary_due: >-
          {{ hybridfabric_canary_sites | length > 0
             and hybridfabric_canary_idle | int >= hybridfabric_canary_reread_seconds | int }}
        hybridfabric_canary_stale: >-
          {{ hybridfabric_canary_sites | length > 0
             and hybridfabric_canary_age | int >= hybridfabric_canary_stale_minutes | int * 60 }}
        # already marked: no site reads healthy or fresh and the condition says so
        hybridfabric_canary_marked: >-
          {%- set fresh = [] -%}
          {%- for site in hybridfabric_canary_sites -%}
            {%- set r = _canaries[site] -%}
            {%- if (r.healthy | default(false) | bool) or not (r.stale | default(false) | bool) -%}
              {%- set _ = fresh.append(site) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ _cond.reason | default('') in ['CanaryStale', 'CanaryFailed'] and fresh | length == 0 }}

    # a reading older than staleAfterMinutes is marked stale at once, whatever the fabric job does next: the status
    # never reports an old read as healthy (the job's next read replaces the mark)
    - name: Mark an old translation canary reading stale
      vars:
        _st: "{{ _hybridsovereign_redhat_hybridfabric.status | default({}, true) }}"
        _canaries: "{{ ((_st.realization | default({}, true)).translation | default({}, true)).canaries | default({}, true) }}"
        _why: >-
          not read since {{ hybridfabric_canary_read_at or 'the canary was configured' }}
          ({{ (hybridfabric_canary_age | int // 60) if hybridfabric_canary_read_at | length > 0 else '?' }} min, longer than
          {{ hybridfabric_canary_stale_minutes }} min): the reading is stale
        _now: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          realization:
            translation:
              canaries: >-
                {%- set out = {} -%}
                {%- for site in hybridfabric_canary_sites -%}
                  {%- set r = _canaries[site] -%}
                  {%- set _ = out.update({site: {'stale': true, 'healthy': false, 'error': _why | trim,
                                                 'failedSince': r.failedSince | default('', true)
                                                                or hybridfabric_canary_read_at or _now}}) -%}
                {%- endfor -%}
                {{ out }}
          conditions:
            - type: IPv6Translation
              status: Unknown
              lastTransitionTime: "{{ _now }}"
              reason: CanaryStale
              message: "translation canary {{ _why | trim }}"
      # a failed mark must not fail the fabric (the re-run below reads the canary again)
      failed_when: false
      when:
        - hybridfabric_canary_stale | bool
        - not (hybridfabric_canary_marked | bool)

    - name: Set event action and reason
      ansible.builtin.set_fact:
        hybridfabric_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        hybridfabric_event_reason: "{{ 'HybridFabricReconcileRequested' if reconcile_now | bool else 'HybridFabricCreateRequested' }}"
        # a Ready, processed fabric runs again only on a Retry-now request or when its canary is due for a re-read
        hybridfabric_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (hybridfabric_observed_generation >= hybridfabric_generation)
            and (hybridfabric_status == 'ready')
            and (hybridfabric_ready | bool)
            and not (hybridfabric_canary_due | bool)
          }}

    - name: Skip when already processed
      ansible.builtin.meta: end_host
      when: hybridfabric_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    # A wake from another job (the legacy request "true" that nudge_cr writes) waits for the fabric job in flight
    # instead of superseding it: a fabric job takes minutes, the circuits, placements and networks wake the fabric
    # every few minutes while it has not realized them, and a superseded job writes no status, so superseding
    # starved the fabric's status (V10 gate). The request stays on the object (it is removed only when published),
    # the job in flight publishes it when it ends (hybridfabric_provision, "Run the wakes that came during this
    # job"), else the next reconcile does. Retry now (a timestamp) still supersedes.
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: HybridFabric
        in_flight_force: "{{ reconcile_now | bool and not (reconcile_request_legacy | bool) }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        hybridfabric_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # The acknowledgement carries the phase (Creating for a new HybridFabric, Updating for a change), so no status
    # write is without a phase (_common/tasks/ack_phase.yml).
    - name: Decide the phase of the acknowledgement
      ansible.builtin.include_role:
        name: _common
        tasks_from: ack_phase
      vars:
        ack_phase_cr: "{{ _hybridsovereign_redhat_hybridfabric }}"
      when: not (reconcile_keeps_ready | default(false) | bool)

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark HybridFabric as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          phase: "{{ ack_phase.phase }}"
          phaseSince: "{{ ack_phase.phaseSince }}"
          summary: "{{ ack_phase.summary }}"
          lastReconciledAt: "{{ hybridfabric_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ hybridfabric_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark HybridFabric as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ hybridfabric_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ hybridfabric_event_reason }}"
        operator_event_action: "{{ hybridfabric_event_action }}"
        operator_event_note: "{{ hybridfabric_spec | to_json }}"
        operator_reporting_controller: hybridfabric-operator
        operator_event_phase_recorded: >-
          {{ '' if (reconcile_keeps_ready | default(false) | bool) else (ack_phase | default({})).phase | default('') }}
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: HybridFabric
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_hybridfabric.metadata.uid }}"

  rescue:
    - name: Mark HybridFabric as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "HybridFabric {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
