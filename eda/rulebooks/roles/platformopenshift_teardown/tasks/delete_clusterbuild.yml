---
# shc (§11.6 phase C): Hive deprovision with its failures surfaced. The chart's pre-delete hook
# deletes the ClusterDeployment and waits for Hive's uninstall; a ClusterDeployment still present
# afterwards fails the job (status.deletion step deprovision) and the operator retries with backoff.
- name: Write central cluster kubeconfig for Helm
  ansible.builtin.include_tasks: "{{ role_path }}/../platformopenshift_provision/tasks/write_central_helm_kubeconfig.yml"
  vars:
    cb_app_name: "{{ platformopenshift_cr_name }}"

- name: Check for the mce-cluster-build release
  ansible.builtin.command:
    argv: [helm, status, "{{ platformopenshift_cr_name }}", --namespace, "{{ platformopenshift_cr_name }}",
           --kubeconfig, "/tmp/{{ platformopenshift_cr_name }}-kubeconfig"]
  register: helm_status
  failed_when: false
  changed_when: false

- name: Uninstall the release (its pre-delete hook runs the Hive deprovision)
  ansible.builtin.command:
    argv: [helm, uninstall, "{{ platformopenshift_cr_name }}", --namespace, "{{ platformopenshift_cr_name }}",
           --wait, --timeout, "{{ clusterbuild_uninstall_timeout }}",
           --kubeconfig, "/tmp/{{ platformopenshift_cr_name }}-kubeconfig"]
  register: helm_uninstall
  when: helm_status.rc == 0
  failed_when: helm_uninstall.rc != 0 and 'not found' not in (helm_uninstall.stderr | default(''))

- name: Look for a ClusterDeployment left behind
  kubernetes.core.k8s_info:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    name: "{{ platformopenshift_cr_name }}"
    namespace: "{{ platformopenshift_cr_name }}"
  register: cd_left

- name: Delete a ClusterDeployment without a release (Hive deprovisions it)
  kubernetes.core.k8s:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    name: "{{ platformopenshift_cr_name }}"
    namespace: "{{ platformopenshift_cr_name }}"
    wait: true
    wait_timeout: 3600
  when: cd_left.resources | length > 0
  register: cd_delete
  failed_when: false

- name: Check the ClusterDeployment is gone
  kubernetes.core.k8s_info:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    name: "{{ platformopenshift_cr_name }}"
    namespace: "{{ platformopenshift_cr_name }}"
  register: cd_final

- name: Fail when Hive did not deprovision the cluster
  ansible.builtin.fail:
    msg: >-
      ClusterDeployment {{ platformopenshift_cr_name }} is still present after the deprovision
      (provisionStatus {{ cd_final.resources[0].status.provisionStatus | default('unknown') }});
      check the uninstall job in namespace {{ platformopenshift_cr_name }} on central.
  when: cd_final.resources | length > 0
