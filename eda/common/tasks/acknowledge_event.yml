---
# First thing in every job playbook (pre_tasks).
# 1. Reads the object the event is about (event_payload.regarding) from the services cluster. The job ends,
#    successfully and without a write, when the object does not exist or its uid is not the event's uid
#    (deleted and re-created, or an event that names an object it was not published for). The live object
#    and its spec are the job's input: facts shc_live_cr and shc_live_spec. The event's note is not read.
# 2. For an event with an eventId it writes Reconciling=True/JobRunning ("Applying the change.") through
#    patch_cr_status, which records status.delivery.acknowledgedEventId/jobId/jobStartedAt (an existing
#    Ready=True stays as it is) - or ends the job, successfully, when a newer request superseded this event.
- name: Read and acknowledge the event's object
  when:
    - event_payload is defined
    - event_payload is mapping
    - event_payload.regarding is defined
    - event_payload.regarding is mapping
  block:
    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: resolve_services_cluster_connection.yml

    - name: Set the event's object reference
      ansible.builtin.set_fact:
        _ack_ref:
          api_version: "{{ event_payload.regarding.apiVersion }}"
          # CRD plurals in this group: kind lowercased + s, a consonant + y -> ies (Entity -> entities, CloudGateway -> cloudgateways)
          plural: "{{ event_payload.regarding.kind | lower | regex_replace('(?<=[^aeiou])y$', 'ie') }}s"
          name: "{{ event_payload.regarding.name }}"
          namespace: "{{ event_payload.regarding.namespace }}"
          uid: "{{ event_payload.regarding.uid | default('', true) }}"

    - name: Read the event's object
      hybridsovereign.shc.cr_status:
        host: "{{ services_api_host | trim }}"
        api_key: "{{ services_bearer_token | trim }}"
        validate_certs: "{{ services_validate_certs | default(true) | bool }}"
        api_version: "{{ _ack_ref.api_version }}"
        plural: "{{ _ack_ref.plural }}"
        name: "{{ _ack_ref.name }}"
        namespace: "{{ _ack_ref.namespace }}"
        read_only: true
      register: _ack_live
      check_mode: false

    - name: Report why the job ends without work
      ansible.builtin.debug:
        msg: >-
          {{ event_payload.regarding.kind }} {{ _ack_ref.namespace }}/{{ _ack_ref.name }}:
          {{ 'the object does not exist' if _ack_live.resource is none
             else 'the object uid ' ~ _ack_live.resource.metadata.uid ~ ' is not the event uid ' ~ _ack_ref.uid }};
          nothing to do
      when: >-
        _ack_live.resource is none
        or ((_ack_ref.uid | length > 0) and (_ack_live.resource.metadata.uid | default('') != _ack_ref.uid))

    - name: End the job when the object is gone or is another object
      ansible.builtin.meta: end_play
      when: >-
        _ack_live.resource is none
        or ((_ack_ref.uid | length > 0) and (_ack_live.resource.metadata.uid | default('') != _ack_ref.uid))

    - name: Use the live object as the job's input
      ansible.builtin.set_fact:
        shc_live_cr: "{{ _ack_live.resource }}"
        shc_live_spec: "{{ _ack_live.resource.spec | default({}, true) }}"

    - name: Mark the job started (or end it when superseded)
      ansible.builtin.include_tasks: patch_cr_status.yml
      when: (event_payload.eventId | default('')) | length > 0
      vars:
        cr_api_version: "{{ _ack_ref.api_version }}"
        cr_plural: "{{ _ack_ref.plural }}"
        cr_name: "{{ _ack_ref.name }}"
        cr_namespace: "{{ _ack_ref.namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: reconciling
          ready: false
          reason: JobRunning
          message: Applying the change.
