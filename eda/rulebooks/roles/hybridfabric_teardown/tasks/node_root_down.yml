---
# shc (design/P7-PLAN.md P7.3.4): remove the border gateway root instance from one node (delegated, become).
# The fabric's delete waited for its gateways and networks, so nothing else uses the core here. Runs under the lease
# fabric-config-<fabric>, renewed here before the node (realization nodes.configLease); a renewal that finds the lease
# lost fails the job before the node.
- name: "{{ bgw_node.name }}: renew the border gateway configuration lease"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
  vars:
    fab_ledger: {action: lease-renew, namespace: "{{ fab_namespace }}", fabric: "{{ fab_name }}", holder: "{{ hft_holder }}",
                 step: "removing the root instance from {{ bgw_node.name }}"}
  timeout: 0

- name: "{{ bgw_node.name }}: stop FRR and keep it off at boot"
  ansible.builtin.systemd:
    name: frr
    state: stopped
    enabled: false
  delegate_to: "{{ bgw_node.name }}"

# every daemon the fabric turns on (bfdd: BFD on attachment circuits)
- name: "{{ bgw_node.name }}: FRR daemons off"
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^{{ item }}="
    line: "{{ item }}=no"
  loop: [bgpd, isisd, bfdd]
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: FRR configuration without the fabric"
  ansible.builtin.copy:
    dest: /etc/frr/frr.conf
    content: "! The platform's fabric instance was removed from this node.\nhostname {{ bgw_node.name }}\n"
    owner: frr
    group: frr
    mode: "0640"
  delegate_to: "{{ bgw_node.name }}"

# the SRv6 core guard units (installed only on the SRv6 core; the fabric's delete waited for its gateways, so only the
# root's timer can be left): stopped and removed
- name: "{{ bgw_node.name }}: remove the SRv6 core guard units"
  ansible.builtin.shell: |
    [ -e /etc/systemd/system/shc-core-guard@.timer ] || exit 0
    for u in $(systemctl list-units --all --plain --no-legend 'shc-core-guard@*.timer' | awk '{print $1}') shc-core-guard@root.timer; do
      systemctl disable --now "$u" 2>/dev/null || true
    done
    rm -f /etc/systemd/system/shc-core-guard@.timer /etc/systemd/system/shc-core-guard@.service
    systemctl daemon-reload
    echo removed
  register: _hft_guard
  changed_when: "'removed' in _hft_guard.stdout"
  delegate_to: "{{ bgw_node.name }}"

# the IPv6 egress guard (installed with IPv6 egress; the root's alone): its timer stopped and disabled, its files and
# its marker removed, as the fabric job does when IPv6 egress goes
- name: "{{ bgw_node.name }}: remove the IPv6 egress guard"
  ansible.builtin.shell: |
    changed=no
    if systemctl -q is-enabled shc-egress6-guard.timer 2>/dev/null || systemctl -q is-active shc-egress6-guard.timer 2>/dev/null; then
      systemctl disable --now shc-egress6-guard.timer; changed=yes
    fi
    for f in /etc/systemd/system/shc-egress6-guard.timer /etc/systemd/system/shc-egress6-guard.service /usr/local/sbin/shc-egress6-guard /run/shc-egress6-guard.shut; do
      [ -e "$f" ] && { rm -f "$f"; changed=yes; }
    done
    [ "$changed" = no ] || systemctl daemon-reload
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: _hft_egress6_guard
  changed_when: "'changed=yes' in _hft_egress6_guard.stdout"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: is the root instance installed"
  ansible.builtin.stat:
    path: /etc/shc-fabric/root.json
  register: _hft_rootconf
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: remove the root instance (core bridge, loopback)"
  ansible.builtin.command: /usr/local/sbin/shc-fabric-apply root down
  register: _hft_down
  changed_when: "'changed=yes' in _hft_down.stdout"
  when: _hft_rootconf.stat.exists
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: no root instance at boot"
  ansible.builtin.systemd:
    name: shc-fabric-apply@root.service
    enabled: false
  register: _hft_unit_off
  # a module the node ended at its limit (no result) is a failure; anything else is left to the steps after it
  failed_when: _hft_unit_off.module_stdout is defined
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: remove the root instance config"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/shc-fabric/root.json, /etc/shc-fabric/root.frr-loaded, /etc/shc-fabric/root.frr-unapplied,
         /etc/shc-fabric/root.frr-unapplied.before, /etc/shc-fabric/root.frr-unapplied.new,
         /etc/modules-load.d/shc-fabric.conf]
  delegate_to: "{{ bgw_node.name }}"

# with no instance left on the node: the root unit stopped, the apply script and the unit templates removed
- name: "{{ bgw_node.name }}: the fabric's programs and units"
  ansible.builtin.include_tasks: node_programs_down.yml
