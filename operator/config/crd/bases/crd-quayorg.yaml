apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quayorgs.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "5"
    {{- include "plugin-quay.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: hybridsovereign.redhat
  names:
    kind: QuayOrg
    listKind: QuayOrgList
    plural: quayorgs
    singular: quayorg
    shortNames:
      - qorg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Quay Config
          type: string
          jsonPath: .spec.quayConfig
        - name: Org Name
          type: string
          jsonPath: .status.orgName
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            A Quay organization: the tenant's organization in the platform's Red Hat Quay registry,
            comparable to an Amazon ECR registry, an Artifact Registry repository or an Azure
            Container Registry. Members of the tenant's access groups sign in with their platform
            identity.
          type: object
          properties:
            spec:
              description: The organization and who gets which access.
              type: object
              properties:
                quayConfig:
                  type: string
                  description: >-
                    Optional. The registry connection (a QuayConfig in the platform's
                    integration namespace) this organization is created through. When omitted
                    the platform uses its default connection; the one used is reported in
                    status.config.
                quayAdminRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members are admins of the
                    organization.
                quayCreatorRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can create
                    repositories.
                quayMemberRbac:
                  type: array
                  items:
                    type: string
                  description: >-
                    Access groups (Rbac names in this namespace) whose members can read and push to
                    the organization's repositories.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
                orgName:
                  type: string
                  description: Quay organization name.
                quayUrl:
                  type: string
                  description: External Quay URL.
                orgUrl:
                  type: string
                  description: Direct URL to the Quay organization.
                loginUrl:
                  type: string
                  description: OIDC login URL for this Quay org.
                adminGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to organization admin.
                creatorGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to creator.
                memberGroups:
                  type: array
                  items:
                    type: string
                  description: Sign-in groups mapped to member.
                teams:
                  type: string
                  description: JSON summary of team mappings.
                entity:
                  type: string
                  description: The tenant this organization belongs to.
                message:
                  type: string
                  description: Human-readable status message.
              x-kubernetes-preserve-unknown-fields: true
