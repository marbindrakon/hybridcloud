---
# The access groups' names <tenant>.<group> from the names function (group(): matched by name at every sign-in, in
# the identity service, Keystone and the site clusters, so never cut). A name that does not fit refuses that access
# group alone, with the function's sentence; the others are named and granted. Input: gn_tenant, gn_groups (the
# Rbac names). Sets gn_names ({rbac: group name}, refused ones left out) and gn_refused ({rbac: sentence}).
- name: Start the group names
  ansible.builtin.set_fact:
    gn_names: {}
    gn_refused: {}

- name: Name each access group
  ansible.builtin.include_tasks: "{{ role_path }}/../cloudoso_provision/tasks/group_name_one.yml"
  loop: "{{ gn_groups | unique | list }}"
  loop_control:
    loop_var: gn_group
