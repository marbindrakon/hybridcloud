# Public issuer base: every platform cluster gets issuer <baseURL>/<cluster>.
host: oidc.shc.signal9.gg
baseURL: https://oidc.shc.signal9.gg
namespace: shc-oidc

server:
  replicas: 2
  image: registry.access.redhat.com/ubi9/nginx-124:latest

# Route TLS: certificate issued by cert-manager and referenced via spec.tls.externalCertificate, so the
# edge reverse proxies can verify central's ingress for this host (D18).
tls:
  clusterIssuer: letsencrypt-shc
  secretName: oidc-issuer-tls

# Publisher: copies each cluster's discovery document and JWKS into the served store, rewriting
# issuer/jwks_uri to the public base. Sources:
#   local  this cluster, through its own API
#   acm    ACM ManagedCluster <name>: a ManagedServiceAccount token (issuer discovery is open to every
#          service account) through the cluster-proxy addon, so neither the spoke's API address nor its
#          serving CA matter
# A cluster that fails keeps its last published documents; the job still fails so it shows up.
sync:
  schedule: "*/15 * * * *"
  image: registry.redhat.io/openshift4/ose-tools-rhel9:latest  # has oc + jq (ose-cli lacks jq)
  # Issuers published under baseURL/<name>: source local (this cluster's API), acm (a ManagedCluster through
  # cluster-proxy) or url (an HTTPS OIDC discovery endpoint in this cluster, verified with the service CA; keysPath
  # defaults to /keys), e.g. {name: spire, source: url, url: https://spire-spiffe-oidc-discovery-provider.<ns>.svc}
  clusters:
    - name: central
      source: local
  # Static issuers, published next to the clusters above: ConfigMaps in this namespace labelled <label>=true, the
  # issuer name in label <nameLabel>, the key set (public keys) in data keys.json; the discovery document is generated.
  # For issuers whose signing key exists before the cluster does (AWS STS clusters); deleting the ConfigMap unpublishes.
  static:
    label: shc.signal9.gg/oidc-static
    nameLabel: shc.signal9.gg/oidc-name
  acm:
    managedServiceAccount: shc-oidc-sync
    # cluster-proxy addon user server; its serving certificate comes from the service CA
    proxyURL: https://cluster-proxy-addon-user.multicluster-engine.svc:9092
