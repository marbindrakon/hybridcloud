# An access group (Rbac). Members sign in with the group example-corp.example-admins; the platform team
# adds people to example-corp/example-admins in the sign-in directory. spec.config names the platform's
# identity provider connection: ask the platform team for its name.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Rbac
metadata:
  name: example-admins
  namespace: entity-example-corp
spec:
  config: example-identity
  description: Tenant admins of Example Corp.
