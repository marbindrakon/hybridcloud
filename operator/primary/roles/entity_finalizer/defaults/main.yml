---
# shc (LAB-PLAN §11.6, design/TENANT-TEARDOWN.md §3.1): the entity namespace's CRs are deleted tier by
# tier; each tier must be gone (its finalizers done) before the next starts, and the namespace operator
# that runs those finalizers stays until all are gone.
entity_teardown_tiers:
  - [Assignment, NetworkPlacement, HybridNetwork, OpenStackMigration]
  - [PlatformOpenshift]
  - [CloudOSO, CloudAWS]
  - [Team, Persona, Project, AAPOrg, QuayOrg, VaultKV]
  - [Rbac, Vault]
