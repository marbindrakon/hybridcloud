{{- /*
Fabric health metrics and alerts (ops.fabricHealth, off by default; on the cluster that holds the HybridFabric and
CloudGateway objects). A kube-state-metrics instance of its own in ops.namespace turns those objects' status into
metrics (custom resource state only: their conditions, the health check's time and interval, the IPv6 egress per
node, the platform address pools), platform monitoring scrapes it, and the rules below alert on it. The status is
written by the platform's fabric jobs and its periodic fabric health check.
*/}}
{{- if and (or .Values.layers.base .Values.layers.ops) .Values.ops.enabled .Values.ops.fabricHealth.enabled }}
{{- $o := .Values.ops }}
{{- $f := $o.fabricHealth }}
{{- $ns := $o.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shc-fabric-metrics
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shc-ops-fabric-metrics
rules:
  - apiGroups: [hybridsovereign.redhat]
    resources: [hybridfabrics, cloudgateways]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shc-ops-fabric-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shc-ops-fabric-metrics
subjects:
  - kind: ServiceAccount
    name: shc-fabric-metrics
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shc-fabric-metrics
  namespace: {{ $ns }}
data:
  config.yaml: |
{{ include "shc-cluster-base.fabricMetricsConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shc-fabric-metrics
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: shc-fabric-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shc-fabric-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shc-fabric-metrics
      annotations:
        checksum/config: {{ include "shc-cluster-base.fabricMetricsConfig" . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: shc-fabric-metrics
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: {{ $f.image | quote }}
          args:
            - --custom-resource-state-only
            - --custom-resource-state-config-file=/etc/shc-fabric-metrics/config.yaml
            - --port=8080
            - --telemetry-port=8081
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/shc-fabric-metrics}
      volumes:
        - name: config
          configMap: {name: shc-fabric-metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: shc-fabric-metrics
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: shc-fabric-metrics
spec:
  selector:
    app.kubernetes.io/name: shc-fabric-metrics
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-k8s-fabric-metrics
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-k8s-fabric-metrics
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-k8s-fabric-metrics
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: openshift-monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shc-fabric-metrics
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shc-fabric-metrics
  endpoints:
    - port: metrics
      interval: {{ $f.scrapeInterval | quote }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shc-fabric
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
{{ include "shc-cluster-base.fabricHealthRules" . | indent 4 }}
{{- end }}
