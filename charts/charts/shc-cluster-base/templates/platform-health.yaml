{{- /*
The platform's own health (ops.platformHealth; every switch off by default, each renders only its own part): alert
rules in the cluster's monitoring for volumes, database backups and aggregated APIs, and two checks where no metric exists: the event activations of the automation platform (eda-activations, which
also repairs, and eda-api-check) and a write to each listed Keycloak (identity-write-probe-<name>). A check's failed
run is its alert; its pod's termination message says what it found. And the report behind the admin dashboard's
banner (platform-health-report): this cluster's firing Shc alerts and the checks' findings, written as the key
report.json of the ConfigMap shc-platform-health-<cluster> on the services cluster. The services cluster's chart
makes one such ConfigMap per reporting cluster and the index shc-platform-health (key clusters.json) that lists them.
*/}}
{{- if and (or .Values.layers.base .Values.layers.ops) .Values.ops.enabled }}
{{- $o := .Values.ops }}
{{- $p := $o.platformHealth | default dict }}
{{- $ns := $o.namespace }}
{{- $restricted := dict "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- if include "shc-cluster-base.platformHealthEnabled" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shc-platform-health
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
{{ include "shc-cluster-base.platformHealthRules" . | indent 4 }}
{{- end }}

{{- with $p.edaActivations }}{{ if .enabled }}
{{- $e := . }}
{{- $an := required "ops.platformHealth.edaActivations.automationNamespace is required" .automationNamespace }}
{{- $url := required "ops.platformHealth.edaActivations.url is required" .url }}
{{- if not (kindIs "string" $url) }}{{ fail "ops.platformHealth.edaActivations.url must be an https URL" }}{{ end }}
{{- if or (not (hasPrefix "https://" $url)) (eq $url "https://") }}{{ fail (printf "ops.platformHealth.edaActivations.url must be an https URL, not %s" $url) }}{{ end }}
{{- $n := dict }}
{{- range $k, $min := dict "maxRepairsPerHour" 1 "maxRepairsPerDay" 1 "notRunningMinutes" 0 "transitionalMinutes" 0 "startTimeoutSeconds" 1 }}
{{- $_ := set $n $k (include "shc-cluster-base.wholeNumber" (list (printf "ops.platformHealth.edaActivations.%s" $k) (get $e $k) $min) | atoi) }}
{{- end }}
{{- $patterns := .cannotRunPatterns }}
{{- if not (kindIs "slice" $patterns) }}{{ fail "ops.platformHealth.edaActivations.cannotRunPatterns must be a list of texts" }}{{ end }}
{{- range $patterns }}{{ if not (kindIs "string" .) }}{{ fail "ops.platformHealth.edaActivations.cannotRunPatterns must be a list of texts" }}{{ end }}{{ end }}
{{- $removeStale := include "shc-cluster-base.switch" (list "ops.platformHealth.edaActivations.removeStaleJobs" .removeStaleJobs) | eq "true" }}
{{- $allowNone := include "shc-cluster-base.switch" (list "ops.platformHealth.edaActivations.allowNoActivations" .allowNoActivations) | eq "true" }}
{{- $deadline := 600 }}
{{- $cfg := dict "runDeadlineSeconds" $deadline "url" $url "automationNamespace" $an "stateNamespace" $ns "stateConfigMap" "eda-activations-state" "maxRepairsPerHour" $n.maxRepairsPerHour "maxRepairsPerDay" $n.maxRepairsPerDay "allowNoActivations" $allowNone "notRunningMinutes" $n.notRunningMinutes "transitionalMinutes" $n.transitionalMinutes "startTimeoutSeconds" $n.startTimeoutSeconds "cannotRunPatterns" $patterns "removeStaleJobs" $removeStale "credentialDir" "/etc/eda-credential" "caFile" (ternary "/etc/eda-ca/ca.crt" "" (not (empty .caConfigMap))) }}
{{- $secret := required "ops.platformHealth.edaActivations.credentialSecret is required" .credentialSecret }}
{{- $hash := printf "%s%s" ($.Files.Get "files/eda_activations.py") (toJson $cfg) | sha256sum | trunc 16 }}
---
# The activation check: reads the activations through the platform's API (the credential in Secret {{ $secret }}),
# keeps its repair count in the ConfigMap eda-activations-state, and lists the activation Jobs in {{ $an }}.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-activations
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eda-activations-state
  namespace: {{ $ns }}
rules:
  # create cannot be limited to a name; the check creates only eda-activations-state
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [eda-activations-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eda-activations-state
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eda-activations-state
subjects:
  - kind: ServiceAccount
    name: eda-activations
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shc-ops-eda-activations
  namespace: {{ $an }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: {{ ternary (list "list" "delete") (list "list") $removeStale | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-ops-eda-activations
  namespace: {{ $an }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shc-ops-eda-activations
subjects:
  - kind: ServiceAccount
    name: eda-activations
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-activations
  namespace: {{ $ns }}
data:
  eda_activations.py: |
    {{- $.Files.Get "files/eda_activations.py" | nindent 4 }}
  config.json: |
    {{- toPrettyJson $cfg | nindent 4 }}
{{- range $job := list (list "eda-activations" "check" .schedule $deadline) (list "eda-api-check" "api" .apiCheckSchedule 120) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ index $job 0 }}
  namespace: {{ $ns }}
spec:
  schedule: {{ index $job 2 | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ index $job 3 }}
      template:
        metadata:
          annotations:
            shc/config-hash: {{ $hash | quote }}
        spec:
          {{- if eq (index $job 1) "check" }}
          serviceAccountName: eda-activations
          {{- else }}
          automountServiceAccountToken: false
          {{- end }}
          restartPolicy: Never
          containers:
            - name: check
              image: {{ required "ops.platformHealth.edaActivations.image is required" $e.image }}
              command: [python3, /etc/eda-activations/eda_activations.py, --config, /etc/eda-activations/config.json,
                        --mode, {{ index $job 1 }}]
              terminationMessagePolicy: FallbackToLogsOnError
              resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 128Mi}}
              securityContext:
                {{- toYaml $restricted | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/eda-activations
                  readOnly: true
                - name: credential
                  mountPath: /etc/eda-credential
                  readOnly: true
                {{- if $e.caConfigMap }}
                - name: ca
                  mountPath: /etc/eda-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: eda-activations
            - name: credential
              secret:
                secretName: {{ $secret }}
            {{- if $e.caConfigMap }}
            - name: ca
              configMap:
                name: {{ $e.caConfigMap }}
            {{- end }}
{{- end }}
{{- end }}{{ end }}

{{- with $p.identityWriteProbe }}{{ if .enabled }}
{{- $w := . }}
{{- if not .keycloaks }}{{ fail "ops.platformHealth.identityWriteProbe.keycloaks needs at least one Keycloak when the probe is on" }}{{ end }}
{{- $configs := dict }}
{{- range $k := .keycloaks }}
{{- $name := required "ops.platformHealth.identityWriteProbe.keycloaks[].name is required" $k.name }}
{{- if or (gt (len $name) 31) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name)) }}{{ fail (printf "ops.platformHealth.identityWriteProbe.keycloaks[].name %q: lower-case letters, digits and '-', at most 31 characters" $name) }}{{ end }}
{{- $_ := set $configs $name (dict "url" (required (printf "ops.platformHealth.identityWriteProbe.keycloaks[%s].url is required" $name) $k.url) "realm" (required (printf "ops.platformHealth.identityWriteProbe.keycloaks[%s].realm is required" $name) $k.realm) "clientId" (required (printf "ops.platformHealth.identityWriteProbe.keycloaks[%s].clientId is required" $name) $k.clientId) "attribute" ($k.attribute | default "lastName") "credentialDir" "/etc/identity-credential" "caFile" (ternary "/etc/identity-ca/ca.crt" "" (not (empty $k.caConfigMap)))) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-write-probe
  namespace: {{ $ns }}
data:
  identity_write_probe.py: |
    {{- $.Files.Get "files/identity_write_probe.py" | nindent 4 }}
  {{- range $name, $c := $configs }}
  {{ $name }}.json: |
    {{- toPrettyJson $c | nindent 4 }}
  {{- end }}
{{- range $k := .keycloaks }}
---
# Write check of Keycloak {{ $k.name }}: a service account of a dedicated realm updates its own user; the client's
# secret is in Secret {{ $k.credentialSecret }}. No Kubernetes API access.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: identity-write-probe-{{ $k.name }}
  namespace: {{ $ns }}
spec:
  schedule: {{ $w.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          annotations:
            shc/config-hash: {{ printf "%s%s" ($.Files.Get "files/identity_write_probe.py") (toJson (get $configs $k.name)) | sha256sum | trunc 16 | quote }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: probe
              image: {{ required "ops.platformHealth.identityWriteProbe.image is required" $w.image }}
              command: [python3, /etc/identity-write-probe/identity_write_probe.py,
                        --config, /etc/identity-write-probe/{{ $k.name }}.json]
              terminationMessagePolicy: FallbackToLogsOnError
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
              securityContext:
                {{- toYaml $restricted | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/identity-write-probe
                  readOnly: true
                - name: credential
                  mountPath: /etc/identity-credential
                  readOnly: true
                {{- if $k.caConfigMap }}
                - name: ca
                  mountPath: /etc/identity-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: identity-write-probe
            - name: credential
              secret:
                secretName: {{ required (printf "ops.platformHealth.identityWriteProbe.keycloaks[%s].credentialSecret is required" $k.name) $k.credentialSecret }}
            {{- if $k.caConfigMap }}
            - name: ca
              configMap:
                name: {{ $k.caConfigMap }}
            {{- end }}
{{- end }}
{{- end }}{{ end }}

{{- with $p.report }}{{ if .enabled }}
{{- $r := . }}
{{- $R := "ops.platformHealth.report." }}
{{- $cluster := .cluster | default $.Values.cluster.name }}
{{- if not $cluster }}{{ fail (printf "%scluster is required (or cluster.name)" $R) }}{{ end }}
{{- if or (gt (len $cluster) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $cluster)) }}{{ fail (printf "%scluster %q: lower-case letters, digits and '-', at most 63 characters" $R $cluster) }}{{ end }}
{{- $interval := include "shc-cluster-base.wholeNumber" (list (printf "%sintervalMinutes" $R) .intervalMinutes 1) | atoi }}
{{- if not (has $interval (list 1 2 3 4 5 6 10 12 15 20 30)) }}{{ fail (printf "%sintervalMinutes must be one of 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30 (a divisor of an hour)" $R) }}{{ end }}
{{- $target := required (printf "%snamespace is required (the platform namespace of the services cluster)" $R) .namespace }}
{{- $local := include "shc-cluster-base.switch" (list (printf "%sonServicesCluster" $R) .onServicesCluster) | eq "true" }}
{{- $receiver := include "shc-cluster-base.switch" (list (printf "%sreceiverCheck" $R) .receiverCheck) | eq "true" }}
{{- $sc := .servicesCluster | default dict }}
{{- $writers := .writers | default list }}
{{- $readers := .readerGroups | default list }}
{{- if not (kindIs "slice" $writers) }}{{ fail (printf "%swriters must be a list of names" $R) }}{{ end }}
{{- if not (kindIs "slice" $readers) }}{{ fail (printf "%sreaderGroups must be a list of group names" $R) }}{{ end }}
{{- if $local }}
{{- if $sc.secret }}{{ fail (printf "%sservicesCluster is for another cluster; on the services cluster (onServicesCluster true) leave it empty" $R) }}{{ end }}
{{- if not $readers }}{{ fail (printf "%sreaderGroups needs at least one group on the services cluster" $R) }}{{ end }}
{{- range $writers }}
{{- if or (not (kindIs "string" .)) (gt (len .) 40) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .)) }}{{ fail (printf "%swriters: %v: lower-case letters, digits and '-', at most 40 characters" $R .) }}{{ end }}
{{- end }}
{{- range $readers }}{{ if not (and (kindIs "string" .) .) }}{{ fail (printf "%sreaderGroups must be a list of group names" $R) }}{{ end }}{{ end }}
{{- else }}
{{- range $k := list "secret" "serverKey" "tokenKey" }}
{{- if not (get $sc $k) }}{{ fail (printf "%sservicesCluster.%s is required on a cluster other than the services cluster" $R $k) }}{{ end }}
{{- end }}
{{- if or $writers $readers }}{{ fail (printf "%swriters and readerGroups belong to the services cluster (onServicesCluster true)" $R) }}{{ end }}
{{- end }}
{{- if has $cluster $writers }}{{ fail (printf "%swriters: %s is this cluster; list only the other clusters" $R $cluster) }}{{ end }}
{{- if ne (len $writers) (len (uniq $writers)) }}{{ fail (printf "%swriters: a name is listed twice" $R) }}{{ end }}
{{- $cfg := dict "cluster" $cluster "intervalSeconds" (mul $interval 60) "receiverCheck" $receiver "opsNamespace" $ns "checkCronJobs" (include "shc-cluster-base.checkCronJobs" $) "targetMode" (ternary "local" "remote" $local) "targetNamespace" $target "targetConfigMap" (printf "shc-platform-health-%s" $cluster) "targetKey" "report.json" "targetDir" "/etc/services-cluster" "targetServerKey" ($sc.serverKey | default "") "targetTokenKey" ($sc.tokenKey | default "") "targetCAKey" ($sc.caKey | default "") }}
{{- $hash := printf "%s%s" ($.Files.Get "files/platform_health_report.py") (toJson $cfg) | sha256sum | trunc 16 }}
---
# The banner's report of this cluster: reads the cluster monitoring's alerts (role monitoring-alertmanager-view in
# openshift-monitoring) and the check Jobs and their pods in {{ $ns }}, and writes the key report.json of
# ConfigMap shc-platform-health-{{ $cluster }} in {{ $target }} on the services cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-health-report
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-platform-health-report
  namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-alertmanager-view
subjects:
  - kind: ServiceAccount
    name: platform-health-report
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-health-report-checks
  namespace: {{ $ns }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-health-report-checks
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-health-report-checks
subjects:
  - kind: ServiceAccount
    name: platform-health-report
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-health-report
  namespace: {{ $ns }}
data:
  platform_health_report.py: |
    {{- $.Files.Get "files/platform_health_report.py" | nindent 4 }}
  config.json: |
    {{- toPrettyJson $cfg | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-health-report
  namespace: {{ $ns }}
spec:
  schedule: {{ printf "*/%d * * * *" $interval | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ min 240 (sub (mul $interval 60) 10) }}
      template:
        metadata:
          annotations:
            shc/config-hash: {{ $hash | quote }}
        spec:
          serviceAccountName: platform-health-report
          restartPolicy: Never
          containers:
            - name: report
              image: {{ required (printf "%simage is required" $R) $r.image }}
              command: [python3, /etc/platform-health-report/platform_health_report.py,
                        --config, /etc/platform-health-report/config.json]
              terminationMessagePolicy: FallbackToLogsOnError
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
              securityContext:
                {{- toYaml $restricted | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/platform-health-report
                  readOnly: true
                {{- if not $local }}
                - name: services-cluster
                  mountPath: /etc/services-cluster
                  readOnly: true
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: platform-health-report
            {{- if not $local }}
            # optional, so that a missing Secret or key fails the run with the setting's name instead of a pod that
            # never starts
            - name: services-cluster
              secret:
                secretName: {{ $sc.secret }}
                optional: true
            {{- end }}
{{- if $local }}
{{- $reporting := prepend $writers $cluster }}
---
# The banner's index: the clusters that report, one ConfigMap each. Made here, so that no writer needs create.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shc-platform-health
  namespace: {{ $target }}
data:
  clusters.json: {{ toJson $reporting | quote }}
{{- range $reporting }}
---
# The report of cluster {{ . }}: its writer fills the key report.json (a merge patch). The chart sets no data here, so
# that a sync never removes what the writer wrote.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shc-platform-health-{{ . }}
  namespace: {{ $target }}
---
# The writer of cluster {{ . }}: get and patch on its own report, nothing else (no create, no other name).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shc-platform-health-writer-{{ . }}
  namespace: {{ $target }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [shc-platform-health-{{ . }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-platform-health-writer-{{ . }}
  namespace: {{ $target }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shc-platform-health-writer-{{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ if eq . $cluster }}platform-health-report{{ else }}platform-health-writer-{{ . }}{{ end }}
    namespace: {{ $ns }}
{{- end }}
{{- range $writers }}
---
# The account of the writer on cluster {{ . }}: its token (this Secret's key token, filled by the cluster) and this
# cluster's API address go into the Secret named by that cluster's ops.platformHealth.report.servicesCluster.secret.
# The token can read and patch one ConfigMap (shc-platform-health-{{ . }}); the installation rotates it by deleting
# this Secret (the chart makes it again with a new token) and copying the new token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-health-writer-{{ . }}
  namespace: {{ $ns }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-health-writer-{{ . }}
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: platform-health-writer-{{ . }}
    # after its service account, or the token controller removes it
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/service-account-token
{{- end }}
---
# Readers of the banner: get on the index and on each cluster's report, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shc-platform-health-reader
  namespace: {{ $target }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - shc-platform-health
      {{- range $reporting }}
      - shc-platform-health-{{ . }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shc-platform-health-reader
  namespace: {{ $target }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shc-platform-health-reader
subjects:
  {{- range $readers }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}{{ end }}
{{- end }}
