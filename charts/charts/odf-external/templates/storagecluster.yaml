# Applied once the operator's CRDs exist (SkipDryRunOnMissingResource); reconciles after the details
# Secret appears.
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: {{ .Values.storageCluster.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # never deleted with the Application: every RBD/CephFS volume on the cluster hangs off it
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Delete=false
spec:
  externalStorage:
    enable: true
  labelSelector: {}
  managedResources:
    cephBlockPools:
      defaultStorageClass: {{ .Values.storageCluster.defaultStorageClass }}
      defaultVirtualizationStorageClass: {{ .Values.storageCluster.defaultVirtualizationStorageClass }}
  multiCloudGateway:
    reconcileStrategy: ignore
