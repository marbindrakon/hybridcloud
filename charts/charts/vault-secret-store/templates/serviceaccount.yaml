{{- if eq .Values.auth.type "kubernetes" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.auth.serviceAccountName }}
  namespace: {{ .Values.auth.serviceAccountNamespace }}
  labels:
    app.kubernetes.io/name: vault-secret-store
    app.kubernetes.io/component: external-secrets-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
{{- end }}
