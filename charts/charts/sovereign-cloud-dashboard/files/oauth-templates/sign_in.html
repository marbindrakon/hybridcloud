<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · @@PRODUCT@@</title>
  <style>
@@STYLE@@
  </style>
</head>
<body>
  <header class="sc-bar"><span class="sc-mark" aria-hidden="true"></span>@@PRODUCT@@</header>
  <main class="sc-card" role="main">
    <h1>Sign in</h1>
    <p>This dashboard is for the platform team. Sign in with your platform account; the @@GRANTING_ROLE@@ role grants access.</p>
    {{- if .SignInMessage }}
    <p>{{.SignInMessage}}</p>
    {{- end }}
    <form method="GET" action="{{.ProxyPrefix}}/start">
      <input type="hidden" name="rd" value="{{.Redirect}}">
      <p class="sc-actions"><button type="submit" class="sc-btn">Sign in</button></p>
    </form>
    <p class="sc-muted">If you work in a tenant, use the tenant dashboard instead.</p>
    @@TENANT_LINK@@
  </main>
</body>
</html>
