---
# shc (§11.6 phase C): API and apps wildcard records in the CloudOSO's Designate zone, with the
# account, zone and zone project the CloudOSO recorded (upstream hardcoded a lab project and its
# parent zone). The records are in status.dns before they are created (dns_record.yml); sets cb_dns_records (what
# Designate answered) for the later status writes. The teardown deletes the recorded records.
- name: Validate VIPs before Designate DNS
  ansible.builtin.assert:
    that:
      - cb_api_vip | length > 0
      - cb_ingress_vip | length > 0
    fail_msg: "The cluster's floating IPs (status.floatingIPs) must be allocated before its Designate DNS records."

- name: Record the records before they are created
  ansible.builtin.include_tasks: dns_record.yml
  vars:
    dr_records:
      - {zoneId: "{{ designate_zone_id }}", zone: "", name: "api.{{ cb_ocp_name }}.{{ cb_cluster_domain }}.", type: A}
      - {zoneId: "{{ designate_zone_id }}", zone: "", name: "*.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}.", type: A}

# the account's clouds.yaml in /tmp goes whatever happens (Review R2 L11)
- name: The records with the zone's account
  block:
    - name: Load the OpenStack account
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
      vars:
        shc_step: "Write the cluster's DNS names"
        os_account_vault_path: "{{ designate_admin_vault_path }}"
        os_account_tag: "po-{{ cb_cluster_name }}"

    - name: Create or update the Designate records
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        shc_step: "Write the cluster's DNS names"
        os_call_no_log: false
        os_call_soft: true
        os_request:
          action: dns-upsert
          dns_zone_id: "{{ designate_zone_id }}"
          dns_project_id: "{{ designate_project_id }}"
          # the platform's mark on the records (description shc:<owner>): only records with it are changed or deleted
          owner: "PlatformOpenshift/{{ ansible_operator_meta.namespace }}/{{ ansible_operator_meta.name }}"
          records:
            - {name: "api.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", records: ["{{ cb_api_vip }}"]}
            - {name: "*.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}", records: ["{{ cb_ingress_vip }}"]}
  always:
    - name: Remove the account's temp files
      ansible.builtin.file:
        path: "/tmp/eda-po-{{ cb_cluster_name }}-{{ item }}"
        state: absent
      loop: [clouds.yaml, ca.crt]

# a record of the wanted name that the platform did not make for this cluster (the tenant's own, in its zone) is
# refused, never changed: NameTakenOnSite; any other failure is the step's sentence (the answer goes to the log)
- name: The site's answer for the DNS names, for the job's log
  ansible.builtin.debug:
    msg: "{{ os_result.message | default('', true) or os_result.error | default('', true) }}"
  when: (os_result.error | default('', true) | length > 0) or (os_result.reason | default('', true) | length > 0)

- name: Refuse a DNS name that holds a record the platform did not make
  ansible.builtin.include_tasks: preflight_stop.yml
  vars:
    ps_reason: NameTakenOnSite
    ps_message: >-
      The DNS name api.{{ cb_ocp_name }}.{{ cb_cluster_domain }} or *.apps.{{ cb_ocp_name }}.{{ cb_cluster_domain }}
      already has a record that the platform did not make for this cluster; the platform does not change it. Remove
      that record from the zone, or use another cluster name.
  when: (os_result.reason | default('', true)) == 'NameTakenOnSite'

- name: Fail when the DNS names could not be written
  ansible.builtin.fail:
    msg: "{{ shc_step | hybridsovereign.shc.shc_step_failed(shc_step_what | default('provisioning', true)) }}"
  vars:
    shc_step: "Write the cluster's DNS names"
  when: (os_result.error | default('', true) | length > 0) or (os_result.reason | default('', true) | length > 0)

- name: Record the Designate records
  ansible.builtin.set_fact:
    cb_dns_records: "{{ os_result.records }}"
