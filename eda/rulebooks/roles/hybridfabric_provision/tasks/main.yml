---
# shc (design/P7-PLAN.md P7.3.3, §12.3): HybridFabric provision. Validates the fabric and checks that its
# credentials resolve. Realizing it (the allocation ledger, the border gateway root instance on every node) is
# P7.3.4; until then the fabric ends pending with reason NotImplemented.
- block:
    - name: Read the HybridFabric
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"

    - name: Check the numbering and the core
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: check-fabric, spec: "{{ fab_spec }}"}

    - name: Refuse an invalid fabric
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: "HybridFabric {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: fab_check_result.errors | length > 0

    - name: Stop on an invalid fabric
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: fab_check_result.errors | length > 0

    - name: Expect the border gateway SSH key
      ansible.builtin.set_fact:
        fab_fail_reason: CredentialsMissing
        fab_fail_msg: >-
          HybridFabric {{ fab_name }}: borderGateway.credentialsRef {{ fab_spec.borderGateway.credentialsRef.vaultPath }}
          is not readable or has no ssh_private_key

    - name: Read the border gateway SSH key
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
      vars:
        vault_kv_path: "{{ fab_spec.borderGateway.credentialsRef.vaultPath }}"

    - name: Require ssh_private_key
      ansible.builtin.assert:
        that: (vault_kv_data.ssh_private_key | default('')) | length > 0
        quiet: true
      no_log: true

    - name: Read the BGP session password
      when: (fab_spec.bgp | default({})).passwordRef is defined
      block:
        - name: Expect the BGP password
          ansible.builtin.set_fact:
            fab_fail_msg: >-
              HybridFabric {{ fab_name }}: bgp.passwordRef {{ fab_spec.bgp.passwordRef.vaultPath }} is not readable
              or has no password

        - name: Read bgp.passwordRef
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: "{{ fab_spec.bgp.passwordRef.vaultPath }}"

        - name: Require password
          ansible.builtin.assert:
            that: (vault_kv_data.password | default('')) | length > 0
            quiet: true
          no_log: true

    - name: Drop the secrets
      ansible.builtin.set_fact:
        vault_kv_data: {}
        fab_fail_reason: ProvisionFailed
        fab_fail_msg: ""
      no_log: true

    - name: List the nodes (not configured yet)
      ansible.builtin.set_fact:
        hf_nodes: "{{ hf_nodes | default([]) + [{'name': item.name, 'ready': false, 'message': 'not configured'}] }}"
      loop: "{{ fab_spec.borderGateway.nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # P7.3.4 replaces this with the ledger and the border gateway root instance
    - name: Report the fabric validated, not realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: NotImplemented
        fab_message: Spec and credentials valid; configuring the border gateway nodes is not implemented yet
        fab_waiting_for: [implementation]
        fab_status: >-
          {{ {'available': {'vni': fab_check_result.poolSize.vniPool | int,
                            'l2vni': fab_check_result.poolSize.l2vniPool | int,
                            'vpnTarget': fab_check_result.poolSize.vpnTargetPool | int},
              'nodes': hf_nodes} }}

  rescue:
    - name: Mark the HybridFabric failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('HybridFabric provision failed') }}
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridFabric {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
