---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: vault-secret-store
    app.kubernetes.io/component: secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.path | quote }}
      version: "v2"
      {{- if .Values.vault.caBundle }}
      caBundle: {{ .Values.vault.caBundle | quote }}
      {{- end }}
      auth:
        {{- if eq .Values.auth.type "kubernetes" }}
        kubernetes:
          mountPath: {{ .Values.auth.mountPath | quote }}
          role: {{ .Values.auth.role | quote }}
          serviceAccountRef:
            name: {{ .Values.auth.serviceAccountName | quote }}
            namespace: {{ .Values.auth.serviceAccountNamespace | quote }}
        {{- else }}
        tokenSecretRef:
          name: {{ .Values.auth.tokenSecretName | quote }}
          namespace: {{ .Values.auth.tokenSecretNamespace | quote }}
          key: {{ .Values.auth.tokenSecretKey | quote }}
        {{- end }}
