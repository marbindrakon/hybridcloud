---
eda_central_work_namespace: sovereign-cloud-jobs

# shc (§11.6 phase C): environment defaults for CloudOSO specs, set per installation through the
# sovereign-localhost inventory variable `cloudoso_defaults` (config-as-code env CLOUDOSO_DEFAULTS).
# A CR field wins over these. Keys: vaultPath, projectDomain, externalNetwork, baseDomain,
# dnsProvider (designate|route53), designateZoneId, designateProjectId, route53VaultPath, regionName.
cloudoso_defaults: {}
# Vault paths a legacy CloudOSO spec (no cloudRef in effect) may name in spec.vaultPath / spec.route53VaultPath.
# The jobs read them with the platform's Vault token, so any other spec value is ignored and cloudoso_defaults
# applies (cloudoso_defaults key allowedVaultPaths; empty: the spec never chooses).
cloudoso_allowed_vault_paths: "{{ cloudoso_defaults.allowedVaultPaths | default([], true) }}"
