# ─── Cluster Builds ApplicationSet ───────────────────────────────────────────
# Monitors cluster_builds Gitea repo for Application definitions in aws/*.yaml.
# The giteaClusterBuildsRepo sovereign job (wave 37) creates the repo and the
# ArgoCD repo secret before this ApplicationSet (wave 50) is deployed.
clusterBuilds:
  enabled: false  # direct Helm by operators replaces Gitea→ArgoCD cluster-build flow
  syncWave: "50"
  repoURL: "https://gitea-gitea.apps.central.shc.signal9.gg/gitea_admin/cluster_builds.git"
  chartsRepoURL: "oci://quay.signal9.gg/shc/mce-cluster-build"
  mceChartName: "mce-cluster-build"
  mceChartVersion: "0.2.1-shc.1"

# ─── ACM Policy: install ExternalSecrets on provisioned clusters ──────────────
acmPolicies:
  enabled: false
  syncWave: "55"
  namespace: openshift-gitops
  externalSecrets:
    enabled: true
    channel: stable
    source: community-operators
    sourceNamespace: openshift-marketplace
  clusterSelector:
    matchExpressions:
      - key: vendor
        operator: In
        values:
          - OpenShift
      - key: local-cluster
        operator: NotIn
        values:
          - "true"

# ─── ACM Policy: basechart — install ESO + GitOps on basechart:true clusters ─
# Installs External Secrets Operator and OpenShift GitOps Operator via OLM.
acmBasechart:
  enabled: false
  syncWave: "56"
  namespace: openshift-gitops
  externalSecrets:
    enabled: true
    channel: stable
    source: community-operators
    sourceNamespace: openshift-marketplace
  gitopsOperator:
    enabled: true
    channel: latest
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  istioOperator:
    enabled: true
    channel: stable

# ─── AMQ Streams (central cluster) ───────────────────────────────────────────
amqStreams:
  enabled: true
  chartVersion: "0.2.4-shc.2"
  syncWave: "13"
  destinationNamespace: amq-streams
  values:
    namespace: amq-streams
    kafka:
      enabled: true
      name: hybridsovereign-kafka
      replicas: 3
      storage: 10Gi
      listeners:
        internalPlain: true
        internalTls: true
        externalRoute: true
        externalPort: 9094
        # shc: Let's Encrypt cert on the route listener so EDA/operators verify with system CAs
        externalCert:
          clusterIssuer: letsencrypt-shc
          appsDomain: apps.central.shc.signal9.gg

# ─── HybridSovereign Primary Operator (services) ─────────────────────────────
hybridsovereignPrimaryOperator:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.1.22-shc.2"
  syncWave: "38"
  destinationNamespace: sovereign-cloud
  values:
    namespace: sovereign-cloud
    pluginsNamespace: sovereign-cloud-plugins
    # shc: "img-" tags - the operator charts share these Quay repositories, and a chart push of
    # hybridsovereign-namespace-operator 0.1.10 replaced the 0.1.10 image (namespace operators then
    # failed "image not known"); chart versions are semver, so img-* can never collide.
    image:
      repository: quay.signal9.gg/shc/hybridsovereign-primary-operator
      tag: "img-0.1.21"
    namespaceOperator:
      image:
        repository: quay.signal9.gg/shc/hybridsovereign-namespace-operator
        tag: "img-0.1.11"
    amqKafka:
      enabled: true
      vaultPath: amq-producer
    imagePullSecrets:
      - name: quay-pull-secret
    replicas: 2

# ─── IAAC Git Sync StatefulSet (services) ────────────────────────────────────
iaacGitSync:
  enabled: true  # shc: P4 (services cluster) enabled
  chartVersion: "0.1.2-shc.1"
  syncWave: "40"
  destinationNamespace: sovereign-cloud-plugins
  values:
    namespace: sovereign-cloud-plugins
    image:
      repository: quay.signal9.gg/shc/iaac-git-sync
      tag: "0.1.0"
    imagePullSecrets:
      - name: quay-pull-secret
    gitea:
      url: "https://gitea-gitea.apps.central.shc.signal9.gg"
      repoOwner: gitea_admin
      repoName: tenancy_repo
      externalSecret:
        enabled: true
        secretStoreName: vault-backend
        secretStoreKind: ClusterSecretStore
        vaultPath: gitea-admin
        targetSecretName: gitea-admin-token
        tokenKey: admin_token

# ─── ACM GitOpsCluster pull model ────────────────────────────────────────────
acmGitOpsCluster:
  enabled: false
  syncWave: "11"
  namespace: open-cluster-management
  placementName: services-placement
  managedClusterSet: hybridsovereign-clusters

# ─── AAP config-as-code (infra.aap_configuration) ───────────────────────────
# Deployed via sovereignJobs.jobs.aapConfigAsCode (see above)
aapConfigAsCode:
  enabled: true
