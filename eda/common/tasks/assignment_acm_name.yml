---
# The name of the ACM objects an Assignment puts on the management cluster (Policy <name>, Placement
# placement-<name>, PlacementBinding binding-<name>, all in the ACM policy namespace): <tenant>-<assignment>, so
# two tenants with an Assignment of the same name never share a policy. The tenant is the Entity the namespace
# belongs to (namespace entity-<tenant>; a namespace without that prefix is used as it is). The name is
# DNS-label safe (lowercase letters, digits, single hyphens) and capped so that the policy namespace and the name
# together stay within ACM's 62 characters (the replicated policy on a managed cluster is named
# <namespace>.<name>); a longer name keeps its start and ends in -<8 hex of sha256(<namespace>/<assignment>)>.
# The one place the name is computed: the provision job (when nothing is recorded yet) and the teardown (when
# nothing is recorded) both include this file; status.acmPolicyName records what was used.
# Inputs: aan_namespace (the Assignment's namespace), aan_assignment (its name), aan_policy_namespace (default
# sovereign-cloud-helpers), aan_max_length (optional override of the cap). Sets: assignment_acm_name.
- name: The ACM name of the Assignment (<tenant>-<assignment>)
  vars:
    _aan_tenant: "{{ aan_namespace | string | regex_replace('^entity-', '') }}"
    _aan_full: >-
      {{ (_aan_tenant ~ '-' ~ (aan_assignment | string)) | lower | regex_replace('[^a-z0-9-]', '-')
         | regex_replace('-+', '-') | regex_replace('^-+|-+$', '') }}
    _aan_max: >-
      {{ [((aan_max_length | default('', true) | string | length > 0)
           | ternary(aan_max_length | default(0, true) | int,
                     62 - (aan_policy_namespace | default('sovereign-cloud-helpers', true) | length))), 20] | max }}
    _aan_hash: "{{ ((aan_namespace | string) ~ '/' ~ (aan_assignment | string)) | hash('sha256') }}"
  ansible.builtin.set_fact:
    assignment_acm_name: >-
      {{ _aan_full if (_aan_full | length) <= (_aan_max | int)
         else ((_aan_full[:(_aan_max | int) - 9] | regex_replace('-+$', '')) ~ '-' ~ _aan_hash[:8]) }}
