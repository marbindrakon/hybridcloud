---
# An environment's name is unique within its tenant across the four environment kinds: every kind gets the DNS
# zone <environment>.<tenant>.<domain>, so two of one name would share it. (It is no longer unique across tenants:
# nothing that is named from an environment lacks the tenant.) The older object keeps the name (creationTimestamp,
# tie broken by the kind's name); an object that was itself refused for its name, or whose deletion has completed,
# does not hold it.
# Inputs: enu_kind (CloudOSO | CloudVirt | CloudAWS | CloudGCP), enu_name, enu_namespace, enu_created (this object's
# metadata.creationTimestamp), services_api_host, services_bearer_token.
# Sets enu_taken (bool) and enu_holder_kind ('' or the kind that holds the name). The caller writes its status with
# reason EnvironmentNameTaken and stops before it makes anything.
- name: List the tenant's environments of the other kinds
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: "{{ _enu_kind }}"
    namespace: "{{ enu_namespace }}"
    name: "{{ enu_name }}"
  loop: "{{ ['CloudOSO', 'CloudVirt', 'CloudAWS', 'CloudGCP'] | difference([enu_kind]) }}"
  loop_control:
    loop_var: _enu_kind
  register: _enu_others

- name: Decide whether an older environment holds the name
  vars:
    _my_key: "{{ enu_created ~ '|' ~ enu_kind }}"
  ansible.builtin.set_fact:
    enu_holder_kind: >-
      {%- set ns = namespace(holder='', key='') -%}
      {%- for r in _enu_others.results | default([]) -%}
        {%- for o in r.resources | default([]) -%}
          {%- set st = o.status | default({}, true) -%}
          {%- set ready = (st.conditions | default([], true)) | selectattr('type', 'equalto', 'Ready') | list -%}
          {%- set refused = (ready | length > 0) and ((ready | first).reason | default('')) == 'EnvironmentNameTaken' -%}
          {%- set gone = o.metadata.deletionTimestamp is defined and (st.deletionComplete | default(false) | bool) -%}
          {%- set key = o.metadata.creationTimestamp ~ '|' ~ o.kind -%}
          {%- if key < _my_key and not refused and not gone and (ns.key == '' or key < ns.key) -%}
            {%- set ns.holder = o.kind -%}
            {%- set ns.key = key -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.holder }}

- name: Keep the answer
  ansible.builtin.set_fact:
    enu_taken: "{{ (enu_holder_kind | trim | length) > 0 }}"
    enu_holder_kind: "{{ enu_holder_kind | trim }}"
