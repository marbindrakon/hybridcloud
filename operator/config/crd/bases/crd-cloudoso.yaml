apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudosos.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "3"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudOSO
    listKind: CloudOSOList
    plural: cloudosos
    singular: cloudoso
    shortNames:
      - osenv
    categories:
      - shc
      - shc-tenant
      - shc-environment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An OpenStack environment: the tenant's project on a platform OpenStack site, comparable
            to an OpenStack project with its quota, an AWS account in one Region or a Google Cloud
            project. The platform creates the project on the site named by spec.cloudRef and the
            environment's DNS zone <environment>.<tenant>.<tenant DNS domain>. Where the site offers
            sign-in with the platform identity, members of the access groups in spec.toolRbac sign in
            to the site's dashboard and work in the project. With cloudRef set, the site supplies every
            site setting and the legacy fields below have no effect.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              properties:
                name:
                  type: string
                  x-kubernetes-validations:
                    # the rule for names (eda/common/files/shc_names.py NAME_PATTERN, NAME_MAX)
                    - rule: >-
                        self.size() <= 30 && self.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$')
                        && !self.contains('--')
                      message: >-
                        Names are lower-case letters, digits and single hyphens, start with a letter, end with a
                        letter or digit, and have at most 30 characters.
            spec:
              description: The environment.
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                cloudRef:
                  type: object
                  description: >-
                    The platform CloudInfrastructure (type openstack, namespace sovereign-cloud) the project is
                    created on. It supplies the infrastructure credential and every site setting (projectDomain,
                    DNS, region); with a cloudRef in effect those spec fields below are ignored.
                    Default: the installation's default site. Immutable once set.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.cloudRef is immutable
                  properties:
                    name:
                      description: Name of the OpenStack site (CloudInfrastructure).
                      type: string
                      maxLength: 253
                toolRbac:
                  type: object
                  description: >-
                    Who can use the environment on the site (access groups, Rbac names in this namespace).
                  properties:
                    editRbac:
                      type: array
                      description: >-
                        Access groups whose members can create, change and delete resources in the
                        environment's project.
                      items:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    viewRbac:
                      type: array
                      description: >-
                        Access groups whose members get read-only access to the environment's project.
                      items:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                project:
                  type: string
                  description: >-
                    Accepted and ignored. The platform names the environment's project itself; this field is
                    kept only so that manifests that still set it apply. Leave it out.
                vaultPath:
                  type: string
                  description: >-
                    Legacy, ignored when cloudRef is set. Set by the platform; leave unset. Requests
                    from tenant users that set or change it are refused, or accepted with a warning,
                    depending on the platform's admission settings.
                baseDomain:
                  type: string
                  maxLength: 253
                  description: >-
                    Base DNS domain. With Designate the environment gets <name>.<entity>.<baseDomain>
                    inside the zone designateZoneId. Ignored with a cloudRef in effect. Default: the installation default.
                projectDomain:
                  type: string
                  maxLength: 64
                  description: "Keystone domain for the project. Ignored with a cloudRef in effect. Default: the installation default."
                externalNetwork:
                  type: string
                  maxLength: 255
                  description: >-
                    No effect: the environment holds no floating IPs; each OpenShift cluster chooses its own network
                    (PlatformOpenshift spec.openstack).
                regionName:
                  type: string
                  maxLength: 64
                  description: "OpenStack region. Default: the account's clouds.yaml region."
                dnsProvider:
                  type: string
                  description: >-
                    DNS for the environment's clusters: designate (designateZoneId + designateProjectId)
                    or route53 (route53VaultPath). Ignored with a cloudRef in effect. Default: the installation default, else
                    designate when designateZoneId is set.
                  enum: [designate, route53, none]
                route53VaultPath:
                  type: string
                  description: >-
                    Legacy, ignored when cloudRef is set. Set by the platform; leave unset. Requests
                    from tenant users that set or change it are refused, or accepted with a warning,
                    depending on the platform's admission settings.
                landingzone:
                  type: string
                  description: No effect.
                  default: default
                designateZoneId:
                  type: string
                  description: "Designate zone id for the environment's records. Ignored with a cloudRef in effect. Default: the installation default."
                designateProjectId:
                  type: string
                  description: >-
                    Project owning the Designate zone (the account needs member there). Default: the
                    installation default. Ignored with a cloudRef in effect.
                enableVRF:
                  type: boolean
                  description: No effect.
                  default: false
                vrfId:
                  type: string
                  description: No effect.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the environment.
                  type: string
                namespace:
                  description: Namespace of the environment.
                  type: string
                entity:
                  description: The tenant this environment belongs to.
                  type: string
                domain:
                  description: DNS zone of the environment.
                  type: string
                route53ZoneId:
                  description: Hosted zone of the environment when its DNS is on Route 53.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                description:
                  description: The tenant's description.
                  type: string
                osoHelperName:
                  type: string
                  description: No longer set.
                osoHelperCreated:
                  type: boolean
                  description: No longer set.
                centralApiServer:
                  type: string
                  description: No longer set.
                projectName:
                  type: string
                  description: Name of the OpenStack project.
                projectId:
                  type: string
                  description: Identifier of the OpenStack project.
                domainId:
                  type: string
                  description: Identifier of the OpenStack domain that holds the project.
                domainName:
                  type: string
                  description: Name of the OpenStack domain that holds the project.
                access:
                  type: object
                  description: >-
                    Who can use the environment on the site: the sign-in directory client the site's
                    sign-in uses, the domain of the site's identity service that holds the groups, and one
                    entry per access group in spec.toolRbac.
                  properties:
                    signInClient:
                      type: string
                      description: >-
                        The client of the platform's sign-in directory that the site's sign-in uses. Kept after the
                        site stops offering sign-in until the environment's groups are removed.
                    groupDomain:
                      type: string
                      description: >-
                        Domain of the site's identity service that holds the environment's groups. Kept after the
                        site stops offering sign-in until the environment's groups are removed.
                    groups:
                      type: array
                      description: One entry per access group in spec.toolRbac.
                      items:
                        type: object
                        description: An access group and its group on the site.
                        properties:
                          rbac:
                            type: string
                            description: The access group (Rbac name).
                          group:
                            type: string
                            description: Name of the group on the site and in the sign-in token, <tenant>.<access group>.
                          access:
                            type: string
                            description: Edit (create, change and delete resources) or View (read only).
                          role:
                            type: string
                            description: The role the group holds on the project.
                          state:
                            type: string
                            description: >-
                              Granted, Waiting (not usable yet: the access group has no group in the sign-in
                              directory yet, or the site offers no sign-in; message says which) or Failed (the site
                              refused; message says why). When the site or the sign-in directory could not be
                              asked, the group keeps its last state and message says so.
                          message:
                            type: string
                            description: Why the group is waiting or failed, or why its state was not checked, in plain words.
                    removing:
                      type: array
                      description: >-
                        Groups the environment no longer wants whose removal from the site or the sign-in directory
                        is not finished; the next reconcile goes on with it.
                      items:
                        type: string
                endpoints:
                  type: object
                  description: How people and tools reach the environment.
                  properties:
                    console:
                      type: string
                      description: >-
                        The link that opens the site's dashboard for this environment and starts sign-in. Empty when
                        people cannot sign in to the environment (the site offers no sign-in, or it is not working).
                    signIn:
                      type: object
                      description: How people sign in to the dashboard.
                      properties:
                        method:
                          type: string
                          description: TenantSSO (with the platform identity) or NotAvailable (the site offers no sign-in for people).
                        idpName:
                          type: string
                          description: Name of the entry to choose on the dashboard's sign-in page.
                        start:
                          type: string
                          description: >-
                            IdentityProvider: the console link starts sign-in at the identity provider and returns
                            to the dashboard. Dashboard: the link opens the dashboard's sign-in page.
                    signInGroups:
                      type: array
                      description: The groups whose members can sign in to the environment.
                      items:
                        type: string
                    api:
                      type: string
                      description: The site's identity endpoint, the entry point of its API.
                    project:
                      type: string
                      description: Name of the environment's project.
                    projectId:
                      type: string
                      description: Identifier of the environment's project.
                    domain:
                      type: string
                      description: Name of the domain that holds the project.
                    domainId:
                      type: string
                      description: Identifier of the domain that holds the project.
                    region:
                      type: string
                      description: The site's region name, as command-line tools ask for it.
                    location:
                      type: string
                      description: Where the site is, in words.
                    apiCredentials:
                      type: object
                      description: >-
                        Whether people can create application credentials (secrets that let command-line tools
                        act as them in the project) in the dashboard, and for how long they work.
                      properties:
                        state:
                          type: string
                          description: Offered, NotOffered or Unknown (the site does not report it and nobody declared it).
                        validMinutesAfterSignIn:
                          type: integer
                          description: >-
                            How long an application credential keeps working after the person's last sign-in to
                            the dashboard, in minutes. It works again after the next sign-in.
                        source:
                          type: string
                          description: Site (read from the site) or Declared (stated by the platform team).
                status:
                  type: string
                  description: Short state word written by the platform's automation.
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: When the platform last finished processing this object (RFC 3339).
                message:
                  type: string
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                phase:
                  type: string
                  description: >-
                    State of the object, written by the platform: Waiting (for something else),
                    Creating, Updating, Ready, Degraded (usable, with reduced health), Paused (the
                    site is paused), Failed or Deleting.
                phaseSince:
                  type: string
                  description: >-
                    When the object entered the state in status.phase (RFC 3339). It changes only
                    when the state changes.
                summary:
                  type: string
                  description: >-
                    One line on what the platform is doing or waiting for, in plain words. Read it
                    together with status.phase.
                lastHandledReconcileRequest:
                  type: string
                  description: >-
                    The Retry now request the platform last handled: the value of the
                    ansible.sdk.operatorframework.io/reconcileNow annotation at that time. A request
                    is open while the annotation differs from this value.
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Project
          type: string
          jsonPath: .status.projectName
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
