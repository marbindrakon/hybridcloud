apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridnetworks.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "4"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridNetwork
    listKind: HybridNetworkList
    plural: hybridnetworks
    singular: hybridnetwork
    shortNames:
      - hnet
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A tenant's routed private network across cloud sites: one isolated routing domain (VRF) on the
            platform's HybridFabric. NetworkPlacements put it on cloud environments (CloudOSO, CloudVirt,
            CloudAWS); every placement's subnets can reach every other placement's subnets of the same network,
            and nothing else. The network's address space (spec.prefixes) is the tenant's: the platform allocates
            each placement's subnets from it. Networks may use the same addresses as other networks.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    When true, deleting the tenant does not delete this object; the tenant deletion
                    waits until protection is turned off.
                description:
                  type: string
                  maxLength: 512
                fabricRef:
                  type: object
                  description: >-
                    The HybridFabric (platform namespace) the network uses. Default: the platform's only fabric.
                    Immutable once set.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.fabricRef is immutable
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                mtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    MTU of the network as its workloads see it. Default and maximum: the fabric's overlayMtu. A site
                    whose networks cannot reach it gets that site's maximum instead (shown on the placement).
                networkViewerRbac:
                  type: array
                  description: Rbac CR names whose groups can view this network and its placements.
                  items:
                    type: string
                egress:
                  type: object
                  description: Traffic from the network to destinations outside it.
                  properties:
                    internet:
                      type: boolean
                      default: false
                      description: >-
                        Outbound internet access through the platform, like attaching a NAT gateway: the platform
                        advertises a default route into the network and translates its traffic to platform source
                        addresses (status.egress.sourceAddresses). Connections can only be opened from inside the
                        network, and the platform's private address ranges are not reachable this way. Leave it off
                        when the network's default route comes from your own edge router. Can be changed at any time.
                prefixes:
                  type: array
                  description: >-
                    The network's address space, IPv4 and IPv6 prefixes the platform allocates the placements'
                    subnets from (NetworkPlacement spec.ipv4 and spec.ipv6). At least one IPv4 prefix. Prefixes
                    are in canonical form (host bits zero, e.g. 10.60.0.0/16 or fd12:3456:789a::/48) and must not
                    overlap each other. The platform's own ranges inside a prefix are never allocated; a prefix
                    wholly inside one is refused. Prefixes can be added at any time; a change that would leave a
                    placement's subnet outside the space is refused, as is a prefix holding a route an
                    AttachmentCircuit of the network accepts from its CE.
                  minItems: 1
                  maxItems: 8
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - rule: self.exists(p, isCIDR(p) && cidr(p).ip().family() == 4)
                      message: at least one prefix must be IPv4
                    - rule: >-
                        self.all(a, self.all(b, a == b || !isCIDR(a) || !isCIDR(b)
                        || cidr(a).ip().family() != cidr(b).ip().family()
                        || !(cidr(a).containsCIDR(cidr(b)) || cidr(b).containsCIDR(cidr(a)))))
                      message: prefixes must not overlap
                  items:
                    type: string
                    maxLength: 43
                    x-kubernetes-validations:
                      - rule: isCIDR(self) && string(cidr(self).masked()) == self
                        message: each prefix must be a network prefix in canonical form (host bits zero, e.g. 10.60.0.0/16)
                      - rule: >-
                          !isCIDR(self) || (cidr(self).ip().family() == 4
                          ? cidr(self).prefixLength() >= 8 && cidr(self).prefixLength() <= 29
                          : cidr(self).prefixLength() >= 32 && cidr(self).prefixLength() <= 64)
                        message: prefix length must be /8 to /29 for IPv4 and /32 to /64 for IPv6
              required: [prefixes]
              x-kubernetes-validations:
                - rule: has(self.fabricRef) || !has(oldSelf.fabricRef)
                  message: spec.fabricRef cannot be removed
            status:
              type: object
              properties:
                entity:
                  type: string
                fabric:
                  type: string
                  description: The HybridFabric in use.
                realization:
                  type: object
                  description: How the platform realized the network (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                egress:
                  type: object
                  description: State of the network's egress.
                  properties:
                    internet:
                      type: string
                      description: >-
                        Internet egress: pending (being added), ready, removing, or unavailable (the fabric offers
                        none).
                    sourceAddresses:
                      type: array
                      description: The source addresses the network's internet traffic leaves with.
                      items:
                        type: string
                mtu:
                  type: integer
                  description: Effective MTU.
                placementCount:
                  type: integer
                placementsReady:
                  type: integer
                addressSpace:
                  type: array
                  description: >-
                    The network's address space as the platform holds it, per prefix: its family, how many
                    placement subnets it holds, and the largest block still free.
                  items:
                    type: object
                    properties:
                      prefix:
                        type: string
                      family:
                        type: integer
                        description: 4 or 6.
                      allocations:
                        type: integer
                        description: Placement subnets inside the prefix.
                      largestFree:
                        type: integer
                        description: >-
                          Prefix length of the largest free block (the platform's ranges are not free, a site's own
                          ranges are not counted); absent when the prefix is full.
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  type: string
                ready:
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending network waits for.
                  items:
                    type: string
                deletionComplete:
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fabric
          type: string
          jsonPath: .status.fabric
        - name: MTU
          type: integer
          jsonPath: .status.mtu
        - name: Placements
          type: integer
          jsonPath: .status.placementCount
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
