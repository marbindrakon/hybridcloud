---
- block:
    # shc (LAB-PLAN §11.6): wait while other CRs in the namespace still use this PlatformOpenshift
    - name: Wait for dependents to be deleted first
      ansible.builtin.include_role:
        name: _common
        tasks_from: block_on_dependents
      vars:
        dependents_namespace: "{{ ansible_operator_meta.namespace }}"
        dependents_status:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: PlatformOpenshift
          name: "{{ ansible_operator_meta.name }}"
        dependent_checks:
          - kind: Assignment
            match: {"spec.openshift": "{{ ansible_operator_meta.name }}"}
          - kind: NetworkPlacement
            match: {"spec.backend.kind": PlatformOpenshift, "spec.backend.name": "{{ ansible_operator_meta.name }}"}

    - name: Get current timestamp
      ansible.builtin.set_fact:
        platformopenshift_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark PlatformOpenshift as awaiting EDA delete
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: PlatformOpenshift
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          message: Awaiting EDA delete
          lastReconciledAt: "{{ platformopenshift_delete_transition_time }}"

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "PlatformOpenshiftDeleteRequested"
        operator_event_action: "Delete"
        operator_event_note: "{{ _hybridsovereign_redhat_platformopenshift.spec | to_json }}"
        operator_reporting_controller: platformopenshift-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: PlatformOpenshift
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_platformopenshift.metadata.uid }}"


    - name: Wake the CRs this one was holding up (deletion complete)
      ansible.builtin.include_role:
        name: _common
        tasks_from: nudge_referenced
      vars:
        nudge_targets:
          - kind: CloudOSO
            name: "{{ _hybridsovereign_redhat_platformopenshift.spec.openstack.environment | default('') if (_hybridsovereign_redhat_platformopenshift.spec.type | default('')) == 'openstack' else '' }}"
          - kind: CloudAWS
            name: "{{ _hybridsovereign_redhat_platformopenshift.spec.aws.environment | default('') if (_hybridsovereign_redhat_platformopenshift.spec.type | default('')) == 'aws' else '' }}"
      when: _hybridsovereign_redhat_platformopenshift.status.deletionComplete | default(false) | bool
    - name: Exit cleanly when EDA completed deletion
      ansible.builtin.meta: end_host
      when: _hybridsovereign_redhat_platformopenshift.status.deletionComplete | default(false) | bool

    - name: Block finalizer until EDA completes deletion
      ansible.builtin.fail:
        msg: Waiting for EDA to complete deletion

  rescue:
    - name: Mark PlatformOpenshift delete as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: PlatformOpenshift
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Deletion failed')) }}"
      ignore_errors: true
      # a delete that waits (for dependents, or for the EDA teardown) is not failed: the status it set stays
      when: not (ansible_failed_result.msg | default('') is match('(Deletion waits for |Waiting for EDA to complete deletion)'))

    - name: Re-raise to signal finalizer failure
      ansible.builtin.fail:
        msg: "PlatformOpenshift {{ ansible_operator_meta.name }} deletion failed — see status.message for details"
