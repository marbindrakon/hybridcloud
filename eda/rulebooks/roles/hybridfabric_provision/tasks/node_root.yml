# FRR 8.5: a VRF deleted and created again under the same name (a network's VPN target used again) can keep zebra's old binding of
# its VPN label: bgpd exports the label, but zebra never installs it into the kernel, so traffic from the core for the
# VRF is dropped. Every VRF must have an MPLS route into it; a VRF without one gets its label bound again (label vpn
# export off and on, so the running configuration ends unchanged). Per address family: each family of a VRF has its
# own label, read from the VPN table (`show bgp ipv4|ipv6 vpn json detail`: the VRF's paths carry nhVrfName and
# remoteLabel), and only the family whose label has no route is bound again, under that family; a family with no
# exported route yet needs one more MPLS route into the VRF. A VRF without the IPv6 family is checked as before (any
# MPLS route into it, IPv4 bound again). Same check code as the gateway's. Only on the MPLS core (fab_node_transport
# mpls); the SRv6 core checks its SIDs instead (below).
- name: "{{ bgw_node.name }}: every root VRF's VPN label leads into it"
