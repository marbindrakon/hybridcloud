---
# The cluster's static issuer on central (the provision's ConfigMap oidc-static-<build>, labelled with the build's
# name): found by its exact name and that label in any namespace, so the delete needs no installation setting. The
# label key is hybridsovereign.redhat/oidc-name; a ConfigMap made before it carries the older key of the same word,
# so both are looked for. None found: said in the job's result (nothing else of the cluster depends on it). Input:
# po_build_name.
- name: The cluster's static issuer
  kubernetes.core.k8s_info:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: ConfigMap
    field_selectors: ["metadata.name=oidc-static-{{ po_build_name }}"]
    label_selectors: ["{{ item }}={{ po_build_name }}"]
  loop: [hybridsovereign.redhat/oidc-name, shc.signal9.gg/oidc-name]
  register: _ui_lookups

- name: What was found under either key
  ansible.builtin.set_fact:
    _ui_found:
      resources: >-
        {%- set out = [] -%}
        {%- set seen = [] -%}
        {%- for r in _ui_lookups.results | map(attribute='resources') | flatten -%}
          {%- set k = r.metadata.namespace ~ '/' ~ r.metadata.name -%}
          {%- if k not in seen -%}{%- set _ = seen.append(k) -%}{%- set _ = out.append(r) -%}{%- endif -%}
        {%- endfor -%}
        {{ out }}

- name: Remove it
  kubernetes.core.k8s:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  loop: >-
    {{ _ui_found.resources | default([], true)
       | selectattr('metadata.name', 'equalto', 'oidc-static-' ~ po_build_name) | list }}
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: Say that no issuer was found
  ansible.builtin.debug:
    msg: "No static issuer oidc-static-{{ po_build_name }} was found on central; nothing to unpublish."
  when: (_ui_found.resources | default([], true)) | length == 0
