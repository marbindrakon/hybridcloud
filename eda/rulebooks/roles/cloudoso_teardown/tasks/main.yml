---
# shc (LAB-PLAN §11.6 phase C, design/TENANT-TEARDOWN.md §3.3): a teardown that verifies. It works
# from what provision recorded on the CR status, refuses to delete a project that still holds
# resources (status.deletion lists them; the CR stays Terminating and the operator re-publishes
# with backoff), and sets deletionComplete only after every step succeeded.
- block:
    # nothing on a site (refused at validation): delete without site cleanup
    - name: Skip the site cleanup when nothing was realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/teardown_unrealized.yml"

    - name: Parse event payload
      ansible.builtin.set_fact:
        cloudoso_cr_name: "{{ event_payload.regarding.name }}"
        cloudoso_cr_namespace: "{{ event_payload.regarding.namespace }}"
        teardown_step: read

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read CloudOSO CR from services cluster
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudOSO
        name: "{{ cloudoso_cr_name }}"
        namespace: "{{ cloudoso_cr_namespace }}"
      register: cloudoso_cr_lookup

    - name: Read namespace for the entity name
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Namespace
        name: "{{ cloudoso_cr_namespace }}"
      register: ns_info

    # The account, the DNS account and the Vault paths are derived from the CloudOSO's site and the DNSConfig it
    # recorded (the status holds ids only); an object not yet migrated is read from its old status keys.
    - name: Resolve the CloudOSO's accounts and Vault paths
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloudoso_accounts.yml"
      vars:
        rca_cr: "{{ cloudoso_cr_lookup.resources | default([]) | first | default({}) }}"

    # a provision that failed before recording its project domain: the site's
    - name: Read the CloudOSO's site for the project domain
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ rca_site }}"
      when:
        - rca_site | length > 0
        - ((cloudoso_cr_lookup.resources | default([]) | first | default({})).status | default({}, true)).domainName
          | default('', true) | length == 0

    # a paused site: hold the deletion (its project and DNS live on the site); resumed later by the operator's requeue
    - name: Read the site's pause state
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ rca_site }}"
      when: rca_site | length > 0

    - name: Hold the deletion while the site is paused
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_paused_hold.yml"
      vars:
        sph_plural: cloudosos
        sph_name: "{{ cloudoso_cr_name }}"
        sph_namespace: "{{ cloudoso_cr_namespace }}"
        sph_site: "{{ rca_site }}"
      when: rca_site | length > 0 and (ci_paused | default(false) | bool)

    - name: Set CloudOSO teardown facts from the recorded status
      vars:
        _cr: "{{ cloudoso_cr_lookup.resources | default([]) | first | default({}) }}"
        _st: "{{ _cr.status | default({}) }}"
        _spec: "{{ _cr.spec | default({}) }}"
        _entity: >-
          {{ (ns_info.resources | default([]) | first | default({})).metadata.labels['hybridsovereign.redhat/entity']
             | default(cloudoso_cr_namespace | regex_replace('^entity-', '')) }}
        _site_domain: "{{ ((ci_spec | default({})).openstack | default({})).projectDomain | default('') if rca_site | length > 0 else '' }}"
      ansible.builtin.set_fact:
        cloudoso_entity_for_status: "{{ _st.entity | default(_entity) }}"
        oso_vault_path: "{{ rca_account_vault_path }}"
        oso_project_domain: >-
          {{ _st.domainName | default(_site_domain, true)
             | default(_spec.projectDomain | default(cloudoso_defaults.projectDomain | default(''), true), true) }}
        oso_project_id: "{{ _st.projectId | default('') }}"
        oso_project_name: "{{ _st.projectName | default(_entity ~ '_' ~ cloudoso_cr_name, true) }}"
        oso_fip_ids: "{{ [_st.apiFloatingIPId | default(''), _st.ingressFloatingIPId | default('')] | select | list }}"
        oso_app_cred_ids: "{{ [_st.appCredentialId | default('')] | select | list }}"
        oso_dns_provider: "{{ _st.dnsProvider | default('') }}"
        # design/TENANT-DNS.md: the environment zone ({} for a legacy record)
        oso_env_dns: "{{ _st.dns | default({}, true) }}"
        oso_dns_zone_id: "{{ _st.dnsZoneId | default('') }}"
        oso_dns_project_id: "{{ _st.dnsProjectId | default('') }}"
        oso_domain: "{{ _st.domain | default('') }}"
        oso_base_domain: "{{ _spec.baseDomain | default(cloudoso_defaults.baseDomain | default(''), true) }}"
        oso_route53_vault_path: "{{ rca_route53_vault_path }}"
        oso_vault_paths: "{{ rca_clouds_config_paths if rca_clouds_config_paths | length > 0 else ['oso/projects/' ~ cloudoso_cr_name ~ '/clouds-config'] }}"
        oso_dns_config_secret: "{{ rca_dns_config_secret }}"

    - name: Tear down the OpenStack project
      when: oso_vault_path | length > 0 and oso_project_domain | length > 0
      block:
        - name: Load the OpenStack account
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
          vars:
            os_account_vault_path: "{{ oso_vault_path }}"
            os_account_tag: "cloudoso-teardown-{{ cloudoso_cr_name }}"

        - name: Note the step
          ansible.builtin.set_fact:
            teardown_step: project-empty-check

        - name: Check the project holds nothing but the recorded floating IPs
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
          vars:
            os_call_no_log: false
            os_request:
              action: check-empty
              domain: "{{ oso_project_domain }}"
              project_id: "{{ oso_project_id }}"
              project: "{{ oso_project_name }}"
              allowed_fip_ids: "{{ oso_fip_ids }}"
              # an environment zone holds its own SOA/NS and goes with the environment (T4): no record check
              dns_zone_id: "{{ oso_dns_zone_id if (oso_dns_provider == 'designate' and (oso_env_dns.zoneId | default('')) | length == 0) else '' }}"
              dns_project_id: "{{ oso_dns_project_id }}"
              dns_suffix: "{{ oso_domain }}"

        - name: Refuse to delete a project that still holds resources
          ansible.builtin.fail:
            msg: >-
              Project {{ oso_project_name }} is not empty, kept it.
              {% for kind, items in os_result.found.items() %}{{ kind }}: {{ items | join(', ') }}{{ '; ' if not loop.last }}{% endfor %}
          when: not (os_result.empty | bool)

        - name: Note the step
          ansible.builtin.set_fact:
            teardown_step: openstack-delete

        - name: Delete the recorded floating IPs, application credential and the project
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
          vars:
            os_call_no_log: false
            os_request:
              action: teardown
              domain: "{{ oso_project_domain }}"
              project_id: "{{ oso_project_id }}"
              project: "{{ oso_project_name }}"
              fip_ids: "{{ oso_fip_ids }}"
              fip_descriptions:
                - "sovereign-{{ cloudoso_cr_name }}-api"
                - "sovereign-{{ cloudoso_cr_name }}-ingress"
              app_cred_ids: "{{ oso_app_cred_ids }}"
              app_cred_name: "sovereign-{{ oso_project_name }}"

        - name: Keep the OpenStack teardown result
          ansible.builtin.set_fact:
            oso_teardown_result: "{{ os_result }}"

    # design/TENANT-DNS.md D1 / T4: the environment zone goes with the environment, tenant records and shares
    # included; then its delegation in the global zone (DNSConfig account).
    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: dns-zone

    - name: Delete the environment zone with its shares
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        os_helper: shc_dns.py
        os_call_no_log: false
        os_request:
          action: delete-zone
          owner_project_id: "{{ oso_env_dns.ownerProjectId }}"
          zone_id: "{{ oso_env_dns.zoneId }}"
      when: (oso_env_dns.zoneId | default('')) | length > 0

    - name: Load the DNSConfig account for the delegation
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
      vars:
        os_account_vault_path: "{{ oso_dns_config_secret }}"
        os_account_tag: "cloudoso-teardown-dns-{{ cloudoso_cr_name }}"
      when: (oso_env_dns.zoneId | default('')) | length > 0 and (oso_env_dns.delegated | default(false) | bool)

    - name: Remove the delegation from the global zone
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        os_helper: shc_dns.py
        os_call_no_log: false
        os_request:
          action: delete-delegation
          project_id: "{{ oso_env_dns.globalProjectId }}"
          zone_id: "{{ oso_env_dns.globalZoneId }}"
          name: "{{ oso_env_dns.zone }}"
      when: (oso_env_dns.zoneId | default('')) | length > 0 and (oso_env_dns.delegated | default(false) | bool)

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: dns

    - name: Remove the Route53 slug delegation
      ansible.builtin.include_tasks: delete_route53.yml
      when: oso_dns_provider == 'route53' and oso_domain | length > 0 and oso_route53_vault_path | length > 0

    - name: Note the step
      ansible.builtin.set_fact:
        teardown_step: vault

    # The clouds-config path is name-only: keep it while another tenant's same-named environment uses it
    # (realized: it has a project and was not refused for its name, and is not being deleted).
    - name: List the environments with this name
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudOSO
        field_selectors:
          - "metadata.name={{ cloudoso_cr_name }}"
      register: cloudoso_same_name

    - name: Find the other tenants' environments with this name
      vars:
        _others: "{{ cloudoso_same_name.resources | default([]) | rejectattr('metadata.namespace', 'equalto', cloudoso_cr_namespace) | list }}"
      ansible.builtin.set_fact:
        cloudoso_name_in_use: >-
          {%- set ns = namespace(used=false) -%}
          {%- for o in _others if o.metadata.deletionTimestamp is not defined -%}
            {%- set st = o.status | default({}, true) -%}
            {%- set ready = (st.conditions | default([], true)) | selectattr('type', 'equalto', 'Ready') | list -%}
            {%- if (st.projectId | default('', true)) | length > 0 and not (ready and ((ready | first).reason | default('')) == 'NameInUse') -%}
              {%- set ns.used = true -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.used }}
        # the oldest one refused for this name gets its turn once this one is gone
        cloudoso_name_waiting: >-
          {%- set out = [] -%}
          {%- for o in _others | sort(attribute='metadata.creationTimestamp') if o.metadata.deletionTimestamp is not defined -%}
            {%- set ready = ((o.status | default({}, true)).conditions | default([], true)) | selectattr('type', 'equalto', 'Ready') | list -%}
            {%- if ready and ((ready | first).reason | default('')) == 'NameInUse' -%}
              {%- set _ = out.append({'kind': 'CloudOSO', 'namespace': o.metadata.namespace, 'name': o.metadata.name}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out[:1] }}

    - name: Delete the project's Vault paths
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_delete.yml"
      vars:
        vault_kv_delete_paths: "{{ oso_vault_paths }}"
      when: not (cloudoso_name_in_use | bool)

    - name: Get deletion reconcile timestamp
      ansible.builtin.set_fact:
        cloudoso_delete_status_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
        cloudoso_leftover_sgs: "{{ oso_teardown_result.default_security_groups | default([]) }}"

    - name: Mark CloudOSO deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudosos
        cr_name: "{{ cloudoso_cr_name }}"
        cr_namespace: "{{ cloudoso_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          deletion: null
          lastReconciledAt: "{{ cloudoso_delete_status_time }}"
          name: "{{ cloudoso_cr_name }}"
          namespace: "{{ cloudoso_cr_namespace }}"
          entity: "{{ cloudoso_entity_for_status }}"
          leftoverDefaultSecurityGroups: "{{ cloudoso_leftover_sgs }}"
          message: >-
            CloudOSO {{ cloudoso_cr_name }} teardown complete.
            {{ ('Default security group ' ~ (cloudoso_leftover_sgs | join(', ')) ~
                ' is left for a cloud admin (Neutron reserves that delete).') if cloudoso_leftover_sgs else '' }}

    # after deletionComplete, so the waiting environment no longer counts this one as the name's holder
    - name: Give the name to the environment that waits for it
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: "{{ cloudoso_name_waiting }}"
      when: cloudoso_name_waiting | length > 0

  rescue:
    - name: Mark CloudOSO delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        _msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA teardown failed')) }}"
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudosos
        cr_name: "{{ cloudoso_cr_name }}"
        cr_namespace: "{{ cloudoso_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ _msg }}"
          deletion:
            failed: true
            step: "{{ teardown_step | default('read') }}"
            message: "{{ _msg }}"
            at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "CloudOSO {{ cloudoso_cr_name | default('unknown') }} EDA teardown failed at {{ teardown_step | default('read') }}"

  always:
    - name: Remove the account's temp files
      ansible.builtin.file:
        path: "/tmp/eda-cloudoso-teardown-{{ item }}"
        state: absent
      loop:
        - "{{ cloudoso_cr_name | default('unknown') }}-clouds.yaml"
        - "{{ cloudoso_cr_name | default('unknown') }}-ca.crt"
        - "dns-{{ cloudoso_cr_name | default('unknown') }}-clouds.yaml"
        - "dns-{{ cloudoso_cr_name | default('unknown') }}-ca.crt"
