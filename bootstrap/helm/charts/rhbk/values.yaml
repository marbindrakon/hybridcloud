operator:
  channel: stable-v26.4
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: rhbk-operator

namespace: rhbk

instanceName: sovereign-keycloak

pushSecretToVault: false
vaultSecretPath: "central/data/keycloak-admin"

keycloak:
  enabled: true
  instances: 2
  hostname: ""
  db:
    enabled: false
    vendor: postgres
    host: ""
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
    # Properties appended to the database's JDBC URL (Keycloak's db-url-properties), with their leading separator.
    # auto: with the chart's own database (crunchy.enabled) "?targetServerType=primary", so the driver accepts only
    # the primary: after a fail-over a connection to the former primary, now read-only, is refused and opened again
    # instead of failing every write. With another database nothing is added. Empty: nothing is added.
    urlProperties: auto
    # The longest a database connection lives (Keycloak's db-pool-max-lifetime: 10m, 600 for seconds, or PT10M). A
    # connection is closed when it is returned after this time and a new one is opened when needed, so a connection
    # that went stale, for whatever reason, is replaced within this time. Empty: connections live until they fail.
    poolMaxLifetime: 10m
    crunchy:
      enabled: false
      name: rhbk-pgcluster
      instances: 2
      storage: 10Gi
      backupStorage: 10Gi
      # Patroni's fail-safe mode on the database (failsafe_mode): while the primary cannot reach the Kubernetes API
      # but still reaches every other member, it stays primary instead of making itself read-only. Off by default;
      # turning it on changes how every fail-over of this database is decided.
      patroniFailsafe: false
      # Backups of the database (schedules are cron, UTC). A full backup on fullSchedule and a differential one on
      # differentialSchedule (empty: none; it must not fall on the full backup's day and minute). retentionFull full
      # backups are kept, with the differential ones and the write-ahead log that follow them: the database can be
      # restored to any moment since the oldest kept full backup, about retentionFull times the full interval back.
      # Of the differential backups the newest retentionDifferential are kept. Older ones expire when a backup
      # completes. Size the backup volume for retentionFull + 1 full backups, retentionDifferential differential
      # ones, and the write-ahead log of retentionFull + 1 full intervals.
      backup:
        retentionFull: 2
        retentionDifferential: 2
        fullSchedule: "20 1 * * 0"
        differentialSchedule: "20 1 * * 1-6"
        # The waiting archive (pgBackRest archive-push-queue-max). When write-ahead log cannot be archived, for
        # example because the backup volume is full or unreachable, the segments wait in the data volume. Past this size
        # they are dropped and the database's log says "dropped WAL file ... because archive queue exceeded ...": the
        # database keeps running instead of filling its data volume and stopping, but it can no longer be restored to a
        # moment between the drop and the next completed backup. auto: a quarter of storage (storage must then be a whole
        # number of Mi, Gi or Ti); a size such as 4GiB or 2560MiB; empty: no limit (the data volume fills and the
        # database stops).
        # 0 is refused, as is more than 4PiB; a plain number is bytes. On a data volume more than three quarters
        # full the default is more than the free space: then set a size below the free space.
        archivePushQueueMax: auto
  # Further Keycloak server options (spec.additionalOptions), after the chart's own: entries {name, value} or
  # {name, secret: {name, key}} as the Keycloak resource takes them, each name once. A value is a text, a whole
  # number up to 2^53 or true or false (rendered as text); null, a map, a list or a fraction is refused. The options
  # the chart sets itself (http-enabled, hostname-strict, db-url-properties, db-pool-max-lifetime) are refused here,
  # and so are db, db-username, db-password and every option starting with db-url (the database fields set them).
  # The list is applied whole: an option set by hand on the Keycloak object and not listed here is removed at the
  # next sync.
  additionalOptions: []
  tls:
    enabled: false
    secretName: keycloak-tls-secret
  # The operator's own Ingress for the host name above. OpenShift turns it into a Route that serves the router's
  # default certificate and carries the label app=keycloak. Set false when the routes below serve the Keycloak.
  ingress:
    enabled: true
  # Routes this chart owns, to the Keycloak's HTTP port (edge TLS, plain HTTP redirected; needs tls.enabled false).
  # Each entry:
  #   name         Route name (default <instanceName>-route-<index>)
  #   host         the public host name (required)
  #   primary      true: the Route carries the label app=keycloak, by which the platform's automation finds the
  #                Keycloak's public address. At most one Route may carry it, so primary needs ingress.enabled false
  #                (the operator's Route carries the label too). Make the primary Route's host the host name above:
  #                it is the issuer's host.
  #   certificate  empty: the router's default certificate. Else a cert-manager Certificate for the host, served
  #                through the Route's externalCertificate (the router gets read access to that one Secret):
  #     clusterIssuer  name of the ClusterIssuer (required)
  #     secretName     default <route name>-tls
  #     privateKey     {algorithm, size}, default ECDSA 256. With Let's Encrypt an ECDSA key is signed under its
  #                    ECDSA chain and an RSA key under its RSA chain: a client that trusts a pinned CA bundle rather
  #                    than the system roots (for example a bundle copied from the cluster's ingress certificate)
  #                    accepts only the chain that bundle holds. Keep the algorithm of the certificate the clients
  #                    trust today.
  # A Route for the host name above while ingress.enabled is true is refused when the chart is rendered: the
  # operator's Route holds that host. Sync waves: the Keycloak 5, the Certificates and the router's read access
  # certificateSyncWave, the Routes routeSyncWave. A change that turns the operator's Ingress off and adds a Route
  # for its host reaches the Route once the Keycloak is healthy again (the operator has removed its Ingress), and a
  # Route is created only once its certificate is issued.
  routes: []
  certificateSyncWave: "6"
  routeSyncWave: "7"
