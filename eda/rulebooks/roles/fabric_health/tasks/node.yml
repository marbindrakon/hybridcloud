---
# One border gateway node, read only (files/shc_node_health.py on stdin of python3 on the node, its input in argv).
# The reader bounds each command it runs; the whole read is bounded on the node by timeout (health
# nodeReadTimeoutSeconds) and here by the same time plus the SSH connect. An unreachable node or a read that failed
# is recorded as such. Appends {name, reachable, error?, read?} to fh_nodes.
- name: "{{ bgw_node.name }}: read the node"
  vars:
    _limit: "{{ fh_health.nodeReadTimeoutSeconds | default(60, true) | int }}"
  ansible.builtin.command:
    argv:
      - timeout
      - -k
      - "5"
      - "{{ _limit }}"
      - python3
      - "-"
      - "{{ fh_reader_input | to_json | b64encode }}"
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/../../../common/files/shc_node_health.py') }}"
  register: _fh_read
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  # the node's limit (the reader's own plus 15 s, bgw_node_limit) plus the SSH client's dead-peer time and a margin
  timeout: "{{ (fh_health.nodeReadTimeoutSeconds | default(60, true) | int) + 15 + 60 }}"
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: keep the read"
  # (the reader's line is read and parsed within one expression: as a variable of its own, ansible-core 2.16 would
  # turn the JSON text into a dict before the test for it ran)
  vars:
    _unreachable: "{{ _fh_read.unreachable | default(false) | bool }}"
    _ok: >-
      {{ not (_unreachable | bool) and _fh_read.rc | default(1) == 0
         and ((_fh_read.stdout | default('', true)).splitlines() | last | default('') | string | trim).startswith('{') }}
  # an unreachable node (SSH) and a node that answered but whose read failed or ran out of time are told apart: the
  # second has no read (the judge reports ReadFailed, not NodeUnreachable)
  ansible.builtin.set_fact:
    fh_nodes: >-
      {{ fh_nodes + [{'name': bgw_node.name, 'reachable': not (_unreachable | bool)}
                     | combine({'read': ((_fh_read.stdout | default('', true)).splitlines() | last | default('') | trim) | from_json}
                               if _ok | bool else
                               {'error': ('the node did not answer over SSH' if _unreachable | bool
                                          else ('the read ran out of time' if _fh_read.rc | default(0) == 124
                                                else 'the read failed (exit ' ~ _fh_read.rc | default('?') ~ ')'))})] }}
