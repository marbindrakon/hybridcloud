namespace: openshift-cnv

subscription:
  channel: stable
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace

hyperconverged:
  enabled: true
  name: kubevirt-hyperconverged
  featureGates:
    deployKubeSecondaryDNS: false
    enableCommonBootImageImport: false
  # infra node placement tolerations — empty means schedule on any available node
  infra:
    nodePlacement: {}
  workloads:
    nodePlacement: {}

# Dedicated live-migration network (optional): a macvlan NetworkAttachmentDefinition on a host interface
# with whereabouts IPAM (a non-routed range is enough), and HyperConverged liveMigrationConfig.network.
migrationNetwork:
  enabled: false
  name: migration-network
  type: macvlan
  master: ""   # host interface, e.g. bond1.239
  range: ""    # whereabouts range, e.g. 10.239.0.0/24
  mtu: 0       # 0 = the interface's MTU

pdb:
  virtApi:
    enabled: true
    minAvailable: 1
  virtController:
    enabled: true
    minAvailable: 1
