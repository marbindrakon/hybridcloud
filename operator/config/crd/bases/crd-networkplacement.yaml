apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkplacements.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: NetworkPlacement
    listKind: NetworkPlacementList
    plural: networkplacements
    singular: networkplacement
    shortNames:
      - nplace
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Places a HybridNetwork on one cloud environment of the same Entity: a CloudOSO (an OpenStack project)
            or a CloudVirt (OpenShift Virtualization). The platform creates the network there with the given
            subnets and connects it, through the site's CloudGateway, to the network's other placements. On a
            CloudVirt, the network serves every namespace of the environment that names it (CloudVirt
            spec.namespaces). The environment's site must offer EVPN and have a CloudGateway. A CloudVirt placement
            is deleted only after no namespace of the environment names the network.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [network, backend, prefixes]
              properties:
                network:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: The HybridNetwork (this namespace) to place. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.network is immutable
                backend:
                  type: object
                  description: The cloud environment (this namespace) the network is placed on. Immutable.
                  required: [kind, name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.backend is immutable
                  properties:
                    kind:
                      type: string
                      enum: [CloudOSO, CloudVirt, CloudAWS]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                prefixes:
                  type: array
                  description: >-
                    IPv4 subnets of the network at this placement. They must not overlap the network's other
                    placements or the site's own networks. The first usable address of each is the gateway.
                    Immutable.
                  minItems: 1
                  maxItems: 16
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.prefixes is immutable
                  items:
                    type: string
                    maxLength: 43
                    x-kubernetes-validations:
                      - rule: isCIDR(self) && cidr(self).ip().family() == 4 && cidr(self) == cidr(self).masked()
                        message: each prefix must be an IPv4 network prefix (host bits zero)
                      - rule: "!isCIDR(self) || (cidr(self).prefixLength() >= 8 && cidr(self).prefixLength() <= 29)"
                        message: prefix length must be between 8 and 29
            status:
              type: object
              properties:
                entity:
                  type: string
                site:
                  type: string
                  description: The CloudInfrastructure the backend runs on.
                cloudGateway:
                  type: string
                  description: The CloudGateway that connects this placement.
                l3Vni:
                  type: integer
                  description: The placement's IP-VRF VNI inside its site.
                l2Vni:
                  type: integer
                  description: The placement's MAC-VRF VNI inside its site (CloudVirt).
                realization:
                  type: object
                  description: How the platform realized the placement (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                mtu:
                  type: integer
                  description: Effective MTU at this placement.
                realizedPrefixes:
                  type: array
                  items:
                    type: string
                namespaces:
                  type: array
                  description: CloudVirt site namespaces the network serves (the environment's namespaces that name it).
                  items:
                    type: string
                backendReady:
                  type: boolean
                gatewayReady:
                  type: boolean
                validated:
                  type: boolean
                lastValidatedAt:
                  type: string
                  format: date-time
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  type: string
                ready:
                  type: boolean
                waitingFor:
                  type: array
                  description: What a pending placement waits for.
                  items:
                    type: string
                deletionComplete:
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Backend
          type: string
          jsonPath: .spec.backend.kind
        - name: Name
          type: string
          jsonPath: .spec.backend.name
        - name: Site
          type: string
          jsonPath: .status.site
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
