# the core side must come up: IS-IS adjacency with the root and the VPNv4 session to the route reflector; with the
# IPv6 core (cg_pe.loopback6) also IPv6 forwarding in the namespace, VPNv6 negotiated with the route reflector and its
# IPv6 loopback installed from IS-IS (prints ipv6Vpn=<state> for the node record). On the SRv6 core (fab_node_transport
# srv6) no MPLS input and no session over the IPv4 loopbacks: the SRv6 check below instead
- name: "{{ bgw_node.name }}: wait for the core (IS-IS, VPNv4 and VPNv6) and the upstream route reflectors"
  ansible.builtin.shell: |
    set -e
    V="vtysh -N gw-{{ fab_name }}"
    {% if fab_node_transport | default('mpls') != 'srv6' %}
    # MPLS input on the core leg (a reload that disagreed with the kernel turned it off once)
    [ "$(ip netns exec gw-{{ fab_name }} sysctl -n net.mpls.conf.core0.input)" = 1 ]
    # the IPv4 local rule after the l3mdev rule of the VRFs, so a packet from a VRF never reaches the default VRF local
    # addresses; a namespace with no VRF device has no l3mdev rule: there exactly one lookup local rule, at 32765 where
    # the apply puts it; no l3mdev rule while VRF devices exist fails, naming them (on srv6: the SRv6 check below)
    v=$(ip -n gw-{{ fab_name }} -br link show type vrf)
    rc=0; ip -n gw-{{ fab_name }} -4 rule show | awk -v vrfs="$v" '$(NF-1) == "lookup" && $NF == "[l3mdev-table]" {p = $1 + 0; if (!m || p < mp) mp = p; m = 1} $(NF-1) == "lookup" && $NF == "local" {p = $1 + 0; if (!l || p < lp) lp = p; l = 1; n++} END {if (m) exit !(l && lp > mp); if (vrfs != "") exit 2; exit !(n == 1 && lp == 32765)}' || rc=$?
    if [ "$rc" = 2 ]; then echo "no IPv4 l3mdev rule (VRF devices: $(printf '%s\n' "$v" | awk '{print $1}' | paste -sd ' ' -))" >&2; exit 1; fi
    [ "$rc" = 0 ] || { echo "the IPv4 rule lookup local is not after the l3mdev rule of the VRFs (a packet from a VRF reaches the default VRF local addresses)" >&2; exit 1; }
    {% endif %}
    $V -c 'show isis neighbor' | grep -q ' Up '
    {% if fab_node_transport | default('mpls') != 'srv6' %}
    $V -c 'show bgp ipv4 vpn summary json' | python3 -c '
    import json, sys
    p = json.load(sys.stdin).get("peers", {}).get(sys.argv[1], {})
    sys.exit(0 if p.get("state") == "Established" else 1)' {{ cg_root_pe.loopbackIp }}
    {% endif %}
    $V -c 'show bgp l2vpn evpn summary json' | python3 -c '
    import json, sys
    peers = json.load(sys.stdin).get("peers", {})
    sys.exit(0 if all(peers.get(r, {}).get("state") == "Established" for r in sys.argv[1:]) else 1)' {{ fab_spec.siteUnderlay.upstreamRouteReflectors | default([]) | join(' ') }}
    $V -c 'show vrf vni json' | python3 -c '
    import json, sys
    up = {v.get("vrf"): str(v.get("state", "")).lower() for v in json.load(sys.stdin).get("vrfs", [])}
    sys.exit(0 if all(up.get(n) == "up" for n in sys.argv[1:]) else 1)' {{ cg_vrfs | map(attribute='vrf') | join(' ') }}
    {% if fab_node_transport | default('mpls') == 'srv6' %}
    # SRv6 core: IPv6 forwarding, the namespace's kernel settings for SRv6 (strict mode, no routing header accepted on
    # all, default and the core leg, the rule to the SID block, the IPv4 local rule after the l3mdev rule of the VRFs, the
    # guard with its drop rule), the gateway's locator
    # anchor on lo and its prefix in the own IS-IS LSP, and the VPN session to the route reflector over
    # the IPv6 loopbacks with VPNv4 and VPNv6 negotiated, the root's IPv6 loopback and locator installed from IS-IS. Same
    # check code as the root's. Prints ipv6Vpn=<state> for the node record.
    [ "$(ip netns exec gw-{{ fab_name }} sysctl -n net.ipv6.conf.all.forwarding)" = 1 ]
    python3 -c '
    import ipaddress, json, re, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def addr(text):
        """An address as the canonical text FRR prints, None when it is none."""
        try:
            return str(ipaddress.ip_address(str(text).split("%")[0]))
        except ValueError:
            return None


    def announced(text, loc):
        """Whether the instance own LSPs (show isis database detail: the LSP ID lines marked with *) announce loc."""
        own = False
        for line in text.splitlines():
            w = line.split()
            if w and re.fullmatch(r"\S+\.[0-9a-f]{2}-[0-9a-f]{2}", w[0]):
                own = len(w) > 1 and w[1] == "*"
            elif own and w[:2] == ["IPv6", "Reachability:"] and len(w) > 2:
