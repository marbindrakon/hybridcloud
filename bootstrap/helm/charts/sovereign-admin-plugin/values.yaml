namespace: sovereign-cloud

image:
  repository: /hybrid-sovereign/sovereign-admin-plugin
  tag: "img-1.4.3"
  pullPolicy: Always

imagePullSecrets:
  - name: quay-pull-secret

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  port: 9001

plugin:
  name: sovereign-admin-plugin
  displayName: "Sovereign Cloud"

proxy:
  - alias: uihealth
    service:
      name: sovereign-cloud-dashboard
      port: 8443
