---
# What the platform was doing, in plain words, when a call to a cloud, a site, the hub or a helper fails: the shared
# call tasks (common/tasks/*_call.yml, openstack_account.yml, fabric_check.yml, central_create.yml) then fail
# with the platform's sentence for the step and write what was answered to the job's log only. A step sets its
# own words where it includes them.
shc_step: Provision the cluster
shc_step_what: provisioning
platformopenshift_operator_namespace: sovereign-cloud
eda_central_work_namespace: sovereign-cloud-jobs
# Central API for the ACM policy calls in keycloak_oidc.yml / cluster_rbac.yml: the connection the
# job resolved from Vault (aap-central-cluster-sa), not a hostname baked into the role.
central_api_server: "{{ central_api_host | default('') }}"
keycloak_external_url: "{{ lookup('env', 'KEYCLOAK_EXTERNAL_URL') }}"
keycloak_realm: "{{ lookup('env', 'KEYCLOAK_REALM') | default('sovereign-tenants', true) }}"
# shc (§11.6 phase C): RHBK admin account in central Vault (the RbacConfig's secret)
keycloak_admin_vault_path: rhbk-services-admin
# Name of the identity provider the cluster's OAuth gets (keycloak_oidc.yml); also the last path segment of the sign-in
# client's only redirect URI, https://oauth-openshift.apps.<cluster domain>/oauth2callback/<name>
platformopenshift_oidc_idp_name: keycloak-sso

# shc (§11.6 phase C): installation settings through the sovereign-localhost inventory variable
# `platformopenshift_defaults` (config-as-code env PLATFORMOPENSHIFT_DEFAULTS). A CR field wins.
# Keys: ocpImageSet, pullSecretVaultPath, pullSecretVaultProperty, sshKeyVaultPath, allowedVaultPaths,
# allowedPullSecretProperties, controlPlaneCount, workerCount, controlPlaneFlavor, workerFlavor, glanceImage, externalDNS (list:
# clusters on a site's external network; on a hybrid network the placement's resolvers, cluster_resolvers.yml),
# mceClusterBuildChart (oci:// ref), mceClusterBuildChartVersion. Fallbacks are upstream's.
platformopenshift_defaults: {}
default_pull_secret_vault_path: "{{ platformopenshift_defaults.pullSecretVaultPath | default('aws/ocp-pull-secret') }}"
default_pull_secret_vault_property: "{{ platformopenshift_defaults.pullSecretVaultProperty | default('pull_secret') }}"
default_ssh_key_vault_path: "{{ platformopenshift_defaults.sshKeyVaultPath | default('aws/ocp-ssh-key') }}"
# Central Vault paths (and pull-secret properties) a PlatformOpenshift spec may name in
# spec.openstack.{pullSecretVaultPath,sshKeyVaultPath,pullSecretVaultProperty}. The jobs read these with the
# platform's Vault token, so a spec value outside these lists is ignored and the defaults above apply
# (platformopenshift_defaults keys allowedVaultPaths, allowedPullSecretProperties; empty: the spec never chooses).
platformopenshift_allowed_vault_paths: "{{ platformopenshift_defaults.allowedVaultPaths | default([], true) }}"
platformopenshift_allowed_pull_secret_properties: "{{ platformopenshift_defaults.allowedPullSecretProperties | default([], true) }}"
default_ocp_image_set: "{{ platformopenshift_defaults.ocpImageSet | default('img4.21.9-x86-64-appsub') }}"
default_control_plane_count: "{{ platformopenshift_defaults.controlPlaneCount | default(3) }}"
default_worker_count: "{{ platformopenshift_defaults.workerCount | default(3) }}"
# the flavors of an OpenStack cluster's nodes when its spec names none: no fallback (a site's flavor names are its own);
# a cluster that needs one that is not set fails with the setting's name (openstack.yml)
default_control_plane_flavor: "{{ platformopenshift_defaults.controlPlaneFlavor | default('', true) }}"
default_worker_flavor: "{{ platformopenshift_defaults.workerFlavor | default('', true) }}"
# Empty: the installer uploads the release's own RHCOS image into the project.
default_glance_image_override: "{{ platformopenshift_defaults.glanceImage | default('') }}"

vault_init_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://vault-active.central-vault.svc:8200', true) }}"
oci_registry_host: "{{ lookup('env', 'OCI_HOST') | trim }}"
mce_cluster_build_chart: >-
  {{ platformopenshift_defaults.mceClusterBuildChart
     | default('oci://' ~ oci_registry_host ~ '/hybrid-sovereign/mce-cluster-build', true) }}
mce_cluster_build_chart_version: "{{ platformopenshift_defaults.mceClusterBuildChartVersion | default('0.2.0') }}"
# The ACM ManagedClusterSet every cluster these jobs build joins (platformopenshift_defaults key
# managedClusterSet). It holds tenant-built clusters only: the Assignment policy namespace on the hub binds
# this set alone, so an Assignment's Placement can never select the hub or a platform cluster.
platformopenshift_managed_cluster_set: "{{ platformopenshift_defaults.managedClusterSet | default('sovereign-tenant-clusters', true) }}"

# The platform namespace (HybridFabric, CloudInfrastructure), as in the fabric roles.
fabric_platform_namespace: sovereign-cloud
# The cluster's own address ranges when spec.networking leaves them out: platformopenshift_defaults key networking
# ({clusterNetwork, hostPrefix, serviceNetwork, machineNetwork}) over OpenShift's documented defaults.
platformopenshift_networking_defaults:
  clusterNetwork: 10.128.0.0/14
  hostPrefix: 23
  serviceNetwork: 172.30.0.0/16
  machineNetwork: 10.0.0.0/16
platformopenshift_networking: >-
  {{ platformopenshift_networking_defaults | combine(platformopenshift_defaults.networking | default({}, true)) }}
# A cluster on a hybrid network: how long the job waits for the fabric to carry its addresses in the platform's
# service routing domain before it reports WaitingForPlatformAccess (and re-checks on the reconcile period).
platformopenshift_service_wait_retries: 30
platformopenshift_service_wait_delay: 20

# The watch of a cluster's installation (platformopenshift_defaults key install; each number has its place here):
# observeIntervalSeconds  how often the job looks at the installation on the hub
# watchWindowMinutes      how long one job watches; then it writes "still installing" and the next run watches on
#                         (below the provision template's time limit, aap-config/controller/job_templates.yml)
# deadlineMinutes         an installation neither finished nor stopped after this long is shown failed
#                         (InstallOverdue); each periodic run then checks it once
# pendingReleaseMinutes   a pending release of a build with no ClusterDeployment younger than this is an older job's
#                         release being made: a Retry leaves it alone (older: removed like a failed one)
# removalLimitMinutes     a removal of a stopped installation that waits this long (from its start) beside a build Hive
#                         does not finish deleting is written as failed (InstallRemovalFailed) for the platform team
# namespaceWaitMinutes    a cluster whose build's namespace on the hub is still held by an earlier cluster of the same
#                         name (terminating) waits this long from its first wait (WaitingForEarlierCluster), then is
#                         refused (NamespaceTaken) for the platform team
# retryMarginMinutes      a Retry request on a stopped installation asks for a new one when its own time is after the
#                         stop was written, or when it was published more than this long after the write
# checkWriteMinutes       the check time (status.install.observedAt) is written at least this often while nothing
#                         changes; the operator's in-flight check reads it (operator/roles/_common/tasks/
#                         skip_if_event_in_flight.yml)
platformopenshift_install_defaults:
  observeIntervalSeconds: 30
  watchWindowMinutes: 120
  deadlineMinutes: 360
  checkWriteMinutes: 5
  pendingReleaseMinutes: 10
  removalLimitMinutes: 60
  namespaceWaitMinutes: 30
  retryMarginMinutes: 1
platformopenshift_install: >-
  {{ platformopenshift_install_defaults | combine(platformopenshift_defaults.install | default({}, true)) }}
