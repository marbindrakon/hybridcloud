---
# status.egress of the network, per family (status is merge-patched: a field left out keeps its old value, so
# fields that don't apply are written as null).
#   IPv4 (the network has IPv4 prefixes): source NAT on the fabric's egress: pending | ready | removing | unavailable
#   IPv6: mode Platform = routed from the assigned block: pending | ready (reason Degraded while some node of the
#         fabric has no upstream session) | removing, unavailable (reason UpstreamDown) while no node of the fabric
#         has one, or unavailable while the fabric offers no IPv6 egress (NotOffered);
#         mode Tenant = no internet access for tenant-provided prefixes (AddressChoice); mode None = no row
#   internet (overall) = the IPv4 state when the network has IPv4, else the IPv6 state
#   ipv4Translation: for a network without IPv4 that wants internet access, by path (each IPv6-only placement's
#         status.ipv6.translation names the path it uses, its prefix and resolvers):
#           Fabric   (IPv6 space from the network, the platform's translator): usable while the fabric offers IPv6
#                    egress and a site of the realization has a translation entry with a prefix; its state is the
#                    state of the IPv6 row (pending | ready; unavailable, UpstreamDown while that row is down)
#           Provider (IPv6 space from a cloud provider, the provider's translator): offered while a site of the
#                    realization has a translation entry with provider: true; nothing of the network's own is
#                    involved (the placement's site side builds it), so it is ready while offered
#         mode Tenant = unavailable (AddressChoice: neither path serves tenant-provided prefixes); mode Platform =
#         unavailable (NotOffered) while neither path is offered, else ready when a path is ready, else pending;
#         without the provider's path the row is exactly the fabric path's
# Written while spec.egress.internet is on, or while the fabric still removes an egress; {} otherwise.
# Inputs: hn_v4, hn_mode6, hn_egress_want, hn_egress_want6, hn_egress_offered, hn_egress_offered6, hn_egress_carried
# (the fabric's entry for the network: ipv6 true while its IPv6 egress is realized), hn_egress6_degraded,
# hn_egress6_degraded_nodes, hn_egress6_nodes (the fabric's nodes that report an IPv6 egress; default none: then
# "every node down" is never concluded), hn_fabric_name, hn_translation_offered (a site of the fabric's realization has a
# translation entry with a prefix; default false), hn_translation_provider_offered (a site of the fabric's realization
# has a translation entry with provider: true; default false).
# Sets hn_egress, hn_egress_note.
- name: Set the egress state per family
  vars:
    _v4: "{{ hn_v4 | length > 0 }}"
    _want: "{{ hn_egress_want | bool }}"
    _carried: "{{ hn_egress_carried | default({}, true) | length > 0 }}"
    # the fabric's entry says which side it realizes: internet = the IPv4 default route and source NAT (false for a
    # network without IPv4), ipv6 = the IPv6 egress
    _carried4: "{{ _carried | bool and ((hn_egress_carried | default({}, true)).internet | default(true) | bool) }}"
    _carried6: "{{ (hn_egress_carried | default({}, true)).ipv6 | default(false) | bool }}"
    # the IPv6 egress's nodes without an upstream session: some (Degraded, still ready) or every one (down)
    _down6: "{{ hn_egress6_degraded_nodes | default([], true) | sort }}"
    _all_down6: >-
      {{ (hn_egress6_degraded | default(false) | bool) and (hn_egress6_nodes | default([], true) | length > 0)
         and (hn_egress6_nodes | default([], true) | difference(_down6) | length == 0) }}
    _want4: "{{ _want | bool and _v4 | bool }}"
    _want6: "{{ hn_egress_want6 | default(false) | bool }}"
    _state4: >-
      {{ 'unavailable' if (_want4 | bool and not hn_egress_offered | bool)
         else ('ready' if (_want4 | bool and _carried4 | bool)
         else ('pending' if _want4 | bool else ('removing' if _carried4 | bool else ''))) }}
    _row4: >-
      {{ {} if _state4 | trim == ''
         else ({'family': 4, 'state': _state4 | trim, 'mode': 'SourceNAT'}
               | combine({'reason': 'NotOffered', 'message': 'internet access is not offered on this fabric'}
                         if _state4 | trim == 'unavailable' else {})) }}
    _state6: >-
      {{ '' if (hn_mode6 == 'None' or (not _want | bool and not _carried6 | bool))
         else ('removing' if not _want | bool
         else ('choice' if hn_mode6 != 'Platform'
         else ('unavailable' if not hn_egress_offered6 | default(false) | bool
         else ('ready' if _carried6 | bool else 'pending')))) }}
    _row6: >-
      {{ {} if _state6 | trim == ''
         else ({'family': 6, 'state': 'unavailable', 'reason': 'AddressChoice',
                'message': 'IPv6 internet: not offered for tenant-provided prefixes'} if _state6 | trim == 'choice'
         else ({'family': 6, 'state': 'unavailable', 'mode': 'Routed', 'reason': 'NotOffered',
                'message': 'IPv6 internet access is not offered on this fabric yet'} if _state6 | trim == 'unavailable'
         else ({'family': 6, 'state': 'unavailable', 'mode': 'Routed', 'reason': 'UpstreamDown',
                'message': 'IPv6 internet access is down: no node of the fabric has an upstream session ('
                           ~ (_down6 | join(', ')) ~ ')'}
               if (_state6 | trim == 'ready' and _all_down6 | bool)
         else ({'family': 6, 'state': _state6 | trim, 'mode': 'Routed'}
               | combine({'reason': 'Degraded',
                          'message': 'IPv6 internet works through part of the fabric: '
                                     ~ (_down6 | join(', '))
                                     ~ (' has' if _down6 | length == 1 else ' have') ~ ' no upstream session; '
                                     ~ 'connections that only receive data may have reset'}
                         if (_state6 | trim == 'ready' and hn_egress6_degraded | default(false) | bool) else {}))))) }}
    # translation by path: the fabric's (its state follows the IPv6 row; '' = not usable) and the provider's
    _tr_fabric: >-
      {{ _row6.state if (hn_egress_offered6 | default(false) | bool and hn_translation_offered | default(false) | bool
                         and _row6.state | default('') in ['pending', 'ready', 'removing'])
         else '' }}
    # the fabric's translator is offered but the IPv6 internet access it rides is down
    _tr_fabric_down: >-
      {{ hn_egress_offered6 | default(false) | bool and hn_translation_offered | default(false) | bool
         and _row6.reason | default('') == 'UpstreamDown' }}
    _tr_provider: "{{ hn_translation_provider_offered | default(false) | bool }}"
    # (a var can't hold null on every Ansible version: empty means "does not apply", written as null below)
    _translation: >-
      {{ {} if (_v4 | bool or not _want | bool)
         else ({'state': 'unavailable', 'reason': 'AddressChoice',
                'message': 'translation to IPv4 needs IPv6 address space from the platform'}
               if hn_mode6 != 'Platform'
         else ({'state': 'unavailable', 'reason': 'UpstreamDown',
                'message': "translation to IPv4 is down with the network's IPv6 internet access: no node of the "
                           ~ 'fabric has an upstream session'}
               if (_tr_fabric_down | bool and not _tr_provider | bool)
         else ({'state': 'unavailable', 'reason': 'NotOffered',
                'message': 'translation to IPv4 is not offered on this fabric yet'}
               if (_tr_fabric | trim == '' and not _tr_provider | bool)
         else ({'state': _tr_fabric | trim}
               | combine({'message': "IPv6-only placements reach IPv4-only destinations through the platform's "
                                     ~ "translator on the sites that offer it; each placement's status names its "
                                     ~ 'translation prefix and resolvers'}
                         if _tr_fabric | trim == 'ready' else {})
               if not _tr_provider | bool
         else ({'state': 'ready',
                'message': "IPv6-only placements reach IPv4-only destinations on the sites that offer it: with IPv6 "
                           ~ "space from the network through the platform's translator, with space from the cloud "
                           ~ "provider through the provider's translator; each placement's status names its path, "
                           ~ 'translation prefix and resolvers'}
               if _tr_fabric | trim == 'ready'
         else {'state': 'ready',
               'message': "IPv6-only placements with IPv6 space from the cloud provider reach IPv4-only destinations "
                          ~ "through the provider's translator on the sites that offer it; each placement's status "
                          ~ 'names its path, translation prefix and resolvers. Placements with space from the network '
                          ~ ("get translation once the network's IPv6 internet access is ready"
                             if _tr_fabric | trim != ''
                             else ("have none while the network's IPv6 internet access is down"
                                   if _tr_fabric_down | bool
                                   else "have none: the platform's translator is not offered on this fabric yet"))}))))) }}
    _rows: "{{ ([_row4] if _row4 | length > 0 else []) + ([_row6] if _row6 | length > 0 else []) }}"
    _overall: "{{ _row4.state if _row4 | length > 0 else (_row6.state | default('')) }}"
  ansible.builtin.set_fact:
    hn_egress: >-
      {{ {} if _rows | length == 0
         else {'internet': _overall,
               'sourceAddresses': hn_egress_carried.sourceAddresses
                                  if (_row4.state | default('') == 'ready') else none,
               'families': _rows,
               'ipv4Translation': _translation if _translation | length > 0 else none} }}
    hn_egress_note: >-
      {{ {'unavailable': '; internet egress unavailable (HybridFabric ' ~ hn_fabric_name ~ ' offers none)',
          'ready': '; internet egress',
          'pending': '; internet egress being added',
          'removing': '; internet egress being removed'}.get(_state4 | trim, '')
         ~ ('; IPv6 internet: not offered for tenant-provided prefixes' if _row6.reason | default('') == 'AddressChoice'
            else ('; IPv6 internet not offered yet' if _row6.reason | default('') == 'NotOffered'
            else ('; IPv6 internet egress degraded' if _row6.reason | default('') == 'Degraded'
            else ('; IPv6 internet egress down (no upstream session)' if _row6.reason | default('') == 'UpstreamDown'
            else {'ready': '; IPv6 internet egress',
                  'pending': '; IPv6 internet egress being added',
                  'removing': '; IPv6 internet egress being removed'}.get(_row6.state | default(''), ''))))) }}
