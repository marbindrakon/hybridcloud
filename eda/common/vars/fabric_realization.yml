---
# shc (design/P7-PLAN.md §12.3, H2): how this platform realizes a HybridFabric. The CRs state intent; these are
# the realization's own parameters: border gateway nodes are Linux hosts reached over SSH, each node runs the
# fabric root (VPNv4 route reflector) and one network namespace per CloudGateway (a provider edge: EVPN-VXLAN on
# the site side, IS-IS segment routing + MPLS L3VPN over a node-local core bridge on the fabric side).
# realization models these roles implement
fabric_realization_models: [linux-pe]
# An installation overrides any of it with the sovereign-localhost inventory variable `fabric_realization`
# (aap-config env FABRIC_REALIZATION, JSON), and per fabric under fabric_realization.fabrics.<name>.
fabric_realization_defaults:
  # which realization drives the border gateway: linux-pe = RHEL hosts with FRR (this platform's implementation).
  # Another model (e.g. a vendor router OS) would add its own node tasks; the CRs stay the same.
  model: linux-pe
  # route target values per HybridNetwork between the gateways (<domainAsn>:<value>); must stay clear of the
  # fabric's VNI pools so a VPN route target never equals a site route target
  vpnTargetPool: {start: 10000, end: 10999}
  # standard community <domainAsn>:<value> on the routes gateways originate into a site; never taken back
  gatewayCommunity: 999
  core:
    bridge: br-core
    loopbackPool: 10.255.0.0/24
    linkSubnet: 10.255.1.0/24
    isisArea: "49.0001"
    srgb: {start: 16000, end: 23999}
  nodes:
    trunkInterface: bond1
    sshUser: root
  openstack:
    # platform-owned project on OpenStack sites for the placements' networks and routers (shared to tenants)
    platformProject: hybrid-fabric
  openshift:
    # OpenShift sites: the FRRConfigurations (labels) whose BGP sessions to the site's gateway carry the placements'
    # routes; empty selects every FRRConfiguration of the site
    frrConfigurationSelector: {}
    # tenant sign-in on OpenShift sites: the site's OIDC client in the tenant realm (the cluster's OAuth uses it).
    # A CloudVirt's Rbac CRs become client roles <entity>.<rbac> of that client, mapped to the Rbac's Keycloak group;
    # the client puts the user's roles into the groups claim, and the VM namespaces bind edit/view to those groups.
    tenantSignIn:
      realm: sovereign-tenants
      clientId: "openshift-{cluster}"
      # name of the sign-in button on the site's login page (the site OAuth identity provider of the client
      # above); read from the site when it can be, else this; empty = the realm name
      idpName: ""
      editRole: edit
      viewRole: view
  # address management of the HybridNetworks (files/shc_ipam.py): where each network's space and its placements'
  # subnets are kept; ledger = the fabric's ledger (the only provider so far)
  ipam:
    provider: ledger
    # platform address pools (HybridNetwork spec.platformPrefixes): <pool>: {family, prefixes, reserved (never
    # given out), blockLengths (the block sizes offered), defaultBlock (when a network names no size), holdDownDays
    # (a released block is not given out again for this long; default below), perTenantBlocks (blocks per Entity;
    # absent = no limit), perTenantOverrides ({entity: blocks})}. None by default: a network asking for platform
    # address space is then refused (FamilyUnavailable). One pool per family per fabric (fabrics.<name>.ipam).
    publicPools: {}
    holdDownDays: 7
  placement:
    # how long a placement job waits for the gateways to hold the site's routes for its prefixes (s)
    routeWait: 180
    # address families a placement may ask for, per backend kind (spec.ipv6 elsewhere fails FamilyUnavailable)
    ipFamilies: {CloudVirt: [4], CloudOSO: [4], CloudAWS: [4]}
    # ranges of a site the allocator steps around, per backend kind, besides the site underlay and (OpenShift) the
    # cluster's cluster and service networks: OVN-Kubernetes' join (100.64.0.0/16), Layer2 user-defined network
    # join (100.65.0.0/16), transit switch (100.88.0.0/16) and masquerade (169.254.0.0/17) subnets
    siteReserved:
      CloudVirt: [100.64.0.0/16, 100.65.0.0/16, 100.88.0.0/16, 169.254.0.0/17]
      CloudOSO: []
      CloudAWS: []
  # CloudGateways over transport wireguard (remote sites): each node's tunnel listens on listenPort (unless the
  # gateway sets one); the tunnel's MTU is the site leg's MTU unless siteUnderlay.mtu says otherwise (1420 = a 1500
  # path minus WireGuard over IPv4); keepalives keep NAT state open
  wireguard:
    listenPort: 51820
    mtu: 1420
    persistentKeepalive: 25
  # attachment circuits (AttachmentCircuit on a ProviderEdge of platform frr): each circuit gets a VLAN from vlanPool
  # on its bearer and the next /linkPrefixLength of linkPool (node i takes host address i+1, the CE the next one);
  # the network's root VRF on every node peers with the CE over that VLAN. providerEdges.<edge>.bearers.<bearer>
  # names the node interface carrying the bearer's VLANs and its MTU.
  attachments:
    enabled: false
    vlanPool: {start: 3000, end: 3099}
    linkPool: 10.255.128.0/20
    linkPrefixLength: 29
    # central Vault KV path (mount central) for each circuit's BGP password
    secretPath: "fabric/circuits/{entity}/{name}"
    # minutes before a session closed for too many prefixes (maxPrefixes action teardown) is tried again; 0 = it
    # stays down until the circuit changes
    maxPrefixRestart: 2
    providerEdges: {}
  # provider internet egress for HybridNetworks with spec.egress.internet: each node's root holds a VRF that hands
  # traffic to a network with internet access (a macvlan on parentInterface, default route via gateway); per network
  # a VRF e<vpnTarget> imports the network's routes, exports a default route into its VPN and source-NATs its traffic
  # to one address per node (natPool + the network's egress index from the ledger). Destinations in
  # denyDestinations (unless in allowDestinations) aren't reachable this way; nothing reaches a network unsolicited.
  egress:
    enabled: false
    vrf: {name: egress, table: 9000}
    # Linux table of a network's VRF = networkTableBase + vpnTarget
    networkTableBase: 100000
    # veth /31s between a network's VRF and the egress VRF, by egress index
    linkPool: 169.254.0.0/16
    parentInterface: ""       # an existing interface on every node (e.g. a VLAN device of the trunk)
    gateway: ""               # the next hop on that network
    prefixLength: 24
    mtu: 9000
    # per node (borderGateway.nodes[].name): {address, natPool}; natPool inside address/prefixLength
    nodes: {}
    denyDestinations: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12,
                       192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3]
    allowDestinations: []
