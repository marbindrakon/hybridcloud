---
# The cluster's two floating IPs (DESIGN cnet §4.2 step 4, §4.3), recorded in status.floatingIPs (address and id)
# before anything else uses them. A cluster whose record holds both is the owner of those two (found by the recorded
# ids; nothing is asked of the site and nothing is found by a description). Otherwise they are made with the site
# account scoped to the environment's project on the chosen network and recorded at once (the teardown releases them
# by the recorded ids). Their description says the cluster's name in words, for people: "OpenShift cluster <cluster>:
# API (platform build <build>)" and "...: ingress (...)"; it is never read back. Inputs:
#   cf_project_id    the environment's project (CloudOSO status.projectId)
#   cf_network_id    the network the floating IPs come from (placement status.realization.site.networkId, or the
#                    external network in effect)
#   cf_account       the site account's Vault path
#   po_cr_current    the cluster as read (its record)
# Sets cb_fips ({api: {address, id}, ingress: {...}}), cb_api_vip, cb_ingress_vip.
- name: The cluster's recorded floating IPs
  vars:
    _rec: "{{ ((po_cr_current | default({})).resources | default([{}], true) | first).status | default({}, true) }}"
    _fips: "{{ _rec.floatingIPs | default({}, true) }}"
  ansible.builtin.set_fact:
    cf_recorded:
      api: "{{ _fips.api | default({}, true) }}"
      ingress: "{{ _fips.ingress | default({}, true) }}"

- name: Whether the record holds both
  ansible.builtin.set_fact:
    cf_have_record: >-
      {{ (cf_recorded.api.id | default('', true) | length > 0) and (cf_recorded.api.address | default('', true) | length > 0)
         and (cf_recorded.ingress.id | default('', true) | length > 0)
         and (cf_recorded.ingress.address | default('', true) | length > 0) }}

- name: Require the environment's project and the network
  ansible.builtin.assert:
    that:
      - cf_project_id | default('', true) | length > 0
      - cf_network_id | default('', true) | length > 0
      - cf_account | default('', true) | length > 0
    fail_msg: >-
      PlatformOpenshift {{ ansible_operator_meta.name }}: the floating IPs need the environment's project, the
      network's id and the site account of the environment; one of them is not recorded.
  when: not (cf_have_record | bool)

# the site account's clouds.yaml in /tmp goes whatever happens (Review R2 L11)
- name: The cluster's floating IPs with the site account
  when: not (cf_have_record | bool)
  block:
    - name: Load the site account
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
      vars:
        shc_step: "Reserve the cluster's floating addresses"
        os_account_vault_path: "{{ cf_account }}"
        os_account_tag: "po-fips-{{ cb_app_name }}"

    - name: Create the cluster's floating IPs
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
      vars:
        shc_step: "Reserve the cluster's floating addresses"
        os_call_no_log: false
        os_request:
          action: cluster-fips
          state: present
          project_id: "{{ cf_project_id }}"
          network_id: "{{ cf_network_id }}"
          descriptions:
            api: "OpenShift cluster {{ ansible_operator_meta.name }}: API (platform build {{ cb_app_name }})"
            ingress: "OpenShift cluster {{ ansible_operator_meta.name }}: ingress (platform build {{ cb_app_name }})"
  always:
    - name: Remove the account's temp files
      ansible.builtin.file:
        path: "/tmp/eda-po-fips-{{ cb_app_name }}-{{ item }}"
        state: absent
      loop: [clouds.yaml, ca.crt]
      when: not (cf_have_record | bool)

- name: Keep the floating IPs
  vars:
    _src: "{{ cf_recorded if cf_have_record | bool else os_result }}"
  ansible.builtin.set_fact:
    cb_fips:
      api: {address: "{{ _src.api.address }}", id: "{{ _src.api.id }}"}
      ingress: {address: "{{ _src.ingress.address }}", id: "{{ _src.ingress.id }}"}
    cb_api_vip: "{{ _src.api.address }}"
    cb_ingress_vip: "{{ _src.ingress.address }}"

- name: Record the floating IPs
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ ansible_operator_meta.name }}"
    cr_namespace: "{{ ansible_operator_meta.namespace }}"
    cr_status_partial: true
    cr_status_body:
      floatingIPs: "{{ cb_fips }}"
  when: not (cf_have_record | bool)
