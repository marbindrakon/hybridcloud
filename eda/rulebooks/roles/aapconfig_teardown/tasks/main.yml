---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        aapconfig_cr_name: "{{ event_payload.regarding.name }}"
        aapconfig_cr_namespace: "{{ event_payload.regarding.namespace }}"
        aapconfig_spec: "{{ shc_live_spec }}"

    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read AAP admin secret
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        kind: Secret
        name: "{{ aapconfig_spec.secret }}"
        namespace: "{{ aapconfig_cr_namespace }}"
      register: _aap_secret
      no_log: true
      ignore_errors: true

    - name: Delete OIDC authenticator from AAP
      when: _aap_secret.resources | default([]) | length > 0
      block:
        - name: Decode AAP credentials
          ansible.builtin.set_fact:
            aap_username: "{{ _aap_secret.resources[0].data.username | b64decode }}"
            aap_password: "{{ _aap_secret.resources[0].data.password | b64decode }}"
          no_log: true

        - name: Lookup authenticator by slug
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticators/?slug=oidc-{{ aapconfig_cr_name | lower }}"
            method: GET
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          register: _auth_lookup

        - name: Delete authenticator
          ansible.builtin.uri:
            url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticators/{{ _auth_lookup.json.results[0].id }}/"
            method: DELETE
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 204, 404]
          when: _auth_lookup.json.results | length > 0
      ignore_errors: true

    # the tenant realm's clients automation client (published by the RbacConfig job), not the master realm admin
    - name: Delete Keycloak OIDC client
      block:
        - name: Obtain the realm token for the sign-in client
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_realm_token.yml"
          vars:
            krt_purpose: clients
            krt_rbac_config: "{{ aapconfig_spec.rbacConfig | default('', true) }}"
            krt_url: "{{ keycloak_internal_url | default('', true) }}"
            krt_token_fact: aap_kc_realm_token

        # the client id the provision recorded (never rebuilt), and the client of that id
        - name: The recorded sign-in client
          ansible.builtin.set_fact:
            aapconfig_fin_client_id: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).keycloakClientId | default('', true) }}"
            aapconfig_fin_owner: "AAPConfig/{{ aapconfig_cr_namespace }}/{{ aapconfig_cr_name }}"

        # the client representation carries the client secret
        - name: Find Keycloak client
          when: aapconfig_fin_client_id | length > 0
          ansible.builtin.uri:
            url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_name }}/clients?clientId={{ aapconfig_fin_client_id | urlencode }}"
            method: GET
            headers:
              Authorization: "Bearer {{ aap_kc_realm_token }}"
            validate_certs: false
          register: _kc_client
          no_log: true

        # only the recorded client with this object's mark, or with none (made before the mark)
        - name: "Decide: delete or leave"
          when: aapconfig_fin_client_id | length > 0
          vars:
            _found: "{{ _kc_client.json | default([], true) | selectattr('clientId', 'equalto', aapconfig_fin_client_id) | list }}"
            _mark: >-
              {{ (((_found | first).attributes | default({}, true))['hybridsovereign.redhat/owner'] | default('', true))
                 if _found | length > 0 else '' }}
          ansible.builtin.set_fact:
            aapconfig_fin_client_uuid: "{{ (_found | first).id if _found | length > 0 else '' }}"
            aapconfig_fin_decision: >-
              {{ 'gone' if _found | length == 0 else ('delete' if _mark in [aapconfig_fin_owner, ''] else 'leave') }}
          no_log: true

        - name: Delete Keycloak client
          ansible.builtin.uri:
            url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_name }}/clients/{{ aapconfig_fin_client_uuid }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ aap_kc_realm_token }}"
            validate_certs: false
            status_code: [204, 404]
          when: aapconfig_fin_client_id | length > 0 and aapconfig_fin_decision == 'delete'
      always:
        - name: Forget the realm token and the client
          ansible.builtin.set_fact:
            aap_kc_realm_token: ""
            _kc_client: {}
          no_log: true
      ignore_errors: true

    - name: Get current timestamp for status
      ansible.builtin.set_fact:
        aapconfig_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark AAPConfig deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: aapconfigs
        cr_name: "{{ aapconfig_cr_name }}"
        cr_namespace: "{{ aapconfig_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          lastReconciledAt: "{{ aapconfig_delete_transition_time }}"
          message: AAPConfig {{ aapconfig_cr_name }} deleted by EDA

  rescue:
    - name: Mark AAPConfig delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: aapconfigs
        cr_name: "{{ aapconfig_cr_name }}"
        cr_namespace: "{{ aapconfig_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA deletion failed')) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "AAPConfig {{ aapconfig_cr_name | default('unknown') }} EDA teardown failed"
