---
platformopenshift_operator_namespace: sovereign-cloud
eda_central_work_namespace: sovereign-cloud-jobs
# Central API for the ACM policy calls in keycloak_oidc.yml / cluster_rbac.yml: the connection the
# job resolved from Vault (aap-central-cluster-sa), not a hostname baked into the role.
central_api_server: "{{ central_api_host | default('') }}"
keycloak_external_url: "{{ lookup('env', 'KEYCLOAK_EXTERNAL_URL') }}"
keycloak_realm: "{{ lookup('env', 'KEYCLOAK_REALM') | default('sovereign-tenants', true) }}"
# shc (§11.6 phase C): RHBK admin account in central Vault (the RbacConfig's secret)
keycloak_admin_vault_path: rhbk-services-admin

# shc (§11.6 phase C): installation settings through the sovereign-localhost inventory variable
# `platformopenshift_defaults` (config-as-code env PLATFORMOPENSHIFT_DEFAULTS). A CR field wins.
# Keys: ocpImageSet, pullSecretVaultPath, pullSecretVaultProperty, sshKeyVaultPath, allowedVaultPaths,
# allowedPullSecretProperties, controlPlaneCount, workerCount, controlPlaneFlavor, workerFlavor, glanceImage, externalDNS (list),
# mceClusterBuildChart (oci:// ref), mceClusterBuildChartVersion. Fallbacks are upstream's.
platformopenshift_defaults: {}
default_pull_secret_vault_path: "{{ platformopenshift_defaults.pullSecretVaultPath | default('aws/ocp-pull-secret') }}"
default_pull_secret_vault_property: "{{ platformopenshift_defaults.pullSecretVaultProperty | default('pull_secret') }}"
default_ssh_key_vault_path: "{{ platformopenshift_defaults.sshKeyVaultPath | default('aws/ocp-ssh-key') }}"
# Central Vault paths (and pull-secret properties) a PlatformOpenshift spec may name in
# spec.openstack.{pullSecretVaultPath,sshKeyVaultPath,pullSecretVaultProperty}. The jobs read these with the
# platform's Vault token, so a spec value outside these lists is ignored and the defaults above apply
# (platformopenshift_defaults keys allowedVaultPaths, allowedPullSecretProperties; empty: the spec never chooses).
platformopenshift_allowed_vault_paths: "{{ platformopenshift_defaults.allowedVaultPaths | default([], true) }}"
platformopenshift_allowed_pull_secret_properties: "{{ platformopenshift_defaults.allowedPullSecretProperties | default([], true) }}"
default_ocp_image_set: "{{ platformopenshift_defaults.ocpImageSet | default('img4.21.9-x86-64-appsub') }}"
default_control_plane_count: "{{ platformopenshift_defaults.controlPlaneCount | default(3) }}"
default_worker_count: "{{ platformopenshift_defaults.workerCount | default(3) }}"
default_control_plane_flavor: "{{ platformopenshift_defaults.controlPlaneFlavor | default('b1.xlarge') }}"
default_worker_flavor: "{{ platformopenshift_defaults.workerFlavor | default('b1.large') }}"
# Empty: the installer uploads the release's own RHCOS image into the project.
default_glance_image_override: "{{ platformopenshift_defaults.glanceImage | default('') }}"

vault_init_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://vault-active.central-vault.svc:8200', true) }}"
oci_registry_host: "{{ lookup('env', 'OCI_HOST') | trim }}"
mce_cluster_build_chart: >-
  {{ platformopenshift_defaults.mceClusterBuildChart
     | default('oci://' ~ oci_registry_host ~ '/hybrid-sovereign/mce-cluster-build', true) }}
mce_cluster_build_chart_version: "{{ platformopenshift_defaults.mceClusterBuildChartVersion | default('0.2.0') }}"
# The ACM ManagedClusterSet every cluster these jobs build joins (platformopenshift_defaults key
# managedClusterSet). It holds tenant-built clusters only: the Assignment policy namespace on the hub binds
# this set alone, so an Assignment's Placement can never select the hub or a platform cluster.
platformopenshift_managed_cluster_set: "{{ platformopenshift_defaults.managedClusterSet | default('sovereign-tenant-clusters', true) }}"
