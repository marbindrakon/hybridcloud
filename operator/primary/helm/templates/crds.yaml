apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudinfrastructures.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudInfrastructure
    listKind: CloudInfrastructureList
    plural: cloudinfrastructures
    singular: cloudinfrastructure
    shortNames:
      - cinfra
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Platform-owned cloud site (an OpenStack cloud, an OpenShift cluster with OpenShift Virtualization,
            or an AWS account) that tenant cloud projects and fabric gateways attach to. It holds the site's
            infrastructure credential and settings; tenant objects never carry them. Exactly one of
            spec.openstack, spec.openshift or spec.aws is set, matching spec.type.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
              x-kubernetes-validations:
                - rule: has(self.openstack) == (self.type == 'openstack')
                  message: spec.openstack must be set if and only if spec.type is openstack
                - rule: has(self.openshift) == (self.type == 'openshift')
                  message: spec.openshift must be set if and only if spec.type is openshift
                - rule: has(self.aws) == (self.type == 'aws')
                  message: spec.aws must be set if and only if spec.type is aws
              properties:
                type:
                  type: string
                  description: Cloud type. Selects the typed section below. Immutable.
                  enum: [openstack, openshift, aws]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.type is immutable
                displayName:
                  type: string
                  maxLength: 128
                  description: Human-readable site name shown in consoles.
                credentialsRef:
                  type: object
                  description: >-
                    The site's infrastructure credential, stored in the platform's Vault KV store.
                    openstack: a cloud-admin clouds.yaml (key clouds.yaml; key ca.crt when the API certificate
                    is not publicly trusted); openshift: key kubeconfig (not needed for clusterRef local);
                    aws: keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
                  required: [vaultPath]
                  properties:
                    vaultPath:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Vault KV path holding the credential.
                entityRefs:
                  type: array
                  description: >-
                    Entities allowed to reference this site from their cloud projects. Empty means every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
                openstack:
                  type: object
                  description: >-
                    OpenStack site, reached through its public APIs only. The cloud's administrator configures
                    its fabric underlay; the platform detects EVPN support through Neutron's evpn extension.
                    Required when type is openstack.
                  properties:
                    region:
                      type: string
                      maxLength: 64
                      description: OpenStack region. Default the credential's clouds.yaml region_name.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: >-
                        Keystone domain for tenant projects. The infrastructure account is granted admin on it.
                    createProjectDomain:
                      type: boolean
                      default: false
                      description: Create projectDomain when it does not exist (otherwise a missing domain fails the site).
                    externalNetwork:
                      type: string
                      maxLength: 255
                      description: External Neutron network for tenant floating IPs.
                openshift:
                  type: object
                  description: >-
                    OpenShift cluster with OpenShift Virtualization for tenant VMs (CloudVirt). Required when type
                    is openshift.
                  properties:
                    clusterRef:
                      type: string
                      maxLength: 253
                      default: local
                      description: >-
                        The cluster: local is the services cluster itself; anything else is a cluster reached
                        through credentialsRef (key kubeconfig).
                    bootImage:
                      type: string
                      maxLength: 512
                      description: Default VM root disk image for CloudVirt (container disk URL).
                    storageClass:
                      type: string
                      maxLength: 253
                      description: StorageClass for VM disks.
                    fabricCredentialsRef:
                      type: object
                      description: >-
                        Vault KV path holding a kubeconfig (key kubeconfig) allowed to manage the platform's network
                        objects on the cluster (the fabric attachment, tenant networks, VM namespaces). Default
                        credentialsRef.
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          type: string
                          minLength: 1
                          maxLength: 512
                dns:
                  type: object
                  description: >-
                    Where tenant environment DNS zones on this site live. Every environment gets a zone named
                    <environment>.<entity>.<tenant DNS domain> (the platform's DNSConfig).
                  x-kubernetes-validations:
                    - rule: self.mode != 'native' || (has(self.project) && size(self.project) > 0)
                      message: dns.project is required when dns.mode is native
                  properties:
                    mode:
                      type: string
                      enum: [native, platform]
                      default: platform
                      description: >-
                        native: environment zones are created in this site's own DNS service, owned by
                        dns.project and shared with the environment's project, so tenants manage their records
                        with the site's normal tools. platform: environment zones are held by the platform's DNS
                        service and edited through the platform.
                    project:
                      type: string
                      maxLength: 64
                      description: >-
                        native: the project on this site that owns the platform's parent zone (the tenant DNS
                        domain, which reserves the namespace on this site) and every environment zone.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: Keystone domain of dns.project. Default spec.openstack.projectDomain.
                    createProject:
                      type: boolean
                      default: false
                      description: Create dns.project when it does not exist (otherwise a missing project fails the site).
                    zoneQuota:
                      type: integer
                      minimum: 1
                      default: 1000
                      description: >-
                        native: the DNS service's zone quota ensured for dns.project (at least this many); every
                        environment zone on this site counts against it.
                aws:
                  type: object
                  description: AWS account. Required when type is aws.
                  required: [accountId, region]
                  properties:
                    accountId:
                      type: string
                      pattern: '^[0-9]{12}$'
                      description: AWS account ID.
                    region:
                      type: string
                      maxLength: 32
                      description: AWS region, e.g. us-east-1.
                    baseDomain:
                      type: string
                      maxLength: 253
                      description: Parent Route53 domain for tenant projects.
            status:
              type: object
              properties:
                capabilities:
                  type: object
                  description: >-
                    What the site offers, as probed by the provision job. Keys: evpn (the site can attach to a
                    HybridFabric: openstack = Neutron's evpn extension is loaded; openshift = CNO FRR provider,
                    routeAdvertisements Enabled and fabric BGP sessions Established), api (the credential
                    authenticates), virtualization (OpenShift Virtualization Available), dns (environment zones can be created
                    on this site).
                  additionalProperties:
                    type: boolean
                site:
                  type: object
                  description: Observed site details (informational).
                  properties:
                    endpoint:
                      type: string
                      description: Cloud API or cluster API endpoint.
                    region:
                      type: string
                    version:
                      type: string
                      description: Platform version where the API reports one (OpenShift version).
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: EVPN
          type: boolean
          jsonPath: .status.capabilities.evpn
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsconfigs.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: hybridsovereign.redhat
  names:
    kind: DNSConfig
    listKind: DNSConfigList
    plural: dnsconfigs
    singular: dnsconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            The platform's tenant DNS namespace: one global domain under which every tenant environment gets a
            zone named <environment>.<entity>.<domain>, whatever site the environment is on. Lives in the
            plugins namespace; the platform uses the first Ready DNSConfig.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [domain, provider, secret]
              x-kubernetes-validations:
                - rule: self.provider != 'designate' || has(self.designate)
                  message: spec.designate is required when spec.provider is designate
              properties:
                domain:
                  type: string
                  maxLength: 200
                  description: The global tenant DNS domain, e.g. tenants.example.com (no trailing dot).
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.domain is immutable
                provider:
                  type: string
                  enum: [designate]
                  description: DNS service that holds the global domain's zone.
                secret:
                  type: string
                  maxLength: 512
                  description: >-
                    Vault KV path of the DNS service credential. designate: key clouds.yaml (an account with the
                    member role on designate.projectId only) and optional ca.crt.
                designate:
                  type: object
                  description: The global domain's zone in Designate.
                  required: [projectId, zoneId]
                  properties:
                    projectId:
                      type: string
                      maxLength: 64
                      description: Project that owns the global domain's zone.
                    zoneId:
                      type: string
                      maxLength: 64
                      description: The global domain's zone.
            status:
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                ready:
                  type: boolean
                message:
                  type: string
                zone:
                  type: string
                  description: The global zone as the DNS service reports it.
                nameservers:
                  type: array
                  description: The global zone's NS records. An environment zone served by other nameservers is delegated from it.
                  items:
                    type: string
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

{{- end }}
