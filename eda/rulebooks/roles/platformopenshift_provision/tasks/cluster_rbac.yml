---
# Push Keycloak-group ClusterRoleBindings to the provisioned cluster via ACM ConfigurationPolicy.
#
# Inputs (from caller / keycloak_oidc.yml):
#   cluster_name         - the ManagedCluster's name (the build name of OpenStack, AWS and GCP builds)
#   csg_tiers            - the groups of each tier (cluster_signin_groups.yml)
#   acm_base             - the base of the ACM object names (keycloak_oidc.yml)
#   central_api_server   - Central cluster API URL
#   central_token        - Bearer token for central cluster

# The groups of each tier come from cluster_signin_groups.yml (csg_tiers): <tenant>.<group>, the names the cluster's
# sign-in client puts in the groups claim (its client roles), never a group's last part alone, so another tenant's
# group of the same name is never bound.
- name: Build the subjects of each binding
  vars:
    _subjects: >-
      {%- set out = {} -%}
      {%- for tier in ['admin', 'operator', 'developer', 'viewer'] -%}
        {%- set l = [] -%}
        {%- for g in (csg_tiers | default({}, true))[tier] | default([], true) -%}
          {%- set _ = l.append({'kind': 'Group', 'name': g, 'apiGroup': 'rbac.authorization.k8s.io'}) -%}
        {%- endfor -%}
        {%- set _ = out.update({tier: l}) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    admin_subjects: "{{ _subjects.admin }}"
    operator_subjects: "{{ _subjects.operator }}"
    developer_subjects: "{{ _subjects.developer }}"
    viewer_subjects: "{{ _subjects.viewer }}"

# ─── Build object-templates list for ConfigurationPolicy ─────────────────────
# Every tier's binding is exact: mustonlyhave replaces the subjects (a binding of an older run that named other
# groups keeps none of them), and a tier without groups has no binding (mustnothave). The default binding
# self-provisioners is managed the same way (below), so that only the cluster's own groups may create projects.
- name: Assemble RBAC object templates
  vars:
    _tiers:
      - {subjects: "{{ admin_subjects }}", suffix: cluster-admin, role: cluster-admin}
      - {subjects: "{{ operator_subjects }}", suffix: cluster-operator, role: self-provisioner}
      - {subjects: "{{ developer_subjects }}", suffix: cluster-developer, role: edit}
      - {subjects: "{{ viewer_subjects }}", suffix: cluster-viewer, role: view}
  ansible.builtin.set_fact:
    rbac_object_templates: >-
      {%- set out = [] -%}
      {%- for t in _tiers -%}
        {%- set obj = {'apiVersion': 'rbac.authorization.k8s.io/v1', 'kind': 'ClusterRoleBinding',
                       'metadata': {'name': cluster_name ~ '-' ~ t.suffix}} -%}
        {%- if t.subjects | length > 0 -%}
          {%- set _ = obj.update({'subjects': t.subjects,
                                  'roleRef': {'kind': 'ClusterRole', 'name': t.role,
                                              'apiGroup': 'rbac.authorization.k8s.io'}}) -%}
          {%- set _ = out.append({'complianceType': 'mustonlyhave', 'objectDefinition': obj}) -%}
        {%- else -%}
          {%- set _ = out.append({'complianceType': 'mustnothave', 'objectDefinition': obj}) -%}
        {%- endif -%}
      {%- endfor -%}
      {#- OpenShift's default binding self-provisioners gives every signed-in person (system:authenticated:oauth) the
          right to create projects. On a tenant's cluster it names the operator tier's groups only (the tier that
          binds self-provisioner), none when the tier has none; the annotation autoupdate "false" stops the API
          server from restoring the default subjects at its next start (OpenShift "Disabling project
          self-provisioning"). -#}
      {%- set _ = out.append({'complianceType': 'mustonlyhave', 'objectDefinition': {
            'apiVersion': 'rbac.authorization.k8s.io/v1', 'kind': 'ClusterRoleBinding',
            'metadata': {'name': 'self-provisioners',
                         'annotations': {'rbac.authorization.kubernetes.io/autoupdate': 'false'}},
            'roleRef': {'kind': 'ClusterRole', 'name': 'self-provisioner', 'apiGroup': 'rbac.authorization.k8s.io'},
            'subjects': operator_subjects}}) -%}
      {{ out }}

# ─── Idempotent create-or-update for RBAC Policy ─────────────────────────────
- name: Check if cluster RBAC Policy already exists
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/policy.open-cluster-management.io/v1/namespaces/openshift-gitops/policies/{{ acm_base }}-cluster-rbac"
    method: GET
    headers:
      Authorization: "Bearer {{ central_token }}"
    validate_certs: false
    status_code: [200, 404]
  when:
    - rbac_object_templates | default([]) | length > 0
  register: _rbac_policy_check

- name: Create cluster RBAC Policy (first time)
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/policy.open-cluster-management.io/v1/namespaces/openshift-gitops/policies"
    method: POST
    headers:
      Authorization: "Bearer {{ central_token }}"
      Content-Type: application/json
    body_format: json
    body:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      metadata:
        name: "{{ acm_base }}-cluster-rbac"
        namespace: openshift-gitops
        annotations:
          policy.open-cluster-management.io/standards: "RBAC"
          policy.open-cluster-management.io/categories: "Access Control"
          policy.open-cluster-management.io/controls: "ClusterRoleBinding"
      spec:
        disabled: false
        remediationAction: enforce
        policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: "{{ acm_base }}-cluster-rbac"
              spec:
                remediationAction: enforce
                severity: high
                object-templates: "{{ rbac_object_templates }}"
    validate_certs: false
    status_code: [200, 201]
  when:
    - rbac_object_templates | default([]) | length > 0
    - _rbac_policy_check.status == 404

- name: Update cluster RBAC Policy (idempotent PATCH)
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/policy.open-cluster-management.io/v1/namespaces/openshift-gitops/policies/{{ acm_base }}-cluster-rbac"
    method: PATCH
    headers:
      Authorization: "Bearer {{ central_token }}"
      Content-Type: application/merge-patch+json
    body_format: json
    body:
      spec:
        disabled: false
        remediationAction: enforce
        policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: "{{ acm_base }}-cluster-rbac"
              spec:
                remediationAction: enforce
                severity: high
                object-templates: "{{ rbac_object_templates }}"
    validate_certs: false
    status_code: [200]
  when:
    - rbac_object_templates | default([]) | length > 0
    - _rbac_policy_check.status == 200

# ─── Idempotent create-or-skip for Placement (selector is immutable, skip if exists) ─
- name: Check if cluster RBAC Placement already exists
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/cluster.open-cluster-management.io/v1beta1/namespaces/openshift-gitops/placements/{{ acm_base }}-cluster-rbac-placement"
    method: GET
    headers:
      Authorization: "Bearer {{ central_token }}"
    validate_certs: false
    status_code: [200, 404]
  when:
    - rbac_object_templates | default([]) | length > 0
  register: _rbac_placement_check

- name: Create ACM Placement for cluster RBAC policy
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/cluster.open-cluster-management.io/v1beta1/namespaces/openshift-gitops/placements"
    method: POST
    headers:
      Authorization: "Bearer {{ central_token }}"
      Content-Type: application/json
    body_format: json
    body:
      apiVersion: cluster.open-cluster-management.io/v1beta1
      kind: Placement
      metadata:
        name: "{{ acm_base }}-cluster-rbac-placement"
        namespace: openshift-gitops
      spec:
        predicates:
          - requiredClusterSelector:
              labelSelector:
                matchLabels:
                  name: "{{ cluster_name }}"
    validate_certs: false
    status_code: [200, 201]
  when:
    - rbac_object_templates | default([]) | length > 0
    - _rbac_placement_check.status == 404

# ─── Idempotent create-or-skip for PlacementBinding ──────────────────────────
- name: Check if cluster RBAC PlacementBinding already exists
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/policy.open-cluster-management.io/v1/namespaces/openshift-gitops/placementbindings/{{ acm_base }}-cluster-rbac-binding"
    method: GET
    headers:
      Authorization: "Bearer {{ central_token }}"
    validate_certs: false
    status_code: [200, 404]
  when:
    - rbac_object_templates | default([]) | length > 0
  register: _rbac_binding_check

- name: Create ACM PlacementBinding for cluster RBAC policy
  ansible.builtin.uri:
    url: "{{ central_api_server }}/apis/policy.open-cluster-management.io/v1/namespaces/openshift-gitops/placementbindings"
    method: POST
    headers:
      Authorization: "Bearer {{ central_token }}"
      Content-Type: application/json
    body_format: json
    body:
      apiVersion: policy.open-cluster-management.io/v1
      kind: PlacementBinding
      metadata:
        name: "{{ acm_base }}-cluster-rbac-binding"
        namespace: openshift-gitops
      placementRef:
        name: "{{ acm_base }}-cluster-rbac-placement"
        kind: Placement
        apiGroup: cluster.open-cluster-management.io
      subjects:
        - name: "{{ acm_base }}-cluster-rbac"
          kind: Policy
          apiGroup: policy.open-cluster-management.io
    validate_certs: false
    status_code: [200, 201]
  when:
    - rbac_object_templates | default([]) | length > 0
    - _rbac_binding_check.status == 404
