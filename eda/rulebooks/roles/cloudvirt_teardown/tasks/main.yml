---
# shc (design/P7-PLAN.md P7.3.7): CloudVirt teardown. Removes the environment's namespaces from its site (found by
# label, so namespaces that already left the spec go too). Refused while any of them holds VirtualMachines: the
# status says which (deletionBlockedBy) and the operator's finalizer asks again later. Waits until the namespaces
# are gone, then marks deletionComplete; the operator then wakes the placements that waited for them.
- block:
    # nothing on a site (refused at validation): delete without site cleanup
    - name: Skip the site cleanup when nothing was realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/teardown_unrealized.yml"

    - name: Read the CloudVirt
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: Resolve the site
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ fab_spec.cloudRef.name }}"
        ci_ref_namespace: "{{ fabric_platform_namespace }}"
        ci_expected_type: openshift

    - name: The environment's namespace labels
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: cloudvirt-namespaces, entity: "{{ fab_entity }}", cloudvirt: "{{ fab_name }}", namespaces: []}

    - name: Remove the namespaces from the site
      when: ci_found | bool
      block:
        - name: The site's fabric credential
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_kubeconfig.yml"
          vars:
            site_kc_tag: "cvd-{{ fab_namespace }}-{{ fab_name }}"

        - name: List the environment's site namespaces
          kubernetes.core.k8s_info:
            kubeconfig: "{{ site_kubeconfig }}"
            api_version: v1
            kind: Namespace
            label_selectors: >-
              {{ fab_check_result.selector | dict2items | map(attribute='key')
                 | zip(fab_check_result.selector.values()) | map('join', '=') | list }}
          register: _cvd_ns

        - name: List their VMs
          kubernetes.core.k8s_info:
            kubeconfig: "{{ site_kubeconfig }}"
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            namespace: "{{ item }}"
          loop: "{{ _cvd_ns.resources | default([]) | map(attribute='metadata.name') | list }}"
          register: _cvd_vms

        - name: Collect the VMs
          ansible.builtin.set_fact:
            cvd_vms: >-
              {%- set out = [] -%}
              {%- for r in _cvd_vms.results | default([]) -%}
                {%- for vm in r.resources | default([]) -%}
                  {%- set _ = out.append('VirtualMachine ' ~ r.item ~ '/' ~ vm.metadata.name) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ out }}

        - name: Report the VMs that block the deletion
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: cloudvirts
            cr_name: "{{ fab_name }}"
            cr_namespace: "{{ fab_namespace }}"
            patch_ignore_not_found: true
            # pending (not reconciling) completes the delete event: the finalizer's next attempt publishes again
            cr_status_body:
              status: pending
              ready: false
              message: "Deletion waits for {{ cvd_vms | length }} VM(s) on {{ fab_spec.cloudRef.name }}: {{ cvd_vms[:10] | join(', ') }}"
              deletionBlockedBy: "{{ cvd_vms }}"
              lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          when: cvd_vms | length > 0

        - name: End the job while VMs remain
          ansible.builtin.meta: end_play
          when: cvd_vms | length > 0

        - name: Delete the namespaces
          kubernetes.core.k8s:
            kubeconfig: "{{ site_kubeconfig }}"
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ item }}"
            wait: true
            wait_timeout: 600
          loop: "{{ _cvd_ns.resources | default([]) | map(attribute='metadata.name') | list }}"
      always:
        - name: Remove the site kubeconfig
          ansible.builtin.file:
            path: "{{ site_kubeconfig | default('/tmp/eda-cvd-' ~ fab_namespace ~ '-' ~ fab_name ~ '-kubeconfig') }}"
            state: absent

    # P7.3.7: the sign-in client roles this environment created, unless another environment of the Entity on the same
    # site still grants them (the RoleBindings went with the namespaces)
    - name: Remove unused sign-in client roles
      when: (fab_st.access | default({}, true)).groups | default([], true) | length > 0
      block:
        - name: The Entity's other environments
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: hybridsovereign.redhat/v1alpha1
            kind: CloudVirt
            namespace: "{{ fab_namespace }}"
          register: _cvd_others

        - name: Roles still granted elsewhere
          ansible.builtin.set_fact:
            cvd_drop: >-
              {%- set keep = [] -%}
              {%- for o in _cvd_others.resources | default([]) if o.metadata.name != fab_name
                    and o.spec.cloudRef.name == fab_spec.cloudRef.name -%}
                {%- set _ = keep.extend(((o.status | default({}, true)).access | default({}, true)).groups | default([], true)) -%}
              {%- endfor -%}
              {{ fab_st.access.groups | difference(keep) }}

        - name: Delete the roles
          when: cvd_drop | length > 0
          block:
            - name: The platform's realization parameters
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
              vars:
                fab_real_fabric: ""

            - name: Discover the Keycloak route on services
              kubernetes.core.k8s_info:
                host: "{{ services_api_host }}"
                api_key: "{{ services_bearer_token }}"
                validate_certs: false
                api_version: route.openshift.io/v1
                kind: Route
                namespace: services-rhbk
                label_selectors: ["app=keycloak"]
              register: _cvd_kc_route

            - name: Keycloak admin credentials
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_admin_credentials.yml"
              vars:
                keycloak_vault_path: rhbk-services-admin

            - name: Keycloak admin token
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_admin_token.yml"
              vars:
                keycloak_url: "https://{{ _cvd_kc_route.resources[0].spec.host }}"

            - name: Find the sign-in client
              ansible.builtin.uri:
                url: >-
                  https://{{ _cvd_kc_route.resources[0].spec.host }}/admin/realms/{{ fab_real.openshift.tenantSignIn.realm
                  }}/clients?clientId={{ fab_st.access.signInClient }}
                headers: {Authorization: "Bearer {{ keycloak_admin_token }}"}
                validate_certs: false
              register: _cvd_client

            - name: Delete the client roles
              ansible.builtin.uri:
                url: >-
                  https://{{ _cvd_kc_route.resources[0].spec.host }}/admin/realms/{{ fab_real.openshift.tenantSignIn.realm
                  }}/clients/{{ _cvd_client.json[0].id }}/roles/{{ item | urlencode }}
                method: DELETE
                headers: {Authorization: "Bearer {{ keycloak_admin_token }}"}
                validate_certs: false
                status_code: [204, 404]
              loop: "{{ cvd_drop }}"
              when: _cvd_client.json | length > 0

    # TENANT-DNS D3 (T4): the environment zone goes with the environment, tenant records included
    - name: Delete the environment zone
      when: (fab_st.dns | default({}, true)).zoneId | default('', true) | length > 0
      block:
        - name: The platform's tenant DNS namespace
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_dns_config.yml"

        - name: The DNS-only account
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
          vars:
            os_account_vault_path: "{{ dnscfg_secret }}"
            os_account_tag: "cvd-dns-{{ fab_name }}"

        - name: Delete the zone
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
          vars:
            os_helper: shc_dns.py
            os_call_no_log: false
            os_request:
              action: delete-zone
              owner_project_id: "{{ fab_st.dns.owner }}"
              zone_id: "{{ fab_st.dns.zoneId }}"

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudvirts
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          deletionBlockedBy: []
          message: Deleted
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: CloudVirt, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}]

  rescue:
    - name: Mark the CloudVirt teardown failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudvirts
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          message: "{{ ansible_failed_result.msg | default('CloudVirt teardown failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudVirt {{ fab_name | default('unknown') }} teardown failed"
