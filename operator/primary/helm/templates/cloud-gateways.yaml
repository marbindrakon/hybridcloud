{{- /*
shc (design/P7-PLAN.md P7.3.3): the platform's CloudGateways (one per EVPN site) in the platform namespace, keyed
by name, each {spec: <CloudGateway spec>} (enabled: false skips one). Removing one from values does not delete it
(Prune=false): delete it by hand; its finalizer waits until no NetworkPlacement uses it.
*/}}
{{- range $name, $g := .Values.cloudGateways }}
{{- if ne (toString $g.enabled) "false" }}
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    hybridsovereign.redhat/managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Never pruned or deleted by Argo CD: removing it from values leaves it in the cluster (shown as
    # requiring pruning); delete it by hand once nothing uses it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    hybridsovereign.redhat/gitops-source: {{ printf "%s/cloudGateways/%s" (include "primary-operator.gitopsApp" $) $name | quote }}
spec:
  {{- toYaml $g.spec | nindent 2 }}
{{- end }}
{{- end }}
