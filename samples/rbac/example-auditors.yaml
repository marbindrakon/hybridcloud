# An access group (Rbac). Members sign in with the group example-corp.example-auditors; the platform team
# adds people to example-corp/example-auditors in the sign-in directory.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Rbac
metadata:
  name: example-auditors
  namespace: entity-example-corp
spec:
  description: Read-only access for reviews.
