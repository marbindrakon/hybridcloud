{{- if and .Values.crunchy.enabled (not .Values.registry.components.postgres.managed) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-db-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-db-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-db-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-db-init
subjects:
  - kind: ServiceAccount
    name: quay-db-init
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-db-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: quay-db-init
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: quay-pull-secret
      volumes:
        - name: shared-data
          emptyDir: {}
      initContainers:
        - name: extract-db-uri
          image: {{ .Values.dbInitJob.image | default "/hybrid-sovereign/ansible-runner:latest" }}
          env:
            - name: CRUNCHY_SECRET
              value: "{{ .Values.crunchy.name }}-pguser-quay"
            - name: NS
              value: "{{ .Values.namespace }}"
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Reading Crunchy postgres URI..."
              DB_URI=$(oc get secret "$CRUNCHY_SECRET" -n "$NS" -o jsonpath='{.data.uri}' | base64 -d)
              if [ -z "$DB_URI" ]; then
                echo "ERROR: Could not read DB URI from $CRUNCHY_SECRET"
                exit 1
              fi
              echo "$DB_URI" > /shared/db-uri.txt
              echo "DB_URI written to shared volume"
        - name: enable-pg-extensions
          image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-16.13-2610
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DB_URI=$(cat /shared/db-uri.txt)
              echo "Waiting for PostgreSQL to be ready..."
              for i in $(seq 1 30); do
                if psql "$DB_URI" -c "SELECT 1" >/dev/null 2>&1; then
                  echo "PostgreSQL is ready"
                  break
                fi
                echo "Attempt $i: waiting..."; sleep 5
              done
              echo "Enabling PostgreSQL extensions..."
              psql "$DB_URI" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" && \
                echo "pg_trgm enabled"
              psql "$DB_URI" -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;" && \
                echo "fuzzystrmatch enabled"
      containers:
        - name: inject-db-uri
          image: {{ .Values.dbInitJob.image | default "/hybrid-sovereign/ansible-runner:latest" }}
          env:
            - name: CRUNCHY_SECRET
              value: "{{ .Values.crunchy.name }}-pguser-quay"
            - name: BUNDLE_SECRET
              value: "{{ .Values.registry.configBundleSecretName | default (printf "%s-config-bundle" .Values.registry.name) }}"
            - name: NS
              value: "{{ .Values.namespace }}"
            {{- if .Values.oidc.enabled }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.name }}-oidc-client
                  key: client_secret
            - name: OIDC_CONFIG_KEY
              value: {{ .Values.oidc.configKey | quote }}
            {{- end }}
            {{- if .Values.rgw.enabled }}
            - name: RGW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.name }}-rgw
                  key: access_key
            - name: RGW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.name }}-rgw
                  key: secret_key
            {{- end }}
            {{- if or .Values.oidc.enabled .Values.rgw.enabled }}
            {{- $settings := dict }}
            {{- if .Values.oidc.enabled }}
            {{- $o := .Values.oidc }}
            {{- $_ := set $settings "AUTHENTICATION_TYPE" $o.authenticationType }}
            {{- $_ := set $settings $o.configKey (dict "SERVICE_NAME" $o.serviceName "CLIENT_ID" (required "oidc.clientId is required" $o.clientId) "OIDC_SERVER" (printf "%s/" (trimSuffix "/" (required "oidc.server is required" $o.server))) "LOGIN_SCOPES" $o.loginScopes "PREFERRED_GROUP_CLAIM_NAME" $o.groupClaim) }}
            {{- end }}
            {{- if .Values.rgw.enabled }}
            {{- $r := .Values.rgw }}
            {{- $_ := set $settings "DISTRIBUTED_STORAGE_CONFIG" (dict "default" (list "RadosGWStorage" (dict "hostname" (required "rgw.hostname is required" $r.hostname) "port" ($r.port | int) "is_secure" $r.isSecure "bucket_name" (required "rgw.bucket is required" $r.bucket) "storage_path" $r.storagePath))) }}
            {{- $_ := set $settings "DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS" (list) }}
            {{- $_ := set $settings "DISTRIBUTED_STORAGE_PREFERENCE" (list "default") }}
            {{- end }}
            # shc: non-secret config-bundle settings (JSON); the job adds the secrets from env
            - name: SHC_BUNDLE_SETTINGS
              value: {{ $settings | toJson | quote }}
            {{- end }}
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DB_URI=$(cat /shared/db-uri.txt)
              echo "Reading current configBundle..."
              CURRENT_CONFIG=$(oc get secret "$BUNDLE_SECRET" -n "$NS" -o jsonpath='{.data.config\.yaml}' | base64 -d)
              if echo "$CURRENT_CONFIG" | grep -q "^DB_URI:"; then
                echo "DB_URI already present in configBundle, skipping injection"
              else
                echo "Injecting DB_URI into configBundle..."
                NEW_CONFIG=$(printf '%s\nDB_URI: %s' "$CURRENT_CONFIG" "$DB_URI")
                NEW_CONFIG_B64=$(echo "$NEW_CONFIG" | base64 -w0)
                oc patch secret "$BUNDLE_SECRET" -n "$NS" \
                  --type=merge \
                  -p "{\"data\":{\"config.yaml\":\"${NEW_CONFIG_B64}\"}}"
                echo "configBundle updated with DB_URI"
              fi
              {{- if or .Values.oidc.enabled .Values.rgw.enabled }}
              # shc: merge OIDC login and RGW storage into the config bundle (operator-managed Quay has
              # no runtime config API). Patches only when a key differs; prints key names only.
              python3 - <<'PY'
              import base64, json, os, subprocess, yaml
              ns, name = os.environ["NS"], os.environ["BUNDLE_SECRET"]
              raw = subprocess.check_output(["oc", "get", "secret", name, "-n", ns, "-o", "jsonpath={.data.config\\.yaml}"])
              cur = yaml.safe_load(base64.b64decode(raw)) or {}
              want = json.loads(os.environ["SHC_BUNDLE_SETTINGS"])
              if os.environ.get("OIDC_CLIENT_SECRET"):
                  want[os.environ["OIDC_CONFIG_KEY"]]["CLIENT_SECRET"] = os.environ["OIDC_CLIENT_SECRET"]
              if os.environ.get("RGW_ACCESS_KEY"):
                  loc = want["DISTRIBUTED_STORAGE_CONFIG"]["default"][1]
                  loc["access_key"], loc["secret_key"] = os.environ["RGW_ACCESS_KEY"], os.environ["RGW_SECRET_KEY"]
              changed = sorted(k for k in want if cur.get(k) != want[k])
              if not changed:
                  print("configBundle already has the shc settings")
              else:
                  new = dict(cur)
                  new.update(want)
                  data = base64.b64encode(yaml.safe_dump(new, sort_keys=False).encode()).decode()
                  subprocess.check_call(["oc", "patch", "secret", name, "-n", ns, "--type=merge",
                                         "-p", json.dumps({"data": {"config.yaml": data}})])
                  print("configBundle updated: " + ", ".join(changed))
              PY
              {{- end }}
{{- end }}
