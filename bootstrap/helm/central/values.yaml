        - name: VAULT_NAMESPACE
          value: "central-vault"
        - name: VAULT_SECRET_PATH
          value: "central/quay-services-admin"
        - name: KEYCLOAK_URL
          value: "https://rhbk-services.apps.services.shc.signal9.gg"
        - name: KEYCLOAK_REALM
          value: "sovereign-tenants"
        - name: KEYCLOAK_CLIENT_ID
          value: "quay-services"
        - name: KEYCLOAK_ADMIN_SECRET
          value: "rhbk-services-admin-quay"
        - name: KEYCLOAK_ADMIN_SECRET_NS
          value: "sovereign-cloud-jobs"

    # ─── ACS Config: register clusters + configure OIDC ─────────────────────────
    acsConfig:
      enabled: true
