---
# One attachment circuit's BGP password from Vault (realization passwordPath), kept in hf_circuit_passwords (never
# logged). A password that's missing or holds characters a BGP configuration line can't carry isn't kept: the
# circuit is then not realized (attachments-plan skips an md5 circuit without a usable password).
# Input: hf_circuit {circuit, passwordPath}.
- name: "Read the BGP password of {{ hf_circuit.circuit }}"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ hf_circuit.passwordPath }}"
    vault_kv_read_missing_ok: true

- name: "Keep the BGP password of {{ hf_circuit.circuit }}"
  ansible.builtin.set_fact:
    hf_circuit_passwords: >-
      {{ hf_circuit_passwords | combine({hf_circuit.circuit: vault_kv_data.password}
           if vault_kv_data.password | default('') is match('^[A-Za-z0-9_.:,+=@%^*~-]{1,80}$') else {}) }}
    vault_kv_data: {}
  no_log: true
