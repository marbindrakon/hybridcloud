# shc: installed by the platform's HybridFabric job as /etc/systemd/system/frr.service.d/50-shc-reload.conf.
# The frr unit's reload (frrinit.sh reload) replaces the unit's main process (watchfrr) and then runs frr-reload.py.
# When frr-reload.py exits non-zero, systemd does not read the main process again, finds none, stops FRR at once and
# (Restart=always) starts it again: every session of the node resets. The "-" ignores the reload's exit status: FRR
# keeps running with what the reload applied, and systemctl show -p ExecReload keeps the status. The fabric job runs
# frr-reload.py itself for configuration changes and checks the result; this covers the one reload it leaves to
# systemd (a daemon the daemons file enables that does not run) and a reload typed by hand. Do not set Restart= to
# on-failure or on-abnormal: after such a stop FRR would stay down.
[Service]
ExecReload=
ExecReload=-/usr/libexec/frr/frrinit.sh reload
