apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "5"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
    shortNames:
      - proj
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            An app project: a set of application namespaces for a team on a tenant OpenShift
            cluster, comparable to an OpenShift project on that cluster (it is not an OpenStack
            project or a Google Cloud project). It creates namespaces only on the clusters a cluster
            assignment (Assignment) links it to.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: The app project.
              type: object
              properties:
                displayName:
                  description: Name shown for the app project.
                  type: string
                description:
                  description: What the app project is for.
                  type: string
                rbacConfig:
                  description: "Deprecated — do not set. RBAC is managed via Assignment CR toolRbac."
                  type: string
                projectAdmin:
                  description: "Deprecated — do not set. RBAC is managed via Assignment CR toolRbac."
                  type: array
                  items:
                    type: string
                projectDeveloperRbac:
                  description: "Deprecated — do not set. RBAC is managed via Assignment CR toolRbac."
                  type: array
                  items:
                    type: string
                projectViewerRbac:
                  description: "Deprecated — do not set. RBAC is managed via Assignment CR toolRbac."
                  type: array
                  items:
                    type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                name:
                  description: Name of the app project.
                  type: string
                namespace:
                  description: Namespace of the app project object.
                  type: string
                entity:
                  description: The tenant this app project belongs to.
                  type: string
                billingId:
                  description: The tenant's billing identifier.
                  type: string
                description:
                  description: The description as applied.
                  type: string
                status:
                  type: string
                  description: Short state word written by the platform's automation.
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: When the platform last finished processing this object (RFC 3339).
                message:
                  type: string
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Last-Reconciled
          type: date
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
