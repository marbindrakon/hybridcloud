---
# Custom EDA credential types — the Kafka connection for ansible.eda.kafka rulebooks: bootstrap
# endpoint and SASL credentials (shc LAB-PLAN §11.3: the endpoint was hardcoded in every rulebook).
# TLS verification is on in the rulebooks themselves (check_hostname, CERT_REQUIRED; §11.2).
# EDA refuses injector changes on a credential type in use: changing this means deleting the
# activations, the credential and the type, then re-running config-as-code.
eda_credential_types:
  - name: Sovereign Kafka Consumer
    description: AMQ Streams bootstrap endpoint and SASL credentials for operator event rulebooks
    inputs:
      fields:
        - id: bootstrap_host
          type: string
          label: Bootstrap host (external route)
        - id: bootstrap_port
          type: string
          label: Bootstrap port
        - id: username
          type: string
          label: SASL username
        - id: password
          type: string
          label: SASL password
          secret: true
      required: [bootstrap_host, bootstrap_port, username, password]
    # !unsafe: the eda_credential_types role passes injectors through untouched (it has no '{  {'
    # conversion like the controller role), so EDA must receive a literal {{ field }}.
    injectors:
      extra_vars:
        KAFKA_HOST: !unsafe "{{ bootstrap_host }}"
        KAFKA_PORT: !unsafe "{{ bootstrap_port }}"
        KAFKA_USERNAME: !unsafe "{{ username }}"
        KAFKA_PASSWORD: !unsafe "{{ password }}"
