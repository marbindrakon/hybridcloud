---
# shc (§11.6 phase C): environment preparation through files/shc_openstack.py with the platform's
# OpenStack account: the site's cloud admin (P7.1, CloudInfrastructure credentialsRef) or the legacy
# tenant admin (domain `manager`). Everything provision creates is recorded on the CR status so teardown
# works from ids, not from names it re-derives.
- name: Set environmentprep spec facts
  ansible.builtin.set_fact:
    ep_project: "{{ entity_name }}_{{ cloudoso_cr_name }}"
    # shc (P7.1): from the CloudInfrastructure (cloudref.yml), or the legacy spec/defaults
    ep_vault_path: "{{ oso_settings.vaultPath }}"
    ep_base_domain: "{{ oso_settings.baseDomain }}"
    ep_project_domain: "{{ oso_settings.projectDomain }}"
    ep_external_network: "{{ oso_settings.externalNetwork }}"
    ep_region_name: "{{ oso_settings.regionName }}"
    ep_dns_provider: "{{ oso_settings.dnsProvider | trim }}"
    ep_designate_zone_id: "{{ oso_settings.designateZoneId }}"
    ep_designate_project_id: "{{ oso_settings.designateProjectId }}"
    ep_route53_vault_path: "{{ oso_settings.route53VaultPath }}"
    ep_slug: "{{ (cloudoso_cr_name | hash('sha256'))[:5] }}"
    ep_clouds_config_vault: "oso/projects/{{ cloudoso_cr_name }}/clouds-config"

- name: Validate the CloudOSO environment settings
  ansible.builtin.assert:
    that:
      - ep_vault_path | length > 0
      - ep_project_domain | length > 0
      - ep_external_network | length > 0
      - ep_dns_provider in ['designate', 'route53', 'none']
      - ep_dns_provider == 'none' or ep_base_domain | length > 0
      - ep_dns_provider != 'designate' or (ep_designate_zone_id | length > 0 and ep_designate_project_id | length > 0)
      - ep_dns_provider != 'route53' or ep_route53_vault_path | length > 0
    fail_msg: >-
      CloudOSO {{ cloudoso_cr_name }} needs an account (vaultPath), projectDomain, externalNetwork and a DNS
      provider (designate: baseDomain + designateZoneId + designateProjectId; route53: baseDomain +
      route53VaultPath; none), from {{ ('CloudInfrastructure ' ~ oso_cloudinfra_name) if oso_cloudinfra_name | length > 0
      else "the spec or the installation's cloudoso_defaults" }}.

- name: Derive the environment DNS domain
  ansible.builtin.set_fact:
    # Designate: <cloudoso>.<entity>.<baseDomain> inside the delegated tenant zone (entity keeps two
    # entities' same-named CloudOSOs apart). Route53 keeps upstream's <slug>.<baseDomain>. none: no domain.
    ep_cluster_domain: >-
      {{ (cloudoso_cr_name ~ '.' ~ entity_name ~ '.' ~ ep_base_domain) if ep_dns_provider == 'designate'
         else ((ep_slug ~ '.' ~ ep_base_domain) if ep_dns_provider == 'route53' else '') }}

- name: Load the OpenStack account
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
  vars:
    os_account_vault_path: "{{ ep_vault_path }}"
    os_account_tag: "cloudoso-{{ cloudoso_cr_name }}"

- name: Read the existing project credential from Vault
  ansible.builtin.uri:
    url: >-
      {{ lookup('env', 'VAULT_ADDR') | default('http://vault-active.central-vault.svc:8200', true) }}/v1/central/data/{{ ep_clouds_config_vault }}
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    status_code: [200, 404]
    validate_certs: false
  register: ep_vault_creds
  no_log: true

- name: Reuse the recorded application credential only while Vault holds its secret
  ansible.builtin.set_fact:
    ep_reuse_app_cred_id: >-
      {{ (cloudoso_cr_lookup.resources[0].status.appCredentialId | default(''))
         if (ep_vault_creds.status == 200 and
             (ep_vault_creds.json.data.data['clouds.yaml'] | default('')) | length > 0) else '' }}

- name: Create or reconcile the project, floating IPs and application credential
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
  vars:
    os_request:
      action: provision
      domain: "{{ ep_project_domain }}"
      project: "{{ ep_project }}"
      description: "Sovereign Cloud project for {{ entity_name }} (CloudOSO {{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }})"
      external_network: "{{ ep_external_network }}"
      fip_descriptions:
        api: "sovereign-{{ cloudoso_cr_name }}-api"
        ingress: "sovereign-{{ cloudoso_cr_name }}-ingress"
      app_cred_name: "sovereign-{{ ep_project }}"
      app_cred_description: "CloudOSO {{ cloudoso_cr_namespace }}/{{ cloudoso_cr_name }}"
      reuse_app_cred_id: "{{ ep_reuse_app_cred_id }}"
      region: "{{ ep_region_name }}"
      dns_zone_id: "{{ ep_designate_zone_id if ep_dns_provider == 'designate' else '' }}"
      dns_project_id: "{{ ep_designate_project_id }}"

- name: Keep the provision result
  ansible.builtin.set_fact:
    ep_os: "{{ os_result }}"
  no_log: true

- name: Check the environment domain sits inside the Designate zone
  ansible.builtin.assert:
    that:
      - (ep_cluster_domain ~ '.').endswith('.' ~ ep_os.dns_zone.name)
    fail_msg: "{{ ep_cluster_domain }} is not inside Designate zone {{ ep_os.dns_zone.name }} (baseDomain {{ ep_base_domain }})"
  when: ep_dns_provider == 'designate'

- name: Write the project's clouds.yaml (new application credential) to Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_write.yml"
  vars:
    vault_kv_path: "{{ ep_clouds_config_vault }}"
    vault_kv_write_data:
      clouds.yaml: |
        clouds:
          openstack:
            auth:
              auth_url: "{{ ep_os.auth_url }}"
              application_credential_id: "{{ ep_os.app_cred.id }}"
              application_credential_secret: "{{ ep_os.app_cred.secret }}"
            region_name: "{{ ep_os.region }}"
            interface: "public"
            identity_api_version: 3
            auth_type: "v3applicationcredential"
  when: ep_os.app_cred.created | bool

- name: Read the Route53 credentials
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ ep_route53_vault_path }}"
  when: ep_dns_provider == 'route53'

- name: Find the parent Route53 hosted zone
  amazon.aws.route53_info:
    query: hosted_zone
  register: r53_zones
  environment:
    AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
    AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
    AWS_DEFAULT_REGION: "us-east-1"
  when: ep_dns_provider == 'route53'

- name: Set the Route53 zone id
  ansible.builtin.set_fact:
    ep_route53_zone_id: >-
      {{ (r53_zones.hosted_zones | selectattr('name', 'equalto', ep_base_domain ~ '.')
          | map(attribute='id') | first | default('')) | regex_replace('^/hostedzone/', '') }}
    vault_kv_data: {}
  when: ep_dns_provider == 'route53'

- name: Fail if the parent Route53 zone is missing
  ansible.builtin.fail:
    msg: "Parent Route53 zone '{{ ep_base_domain }}' not found"
  when: ep_dns_provider == 'route53' and ep_route53_zone_id | length == 0

- name: Set CloudOSO environmentprep output facts
  ansible.builtin.set_fact:
    oso_project_name: "{{ ep_os.project.name }}"
    oso_project_id: "{{ ep_os.project.id }}"
    oso_domain_id: "{{ ep_os.project.domain_id }}"
    oso_domain_name: "{{ ep_os.project.domain_name }}"
    oso_slug: "{{ ep_slug }}"
    oso_dns_domain: "{{ ep_cluster_domain }}"
    oso_route53_zone_id: "{{ ep_route53_zone_id | default('') }}"
    oso_api_vip: "{{ ep_os.fips.api.ip }}"
    oso_ingress_vip: "{{ ep_os.fips.ingress.ip }}"
    oso_external_network: "{{ ep_external_network }}"
    oso_record:
      accountVaultPath: "{{ ep_vault_path }}"
      appCredentialId: "{{ ep_os.app_cred.id }}"
      apiFloatingIPId: "{{ ep_os.fips.api.id }}"
      ingressFloatingIPId: "{{ ep_os.fips.ingress.id }}"
      dnsProvider: "{{ ep_dns_provider }}"
      dnsZoneId: "{{ ep_designate_zone_id if ep_dns_provider == 'designate' else (ep_route53_zone_id | default('')) }}"
      dnsZoneName: "{{ (ep_os.dns_zone.name | default('')) if ep_dns_provider == 'designate' else ((ep_base_domain ~ '.') if ep_dns_provider == 'route53' else '') }}"
      dnsProjectId: "{{ ep_designate_project_id if ep_dns_provider == 'designate' else '' }}"
      route53VaultPath: "{{ ep_route53_vault_path if ep_dns_provider == 'route53' else '' }}"
      vaultPaths:
        - "{{ ep_clouds_config_vault }}"
