apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsconfigs.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: DNSConfig
    listKind: DNSConfigList
    plural: dnsconfigs
    singular: dnsconfig
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Tenant DNS settings: the platform's tenant DNS namespace, one global domain under which
            every tenant environment gets a zone named <environment>.<tenant>.<domain>, whatever
            site the environment is on. Platform-owned; created in the integrations namespace
            sovereign-cloud-plugins. The platform uses the first ready DNSConfig.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required: [domain, provider, secret]
              x-kubernetes-validations:
                - rule: self.provider != 'designate' || has(self.designate)
                  message: spec.designate is required when spec.provider is designate
              properties:
                domain:
                  type: string
                  maxLength: 200
                  description: The global tenant DNS domain, e.g. tenants.example.com (no trailing dot).
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.domain is immutable
                provider:
                  type: string
                  enum: [designate]
                  description: DNS service that holds the global domain's zone.
                secret:
                  type: string
                  maxLength: 512
                  description: >-
                    Vault KV path of the DNS service credential. designate: key clouds.yaml (an account with the
                    member role on designate.projectId only) and optional ca.crt.
                designate:
                  type: object
                  description: The global domain's zone in Designate.
                  required: [projectId, zoneId]
                  properties:
                    projectId:
                      type: string
                      maxLength: 64
                      description: Project that owns the global domain's zone.
                    zoneId:
                      type: string
                      maxLength: 64
                      description: The global domain's zone.
                    zoneAttributes:
                      type: object
                      additionalProperties:
                        type: string
                        maxLength: 64
                      description: >-
                        Attributes set on every zone the platform creates in this DNS service, for example the
                        pool scheduler's scope. Unset leaves zone placement to the service's default.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                zone:
                  type: string
                  description: The global zone as the DNS service reports it.
                nameservers:
                  type: array
                  description: The global zone's NS records. An environment zone served by other nameservers is delegated from it.
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                delivery:
                  type: object
                  description: >-
                    Delivery of the latest change to the platform's automation. Platform detail, for the platform team.
                  properties:
                    eventId:
                      type: string
                      description: The latest change request sent to the automation.
                    reason:
                      type: string
                      description: What the latest change request asks for.
                    publishedAt:
                      type: string
                      description: When the latest change request was handed over (RFC 3339); empty while it is being sent.
                    publishFailingSince:
                      type: string
                      description: Since when handing over the latest change request has been failing (RFC 3339).
                    acknowledgedEventId:
                      type: string
                      description: The change request the automation last started work on.
                    jobId:
                      type: string
                      description: The automation run working on the acknowledged change request.
                    jobStartedAt:
                      type: string
                      description: When that run started (RFC 3339).
                    completedEventId:
                      type: string
                      description: The change request the automation last finished, successfully or not.
                    completedAt:
                      type: string
                      description: When that change request was finished (RFC 3339).
                    state:
                      type: string
                      description: >-
                        A delivery problem of the change request in stateEventId: NoAcknowledgement (no run picked it
                        up), Stalled (its run takes longer than allowed) or NoCompletion (its run ended without
                        finishing it). Empty when there is none.
                    stateSince:
                      type: string
                      description: Since when the delivery problem has been seen (RFC 3339).
                    stateEventId:
                      type: string
                      description: >-
                        The change request the delivery problem is about. A problem about an earlier change request
                        than eventId no longer applies.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
