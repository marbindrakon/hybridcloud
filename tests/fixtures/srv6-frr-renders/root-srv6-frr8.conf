! Managed by the platform: HybridFabric lab, border gateway root instance. Changes here are overwritten.
frr version 8.5
frr defaults traditional
hostname bgw-1
log syslog informational
service integrated-vtysh-config
!
! SRv6 core: the root is a provider edge for the egress and circuit VRFs, so it has a locator of its own for their
! SIDs. The discard route is what IS-IS announces for it (only the locator, through CORE-LOCATOR); the SIDs inside it
! are longer routes, so a packet for an unused SID is dropped here
ipv6 route 5f00:db8:101::/48 blackhole
!
ipv6 prefix-list CORE-LOCATOR seq 5 permit 5f00:db8:101::/48
!
route-map CORE-LOCATOR permit 10
 match ipv6 address prefix-list CORE-LOCATOR
exit
!
! the locator as micro-SIDs (32-bit block, 16-bit node, 16-bit function), in the form this FRR version prints back
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:db8:101::/48 block-len 32 node-len 16 func-bits 16
    behavior usid
   exit
  exit
 exit
exit
!
! The root is always the core LAN's designated IS (priority 127): a gateway that joined and won the election (equal
! priority, higher MAC) left FRR 8.5's LSPs on every node without the LAN's pseudonode, so no core routes, until the
! root restarted.
interface br-core
 ip router isis CORE
 ipv6 router isis CORE
 isis priority 127
exit
!
interface lo
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
! no graceful restart: when a gateway (a listen-range peer) is removed, FRR 8.5's restart timer for it still fired
! two minutes later on the deleted peer and bgpd aborted (every VPNv4 session down until watchfrr restarted it)
router bgp 65010
 bgp router-id 10.255.0.1
 bgp cluster-id 10.255.0.1
 no bgp default ipv4-unicast
 bgp graceful-restart-disable
 neighbor PE peer-group
 neighbor PE remote-as 65010
 neighbor PE update-source 2001:db8:4005:ffff::1
 neighbor PE capability extended-nexthop
 bgp listen range 2001:db8:4005:ffff::/64 peer-group PE
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
  neighbor PE route-map SHC-RR-IN6 in
 exit-address-family
exit
!
! provider internet egress: the hand-off's default route, and each network's NAT address back to its VRF;
! platform reach: each network's platform prefixes towards its VRF, and the platform's sources back to the hand-off
! IPv6 internet egress: the platform's routed space is discarded here and in every network VRF (the placement
! prefixes learned from the networks are longer), so unallocated space never loops between the upstream and the node
vrf egress
 ip route 0.0.0.0/0 198.51.100.1
 ip route 198.51.100.64/32 169.254.0.1
 ipv6 route 2001:db8:4005::/48 reject 254
exit-vrf
!
vrf e10000
 ip route 0.0.0.0/0 169.254.0.0
 ipv6 route 2001:db8:4005::/48 reject 254
exit-vrf
!
ip prefix-list SHC-EGRESS-DEFAULT seq 5 permit 0.0.0.0/0
!
route-map SHC-EGRESS-DEFAULT permit 10
 match ip address prefix-list SHC-EGRESS-DEFAULT
exit
!
ipv6 prefix-list SHC-DEFAULT6 seq 5 permit ::/0
ipv6 prefix-list SHC-ROUTED6 seq 5 permit 2001:db8:4005::/48 ge 49 le 64
ipv6 prefix-list SHC-EXTERNAL6 seq 5 permit 2001:db8:4005:7000::/64
ipv6 prefix-list E10000-PL6 seq 5 permit 2001:db8:4005:4200::/64
ipv6 prefix-list E10000-PL6 seq 10 permit 2001:db8:4005:4201::/64
!
route-map SHC-RR-IN6 deny 10
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map SHC-RR-IN6 permit 20
exit
route-map SHC-EGRESS-FROM-UP6 permit 10
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map SHC-EGRESS-FROM-UP6 permit 20
 match ipv6 address prefix-list SHC-EXTERNAL6
exit
route-map SHC-EGRESS-TO-UP6 permit 20
 match ipv6 address prefix-list SHC-ROUTED6
exit
route-map SHC-EGRESS-FROM-NET6 permit 10
 match ipv6 address prefix-list SHC-ROUTED6
exit
route-map SHC-EGRESS-TO-NET6 permit 10
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map E10000-FROM-EG6 permit 10
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map E10000-TO-EG6 permit 10
 match ipv6 address prefix-list E10000-PL6
exit
route-map E10000-VPN6 deny 5
 match ipv6 address prefix-list E10000-PL6
exit
route-map E10000-VPN6 permit 10
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map E10000-VPN6 permit 20
exit
route-map E10000-IMPORT6 deny 5
 match ipv6 address prefix-list SHC-DEFAULT6
exit
route-map E10000-IMPORT6 permit 10
exit
!
! AttachmentCircuit entity-acme/ce1 (VLAN 3000, CE 10.255.128.3 AS 64512): routes from the CE in the
! accept list and outside the deny list; to the CE the network's placement prefixes
ip prefix-list AC1-ACCEPT seq 5 permit 203.0.113.0/24
ip prefix-list AC1-DENY seq 5 permit 10.60.0.0/16
ip prefix-list AC1-OUT seq 5 permit 10.60.1.0/24
!
route-map AC1-IN deny 10
 match ip address prefix-list AC1-DENY
exit
!
route-map AC1-IN permit 20
 match ip address prefix-list AC1-ACCEPT
exit
!
route-map AC1-OUT permit 10
 match ip address prefix-list AC1-OUT
exit
!
! AttachmentCircuit entity-acme/ce1 over IPv6 (link 2001:db8:4005:100::/64, CE 2001:db8:4005:100::3): the same rules from the
! IPv6 lists; to the CE the network's IPv6 placement prefixes and the default route
ipv6 prefix-list AC1-ACCEPT6 seq 5 permit 2001:db8:50::/48 le 64
ipv6 prefix-list AC1-DENY6 seq 5 permit 2001:db8:4005:4200::/56 le 128
ipv6 prefix-list AC1-DENY6 seq 10 permit 2001:db8:4005::/52 le 128
ipv6 prefix-list AC1-DENY6 seq 15 permit ::/0
ipv6 prefix-list AC1-OUT6 seq 5 permit 2001:db8:4005:4200::/64 le 128
ipv6 prefix-list AC1-OUT6 seq 10 permit ::/0
!
route-map AC1-IN6 deny 10
 match ipv6 address prefix-list AC1-DENY6
exit
!
route-map AC1-IN6 permit 20
 match ipv6 address prefix-list AC1-ACCEPT6
exit
!
route-map AC1-OUT6 permit 10
 match ipv6 address prefix-list AC1-OUT6
exit
!
! HybridNetwork acme/core: internet egress (source NAT 198.51.100.64 on this node) attachment circuits AC1 IPv6 internet egress (primary node) (VPN 65010:10000)
router bgp 65010 vrf e10000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 sid vpn per-vrf export auto
 neighbor xe10000 interface v6only remote-as external
 neighbor xe10000 description IPv6 egress of acme/core
 neighbor 10.255.128.3 remote-as 64512
 neighbor 10.255.128.3 description AC1 entity-acme/ce1
 neighbor 10.255.128.3 timers 10 30
 neighbor 10.255.128.3 bfd
 neighbor 2001:db8:4005:100::3 remote-as 64512
 neighbor 2001:db8:4005:100::3 description AC16 entity-acme/ce1
 neighbor 2001:db8:4005:100::3 timers 10 30
 neighbor 2001:db8:4005:100::3 bfd
 !
 address-family ipv4 unicast
  redistribute static route-map SHC-EGRESS-DEFAULT
  neighbor 10.255.128.3 activate
  neighbor 10.255.128.3 route-map AC1-IN in
  neighbor 10.255.128.3 route-map AC1-OUT out
  neighbor 10.255.128.3 maximum-prefix 100 restart 2
  rd vpn export 65010:10000
  rt vpn both 65010:10000
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  aggregate-address 2001:db8:4005:4200::/64
  aggregate-address 2001:db8:4005:4201::/64
  neighbor xe10000 activate
  neighbor xe10000 route-map E10000-FROM-EG6 in
  neighbor xe10000 route-map E10000-TO-EG6 out
  neighbor xe10000 maximum-prefix 10
  neighbor 2001:db8:4005:100::3 activate
  neighbor 2001:db8:4005:100::3 route-map AC1-IN6 in
  neighbor 2001:db8:4005:100::3 route-map AC1-OUT6 out
  neighbor 2001:db8:4005:100::3 maximum-prefix 100 restart 2
  rd vpn export 65010:10000
  rt vpn both 65010:10000
  route-map vpn export E10000-VPN6
  route-map vpn import E10000-IMPORT6
  export vpn
  import vpn
 exit-address-family
exit
!
! the egress VRF (AS 65011): single-hop eBGP to the upstream routers (in: the default route; out: the placement
! prefixes, prepended for the networks this node is the standby of) and unnumbered eBGP to each network's VRF over
! its veth (in: its placement prefixes; out: the default route). Timers 10/30, no BFD, no password.
router bgp 65011 vrf egress
 bgp router-id 198.51.100.13
 no bgp default ipv4-unicast
 bgp graceful-restart-disable
 neighbor xo10000 interface v6only remote-as external
 neighbor xo10000 description IPv6 egress of acme/core
 neighbor 2001:db8:237::2 remote-as 65002
 neighbor 2001:db8:237::2 description upstream
 neighbor 2001:db8:237::2 timers 10 30
 neighbor 2001:db8:237::2 timers connect 5
 neighbor 2001:db8:237::3 remote-as 65002
 neighbor 2001:db8:237::3 description upstream
 neighbor 2001:db8:237::3 timers 10 30
 neighbor 2001:db8:237::3 timers connect 5
 !
 address-family ipv6 unicast
  neighbor xo10000 activate
  neighbor xo10000 route-map SHC-EGRESS-FROM-NET6 in
  neighbor xo10000 route-map SHC-EGRESS-TO-NET6 out
  neighbor xo10000 maximum-prefix 1000
  neighbor 2001:db8:237::2 activate
  neighbor 2001:db8:237::2 route-map SHC-EGRESS-FROM-UP6 in
  neighbor 2001:db8:237::2 route-map SHC-EGRESS-TO-UP6 out
  neighbor 2001:db8:237::2 maximum-prefix 10
  neighbor 2001:db8:237::3 activate
  neighbor 2001:db8:237::3 route-map SHC-EGRESS-FROM-UP6 in
  neighbor 2001:db8:237::3 route-map SHC-EGRESS-TO-UP6 out
  neighbor 2001:db8:237::3 maximum-prefix 10
 exit-address-family
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 redistribute ipv6 static level-2 route-map CORE-LOCATOR
exit
!
