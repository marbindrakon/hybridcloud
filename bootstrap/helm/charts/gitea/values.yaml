gitea:
  global:
    storageClass: ""
    security:
      allowInsecureImages: true
    imagePullSecrets:
      - quay-pull-secret

  replicaCount: 1

  image:
    registry: 
    repository: hybrid-sovereign/gitea
    tag: "28.1.0"
    rootless: true

  gitea:
    admin:
      existingSecret: ""
    config:
      server:
        DOMAIN: ""
        ROOT_URL: ""
      database:
        DB_TYPE: postgres
      session:
        PROVIDER: memory
      cache:
        ADAPTER: memory
      queue:
        TYPE: level

  postgresql:
    enabled: true
    image:
      registry: 
      repository: hybrid-sovereign/postgresql
      tag: "17.6.0-debian-12-r4"
    volumePermissions:
      image:
        registry: 
        repository: hybrid-sovereign/os-shell
        tag: "12-debian-12-r51"

  postgresql-ha:
    enabled: false

  redis:
    enabled: false

  redis-cluster:
    enabled: false

  valkey-cluster:
    enabled: true
    image:
      registry: 
      repository: hybrid-sovereign/valkey-cluster
      tag: "8.1.3-debian-12-r3"
    volumePermissions:
      image:
        registry: 
        repository: hybrid-sovereign/os-shell
        tag: "12-debian-12-r51"
    sysctlImage:
      registry: 
      repository: hybrid-sovereign/os-shell
      tag: "12-debian-12-r51"

  persistence:
    enabled: true
    size: 10Gi

  ingress:
    enabled: false

  route:
    enabled: true

pullSecret:
  enabled: false
  dockerconfigjson: ""

giteaTokenExternalSecret:
  enabled: false
  targetNamespace: sovereign-cloud-plugins
  targetSecretName: gitea-admin-token
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  vaultPath: gitea-admin
  refreshInterval: "1h"

adminCredentialsExternalSecret:
  enabled: false
  namespace: gitea
  secretName: gitea-admin-credentials
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  vaultPath: gitea-admin
  refreshInterval: "1h"

pullSecretExternalSecret:
  enabled: false
  namespace: gitea
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  vaultPath: oci-credentials
  refreshInterval: "1h"

crunchy:
  enabled: false
  name: gitea-pgcluster
  namespace: gitea
  instances: 2
  storage: 10Gi
  backupStorage: 10Gi
  # Backups of the database (schedules are cron, UTC). A full backup on fullSchedule and a differential one on
  # differentialSchedule (empty: none; it must not fall on the full backup's day and minute). retentionFull full
  # backups are kept, with the differential ones and the write-ahead log that follow them: the database can be
  # restored to any moment since the oldest kept full backup, about retentionFull times the full interval back.
  # Of the differential backups the newest retentionDifferential are kept. Older ones expire when a backup
  # completes. Size the backup volume for retentionFull + 1 full backups, retentionDifferential differential
  # ones, and the write-ahead log of retentionFull + 1 full intervals.
  backup:
    retentionFull: 2
    retentionDifferential: 2
    fullSchedule: "30 1 * * 0"
    differentialSchedule: "30 1 * * 1-6"
    # The waiting archive (pgBackRest archive-push-queue-max). When write-ahead log cannot be archived, for
    # example because the backup volume is full or unreachable, the segments wait in the data volume. Past this size
    # they are dropped and the database's log says "dropped WAL file ... because archive queue exceeded ...": the
    # database keeps running instead of filling its data volume and stopping, but it can no longer be restored to a
    # moment between the drop and the next completed backup. auto: a quarter of storage (storage must then be a whole
    # number of Mi, Gi or Ti); a size such as 4GiB or 2560MiB; empty: no limit (the data volume fills and the
    # database stops).
    archivePushQueueMax: auto
