# Sample CloudVirt: a VM environment of acme-corp on the OpenShift Virtualization site "virt-site".
# Namespace "vms" uses the site's default network; "payments" puts its VMs on the HybridNetwork payments-vpc
# (once a NetworkPlacement places payments-vpc on this environment). On the site they become acme-corp-dev-vms
# and acme-corp-dev-payments.
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: dev
  namespace: entity-acme-corp
spec:
  cloudRef: {name: virt-site}
  namespaces:
    - {name: vms}
    - {name: payments, network: payments-vpc}
  quota: {cpu: 16, memory: 64Gi, storage: 1Ti, virtualMachines: 20}
  toolRbac:
    editRbac: [acme-platform-admins]
