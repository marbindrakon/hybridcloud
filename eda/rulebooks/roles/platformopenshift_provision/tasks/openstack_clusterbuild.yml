---
- name: Validate slug is 5 characters (Route53 environments)
  ansible.builtin.assert:
    that:
      - cb_slug | length == 5
    fail_msg: "CloudOSO slug must be exactly 5 characters. Got: '{{ cb_slug }}'"
  when: not (use_designate_dns | default(false) | bool)

- name: Derive cluster identifiers
  ansible.builtin.set_fact:
    cb_app_name: "{{ ansible_operator_meta.name }}"
    cb_cluster_name: "{{ ansible_operator_meta.name }}"
    cb_image_set: "{{ platform_spec.openstack.ocpImageSet | default(default_ocp_image_set, true) }}"
    cb_controller_flavor: "{{ oso_control_plane_flavor }}"
    cb_worker_flavor: "{{ oso_worker_flavor }}"
    cb_control_plane_count: "{{ oso_control_plane_count }}"
    cb_worker_count: "{{ oso_worker_count }}"
    cb_pull_secret_vault: "{{ platform_spec.openstack.pullSecretVaultPath | default(default_pull_secret_vault_path, true) }}"
    cb_pull_secret_vault_property: "{{ platform_spec.openstack.pullSecretVaultProperty | default(default_pull_secret_vault_property, true) }}"
    cb_ssh_key_vault: "{{ platform_spec.openstack.sshKeyVaultPath | default(default_ssh_key_vault_path, true) }}"
    cb_provider_creds_vault: "oso/projects/{{ oso_env_name }}/clouds-config"
    # shc (§11.6 phase C): per cluster (two clusters on one CloudOSO overwrote each other)
    cb_install_config_vault: "oso/projects/{{ oso_env_name }}/clusters/{{ ansible_operator_meta.name }}/install-config"
    cb_trust_bundle: "{{ platform_spec.openstack.trustBundle | default('') }}"
    cb_glance_image: "{{ platform_spec.openstack.glanceImageOverride | default(default_glance_image_override, true) }}"
    # resolvers for the cluster subnet (empty: the cloud's DHCP default)
    cb_external_dns: "{{ platformopenshift_defaults.externalDNS | default([]) }}"

- name: Record the Vault paths this cluster writes (install-config here, PushSecrets in the monitor)
  ansible.builtin.set_fact:
    cb_vault_paths:
      - "{{ cb_install_config_vault }}"
      - "cluster/oso/{{ cb_app_name }}/admin-kubeconfig"
      - "cluster/oso/{{ cb_app_name }}/admin-password"
      - "cluster/oso/{{ cb_app_name }}/ssh-key"
      - "cluster/oso/{{ cb_app_name }}/install-config"

- name: Fail without a cluster-build chart
  ansible.builtin.assert:
    that:
      - (mce_cluster_build_chart | trim) is match('oci://[^/]+/')
    fail_msg: >-
      Set platformopenshift_defaults.mceClusterBuildChart (or env OCI_HOST) for the mce-cluster-build chart
      (got '{{ mce_cluster_build_chart | trim }}').

- name: Clean up failed or stale Hive cluster build before reprovisioning
  ansible.builtin.include_tasks: cleanup_stale_clusterbuild.yml

- name: Create Route53 records for the cluster
  when: not (use_designate_dns | default(false) | bool)
  block:
    - name: Read the Route53 credentials
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
      vars:
        vault_kv_path: "{{ cb_route53_vault_path }}"

    - name: Create Route53 A records for the API and apps wildcard
      amazon.aws.route53:
        state: present
        zone: "{{ cb_base_domain }}"
        record: "{{ item.name }}"
        type: A
        ttl: 300
        value:
          - "{{ item.ip }}"
        overwrite: true
      environment:
        AWS_ACCESS_KEY_ID: "{{ vault_kv_data['access-key'] }}"
        AWS_SECRET_ACCESS_KEY: "{{ vault_kv_data['secret-access-key'] }}"
        AWS_DEFAULT_REGION: "us-east-1"
      loop:
        - {name: "api.{{ cb_cluster_name }}.{{ cb_cluster_domain }}", ip: "{{ cb_api_vip }}"}
        - {name: "*.apps.{{ cb_cluster_name }}.{{ cb_cluster_domain }}", ip: "{{ cb_ingress_vip }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: Record the Route53 records
      ansible.builtin.set_fact:
        vault_kv_data: {}
        cb_dns_records:
          - {zone: "{{ cb_base_domain }}", name: "api.{{ cb_cluster_name }}.{{ cb_cluster_domain }}", type: A}
          - {zone: "{{ cb_base_domain }}", name: "*.apps.{{ cb_cluster_name }}.{{ cb_cluster_domain }}", type: A}

- name: Create Designate DNS records for internet-facing cluster
  ansible.builtin.include_tasks: designate_dns.yml
  when: use_designate_dns | default(false) | bool

- name: Read the OCP pull secret
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ cb_pull_secret_vault }}"

- name: Keep the pull secret
  ansible.builtin.set_fact:
    cb_pull_secret_raw: "{{ vault_kv_data[cb_pull_secret_vault_property] | default('') }}"
  no_log: true

- name: Read the cluster SSH key
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ cb_ssh_key_vault }}"

- name: Keep the SSH public key
  ansible.builtin.set_fact:
    cb_ssh_public_key: "{{ vault_kv_data.ssh_public_key | default('') }}"
    vault_kv_data: {}
  no_log: true

- name: Fail without a pull secret or SSH key
  ansible.builtin.assert:
    that:
      - cb_pull_secret_raw | string | length > 0
      - cb_ssh_public_key | length > 0
    fail_msg: >-
      Vault {{ cb_pull_secret_vault }} (property {{ cb_pull_secret_vault_property }}) or
      {{ cb_ssh_key_vault }} (ssh_public_key) is missing.

- name: Normalize pull secret to valid JSON
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, ast, json
        raw = sys.stdin.read().strip()
        try:
            parsed = json.loads(raw)
            print(json.dumps(parsed, separators=(',', ':')))
        except (json.JSONDecodeError, ValueError):
            try:
                parsed = ast.literal_eval(raw)
                print(json.dumps(parsed, separators=(',', ':')))
            except Exception:
                print(raw)
    stdin: "{{ cb_pull_secret_raw if (cb_pull_secret_raw is string) else (cb_pull_secret_raw | to_json) }}"
  register: _pull_secret_json_result
  no_log: true
  changed_when: false

- name: Set normalized pull secret JSON
  ansible.builtin.set_fact:
    cb_pull_secret_json: "{{ _pull_secret_json_result.stdout | trim }}"
  no_log: true

- name: Render OpenStack install-config YAML
  ansible.builtin.set_fact:
    cb_install_config: "{{ lookup('template', 'install-config-openstack.yaml.j2') }}"
  no_log: true

- name: Write install-config to Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_write.yml"
  vars:
    vault_kv_path: "{{ cb_install_config_vault }}"
    vault_kv_write_data:
      install-config.yaml: "{{ cb_install_config }}"

- name: Render build-values YAML to tempfile
  ansible.builtin.copy:
    content: "{{ lookup('template', 'build-values.yaml.j2') }}"
    dest: "/tmp/{{ cb_app_name }}-build-values.yaml"
    mode: '0600'
  changed_when: false

- name: Write central cluster kubeconfig for Helm
  ansible.builtin.include_tasks: write_central_helm_kubeconfig.yml

# shc (§11.6 phase C): the chart registry may be private; the platform pull secret is a Docker
# config.json, which Helm reads as its registry config.
- name: Write the Helm registry config from the pull secret
  ansible.builtin.copy:
    content: "{{ cb_pull_secret_json }}"
    dest: "/tmp/{{ cb_app_name }}-registry.json"
    mode: "0600"
  no_log: true

- name: Check existing Helm release
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - json
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_release_status
  failed_when: false
  changed_when: false

- name: Set helm release exists flag
  ansible.builtin.set_fact:
    cb_helm_release_exists: "{{ helm_release_status.rc == 0 }}"

- name: Set helm release failed flag
  ansible.builtin.set_fact:
    cb_helm_release_failed: >-
      {{ cb_helm_release_exists | bool and
         (helm_release_status.stdout | from_json).info.status | default('') == 'failed' }}
  when: cb_helm_release_exists | bool

- name: Set helm release failed flag (when release does not exist)
  ansible.builtin.set_fact:
    cb_helm_release_failed: false
  when: not (cb_helm_release_exists | bool)

- name: Get current Helm values for idempotency check
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - yaml
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_current_values
  failed_when: false
  changed_when: false
  when: cb_helm_release_exists | bool

- name: Determine if Helm upgrade is needed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        new = yaml.safe_load(open('/tmp/{{ cb_app_name }}-build-values.yaml').read()) or {}
        cur_raw = """{{ helm_current_values.stdout | default('null') }}"""
        cur = yaml.safe_load(cur_raw) or {}
        print("true" if new != cur else "false")
  register: values_diff_result
  changed_when: false
  when: cb_helm_release_exists | bool

- name: Set values changed flag
  ansible.builtin.set_fact:
    cb_values_changed: >-
      {{ not (cb_helm_release_exists | bool) or
         (cb_helm_release_failed | bool) or
         (values_diff_result.stdout | default('true') | trim == 'true') }}

- name: Deploy mce-cluster-build chart
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - "{{ cb_app_name }}"
      - "{{ mce_cluster_build_chart | trim }}"
      - --version
      - "{{ mce_cluster_build_chart_version }}"
      - --install
      - --namespace
      - "{{ cb_cluster_name }}"
      - --create-namespace
      - --values
      - "/tmp/{{ cb_app_name }}-build-values.yaml"
      - --history-max
      - "2"
      - --wait
      - --timeout
      - "10m"
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
      - --registry-config
      - "/tmp/{{ cb_app_name }}-registry.json"
  register: helm_deploy_result
  when: cb_values_changed | bool
  changed_when: "'has been upgraded' in helm_deploy_result.stdout or 'Installing it now' in helm_deploy_result.stdout"

- name: Clean up temp values and registry files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/{{ cb_app_name }}-build-values.yaml"
    - "/tmp/{{ cb_app_name }}-registry.json"
  changed_when: false

- name: Monitor cluster deployment and push secrets
  ansible.builtin.include_tasks: openstack_clusterbuild_monitor.yml
