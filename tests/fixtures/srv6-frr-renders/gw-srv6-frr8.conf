! Managed by the platform: CloudGateway site1 (site site1) on bgw-1. Changes here are overwritten.
frr version 8.5
frr defaults datacenter
hostname bgw-1-gw-site1
log syslog informational
service integrated-vtysh-config
!
vrf t51000
 vni 51000
exit-vrf
!
vrf t51003
 vni 51003
exit-vrf
!
!
! SRv6 core: the VPN SIDs come from this gateway's locator. The discard route is what IS-IS announces for it (only the
! locator, through CORE-LOCATOR); the SIDs inside it are longer routes, so a packet for an unused SID is dropped here
ipv6 route 5f00:db8:102::/48 blackhole
!
ipv6 prefix-list CORE-LOCATOR seq 5 permit 5f00:db8:102::/48
!
route-map CORE-LOCATOR permit 10
 match ipv6 address prefix-list CORE-LOCATOR
exit
!
! the locator as micro-SIDs (32-bit block, 16-bit node, 16-bit function), in the form this FRR version prints back
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:db8:102::/48 block-len 32 node-len 16 func-bits 16
    behavior usid
   exit
  exit
 exit
exit
!
interface lo
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
interface core0
 ip router isis CORE
 ipv6 router isis CORE
exit
!
! routes the gateways originate into the site carry this community; a gateway never takes them back from the site
bgp community-list standard GW-ORIG seq 5 permit 65010:999
!
! site-import filter: per address family only the placements' prefixes, and the host routes inside them, enter from
! the site; any other prefix of that family is refused. Prefix lists only: FRR 8.5 never matches `match evpn
! route-type prefix` on routes it receives, and a prefix-list match skips routes that carry no IP prefix of its
! family, so the final permit keeps the site's other routes (inclusive multicast, MAC-only MAC/IP routes, the other
! family) flowing through the gateway's route reflection.
! An entry's sequence number is its prefix's own (the first 8 hex digits of its SHA-256, kept inside 10..4000000000;
! a collision takes the next free number, in prefix order), so a placement added or removed elsewhere leaves the
! other entries as they are: a reload adds or deletes one line instead of renumbering the list (which would
! delete and re-add every entry and could flap the other tenants' routes)
ipv6 prefix-list SITE-V6 seq 565399381 permit 2001:db8:100:1::/64 le 128
ipv6 prefix-list ANY-V6 seq 5 permit ::/0 le 128
!
route-map FROM-SITE deny 10
 match community GW-ORIG
exit
route-map FROM-SITE permit 20
 match ipv6 address prefix-list SITE-V6
exit
route-map FROM-SITE deny 30
 match ipv6 address prefix-list ANY-V6
exit
route-map FROM-SITE permit 40
exit
!
route-map GW-T5 permit 10
 set community 65010:999 additive
exit
!
! routes this gateway originates for its own site (its unreachable IPv6 default while the network has no IPv6 egress,
! the covering routes) carry this community and stay out of the network's VPN: at another site they would compete with
! the real routes (a default with an empty AS path beats the egress default)
bgp community-list standard GW-LOCAL seq 5 permit 65010:997
route-map GW-LOCAL permit 10
 set community 65010:997 additive
exit
!
! the site's route targets and router MAC stay out of the core. One map per network: FRR 9 and later attach the
! export route target before this map runs, so the map sets it again (`set extcommunity none` alone would strip it
! and nothing would reach the VPN); FRR 8.5 adds the same route target after the map
route-map TO-VPN-10000 deny 5
 match community GW-LOCAL
exit
route-map TO-VPN-10000 permit 10
 set extcommunity none
 set extcommunity rt 65010:10000
exit
route-map TO-VPN-10001 deny 5
 match community GW-LOCAL
exit
route-map TO-VPN-10001 permit 10
 set extcommunity none
 set extcommunity rt 65010:10001
exit
!
! no graceful restart: a removed listen-range peer (a site node, a gateway) left FRR 8.5 a restart timer that
! crashed bgpd when it fired (design/P7-PLAN.md §12.22)
router bgp 65010
 bgp router-id 192.0.2.4
 no bgp default ipv4-unicast
 bgp graceful-restart-disable
 neighbor SITE peer-group
 neighbor SITE remote-as 65010
 neighbor SITE bfd
 bgp listen range 192.0.2.0/24 peer-group SITE
 neighbor 2001:db8:4005:ffff::1 remote-as 65010
 neighbor 2001:db8:4005:ffff::1 description border gateway route reflector
 neighbor 2001:db8:4005:ffff::1 update-source 2001:db8:4005:ffff::2
 neighbor 2001:db8:4005:ffff::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family l2vpn evpn
  neighbor SITE activate
  neighbor SITE route-reflector-client
  neighbor SITE route-map FROM-SITE in
  neighbor SITE soft-reconfiguration inbound
  advertise-all-vni
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 2001:db8:4005:ffff::1 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001:db8:4005:ffff::1 activate
 exit-address-family
exit
!
! NetworkPlacement entity-acme/core-site1: the site's routes (layer 3 VNI 51000) <-> the network's VPN (65010:10000)
router bgp 65010 vrf t51000
 bgp router-id 192.0.2.4
 no bgp default ipv4-unicast
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  rd vpn export 65010:51000
  rt vpn both 65010:10000
  nexthop vpn export 2001:db8:4005:ffff::2
  route-map vpn export TO-VPN-10000
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  network ::/0 route-map GW-LOCAL
  rd vpn export 65010:51000
  rt vpn both 65010:10000
  nexthop vpn export 2001:db8:4005:ffff::2
  route-map vpn export TO-VPN-10000
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map GW-T5
  advertise ipv6 unicast route-map GW-T5
  route-target import 65010:51000
  route-target export 65010:51000
 exit-address-family
exit
!
! NetworkPlacement entity-acme/batch-site1: the site's routes (layer 3 VNI 51003) <-> the network's VPN (65010:10001)
router bgp 65010 vrf t51003
 bgp router-id 192.0.2.4
 no bgp default ipv4-unicast
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  rd vpn export 65010:51003
  rt vpn both 65010:10001
  nexthop vpn export 2001:db8:4005:ffff::2
  route-map vpn export TO-VPN-10001
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map GW-T5
  route-target import 65010:51003
  route-target export 65010:51003
 exit-address-family
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 redistribute ipv6 static level-2 route-map CORE-LOCATOR
exit
!
