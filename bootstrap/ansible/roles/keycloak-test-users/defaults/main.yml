    email: "acme-platform-ops-admin@example.com"
    firstName: "Acme"
    lastName: "PlatformOpsAdmin"
    groups:
      - "/acme-corp/platform-admins"

  - realm: "sovereign-tenants"
    keycloak_url_key: services
