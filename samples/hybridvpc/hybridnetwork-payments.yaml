# Sample HybridNetwork: a routed private network of the Entity acme-corp on the platform's fabric, with its address
# space; the platform allocates the placements' subnets from it.
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: payments-vpc
  namespace: entity-acme-corp
spec:
  description: Application payments tier hybrid network
  mtu: 9000
  prefixes: [10.50.0.0/16]
