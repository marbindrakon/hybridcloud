# Resource-scoped grants of the Team and Project access fields (plan be-tenantprofile-catalogue section 4, rows R7-R15;
# OD15 revised, OD28). The objects and access groups are those of fixtures/scope-fixture.yaml:
#   Team platform: teamAdmin team-admins, teamMemberRbac team-members, teamViewerRbac team-viewers;
#   Assignment platform-dev (team platform, projects webshop, api); Team other + Assignment other-dev (project billing);
#   Project webshop: projectAdmin project-admins, projectDeveloperRbac project-devs, projectViewerRbac project-viewers.
# R10b-R10d (who may change the lists) are admission checks: tests/access/test-access-fields.sh.
# Run them in envtest as tenant sar-scope (only_entity):
#   sar_matrix.py --cluster envtest --render-roles --entity sar-scope --entity-spec <namespaceRbac file>
#     --scope-fixture tests/rbac-access/fixtures/scope-fixture.yaml --profile scope-role
# list with a name = a list that selects that one name (fieldSelector metadata.name); an unfiltered list is denied.
- id: R7-team-admin-edits-team
  resolves: [OD15, UX-015]
  requires: scope-fixture
  only_entity: sar-scope
  principal: {groups: ["{rbac:team-admins}", system:authenticated, system:authenticated:oauth]}
  namespace: entity-{entity}
  resource: {group: hybridsovereign.redhat, resource: teams, name: platform}
  verbs: [get, list, watch, update, patch]
  expect: allow
