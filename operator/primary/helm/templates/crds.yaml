    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Platform-owned network fabric that connects tenant networks across cloud sites. Every site keeps its
            own EVPN-VXLAN domain; a CloudGateway per site terminates it on the border gateway, and the border
            gateway carries each tenant network between the sites it is placed on, isolated from every other
            network. The fabric holds the site-visible numbering (VNI pools), the border gateway and its
            credentials; tenants reference it from their HybridNetworks. How the border gateway realizes this is
            the platform's choice.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [domainAsn, overlayMtu, vniPool, l2vniPool, borderGateway]
              x-kubernetes-validations:
                - rule: >-
                    self.vniPool.end < self.l2vniPool.start || self.l2vniPool.end < self.vniPool.start
                  message: vniPool and l2vniPool must not overlap
              properties:
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                  description: >-
                    BGP AS number of the fabric: the sites' EVPN sessions, the cloud gateways and the border
                    gateway all use it. Immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.domainAsn is immutable
                overlayMtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    Largest MTU a tenant network on this fabric can offer its workloads, and the default for new
                    networks. Every site underlay and the border gateway trunk must carry overlayMtu + 50 bytes
                    (VXLAN encapsulation).
                vniPool:
                  type: object
                  description: >-
                    VNIs for the IP-VRFs (layer 3 VNI) of network placements, one per placement. A VNI is only
                    meaningful inside its site's EVPN domain. A pool change that would drop allocated numbers is
                    refused.
                  required: [start, end]
                  x-kubernetes-validations:
                    - rule: self.start <= self.end
                      message: start must not exceed end
                  properties:
                    start:
                      type: integer
