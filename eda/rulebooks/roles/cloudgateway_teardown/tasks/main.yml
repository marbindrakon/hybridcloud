---
# shc (design/P7-PLAN.md P7.3.5): CloudGateway teardown. The operator's finalizer waited for the network
# placements that use the gateway. Under the fabric's lease, one node at a time: the gateway instance comes off.
# Then the site side (OpenShift: the VTEP when this gateway created it; OpenStack: the platform project, refused
# while it still holds networks) and the gateway's provider-edge index in the ledger. The names of the nodes' ICMPv6
# sources (status.realization.reverseDns, design/IPV6-PLAN.md §8.3) go once the instance is off the nodes: the PTR,
# then the AAAA (a removal that fails is a note in the final message; the addresses come from the core's own pool).
- block:
    - name: Read the CloudGateway
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"

    - name: Set the facts
      ansible.builtin.set_fact:
        cg_fabric_name: "{{ fab_spec.fabricRef.name }}"
        cg_site_name: "{{ fab_spec.cloudRef.name }}"
        cgt_holder: "CloudGateway/{{ fab_name }} teardown job {{ tower_job_id | default(awx_job_id | default(lookup('pipe', 'date +%s'))) }}"

    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ cg_fabric_name }}"

    - name: Read the fabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ cg_fabric_name }}"
        namespace: "{{ fab_namespace }}"
      register: _cgt_fabric

    - name: Remove the gateway from the nodes
      when: _cgt_fabric.resources | default([]) | length > 0
      vars:
        cg_fabric: "{{ _cgt_fabric.resources[0] }}"
      block:
        - name: Take the border gateway configuration lease
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
          vars:
            fab_ledger: {action: lease-acquire, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cgt_holder }}"}

        - name: One node at a time
          block:
            - name: Connect to the border gateway nodes
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_connect.yml"
              vars:
                bgw_fabric_spec: "{{ cg_fabric.spec }}"
                bgw_ssh_user: "{{ fab_real.nodes.sshUser }}"

            # node_gateway_down.yml renews the lease before each node; every step on a node runs within the lease
            # (common/vars/fabric_lease.yml): a block keyword, evaluated again for each step; the include is exempt,
            # so the renewals inside run even when the lease is short
            - name: The steps on the nodes, within the lease
              timeout: "{{ fab_lease_step_timeout }}"
              block:
                - name: Remove the gateway instance from each node
                  ansible.builtin.include_tasks: node_gateway_down.yml
                  timeout: 0
                  loop: "{{ cg_fabric.spec.borderGateway.nodes }}"
                  loop_control:
                    loop_var: bgw_node
                    label: "{{ bgw_node.name }}"
          always:
            - name: Remove the SSH key
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"

            - name: Release the lease
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
              vars:
                fab_ledger: {action: lease-release, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cgt_holder }}"}
          # a step that timed out may still run on a node: the lease is kept (fabric_lease_keep.yml) and the always block
          # skips the release; any other failure releases it at once
          rescue:
            - name: Keep the lease while a step may still run on a node
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_lease_keep.yml"

        - name: Release the gateway's provider-edge index
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
          vars:
            fab_ledger:
              action: ledger-release
              namespace: "{{ fab_namespace }}"
              fabric: "{{ cg_fabric_name }}"
              kind: peIndex
              owner: "CloudGateway/{{ fab_namespace }}/{{ fab_name }}"

    - name: Remove the names of the nodes' ICMPv6 sources
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/reverse_dns.yml"
      vars:
        _rdns: "{{ (fab_st.realization | default({}, true)).reverseDns | default({}, true) }}"
        rdns_cfg: {}
        rdns_owner: "CloudGateway/{{ fab_name }}"
        rdns_want: []
        rdns_prev: "{{ _rdns.names | default([], true) }}"
        rdns_dnsconfig: "{{ _rdns.dnsConfig | default('', true) }}"
        rdns_tag: "cgt-{{ fab_name }}"
      when: ((fab_st.realization | default({}, true)).reverseDns | default({}, true)).names | default([], true) | length > 0

    - name: Resolve the site
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ cg_site_name }}"
        ci_ref_namespace: "{{ fab_namespace }}"

    - name: Hold the deletion while the site is paused
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_paused_hold.yml"
      vars:
        sph_plural: cloudgateways
        sph_name: "{{ fab_name }}"
        sph_namespace: "{{ fab_namespace }}"
        sph_site: "{{ cg_site_name }}"
      when: ci_paused | default(false) | bool

    - name: The site side ({{ ci_type }})
      ansible.builtin.include_tasks: "site_{{ ci_type }}_down.yml"
      when: ci_found and ci_type in ['openshift', 'openstack', 'aws', 'gcp']

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          message: >-
            Deleted; gateway instance and site side removed{{ ('; reverse DNS names left: ' ~ rdns_names | map(attribute='name')
            | join(', ') ~ ' (' ~ rdns_notes | join('; ') ~ ')') if rdns_names | default([], true) | length > 0 else '' }}
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: CloudGateway, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}]

  rescue:
    - name: Remove the SSH key
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"
      ignore_errors: true

    - name: Mark the CloudGateway teardown failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          message: "{{ ansible_failed_result.msg | default('CloudGateway teardown failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudGateway {{ fab_name | default('unknown') }} teardown failed"
