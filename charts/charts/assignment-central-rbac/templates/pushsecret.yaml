{{- if .Values.pushSecret.enabled }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Values.pushSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: assignment-central-rbac
    app.kubernetes.io/component: assignment-acm-creator
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval | quote }}
  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: {{ .Values.pushSecret.secretStoreKind }}
  deletionPolicy: None
  updatePolicy: Replace
  selector:
    secret:
      name: assignment-acm-creator-token
  data:
    - conversionStrategy: None
      match:
        secretKey: token
        remoteRef:
          remoteKey: {{ .Values.pushSecret.vaultPath | quote }}
          property: token
    - conversionStrategy: None
      match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: {{ .Values.pushSecret.vaultPath | quote }}
          property: ca.crt
{{- end }}
