---
# The status body of the tenant's TenantProfile "shc": display name, contacts and the sites the tenant may use
# (CloudInfrastructures in the platform namespace that are not being deleted, whose spec.entityRefs is empty or
# names the tenant, and that Entity spec.allowedSites lists when it is set), in tenant words
# (common/tasks/site_tenant_summary.yml), sorted by name, and the platform IPv6 offer of the tenant's fabric. Read
# only.
#
# Input:  entity_cr_name, entity_cr_namespace (the platform namespace), entity_spec (live), entity_generation,
#         services_api_host/services_bearer_token (or services_kubeconfig, for the read-only render test)
# Output: tenant_profile_status  every key the Entity job owns; None for a key with no value (sent as JSON null, so
#         a value removed from the Entity is removed from the profile). conditions is never in it (shc-tenancy's).
- name: List the platform's sites
  kubernetes.core.k8s_info:
    host: "{{ omit if services_kubeconfig is defined else services_api_host }}"
    api_key: "{{ omit if services_kubeconfig is defined else services_bearer_token }}"
    kubeconfig: "{{ services_kubeconfig | default(omit) }}"
    validate_certs: "{{ services_validate_certs | default(true) | bool }}"
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudInfrastructure
    namespace: "{{ entity_cr_namespace }}"
  register: _tp_sites

- name: The sites this tenant may use
  # allowedSites unset or null means "every site the entityRefs rule allows". The test is done inside the
  # template: a task var templated to None becomes the string "None" without native Jinja (ansible-core 2.16).
  ansible.builtin.set_fact:
    _tp_site_objs: >-
      {%- set out = [] -%}
      {%- set _spec = entity_spec | default({}, true) -%}
      {%- set _restricted = (_spec.allowedSites is defined) and (_spec.allowedSites is not none) -%}
      {%- set _allowed = _spec.allowedSites if _restricted else [] -%}
      {%- for o in _tp_sites.resources | default([]) | sort(attribute='metadata.name') -%}
        {%- set refs = (o.spec | default({}, true)).entityRefs | default([], true) | map(attribute='name') | list -%}
        {%- if o.metadata.deletionTimestamp is not defined
              and (refs | length == 0 or entity_cr_name in refs)
              and ((not _restricted) or o.metadata.name in _allowed) -%}
          {%- set _ = out.append(o) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Summarize them in tenant words
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_tenant_summary.yml"
  vars:
    sts_sites: "{{ _tp_site_objs }}"

# The platform IPv6 offer (status.ipv6Platform): the fabrics in the platform namespace this tenant may use (not being
# deleted, spec.entityRefs empty or naming the tenant). With exactly one, its family-6 pool's block sizes and default
# (ipv6_platform_offer.yml); with none, several or a fabric that reports no IPv6 pool, the key is removed (the form
# then cannot tell, and the network job stays the authority). When the fabrics cannot be read, the key is left out of
# the patch: the profile keeps what it had until the Entity job runs again (a ready Entity runs when a fabric job
# wakes it or its spec changes, not on a period).
- name: List the platform's fabrics
  kubernetes.core.k8s_info:
    host: "{{ omit if services_kubeconfig is defined else services_api_host }}"
    api_key: "{{ omit if services_kubeconfig is defined else services_bearer_token }}"
    kubeconfig: "{{ services_kubeconfig | default(omit) }}"
    validate_certs: "{{ services_validate_certs | default(true) | bool }}"
    api_version: hybridsovereign.redhat/v1alpha1
    kind: HybridFabric
    namespace: "{{ entity_cr_namespace }}"
  register: _tp_fabrics
  failed_when: false

- name: The fabrics this tenant may use
  ansible.builtin.set_fact:
    _tp_fabrics_read: "{{ not (_tp_fabrics.failed | default(false) | bool) and _tp_fabrics.resources is defined }}"
    _tp_fabric_objs: >-
      {%- set out = [] -%}
      {%- for o in _tp_fabrics.resources | default([], true) -%}
        {%- set refs = (o.spec | default({}, true)).entityRefs | default([], true) | map(attribute='name') | list -%}
        {%- if o.metadata.deletionTimestamp is not defined and (refs | length == 0 or entity_cr_name in refs) -%}
          {%- set _ = out.append(o) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: The platform IPv6 offer of the tenant's fabric
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/ipv6_platform_offer.yml"
  vars:
    ipo_pools: >-
      {{ (((_tp_fabric_objs[0].status | default({}, true)).realization | default({}, true)).ipam
           | default({}, true)).pools | default([], true) if _tp_fabric_objs | length == 1 else [] }}

- name: The profile's status body
  ansible.builtin.set_fact:
    tenant_profile_status: >-
      {{ {'displayName': (entity_spec.displayName | default('', true)) or none,
          'contacts': (entity_spec.contacts | default([], true)) or none,
          'sites': site_tenant_summaries,
          'observedEntityGeneration': entity_generation | int,
          'lastUpdatedTime': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')}
         | combine({'ipv6Platform': (ipv6_platform_offer if ipv6_platform_offer | length > 0 else none)}
                   if _tp_fabrics_read | bool else {}) }}
