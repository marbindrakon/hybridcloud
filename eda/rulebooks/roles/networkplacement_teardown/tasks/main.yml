---
# shc (design/P7-PLAN.md P7.3.8): NetworkPlacement teardown. The operator's finalizer has already waited for the
# CloudVirt namespaces that name the network. In order:
# 1. the gateway drops the placement's VRF: status.realization.gatewayRelease, the gateway is woken and wakes this
#    placement again once its VRF is gone (the deletion waits meanwhile);
# 2. the site side: CloudVirt = the RouteAdvertisements and the ClusterUserDefinedNetwork; CloudOSO = the share,
#    router, subnets and network in the platform project (refused while the tenant's ports still use the network);
# 3. the VNIs go back to the fabric's ledger and the subnets to the network's address space (design/P10-PLAN.md §3),
#    which wakes the network's placements waiting for address space; deletionComplete.
- block:
    # nothing on a site (refused at validation): delete without site cleanup
    - name: Skip the site cleanup when nothing was realized
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/teardown_unrealized.yml"

    - name: Read the NetworkPlacement
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"
      vars:
        fab_read_entity: true

    - name: What was realized
      ansible.builtin.set_fact:
        npd_real: "{{ fab_st.realization | default({}, true) }}"
        npd_gw_name: "{{ fab_st.cloudGateway | default('', true) }}"
        npd_key: "{{ fab_namespace }}/{{ fab_name }}"
        npd_owner: "NetworkPlacement/{{ fab_namespace }}/{{ fab_name }}"

    - name: Read the gateway
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        name: "{{ npd_gw_name }}"
        namespace: "{{ fabric_platform_namespace }}"
      register: _npd_gw
      when: npd_gw_name | length > 0

    - name: Set the gateway facts
      ansible.builtin.set_fact:
        npd_gw: "{{ (_npd_gw.resources | default([], true) + [{}]) | first }}"

    # a gateway being deleted runs no provision job (its teardown waits for its placements) and its teardown removes
    # the whole instance with this VRF: the placement doesn't wait for a release that can't come
    - name: Does the gateway still carry the placement
      ansible.builtin.set_fact:
        npd_carried: >-
          {{ ((npd_gw.status | default({}, true)).realization | default({}, true)).vrfs | default([], true)
             | selectattr('placement', 'equalto', npd_key) | list | length > 0
             and (npd_gw.metadata | default({})).deletionTimestamp is not defined }}

    - name: Release the gateway
      when: npd_carried | bool
      block:
        # status pending (not reconciling, not partial) completes the delete event, so the gateway's wake-up
        # publishes a new one
        - name: Mark the placement released
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: networkplacements
            cr_name: "{{ fab_name }}"
            cr_namespace: "{{ fab_namespace }}"
            patch_ignore_not_found: true
            cr_status_body:
              status: pending
              ready: false
              message: "Deletion waits for CloudGateway {{ npd_gw_name }} to remove VRF {{ npd_real.vrf | default('') }}"
              deletionBlockedBy: ["CloudGateway {{ fabric_platform_namespace }}/{{ npd_gw_name }} (VRF {{ npd_real.vrf | default('') }})"]
              realization: {gatewayRelease: true}
              lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

        - name: Wake the gateway
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
          vars:
            nudge_crs: [{kind: CloudGateway, namespace: "{{ fabric_platform_namespace }}", name: "{{ npd_gw_name }}"}]

        - name: End the job until the gateway has dropped the VRF
          ansible.builtin.meta: end_play

    - name: Remove the site side
      when: npd_real.l3Vni is defined and fab_st.site | default('', true) | length > 0
      block:
        - name: Resolve the site
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
          vars:
            ci_ref_name: "{{ fab_st.site }}"
            ci_ref_namespace: "{{ fabric_platform_namespace }}"

        - name: The platform's realization parameters
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
          vars:
            fab_real_fabric: "{{ npd_gw.spec.fabricRef.name | default('') }}"

        - name: Name the placement's objects
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
          vars:
            fab_check: {action: placement-names, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}", entity: "{{ fab_entity }}",
                        network: "{{ fab_spec.network }}", l3Vni: "{{ npd_real.l3Vni }}"}

        - name: Set the names
          ansible.builtin.set_fact:
            npd_names: "{{ fab_check_result }}"

        - name: Remove the OpenShift site side
          when: fab_spec.backend.kind == 'CloudVirt' and ci_found | bool
          block:
            - name: The site's fabric credential
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_kubeconfig.yml"
              vars:
                site_kc_tag: "npd-{{ fab_namespace }}-{{ fab_name }}"

            - name: Namespaces still on the network
              kubernetes.core.k8s_info:
                kubeconfig: "{{ site_kubeconfig }}"
                api_version: v1
                kind: Namespace
                label_selectors: >-
                  {{ npd_sel | dict2items | map(attribute='key') | zip(npd_sel.values()) | map('join', '=') | list }}
              vars:
                npd_sel:
                  hybridsovereign.redhat/entity: "{{ npd_names.labels['hybridsovereign.redhat/entity'] }}"
                  hybridsovereign.redhat/cloudvirt: "{{ fab_spec.backend.name }}"
                  hybridsovereign.redhat/hybridnetwork: "{{ npd_names.labels['hybridsovereign.redhat/hybridnetwork'] }}"
              register: _npd_ns

            - name: Refuse while namespaces use the network
              ansible.builtin.fail:
                msg: >-
                  Deletion waits for the site namespaces on the network:
                  {{ _npd_ns.resources | map(attribute='metadata.name') | join(', ') }}
              when: _npd_ns.resources | default([]) | length > 0

            - name: Delete the RouteAdvertisements and the network
              kubernetes.core.k8s:
                kubeconfig: "{{ site_kubeconfig }}"
                state: absent
                api_version: k8s.ovn.org/v1
                kind: "{{ item.kind }}"
                name: "{{ item.name }}"
                wait: true
                wait_timeout: 300
              loop:
                - {kind: RouteAdvertisements, name: "{{ npd_names.routeAdvertisement }}"}
                - {kind: ClusterUserDefinedNetwork, name: "{{ npd_names.cudn }}"}
              loop_control:
                label: "{{ item.kind }}/{{ item.name }}"
          always:
            - name: Remove the site kubeconfig
              ansible.builtin.file:
                path: "{{ site_kubeconfig | default('/tmp/eda-npd-' ~ fab_namespace ~ '-' ~ fab_name ~ '-kubeconfig') }}"
                state: absent

        - name: Remove the OpenStack site side
          when: fab_spec.backend.kind == 'CloudOSO' and ci_found | bool
          block:
            - name: The site's OpenStack account
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_account.yml"
              vars:
                os_account_vault_path: "{{ ci_spec.credentialsRef.vaultPath }}"
                os_account_tag: "npd-{{ fab_name }}"

            - name: Delete the share, router, subnets and network
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_call.yml"
              vars:
                os_call_no_log: false
                os_request:
                  action: placement-network
                  state: absent
                  region: "{{ (ci_spec.openstack | default({})).region | default('') }}"
                  domain: "{{ fab_real.openstack.projectDomain | default((ci_spec.openstack | default({})).projectDomain, true) }}"
                  platformProject: "{{ fab_real.openstack.platformProject }}"
                  name: "{{ npd_names.osNetwork }}"
                  tag: "{{ npd_names.tag }}"

            - name: Report the ports that block the deletion
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
              vars:
                cr_api_version: hybridsovereign.redhat/v1alpha1
                cr_plural: networkplacements
                cr_name: "{{ fab_name }}"
                cr_namespace: "{{ fab_namespace }}"
                patch_ignore_not_found: true
                cr_status_body:
                  status: pending
                  ready: false
                  lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
                  message: "Deletion waits for ports on network {{ npd_names.osNetwork }}: {{ os_result.blocked[:10] | join(', ') }}"
                  deletionBlockedBy: "{{ os_result.blocked }}"
              when: os_result.blocked | default([]) | length > 0

            - name: End the job while ports remain
              ansible.builtin.meta: end_play
              when: os_result.blocked | default([]) | length > 0

        - name: Remove the GCP site side
          when: fab_spec.backend.kind == 'CloudGCP' and ci_found | bool
          block:
            - name: Read the CloudGCP
              kubernetes.core.k8s_info:
                host: "{{ services_api_host }}"
                api_key: "{{ services_bearer_token }}"
                validate_certs: false
                api_version: hybridsovereign.redhat/v1alpha1
                kind: CloudGCP
                name: "{{ fab_spec.backend.name }}"
                namespace: "{{ fab_namespace }}"
              register: _npd_gcp_env

            - name: The installation's GCP realization and the site's edge settings
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_realization.yml"
              vars:
                gcp_edge_site: "{{ npd_gw.metadata.name }}"
                gcp_edge_cidr: "{{ npd_gw.spec.siteUnderlay.cidr }}"
                gcp_edge_asn: 65000

            # the project and region the placement recorded (the environment's, if it never got that far)
            - name: Remove the placement's VPC and tunnels
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
              vars:
                _env_st: "{{ ((_npd_gcp_env.resources | default([{}], true) + [{}]) | first).status | default({}, true) }}"
                _site_st: "{{ (fab_st.realization | default({}, true)).site | default({}, true) }}"
                gcp_helper: shc_gcp_tenant.py
                gcp_config:
                  project: "{{ _site_st.project | default(_env_st.project | default(''), true) }}"
                  region: "{{ _site_st.region | default(_env_st.region | default(''), true) }}"
                gcp_args: [place-down, --placement, "{{ (fab_namespace ~ '-' ~ fab_name) | regex_replace('[^a-z0-9-]', '-') | truncate(55, true, '') }}"]
                gcp_soft: true

            - name: Report the workloads that block the deletion
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
              vars:
                cr_api_version: hybridsovereign.redhat/v1alpha1
                cr_plural: networkplacements
                cr_name: "{{ fab_name }}"
                cr_namespace: "{{ fab_namespace }}"
                patch_ignore_not_found: true
                cr_status_body:
                  status: pending
                  ready: false
                  lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
                  message: "Deletion waits for workloads: {{ gcp_error }}"
              when: gcp_error | length > 0 and 'Deletion waits' in gcp_error

            - name: Stop while workloads block the deletion
              ansible.builtin.meta: end_play
              when: gcp_error | length > 0 and 'Deletion waits' in gcp_error

            - name: Fail on any other error
              ansible.builtin.fail:
                msg: "{{ gcp_error }}"
              when: gcp_error | length > 0

            - name: The routers' VRF for this network goes with the placement
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/gcp_call.yml"
              vars:
                gcp_helper: shc_gcp_edge.py
                gcp_config: "{{ gcp_edge_cfg }}"
                gcp_args: [net-down, --vni, "{{ npd_real.l3Vni | string }}"]
              when: npd_real.l3Vni is defined

        - name: Remove the AWS site side
          when: fab_spec.backend.kind == 'CloudAWS' and ci_found | bool
          block:
            - name: Read the CloudAWS
              kubernetes.core.k8s_info:
                host: "{{ services_api_host }}"
                api_key: "{{ services_bearer_token }}"
                validate_certs: false
                api_version: hybridsovereign.redhat/v1alpha1
                kind: CloudAWS
                name: "{{ fab_spec.backend.name }}"
                namespace: "{{ fab_namespace }}"
              register: _npd_aws_env

            - name: The installation's AWS realization and the site's edge settings
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_realization.yml"
              vars:
                aws_edge_site: "{{ npd_gw.metadata.name }}"
                aws_edge_cidr: "{{ npd_gw.spec.siteUnderlay.cidr }}"
                aws_edge_asn: 65000

            # the account and region the placement recorded (the environment's, if it never got that far)
            - name: Remove the placement's VPC (and the network's hub side with its last placement)
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/aws_call.yml"
              vars:
                _env_st: "{{ ((_npd_aws_env.resources | default([{}], true) + [{}]) | first).status | default({}, true) }}"
                _site_st: "{{ (fab_st.realization | default({}, true)).site | default({}, true) }}"
                aws_helper: shc_aws_tenant.py
                aws_config:
                  account: "{{ _site_st.account | default(_env_st.awsAccountId | default(''), true) }}"
                  region: "{{ _site_st.region | default(_env_st.awsRegion | default(''), true) }}"
                  memberRole: "{{ aws_real.memberRoleName | default('shc-automation') }}"
                  entry: automation
                  edge: "{{ aws_edge_cfg }}"
                aws_args: [place-down, --placement, "{{ fab_namespace }}/{{ fab_name }}", --vni, "{{ npd_real.l3Vni | string }}"]
                aws_soft: true

            - name: Report the workloads that block the deletion
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
              vars:
                cr_api_version: hybridsovereign.redhat/v1alpha1
                cr_plural: networkplacements
                cr_name: "{{ fab_name }}"
                cr_namespace: "{{ fab_namespace }}"
                patch_ignore_not_found: true
                cr_status_body:
                  status: pending
                  ready: false
                  lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
                  message: "Deletion waits for workloads: {{ aws_error }}"
                  deletionBlockedBy: ["{{ aws_error }}"]
              when: aws_result.reason | default('') == 'WorkloadsPresent'

            - name: End the job while workloads remain
              ansible.builtin.meta: end_play
              when: aws_result.reason | default('') == 'WorkloadsPresent'

            - name: Stop on any other error
              ansible.builtin.fail:
                msg: "AWS place-down failed: {{ aws_error }}"
              when: aws_error | length > 0

    - name: Release the VNIs
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: ledger-release, namespace: "{{ fabric_platform_namespace }}", fabric: "{{ npd_gw.spec.fabricRef.name }}",
                     kind: "{{ item }}", owner: "{{ npd_owner }}"}
      loop: [vni, l2vni]
      when: npd_gw.spec is defined

    - name: Give the subnets back
      when: npd_gw.spec is defined
      block:
        - name: The platform's realization parameters
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
          vars:
            fab_real_fabric: "{{ npd_gw.spec.fabricRef.name }}"

        - name: Release the subnets
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ipam.yml"
          vars:
            fab_ipam: {action: ipam-release, fabric: "{{ npd_gw.spec.fabricRef.name }}",
                       network: "HybridNetwork/{{ fab_namespace }}/{{ fab_spec.network }}", owner: "{{ npd_owner }}"}

        - name: List the network's placements
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: hybridsovereign.redhat/v1alpha1
            kind: NetworkPlacement
            namespace: "{{ fab_namespace }}"
          register: _npd_siblings
          when: fab_ipam_result.released | default([], true) | length > 0

        # a placement without room (or waiting for a pinned prefix) may fit now
        - name: Wake the placements waiting for address space
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
          vars:
            nudge_crs: >-
              {%- set out = [] -%}
              {%- for p in _npd_siblings.resources | default([]) -%}
                {%- set c = ((p.status | default({}, true)).conditions | default([], true) + [{}]) | first -%}
                {%- if p.spec.network == fab_spec.network and p.metadata.name != fab_name
                      and p.metadata.deletionTimestamp is not defined
                      and (p.status | default({}, true)).status | default('') == 'pending'
                      and c.reason | default('') == 'WaitingForAddressSpace' -%}
                  {%- set _ = out.append({'kind': 'NetworkPlacement', 'namespace': fab_namespace, 'name': p.metadata.name}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out }}
          when: fab_ipam_result.released | default([], true) | length > 0

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: networkplacements
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          deletionBlockedBy: []
          message: Deleted
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # the circuits' policy (advertise list) holds the network's placement prefixes
    - name: List the network's attachment circuits
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: AttachmentCircuit
        namespace: "{{ fab_namespace }}"
      register: _npd_circuits
      when: npd_gw.spec is defined

    - name: Tell the fabric when the network has attachment circuits
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: HybridFabric, namespace: "{{ fabric_platform_namespace }}", name: "{{ npd_gw.spec.fabricRef.name }}"}]
      when:
        - npd_gw.spec is defined
        - _npd_circuits.resources | default([]) | selectattr('spec.network', 'equalto', fab_spec.network) | list | length > 0

    # the operator drops the finalizer the next time it looks at the CR: make that now
    - name: Release the finalizer now
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/nudge_cr.yml"
      vars:
        nudge_crs: [{kind: NetworkPlacement, namespace: "{{ fab_namespace }}", name: "{{ fab_name }}"}]

  rescue:
    - name: Report the teardown waiting or failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        _waits: "{{ ansible_failed_result.msg | default('') is match('Deletion waits for ') }}"
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: networkplacements
        cr_name: "{{ fab_name }}"
        cr_namespace: "{{ fab_namespace }}"
        patch_ignore_not_found: true
        cr_status_body:
          status: "{{ 'pending' if _waits else 'failed' }}"
          reason: "{{ 'WaitingForDependents' if _waits else 'TeardownFailed' }}"
          ready: false
          message: "{{ ansible_failed_result.msg | default('NetworkPlacement teardown failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ fab_name | default('unknown') }} teardown failed"
      when: not (ansible_failed_result.msg | default('') is match('Deletion waits for '))
