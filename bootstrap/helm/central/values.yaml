        # convert + rbd import per VM) moves the image per cluster; Ceph clones VM disks copy-on-write. One per RHCOS
        # build: rhcos-9.8.20260715-1-openstack = OCP 4.22.16 (design/CENTRAL-ETCD-LATENCY.md).
        - name: PLATFORMOPENSHIFT_DEFAULTS
