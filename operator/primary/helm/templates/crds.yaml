apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: entities.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: Entity
    listKind: EntityList
    plural: entities
    singular: entity
    shortNames:
      - ent
      - tenant
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A tenant: the boundary for isolation, access and billing, comparable to an AWS account
            under an organizational unit, a Google Cloud project under a folder, an Azure
            subscription or an OpenStack domain. The platform team creates it in the platform
            namespace. Creating it creates the tenant namespace entity-<name>, where everything the
            tenant creates lives, and gives the tenant's access groups the roles listed in
            spec.namespaceRbac there.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: >-
                self.metadata.name.size() <= 56
                && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                && !self.metadata.name.contains('--')
              message: >-
                Tenant names are lowercase letters, digits and single '-', at most 56 characters; the
                name becomes the namespace entity-<name>.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: What the tenant is and which access groups hold which roles.
              type: object
              required:
                - description
                - billingID
              properties:
                description:
                  description: >-
                    Description of the tenant, shown to the platform team and on the tenant
                    namespace.
                  type: string
                billingID:
                  description: >-
                    Billing identifier of the tenant. Also set as a label on the tenant namespace.
                  type: string
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
                websiteLink:
                  description: Link to the tenant's own website, shown with the tenant.
                  type: string
                displayName:
                  description: >-
                    Human-readable tenant name shown in consoles; metadata.name cannot change, this
                    can.
                  type: string
                  maxLength: 64
                contacts:
                  description: >-
                    Who the tenant's users contact about access and the tenant; shown to them.
                  type: array
                  maxItems: 10
                  x-kubernetes-list-type: atomic
                  items:
                    description: One contact.
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: Name of the person or team.
                        type: string
                        minLength: 1
                        maxLength: 128
                      email:
                        description: E-mail address.
                        type: string
                        maxLength: 254
                      url:
                        description: Web page or ticket queue (https).
                        type: string
                        maxLength: 512
                        pattern: "^https://"
                allowedSites:
                  description: >-
                    Sites (CloudInfrastructure names) this tenant's environments may use. Narrows the
                    sites that already allow the tenant through their spec.entityRefs; omitted means
                    all of those. An environment on a site outside this list is refused.
                  type: array
                  minItems: 1
                  maxItems: 64
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 63
                    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                namespaceRbac:
                  description: >-
                    The tenant's roles in its namespace. Each key is a role; its value lists the
                    access groups (names of Rbac objects in the tenant namespace) that hold the
                    role. A member of access group <name> signs in to the services cluster with the
                    group <tenant>.<name>. A role with no access group grants nothing.
                  type: object
                  properties:
                    entityAdmin:
                      description: >-
                        Tenant admin: create, change and delete the tenant's OpenStack, VM and AWS
                        environments, networks, network placements, edge connections, OpenShift
                        clusters, platform services (Vault, KV secrets engines, AAP and Quay
                        organizations), team setups, app projects, cluster assignments and access
                        groups.
                      type: array
                      items:
                        type: string
                    auditor:
                      description: >-
                        Auditor: read everything a tenant admin can change.
                      type: array
                      items:
                        type: string
                    BobsTeam:
                      description: >-
                        Deprecated: the same as auditor; use auditor.
                      type: array
                      items:
                        type: string
                    cloudOSOAdmin:
                      description: >-
                        OpenStack environment admin: create, change and delete OpenStack
                        environments (CloudOSO); read access groups.
                      type: array
                      items:
                        type: string
                    cloudOSOView:
                      description: >-
                        OpenStack environment viewer: read OpenStack environments and access groups.
                      type: array
                      items:
                        type: string
                    cloudVirtAdmin:
                      description: >-
                        OpenShift Virtualization environment admin: create, change and delete VM
                        environments (CloudVirt); read access groups.
                      type: array
                      items:
                        type: string
                    cloudVirtView:
                      description: >-
                        OpenShift Virtualization environment viewer: read VM environments
                        (CloudVirt) and access groups.
                      type: array
                      items:
                        type: string
                    networkAdmin:
                      description: >-
                        Network admin: create, change and delete networks, network placements and
                        edge connections; read OpenStack and VM environments and access groups.
                      type: array
                      items:
                        type: string
                    networkView:
                      description: >-
                        Network viewer: read networks, network placements, edge connections and
                        access groups.
                      type: array
                      items:
                        type: string
                    cloudAWSAdmin:
                      description: >-
                        AWS environment admin: create, change and delete AWS environments
                        (CloudAWS); read access groups.
                      type: array
                      items:
                        type: string
                    cloudAWSView:
                      description: >-
                        AWS environment viewer: read AWS environments and access groups.
                      type: array
                      items:
                        type: string
                    platformOpenshiftAdmin:
                      description: >-
                        OpenShift cluster admin: create, change and delete OpenShift clusters
                        (PlatformOpenshift); read OpenStack and AWS environments and access groups.
                      type: array
                      items:
                        type: string
                    platformOpenshiftView:
                      description: >-
                        OpenShift cluster viewer: read OpenShift clusters and access groups.
                      type: array
                      items:
                        type: string
                    teamAdmin:
                      description: >-
                        Team setup admin: create, change and delete team setups (Team); read cluster
                        assignments and access groups.
                      type: array
                      items:
                        type: string
                    teamView:
                      description: >-
                        Team setup viewer: read team setups, cluster assignments and access groups.
                      type: array
                      items:
                        type: string
                    projectAdmin:
                      description: >-
                        App project admin: create, change and delete app projects (Project); read
                        cluster assignments and access groups.
                      type: array
                      items:
                        type: string
                    projectView:
                      description: >-
                        App project viewer: read app projects, cluster assignments and access
                        groups.
                      type: array
                      items:
                        type: string
                    assignmentAdmin:
                      description: >-
                        Cluster assignment admin: create, change and delete cluster assignments
                        (Assignment); read team setups, app projects and access groups.
                      type: array
                      items:
                        type: string
                    identityAdmin:
                      description: >-
                        Access group admin: create, change and delete access groups (Rbac).
                      type: array
                      items:
                        type: string
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                entity:
                  description: Name of the tenant.
                  type: string
                description:
                  description: The tenant's description as applied.
                  type: string
                openshiftConsoleURL:
                  description: Link to the tenant namespace in the services cluster's web console.
                  type: string
                billingID:
                  description: The billing identifier as applied.
                  type: string
                websiteLink:
                  description: The website link as applied.
                  type: string
                status:
                  description: Short state word written by the platform's automation.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed, waiting]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant namespace
          type: string
          jsonPath: .status.entity
        - name: BillingID
          type: string
          jsonPath: .status.billingID
        - name: Console
          type: string
          jsonPath: .status.openshiftConsoleURL
          priority: 1
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
