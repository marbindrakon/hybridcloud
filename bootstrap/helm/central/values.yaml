      assignmentType: agent
      infraEnvName: metal-infra-env
    - node: sl230-blade8
      namespace: metal-infra-env
      assignmentType: agent
      infraEnvName: metal-infra-env
    nodes:
      sl230-blade1:
        labels:
          compute-model: sl230
          shc.signal9.gg/blade: '1'
        hostname: iaas1-blade1
        bootMac: 2c:41:38:eb:d2:38
        bootMode: legacy
        bmc:
          url: ipmi://172.18.2.31
        network:
          nmstateConfig:
            interfaces:
            - name: eno1
              type: ethernet
              state: up
              ipv4:
                enabled: true
                dhcp: true
                auto-dns: false
                auto-gateway: false
                auto-routes: false
              ipv6:
                enabled: false
            - name: eno2
              type: ethernet
              state: up
              ipv4:
                enabled: false
              ipv6:
                enabled: false
            - name: eno3
              type: ethernet
              state: up
              mtu: 9000
            - name: eno3d1
              type: ethernet
              state: up
              mtu: 9000
            - name: bond0
