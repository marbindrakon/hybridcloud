---
- block:
    - name: Set CloudVirt CR facts
      ansible.builtin.set_fact:
        cloudvirt_spec: "{{ _hybridsovereign_redhat_cloudvirt.spec | default({}) }}"
        cloudvirt_generation: "{{ _hybridsovereign_redhat_cloudvirt.metadata.generation | default(0) | int }}"
        cloudvirt_observed_generation: "{{ _hybridsovereign_redhat_cloudvirt.status.observedGeneration | default(0) | int }}"
        cloudvirt_status: "{{ _hybridsovereign_redhat_cloudvirt.status.status | default('') }}"
        cloudvirt_ready: "{{ _hybridsovereign_redhat_cloudvirt.status.ready | default(false) | bool }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_cloudvirt }}"

    - name: Read namespace for entity context
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ ansible_operator_meta.namespace }}"
      register: cloudvirt_target_ns

    - name: Assert namespace is Entity-managed
      ansible.builtin.assert:
        that:
          - cloudvirt_target_ns.resources | length > 0
          - cloudvirt_target_ns.resources[0].metadata.labels is defined
          - cloudvirt_target_ns.resources[0].metadata.labels['hybridsovereign.redhat/entity'] is defined
        fail_msg: Namespace must include hybridsovereign.redhat/entity label.

    - name: Set event action and reason
      ansible.builtin.set_fact:
        cloudvirt_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        cloudvirt_event_reason: "{{ 'CloudVirtReconcileRequested' if reconcile_now | bool else 'CloudVirtCreateRequested' }}"
        cloudvirt_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (cloudvirt_observed_generation >= cloudvirt_generation)
            and (cloudvirt_status == 'ready')
            and (cloudvirt_ready | bool)
          }}

    - name: Skip when already processed
      ansible.builtin.meta: end_host
      when: cloudvirt_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: CloudVirt
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        cloudvirt_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # The acknowledgement carries the phase (Creating for a new CloudVirt, Updating for a change), so no status
    # write is without a phase (_common/tasks/ack_phase.yml).
    - name: Decide the phase of the acknowledgement
      ansible.builtin.include_role:
        name: _common
        tasks_from: ack_phase
      vars:
        ack_phase_cr: "{{ _hybridsovereign_redhat_cloudvirt }}"
      when: not (reconcile_keeps_ready | default(false) | bool)

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark CloudVirt as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudVirt
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          phase: "{{ ack_phase.phase }}"
          phaseSince: "{{ ack_phase.phaseSince }}"
          summary: "{{ ack_phase.summary }}"
          lastReconciledAt: "{{ cloudvirt_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ cloudvirt_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark CloudVirt as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudVirt
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ cloudvirt_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ cloudvirt_event_reason }}"
        operator_event_action: "{{ cloudvirt_event_action }}"
        operator_event_note: "{{ cloudvirt_spec | to_json }}"
        operator_reporting_controller: cloudvirt-operator
        operator_event_phase_recorded: >-
          {{ '' if (reconcile_keeps_ready | default(false) | bool) else (ack_phase | default({})).phase | default('') }}
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: CloudVirt
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_cloudvirt.metadata.uid }}"

  rescue:
    - name: Mark CloudVirt as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudVirt
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "CloudVirt {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
