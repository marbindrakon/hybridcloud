# An OpenStack environment (CloudOSO) on the site site-osp. The site supplies every site setting;
# set only cloudRef. The platform makes the environment's project on the site.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudOSO
metadata:
  name: example-osp
  namespace: entity-example-corp
spec:
  cloudRef:
    name: site-osp
