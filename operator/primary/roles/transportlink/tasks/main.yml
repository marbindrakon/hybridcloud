---
- block:
    - name: Set TransportLink CR facts
      ansible.builtin.set_fact:
        transportlink_spec: "{{ _hybridsovereign_redhat_transportlink.spec | default({}) }}"
        transportlink_generation: "{{ _hybridsovereign_redhat_transportlink.metadata.generation | default(0) | int }}"
        transportlink_observed_generation: "{{ _hybridsovereign_redhat_transportlink.status.observedGeneration | default(0) | int }}"
        transportlink_status: "{{ _hybridsovereign_redhat_transportlink.status.status | default('') }}"
        transportlink_ready: "{{ _hybridsovereign_redhat_transportlink.status.ready | default(false) | bool }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_transportlink }}"

    - name: Set event action and reason
      ansible.builtin.set_fact:
        transportlink_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        transportlink_event_reason: "{{ 'TransportLinkReconcileRequested' if reconcile_now | bool else 'TransportLinkCreateRequested' }}"
        transportlink_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (transportlink_observed_generation >= transportlink_generation)
            and (transportlink_status == 'ready')
            and (transportlink_ready | bool)
          }}

    - name: Skip when already processed
      ansible.builtin.meta: end_host
      when: transportlink_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: TransportLink
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        transportlink_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # The acknowledgement carries the phase (Creating for a new TransportLink, Updating for a change), so no status
    # write is without a phase (_common/tasks/ack_phase.yml).
    - name: Decide the phase of the acknowledgement
      ansible.builtin.include_role:
        name: _common
        tasks_from: ack_phase
      vars:
        ack_phase_cr: "{{ _hybridsovereign_redhat_transportlink }}"
      when: not (reconcile_keeps_ready | default(false) | bool)

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark TransportLink as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: TransportLink
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          phase: "{{ ack_phase.phase }}"
          phaseSince: "{{ ack_phase.phaseSince }}"
          summary: "{{ ack_phase.summary }}"
          lastReconciledAt: "{{ transportlink_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ transportlink_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark TransportLink as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: TransportLink
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ transportlink_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ transportlink_event_reason }}"
        operator_event_action: "{{ transportlink_event_action }}"
        operator_event_note: "{{ transportlink_spec | to_json }}"
        operator_reporting_controller: transportlink-operator
        operator_event_phase_recorded: >-
          {{ '' if (reconcile_keeps_ready | default(false) | bool) else (ack_phase | default({})).phase | default('') }}
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: TransportLink
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_transportlink.metadata.uid }}"

  rescue:
    - name: Mark TransportLink as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: TransportLink
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: OperatorFailed
              message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "TransportLink {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
