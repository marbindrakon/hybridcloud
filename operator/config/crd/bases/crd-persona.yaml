apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: personas.hybridsovereign.redhat
  labels:
    hybridsovereign.redhat/teardown-tier: "5"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: Persona
    listKind: PersonaList
    plural: personas
    singular: persona
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Deprecated. A Persona grants no access, whatever its status says; give access groups
            roles with the tenant's roles (Entity spec.namespaceRbac) instead. Kept so existing
            objects stay readable; it will be removed in a later API version.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: No effect.
              type: object
              required:
                - rbac
                - type
              properties:
                rbac:
                  description: Name of an access group (Rbac). No effect.
                  type: string
                type:
                  description: A role name. No effect.
                  type: string
                  enum:
                    - assignmentAdmin
                    - auditor
                    - BobsTeam
                    - cloudOSOAdmin
                    - cloudOSOView
                    - cloudAWSAdmin
                    - cloudAWSView
                    - entityAdmin
                    - identityAdmin
                    - platformOpenshiftAdmin
                    - platformOpenshiftView
                    - teamAdmin
                    - teamView
                    - projectAdmin
                    - projectView
            status:
              description: Observed state. Do not edit.
              type: object
              properties:
                status:
                  description: Short state word.
                  type: string
                ready:
                  description: No meaning; a Persona grants nothing.
                  type: boolean
                message:
                  description: Last message.
                  type: string
                keycloakGroup:
                  description: No meaning; a Persona grants nothing.
                  type: string
                observedGeneration:
                  description: The metadata.generation the status describes.
                  type: integer
                  format: int64
                  x-kubernetes-int-or-string: true
                lastReconciledAt:
                  description: When the object was last processed (RFC 3339).
                  type: string
                  format: date-time
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: RBAC
          type: string
          jsonPath: .spec.rbac
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
