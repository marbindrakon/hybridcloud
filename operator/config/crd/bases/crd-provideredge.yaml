apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: provideredges.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: ProviderEdge
    listKind: ProviderEdgeList
    plural: provideredges
    singular: provideredge
    shortNames:
      - pedge
    categories:
      - shc
      - shc-platform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A provider edge: where routers outside the platform (customer edge routers) connect to
            tenant networks, comparable to an AWS Direct Connect location or a Cloud Interconnect
            location. Each bearer is a physical or logical link on which the platform allocates one
            VLAN and one link subnet per AttachmentCircuit. The edge runs on the fabric's border
            nodes. Platform-owned.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required: [fabricRef, platform, bearers]
              properties:
                fabricRef:
                  type: object
                  description: The HybridFabric (same namespace) the edge belongs to. Immutable.
                  required: [name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.fabricRef is immutable
                  properties:
                    name:
                      description: Name of the referenced object.
                      type: string
                      minLength: 1
                      maxLength: 253
                platform:
                  type: string
                  description: >-
                    What realizes the edge. frr: the fabric's border nodes terminate the circuits themselves.
                    Immutable.
                  enum: [frr]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.platform is immutable
                bearers:
                  type: array
                  description: Links on which circuits can be ordered. A bearer can't be removed while circuits use it.
                  minItems: 1
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, ceKinds]
                    properties:
                      name:
                        description: >-
                          Bearer name, unique on this edge. Circuits name it in spec.edgeRef.bearer.
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      ceKinds:
                        type: array
                        description: The kinds of customer edge this bearer accepts.
                        minItems: 1
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          enum: [customer]
                      description:
                        description: >-
                          What the bearer is, in a few words, for the people ordering circuits.
                        type: string
                        maxLength: 256
                entityRefs:
                  type: array
                  description: Entities that may order circuits on this edge. Empty means every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                fabric:
                  type: string
                nodes:
                  type: array
                  description: The border nodes that terminate this edge's circuits.
                  items:
                    type: string
                bearers:
                  type: array
                  description: Circuits per bearer.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      circuits:
                        type: integer
                      mtu:
                        type: integer
                capabilities:
                  type: object
                  description: What this edge realizes (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                realization:
                  type: object
                  description: How the platform realized the edge (informational; depends on the platform).
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, pending, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                realized:
                  type: boolean
                waitingFor:
                  type: array
                  items:
                    type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, waiting, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fabric
          type: string
          jsonPath: .spec.fabricRef.name
        - name: Platform
          type: string
          jsonPath: .spec.platform
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
