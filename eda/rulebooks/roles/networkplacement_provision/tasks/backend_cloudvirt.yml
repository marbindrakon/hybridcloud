---
# shc (design/P7-PLAN.md P7.3.8, §12.3.1): the site side of a placement on a CloudVirt (OpenShift site): a Layer2
# primary ClusterUserDefinedNetwork with EVPN transport (IP-VRF = the placement's layer 3 VNI, MAC-VRF = its
# layer 2 VNI, route targets <asn>:<vni>) over the site's VTEP, selecting the CloudVirt's namespaces that name the
# network (by label), and a RouteAdvertisements that advertises it toward the site's gateway. The subnets are the
# placement's allocated prefixes (np_prefixes; site_ranges.yml kept them off the cluster's own networks). Uses the
# site's fabric credential. Sets np_backend_status.
- name: Realize the network on the site
  block:
    - name: The site's fabric credential
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/site_kubeconfig.yml"
      vars:
        site_kc_tag: "np-{{ fab_namespace }}-{{ fab_name }}"

    # one expression: numbers stay numbers (templated scalars inside a YAML definition become strings)
    - name: "ClusterUserDefinedNetwork {{ np_names.cudn }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ site_kubeconfig }}"
        state: present
        definition: >-
          {{ {'apiVersion': 'k8s.ovn.org/v1', 'kind': 'ClusterUserDefinedNetwork',
              'metadata': {'name': np_names.cudn, 'labels': np_names.labels,
                           'annotations': {'hybridsovereign.redhat/networkplacement': fab_namespace ~ '/' ~ fab_name}},
              'spec': {'namespaceSelector': {'matchLabels': np_ns_selector},
                       'network': {'topology': 'Layer2', 'transport': 'EVPN',
                                   'evpn': {'vtep': np_gateway.status.site.vtep,
                                            'ipVRF': {'vni': np_real.l3Vni | int, 'routeTarget': np_asn ~ ':' ~ np_real.l3Vni},
                                            'macVRF': {'vni': np_real.l2Vni | int, 'routeTarget': np_asn ~ ':' ~ np_real.l2Vni}},
                                   'layer2': {'role': 'Primary', 'mtu': np_real.mtu | int, 'subnets': np_prefixes,
                                              'ipam': {'lifecycle': 'Persistent'}}}}} }}
      register: _np_cudn

    - name: "RouteAdvertisements {{ np_names.routeAdvertisement }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ site_kubeconfig }}"
        state: present
        definition:
          apiVersion: k8s.ovn.org/v1
          kind: RouteAdvertisements
          metadata:
            name: "{{ np_names.routeAdvertisement }}"
            labels: "{{ np_names.labels }}"
          spec:
            advertisements: [PodNetwork]
            nodeSelector: {}
            targetVRF: auto
            frrConfigurationSelector:
              matchLabels: "{{ fab_real.openshift.frrConfigurationSelector | default({}, true) }}"
            networkSelectors:
              - networkSelectionType: ClusterUserDefinedNetworks
                clusterUserDefinedNetworkSelector:
                  networkSelector:
                    matchLabels: {hybridsovereign.redhat/l3vni: "{{ np_real.l3Vni | string }}"}
      register: _np_ra

    - name: Wait for the network to be created on the site
      kubernetes.core.k8s_info:
        kubeconfig: "{{ site_kubeconfig }}"
        api_version: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: "{{ np_names.cudn }}"
      register: _np_cudn_state
      retries: 18
      delay: 10
      until: >-
        (_np_cudn_state.resources | default([{}], true))[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'NetworkCreated') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Wait for the advertisements to be accepted
      kubernetes.core.k8s_info:
        kubeconfig: "{{ site_kubeconfig }}"
        api_version: k8s.ovn.org/v1
        kind: RouteAdvertisements
        name: "{{ np_names.routeAdvertisement }}"
      register: _np_ra_state
      retries: 18
      delay: 10
      until: >-
        (_np_ra_state.resources | default([{}], true))[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Accepted') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Record the site side
      ansible.builtin.set_fact:
        np_backend_status:
          clusterUserDefinedNetwork: "{{ np_names.cudn }}"
          routeAdvertisements: "{{ np_names.routeAdvertisement }}"
        np_backend_changed: "{{ _np_cudn is changed or _np_ra is changed }}"
  always:
    - name: Remove the site kubeconfig
      ansible.builtin.file:
        path: "{{ site_kubeconfig | default('/tmp/eda-np-' ~ fab_namespace ~ '-' ~ fab_name ~ '-kubeconfig') }}"
        state: absent
