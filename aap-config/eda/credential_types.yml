---
# Custom EDA credential types — inject SASL creds for ansible.eda.kafka rulebooks
# (bootstrap host/port/topic are hardcoded in rulebooks)
eda_credential_types:
  - name: Sovereign Kafka Consumer
    description: AMQ Streams SASL credentials for operator event rulebooks
    inputs:
      fields:
        - id: username
          type: string
          label: SASL username
        - id: password
          type: string
          label: SASL password
          secret: true
    # !unsafe: the eda_credential_types role passes injectors through untouched (it has no '{  {'
    # conversion like the controller role), so EDA must receive a literal {{ field }}.
    injectors:
      extra_vars:
        KAFKA_USERNAME: !unsafe "{{ username }}"
        KAFKA_PASSWORD: !unsafe "{{ password }}"
