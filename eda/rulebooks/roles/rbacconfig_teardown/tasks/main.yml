---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        rbac_config_cr_name: "{{ event_payload.regarding.name }}"
        rbac_config_cr_namespace: "{{ event_payload.regarding.namespace }}"
        rbac_config_spec: "{{ shc_live_spec }}"

    - name: Resolve services cluster API connection
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Run Keycloak admin cleanup when spec is available
      when: rbac_config_spec.secret is defined
      block:
        # the labelled Route, else KEYCLOAK_EXTERNAL_URL; neither fails the delete with a message that names the
        # setting
        - name: The sign-in directory's address
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/services_keycloak_url.yml"

        - name: Set Keycloak URL
          ansible.builtin.set_fact:
            plugin_rbac_keycloak_url: "{{ skc_url }}"

        - name: Load Keycloak admin credentials
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_admin_credentials.yml"
          vars:
            keycloak_vault_path: "{{ rbac_config_spec.secret | default('rhbk-services-admin') }}"

        - name: Obtain Keycloak admin access token
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_admin_token.yml"
          vars:
            keycloak_url: "{{ plugin_rbac_keycloak_url }}"
            keycloak_url_http_headers: "{{ plugin_rbac_keycloak_url_http_headers | default({}) }}"

        # the realm automation clients this connection's status records, in the realm it recorded (an object of the
        # release before records no realm: the realm its credentials in central Vault name); each is deleted only
        # while it carries the description the provision gives it (only holders of the realm's manage-clients right
        # can write a client's description); nothing recorded, nothing deleted
        - name: The realm automation clients the status records
          vars:
            _st: "{{ (shc_live_cr | default({}, true)).status | default({}, true) }}"
            _ra: "{{ _st.realmAutomation | default({}, true) }}"
          ansible.builtin.set_fact:
            rbacconfig_fin_realm: "{{ _st.realm | default('', true) }}"
            rbacconfig_fin_clients: >-
              {{ [{'purpose': 'membership', 'clientId': _ra.membershipClientId | default('', true)},
                  {'purpose': 'clients', 'clientId': _ra.clientsClientId | default('', true)}]
                 | rejectattr('clientId', 'equalto', '') | list }}

        - name: The realm the credentials name
          when: rbacconfig_fin_realm | length == 0 and rbacconfig_fin_clients | length > 0
          block:
            - name: Read the published credentials
              ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
              vars:
                vault_kv_path: "{{ keycloak_automation_vault_prefix | default('keycloak-automation') }}/{{ rbac_config_cr_name }}"
                vault_kv_read_missing_ok: true

            - name: Keep the realm only
              ansible.builtin.set_fact:
                rbacconfig_fin_realm: "{{ vault_kv_data.realm | default('', true) }}"
                vault_kv_data: {}
              no_log: true

        - name: Look up the recorded clients
          ansible.builtin.uri:
            url: >-
              {{ plugin_rbac_keycloak_url }}/admin/realms/{{ rbacconfig_fin_realm }}/clients?clientId={{ item.clientId | urlencode }}
            method: GET
            headers: "{{ {'Authorization': 'Bearer ' + keycloak_admin_token} | combine(plugin_rbac_keycloak_url_http_headers | default({})) }}"
            validate_certs: false
            status_code: [200]
          loop: "{{ rbacconfig_fin_clients if rbacconfig_fin_realm | length > 0 else [] }}"
          loop_control:
            label: "{{ item.clientId }}"
          register: _rbacconfig_fin_lookup
          no_log: true

        - name: Delete the recorded clients that carry this connection's description
          ansible.builtin.uri:
            url: "{{ plugin_rbac_keycloak_url }}/admin/realms/{{ rbacconfig_fin_realm }}/clients/{{ item.id }}"
            method: DELETE
            headers: "{{ {'Authorization': 'Bearer ' + keycloak_admin_token} | combine(plugin_rbac_keycloak_url_http_headers | default({})) }}"
            validate_certs: false
            status_code: [204, 404]
          loop: >-
            {%- set out = [] -%}
            {%- for r in _rbacconfig_fin_lookup.results | default([]) -%}
              {%- for c in r.json | default([], true)
                    if c.clientId == r.item.clientId
                    and (c.description | default('', true)) == 'Realm automation (' ~ r.item.purpose ~ ') for RbacConfig ' ~ rbac_config_cr_name -%}
                {%- set _ = out.append({'id': c.id, 'clientId': c.clientId}) -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ out }}
          loop_control:
            label: "{{ item.clientId }}"

    - name: Delete the realm automation credentials from central Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_delete.yml"
      vars:
        vault_kv_delete_paths:
          - "{{ keycloak_automation_vault_prefix | default('keycloak-automation') }}/{{ rbac_config_cr_name }}"

    - name: Delete Keycloak client credentials Secret
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ rbac_config_cr_name }}-client"
        namespace: "{{ rbac_config_cr_namespace }}"
      ignore_errors: true

    - name: Get current timestamp
      ansible.builtin.set_fact:
        rbac_delete_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark RbacConfig deletion complete on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: rbacconfigs
        cr_name: "{{ rbac_config_cr_name }}"
        cr_namespace: "{{ rbac_config_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: false
          deletionComplete: true
          lastReconciledAt: "{{ rbac_delete_transition_time }}"
          message: >-
            RbacConfig {{ rbac_config_cr_name }} finalized. Keycloak clients, Secret and Vault credentials removed by EDA.

  rescue:
    - name: Mark RbacConfig delete as failed on services cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: rbacconfigs
        cr_name: "{{ rbac_config_cr_name }}"
        cr_namespace: "{{ rbac_config_cr_namespace }}"
        cr_status_body:
          status: failed
          reason: TeardownFailed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('EDA deletion failed')) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise teardown failure
      ansible.builtin.fail:
        msg: "RbacConfig {{ rbac_config_cr_name | default('unknown') }} EDA teardown failed"
