{{- if and .Values.keycloak.enabled .Values.keycloak.db.enabled .Values.keycloak.db.crunchy.enabled }}
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.keycloak.db.crunchy.name | default "rhbk-pgcluster" }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  postgresVersion: 16
  instances:
    - name: pgha
      replicas: {{ .Values.keycloak.db.crunchy.instances | default 2 }}
      # One replica per node, so one node going down never takes every copy of the database with it.
      # With a single schedulable node the skew is always 0 and all replicas still start there.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ .Values.keycloak.db.crunchy.name | default "rhbk-pgcluster" }}
              postgres-operator.crunchydata.com/instance-set: pgha
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.keycloak.db.crunchy.storage | default "10Gi" }}
  backups:
    pgbackrest:
      # Backups run on a schedule and old ones expire. Without a schedule the repository keeps every write-ahead
      # log since the first backup, fills, and the database stops when it can no longer archive.
      global:
        repo1-retention-full: {{ ((.Values.keycloak.db.crunchy.backup).retentionFull | default 2) | quote }}
        repo1-retention-full-type: count
      # A full backup on demand: annotate the PostgresCluster with postgres-operator.crunchydata.com/pgbackrest-backup
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: {{ ((.Values.keycloak.db.crunchy.backup).fullSchedule | default "20 1 * * 0") | quote }}
            differential: {{ ((.Values.keycloak.db.crunchy.backup).differentialSchedule | default "20 1 * * 1-6") | quote }}
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: {{ .Values.keycloak.db.crunchy.backupStorage | default "10Gi" }}
  users:
    - name: keycloak
      databases:
        - keycloak
      options: "SUPERUSER"
{{- end }}
