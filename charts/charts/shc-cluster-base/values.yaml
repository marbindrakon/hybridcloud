cluster:
  # <name>.<baseDomain> is the cluster domain: api.<name>.<baseDomain>, *.apps.<name>.<baseDomain>
  name: ""
  baseDomain: ""

# Two layers so one cluster can run them as two Argo CD Applications: "base" has no Vault
# dependency and goes first (it installs ESO); "certs" needs the ClusterSecretStore, which comes
# after ESO, for the TSIG key. A single release with both true is fine once the store exists.
layers:
  base: true
  certs: true
  # The ops section renders with the base layer, or alone with ops: true (central, which has no
  # base layer from this chart).
  ops: false

# ─── cert-manager Operator for Red Hat OpenShift ────────────────────────────
certManager:
  enabled: true
  subscription:
    channel: stable-v1
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  # DNS-01 self-check against a recursive resolver only (the zone primary is not reachable as a
  # recursor). Empty = operator default.
  recursiveNameservers: ""

# ─── Let's Encrypt ClusterIssuer (DNS-01 over RFC 2136) — layer "certs" ──────
letsencrypt:
  enabled: true
  issuerName: letsencrypt-shc
  server: https://acme-v02.api.letsencrypt.org/directory
  email: ""
  dnsZones: []
  rfc2136:
    nameserver: ""          # host:port of the zone primary
    tsigKeyName: ""         # with trailing dot
    tsigAlgorithm: HMACSHA256
  # TSIG secret (key "secret") in the cert-manager namespace, from Vault through ESO.
  tsigSecret:
    name: shc-acme-tsig
    secretStoreName: vault-backend
    vaultKey: ""            # KV path relative to the store, property "secret"
  # ACME account key. With vaultKey set, every cluster shares one platform account (one CAA
  # accounturi); empty = cert-manager registers a new account for this cluster.
  account:
    secretName: letsencrypt-shc-account
    vaultKey: ""            # property "tls.key"

# ─── API and default-ingress certificates — layer "certs" ────────────────────
certificates:
  privateKey:
    algorithm: ECDSA
    size: 256
  api:
    # Named certificate for api.<cluster>. Clients that pinned the installer's CA must trust the
    # public roots too: the Hive admin kubeconfig and Vault's kubernetes auth for remote clusters.
    enabled: true
  ingress:
    enabled: true

# ─── chrony (MachineConfig per pool) ────────────────────────────────────────
timesync:
  enabled: true
  servers: []
  # Pools to configure; names match install-time manifests (99-<role>-chrony) so the chart
  # adopts them without a reboot.
  roles:
    - master
    - worker
  ignitionVersion: 3.4.0

# ─── External Secrets Operator for Red Hat OpenShift ─────────────────────────
externalSecrets:
  enabled: true
  namespace: external-secrets-operator
  subscription:
    name: openshift-external-secrets-operator
    channel: stable-v1
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  # ExternalSecretsConfig "cluster" spec. The operands run behind deny-all NetworkPolicies:
  # add egress to the secret backend under controllerConfig.networkPolicies.
  config:
    spec: {}

# ─── Cluster monitoring config ───────────────────────────────────────────────
monitoring:
  enabled: true
  userWorkload: true
  # Empty storageClass = no PVCs (emptyDir), as on a cluster without a default StorageClass.
  storageClass: ""
  prometheus:
    retention: 7d
    size: 50Gi
  alertmanager:
    size: 10Gi

# ─── Operations: backups, seal token check, alert rules (layer base or ops) ──
ops:
  enabled: true
  namespace: shc-ops
  # curl, sed, coreutils, chroot; the cluster pull secret covers registry.redhat.io
  image: registry.redhat.io/ubi9/ubi-minimal:latest
  # cluster-backup.sh on one control-plane node, kept on that node's disk
  etcdBackup:
    enabled: true
    schedule: "0 1 * * *"     # UTC
    keep: 7
    hostDir: /var/lib/etcd-backup
  # Raft snapshots of this cluster's platform Vault into a PVC. The Vault side (policy reading
  # sys/storage/raft/snapshot, a Kubernetes auth role for <namespace>/vault-snapshot) is
  # bootstrap.sh vault-snapshot-auth.
  vaultSnapshot:
    enabled: false
    schedule: "30 1 * * *"
    vaultAddr: ""             # e.g. http://vault-active.central-vault.svc:8200
    authMount: kubernetes
    role: shc-vault-snapshot
    keep: 14
    size: 5Gi
    storageClass: ""
  # Daily lookup of the transit seal token's remaining TTL on the lab Vault (D7)
  transitTokenCheck:
    enabled: false
    namespace: ""             # the platform Vault's namespace (holds the token Secret)
    secretName: vault-transit-token
    labVaultAddr: ""
    minTTLDays: 7
    schedule: "15 6 * * *"
  # Dispatch re-drive and stall detection (LAB-PLAN §11.1, design/DELIVERY-HARDENING.md): only on the
  # cluster that holds the hybridsovereign.redhat CRs (services). Failures surface as ShcBackupJobFailed.
  edaRedrive:
    enabled: false
    schedule: "*/5 * * * *"
    # python3 + kubernetes client + PyYAML
    image: quay.signal9.gg/shc/ansible-runner:latest
    config:
      ackTimeoutMinutes: 10
      jobTimeoutMinutes: 30
      publishFailedMinutes: 15
      maxRedrives: 3
      # kinds whose EDA roles are idempotent (create-if-absent); others are only reported
      redriveKinds: [Entity, Team, Project, Persona, AAPOrg, QuayOrg, RbacConfig, AAPConfig, QuayConfig, VaultKV, Assignment]
      kinds:
        PlatformOpenshift: {jobTimeoutMinutes: 150}
        CloudOSO: {jobTimeoutMinutes: 150}
  # Tenant cloud orphan check (LAB-PLAN §11.6 phase D, design/TENANT-TEARDOWN.md §3.5): report-only,
  # on the cluster that holds the CloudOSO/PlatformOpenshift CRs (services). Findings fail the job
  # (ShcBackupJobFailed). Scope: the tenant Keystone domain and the tenant DNS zone.
  tenantOrphanCheck:
    enabled: false
    schedule: "45 5 * * *"
    # python3 + openstacksdk + kubernetes client + PyYAML
    image: ""
    # central Vault key with the tenant admin's clouds.yaml (property clouds.yaml), via secretStore
    accountVaultKey: ""
    secretStore: vault-backend
    config:
      domain: ""
      ignoreProjects: []
      dnsZoneId: ""
      dnsProjectId: ""
  certManagerMetrics:
    enabled: true
  alerts:
    enabled: true
    staleHours: 26
    certExpiryDays: 14
    vaultNamespaces: "central-vault|services-vault"
    # etcd on virtual or network-backed disks: warns well before OpenShift's own etcd alerts
    # (fsync p99 > 0.5 s / 1 s for 10 min, more than 5 leader changes in 10 min)
    etcd:
      enabled: true
      fsyncP99Seconds: 0.1   # WAL fsync p99 (5 min rate), sustained for 5 min
      leaderChanges: 2       # within 30 min, outside etcd and machine-config rollouts

# ─── Fabric underlay (P7.2) — layer "certs" ──────────────────────────────────
# EVPN underlay of an IaaS cluster (templates/fabric.yaml): NMState operator + per-node VTEP VLAN interface and
# fabric routes, CNO FRR + route advertisements, per-node FRRConfiguration to the route reflectors. Off by default.
fabric:
  enabled: false
  asn: 65010
  routeReflectors: []        # standalone route reflectors, e.g. [172.18.234.11, 172.18.234.12]
  gateways: []               # the fabric's CloudGateway addresses on this site's underlay (with BFD)
  bfd: {receiveInterval: 300, transmitInterval: 300, detectMultiplier: 3}
  password:
    secretStoreName: vault-backend
    vaultKey: fabric/bgp     # property "password"
  nmstate:
    channel: stable
  vtepInterface:
    base: bond0              # the fabric bond
    vlan: 0                  # the site's fabric VLAN
    mtu: 9000
    prefixLength: 24
  gateway: ""                # the site's fabric gateway (.1)
  routes: []                 # the other fabric subnets, via the gateway
  absentRoutes: []           # destinations to remove from the VTEP interface (NMState keeps routes left out of routes)
  nodes: []                  # [{name: <node>, vtepIP: <address>}]
  # OVN-K creates the EVPN SVIs at 1500 and shrinks them whenever a network is added (templates/evpn-svi-mtu.yaml):
  # a node service keeps them at the overlay MTU. MachineConfig per pool (one reboot when first enabled).
  sviMtu:
    enabled: false
    mtu: 9000
    roles: [master, worker]

# ─── Tenant access (P7.3.7) — layer "certs" ──────────────────────────────────
# Tenant sign-in through the platform's tenant realm, no self-provisioning, and the CloudVirt network guard
# (templates/tenant-access.yaml).
tenantAccess:
  enabled: false
  identityProvider:
    # also the last path segment of the client's redirect URI (/oauth2callback/<name>)
    name: sovereign-tenants
    issuer: ""
  clientId: ""              # default openshift-<cluster.name>
  clientSecret:
    name: tenant-oidc-client
    secretStoreName: vault-backend
    vaultKey: ""            # default clusters/<cluster.name>/tenant-oidc (property clientSecret)
  # false: nobody may create projects (the self-provisioners binding is emptied)
  selfProvisioners: false
  # admission policy: in namespaces labelled hybridsovereign.redhat/cloudvirt, only system identities and
  # cluster admins may manage NetworkAttachmentDefinitions and UserDefinedNetworks
  networkGuard: true

# ─── Tenant DNS controller (TENANT-DNS D3) — layer "certs" ───────────────────
# Tenants publish names in their CloudVirt environment's zone with DNSEndpoint objects and external-dns hostname
# annotations on Services/Routes (templates/tenant-dns.yaml, files/tenant_dns_controller.py). Installs the
# DNSEndpoint CRD (schema only).
tenantDns:
  enabled: false
  namespace: shc-tenant-dns
  # python3 + openstacksdk + kubernetes client + PyYAML
  image: ""
  account:
    secretStoreName: vault-backend
    # central Vault key with the DNS-only account's clouds.yaml (property clouds.yaml), scoped to the zones' project
    vaultKey: dns/tenant-designate
  config:
    domain: ""              # the global tenant domain; environment zones are zoneDepth labels below it
    zoneDepth: 2            # <cloudvirt>.<entity>.<domain>
    defaultTTL: 300
    resyncSeconds: 300
    types: [A, AAAA, CNAME, TXT, MX, SRV, CAA]
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {memory: 256Mi}
