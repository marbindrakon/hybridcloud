# ─── RHBK Config (DEPRECATED — replaced by sovereignJobs keycloak* jobs) ─────
rhbkConfig:
  enabled: false
  chartVersion: "0.4.0"
  syncWave: "30"
  destinationNamespace: central-rhbk
  values:
    namespace: central-rhbk
    ansibleJob:
      enabled: false

# ─── ACS (disabled) ──────────────────────────────────────────────────────────
acs:
  enabled: true
  chartVersion: "0.2.0"
  syncWave: "25"
  destinationNamespace: rhacs-operator
  values:
    namespace: rhacs-operator
    central:
      enabled: true
      namespace: stackrox
      instanceName: stackrox-central-services
    consolePlugin:
      enabled: true

acsServices:
  enabled: false
  chartVersion: "0.2.0"
  syncWave: "25"
