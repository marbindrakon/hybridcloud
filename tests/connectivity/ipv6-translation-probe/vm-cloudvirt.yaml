# The IPv6 translation probe on an OpenShift Virtualization site: one Fedora VM in the probe environment's site
# namespace on the probe network's placement (the namespace's primary network), with the l2bridge binding, named
# __WORKLOAD__. The user data is probe-user-data.yaml with its placeholders replaced, kept in a Secret of the same
# namespace:
#   oc create secret generic __WORKLOAD__-user-data -n __NAMESPACE__ --from-file=userdata=probe-user-data.yaml
# The network data configures the NIC (matched by its MAC address) by DHCPv6 and router advertisements, without DHCPv4,
# with the translation resolvers of the placement (status.ipv6.translation.resolvers). DHCPv6 also hands out the
# cluster's DNS service, which has no DNS64: the user data's ignore-auto-dns step makes the guest ignore it, so only
# the translation resolvers remain. Replace every placeholder (README.md lists them).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __WORKLOAD__
  namespace: __NAMESPACE__
  labels: {app: shc-ipv6-probe}
spec:
  runStrategy: Always
  template:
    metadata:
      labels: {app: shc-ipv6-probe}
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu: {cores: 1}
        memory: {guest: 1Gi}
        resources: {requests: {cpu: 250m}}
        devices:
          disks:
            - {name: root, disk: {bus: virtio}}
            - {name: cloudinit, disk: {bus: virtio}}
          interfaces:
            - name: default
              macAddress: "__MAC__"
              binding: {name: l2bridge}
      networks:
        - {name: default, pod: {}}
      volumes:
        - name: root
          containerDisk: {image: quay.io/containerdisks/fedora:44}   # Fedora 44 or later: its clatd (2.1) runs under the network's port security
        - name: cloudinit
          cloudInitNoCloud:
            secretRef: {name: __WORKLOAD__-user-data}
            networkData: |
              version: 2
              ethernets:
                primary:
                  match: {macaddress: "__MAC__"}
                  dhcp4: false
                  dhcp6: true
                  accept-ra: true
                  nameservers:
                    addresses: [__RESOLVERS__]
