      enabled: true  # shc: P4 (services cluster) enabled
      playbook: operator-samples.yml
      activeDeadlineSeconds: 900
      syncWave: "45"
      env:
        - name: OCP_SERVICES_SERVER
          value: "https://api.services.shc.signal9.gg:6443"
        - name: RUN_ID
          value: "3"

