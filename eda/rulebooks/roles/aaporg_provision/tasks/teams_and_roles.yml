---
- name: Create admin team via gateway API
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/teams/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ org_name }}-admins"
      organization: "{{ gw_org_id }}"
      description: Admin team mapped from Keycloak RBAC groups
    validate_certs: false
    status_code: [200, 201, 400]
  register: _admin_team
  ignore_errors: true
  when: gw_org_id | int > 0

- name: Create executor team via gateway API
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/teams/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ org_name }}-executors"
      organization: "{{ gw_org_id }}"
      description: Job executor team mapped from Keycloak RBAC groups
    validate_certs: false
    status_code: [200, 201, 400]
  register: _exec_team
  ignore_errors: true
  when: gw_org_id | int > 0

- name: Create viewer team via gateway API
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/teams/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ org_name }}-viewers"
      organization: "{{ gw_org_id }}"
      description: Read-only viewer team mapped from Keycloak RBAC groups
    validate_certs: false
    status_code: [200, 201, 400]
  register: _viewer_team
  ignore_errors: true
  when: gw_org_id | int > 0 and viewer_groups | length > 0

# Authenticator maps: one per (team, access group), named <tenant>_<name>_<admin|executor|viewer>_<access group> by
# the names function (the gateway keeps one namespace of map names for all organizations). The sign-in claim carries
# full group paths (/<entity>/<access group>), so the trigger is '/' + the Rbac's group. This organization's maps are
# the ones whose ids its status records, and a map of a wanted name that already points at this organization (only
# the gateway's administrators write maps); never a map found by the beginning of its name. Maps are created, updated
# when their trigger or team differ, and this organization's maps that are no longer wanted are deleted (also the
# maps of the earlier names); the ids are recorded right after the creates.
- name: The names of the wanted maps
  ansible.builtin.include_tasks: map_name.yml
  loop: "{{ aaporg_grants | default([]) }}"
  loop_control:
    loop_var: aaporg_grant
    label: "{{ aaporg_grant.kind }} {{ aaporg_grant.rbac }}"

- name: Wanted authenticator maps of this organization
  ansible.builtin.set_fact:
    aaporg_wanted_maps: >-
      {%- set out = [] -%}
      {%- for g in aaporg_grants | default([]) -%}
        {%- set _ = out.append({'name': aaporg_map_names[g.kind ~ ' ' ~ g.rbac], 'team': org_name ~ '-' ~ g.team,
                                 'order': g.order, 'group': '/' ~ (g.group | regex_replace('^/+', ''))}) -%}
      {%- endfor -%}
      {{ out }}

- name: Read the authenticator's maps
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticators/{{ aap_auth_id }}/authenticator_maps/?page_size=200"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _aaporg_maps
  when: aap_auth_id | length > 0

- name: Work out the map changes
  vars:
    _have: "{{ (_aaporg_maps.json | default({})).results | default([]) }}"
    _recorded_ids: >-
      {{ ((aaporg_recorded | default({}, true)).signInMaps | default([], true)) | map(attribute='id')
         | map('string') | list }}
    _wanted_names: "{{ aaporg_wanted_maps | map(attribute='name') | list }}"
    # the names maps had before the names function (<organization>-<kind>-map-<group>), for the groups granted now
    # and the groups the status records: such a map pointing at this organization is this organization's, and goes
    _earlier_names: >-
      {%- set out = [] -%}
      {%- for kind, groups in [('admin', (aaporg_grants | default([]) | selectattr('kind', 'equalto', 'admin') | map(attribute='group') | list)
                                          + ((aaporg_recorded | default({}, true)).adminGroups | default([], true))),
                               ('executor', (aaporg_grants | default([]) | selectattr('kind', 'equalto', 'executor') | map(attribute='group') | list)
                                             + ((aaporg_recorded | default({}, true)).executorGroups | default([], true))),
                               ('viewer', (aaporg_grants | default([]) | selectattr('kind', 'equalto', 'viewer') | map(attribute='group') | list)
                                           + ((aaporg_recorded | default({}, true)).viewerGroups | default([], true)))] -%}
        {%- for g in groups -%}{%- set _ = out.append(org_name ~ '-' ~ kind ~ '-map-' ~ g) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    aaporg_maps_ours: >-
      {%- set out = [] -%}
      {%- for h in _have -%}
        {%- if (h.id | string) in _recorded_ids
              or ((h.name in _wanted_names or h.name in _earlier_names)
                  and (h.organization | default('', true) | string) == org_name) -%}
          {%- set _ = out.append(h) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    aaporg_maps_foreign: >-
      {{ _have | selectattr('name', 'in', _wanted_names)
         | rejectattr('organization', 'equalto', org_name) | rejectattr('id', 'in', _recorded_ids | map('int') | list)
         | map(attribute='name') | list }}
  when: aap_auth_id | length > 0

- name: Work out what to create, update and delete
  ansible.builtin.set_fact:
    aaporg_maps_create: >-
      {{ aaporg_wanted_maps | rejectattr('name', 'in', (_aaporg_maps.json | default({})).results | default([])
                                         | map(attribute='name') | list) | list }}
    aaporg_maps_update: >-
      {%- set out = [] -%}
      {%- for w in aaporg_wanted_maps -%}
        {%- for h in aaporg_maps_ours if h.name == w.name -%}
          {%- set trig = ((h.triggers | default({}, true)).groups | default({}, true)).has_or | default([], true) -%}
          {%- if trig != [w.group] or (h.team | default('', true) | string) != w.team -%}
            {%- set _ = out.append(w | combine({'id': h.id})) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    aaporg_maps_delete: >-
      {{ aaporg_maps_ours | rejectattr('name', 'in', aaporg_wanted_maps | map(attribute='name') | list) | list }}
  when: aap_auth_id | length > 0

- name: Create the authenticator maps
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item.name }}"
      authenticator: "{{ aap_auth_id }}"
      map_type: team
      triggers:
        groups:
          has_or: ["{{ item.group }}"]
      organization: "{{ org_name }}"
      team: "{{ item.team }}"
      # the gateway requires the team role a map grants (400 "You must specify a role with the selected map type")
      role: "{{ aaporg_team_map_role | default('Team Member') }}"
      order: "{{ item.order }}"
      revoke: true
    validate_certs: false
    status_code: [200, 201]
  loop: "{{ aaporg_maps_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: aap_auth_id | length > 0
  register: _aaporg_map_created
  ignore_errors: true

# the maps this organization holds now, by id, recorded at once after the creates (the teardown deletes exactly
# what is recorded); the list without the maps deleted below is recorded with the ready status
- name: The maps this organization holds after the creates
  ansible.builtin.set_fact:
    aaporg_maps_recorded: >-
      {%- set out = [] -%}
      {%- for h in aaporg_maps_ours | default([]) -%}
        {%- set _ = out.append({'id': h.id | string, 'name': h.name}) -%}
      {%- endfor -%}
      {%- for r in (_aaporg_map_created.results | default([])) if not (r.failed | default(false)) and r.json is defined -%}
        {%- set _ = out.append({'id': r.json.id | string, 'name': r.json.name}) -%}
      {%- endfor -%}
      {{ out }}
  when: aap_auth_id | length > 0

- name: Record this organization's maps in its status
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: aaporgs
    cr_name: "{{ aaporg_cr_name }}"
    cr_namespace: "{{ aaporg_cr_namespace }}"
    cr_status_partial: true
    cr_status_body:
      signInMaps: "{{ aaporg_maps_recorded }}"
  when:
    - aap_auth_id | length > 0
    - (aaporg_maps_recorded | sort(attribute='id') | list)
      != ((aaporg_recorded | default({}, true)).signInMaps | default([], true) | sort(attribute='id') | list)

- name: Update the authenticator maps whose trigger differs
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/{{ item.id }}/"
    method: PATCH
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      triggers:
        groups:
          has_or: ["{{ item.group }}"]
      organization: "{{ org_name }}"
      team: "{{ item.team }}"
    validate_certs: false
    status_code: [200]
  loop: "{{ aaporg_maps_update | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: aap_auth_id | length > 0
  register: _aaporg_map_updated
  ignore_errors: true

- name: Delete this organization's maps that are no longer wanted
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/gateway/v1/authenticator_maps/{{ item.id }}/"
    method: DELETE
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [204, 404]
  loop: "{{ aaporg_maps_delete | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: aap_auth_id | length > 0

- name: The maps this organization keeps
  ansible.builtin.set_fact:
    aaporg_maps_recorded: >-
      {%- set gone = aaporg_maps_delete | default([]) | map(attribute='id') | map('string') | list -%}
      {{ aaporg_maps_recorded | rejectattr('id', 'in', gone) | list }}
  when: aap_auth_id | length > 0

# a wanted map name held by a map of another organization is not touched; this organization's sign-in is then not
# in place for that group
- name: Record whether the sign-in mapping is in place
  ansible.builtin.set_fact:
    aaporg_mapping_failed: >-
      {{ ((_aaporg_map_created.results | default([])) + (_aaporg_map_updated.results | default([])))
         | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
         or (aaporg_maps_foreign | default([]) | length > 0) }}

- name: Fetch org object roles
  ansible.builtin.uri:
    url: "{{ aap_gateway_internal_url }}/api/controller/v2/organizations/{{ aap_org_id }}/object_roles/"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _org_roles
  when: aap_org_id | int > 0

- name: Build list of operational admin role IDs
  ansible.builtin.set_fact:
    admin_role_ids: >-
      {{ _org_roles.json.results
         | selectattr('name', 'in', ['Project Admin', 'Inventory Admin',
            'Credential Admin', 'Workflow Admin', 'Notification Admin',
            'Job Template Admin', 'Execution Environment Admin', 'Execute', 'Auditor'])
         | map(attribute='id')
         | list }}
  when: aap_org_id | int > 0

- name: Build execute role ID list
  ansible.builtin.set_fact:
    execute_role_ids: >-
      {{ _org_roles.json.results
         | selectattr('name', 'equalto', 'Execute')
         | map(attribute='id')
         | list }}
  when: aap_org_id | int > 0

- name: Build auditor role ID list
  ansible.builtin.set_fact:
    auditor_role_ids: >-
      {{ _org_roles.json.results
         | selectattr('name', 'equalto', 'Auditor')
         | map(attribute='id')
         | list }}
  when: aap_org_id | int > 0

- name: Grant operational admin roles to admin team
  block:
    - name: Fetch admin team ID from controller
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/?name={{ org_name }}-admins&organization={{ aap_org_id }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: _admin_team_info
      retries: 3
      delay: 3
      until: _admin_team_info.json.count | default(0) > 0

    - name: Assign operational roles to admin team
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/{{ _admin_team_info.json.results[0].id }}/roles/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': item | int} }}"
        validate_certs: false
        status_code: [200, 204, 400, 409]
      loop: "{{ admin_role_ids }}"
      when: _admin_team_info.json.results | length > 0
  when: aap_org_id | int > 0
  ignore_errors: true

- name: Grant execute role to executor team
  block:
    - name: Fetch executor team ID from controller
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/?name={{ org_name }}-executors&organization={{ aap_org_id }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: _exec_team_info
      retries: 3
      delay: 3
      until: _exec_team_info.json.count | default(0) > 0

    - name: Assign execute role to executor team
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/{{ _exec_team_info.json.results[0].id }}/roles/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': item | int} }}"
        validate_certs: false
        status_code: [200, 204, 400, 409]
      loop: "{{ execute_role_ids }}"
      when: _exec_team_info.json.results | length > 0
  when: aap_org_id | int > 0
  ignore_errors: true

- name: Grant auditor role to viewer team
  block:
    - name: Fetch viewer team ID from controller
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/?name={{ org_name }}-viewers&organization={{ aap_org_id }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: _viewer_team_info
      retries: 3
      delay: 3
      until: _viewer_team_info.json.count | default(0) > 0

    - name: Assign auditor role to viewer team
      ansible.builtin.uri:
        url: "{{ aap_gateway_internal_url }}/api/controller/v2/teams/{{ _viewer_team_info.json.results[0].id }}/roles/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': item | int} }}"
        validate_certs: false
        status_code: [200, 204, 400, 409]
      loop: "{{ auditor_role_ids | default([]) }}"
      when: _viewer_team_info.json.results | length > 0
  when: aap_org_id | int > 0 and viewer_groups | length > 0
  ignore_errors: true
