---
# shc (LAB-PLAN §11.6, design/TENANT-TEARDOWN.md §3.1): delete the kinds one at a time, in
# services_cr_groups order, and wait for each to be gone - its finalizers run the EDA teardowns -
# before the next. Upstream deleted everything at once, so clouds went before the clusters in them.
- name: "Delete {{ cr_group.group }} CRs kind by kind"
  ansible.builtin.include_tasks: delete-kind.yml
  loop: "{{ cr_group.kinds }}"
  loop_control:
    loop_var: kind_item
