---
- name: Create Keycloak clients
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keycloak_url: "{{ lookup('env', 'KEYCLOAK_URL') | default('http://sovereign-keycloak-central-service.rhbk.svc:8080', true) }}"
    keycloak_admin_secret_name: "{{ lookup('env', 'KEYCLOAK_ADMIN_SECRET') | default('sovereign-keycloak-central-initial-admin', true) }}"
    keycloak_admin_secret_namespace: "{{ lookup('env', 'KEYCLOAK_ADMIN_SECRET_NS') | default('rhbk', true) }}"
    realm_name: "{{ lookup('env', 'REALM_NAME') | default('sovereign-central', true) }}"
    clients_json: "{{ lookup('env', 'KEYCLOAK_CLIENTS') | default('[]', true) }}"

  pre_tasks:
    - name: Fetch Keycloak admin credentials from cluster
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ keycloak_admin_secret_name }}"
        namespace: "{{ keycloak_admin_secret_namespace }}"
      register: admin_secret
      retries: 30
      delay: 10
      until: admin_secret.resources | length > 0

    - name: Set admin credentials
      ansible.builtin.set_fact:
        keycloak_admin_user: "{{ admin_secret.resources[0].data.username | b64decode }}"
        keycloak_admin_password: "{{ admin_secret.resources[0].data.password | b64decode }}"

    - name: Wait for Keycloak to be reachable
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/master"
        method: GET
        validate_certs: false
        status_code: [200]
      retries: 30
      delay: 10
      register: kc_health
      until: kc_health.status == 200

    - name: Authenticate to Keycloak
      ansible.builtin.include_role:
        name: keycloak-auth

    - name: Parse clients from environment
      ansible.builtin.set_fact:
        keycloak_clients: "{{ clients_json if clients_json is not string else (clients_json | from_json) }}"

    - name: Retrieve Vault root token from secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: "vault-init-secrets"
        namespace: "{{ lookup('env', 'VAULT_NAMESPACE') | default('central-vault', true) }}"
      register: vault_secret
      retries: 10
      delay: 10
      until: vault_secret.resources | length > 0

    - name: Set vault root token
      ansible.builtin.set_fact:
        vault_root_token: "{{ (vault_secret.resources[0].data.root_token | b64decode) }}"
        vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://vault.central-vault.svc:8200', true) }}"

  roles:
    - keycloak-clients

  post_tasks:
    - name: Write client secrets directly to Vault
      ansible.builtin.uri:
        # shc: one KV entry per realm. A POST replaces the whole entry, so the services-realm run
        # used to overwrite central's client secrets (same names "aap"/"acs" in both realms).
        url: "{{ vault_addr }}/v1/central/data/{{ lookup('env', 'VAULT_CLIENTS_KEY') | default('keycloak-clients', true) }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data: "{{ keycloak_client_secrets }}"
        status_code: [200, 204]
      when: keycloak_client_secrets is defined and keycloak_client_secrets | length > 0 and vault_root_token is defined
      no_log: true

    # shc (P7.3.7): a client with vault_key also gets its own KV entry {clientSecret}, so a cluster whose
    # Vault policy covers only its own keys (clusters/<name>/*) can read its sign-in client secret
    - name: Write per-client secrets to Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/central/data/{{ item.vault_key }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            clientSecret: "{{ keycloak_client_secrets[item.client_id] }}"
        status_code: [200, 204]
      loop: "{{ keycloak_clients | selectattr('vault_key', 'defined') | list }}"
      loop_control:
        label: "{{ item.client_id }} -> {{ item.vault_key }}"
      when: keycloak_client_secrets is defined and vault_root_token is defined
      no_log: true
