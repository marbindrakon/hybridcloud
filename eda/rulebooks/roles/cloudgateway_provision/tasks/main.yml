---
# shc (design/P7-PLAN.md P7.3.5, §12.3 + H2): CloudGateway provision. Resolves the fabric and the site and
# validates the gateway against them and the fabric's other gateways; waits (pending) while the fabric or the site
# isn't ready. Then realizes it with this platform's realization (common/vars/fabric_realization.yml +
# fabric_realization):
# 1. a provider-edge index from the fabric ledger (loopback, core link address, node SID);
# 2. the site side: OpenShift = the VTEP named after the fabric; OpenStack = the platform project;
# 3. under the fabric's lease, one border gateway node at a time: network namespace gw-<name> with the site's
#    underlay VLAN and a core leg, and its FRR instance (site route reflector over the site subnet, client of any
#    upstream route reflectors, VPNv4 to the root, IS-IS segment routing), verified before the next node.
- block:
    - name: Read the CloudGateway
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_read.yml"

    - name: Start with nothing to wait for
      ansible.builtin.set_fact:
        cg_waiting: []
        cg_reason: WaitingForDependencies
        cg_fabric_name: "{{ fab_spec.fabricRef.name }}"
        cg_site_name: "{{ fab_spec.cloudRef.name }}"

    - name: Refuse transports other than none
      ansible.builtin.set_fact:
        fab_fail_reason: TransportNotSupported
        fab_fail_msg: >-
          CloudGateway {{ fab_name }}: transport {{ fab_spec.transport }} is not supported yet (only none, a site
          underlay trunked to the border gateway nodes)
      when: (fab_spec.transport | default('none')) != 'none'

    - name: Stop on an unsupported transport
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: (fab_spec.transport | default('none')) != 'none'

    - name: The platform's realization parameters
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_realization.yml"
      vars:
        fab_real_fabric: "{{ cg_fabric_name }}"

    - name: Read the fabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ cg_fabric_name }}"
        namespace: "{{ fab_namespace }}"
      register: _cg_fabric

    - name: Set the fabric facts
      ansible.builtin.set_fact:
        cg_fabric: "{{ (_cg_fabric.resources | default([{}], true))[0] }}"
        cg_fabric_found: "{{ _cg_fabric.resources | default([]) | length > 0 }}"

    - name: Wait for a missing fabric
      ansible.builtin.set_fact:
        cg_waiting: "{{ cg_waiting + ['HybridFabric ' ~ cg_fabric_name ~ ' (not found)'] }}"
      when: not cg_fabric_found

    - name: Resolve the site
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ cg_site_name }}"
        ci_ref_namespace: "{{ fab_namespace }}"

    - name: Wait for a missing or unusable site
      ansible.builtin.set_fact:
        cg_waiting: "{{ cg_waiting + [ci_error | trim] }}"
      when: ci_error | trim | length > 0

    - name: Wait for the site's EVPN capability
      ansible.builtin.set_fact:
        cg_waiting: "{{ cg_waiting + ['CloudInfrastructure ' ~ cg_site_name ~ ': evpn capability'] }}"
        cg_reason: SiteNotEvpnCapable
      when:
        - ci_error | trim | length == 0
        - not (ci_capabilities.evpn | default(false) | bool)

    - name: List the platform's gateways
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        namespace: "{{ fab_namespace }}"
      register: _cg_all

    - name: Check the gateway against the fabric and the other gateways
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check:
          action: check-gateway
          fabric: "{{ cg_fabric.spec | default({}) }}"
          core: "{{ fab_real.core }}"
          gateway: "{{ fab_spec }}"
          others: >-
            {{ _cg_all.resources | default([]) | rejectattr('metadata.name', 'equalto', fab_name)
               | rejectattr('metadata.deletionTimestamp', 'defined') | list }}
      when: cg_fabric_found

    - name: Keep the upstream route reflectors outside the site subnet
      ansible.builtin.set_fact:
        cg_upstream_remote: "{{ fab_check_result.upstreamRemote | default([]) }}"
      when: cg_fabric_found

    - name: Refuse an invalid gateway
      ansible.builtin.set_fact:
        fab_fail_reason: InvalidSpec
        fab_fail_msg: "CloudGateway {{ fab_name }}: {{ fab_check_result.errors | join('; ') }}"
      when: cg_fabric_found and fab_check_result.errors | length > 0

    - name: Stop on an invalid gateway
      ansible.builtin.fail:
        msg: "{{ fab_fail_msg }}"
      when: cg_fabric_found and fab_check_result.errors | length > 0

    - name: Wait for the fabric to be ready
      ansible.builtin.set_fact:
        cg_waiting: >-
          {{ cg_waiting + ['HybridFabric ' ~ cg_fabric_name ~ ' (' ~ ((cg_fabric.status | default({}, true)).status
             | default('not provisioned', true)) ~ ')'] }}
      when:
        - cg_fabric_found
        - not ((cg_fabric.status | default({}, true)).ready | default(false) | bool)

    - name: Set the site status
      ansible.builtin.set_fact:
        cg_status:
          site:
            name: "{{ cg_site_name }}"
            type: "{{ ci_type }}"
            evpn: "{{ ci_capabilities.evpn | default(false) | bool }}"

    - name: Report what the gateway waits for
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: pending
        fab_reason: "{{ cg_reason }}"
        fab_message: "Waiting for {{ cg_waiting | join('; ') }}"
        fab_waiting_for: "{{ cg_waiting }}"
        fab_status: "{{ cg_status }}"
      when: cg_waiting | length > 0

    - name: End the job while waiting
      ansible.builtin.meta: end_play
      when: cg_waiting | length > 0

    - name: The gateway's provider-edge index
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger:
          action: ledger-allocate
          namespace: "{{ fab_namespace }}"
          fabric: "{{ cg_fabric_name }}"
          kind: peIndex
          owner: "CloudGateway/{{ fab_namespace }}/{{ fab_name }}"

    - name: Keep the gateway's index
      ansible.builtin.set_fact:
        cg_pe_index: "{{ fab_ledger_result.value | int }}"

    - name: The root's provider-edge addresses (index 1)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: pe-addresses, core: "{{ fab_real.core }}", index: 1}

    - name: Set the root's addresses
      ansible.builtin.set_fact:
        cg_root_pe: "{{ fab_check_result }}"

    - name: The gateway's addresses
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_check.yml"
      vars:
        fab_check: {action: pe-addresses, core: "{{ fab_real.core }}", index: "{{ cg_pe_index }}"}

    - name: Set the gateway instance
      ansible.builtin.set_fact:
        cg_pe: "{{ fab_check_result }}"
        cg_instance: >-
          {{ {'type': 'gateway', 'netns': 'gw-' ~ fab_name, 'trunk': fab_real.nodes.trunkInterface,
              'vlan': fab_spec.siteUnderlay.vlan | int, 'loopback': fab_check_result.loopback,
              'loopbackPool': fab_real.core.loopbackPool, 'coreBridge': fab_real.core.bridge,
              'coreVeth': 'pe' ~ fab_check_result.index, 'link': fab_check_result.link,
              'coreMtu': cg_fabric.spec.overlayMtu | int + 100}
             | combine({'mtu': fab_spec.siteUnderlay.mtu | int} if fab_spec.siteUnderlay.mtu is defined else {}) }}
        cg_holder: "CloudGateway/{{ fab_name }} job {{ tower_job_id | default(awx_job_id | default(lookup('pipe', 'date +%s'))) }}"
        cg_node_results: []
        cg_changed_nodes: []
        cg_bgp_password: ""

    - name: Read the BGP session password
      when: ((fab_spec.bgp | default({})).passwordRef | default((cg_fabric.spec.bgp | default({})).passwordRef | default(none))) is not none
      block:
        - name: Expect the BGP password
          ansible.builtin.set_fact:
            fab_fail_reason: CredentialsMissing
            fab_fail_msg: "CloudGateway {{ fab_name }}: the BGP passwordRef is not readable or has no password"

        - name: Read the BGP passwordRef
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: >-
              {{ ((fab_spec.bgp | default({})).passwordRef | default(cg_fabric.spec.bgp.passwordRef)).vaultPath }}

        - name: Keep the password
          ansible.builtin.set_fact:
            cg_bgp_password: "{{ vault_kv_data.password }}"
            vault_kv_data: {}
            fab_fail_reason: ProvisionFailed
            fab_fail_msg: ""
          no_log: true

    - name: The site side ({{ ci_type }})
      ansible.builtin.include_tasks: "site_{{ ci_type }}.yml"

    - name: Take the border gateway configuration lease
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
      vars:
        fab_ledger: {action: lease-acquire, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cg_holder }}"}

    - name: Configure the gateway on the nodes, one at a time
      block:
        - name: Connect to the border gateway nodes
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_connect.yml"
          vars:
            bgw_fabric_spec: "{{ cg_fabric.spec }}"
            bgw_ssh_user: "{{ fab_real.nodes.sshUser }}"

        - name: Configure the gateway instance on each node
          ansible.builtin.include_tasks: node_gateway.yml
          loop: "{{ cg_fabric.spec.borderGateway.nodes }}"
          loop_control:
            loop_var: bgw_node
            label: "{{ bgw_node.name }}"
      always:
        - name: Remove the SSH key
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"

        - name: Release the lease
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
          vars:
            fab_ledger: {action: lease-release, namespace: "{{ fab_namespace }}", fabric: "{{ cg_fabric_name }}", holder: "{{ cg_holder }}"}

    - name: Report the gateway ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: ready
        fab_reason: Ready
        fab_message: >-
          Gateway on {{ cg_node_results | map(attribute='name') | join(', ') }}; site sessions
          {{ cg_node_results | map(attribute='siteSessions') | map('string') | join('/') }}, upstream
          {{ cg_node_results | map(attribute='upstreamSessions') | map('string') | join('/') }}
          ({{ ('changed on ' ~ cg_changed_nodes | join(', ')) if cg_changed_nodes or cg_site_changed | bool else 'no change' }})
        fab_status: >-
          {{ cg_status | combine({'site': cg_status.site | combine(cg_site_extra),
                                   'nodes': cg_node_results,
                                   'realization': {'model': fab_real.model, 'peIndex': cg_pe.index, 'loopback': cg_pe.loopbackIp,
                                                   'nodeSid': cg_pe.sid, 'routeReflector': cg_root_pe.loopbackIp,
                                                   'netns': 'gw-' ~ fab_name}}) }}

  rescue:
    - name: Remove the SSH key
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/bgw_disconnect.yml"
      ignore_errors: true

    - name: Mark the CloudGateway failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_finish.yml"
      vars:
        fab_outcome: failed
        fab_reason: "{{ fab_fail_reason | default('ProvisionFailed') }}"
        fab_message: >-
          {{ fab_fail_msg | default('', true) or ansible_failed_result.msg | default('CloudGateway provision failed') }}
        fab_status: "{{ {'nodes': cg_node_results} if cg_node_results | default([]) | length > 0 else {} }}"
      when: fab_name is defined and services_api_host is defined
      ignore_errors: true

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudGateway {{ fab_name | default('unknown') }} provision failed: {{ fab_fail_reason | default('ProvisionFailed') }}"
