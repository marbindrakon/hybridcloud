---
# the labelled Route, else KEYCLOAK_EXTERNAL_URL; neither fails the job with a message that names the setting
- name: The sign-in directory's address
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/services_keycloak_url.yml"

- name: Set Keycloak external URL
  ansible.builtin.set_fact:
    kc_external_url: "{{ skc_url }}"

# the tenant realm's clients automation client (published by the RbacConfig job), not the master realm admin
- name: Obtain the realm token for the Vault sign-in client
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_realm_token.yml"
  vars:
    krt_purpose: clients
    krt_rbac_config: "{{ vault_spec.rbacConfig | default(plugin_vault_rbac_config | default('keycloak-sovereign-tenants-services'), true) }}"
    krt_url: "{{ kc_external_url }}"
    krt_token_fact: kc_access_token

# the client id the status records is kept; a new Vault gets vault_<tenant>_<name> from the names function
- name: The sign-in client's recorded id
  ansible.builtin.set_fact:
    vault_recorded_client_id: "{{ ((shc_live_cr | default({}, true)).status | default({}, true)).oidcClientId | default('', true) }}"

- name: The sign-in client's id for a new Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/names_call.yml"
  vars:
    names_request: {action: name, kind: identity-client, parts: ["vault", "{{ entity_name }}", "{{ vault_cr_name }}"]}
  when: vault_recorded_client_id | length == 0

- name: Set OIDC client ID for this Vault
  ansible.builtin.set_fact:
    vault_oidc_client_id: "{{ vault_recorded_client_id or names_result.name }}"

# exact callbacks (UI and CLI), no password grant, the groups claim with full paths; the client carries the mark
# Vault/<namespace>/<name>: a client of this id with another mark, or with none when the id is not this Vault's
# recorded one, is refused (NameTakenOnSite), never converged

- name: Ensure the Keycloak sign-in client of this Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/keycloak_client_ensure.yml"
  vars:
    kce_url: "{{ kc_external_url }}"
    kce_realm: "{{ plugin_vault_keycloak_realm }}"
    kce_token: "{{ kc_access_token }}"
    kce_client: "{{ vault_oidc_client_id }}"
    kce_name: "Vault {{ entity_name }}/{{ vault_cr_name }}"
    kce_root_url: "{{ vault_external_url }}"
    kce_redirect_uris:
      - "{{ vault_external_url }}/ui/vault/auth/oidc/oidc/callback"
      - "http://localhost:8250/oidc/callback"
    kce_web_origins: ["+"]
    kce_owner: "Vault/{{ vault_cr_namespace }}/{{ vault_cr_name }}"
    kce_adopt_unmarked: "{{ vault_recorded_client_id | length > 0 and vault_recorded_client_id == vault_oidc_client_id }}"

# recorded at once: the teardown deletes this id (with the mark), never a rebuilt one
- name: Record the sign-in client's id
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: vaults
    cr_name: "{{ vault_cr_name }}"
    cr_namespace: "{{ vault_cr_namespace }}"
    cr_status_partial: true
    cr_status_body:
      oidcClientId: "{{ vault_oidc_client_id }}"
  when: vault_recorded_client_id != vault_oidc_client_id

- name: Keep the client for the secret lookup
  ansible.builtin.set_fact:
    kc_oidc_final: {json: [{id: "{{ kce_client_uuid }}"}]}

- name: Refresh the realm token before the client secret lookup
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/obtain_keycloak_realm_token.yml"
  vars:
    krt_purpose: clients
    krt_rbac_config: "{{ vault_spec.rbacConfig | default(plugin_vault_rbac_config | default('keycloak-sovereign-tenants-services'), true) }}"
    krt_url: "{{ kc_external_url }}"
    krt_token_fact: kc_access_token

- name: Get OIDC client secret
  ansible.builtin.uri:
    url: "{{ kc_external_url }}/admin/realms/{{ plugin_vault_keycloak_realm }}/clients/{{ kc_oidc_final.json[0].id }}/client-secret"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
    validate_certs: false
    status_code: [200]
  register: kc_oidc_secret
  no_log: true
  retries: 3
  delay: 5
  until: kc_oidc_secret.status | default(0) == 200

- name: Read OpenShift Ingress CA for TLS trust
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: ConfigMap
    name: default-ingress-cert
    namespace: openshift-config-managed
  register: ingress_ca_cm

- name: Set Ingress CA PEM
  ansible.builtin.set_fact:
    ingress_ca_pem: "{{ ingress_ca_cm.resources[0].data['ca-bundle.crt'] }}"
  when: ingress_ca_cm.resources | length > 0

- name: Configure OIDC auth method in Vault
  ansible.builtin.uri:
    url: "{{ vault_api_url }}/v1/sys/auth/oidc"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: oidc
    validate_certs: false
    status_code: [200, 204, 400]

- name: Configure OIDC auth backend settings
  ansible.builtin.uri:
    url: "{{ vault_api_url }}/v1/auth/oidc/config"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      oidc_discovery_url: "{{ kc_external_url }}/realms/{{ plugin_vault_keycloak_realm }}"
      oidc_client_id: "{{ vault_oidc_client_id }}"
      oidc_client_secret: "{{ kc_oidc_secret.json.value }}"
      oidc_discovery_ca_pem: "{{ ingress_ca_pem | default(omit) }}"
      default_role: default
    validate_certs: false
    status_code: [200, 204]
  retries: 3
  delay: 10
  register: oidc_config_result
  until: oidc_config_result.status | default(0) in [200, 204]
  no_log: true

- name: Create OIDC default role in Vault
  ansible.builtin.uri:
    url: "{{ vault_api_url }}/v1/auth/oidc/role/default"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      bound_audiences: ["{{ vault_oidc_client_id }}"]
      allowed_redirect_uris:
        - "{{ vault_external_url }}/ui/vault/auth/oidc/oidc/callback"
        - "http://localhost:8250/oidc/callback"
      user_claim: preferred_username
      groups_claim: groups
      token_policies: [default]
      oidc_scopes: [openid, profile, email]
    validate_certs: false
    status_code: [200, 204]
