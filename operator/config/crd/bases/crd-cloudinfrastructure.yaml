apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudinfrastructures.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudInfrastructure
    listKind: CloudInfrastructureList
    plural: cloudinfrastructures
    singular: cloudinfrastructure
    shortNames:
      - cinfra
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            A site: one place where infrastructure runs, comparable to an AWS Region, a Google Cloud
            region, an Azure region or an OpenStack region. Platform-owned: an OpenStack cloud, an
            OpenShift cluster with OpenShift Virtualization, an AWS account, a Google Cloud project
            or an external site, that tenant environments and fabric gateways attach to. It holds
            the site's infrastructure credential and settings; tenant objects never carry them. The
            block named by spec.type (spec.openstack, spec.openshift, spec.aws, spec.gcp or
            spec.external) holds the site's settings.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of this object.
              type: object
              required:
                - type
              x-kubernetes-validations:
                - rule: has(self.openstack) == (self.type == 'openstack')
                  message: spec.openstack must be set if and only if spec.type is openstack
                - rule: has(self.openshift) == (self.type == 'openshift')
                  message: spec.openshift must be set if and only if spec.type is openshift
                - rule: has(self.aws) == (self.type == 'aws')
                  message: spec.aws must be set if and only if spec.type is aws
                - rule: has(self.gcp) == (self.type == 'gcp')
                  message: spec.gcp must be set if and only if spec.type is gcp
                - rule: has(self.external) == (self.type == 'external')
                  message: spec.external must be set if and only if spec.type is external
              properties:
                type:
                  type: string
                  description: Cloud type. Selects the typed section below. Immutable.
                  enum: [openstack, openshift, aws, gcp, external]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.type is immutable
                displayName:
                  type: string
                  maxLength: 128
                  description: Human-readable site name shown in consoles.
                credentialsRef:
                  type: object
                  description: >-
                    The site's infrastructure credential, stored in the platform's Vault KV store.
                    openstack: a cloud-admin clouds.yaml (key clouds.yaml; key ca.crt when the API certificate
                    is not publicly trusted); openshift: key kubeconfig (not needed for clusterRef local);
                    aws: not used (the platform's workload identity).
                  required: [vaultPath]
                  properties:
                    vaultPath:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Vault KV path holding the credential.
                entityRefs:
                  type: array
                  description: >-
                    Entities allowed to reference this site from their cloud projects. Empty means every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
                openstack:
                  type: object
                  description: >-
                    OpenStack site, reached through its public APIs only. The cloud's administrator configures
                    its fabric underlay; the platform detects EVPN support through Neutron's evpn extension.
                    Required when type is openstack.
                  properties:
                    region:
                      type: string
                      maxLength: 64
                      description: OpenStack region. Default the credential's clouds.yaml region_name.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: >-
                        Keystone domain for tenant projects. The infrastructure account is granted admin on it.
                    createProjectDomain:
                      type: boolean
                      default: false
                      description: Create projectDomain when it does not exist (otherwise a missing domain fails the site).
                    externalNetwork:
                      type: string
                      maxLength: 255
                      description: External Neutron network for tenant floating IPs.
                openshift:
                  type: object
                  description: >-
                    OpenShift cluster with OpenShift Virtualization for tenant VMs (CloudVirt). Required when type
                    is openshift.
                  properties:
                    clusterRef:
                      type: string
                      maxLength: 253
                      default: local
                      description: >-
                        The cluster: local is the services cluster itself; anything else is a cluster reached
                        through credentialsRef (key kubeconfig).
                    bootImage:
                      type: string
                      maxLength: 512
                      description: Default VM root disk image for CloudVirt (container disk URL).
                    storageClass:
                      type: string
                      maxLength: 253
                      description: StorageClass for VM disks.
                    fabricCredentialsRef:
                      type: object
                      description: >-
                        Vault KV path holding a kubeconfig (key kubeconfig) allowed to manage the platform's network
                        objects on the cluster (the fabric attachment, tenant networks, VM namespaces). Default
                        credentialsRef.
                      required: [vaultPath]
                      properties:
                        vaultPath:
                          description: Path of the secret in the platform's secret store.
                          type: string
                          minLength: 1
                          maxLength: 512
                dns:
                  type: object
                  description: >-
                    Where tenant environment DNS zones on this site live. Every environment gets a zone named
                    <environment>.<entity>.<tenant DNS domain> (the platform's DNSConfig).
                  x-kubernetes-validations:
                    - rule: self.mode != 'native' || (has(self.project) && size(self.project) > 0)
                      message: dns.project is required when dns.mode is native
                  properties:
                    mode:
                      type: string
                      enum: [native, platform]
                      default: platform
                      description: >-
                        native: environment zones are created in this site's own DNS service, owned by
                        dns.project and shared with the environment's project, so tenants manage their records
                        with the site's normal tools. platform: environment zones are held by the platform's DNS
                        service and edited through the platform.
                    project:
                      type: string
                      maxLength: 64
                      description: >-
                        native: the project on this site that owns the platform's parent zone (the tenant DNS
                        domain, which reserves the namespace on this site) and every environment zone.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: Keystone domain of dns.project. Default spec.openstack.projectDomain.
                    createProject:
                      type: boolean
                      default: false
                      description: Create dns.project when it does not exist (otherwise a missing project fails the site).
                    zoneQuota:
                      type: integer
                      minimum: 1
                      default: 1000
                      description: >-
                        native: the DNS service's zone quota ensured for dns.project (at least this many); every
                        environment zone on this site counts against it.
                    zoneAttributes:
                      type: object
                      additionalProperties:
                        type: string
                        maxLength: 64
                      description: >-
                        native: attributes set on the parent and environment zones created in this site's DNS
                        service, for example the pool scheduler's scope. Unset leaves zone placement to the
                        service's default.
                external:
                  type: object
                  description: >-
                    A site whose network the platform does not manage, for example a remote data center or a
                    partner's EVPN fabric: the site's own operator runs its VTEPs, and the platform only attaches it
                    to a HybridFabric through a CloudGateway. Required when type is external.
                  properties:
                    evpn:
                      type: boolean
                      default: true
                      description: The site's VTEPs speak EVPN-VXLAN to the gateway.
                aws:
                  type: object
                  description: >-
                    An AWS region the platform reaches with its own workload identity (no stored keys). Tenant
                    environments (CloudAWS) live in accounts the platform enters, and the site's CloudGateway runs
                    the edge that joins the region to the fabric. Required when type is aws.
                  required: [region]
                  properties:
                    region:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: AWS region, e.g. us-east-2.
                gcp:
                  type: object
                  description: >-
                    A Google Cloud region the platform reaches with its own workload identity (no stored keys).
                    Tenant environments (CloudGCP) live in projects the platform enters, and the site's CloudGateway
                    runs the edge that joins the region to the fabric. Required when type is gcp.
                  required: [region]
                  properties:
                    region:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: Google Cloud region, e.g. us-east4.
                    attachment:
                      type: string
                      enum: [vpn, interconnect]
                      default: vpn
                      description: >-
                        How tenant networks in this region attach to the fabric. vpn: HA VPN with BGP from each
                        placement's VPC. interconnect: Cloud Interconnect VLAN attachments (not available yet).
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                capabilities:
                  type: object
                  description: >-
                    What the site offers, as probed by the provision job. Keys: evpn (the site can attach to a
                    HybridFabric: openstack = Neutron's evpn extension is loaded; openshift = CNO FRR provider,
                    routeAdvertisements Enabled and fabric BGP sessions Established), api (the credential
                    authenticates), virtualization (OpenShift Virtualization Available), dns (environment zones can be created
                    on this site).
                  additionalProperties:
                    type: boolean
                site:
                  type: object
                  description: Observed site details (informational).
                  properties:
                    endpoint:
                      type: string
                      description: Cloud API or cluster API endpoint.
                    region:
                      type: string
                    version:
                      type: string
                      description: Platform version where the API reports one (OpenShift version).
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                message:
                  description: >-
                    What happened last, in plain words. Read it when the object is not ready.
                  type: string
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                deletionBlockedBy:
                  type: array
                  items:
                    type: string
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      jobId:
                        description: Run identifier in the automation controller.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: EVPN
          type: boolean
          jsonPath: .status.capabilities.evpn
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
