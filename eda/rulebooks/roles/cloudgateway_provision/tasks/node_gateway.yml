                continue
            try:
                rule = rule or ipaddress.ip_network(w[w.index("to") + 1], strict=False) == block
            except ValueError:
                pass
        if not rule:
            errors.append("no rule to %s lookup main at preference 999" % block)
        l3mdev, local = [], []
        for line in (read(x + ["ip", "-4", "rule", "show"]) or "").splitlines():
            w = line.split()
            if len(w) < 3 or not w[0].endswith(":") or not w[0][:-1].isdigit():
                continue
            if w[-2:] == ["lookup", "[l3mdev-table]"]:
                l3mdev.append(int(w[0][:-1]))
            elif w[-2:] == ["lookup", "local"]:
                local.append(int(w[0][:-1]))
        if not l3mdev:
            # no l3mdev rule: right only in a namespace without a VRF device (the kernel adds the rule with the first
            # one); there exactly one lookup local rule, at 32765 where the apply puts it. VRF devices that cannot be
            # read count as present
            devs = read(x + ["ip", "-br", "link", "show", "type", "vrf"])
            names = sorted(l.split()[0] for l in (devs or "").splitlines() if l.split())
            if devs is None or names:
                errors.append("no IPv4 l3mdev rule (VRF devices: %s)" % (", ".join(names) or "unreadable"))
            elif sorted(local) != [32765]:
                errors.append("the IPv4 rule lookup local is at %s, not at 32765 alone (a namespace without VRF devices)"
                              % (", ".join(str(p) for p in sorted(local)) or "no preference"))
        elif not local or min(local) < min(l3mdev):
            errors.append("the IPv4 rule lookup local is at %s, not after the l3mdev rule at %d (a packet from a VRF reaches "
                          "the default VRF local addresses)" % (", ".join(str(p) for p in sorted(local)) or "no preference",
                                                                min(l3mdev)))
        guard = read(x + ["nft", "list", "table", "inet", "shc_core_guard"])
        if guard is None:
            errors.append("the guard table inet shc_core_guard is not loaded")
        elif not guarded(guard, block, leg):
            errors.append("the guard table inet shc_core_guard has no drop rule for %s from outside %s and lo" % (block, leg))
        # the locator is a prefix of lo, a passive IS-IS interface: its anchor on lo (the first address, the locator
        # length) and the instance own LSP announcing it (that announcement is what a redistributed discard route lost
        # when FRR restarted its daemons). Not zebra: FRR 8.5.3 lists the connected prefix as not selected (distance 255,
        # the blackhole of the apply as its nexthop) while IS-IS announces it, and how it lists it differs between versions
        anchor = "%s/%d" % (loc.network_address + 1, loc.prefixlen)
        if (" %s " % anchor) not in (read(x + ["ip", "-6", "addr", "show", "dev", "lo"]) or ""):
            errors.append("lo does not hold the locator anchor %s" % anchor)
        if not announced(read(vtysh + ["-c", "show isis database detail"]) or "", loc):
            errors.append("the own IS-IS LSP does not announce the locator %s" % loc)
        neg, state = {}, {}
        for f in ("ipv4", "ipv6"):
            neg[f] = {addr(p) for p in show("show bgp %s vpn summary established json" % f).get("peers", {})}
            for p, v in show("show bgp %s vpn summary json" % f).get("peers", {}).items():
                if v.get("state") == "Established" or addr(p) not in state:
                    state[addr(p)] = v.get("state", "")
        if not want:
            ranges = []
            for line in (read(vtysh + ["-c", "show running-config"]) or "").splitlines():
                w = line.split()
                if w[:3] == ["bgp", "listen", "range"] and w[4:] == ["peer-group", "PE"]:
                    try:
                        ranges.append(ipaddress.ip_network(w[3], strict=False))
                    except ValueError:
                        pass
            if pool6 not in ranges:
                errors.append("the PE group does not listen on %s" % pool6)
        up = {p for p, s in state.items() if p and s == "Established"} | neg["ipv4"] | neg["ipv6"]
        peers = want or sorted(p for p in up if p and ipaddress.ip_address(p) in pool6)
        isis6 = show("show ipv6 route isis json")
        base = int(loc.network_address) - ((int(own6) - int(pool6.network_address)) << 80)
        pending = []
        for p in peers:
            missing = []
            for f, fam in (("ipv4", "VPNv4"), ("ipv6", "VPNv6")):
                if p not in neg[f]:
                    s = state.get(p, "")
                    missing.append("%s %s: %s" % (fam, p, "NoNeg" if s == "Established" else (s or "NotActivated")))
            i = int(ipaddress.ip_address(p)) - int(pool6.network_address)
            need = [p + "/128"]
            if 1 <= i <= 255:
                need.append(str(ipaddress.ip_network((base + (i << 80), 48))))
            else:
                missing.append("%s is no provider-edge loopback of %s" % (p, pool6))
            for pfx in need:
                if not any(r.get("protocol") == "isis" and r.get("selected") and r.get("installed")
                           for r in isis6.get(pfx, [])):
                    missing.append("%s of %s is not an installed IS-IS route" % (pfx, p))
            if missing and not want:
                pending.append(p)
                missing = ["peer not ready on the SRv6 core: " + m for m in missing]
                for m in missing:
                    print(m, file=sys.stderr)
            else:
                errors += missing
        if want:
            s = state.get(want[0], "")
            result = "Established" if want[0] in neg["ipv6"] else ("NoNeg" if s == "Established" else (s or "NotActivated"))
        else:
            result = ("NoPeers" if not peers else "Established" if not pending
                      else "NoNeg" if len(pending) == len(peers) else "Partial")
        for e in errors:
            print(e, file=sys.stderr)
        print("ipv6Vpn=" + result)
        if not want:
            print("pendingPeers=" + ",".join(pending))
        return 1 if errors else 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' gw-{{ fab_name }} gw-{{ fab_name }} core0 {{ fab_real.core.srv6.block }} {{ cg_pe.loopbackIp6 }} {{ cg_pe.locator }} {{ fab_real.core.loopbackPool6 }} {{ cg_root_pe.loopbackIp6 }}
    {% elif cg_pe.loopback6 | default('') | length > 0 %}
    [ "$(ip netns exec gw-{{ fab_name }} sysctl -n net.ipv6.conf.all.forwarding)" = 1 ]
    python3 -c '
    import ipaddress, json, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def main(argv, run):
        """argv: <vtysh pathspace> <route reflector IPv4 loopback> <its IPv6 loopback>. Prints ipv6Vpn=<state>; exits 1
        while VPNv6 to the route reflector is not negotiated or its IPv6 loopback is not an installed IS-IS route."""
        pathspace, rr, rr6 = argv[0], argv[1], argv[2]
