namespace: sovereign-cloud

clusterDomain: apps.shcstack-3.lab.signal9.gg

image:
  repository: quay.signal9.gg/hybrid-sovereign/sovereign-cloud-dashboard
  tag: "img-2.2.0"
  pullPolicy: Always

imagePullSecrets:
  - name: dashboard-pull-secret

oauthProxy:
  image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
  # cookieSecret and clientSecret must NOT be set here. Use externalSecret below.
  cookieSecret: ""
  clientSecret: ""
  externalSecret:
    enabled: true
    secretStoreName: vault-backend
    secretStoreKind: ClusterSecretStore
    # Vault path must contain keys: client_secret, cookie_secret
    vaultPath: "central/data/dashboard-oauth"
    refreshInterval: "1h"
  # Absolute URL the browser is sent to after "Sign out" (for example the identity
  # provider's end-session endpoint, so the next sign-in asks for credentials again).
  # Empty = back to the sign-in page.
  logoutUrl: ""
  # Access review a user must pass to use this dashboard (oauth-proxy --openshift-sar and
  # --openshift-delegate-urls; the server re-checks it per request). Keys: namespace,
  # resource, resourceAPIGroup, verb (optionally resourceName). Empty = no review (not
  # recommended).
  openshiftSar:
    namespace: sovereign-cloud
    resource: hybridfabrics
    resourceAPIGroup: hybridsovereign.redhat
    verb: list

replicas: 1

route:
  enabled: true
  host: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

env:
  NODE_ENV: production
  # Base URL of the documentation for the Help menu (empty = "not configured").
  SHC_HELP_BASE_URL: ""
  # OpenShift console URL shown to users (empty = not shown).
  SHC_CONSOLE_URL: ""
