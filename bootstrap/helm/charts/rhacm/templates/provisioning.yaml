{{- if .Values.provisioning.enabled }}
---
# metal3 provisioning network for bare-metal builds from this hub (LAB-PLAN §4). The installer creates
# provisioning-configuration on platform: baremetal; this server-side-applies the managed network onto
# it. Delete=false: removing the Application must never delete metal3's configuration.
apiVersion: metal3.io/v1alpha1
kind: Provisioning
metadata:
  name: provisioning-configuration
  labels:
    {{- include "rhacm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
spec:
  provisioningNetwork: {{ .Values.provisioning.network | quote }}
  {{- if ne .Values.provisioning.network "Disabled" }}
  provisioningIP: {{ .Values.provisioning.ip | quote }}
  provisioningNetworkCIDR: {{ .Values.provisioning.networkCIDR | quote }}
  {{- with .Values.provisioning.dhcpRange }}
  provisioningDHCPRange: {{ . | quote }}
  {{- end }}
  {{- with .Values.provisioning.macAddresses }}
  provisioningMacAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.provisioning.interface }}
  provisioningInterface: {{ . | quote }}
  {{- end }}
  {{- end }}
  watchAllNamespaces: {{ .Values.provisioning.watchAllNamespaces }}
{{- end }}
