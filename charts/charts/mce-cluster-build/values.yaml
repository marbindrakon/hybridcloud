cluster:
  # Name of the ClusterDeployment, its namespace and the ManagedCluster.
  name: ocp
  # The OpenShift cluster name (install-config metadata.name, DNS <clusterName>.<baseDomain>); default: name.
  clusterName: ""
  baseDomain: ""
  importToHub: true
  createGitopsManifestWorks: false
  createGitopsSyncSet: false
  useACM: true
  type: ocp
  clusterImageSet: img4.21.9-x86-64-appsub
  releaseImage: null
  controlPlaneCount: 3
  workerCount: 2
  infraCount: 0
  apiVIP: ""
  ingressVIP: ""
  # Dual-stack Agent clusters: one API and one ingress VIP per address family (IPv4 first), rendered as
  # apiVIPs/ingressVIPs in place of the single VIPs above when the lists are not empty.
  apiVIPs: []
  ingressVIPs: []
  # Vault paths (relative to ClusterSecretStore backend — vault-backend)
  # Vault path (property pullSecretVaultProperty, default pull_secret) for <cluster>-pull-secret
  pullSecretVault: ""
  pullSecretVaultProperty: pull_secret
  sshKeyVault: ""
  trustedCAs: ""
  sshPubKey: ""
  dnsServers: []
  # Install-time manifests (file name -> object or YAML string) in a ConfigMap, for Hive or the
  # Agent provider's AgentClusterInstall (ignored when provider.aws.extraManifestsSecret is set).
  extraManifests: {}

provider:
  # Vault path for provider credentials ExternalSecret
  providerCredsVault: ""
  providerCAs: ""
  # Can be AWS, GCP, OpenStack, Agent, or vSphere
  type: AWS
  aws:
    region: us-east-1
    controllerFlavor: m5.xlarge
    workerFlavor: m5.large
    # credentialsMode: Mint — uses direct access key in providerCredsVault secret
    # credentialsMode: Manual — uses STS assumeRole (requires ccoctl setup)
    credentialsMode: Mint
    publishMode: External
    # Keys used to map Vault secret fields to Hive-expected secret keys.
    # Override if your Vault secret uses different key names.
    credentialsKeyAccessKeyId: aws_access_key_id
    credentialsKeySecretAccessKey: aws_secret_access_key
    assumeRole:
      roleARN: ""
      externalID: ""
    serviceAccountSignerSecret: ""
    extraManifestsSecret: ""
  # GCP (Manual credentials with workload identity federation): the provider credentials secret holds an
  # external-account credential configuration (no key); signer and manifests as for AWS STS
  gcp:
    region: us-east4
    controllerFlavor: n2-standard-4
    workerFlavor: n2-standard-4
    serviceAccountSignerSecret: ""
    extraManifestsSecret: ""
  vsphere:
    datacenter: ""
    cluster: ""
    defaultDatastore: ""
    network: ""
    folder: null
    vcenterHost: ""
  openstack:
    existingImage: null
    externalNetwork: ""
    computeAZs: []
    volumeAZs: []
    rootVolumeSize: null
    rootVolumeTypes: []
    controlPlaneFlavor: m1.xlarge
    workerFlavor: m1.large
  agent:
    infraEnvType: shared
    infraEnvSettings:
      networkType: static
      hostNetworkConfigs: {}
      ntpServers: []
    sharedInfraEnv:
      namespace: metal-infra-env
      name: metal-infra-env
    # AgentClusterInstall platformType (BareMetal, None, ...); with useExternalLB false the cluster
    # runs its own keepalived VIPs (cluster.apiVIP/ingressVIP) in machineCIDR.
    platformType: null
    useExternalLB: true
    machineCIDR: ""
    # Per-family cluster networking (optional). Left empty, the AgentClusterInstall gets the defaults:
    # cluster network 10.128.0.0/14 (hostPrefix 23), service network 172.30.0.0/16, machineCIDR as the machine
    # network. Set the three lists to build a dual-stack cluster (IPv4 entries first; a list left out keeps its
    # default). A single-stack cluster converted to dual-stack later is not reflected here.
    networking: {}
    # networking:
    #   clusterNetwork:
    #     - {cidr: 10.128.0.0/14, hostPrefix: 23}
    #     - {cidr: "fd01::/48", hostPrefix: 64}
    #   serviceNetwork: [172.30.0.0/16, "fd02::/112"]
    #   machineNetwork:
    #     - {cidr: 198.51.100.0/24}
    #     - {cidr: "2001:db8:1:238::/64"}

# ClusterSecretStore name (sovereign cloud uses vault-backend, not vault)
secretStoreName: vault-backend
