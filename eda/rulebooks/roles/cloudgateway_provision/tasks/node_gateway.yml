  ansible.builtin.include_tasks: "{{ role_path }}/../hybridfabric_provision/tasks/core_guard_unit.yml"
  vars:
    cgu_instance: "gw-{{ fab_name }}"
  when: fab_node_transport | default('mpls') == 'srv6'

- name: "{{ bgw_node.name }}: renew the lease before the wait for the core"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_ledger.yml"
