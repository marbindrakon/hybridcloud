{{- if and .Values.rgw.enabled .Values.crunchy.enabled (not .Values.registry.components.postgres.managed) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.registry.name }}-rgw
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.rgw.credentials.secretStoreName }}
  target:
    name: {{ .Values.registry.name }}-rgw
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: {{ required "rgw.credentials.vaultKey is required" .Values.rgw.credentials.vaultKey }}
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: {{ .Values.rgw.credentials.vaultKey }}
        property: secret_key
{{- end }}
