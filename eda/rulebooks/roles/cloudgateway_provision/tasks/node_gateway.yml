# FRR 8.5: a VRF deleted and created again under the same name (a placement's VNI used again) can keep zebra's old binding of
# its VPN label: bgpd exports the label, but zebra never installs it into the kernel, so traffic from the core for the
# VRF is dropped. Every VRF must have an MPLS route into it; a VRF without one gets its label bound again (label vpn
# export off and on, so the running configuration ends unchanged). Per address family: each family of a VRF has its
# own label (`show bgp ipv4|ipv6 vpn json detail`; the VRF table JSON has no label): the gateway's own VPN table shows
# it on paths leaked from the VRF (nhVrfName, remoteLabel) except for routes that came from EVPN, i.e. the site's,
# so the label is also read where the core sees it, on the route reflector (the root FRR of this node: the paths
# from this gateway's loopback under the VRF's RD). Only the family whose label has no route is bound again, under
# that family; a family with no exported route yet needs one more MPLS route into the VRF. A VRF without the IPv6
# family is checked as before (any MPLS route into it, IPv4 bound again). Only on the MPLS core (fab_node_transport
# mpls); the SRv6 core checks its SIDs instead (below). Same check code as the root's
# (python3 -c '<code>' <pathspace> <netns> <loopback> <vrf>:<families>:<rd> ...). The families are the ones the
# FRR configuration carries (frr-gateway.conf.j2: IPv6 only with the IPv6 core), so a check never binds a label under
# an address family the file does not have; a VRF that carries none (IPv6 only, IPv4-only core) has no label.
# The check tells two cases apart in what it reports: the label is not seen in the kernel at all (zebra has not
# installed it yet, or kept the old binding and never will), or the kernel routes it into another device (a stale
# route left from an earlier owner of the label). Both wait the settle time first (a reload moves labels between
# VRFs for a moment), both are bound again when they remain.
- name: "{{ bgw_node.name }}: every VRF's VPN label leads into it"
  ansible.builtin.shell: |
    {% set _vrfs = [] %}
    {% set _rendered = [4] + ([6] if cg_pe.loopback6 | default('') | length > 0 else []) %}
    {% for v in cg_vrfs %}
    {% set _fams = v.families | default([4], true) | map('int') | select('in', _rendered) | list %}
    {% if _fams %}
    {% set _ = _vrfs.append(v.vrf ~ ':' ~ (_fams | join(',')) ~ ':'
       ~ ((cg_fabric.spec.domainAsn ~ ':' ~ v.vni) if cg_fabric.spec.domainAsn | int <= 65535
          else (cg_pe.loopbackIp ~ ':' ~ (v.vni | int % 65536)))) %}
    {% endif %}
    {% endfor %}
    bad() {
    python3 -c '
    import json, re, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def kernel(text):
        """The MPLS table (ip -f mpls route): every device a line names, and per device the labels routed into it."""
        devs, into = set(), {}
        for line in text.splitlines():
            names = re.findall(r" dev (\S+)", line)
            devs.update(names)
            m = re.match(r"(\d+) ", line)
            if m:
                for d in names:
                    into.setdefault(d, set()).add(int(m.group(1)))
        return devs, into


    def paths(o):
        """Every path object (a dict with remoteLabel) below o."""
        if isinstance(o, dict):
            if "remoteLabel" in o:
                yield o
            for x in o.values():
                yield from paths(x)
        elif isinstance(o, list):
            for x in o:
                yield from paths(x)


    def own_labels(text):
        """VRF -> labels, from the own VPN table (show bgp ipv4|ipv6 vpn json detail): a path leaked from a VRF names it
        in nhVrfName and carries its label vpn export as remoteLabel. FRR 8.5 prints no remoteLabel on a path whose
        origin is an EVPN route (a gateway site route): those labels come from the route reflector."""
        found = {}
        for p in paths(json.loads(text or "{}")):
            if "nhVrfName" in p:
                found.setdefault(str(p["nhVrfName"]), set()).add(int(p["remoteLabel"]))
        return found


    def peer_labels(text, peer):
        """RD -> labels of the paths the route reflector holds from peer (its VPN table, json detail: routes,
        routeDistinguishers, <rd>, <prefix>, paths with peer.peerId and remoteLabel)."""
        found = {}
        rds = json.loads(text or "{}").get("routes", {}).get("routeDistinguishers", {})
        for rd, sub in rds.items():
            for p in paths(sub):
                if str((p.get("peer") or {}).get("peerId", "")) == peer:
                    found.setdefault(rd, set()).add(int(p["remoteLabel"]))
        return found


    def main(argv, run):
        """argv: <vtysh pathspace or ""> <netns or ""> <own loopback, the peer address the route reflector sees, or ""> then
        <vrf>:<families>[:<rd>] per VRF. Prints "<vrf> <family> <case>" per address family whose label has no MPLS
        route into the VRF: unseen = the kernel routes the label nowhere, stale = it routes it into another device."""
        pathspace, netns, peer = argv[0], argv[1], argv[2]
        vrfs = []
        for spec in argv[3:]:
            name, fams, rd = (spec.split(":", 2) + ["", ""])[:3]
            vrfs.append((name, sorted({int(f) for f in (fams or "4").split(",") if f}), rd))
        if not vrfs:
            return 0
        ip = ["ip"] + (["-n", netns] if netns else [])
        vtysh = ["vtysh"] + (["-N", pathspace] if pathspace else [])
        devs, into = kernel(run(ip + ["-f", "mpls", "route"]))
        routed = set().union(*into.values()) if into else set()
        own, rr = {}, {}
        if any(6 in f for _, f, _ in vrfs):
            for fam in (4, 6):
                show = "show bgp ipv%d vpn json detail" % fam
                own[fam] = own_labels(run(vtysh + ["-c", show]))
                rr[fam] = {}
                if peer and pathspace:
                    # the route reflector (the root FRR on this node): unreadable means unseen, not an error
                    try:
                        rr[fam] = peer_labels(run(["vtysh", "-c", show]), peer)
                    except (OSError, ValueError, subprocess.CalledProcessError):
                        pass
        for name, fams, rd in vrfs:
            if 6 not in fams:
                # IPv4 only: any MPLS route into the VRF (unchanged)
                if name not in devs:
                    print(name, 4, "unseen")
                continue
            have = into.get(name, set())
            known = {}
            for f in fams:
                labels = own[f].get(name, set()) | rr[f].get(rd, set())
                if labels:
                    known[f] = labels
            for f in sorted(known):
                missing = known[f] - have
                if missing:
                    print(name, f, "stale" if missing & routed else "unseen")
            # a family that exports no route yet shows no label: it needs a route into the VRF that the other family
            # label does not account for (each family has its own label)
            unseen = [f for f in fams if f not in known]
            claimed = set().union(*known.values()) if known else set()
            if unseen and len(have - claimed) < len(unseen):
                for f in unseen:
                    print(name, f, "unseen")
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' gw-{{ fab_name }} gw-{{ fab_name }} {{ cg_pe.loopbackIp }} {{ _vrfs | join(' ') }}
    }
    # the families still without their MPLS route after up to <tries> checks 5 s apart (in $b)
    settle() {
      for i in $(seq "$1"); do b=$(bad) || return 1; [ -z "$b" ] && return 0; sleep 5; done
      b=$(bad)
    }
    settle 3 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
    # what each case means, for the job output (<vrf> <family> <unseen|stale>, then "" or " even after binding it again")
    why() {
      case "$3" in
        stale) echo "VRF $1: the kernel routes its IPv$2 VPN label into another device (stale)$4" >&2 ;;
        *) echo "VRF $1: its IPv$2 VPN label is not seen in the kernel (no MPLS route into the VRF)$4" >&2 ;;
      esac
    }
    rebound=""
    if [ -n "$b" ]; then
      while read -r v f c; do
        why "$v" "$f" "$c" "; binding it again"
        vtysh -N gw-{{ fab_name }} -c 'configure terminal' -c "router bgp {{ cg_fabric.spec.domainAsn }} vrf $v" -c "address-family ipv$f unicast" \
          -c 'no label vpn export auto' -c 'label vpn export auto' -c 'end' >/dev/null
        rebound="$rebound $v/ipv$f"
      done <<< "$b"
      settle 6 || { echo "the VPN label check could not read FRR or the MPLS table" >&2; exit 1; }
      if [ -n "$b" ]; then
        while read -r v f c; do why "$v" "$f" "$c" ", even after binding it again"; done <<< "$b"
        exit 1
      fi
    fi
    echo "rebound=$rebound"
  args:
    executable: /bin/bash
  register: _cg_labels
  changed_when: _cg_labels.stdout is search('rebound=.')
  when: fab_node_transport | default('mpls') == 'mpls'
  delegate_to: "{{ bgw_node.name }}"

# The SRv6 core has no labels to bind: every VRF must have its SID in the namespace's kernel, an End.DT46 route from
# the gateway's locator on this node into the VRF's table (the VNI; one SID per VRF carries both families). The VRFs
# that must have one are those whose BGP instance in the rendered configuration (frr.conf.shc) holds the per-VRF SID
# line (as on the root: FRR allocates a SID only for a VRF that exports to the VPN; every tenant VRF exports). A VRF
# still without one after the settle time fails the job and is named (no repair is known: a VRF created again under
# the same name got its SID back by itself in every test). Same check code as the root's.
- name: "{{ bgw_node.name }}: every VRF's SID leads into it"
  ansible.builtin.shell: |
    {% set _vrfs = [] %}
    {% for v in cg_vrfs %}
    {% set _ = _vrfs.append(v.vrf ~ ':' ~ v.vni) %}
    {% endfor %}
    bad() {
    python3 -c '
    import ipaddress, re, subprocess, sys


    def run(cmd):
        return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout


    def sids(text):
        """The SID routes of the kernel (ip -6 route show table all): per VRF table the SIDs routed into it by an End.DT46
        route (encap seg6local action End.DT46 vrftable <table>)."""
        found = {}
        for line in text.splitlines():
            m = re.search(r" encap seg6local action End\.DT46 vrftable (\d+)( |$)", line)
            if m:
                found.setdefault(int(m.group(1)), []).append(line.split()[0].split("/")[0])
        return found


    def exported(text):
        """The VRFs whose BGP instance in the rendered FRR configuration has a per-VRF SID: a "router bgp <as> vrf <name>"
        block (to the next line that is not indented) holding "sid vpn per-vrf export auto". FRR allocates the SID only
        for a VRF that exports to the VPN, and the template writes the line only there."""
        out, vrf = set(), None
        for line in text.splitlines():
            w = line.split()
            if line.startswith("router bgp ") and len(w) == 5 and w[3] == "vrf":
                vrf = w[4]
            elif not line.startswith(" "):
                vrf = None
            elif vrf and line.strip() == "sid vpn per-vrf export auto":
                out.add(vrf)
        return out


    def main(argv, run):
        """argv: <netns or ""> <own locator> <rendered FRR configuration> then <vrf>:<table> per VRF. Prints "<vrf>
        <table>" per VRF with a per-VRF SID in the configuration that the kernel has no End.DT46 SID route into whose SID
        is in the own locator; a VRF without one in the configuration exports nothing and is not checked."""
        netns, loc = argv[0], ipaddress.ip_network(argv[1])
        want = exported(run(["cat", argv[2]]))
        ip = ["ip"] + (["-n", netns] if netns else [])
        have = sids(run(ip + ["-6", "route", "show", "table", "all"]))
        for spec in argv[3:]:
            name, table = spec.rsplit(":", 1)
            if name not in want:
                continue
            mine = []
            for s in have.get(int(table), []):
                try:
                    mine.append(ipaddress.ip_address(s) in loc)
                except ValueError:
                    pass
            if not any(mine):
                print(name, table)
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:], run))
    ' gw-{{ fab_name }} {{ cg_pe.locator }} /etc/frr/gw-{{ fab_name }}/frr.conf.shc {{ _vrfs | join(' ') }}
    }
    # the VRFs still without their SID route after up to <tries> checks 5 s apart (in $b)
    settle() {
      for i in $(seq "$1"); do b=$(bad) || return 1; [ -z "$b" ] && return 0; sleep 5; done
      b=$(bad)
    }
    settle 9 || { echo "the SID check could not read the kernel's routes" >&2; exit 1; }
    if [ -n "$b" ]; then
      while read -r v t; do
        echo "VRF $v: no SRv6 SID in the kernel (no End.DT46 route from locator {{ cg_pe.locator }} into its table $t)" >&2
      done <<< "$b"
      exit 1
    fi
    echo "sids=ok"
  args:
    executable: /bin/bash
  register: _cg_sids
  changed_when: false
  when: fab_node_transport == 'srv6'
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: read the gateway's sessions"
  ansible.builtin.shell: |
    vtysh -N gw-{{ fab_name }} -c 'show bgp l2vpn evpn summary json' 2>/dev/null | python3 -c '
    import ipaddress, json, sys
    d = json.load(sys.stdin); net = ipaddress.ip_network(sys.argv[1], strict=False)
    up = [p for p, v in d.get("peers", {}).items() if v.get("state") == "Established"]
    print(json.dumps({"site": sum(1 for p in up if ipaddress.ip_address(p) in net),
                      "upstream": sum(1 for p in up if ipaddress.ip_address(p) not in net)}))' {{ fab_spec.siteUnderlay.cidr }}
  register: _cg_sessions
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

# transport wireguard: the node's public key and each peer's last handshake (never the private key: no `wg show dump`)
- name: "{{ bgw_node.name }}: read the tunnel"
  ansible.builtin.shell: |
    D={{ cg_instance.wireguard.device }}; X="ip netns exec gw-{{ fab_name }}"
    python3 - "$($X wg show $D public-key)" "$($X wg show $D listen-port)" <<EOF
    import json, subprocess, sys, time
    def show(what):
        out = subprocess.run(["ip", "netns", "exec", "gw-{{ fab_name }}", "wg", "show", "$D", what],
                             capture_output=True, text=True).stdout.split("\n")
        return dict(l.split("\t", 1) for l in out if "\t" in l)
    hs, ep = show("latest-handshakes"), show("endpoints")
    now = int(time.time())
    peers = [{"publicKey": k, "endpoint": ep.get(k, "(none)"), "latestHandshake": int(v),
              "up": int(v) > 0 and now - int(v) < 180} for k, v in sorted(hs.items())]
    print(json.dumps({"publicKey": sys.argv[1], "listenPort": int(sys.argv[2]), "peers": peers}))
    EOF
  args:
    executable: /bin/bash
  register: _cg_tunnel
  changed_when: false
  when: cg_instance.wireguard is defined
  delegate_to: "{{ bgw_node.name }}"

# "<vrf> <family> <routes>" per VRF: IPv4, and IPv6 too with the IPv6 core
- name: "{{ bgw_node.name }}: read the VRFs' routes"
  ansible.builtin.shell: |
    for v in {{ cg_vrfs | map(attribute='vrf') | join(' ') }}; do
      for f in 4{{ ' 6' if cg_pe.loopback6 | default('') | length > 0 else '' }}; do
        printf '%s %s ' "$v" "$f"; vtysh -N gw-{{ fab_name }} -c "show bgp vrf $v ipv$f unicast json" 2>/dev/null \
          | python3 -c 'import json, sys; print(len(json.load(sys.stdin).get("routes", {})))' 2>/dev/null || echo 0
      done
    done
  register: _cg_vrf_routes
  changed_when: false
  delegate_to: "{{ bgw_node.name }}"

- name: "{{ bgw_node.name }}: record the node"
  vars:
    _s: "{{ _cg_sessions.stdout | from_json }}"
    _tun: "{{ (_cg_tunnel.stdout | from_json) if (_cg_tunnel.stdout | default('', true) | length > 0) else {} }}"
    # a tunnel is up while at least one peer handshook within the last 3 minutes
    _tun_state: "{{ ('up' if _tun.peers | default([]) | selectattr('up') | list | length > 0 else 'down') if _tun | length > 0 else '' }}"
    _v6: "{{ cg_pe.loopback6 | default('') | length > 0 }}"
    _srv6: "{{ fab_node_transport | default('mpls') == 'srv6' }}"
    # IPv4 only: {"<vrf>": n}; with the IPv6 core: {"<vrf>": {"4": n, "6": m}}
    _vr: >-
      {%- set out = {} -%}
      {%- for l in _cg_vrf_routes.stdout_lines | default([]) if l.split() | length == 3 -%}
        {%- set w = l.split() -%}
        {%- if _v6 | bool -%}
          {%- set _ = out.update({w[0]: (out[w[0]] | default({})) | combine({w[1]: w[2] | int})}) -%}
        {%- elif w[1] == '4' -%}
          {%- set _ = out.update({w[0]: w[2] | int}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _ipv6vpn: >-
      {{ ((_cg_verify.stdout_lines | default([]) | select('match', '^ipv6Vpn=') | list | last | default('='))
          .split('=', 1) | last) if _v6 | bool else '' }}
  ansible.builtin.set_fact:
    cg_node_results: >-
      {{ cg_node_results + [{
           'name': bgw_node.name, 'address': cg_node_addr, 'ready': true,
           'siteSessions': _s.site | int, 'upstreamSessions': _s.upstream | int, 'coreSessions': 1,
           'vrfs': cg_vrfs | length, 'vrfRoutes': _vr, 'ipv6Vpn': _ipv6vpn | trim,
           'message': 'gateway instance gw-' ~ fab_name ~ ': VPNv4' ~ (' and VPNv6' if _v6 | bool else '') ~ ' to '
                      ~ (('route reflector ' ~ cg_root_pe.loopbackIp6 ~ ', SRv6 locator ' ~ cg_pe.locator) if _srv6 | bool
                         else (cg_root_pe.loopbackIp ~ ', IS-IS SR SID ' ~ cg_pe.sid))
                      ~ ', loopback ' ~ cg_pe.loopbackIp
                      ~ ((' ' ~ cg_pe.loopbackIp6 | default('')) if _v6 | bool else '')
                      ~ ((', tunnel ' ~ _tun_state) if _tun | length > 0 else ''),
           'lastAppliedAt': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')}
           | combine({'tunnel': _tun_state} if _tun | length > 0 else {})
           | combine({'transport': 'srv6', 'locator': cg_pe.locator} if _srv6 | bool else {})] }}
    cg_wg_nodes: >-
      {{ (cg_wg_nodes | default([])) + ([_tun | combine({'name': bgw_node.name})] if _tun | length > 0 else []) }}
    cg_changed_nodes: >-
      {{ cg_changed_nodes + ([bgw_node.name] if [_cg_files, _cg_conf, _cg_apply, _cg_daemons, _cg_frrconf, _cg_state,
                                                 _cg_vrfs_gone | default({}),
                                                 _cgu_files | default({}), _cgu_timer | default({})]
         | select('changed') | list | length > 0 else []) }}
