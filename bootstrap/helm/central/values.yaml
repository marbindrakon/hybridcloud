          value: "central-vault"
        - name: VAULT_SECRET_PATH
          value: "central/quay-central-admin"
        - name: KEYCLOAK_URL
          value: "https://rhbk-central.apps.central.shc.signal9.gg"
        - name: KEYCLOAK_REALM
          value: "sovereign-central"
        - name: KEYCLOAK_CLIENT_ID
          value: "quay-central"
        - name: KEYCLOAK_ADMIN_SECRET
          value: "rhbk-central-admin-quay"
        - name: KEYCLOAK_ADMIN_SECRET_NS
          value: "sovereign-cloud-jobs"

    # ─── Quay Services Config: init admin + store in Vault + configure OIDC ─────
    quayServicesConfig:
      enabled: true  # shc: P4 (services cluster) enabled
      playbook: quay-config.yml
      activeDeadlineSeconds: 1200
      syncWave: "37"
      externalSecrets:
        rhbkServicesAdminQuay:
          enabled: true
          targetSecretName: rhbk-services-admin-quay
          data:
            - secretKey: username
              remoteKey: rhbk-services-admin
              property: username
            - secretKey: password
              remoteKey: rhbk-services-admin
              property: password
      env:
        - name: QUAY_URL
