        - name: REALM_NAME
          value: "sovereign-tenants"
        - name: ADMIN_GROUP
          value: "sovereign-admin"
        - name: EXTRA_GROUPS
          value: '[{"name":"acme-corp-platform-engineering-admins"},{"name":"acme-corp-platform-engineering-editors"},{"name":"acme-corp-platform-engineering-viewers"},{"name":"acme-corp-platform-ops-admins"},{"name":"acme-corp-platform-ops-editors"},{"name":"acme-corp-platform-ops-viewers"},{"name":"acme-corp-assignment-admins"},{"name":"acme-corp-developers"},{"name":"acme-corp-platform-viewers"},{"name":"acme-corp-devops"}]'
    # shc (design/P7-PLAN.md §12.20): openshift-services' entity-groups mapper puts the user's roles of that client into
    # the groups claim; the Entity job gives each Rbac CR's Keycloak group the client role <entity>.<rbac> and binds that
    # group in the entity namespace (Keycloak group paths contain "/", which OpenShift group names can't).
    keycloakServicesClients:
      enabled: true  # shc: P4 (services cluster) enabled
      playbook: keycloak-clients.yml
      activeDeadlineSeconds: 600
      syncWave: "30"
      env:
        # shc: own Vault entry; central's job owns "keycloak-clients"
        - name: VAULT_CLIENTS_KEY
          value: "keycloak-clients-services"
        - name: KEYCLOAK_URL
          value: "https://rhbk-services.apps.services.shc.signal9.gg"
        - name: KEYCLOAK_ADMIN_SECRET
          value: "rhbk-services-admin"
        - name: KEYCLOAK_ADMIN_SECRET_NS
          value: "sovereign-cloud-jobs"
        - name: REALM_NAME
          value: "sovereign-tenants"
        - name: KEYCLOAK_CLIENTS
          value: '[{"realm":"sovereign-tenants","client_id":"openshift-services","name":"OpenShift Services","redirect_uris":["*"],"protocol_mappers":[{"name":"entity-groups","protocol":"openid-connect","protocolMapper":"oidc-usermodel-client-role-mapper","config":{"usermodel.clientRoleMapping.clientId":"openshift-services","claim.name":"groups","multivalued":"true","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}]},{"realm":"sovereign-tenants","client_id":"quay-services","name":"Quay Services","redirect_uris":["*"]},{"realm":"sovereign-tenants","client_id":"aap","name":"Ansible Automation Platform","redirect_uris":["*"]},{"realm":"sovereign-tenants","client_id":"acs","name":"Advanced Cluster Security","redirect_uris":["*"]}]'
        - name: SECRETS_NAMESPACE
          value: "sovereign-cloud-jobs"
    # shc (P7.3.7, design/P7-PLAN.md §12.4 e / §12.15; owner 10-14: IdP changes allowed): tenant sign-in on the IaaS
    # clusters. One client per cluster in the tenant realm; its secret also goes to central Vault
    # clusters/<cluster>/tenant-oidc (the cluster's ESO policy covers clusters/<cluster>/*). The site-groups mapper puts
    # the user's roles of that client into the groups claim: the CloudVirt jobs give an Rbac CR's Keycloak group the
    # client role <entity>.<rbac>, so OpenShift sees entity-qualified group names (full group paths contain "/").
    keycloakIaasClients:
      enabled: true
      playbook: keycloak-clients.yml
      activeDeadlineSeconds: 600
      syncWave: "30"
      env:
        - name: VAULT_CLIENTS_KEY
          value: "keycloak-clients-iaas"
        - name: KEYCLOAK_URL
          value: "https://rhbk-services.apps.services.shc.signal9.gg"
        - name: KEYCLOAK_ADMIN_SECRET
          value: "rhbk-services-admin"
        - name: KEYCLOAK_ADMIN_SECRET_NS
          value: "sovereign-cloud-jobs"
        - name: REALM_NAME
          value: "sovereign-tenants"
        - name: KEYCLOAK_CLIENTS
          value: '[{"realm":"sovereign-tenants","client_id":"openshift-iaas1","name":"OpenShift iaas1","redirect_uris":["https://oauth-openshift.apps.iaas1.shc.signal9.gg/oauth2callback/sovereign-tenants"],"vault_key":"clusters/iaas1/tenant-oidc","protocol_mappers":[{"name":"site-groups","protocol":"openid-connect","protocolMapper":"oidc-usermodel-client-role-mapper","config":{"usermodel.clientRoleMapping.clientId":"openshift-iaas1","claim.name":"groups","multivalued":"true","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}]},{"realm":"sovereign-tenants","client_id":"openshift-edge1","name":"OpenShift edge1","redirect_uris":["https://oauth-openshift.apps.edge1.shc.signal9.gg/oauth2callback/sovereign-tenants"],"vault_key":"clusters/edge1/tenant-oidc","protocol_mappers":[{"name":"site-groups","protocol":"openid-connect","protocolMapper":"oidc-usermodel-client-role-mapper","config":{"usermodel.clientRoleMapping.clientId":"openshift-edge1","claim.name":"groups","multivalued":"true","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}]}]'
        - name: SECRETS_NAMESPACE
          value: "sovereign-cloud-jobs"
    vaultServicesInit:
      enabled: false  # shc: off: superseded by the in-cluster vault-services-init app (this external-route job assumes Shamir keys)
      playbook: vault-services-init.yml
