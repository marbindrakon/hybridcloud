---
- block:
    - name: Set Entity CR facts
      ansible.builtin.set_fact:
        entity_metadata: "{{ _hybridsovereign_redhat_entity.metadata }}"
        entity_spec: "{{ _hybridsovereign_redhat_entity.spec | default({}) }}"
        entity_generation: "{{ _hybridsovereign_redhat_entity.metadata.generation | default(0) | int }}"
        entity_observed_generation: "{{ _hybridsovereign_redhat_entity.status.observedGeneration | default(0) | int }}"
        entity_status: "{{ _hybridsovereign_redhat_entity.status.status | default('') }}"
        entity_ready: "{{ _hybridsovereign_redhat_entity.status.ready | default(false) | bool }}"

    - name: Read the Retry-now request
      ansible.builtin.include_role:
        name: _common
        tasks_from: reconcile_request
      vars:
        reconcile_request_cr: "{{ _hybridsovereign_redhat_entity }}"

    - name: Validate Entity spec prerequisites
      ansible.builtin.assert:
        that:
          - entity_spec.description is defined
          - entity_spec.description | length > 0
          - entity_spec.billingID is defined
          - entity_spec.billingID | length > 0
        fail_msg: Entity spec requires non-empty description and billingID.

    - name: Set event action and reason
      ansible.builtin.set_fact:
        entity_event_action: "{{ 'Reconcile' if reconcile_now | bool else 'Create' }}"
        entity_event_reason: "{{ 'EntityReconcileRequested' if reconcile_now | bool else 'EntityCreateRequested' }}"
        entity_skip_reconcile: >-
          {{
            (not (reconcile_now | bool))
            and (entity_observed_generation >= entity_generation)
            and (entity_status == 'ready')
            and (entity_ready | bool)
          }}
        # a new Entity (no phase, never handled, not ready): the rule of _common/tasks/mark_phase.yml
        entity_is_new: >-
          {%- set st = _hybridsovereign_redhat_entity.status | default({}, true) -%}
          {{ (st.phase | default('', true)) == '' and (st.observedGeneration | default(0, true) | int) == 0
             and not (st.ready | default(false, true) | bool) and not (st.realized | default(false, true) | bool) }}

    # The first status write of a new Entity says Creating, before the namespace operator deployment below (it
    # takes a while), as the tenant kinds do from their first write on. Edits and re-runs keep the stored phase.
    - name: Record phase Creating on a new Entity
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          phase: Creating
          phaseSince: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          summary: Being created.
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: entity_is_new | bool

    # shc (LAB-PLAN §11.6): deploy (idempotently) on every reconcile, before the "already processed"
    # skip. Upstream deployed it after publishing; a reconcile interrupted in between (operator
    # restart) left a ready Entity without its namespace operator, never repaired. This also rolls
    # namespace operator image changes out on the primary operator's startup resync.
    - name: Deploy per-entity namespace operator
      ansible.builtin.include_tasks: deploy_namespace_operator.yml

    - name: Skip when already processed
      ansible.builtin.meta: end_host
      when: entity_skip_reconcile | bool

    # shc P7.3.2: no new event while the last one is in flight (operator/roles/_common/tasks/skip_if_event_in_flight.yml)
    - name: Skip while the last event is in flight
      ansible.builtin.include_role:
        name: _common
        tasks_from: skip_if_event_in_flight
      vars:
        in_flight_kind: Entity
        in_flight_force: "{{ reconcile_now | bool }}"

    - name: Get current timestamp
      ansible.builtin.set_fact:
        entity_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # A create or a spec change: Ready=False until the job reports. A re-run of a Ready object (Retry now,
    # a wake from another job, a periodic re-check) keeps ready/conditions as they are until the job
    # reports, and only Reconciling says that a run is queued (reconcile_keeps_ready, reconcile_request.yml).
    - name: Mark Entity as reconciling
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: reconciling
          ready: false
          lastReconciledAt: "{{ entity_status_transition_time }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ entity_status_transition_time }}"
              reason: AwaitingEDA
              message: Awaiting EDA to complete provisioning
      when: not (reconcile_keeps_ready | default(false) | bool)

    - name: Mark Entity as queued for a re-run
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          conditions:
            - type: Reconciling
              status: "True"
              lastTransitionTime: "{{ entity_status_transition_time }}"
              reason: Queued
              message: A re-run is queued.
      when: reconcile_keeps_ready | default(false) | bool

    - name: Build compact Entity event note (K8s Event note field max 1024 chars)
      ansible.builtin.set_fact:
        entity_event_note: >-
          {{
            {
              'billingID': entity_spec.billingID | default(''),
              'description': (entity_spec.description | default('')) | truncate(400, True, '…'),
              'websiteLink': entity_spec.websiteLink | default('')
            } | to_json
          }}

    - name: Publish operator event to AMQ Streams
      ansible.builtin.include_role:
        name: _common
        tasks_from: publish_operator_event
      vars:
        operator_event_reason: "{{ entity_event_reason }}"
        operator_event_action: "{{ entity_event_action }}"
        operator_event_note: "{{ entity_event_note }}"
        # recorded above in this run: the CR as read predates it, so mark_phase does not write it again
        operator_event_phase_recorded: "{{ 'Creating' if (entity_is_new | bool) else '' }}"
        operator_reporting_controller: entity-operator
        operator_event_regarding:
          apiVersion: hybridsovereign.redhat/v1alpha1
          kind: Entity
          name: "{{ ansible_operator_meta.name }}"
          namespace: "{{ ansible_operator_meta.namespace }}"
          uid: "{{ _hybridsovereign_redhat_entity.metadata.uid }}"



  rescue:
    - name: Mark Entity as failed
      operator_sdk.util.k8s_status:
        api_version: hybridsovereign.redhat/v1alpha1
        kind: Entity
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          status: failed
          ready: false
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ entity_failure_reason | default('OperatorFailed') }}"
              message: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('Reconciliation failed')) }}"
      ignore_errors: true

    - name: Re-raise to signal operator failure
      ansible.builtin.fail:
        msg: "Entity {{ ansible_operator_meta.name }} reconciliation failed — see status.message for details"
