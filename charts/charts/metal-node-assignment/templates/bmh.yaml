{{- range .Values.assignments }}
{{- $node := required (printf "assignments: node %s is not in nodes" .node) (get $.Values.nodes .node) }}
{{- if ne .assignmentType "agent-nobmh" }}
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: {{ .node }}
  namespace: {{ .namespace }}
  annotations:
    {{- if and (eq .assignmentType "metal3") $node.provision ($node.provision.protect | default true) }}
    # Deleting a provisioned host deprovisions (and cleans) it: Argo never deletes these.
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false
    {{- else }}
    argocd.argoproj.io/sync-options: ServerSideApply=true
    {{- end }}
    {{- if eq .assignmentType "agent" }}
    inspect.metal3.io: disabled
    {{- with $node.hostname }}
    bmac.agent-install.openshift.io/hostname: {{ . | quote }}
    {{- end }}
    {{- if and $node.fencing $node.fencing.address }}
    bmac.agent-install.openshift.io/fencing-credentials-secret-name: {{ printf "%s-fencing" .node | quote }}
    {{- end }}
    {{- end }}
    {{- with $node.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- if eq .assignmentType "agent" }}
    infraenvs.agent-install.openshift.io: {{ required "assignments[].infraEnvName is required for agent" .infraEnvName }}
    {{- end }}
    {{- with $node.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  automatedCleaningMode: {{ $node.cleaningMode | default "metadata" }}
  bootMode: {{ $node.bootMode | default "legacy" }}
  bootMACAddress: {{ $node.bootMac | quote }}
  {{- if or (eq .assignmentType "metal3") ($node.agentPreprovisioningConfig | default false) }}
  preprovisioningNetworkDataName: {{ .node }}-net-config
  {{- end }}
  {{- if and (eq .assignmentType "metal3") $node.provision }}
  # Plain metal3 provisioning (no assisted-service): write an OS image, cloud-init from the Secrets below.
  online: {{ $node.provision.online | default true }}
  image:
    url: {{ required "provision.image.url" $node.provision.image.url | quote }}
    checksum: {{ required "provision.image.checksum" $node.provision.image.checksum | quote }}
    checksumType: {{ $node.provision.image.checksumType | default "sha256" }}
    format: {{ $node.provision.image.format | default "qcow2" }}
  {{- if $node.provision.userData }}
  userData:
    name: {{ .node }}-user-data
    namespace: {{ .namespace }}
  {{- end }}
  {{- if $node.provision.networkData }}
  networkData:
    name: {{ .node }}-network-data
    namespace: {{ .namespace }}
  {{- end }}
  {{- else if eq .assignmentType "metal3" }}
  online: false
  {{- else }}
  online: true
  {{- end }}
  {{- with $node.rootDeviceHints }}
  rootDeviceHints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  bmc:
    address: {{ $node.bmc.url | quote }}
    credentialsName: {{ .node }}-bmc
    disableCertificateVerification: true
{{- end }}
{{- end }}
