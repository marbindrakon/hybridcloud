{{- if .Values.keycloak.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ .Values.instanceName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- if .Values.keycloak.hostname }}
  hostname:
    hostname: {{ .Values.keycloak.hostname | quote }}
  {{- else }}
  hostname:
    hostname: ""
  {{- end }}
  {{- if not (include "rhbk.ingressEnabled" .) }}
  ingress:
    enabled: false
  {{- end }}
  {{- if .Values.keycloak.db.enabled }}
  db:
    vendor: {{ .Values.keycloak.db.vendor }}
    {{- if .Values.keycloak.db.host }}
    host: {{ .Values.keycloak.db.host | quote }}
    {{- end }}
    {{- if .Values.keycloak.db.database }}
    database: {{ .Values.keycloak.db.database | quote }}
    {{- end }}
    usernameSecret:
      name: {{ .Values.keycloak.db.usernameSecret.name }}
      key: {{ .Values.keycloak.db.usernameSecret.key }}
    passwordSecret:
      name: {{ .Values.keycloak.db.passwordSecret.name }}
      key: {{ .Values.keycloak.db.passwordSecret.key }}
  {{- end }}
  http:
    {{- if .Values.keycloak.tls.enabled }}
    tlsSecret: {{ .Values.keycloak.tls.secretName }}
    {{- else }}
    httpEnabled: true
    {{- end }}
  {{- if not .Values.keycloak.tls.enabled }}
  proxy:
    headers: xforwarded
  {{- end }}
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1Gi
  features:
    enabled:
      - token-exchange
      - admin-fine-grained-authz
  additionalOptions:
    - name: http-enabled
      value: "true"
    - name: hostname-strict
      value: "false"
    {{- if .Values.keycloak.db.enabled }}
    {{- $db := .Values.keycloak.db }}
    {{- /* auto: with the chart's own database the driver accepts only the primary, so a connection opened while the
         primary's service still leads to a server that went read-only is refused, and the pool tries again. */}}
    {{- $props := "auto" }}
    {{- if and (hasKey $db "urlProperties") (not (kindIs "invalid" $db.urlProperties)) }}{{ $props = toString $db.urlProperties }}{{ end }}
    {{- if eq $props "auto" }}
    {{- $props = "" }}
    {{- if and ($db.crunchy).enabled (eq (toString $db.vendor) "postgres") }}{{ $props = "?targetServerType=primary" }}{{ end }}
    {{- end }}
    {{- if $props }}
    {{- if not (or (hasPrefix "?" $props) (hasPrefix "&" $props) (hasPrefix ";" $props)) }}
    {{- fail (printf "keycloak.db.urlProperties must start with the separator the database's JDBC URL expects (? for PostgreSQL), got %q" $props) }}
    {{- end }}
    - name: db-url-properties
      value: {{ $props | quote }}
    {{- end }}
    {{- /* A connection is closed when it is returned after this long and replaced as needed: no connection, however
         it went stale, outlives it. */}}
    {{- $life := "10m" }}
    {{- if and (hasKey $db "poolMaxLifetime") (not (kindIs "invalid" $db.poolMaxLifetime)) }}{{ $life = toString $db.poolMaxLifetime }}{{ end }}
    {{- if $life }}
    {{- $iso := and (regexMatch "^P([0-9]+D)?(T([0-9]+H)?([0-9]+M)?([0-9]+([.][0-9]+)?S)?)?$" $life) (ne $life "P") (not (hasSuffix "T" $life)) }}
    {{- if not (or (regexMatch "^[0-9]+(ms|s|m|h|d)?$" $life) $iso) }}
    {{- fail (printf "keycloak.db.poolMaxLifetime must be a duration such as 10m, 600 (seconds) or PT10M, got %q" $life) }}
    {{- end }}
    - name: db-pool-max-lifetime
      value: {{ $life | quote }}
    {{- end }}
    {{- end }}
    {{- /* The installation's own options, after the chart's. An option the chart sets itself is refused here: it has
         a value of its own (or is fixed by the chart); so are db, db-username, db-password and every option that
         starts with db-url, which the Keycloak resource's own database fields set. Each entry is checked here, with its name, because the operator would take a malformed one
         as an empty or garbled option. */}}
    {{- $reserved := list "http-enabled" "hostname-strict" "db-url-properties" "db-pool-max-lifetime" "db" "db-username" "db-password" }}
    {{- $extra := .Values.keycloak.additionalOptions | default list }}
    {{- if not (kindIs "slice" $extra) }}
    {{- fail "keycloak.additionalOptions must be a list of {name, value} or {name, secret: {name, key}} entries" }}
    {{- end }}
    {{- $seen := dict }}
    {{- range $extra }}
    {{- if not (and (kindIs "map" .) (kindIs "string" .name) .name) }}
    {{- fail "keycloak.additionalOptions: each entry needs a name" }}
    {{- end }}
    {{- $opt := printf "keycloak.additionalOptions[%s]" .name }}
    {{- if hasKey $seen .name }}
    {{- fail (printf "%s: the option is listed twice" $opt) }}
    {{- end }}
    {{- $_ := set $seen .name true }}
    {{- if or (has .name $reserved) (hasPrefix "db-url" .name) }}
    {{- fail (printf "keycloak.additionalOptions: %s is set by the chart; use its own value (keycloak.db.urlProperties, keycloak.db.poolMaxLifetime, the database settings) or leave it" .name) }}
    {{- end }}
    {{- if and (hasKey . "value") (hasKey . "secret") }}
    {{- fail (printf "%s: a value or a secret, not both" $opt) }}
    {{- end }}
    {{- if not (or (hasKey . "value") (hasKey . "secret")) }}
    {{- fail (printf "%s: needs a value or a secret" $opt) }}
    {{- end }}
    - name: {{ .name | quote }}
      {{- if hasKey . "secret" }}
      {{- $sec := .secret }}
      {{- if not (and (kindIs "map" $sec) (kindIs "string" $sec.name) $sec.name (kindIs "string" $sec.key) $sec.key (eq (len $sec) 2)) }}
      {{- fail (printf "%s: secret must be {name, key}, the Secret's name and the key in it" $opt) }}
      {{- end }}
      secret:
        name: {{ $sec.name | quote }}
        key: {{ $sec.key | quote }}
      {{- else }}
      {{- $v := .value }}
      {{- if or (kindIs "invalid" $v) (kindIs "map" $v) (kindIs "slice" $v) }}
      {{- fail (printf "%s: the value must be a text, a whole number or true or false, not %s" $opt (ternary "null" (kindOf $v) (kindIs "invalid" $v))) }}
      {{- end }}
      {{- if and (or (kindIs "float64" $v) (kindIs "int64" $v) (kindIs "int" $v)) (or (gt (float64 $v) 9007199254740992.0) (lt (float64 $v) -9007199254740992.0)) }}
      {{- fail (printf "%s: a number above 2^53 is not exact; write it as a text" $opt) }}
      {{- end }}
      {{- if kindIs "float64" $v }}
      {{- if ne $v (float64 (int64 $v)) }}
      {{- fail (printf "%s: a number must be whole; write any other as a text" $opt) }}
      {{- end }}
      {{- $v = int64 $v }}
      {{- end }}
      value: {{ $v | toString | quote }}
      {{- end }}
    {{- end }}
{{- end }}
