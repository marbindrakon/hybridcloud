namespace: aap
# shc: render the Namespace (set when replacing the aap chart, which owned it)
manageNamespace: false

name: sovereign-aap

operator:
  channel: stable-2.6
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: ansible-automation-platform-operator

controller:
  enabled: true
  replicas: 1
  # Extra AutomationController spec fields passed through as-is (e.g. task_extra_env, ee_extra_env).
  extraSpec: {}

eda:
  enabled: true
  replicas: 1
  rbac:
    enabled: true

hub:
  enabled: false

postgres:
  enabled: false
  name: aap-pgcluster
  instances: 2
  storage: 10Gi
  backupStorage: 10Gi
  # Backups of the database: a full backup and differential backups on a schedule (cron, UTC), and how many
  # full backups are kept. Older backups and the write-ahead log they need expire with each backup; the
  # backup volume must hold the kept backups and the log between them.
  backup:
    retentionFull: 2
    fullSchedule: "0 1 * * 0"
    differentialSchedule: "0 1 * * 1-6"
