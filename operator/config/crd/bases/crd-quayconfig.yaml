apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quayconfigs.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: hybridsovereign.redhat
  names:
    kind: QuayConfig
    listKind: QuayConfigList
    plural: quayconfigs
    singular: quayconfig
    shortNames:
      - qcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Quay URL
          type: string
          jsonPath: .status.quayUrl
        - name: OIDC
          type: string
          jsonPath: .status.oidcConfigured
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Summary
          type: string
          priority: 1
          jsonPath: .status.summary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            A registry connection: how the platform reaches a Red Hat Quay registry and signs
            tenants in to it with their platform identity. Platform-owned; created only in the
            integrations namespace sovereign-cloud-plugins.
          type: object
          properties:
            spec:
              description: The connection.
              type: object
              required:
                - secret
                - rbacConfig
              properties:
                secret:
                  type: string
                  description: >-
                    Name of a Secret in sovereign-cloud-plugins containing Quay
                    admin credentials (host, token).
                rbacConfig:
                  type: string
                  description: >-
                    Name of an RbacConfig in sovereign-cloud-plugins to use for
                    OIDC authentication configuration.
            status:
              description: Observed state, written by the platform. Do not edit.
              type: object
              properties:
                ready:
                  description: True when the platform finished creating or updating this object.
                  type: boolean
                quayUrl:
                  type: string
                  description: External URL of the Quay registry.
                oidcConfigured:
                  type: string
                  description: Whether OIDC is configured (true/false).
                keycloakClientId:
                  type: string
                  description: Client of the registry in the platform's sign-in directory.
                realm:
                  type: string
                  description: Sign-in directory realm the registry uses.
                status:
                  description: Short state word written by the platform's automation.
                  type: string
                deletionComplete:
                  description: True when everything this object created has been removed.
                  type: boolean
                lastReconciledAt:
                  description: When the platform last finished processing this object (RFC 3339).
                  type: string
                  format: date-time
                observedGeneration:
                  description: >-
                    The metadata.generation the status describes. When it is lower than
                    metadata.generation, the latest change has not been processed yet.
                  type: integer
                  format: int64
                message:
                  type: string
                  description: Human-readable status message.
                edaJobs:
                  description: >-
                    Recent automation runs for this object. Platform detail, for the platform team.
                  type: array
                  items:
                    description: One automation run for this object.
                    type: object
                    properties:
                      name:
                        description: Name of the automation job template.
                        type: string
                      url:
                        description: Link to the run in the automation controller.
                        type: string
                      status:
                        description: Result of the run.
                        type: string
                      timestamp:
                        description: When the run was recorded.
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  description: >-
                    Standard conditions. Ready says whether the object is usable; the others say
                    what the platform is waiting for or what failed.
                  type: array
                  items:
                    description: One condition.
                    type: object
                    properties:
                      type:
                        description: Condition type, for example Ready.
                        type: string
                      status:
                        description: True, False or Unknown.
                        type: string
                      lastTransitionTime:
                        description: When the condition last changed status.
                        type: string
                        format: date-time
                      reason:
                        description: One-word reason in CamelCase, stable enough to match on.
                        type: string
                      message:
                        description: What the reason means for this object, in plain words.
                        type: string
              x-kubernetes-preserve-unknown-fields: true
